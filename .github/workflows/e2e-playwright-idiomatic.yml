name: E2E Playwright idiomatic (bake-off)

# NEO-338 timing bake-off, second arm: the IDIOMATIC Playwright rewrite of the
# Maestro web E2E suite (apps/web/playwright-idiomatic/, config
# apps/web/playwright-idiomatic.config.ts), run against the SAME per-PR Vercel
# + Convex preview that e2e.yml uses. e2e-playwright.yml runs the line-by-line
# port; this file is the same pipeline pointed at the idiomatic suite.
# Standalone on purpose — NOT wired into pr-pipeline.yml, never a required
# check.
#
# Trigger:
#   git tag pwi-run-<n> <sha> && git push origin pwi-run-<n>
#     (a tag push runs this file from the tagged commit, so it works before
#     the workflow exists on main; workflow_dispatch only works once it does)
#   gh workflow run e2e-playwright-idiomatic.yml --ref <branch> [-f sha=<sha>] [-f preview_url=<url>]
#
# Pipeline (same ordering as e2e.yml):
#   setup  -> resolve the preview for the commit (GitHub Deployment record that
#             pr-pipeline.yml's web-preview job writes), wait for it, derive the
#             Convex deployment; then WAIT while any other workflow run is still
#             in flight on the PR branch (all suites share one Convex preview).
#   seed   -> mirror the same Convex env switches e2e.yml writes, scripted reset
#             (e2e-baseline.sh reset), then the setup track (--project=setup) as
#             worker 0.
#   shard  -> 8 x ubuntu-latest. Each shard runs the spec files
#             playwright-idiomatic/shard-plan.mjs assigns it (longest-first over
#             the per-spec timings), NOT Playwright's count-based --shard. Each
#             shard is one worker = one account (WORKER_INDEX = i-1 ->
#             TEST_EMAIL_<i-1>, the same mapping as Maestro's runner N), and
#             first runs the bootstrap project (project dependency => once per
#             shard).
#   report -> merge-reports (JSON + JUnit + HTML) and print wall-clock.
on:
  push:
    tags:
      - "pwi-run-*"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit whose PR preview to run against (default: the dispatched ref's HEAD)."
        required: false
        type: string
      preview_url:
        description: "Override: Vercel preview URL (*.vercel.app). Default: resolved from the commit's GitHub Deployment record."
        required: false
        type: string

# One idiomatic bake-off run at a time, repo-wide; a second one queues rather
# than cancelling the first. The setup job additionally waits out any other
# workflow run on the PR branch (pr-pipeline's Maestro E2E, the first port's
# e2e-playwright.yml), since every run on a branch shares that branch's
# Convex preview.
concurrency:
  group: e2e-playwright-idiomatic-bakeoff
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: read
  pull-requests: read

# No unstated-timeout override: the idiomatic suite's budget is the config's
# 7 s per action / expect, and longer waits are stated per call.

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      url: ${{ steps.preview.outputs.url }}
      convex_name: ${{ steps.convex.outputs.convex_name }}
      sha: ${{ steps.preview.outputs.sha }}
    steps:
      - name: Resolve the PR preview for this commit
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha || github.sha }}
          OVERRIDE: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          url="${OVERRIDE:-}"
          if [ -z "$url" ]; then
            # Same lookup preview-cleanup.yml uses: the newest Deployment record
            # on this SHA (pr-pipeline.yml's web-preview job writes it, as
            # github-actions[bot]) and its success status's environment_url.
            deployment_id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&per_page=100" \
              --jq '[.[] | select(.creator.login == "vercel[bot]" or .creator.login == "github-actions[bot]")] | sort_by(.created_at) | reverse | .[0].id // empty' || true)
            if [ -z "$deployment_id" ]; then
              echo "::error::No preview Deployment record for $SHA. Let pr-pipeline.yml build the preview for this commit first (open/push the PR), then re-tag."
              exit 1
            fi
            url=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
              --jq '[.[] | select(.state == "success")] | .[0] | (.environment_url // .target_url // empty)' || true)
          fi
          if [ -z "$url" ]; then
            echo "::error::Deployment record for $SHA has no successful status with a URL."
            exit 1
          fi
          # Host allowlist (as preview-cleanup.yml): only ever send the bypass
          # secret to a *.vercel.app host.
          host=$(printf '%s' "$url" | sed -E 's#^https?://([^/]+).*#\1#')
          case "$host" in
            *.vercel.app) : ;;
            *) echo "::error::Refusing non-Vercel preview host '$host'"; exit 1 ;;
          esac
          echo "Vercel preview URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Wait for preview to respond (with bypass)
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl -sS -o /dev/null -w "%{http_code}" -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PREVIEW_URL/" || echo 000)
            if [ "$status" = "200" ]; then echo "Preview ready after $attempt attempt(s)."; exit 0; fi
            echo "attempt $attempt: HTTP $status — retrying in 5s"; sleep 5
          done
          echo "Preview never returned 200."; exit 1

      # Copied from e2e.yml's setup job: the preview's index.html carries the
      # x-convex-url meta; the deployment slug is what e2e-baseline.sh and the
      # `convex env` calls target. Shape-asserted for the same reason.
      - name: Resolve preview Convex deployment
        id: convex
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          html=$(curl -sS -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PREVIEW_URL/")
          cloud=$(printf '%s' "$html" | grep -oE 'name="x-convex-url" content="[^"]*"' | grep -oE 'https://[a-z0-9-]+\.convex\.cloud' | head -1)
          if [ -z "$cloud" ]; then
            echo "::error::Could not resolve Convex URL from preview index.html (x-convex-url meta missing)"; exit 1
          fi
          name="${cloud#https://}"; name="${name%.convex.cloud}"
          if [ -z "$name" ] || [[ ! "$name" =~ ^[a-z-]+-[0-9]+$ ]]; then
            echo "::error::Could not derive a Convex preview deployment name from '$cloud'"; exit 1
          fi
          echo "Convex deployment: $name"
          echo "convex_name=$name" >> "$GITHUB_OUTPUT"

      - name: Wait until no other run is using this PR's preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.preview.outputs.sha }}
        run: |
          set -uo pipefail
          branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].head.ref // empty' 2>/dev/null || true)
          if [ -z "$branch" ]; then
            echo "::warning::No PR found for $SHA — cannot check for overlapping runs; continuing."
            exit 0
          fi
          echo "PR branch: $branch"
          for i in $(seq 1 150); do
            busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$branch&per_page=50" \
              --jq "[.workflow_runs[] | select(.status != \"completed\") | select(.id != $GITHUB_RUN_ID) | \"\(.name) #\(.id) (\(.status))\"] | join(\", \")" || echo "?")
            if [ -z "$busy" ]; then echo "Preview is free."; exit 0; fi
            echo "[$i] waiting on: $busy"; sleep 60
          done
          echo "::error::Another run held the preview for 150 min — giving up."; exit 1

  seed:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Same two Convex env writes e2e.yml's seed job makes before seeding
      # (NEO-287 pause mirror, NEO-289 enrichment fixtures), so both suites
      # seed against an identically configured preview.
      - name: Mirror NEONBINDER_PAUSED_PLATFORMS onto the Convex preview
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
          PAUSED_PLATFORMS: ${{ vars.NEONBINDER_PAUSED_PLATFORMS }}
        run: |
          set -euo pipefail
          if [ -n "${PAUSED_PLATFORMS:-}" ]; then
            npx --yes convex@1.39.1 env set NEONBINDER_PAUSED_PLATFORMS "$PAUSED_PLATFORMS" --deployment "$CONVEX_NAME"
          else
            npx --yes convex@1.39.1 env remove NEONBINDER_PAUSED_PLATFORMS --deployment "$CONVEX_NAME" \
              || echo "NEONBINDER_PAUSED_PLATFORMS was not set on this preview — nothing to remove."
          fi
          echo "PAUSED_PLATFORMS: ${PAUSED_PLATFORMS:-}"

      - name: Set NEONBINDER_ENRICHMENT_FIXTURES on the Convex preview
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: |
          set -euo pipefail
          npx --yes convex@1.39.1 env set NEONBINDER_ENRICHMENT_FIXTURES 1 --deployment "$CONVEX_NAME"
          got=$(npx --yes convex@1.39.1 env get NEONBINDER_ENRICHMENT_FIXTURES --deployment "$CONVEX_NAME")
          [ "$got" = "1" ] || { echo "::error::read-back mismatch: expected 1, got '$got'"; exit 1; }

      - name: Scripted reset (e2e-baseline.sh reset)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: ./e2e-baseline.sh reset

      - name: Setup track (worker 0)
        env:
          CI: "true"
          APP_URL: http://localhost:3000
          PREVIEW_URL: ${{ needs.setup.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WORKER_INDEX: "0"
          PAUSED_PLATFORMS: ${{ vars.NEONBINDER_PAUSED_PLATFORMS }}
          PWI_REPORT_DIR: playwright-idiomatic/report
        run: npx playwright test -c playwright-idiomatic.config.ts --project=setup

      - name: Upload seed report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pw-i-report-seed
          # Not under a dot-directory: upload-artifact skips hidden paths by
          # default, which is why run 1 uploaded nothing. report/ holds the blob,
          # results.json and junit.xml; results/ holds failure screenshots.
          path: |
            apps/web/playwright-idiomatic/report/
            apps/web/playwright-idiomatic/results/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  shard:
    needs: [setup, seed]
    if: always() && needs.seed.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # shard i -> worker i-1 -> TEST_EMAIL_<i-1>, as Maestro's runner N.
      # (Listed, not computed: Actions expressions have no arithmetic.)
      matrix:
        include:
          - { shard: 1, worker: 0 }
          - { shard: 2, worker: 1 }
          - { shard: 3, worker: 2 }
          - { shard: 4, worker: 3 }
          - { shard: 5, worker: 4 }
          - { shard: 6, worker: 5 }
          - { shard: 7, worker: 6 }
          - { shard: 8, worker: 7 }
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run shard ${{ matrix.shard }}/8
        id: run
        env:
          CI: "true"
          APP_URL: http://localhost:3000
          PREVIEW_URL: ${{ needs.setup.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WORKER_INDEX: ${{ matrix.worker }}
          PAUSED_PLATFORMS: ${{ vars.NEONBINDER_PAUSED_PLATFORMS }}
          PWI_REPORT_DIR: playwright-idiomatic/report
        # A red test must not stop the report upload; the report job reads the
        # verdict from the merged results.
        run: |
          set +e
          # Longest-first file plan instead of --shard (see shard-plan.mjs).
          files=$(node playwright-idiomatic/shard-plan.mjs 8 ${{ matrix.shard }})
          node playwright-idiomatic/shard-plan.mjs 8
          if [ -z "$files" ]; then
            # No file arguments would run the WHOLE suite, so run nothing.
            echo "Shard ${{ matrix.shard }}: no specs planned."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Shard ${{ matrix.shard }} runs:"; echo "$files"
          start=$(date +%s)
          # shellcheck disable=SC2086 # one path per line, no spaces
          npx playwright test -c playwright-idiomatic.config.ts --project=e2e $files
          code=$?
          echo "Shard ${{ matrix.shard }}: exit $code, $(( $(date +%s) - start ))s"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pw-i-report-shard-${{ matrix.shard }}
          # Not under a dot-directory: upload-artifact skips hidden paths by
          # default, which is why run 1 uploaded nothing. report/ holds the blob,
          # results.json and junit.xml; results/ holds failure screenshots.
          path: |
            apps/web/playwright-idiomatic/report/
            apps/web/playwright-idiomatic/results/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: [setup, seed, shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Download all reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pw-i-report-*
          path: apps/web/pwi-all

      - name: Merge reports
        run: |
          set -euo pipefail
          mkdir -p pwi-blobs pwi-merged
          find pwi-all -path '*/blob/*.zip' -exec cp {} pwi-blobs/ \;
          ls -la pwi-blobs
          PLAYWRIGHT_JSON_OUTPUT_FILE=pwi-merged/results.json \
          PLAYWRIGHT_JUNIT_OUTPUT_FILE=pwi-merged/junit.xml \
          PLAYWRIGHT_HTML_OUTPUT_DIR=pwi-merged/html \
          PLAYWRIGHT_HTML_OPEN=never \
            npx playwright merge-reports --reporter=json,junit,html pwi-blobs

      - name: Wall-clock and per-test timings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | [.name, (.started_at // ""), (.completed_at // "")] | @tsv' > jobs.tsv || true
          python3 - <<'PY' > summary.md
          import json, datetime, os
          def ts(s):
              return datetime.datetime.fromisoformat(s.replace("Z", "+00:00")) if s else None
          rows = [l.rstrip("\n").split("\t") for l in open("jobs.tsv") if l.strip()]
          jobs = {r[0]: (ts(r[1]), ts(r[2])) for r in rows if len(r) == 3}
          print("## Playwright IDIOMATIC bake-off — wall-clock\n")
          print("| job | seconds |\n|---|---|")
          for name, (s, e) in sorted(jobs.items(), key=lambda kv: kv[1][0] or datetime.datetime.max.replace(tzinfo=datetime.timezone.utc)):
              if s and e:
                  print(f"| {name} | {(e - s).total_seconds():.0f} |")
          seed = next((v for k, v in jobs.items() if k == "seed"), None)
          shards = [v for k, v in jobs.items() if k.startswith("shard") and v[0] and v[1]]
          if seed and seed[0] and shards:
              end = max(e for _, e in shards)
              print(f"\n**Seed start -> last shard done:** {(end - seed[0]).total_seconds():.0f}s")
              print(f"**Shard matrix (first start -> last done):** {(end - min(s for s, _ in shards)).total_seconds():.0f}s")
              print(f"**Slowest shard:** {max((e - s).total_seconds() for s, e in shards):.0f}s")
          try:
              data = json.load(open("pwi-merged/results.json"))
          except Exception as e:
              print(f"\n_No merged results: {e}_")
              raise SystemExit(0)
          tests = []
          def walk(suite, file=""):
              file = suite.get("file", file)
              for spec in suite.get("specs", []):
                  for t in spec.get("tests", []):
                      res = t.get("results", [])
                      dur = sum(r.get("duration", 0) for r in res) / 1000
                      status = res[-1].get("status") if res else "skipped"
                      tests.append((dur, file, spec.get("title"), status, t.get("projectName")))
              for s in suite.get("suites", []):
                  walk(s, file)
          for s in data.get("suites", []):
              walk(s)
          passed = sum(1 for t in tests if t[3] == "passed")
          failed = sum(1 for t in tests if t[3] in ("failed", "timedOut", "interrupted"))
          skipped = sum(1 for t in tests if t[3] == "skipped")
          total = sum(t[0] for t in tests)
          print(f"\n**{passed} passed · {failed} failed · {skipped} skipped** · {total:.0f} test-seconds\n")
          print("| status | seconds | project | file | test |\n|---|---|---|---|---|")
          for dur, file, title, status, proj in sorted(tests, key=lambda t: (t[3] == "passed", -t[0])):
              print(f"| {status} | {dur:.1f} | {proj} | {file} | {title} |")
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          head -30 summary.md

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pw-i-merged
          path: apps/web/pwi-merged/
          if-no-files-found: ignore
          retention-days: 14

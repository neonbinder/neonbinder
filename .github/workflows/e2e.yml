name: E2E Tests

# Reusable workflow. The single PR entry point is the top-level deployment
# pipeline (.github/workflows/pr-pipeline.yml), which — when the PR changes
# services/browser — first points the Convex preview's NEONBINDER_BROWSER_URL at
# the PR's OWN per-PR browser preview, and only THEN calls this. Keeping the
# browser-URL wiring in that pipeline (not here) is deliberate: it belongs to the
# overall deployment, not to E2E. workflow_dispatch is retained for manual /
# standalone runs (which exercise the canonical dev browser default).
on:
  workflow_call:
    inputs:
      preview_url:
        description: >-
          The PR's Vercel preview URL. Supplied by pr-pipeline.yml's
          `web-preview` job (NEO-162), which BUILDS the preview rather than
          waiting for Vercel's git integration to — the integration is disabled
          for every branch in apps/web/vercel.json. Required: without a preview
          there is no per-PR Convex deployment either, so there is nothing for
          this suite to run against.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      preview_url:
        description: >-
          Vercel preview URL to run against. Must be passed explicitly for a
          standalone run — with the git integration disabled there is no
          vercel[bot] deployment to discover. Get one with
          `vercel deploy --token=…` from the branch you want to exercise.
        required: true
        type: string
# Cancel any in-flight run on this PR/branch when a newer commit arrives.
# Two concurrent runs share the same Convex preview, browser service and test
# users — concurrent /login/bsc calls for the same BSC account reliably trigger
# a 503 on the slower request. One active run per branch.
# (On workflow_call the caller pr-pipeline owns concurrency; this still applies
# to direct workflow_dispatch runs.)
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: every job reads the repo at most. Only `report` widens, at
# job level, to publish the check run and the sticky comment. (A called
# workflow's token can never exceed the caller's; pr-pipeline.yml grants the
# superset.)
permissions:
  contents: read

# ─── The Playwright suite (NEO-341) ───────────────────────────────────────────
# main deploys to prod on every merge, so the FULL suite is the merge-blocking
# gate. Specs live in apps/web/playwright/tests/; config is
# apps/web/playwright.config.ts (projects: setup / bootstrap / e2e /
# e2e-mobile). Every spec runs on BOTH e2e (desktop) and e2e-mobile (a
# Chromium phone), except the few apps/web/playwright/project-scope.mjs
# leaves out of one project (NEO-389), in two passes, each on a FRESHLY SEEDED preview: ~15 specs
# are fresh-only or the sole writer of a real marketplace set and pass once
# per seed, so desktop and mobile cannot share one. `shard-plan.mjs
# --projects` names the projects for the gate.
#
#   setup        → adopt the PR's Vercel preview URL, wait for it (with the
#                  bypass header), derive the preview's Convex deployment name.
#   timings      → beside `seed`, best-effort (NEO-389): rebuild timings.json
#                  from the median of the last few green runs' reports and
#                  hand it to every shard; on any problem the shards plan
#                  from the committed file.
#   seed         → mirror the Convex env switches, scripted reset
#                  (e2e-baseline.sh), then the `setup` project (the global
#                  baseline) as worker 0.
#   shard-desktop→ 8 x ubuntu-latest, `--project=e2e`. Each shard runs the spec
#                  files that `shard-plan.mjs 8 <i> --project e2e` assigns it
#                  (longest-first over the per-spec desktop timings from
#                  `timings`, else playwright/timings.json), NOT Playwright's count-based
#                  --shard. One shard = one worker = one account (shard i ->
#                  WORKER_INDEX i-1 -> TEST_EMAIL_<i-1>); each shard runs the
#                  `bootstrap` project first via the project dependency.
#   seed-mobile  → needs shard-desktop: the reset wipes the shared preview, so
#                  mobile may only seed after EVERY desktop shard has
#                  finished. Runs even when desktop has reds (`!cancelled()`
#                  as long as setup + seed succeeded) so one run still
#                  collects the mobile results. Same Convex env switches,
#                  scripted reset and `setup` project as `seed`.
#   shard-mobile → 8 x ubuntu-latest, `--project=e2e-mobile`, planned on the
#                  mobile timings. `bootstrap` is a dependency of e2e-mobile
#                  too, so each mobile shard re-seeds its account after the
#                  reset.
#   e2e          → the single ruleset-gated verdict (job id and name are
#                  load-bearing: pr-pipeline.yml's `e2e` job and ci-gate read
#                  it). Merges every pass's report and is green iff all five
#                  upstream jobs succeeded AND every spec planned for a
#                  project produced a passing result on it, and both seeds
#                  passed.
#   report       → merged JUnit as ONE "Playwright E2E" check, per-test timing
#                  table in the step summary, sticky PR comment.
#
# Passes are strictly sequential inside a PR (the needs chain above): reset
# wipes the preview that the other pass runs against.
#
# Wall clock (estimate): setup ~1 min + seed ~4 min + longest desktop shard
# (~5 min: the longest spec is ~300 s, the rest pack under it at N >= 8) +
# seed-mobile ~4 min + longest mobile shard (~5 min) + gate/report ~2 min,
# about 20 min end to end, versus ~25-30 min with one seed and doubled
# shards. To scale: extend BOTH shard matrices AND the `8` passed to
# shard-plan.mjs (all in this file), and provision TEST_EMAIL_8.. — nothing
# else changes. Accounts 0-11 exist, so up to 12 shards per pass; the longest
# single spec bounds wall-clock at any N >= 7.
#
# Artifacts are failure screenshots + the Playwright report. Never traces: a
# trace records the network traffic, including Clerk testing tokens, and these
# artifacts are public (playwright.config.ts turns traces off in CI; do not turn
# them back on here). What IS published, knowingly (NEO-341 security review):
# the blob report (and the merged HTML) embeds every path attachment, so it
# carries each failure's error-context.md (an ARIA snapshot of the page, input
# values in plaintext) and the screenshots, plus the sanitised axe JSON.
# Accepted as the main red-run diagnostic: real marketplace passwords never
# reach the browser. Artifact names:
# pw-report-seed, pw-report-desktop-<i>, pw-report-seed-mobile,
# pw-report-mobile-<i>, pw-merged (+ convex-logs-* on the first shard of each
# pass and each seed).

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # sparse checkout of e2e-baseline.sh (prod-name guard)
    outputs:
      url: ${{ steps.vercel-preview.outputs.url }}
      convex_name: ${{ steps.convex.outputs.convex_name }}
    steps:
      # NEO-162: the preview is BUILT by pr-pipeline.yml's `web-preview` job and
      # handed straight down, so the URL cannot be missing or belong to a
      # different commit. Readiness is still this job's business: `vercel deploy`
      # returns once the deployment is READY, but Deployment Protection means the
      # runner still has to prove itself with the bypass header before the URL
      # answers 200.
      - name: Adopt the Vercel preview URL
        id: vercel-preview
        env:
          URL: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ]; then
            echo "::error::No preview_url supplied — the caller must build a preview first (pr-pipeline.yml's web-preview job)."
            exit 1
          fi
          # The bypass secret is only ever sent to this team's own preview
          # hosts. `*.vercel.app` is publicly registrable, so match the whole
          # URL, anchored, on the exact shape `vercel deploy` prints for this
          # project: https://neonbinder-<hash>-neon-binder.vercel.app
          # (no branch alias is passed down). A bash regex on the full string
          # (not a host split) so `?x=.vercel.app`, `#`, userinfo and
          # newlines cannot smuggle a different host past it.
          re='^https://neonbinder-[a-z0-9]+-neon-binder\.vercel\.app/?$'
          if [[ "$URL" == *$'\n'* ]] || [[ ! "$URL" =~ $re ]]; then
            echo "::error::Refusing preview URL that is not this team's Vercel deployment host"
            exit 1
          fi
          echo "Vercel preview URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Wait for preview to respond (with bypass)
        env:
          PREVIEW_URL: ${{ steps.vercel-preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "No preview URL discovered."
            exit 1
          fi
          echo "Polling $PREVIEW_URL with bypass header..."
          for attempt in $(seq 1 60); do
            status=$(curl -sS -o /dev/null -w "%{http_code}" -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PREVIEW_URL/" || echo 000)
            if [ "$status" = "200" ]; then
              echo "Preview ready after $attempt attempt(s)."
              exit 0
            fi
            echo "attempt $attempt: HTTP $status — retrying in 5s"
            sleep 5
          done
          echo "Preview never returned 200."
          exit 1

      # Only e2e-baseline.sh, for PROD_DEPLOYMENT_NAME (the prod guard below).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: apps/web/e2e-baseline.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve preview Convex deployment
        id: convex
        env:
          PREVIEW_URL: ${{ steps.vercel-preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          # The preview's index.html carries
          #   <meta name="x-convex-url" content="https://<deployment>.convex.cloud">
          # (Vite substitutes VITE_CONVEX_URL at build).
          html=$(curl -sS -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PREVIEW_URL/")
          cloud=$(printf '%s' "$html" | grep -oE 'name="x-convex-url" content="[^"]*"' | grep -oE 'https://[a-z0-9-]+\.convex\.cloud' | head -1)
          if [ -z "$cloud" ]; then
            echo "::error::Could not resolve Convex URL from preview index.html (x-convex-url meta missing)"
            exit 1
          fi
          # Same slug pr-pipeline.yml's "Resolve Convex preview deployment
          # name" step derives (NEO-214) — the `--deployment` selector the
          # `seed` job's scripted reset (e2e-baseline.sh) and every
          # `convex env` call pass as $CONVEX_NAME. Assert its shape before
          # writing it out: CONVEX_PREVIEW_DEPLOY_KEY is TEAM+PROJECT scoped
          # (not deployment-scoped), so a malformed/empty slug here wouldn't
          # fail closed on its own — the key would still authenticate fine
          # against a wrong or empty --deployment, and e2e-baseline.sh would
          # end up resetting some OTHER preview in the project rather than
          # erroring.
          name="${cloud#https://}"; name="${name%.convex.cloud}"
          if [ -z "$name" ] || [[ ! "$name" =~ ^[a-z-]+-[0-9]+$ ]]; then
            echo "::error::Could not derive a Convex preview deployment name from '$cloud'"
            exit 1
          fi
          # The slug shape above also matches production's. Refuse it: the
          # scripted reset and `convex env set` calls must never reach prod.
          # Source of truth is apps/web/e2e-baseline.sh.
          prod=$(sed -nE 's/^PROD_DEPLOYMENT_NAME="([^"]+)".*/\1/p' apps/web/e2e-baseline.sh | head -1)
          if [ -z "$prod" ]; then
            echo "::error::Could not read PROD_DEPLOYMENT_NAME from apps/web/e2e-baseline.sh"
            exit 1
          fi
          if [ "$name" = "$prod" ]; then
            echo "::error::Refusing: the preview resolves to the PRODUCTION Convex deployment"
            exit 1
          fi
          echo "Convex deployment: $name"
          echo "convex_name=$name" >> "$GITHUB_OUTPUT"

  timings:
    # NEO-389: the shard plan is only as good as timings.json, and a committed
    # file goes stale (it sat untouched from July to October while new specs
    # landed on guessed values, so one desktop shard took 105 s and another
    # 544 s). This job rewrites it, once per run, from the median of the last
    # few green PR Pipeline runs' merged reports, and hands that one file to
    # every shard, so all 16 plan from the same numbers. It runs beside
    # `seed`, off the critical path, and it never fails the suite: on any
    # problem it says so and the shards plan from the committed file.
    # Timings decide only which shard a spec runs in, never pass or fail.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # list recent PR Pipeline runs and download their pw-merged reports
    outputs:
      fresh: ${{ steps.upload.outcome == 'success' && 'true' || 'false' }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          sparse-checkout: |
            apps/web/.nvmrc
            apps/web/playwright
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        continue-on-error: true
        with:
          node-version-file: apps/web/.nvmrc

      - name: Median timings from the last green runs
        id: refresh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo "fresh=false" >> "$GITHUB_OUTPUT"
          # Up to 5 reports from the newest green runs of this repo's own
          # branches. A fork PR runs its own copy of the workflow, so its
          # artifacts are never read. A run that skipped E2E has no pw-merged
          # and is passed over; a failed run never counts, so a stalled run
          # cannot set the plan.
          files=()
          for rid in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pr-pipeline.yml/runs?status=success&per_page=30" \
                         --jq '.workflow_runs[] | select(.head_repository.full_name == env.GITHUB_REPOSITORY) | .id'); do
            d="$RUNNER_TEMP/pw-merged-$rid"
            if gh run download "$rid" -R "$GITHUB_REPOSITORY" -n pw-merged -D "$d" >/dev/null 2>&1 \
                && [ -f "$d/results.json" ]; then
              files+=("$d/results.json")
              [ "${#files[@]}" -ge 5 ] && break
            fi
          done
          if [ "${#files[@]}" -lt 3 ]; then
            echo "::notice::Only ${#files[@]} recent green report(s) found; the shards plan from the committed timings.json."
            exit 0
          fi
          if ! node playwright/shard-plan.mjs --from-results "${files[@]}"; then
            echo "::warning::Could not build timings from the recent reports; the shards plan from the committed timings.json."
            exit 0
          fi
          for p in e2e e2e-mobile; do
            if ! node playwright/shard-plan.mjs 8 --project "$p"; then
              echo "::warning::The new timings do not plan; the shards plan from the committed timings.json."
              exit 0
            fi
          done
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      - name: Hand the timings to the shards
        if: steps.refresh.outputs.fresh == 'true'
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shard-timings
          path: apps/web/playwright/timings.json
          if-no-files-found: error
          retention-days: 1

  seed:
    # Seed the shared per-PR Convex preview's global baseline before the
    # DESKTOP shard matrix fans out: scripted reset, then the `setup` project (Base +
    # Insert + Parallel in one in-place pass) as worker 0. The per-shard
    # `bootstrap` project resets only its own user, so it never wipes this
    # global baseline. By the time this runs, NEONBINDER_BROWSER_URL on the
    # Convex preview already points at the PR's own browser preview (when
    # services/browser changed): pr-pipeline.yml sets it and only THEN invokes
    # this workflow, so seeding marketplace creds here hits the PR's browser
    # service, not dev.
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      # NEO-330: wall-clock ms when the seed began; seed-mobile and the report
      # job pass it to their coverage calls as the `since` boundary.
      seed_since_ms: ${{ steps.seed_start.outputs.since_ms }}
    # NEO-330: id-token:write lets this job mint a WIF token to read the private
    # reference-seed bundle. A job-level block REPLACES the workflow-level one,
    # so the existing grant is repeated. Callers must grant id-token:write too
    # (a called workflow cannot exceed its caller): see pr-pipeline.yml `e2e:`.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # NEO-301: capture this PR preview's Convex logs for the seed job's own
      # lifetime. Preview log HISTORY is only ~15 minutes, and every attempt to
      # read it after a red run (PR #275, #277) was already gone — so capture
      # while it's live instead of trying to read it back afterwards.
      # `npx convex logs --jsonl` never exits on its own, so it's backgrounded
      # with `nohup … &` (a background process survives past the step that
      # started it, within the same job/VM — a standard GHA pattern) and
      # stopped explicitly in "Stop Convex log capture (seed)" below, which is
      # also where the filtering happens (see that step's comment for why the
      # raw stream is filtered before upload).
      #
      # Best-effort only: never fails the job. A missing CONVEX_DEPLOY_KEY
      # skips capture with a warning, not an error.
      - name: Start Convex log capture (seed)
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: |
          set -uo pipefail
          # Warm the npx cache sequentially so the backgrounded logs process and the
          # later npx convex commands never install into _npx concurrently.
          "$GITHUB_WORKSPACE/.github/scripts/convex-env-retry.sh" --version
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::warning::CONVEX_PREVIEW_DEPLOY_KEY not set — skipping Convex log capture for the seed job."
            exit 0
          fi
          RAW_LOG_FILE="${RUNNER_TEMP}/convex-logs-seed.raw.jsonl"
          rm -f "$RAW_LOG_FILE"
          nohup npx --yes convex@1.39.1 logs --deployment "$CONVEX_NAME" --jsonl \
            > "$RAW_LOG_FILE" 2>"${RUNNER_TEMP}/convex-logs-seed.stderr.log" &
          disown
          echo "CONVEX_LOGS_SEED_PID=$!" >> "$GITHUB_ENV"
          echo "Started Convex log capture for seed job (pid $!) -> $RAW_LOG_FILE"

      # NEO-287: mirror the `vars.NEONBINDER_PAUSED_PLATFORMS` repo variable onto
      # THIS PR's Convex preview before seeding, so the preview env and the
      # suite's PAUSED_PLATFORMS variable agree by construction. Without
      # this, a branch-reused preview keeps whatever the dashboard default was
      # last set to (NEO-184) — the exact drift that made per-run wiring
      # necessary for NEONBINDER_BROWSER_URL too. An empty variable means
      # nothing is paused: remove the var rather than set it to "", tolerating
      # "not set" so the very first run (before anyone has ever paused
      # anything) doesn't fail on a remove of a var that never existed.
      - name: Mirror NEONBINDER_PAUSED_PLATFORMS onto the Convex preview
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
          PAUSED_PLATFORMS: ${{ vars.NEONBINDER_PAUSED_PLATFORMS }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::CONVEX_PREVIEW_DEPLOY_KEY is not set. Add a Convex *preview* deploy key for the monorepo project as a repo secret."
            exit 1
          fi
          if [ -n "${PAUSED_PLATFORMS:-}" ]; then
            # Validate before writing anything to the preview: a typo'd or
            # unknown key here must fail loudly, never run the live suite
            # against SportLots while everyone believes the pause is in
            # effect (the exact silent-drift failure mode this whole
            # mechanism exists to avoid).
            IFS=',' read -ra _keys <<< "$PAUSED_PLATFORMS"
            for _key in "${_keys[@]}"; do
              _key="$(echo "$_key" | xargs)"  # trim whitespace
              [ -z "$_key" ] && continue
              _key_lower="$(echo "$_key" | tr '[:upper:]' '[:lower:]')"
              case "$_key_lower" in
                buysportscards|sportlots) ;;
                *)
                  echo "::error::vars.NEONBINDER_PAUSED_PLATFORMS contains an unknown platform key '$_key' (from '$PAUSED_PLATFORMS'). Valid keys: buysportscards, sportlots."
                  exit 1
                  ;;
              esac
            done
            "$GITHUB_WORKSPACE/.github/scripts/convex-env-retry.sh" env set NEONBINDER_PAUSED_PLATFORMS "$PAUSED_PLATFORMS" --deployment "$CONVEX_NAME"
          else
            "$GITHUB_WORKSPACE/.github/scripts/convex-env-retry.sh" env remove NEONBINDER_PAUSED_PLATFORMS --deployment "$CONVEX_NAME" \
              || echo "NEONBINDER_PAUSED_PLATFORMS was not set on this preview — nothing to remove."
          fi
          got=$(npx --yes convex@1.39.1 env get NEONBINDER_PAUSED_PLATFORMS --deployment "$CONVEX_NAME" || true)
          echo "Convex preview NEONBINDER_PAUSED_PLATFORMS = '${got}'"
          {
            echo "### SportLots/marketplace pause (NEO-287)";
            echo "- \`vars.NEONBINDER_PAUSED_PLATFORMS\` = \`${PAUSED_PLATFORMS:-<empty>}\`";
            echo "- Convex preview \`NEONBINDER_PAUSED_PLATFORMS\` = \`${got:-<unset>}\`";
          } >> "$GITHUB_STEP_SUMMARY"

      # NEO-289: unconditionally set the enrichment-fixtures switch on THIS PR's
      # Convex preview before seeding, for the same NEO-184 reason as the
      # NEONBINDER_PAUSED_PLATFORMS mirror above — a branch-reused preview keeps
      # whatever a dashboard default was last set to, so the flag must be written
      # every run rather than assumed. The switch (`NEONBINDER_ENRICHMENT_FIXTURES`)
      # is honoured by the lookup boundary only when `TESTING_RESET_SECRET` is also
      # set (prod has neither, so a stray value there is inert); on a preview it
      # makes the seed answer Wikidata/ESPN lookups for the 2024 Topps Chrome name
      # set from the committed recording instead of a live round-trip, so the seed
      # no longer depends on query.wikidata.org's health. Read back like the
      # NEONBINDER_BROWSER_URL wiring in pr-pipeline.yml — a silent no-op here would
      # otherwise pass and just seed slow/flaky instead of failing loudly.
      - name: Set NEONBINDER_ENRICHMENT_FIXTURES on the Convex preview
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::CONVEX_PREVIEW_DEPLOY_KEY is not set. Add a Convex *preview* deploy key for the monorepo project as a repo secret."
            exit 1
          fi
          "$GITHUB_WORKSPACE/.github/scripts/convex-env-retry.sh" env set NEONBINDER_ENRICHMENT_FIXTURES 1 --deployment "$CONVEX_NAME"
          got=$(npx --yes convex@1.39.1 env get NEONBINDER_ENRICHMENT_FIXTURES --deployment "$CONVEX_NAME")
          echo "Convex preview NEONBINDER_ENRICHMENT_FIXTURES = $got"
          if [ "$got" != "1" ]; then
            echo "::error::read-back mismatch: expected 1, got '$got'"; exit 1
          fi
          {
            echo "### Enrichment fixtures (NEO-289)";
            echo "- Convex preview \`NEONBINDER_ENRICHMENT_FIXTURES\` = \`${got}\`";
          } >> "$GITHUB_STEP_SUMMARY"

      # NEO-330 (D3/D7): every pass's seed loads a private reference-seed bundle
      # (a production-shaped catalogue of teams, players, leagues and
      # franchises) from a DEV-project bucket. Fail loudly when any input is
      # missing (fork PRs get no secrets): never skip silently, a skipped load
      # would seed nothing and the specs would meet a catalogue-less preview.
      - name: Require reference-seed inputs
        env:
          REFERENCE_SEED_URI: ${{ vars.NEONBINDER_REFERENCE_SEED_URI }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT_DEPLOYER_DEV }}
        run: |
          if [ -z "${REFERENCE_SEED_URI:-}" ]; then
            echo "::error::Repo variable NEONBINDER_REFERENCE_SEED_URI is not set. The E2E seed needs the reference-seed bundle location."
            exit 1
          fi
          if [ -z "${WIF_PROVIDER:-}" ] || [ -z "${WIF_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::GCP_WIF_PROVIDER_DEV / GCP_SERVICE_ACCOUNT_DEPLOYER_DEV are not available to this run (fork PR or missing secrets). The E2E seed cannot fetch the reference-seed bundle."
            exit 1
          fi
          # vars.* are not masked and gcloud echoes the URI: mask the whole URI
          # and the bucket name so neither reaches the public log.
          echo "::add-mask::${REFERENCE_SEED_URI}"
          bucket="${REFERENCE_SEED_URI#gs://}"
          echo "::add-mask::${bucket%%/*}"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Download reference-seed bundle
        env:
          REFERENCE_SEED_URI: ${{ vars.NEONBINDER_REFERENCE_SEED_URI }}
        run: |
          start=$(date +%s)
          gcloud storage cp --no-user-output-enabled "$REFERENCE_SEED_URI" "$RUNNER_TEMP/reference-bundle.zip"
          secs=$(( $(date +%s) - start ))
          # Drop the GCP credentials so later steps (npx installs, PR scripts)
          # cannot use them: revoke gcloud's stored account, delete the WIF
          # credential file, and blank every variable the pinned auth action
          # exports (CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE,
          # GOOGLE_APPLICATION_CREDENTIALS, GOOGLE_GHA_CREDS_PATH and the
          # project vars) plus the account setup-gcloud may set.
          gcloud auth revoke --all --quiet || true
          rm -f "${GOOGLE_GHA_CREDS_PATH:-}"
          rm -rf "${CLOUDSDK_CONFIG:-$HOME/.config/gcloud}"
          for v in CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE GOOGLE_APPLICATION_CREDENTIALS \
                   GOOGLE_GHA_CREDS_PATH CLOUDSDK_CORE_ACCOUNT CLOUDSDK_CORE_PROJECT \
                   CLOUDSDK_PROJECT GCLOUD_PROJECT GCP_PROJECT GOOGLE_CLOUD_PROJECT; do
            echo "$v=" >> "$GITHUB_ENV"
          done
          echo "NB_REFERENCE_BUNDLE=$RUNNER_TEMP/reference-bundle.zip" >> "$GITHUB_ENV"
          echo "NB_REFERENCE_SEED_SUMMARY=$RUNNER_TEMP/reference-seed-summary.txt" >> "$GITHUB_ENV"
          {
            echo "### Reference seed (NEO-330), desktop pass"
            echo "- Bundle download: ${secs}s"
          } >> "$GITHUB_STEP_SUMMARY"

      # NEO-330: the seed's start time in ms, for the fixture coverage calls.
      # `since` bounds which rows count as "looked up by this run"; passing it
      # explicitly beats the backend's first-year-row inference.
      - name: Record seed start time
        id: seed_start
        run: |
          since_ms=$(date +%s%3N)
          echo "NB_SEED_SINCE_MS=${since_ms}" >> "$GITHUB_ENV"
          echo "since_ms=${since_ms}" >> "$GITHUB_OUTPUT"

      # NEO-214: the scripted reset is the single writer of the global baseline
      # (shared with local use via `npm run test:e2e:seed`). It needs a PREVIEW
      # deploy key + the deployment slug to reach THIS PR's Convex preview
      # rather than the CLI's local default. CONVEX_PREVIEW_DEPLOY_KEY is
      # TEAM+PROJECT scoped, not deployment-scoped (a wrong CONVEX_NAME would
      # reach ANOTHER PR's preview in this project, not dev/prod) — hence the
      # shape assertion on `name` in the `setup` job above. Once --deployment is
      # passed the CLI selects the target BY THAT NAME and the key only
      # authenticates the call, so a right key + wrong name is exactly the
      # "reach another PR's preview" failure mode, not a fail-closed one.
      #
      # NEO-330: with NB_REFERENCE_BUNDLE exported by the download step,
      # e2e-seed-reset.sh checks the bundle, resets everything EXCEPT the
      # eight reference tables, then loads the bundle (`convex import
      # --replace`, which is the clear for those tables). The reset alone does
      # not empty them, so each pass must load again; the sequence is
      # idempotent on a preview the earlier pass wrote to.
      - name: Scripted reset + reference catalogue (e2e-seed-reset.sh)
        id: seed_reset
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
          # NEO-392: an import past this marks a degraded preview (see
          # e2e-seed-reset.sh); the next steps delete it so a re-run
          # (recreate-degraded-preview.yml) gets a fresh one.
          NB_SEED_MAX_IMPORT_S: "300"
        run: |
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::CONVEX_PREVIEW_DEPLOY_KEY is not set. Add a Convex *preview* deploy key for the monorepo project as a repo secret."
            exit 1
          fi
          reset_start=$(date +%s)
          rc=0
          ./e2e-seed-reset.sh || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "degraded=true" >> "$GITHUB_OUTPUT"
            echo "::error::Convex preview $CONVEX_NAME is degraded: the reference import ran past ${NB_SEED_MAX_IMPORT_S}s (desktop pass). No specs ran, so this says nothing about the PR. The next step deletes the preview, and the whole workflow re-runs on its own with a fresh one (NEO-392)."
            echo "- Preview degraded: reference import past ${NB_SEED_MAX_IMPORT_S}s; deleting it for a fresh one (NEO-392)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          # Plain "label: value" lines (counts, table names, seconds only)
          # written by the script; nothing is parsed from its log output.
          {
            echo "- Reset + reference import wall-clock: $(( $(date +%s) - reset_start ))s"
            if [ -s "${NB_REFERENCE_SEED_SUMMARY:-}" ]; then
              sed 's/^/- /' "$NB_REFERENCE_SEED_SUMMARY"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Its own step so the team-scoped token (which can delete any
      # deployment) never shares an environment with npx or PR scripts:
      # this runs only the guarded delete script (NEO-392 security audit).
      - name: Delete the degraded preview (NEO-392)
        id: delete_degraded
        if: failure() && steps.seed_reset.outputs.degraded == 'true'
        env:
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
        run: "$GITHUB_WORKSPACE/.github/scripts/delete-degraded-convex-preview.sh"

      - name: Mark the preview degraded (NEO-392)
        if: failure() && steps.delete_degraded.outputs.deleted == 'true'
        env:
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: printf '%s\n' "$CONVEX_NAME" > "$RUNNER_TEMP/preview-degraded.txt"

      - name: Upload the degraded marker (NEO-392)
        if: failure() && steps.delete_degraded.outputs.deleted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-degraded-desktop
          path: ${{ runner.temp }}/preview-degraded.txt
          retention-days: 14

      # The `setup` project answers one New Team step per team the first sync
      # stages (NEO-236, ~13 min on CI), so the project carries its own 25 min
      # timeout; this job's budget covers install + reset + that.
      - name: Seed global baseline (setup project, worker 0)
        env:
          CI: "true"
          APP_URL: http://localhost:3000
          PREVIEW_URL: ${{ needs.setup.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WORKER_INDEX: "0"
          PAUSED_PLATFORMS: ${{ vars.NEONBINDER_PAUSED_PLATFORMS }}
          PW_REPORT_DIR: playwright/report
        run: |
          setup_start=$(date +%s)
          npx playwright test --project=setup
          echo "- Setup project wall-clock: $(( $(date +%s) - setup_start ))s" >> "$GITHUB_STEP_SUMMARY"

      # NEO-289: report how much of the seed's name set the fixture recording
      # actually covered, without blocking the run on it. `continue-on-error`
      # AND tolerating a missing function are both deliberate: this can run
      # before the Convex-side change (enrichmentFixtures.ts) has landed on
      # this preview, and coverage drifting (a fixture set going stale) is an
      # operator signal, not a CI failure — the seed itself already fell back
      # to live lookups for anything uncovered, so the suite is correct either
      # way. The coverage action is read-only and internal (reachable only
      # with the deploy key), so it takes just the `confirm` literal — NOT the
      # `ALLOW_ENRICHMENT_FIXTURE_CAPTURE` deployment env var that arms the
      # capture action: a shell env var on `convex run` never reaches the
      # Convex runtime, so arming coverage that way would fail every run and
      # this step's tolerance would hide it forever. No `--identity` is
      # passed, matching every other `convex run` this job makes.
      - name: Enrichment fixture coverage
        working-directory: apps/web
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
          COVERAGE_LABEL: "after the seed"
          COVERAGE_SINCE_MS: "${{ env.NB_SEED_SINCE_MS }}"
        run: |
          set -uo pipefail
          if [ -z "${CONVEX_NAME:-}" ]; then
            echo "::warning::No Convex preview name from setup — skipping enrichment fixture coverage (${COVERAGE_LABEL})."
            exit 0
          fi
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::warning::CONVEX_PREVIEW_DEPLOY_KEY is not set — skipping enrichment fixture coverage (${COVERAGE_LABEL})."
            exit 0
          fi
          "$GITHUB_WORKSPACE/.github/scripts/enrichment-fixture-coverage.sh"

      # NEO-301: stop the background capture and filter before upload.
      # Filtered, not raw: keep only ERROR/WARN log lines and our structured
      # `{"msg": …}` JSON lines (the house convention — see
      # convex/observability.ts and the adapters), dropping plain INFO/LOG
      # chatter. That chatter can carry a Convex userId (an opaque internal
      # id, e.g. the `player_created`/`team_created`/`marketplace_token_paused`
      # lines) which has no diagnostic value for a red E2E run and is
      # unnecessary to keep in an artifact anyone logged into GitHub can
      # download on this public repo. A grep of apps/web/convex found no raw
      # emails, passwords, tokens or secrets ever reach console.* —
      # credentials.ts and machineAuth.ts are deliberately written to log only
      # status codes and public ids (see machineAuth.ts's own comment on this)
      # — so the filter is belt-and-suspenders for the one thing that does
      # appear (userId) and for anything a future console.log adds. `jq` is
      # preinstalled on ubuntu-latest.
      #
      # Never fails the job: `|| true` throughout, `if: always()`.
      - name: Stop Convex log capture (seed)
        if: always()
        working-directory: apps/web
        run: |
          set -uo pipefail
          if [ -n "${CONVEX_LOGS_SEED_PID:-}" ]; then
            kill "${CONVEX_LOGS_SEED_PID}" 2>/dev/null || true
            wait "${CONVEX_LOGS_SEED_PID}" 2>/dev/null || true
          fi
          RAW_LOG_FILE="${RUNNER_TEMP}/convex-logs-seed.raw.jsonl"
          OUT_FILE="convex-logs-seed.jsonl"
          if [ -s "$RAW_LOG_FILE" ]; then
            jq -c '
                ((.logLines // [])
                | map(select(
                    .level == "ERROR" or .level == "WARN"
                    or ((.messages // []) | join(" ") | test("\"msg\""))
                  )))
                as $keep
                | if .kind == "Completion" then
                    # NEO-392: every completion keeps its timing, queue delay,
                    # read/write sizes and OCC info (no user data), so a stall
                    # shows which function was slow, queued or retried.
                    {identifier, udfType, timestamp, executionTimestamp,
                     executionTime, userExecutionTime, requestId, executionId,
                     parentExecutionId, cachedResult, willRetry, occInfo, kind, error,
                     readDocs: .usageStats.databaseReadDocuments,
                     readBytes: .usageStats.databaseReadBytes,
                     writeDocs: .usageStats.databaseWriteDocuments,
                     logLines: $keep}
                  else
                    select((.error != null) or ($keep | length) > 0)
                    | {identifier, udfType, timestamp, requestId, executionId, kind, error, logLines: $keep}
                  end
              ' "$RAW_LOG_FILE" > "$OUT_FILE" 2>"${RUNNER_TEMP}/convex-logs-seed-jq.stderr.log" || true
            gzip -f "$OUT_FILE" || true
            echo "Wrote $(du -h "${OUT_FILE}.gz" 2>/dev/null | cut -f1) of filtered Convex logs for the seed job."
          else
            echo "No Convex logs captured for the seed job (capture may have been skipped or produced nothing)."
          fi

      - name: Upload Convex log capture (seed)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: convex-logs-seed
          path: apps/web/convex-logs-seed.jsonl.gz
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload seed report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pw-report-seed
          # Not under a dot-directory: upload-artifact skips hidden paths by
          # default. report/ holds the blob, results.json and junit.xml;
          # results/ holds failure screenshots. The blob in report/ also embeds
          # error-context ARIA snapshots (accepted, see the header). No traces.
          path: |
            apps/web/playwright/report/
            apps/web/playwright/results/**/*.png
          if-no-files-found: ignore
          retention-days: 14


  shard-desktop:
    # DESKTOP pass: 8 identical shards, each its own VM = ONE Chrome (web can't parallelize
    # within a VM — the NEO-46 contention). shard i -> global worker i-1 ->
    # TEST_EMAIL_<i-1> (0..7 provisioned). A test failure fails the shard, but
    # `fail-fast: false` lets every other shard finish and report; the `e2e`
    # gate below reads the merged results for the verdict.
    needs: [setup, seed, timings]
    # Explicit condition: `timings` is best-effort and must never hold the
    # pass back (NEO-389), so only setup and seed decide.
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.seed.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Listed, not computed: Actions expressions have no arithmetic.
      matrix:
        include:
          - { shard: 1, worker: 0 }
          - { shard: 2, worker: 1 }
          - { shard: 3, worker: 2 }
          - { shard: 4, worker: 3 }
          - { shard: 5, worker: 4 }
          - { shard: 6, worker: 5 }
          - { shard: 7, worker: 6 }
          - { shard: 8, worker: 7 }
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NEO-389: plan from the run's fresh timings (see the `timings` job).
      # Every shard of both passes downloads the same file or none, so the
      # plans always agree. A failed download fails the shard rather than let
      # it plan from different numbers than the others. Downloaded outside the
      # tree and copied by name, so the artifact can only ever replace
      # timings.json.
      - name: Download this run's shard timings
        if: needs.timings.outputs.fresh == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shard-timings
          path: ${{ runner.temp }}/shard-timings
      - name: Use this run's shard timings
        if: needs.timings.outputs.fresh == 'true'
        run: cp "$RUNNER_TEMP/shard-timings/timings.json" playwright/timings.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # NEO-301: the seed job ends before the shard matrix starts, so it can
      # only cover its own window (captured above) — nothing spans the WHOLE
      # E2E run. Every shard streams the preview's logs for its own lifetime
      # (NEO-391): shards end at different times, so shard 1 alone missed most
      # of each pass. The streams overlap; dedupe on requestId when reading
      # them. Measured cost is nil (shard 1, which always captured, was
      # routinely the fastest shard). See "Stop Convex log capture" below for
      # the filtering rationale. Best-effort only: never fails the job.
      - name: Start Convex log capture (desktop shard ${{ matrix.shard }})
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: |
          set -uo pipefail
          # Warm the npx cache sequentially so the backgrounded logs process and the
          # later npx convex commands never install into _npx concurrently.
          "$GITHUB_WORKSPACE/.github/scripts/convex-env-retry.sh" --version
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::warning::CONVEX_PREVIEW_DEPLOY_KEY not set — skipping Convex log capture for desktop shard ${{ matrix.shard }}."
            exit 0
          fi
          RAW_LOG_FILE="${RUNNER_TEMP}/convex-logs-desktop-${{ matrix.shard }}.raw.jsonl"
          rm -f "$RAW_LOG_FILE"
          nohup npx --yes convex@1.39.1 logs --deployment "$CONVEX_NAME" --jsonl \
            > "$RAW_LOG_FILE" 2>"${RUNNER_TEMP}/convex-logs-desktop-${{ matrix.shard }}.stderr.log" &
          disown
          echo "CONVEX_LOGS_DESKTOP1_PID=$!" >> "$GITHUB_ENV"
          echo "Started Convex log capture for desktop shard ${{ matrix.shard }} (pid $!) -> $RAW_LOG_FILE"

      # NEO-407: a latency probe beside the shard. It calls a one-document
      # query every second (and a no-write mutation every fourth) on this pass's
      # preview and records each answer's latency, so a stall in the preview
      # shows as a run of slow probe calls with its own timestamps, apart from
      # whatever the specs were doing. Needs only the deployment URL (public
      # functions, no key). Best-effort only: never fails the job.
      - name: Start Convex latency probe (desktop shard ${{ matrix.shard }})
        working-directory: apps/web
        env:
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: |
          set -uo pipefail
          if [ -z "${CONVEX_NAME:-}" ]; then
            echo "::warning::No preview deployment name — skipping the latency probe."
            exit 0
          fi
          OUT="${RUNNER_TEMP}/convex-probe-desktop-${{ matrix.shard }}.jsonl"
          rm -f "$OUT"
          nohup node scripts/convex-probe.mjs --url "https://${CONVEX_NAME}.convex.cloud" --out "$OUT" \
            >"${RUNNER_TEMP}/convex-probe-desktop.stdout.log" 2>&1 &
          disown
          echo "CONVEX_PROBE_PID=$!" >> "$GITHUB_ENV"
          echo "Started the latency probe (pid $!) -> $OUT"

      - name: Run desktop shard ${{ matrix.shard }}/8
        env:
          CI: "true"
          APP_URL: http://localhost:3000
          PREVIEW_URL: ${{ needs.setup.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WORKER_INDEX: ${{ matrix.worker }}
          PAUSED_PLATFORMS: ${{ vars.NEONBINDER_PAUSED_PLATFORMS }}
          PW_REPORT_DIR: playwright/report
          SHARD: ${{ matrix.shard }}
          PROJECT: e2e
        run: |
          set -euo pipefail
          # Longest-first file plan instead of --shard (see shard-plan.mjs),
          # on this pass's project timings.
          files=$(node playwright/shard-plan.mjs 8 "$SHARD" --project "$PROJECT")
          node playwright/shard-plan.mjs 8 --project "$PROJECT"   # per-shard totals, to stderr
          if [ -z "$files" ]; then
            # `playwright test` with no file arguments runs the WHOLE suite, and
            # an empty plan means the planner and the spec tree disagree. Either
            # way, refuse rather than pass a shard that ran nothing.
            echo "::error::Shard ${SHARD}/8 ($PROJECT) has no specs planned."
            exit 1
          fi
          echo "Shard ${SHARD} runs --project=$PROJECT:"; echo "$files"
          start=$(date +%s)
          # `bootstrap` runs first via the project dependency (this pass's
          # account re-seed, after the pass's reset).
          # shellcheck disable=SC2086 # one path per line, no spaces
          npx playwright test "--project=$PROJECT" $files || code=$?
          echo "Shard ${SHARD} ($PROJECT): exit ${code:-0}, $(( $(date +%s) - start ))s"
          exit "${code:-0}"

      # NEO-301: stop the background capture and filter before upload — same
      # filter and same reasoning as "Stop Convex log capture (seed)" above
      # (keep ERROR/WARN + our structured `{"msg": …}` lines, drop plain
      # INFO/LOG chatter that can carry a Convex userId). Never fails the job.
      - name: Stop Convex log capture (desktop shard ${{ matrix.shard }})
        if: always()
        working-directory: apps/web
        run: |
          set -uo pipefail
          if [ -n "${CONVEX_LOGS_DESKTOP1_PID:-}" ]; then
            kill "${CONVEX_LOGS_DESKTOP1_PID}" 2>/dev/null || true
            wait "${CONVEX_LOGS_DESKTOP1_PID}" 2>/dev/null || true
          fi
          RAW_LOG_FILE="${RUNNER_TEMP}/convex-logs-desktop-${{ matrix.shard }}.raw.jsonl"
          OUT_FILE="convex-logs-desktop-${{ matrix.shard }}.jsonl"
          if [ -s "$RAW_LOG_FILE" ]; then
            jq -c '
                ((.logLines // [])
                | map(select(
                    .level == "ERROR" or .level == "WARN"
                    or ((.messages // []) | join(" ") | test("\"msg\""))
                  )))
                as $keep
                | if .kind == "Completion" then
                    # NEO-392: every completion keeps its timing, queue delay,
                    # read/write sizes and OCC info (no user data), so a stall
                    # shows which function was slow, queued or retried.
                    {identifier, udfType, timestamp, executionTimestamp,
                     executionTime, userExecutionTime, requestId, executionId,
                     parentExecutionId, cachedResult, willRetry, occInfo, kind, error,
                     readDocs: .usageStats.databaseReadDocuments,
                     readBytes: .usageStats.databaseReadBytes,
                     writeDocs: .usageStats.databaseWriteDocuments,
                     logLines: $keep}
                  else
                    select((.error != null) or ($keep | length) > 0)
                    | {identifier, udfType, timestamp, requestId, executionId, kind, error, logLines: $keep}
                  end
              ' "$RAW_LOG_FILE" > "$OUT_FILE" 2>"${RUNNER_TEMP}/convex-logs-desktop-${{ matrix.shard }}-jq.stderr.log" || true
            gzip -f "$OUT_FILE" || true
            echo "Wrote $(du -h "${OUT_FILE}.gz" 2>/dev/null | cut -f1) of filtered Convex logs for desktop shard ${{ matrix.shard }}."
          else
            echo "No Convex logs captured for desktop shard ${{ matrix.shard }} (capture may have been skipped or produced nothing)."
          fi

      - name: Stop Convex latency probe (desktop shard ${{ matrix.shard }})
        if: always()
        working-directory: apps/web
        run: |
          set -uo pipefail
          if [ -n "${CONVEX_PROBE_PID:-}" ]; then
            kill "${CONVEX_PROBE_PID}" 2>/dev/null || true
            sleep 1
          fi
          OUT="${RUNNER_TEMP}/convex-probe-desktop-${{ matrix.shard }}.jsonl"
          if [ -s "$OUT" ]; then
            node scripts/convex-probe.mjs --summary "$OUT" --stall-ms 2000 || true
            gzip -c "$OUT" > "convex-probe-desktop-${{ matrix.shard }}.jsonl.gz" || true
          else
            echo "No latency probe data for this shard."
          fi

      - name: Upload Convex latency probe (desktop shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: convex-probe-desktop-${{ matrix.shard }}
          path: apps/web/convex-probe-desktop-${{ matrix.shard }}.jsonl.gz
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Convex log capture (desktop shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: convex-logs-desktop-${{ matrix.shard }}
          path: apps/web/convex-logs-desktop-${{ matrix.shard }}.jsonl.gz
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pw-report-desktop-${{ matrix.shard }}
          # Same paths and the same published-content rule as the seed report.
          path: |
            apps/web/playwright/report/
            apps/web/playwright/results/**/*.png
          if-no-files-found: ignore
          retention-days: 14


  seed-mobile:
    # The second pass's seed: the same Convex env switches, scripted reset and
    # `setup` project as `seed` (see its comments), run again so every spec
    # starts the mobile pass on a fresh baseline. Strictly after every
    # desktop shard (the reset wipes the shared preview), and independent of
    # their verdict so a red desktop pass still yields mobile results.
    needs: [setup, seed, shard-desktop]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.seed.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      # NEO-330: wall-clock ms when this pass's seed began; the report job uses
      # it as the `since` boundary for the mobile shards' coverage call.
      seed_since_ms: ${{ steps.seed_start.outputs.since_ms }}
    # NEO-330: id-token:write for the WIF read of the reference-seed bundle
    # (see the `seed` job). Job-level replaces the workflow-level block.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start Convex log capture (seed-mobile)
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: |
          set -uo pipefail
          # Warm the npx cache sequentially so the backgrounded logs process and the
          # later npx convex commands never install into _npx concurrently.
          "$GITHUB_WORKSPACE/.github/scripts/convex-env-retry.sh" --version
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::warning::CONVEX_PREVIEW_DEPLOY_KEY not set — skipping Convex log capture for the seed-mobile job."
            exit 0
          fi
          RAW_LOG_FILE="${RUNNER_TEMP}/convex-logs-seed-mobile.raw.jsonl"
          rm -f "$RAW_LOG_FILE"
          nohup npx --yes convex@1.39.1 logs --deployment "$CONVEX_NAME" --jsonl \
            > "$RAW_LOG_FILE" 2>"${RUNNER_TEMP}/convex-logs-seed-mobile.stderr.log" &
          disown
          echo "CONVEX_LOGS_SEED_MOBILE_PID=$!" >> "$GITHUB_ENV"
          echo "Started Convex log capture for seed job (pid $!) -> $RAW_LOG_FILE"

      - name: Mirror NEONBINDER_PAUSED_PLATFORMS onto the Convex preview
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
          PAUSED_PLATFORMS: ${{ vars.NEONBINDER_PAUSED_PLATFORMS }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::CONVEX_PREVIEW_DEPLOY_KEY is not set. Add a Convex *preview* deploy key for the monorepo project as a repo secret."
            exit 1
          fi
          if [ -n "${PAUSED_PLATFORMS:-}" ]; then
            # Validate before writing anything to the preview: a typo'd or
            # unknown key here must fail loudly, never run the live suite
            # against SportLots while everyone believes the pause is in
            # effect (the exact silent-drift failure mode this whole
            # mechanism exists to avoid).
            IFS=',' read -ra _keys <<< "$PAUSED_PLATFORMS"
            for _key in "${_keys[@]}"; do
              _key="$(echo "$_key" | xargs)"  # trim whitespace
              [ -z "$_key" ] && continue
              _key_lower="$(echo "$_key" | tr '[:upper:]' '[:lower:]')"
              case "$_key_lower" in
                buysportscards|sportlots) ;;
                *)
                  echo "::error::vars.NEONBINDER_PAUSED_PLATFORMS contains an unknown platform key '$_key' (from '$PAUSED_PLATFORMS'). Valid keys: buysportscards, sportlots."
                  exit 1
                  ;;
              esac
            done
            "$GITHUB_WORKSPACE/.github/scripts/convex-env-retry.sh" env set NEONBINDER_PAUSED_PLATFORMS "$PAUSED_PLATFORMS" --deployment "$CONVEX_NAME"
          else
            "$GITHUB_WORKSPACE/.github/scripts/convex-env-retry.sh" env remove NEONBINDER_PAUSED_PLATFORMS --deployment "$CONVEX_NAME" \
              || echo "NEONBINDER_PAUSED_PLATFORMS was not set on this preview — nothing to remove."
          fi
          got=$(npx --yes convex@1.39.1 env get NEONBINDER_PAUSED_PLATFORMS --deployment "$CONVEX_NAME" || true)
          echo "Convex preview NEONBINDER_PAUSED_PLATFORMS = '${got}'"
          {
            echo "### SportLots/marketplace pause (NEO-287)";
            echo "- \`vars.NEONBINDER_PAUSED_PLATFORMS\` = \`${PAUSED_PLATFORMS:-<empty>}\`";
            echo "- Convex preview \`NEONBINDER_PAUSED_PLATFORMS\` = \`${got:-<unset>}\`";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set NEONBINDER_ENRICHMENT_FIXTURES on the Convex preview
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::CONVEX_PREVIEW_DEPLOY_KEY is not set. Add a Convex *preview* deploy key for the monorepo project as a repo secret."
            exit 1
          fi
          "$GITHUB_WORKSPACE/.github/scripts/convex-env-retry.sh" env set NEONBINDER_ENRICHMENT_FIXTURES 1 --deployment "$CONVEX_NAME"
          got=$(npx --yes convex@1.39.1 env get NEONBINDER_ENRICHMENT_FIXTURES --deployment "$CONVEX_NAME")
          echo "Convex preview NEONBINDER_ENRICHMENT_FIXTURES = $got"
          if [ "$got" != "1" ]; then
            echo "::error::read-back mismatch: expected 1, got '$got'"; exit 1
          fi
          {
            echo "### Enrichment fixtures (NEO-289)";
            echo "- Convex preview \`NEONBINDER_ENRICHMENT_FIXTURES\` = \`${got}\`";
          } >> "$GITHUB_STEP_SUMMARY"

      # The desktop pass's lookups, read BEFORE the reset below wipes them.
      # `since` is the desktop seed's start (seed job output). Non-failing.
      - name: Enrichment fixture coverage (desktop shards drained)
        working-directory: apps/web
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
          COVERAGE_LABEL: "after the desktop shards drained"
          COVERAGE_SINCE_MS: "${{ needs.seed.outputs.seed_since_ms }}"
        run: |
          set -uo pipefail
          if [ -z "${CONVEX_NAME:-}" ]; then
            echo "::warning::No Convex preview name from setup — skipping enrichment fixture coverage (${COVERAGE_LABEL})."
            exit 0
          fi
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::warning::CONVEX_PREVIEW_DEPLOY_KEY is not set — skipping enrichment fixture coverage (${COVERAGE_LABEL})."
            exit 0
          fi
          "$GITHUB_WORKSPACE/.github/scripts/enrichment-fixture-coverage.sh"

      # NEO-330 (D3/D7): every pass's seed loads a private reference-seed bundle
      # (a production-shaped catalogue of teams, players, leagues and
      # franchises) from a DEV-project bucket. Fail loudly when any input is
      # missing (fork PRs get no secrets): never skip silently, a skipped load
      # would seed nothing and the specs would meet a catalogue-less preview.
      - name: Require reference-seed inputs
        env:
          REFERENCE_SEED_URI: ${{ vars.NEONBINDER_REFERENCE_SEED_URI }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT_DEPLOYER_DEV }}
        run: |
          if [ -z "${REFERENCE_SEED_URI:-}" ]; then
            echo "::error::Repo variable NEONBINDER_REFERENCE_SEED_URI is not set. The E2E seed needs the reference-seed bundle location."
            exit 1
          fi
          if [ -z "${WIF_PROVIDER:-}" ] || [ -z "${WIF_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::GCP_WIF_PROVIDER_DEV / GCP_SERVICE_ACCOUNT_DEPLOYER_DEV are not available to this run (fork PR or missing secrets). The E2E seed cannot fetch the reference-seed bundle."
            exit 1
          fi
          # vars.* are not masked and gcloud echoes the URI: mask the whole URI
          # and the bucket name so neither reaches the public log.
          echo "::add-mask::${REFERENCE_SEED_URI}"
          bucket="${REFERENCE_SEED_URI#gs://}"
          echo "::add-mask::${bucket%%/*}"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Download reference-seed bundle
        env:
          REFERENCE_SEED_URI: ${{ vars.NEONBINDER_REFERENCE_SEED_URI }}
        run: |
          start=$(date +%s)
          gcloud storage cp --no-user-output-enabled "$REFERENCE_SEED_URI" "$RUNNER_TEMP/reference-bundle.zip"
          secs=$(( $(date +%s) - start ))
          # Drop the GCP credentials so later steps (npx installs, PR scripts)
          # cannot use them: revoke gcloud's stored account, delete the WIF
          # credential file, and blank every variable the pinned auth action
          # exports (CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE,
          # GOOGLE_APPLICATION_CREDENTIALS, GOOGLE_GHA_CREDS_PATH and the
          # project vars) plus the account setup-gcloud may set.
          gcloud auth revoke --all --quiet || true
          rm -f "${GOOGLE_GHA_CREDS_PATH:-}"
          rm -rf "${CLOUDSDK_CONFIG:-$HOME/.config/gcloud}"
          for v in CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE GOOGLE_APPLICATION_CREDENTIALS \
                   GOOGLE_GHA_CREDS_PATH CLOUDSDK_CORE_ACCOUNT CLOUDSDK_CORE_PROJECT \
                   CLOUDSDK_PROJECT GCLOUD_PROJECT GCP_PROJECT GOOGLE_CLOUD_PROJECT; do
            echo "$v=" >> "$GITHUB_ENV"
          done
          echo "NB_REFERENCE_BUNDLE=$RUNNER_TEMP/reference-bundle.zip" >> "$GITHUB_ENV"
          echo "NB_REFERENCE_SEED_SUMMARY=$RUNNER_TEMP/reference-seed-summary.txt" >> "$GITHUB_ENV"
          {
            echo "### Reference seed (NEO-330), mobile pass"
            echo "- Bundle download: ${secs}s"
          } >> "$GITHUB_STEP_SUMMARY"

      # NEO-330: the seed's start time in ms, for the fixture coverage calls.
      # `since` bounds which rows count as "looked up by this run"; passing it
      # explicitly beats the backend's first-year-row inference.
      - name: Record seed start time
        id: seed_start
        run: |
          since_ms=$(date +%s%3N)
          echo "NB_SEED_SINCE_MS=${since_ms}" >> "$GITHUB_ENV"
          echo "since_ms=${since_ms}" >> "$GITHUB_OUTPUT"

      # The mobile pass reloads the reference catalogue after its own reset: the
      # desktop shards wrote to the same preview, and the reset (except the
      # reference tables) plus the bundle's `import --replace` returns it to the
      # same baseline as the first pass. See the `seed` job's step for why.
      - name: Scripted reset + reference catalogue for the mobile pass (e2e-seed-reset.sh)
        id: seed_reset
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
          # NEO-392: an import past this marks a degraded preview (see
          # e2e-seed-reset.sh); the next steps delete it so a re-run
          # (recreate-degraded-preview.yml) gets a fresh one.
          NB_SEED_MAX_IMPORT_S: "300"
        run: |
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::CONVEX_PREVIEW_DEPLOY_KEY is not set. Add a Convex *preview* deploy key for the monorepo project as a repo secret."
            exit 1
          fi
          reset_start=$(date +%s)
          rc=0
          ./e2e-seed-reset.sh || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "degraded=true" >> "$GITHUB_OUTPUT"
            echo "::error::Convex preview $CONVEX_NAME is degraded: the reference import ran past ${NB_SEED_MAX_IMPORT_S}s (mobile pass). No specs ran, so this says nothing about the PR. The next step deletes the preview, and the whole workflow re-runs on its own with a fresh one (NEO-392)."
            echo "- Preview degraded: reference import past ${NB_SEED_MAX_IMPORT_S}s; deleting it for a fresh one (NEO-392)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          {
            echo "- Reset + reference import wall-clock: $(( $(date +%s) - reset_start ))s"
            if [ -s "${NB_REFERENCE_SEED_SUMMARY:-}" ]; then
              sed 's/^/- /' "$NB_REFERENCE_SEED_SUMMARY"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Its own step so the team-scoped token (which can delete any
      # deployment) never shares an environment with npx or PR scripts:
      # this runs only the guarded delete script (NEO-392 security audit).
      - name: Delete the degraded preview (NEO-392)
        id: delete_degraded
        if: failure() && steps.seed_reset.outputs.degraded == 'true'
        env:
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
        run: "$GITHUB_WORKSPACE/.github/scripts/delete-degraded-convex-preview.sh"

      - name: Mark the preview degraded (NEO-392)
        if: failure() && steps.delete_degraded.outputs.deleted == 'true'
        env:
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: printf '%s\n' "$CONVEX_NAME" > "$RUNNER_TEMP/preview-degraded.txt"

      - name: Upload the degraded marker (NEO-392)
        if: failure() && steps.delete_degraded.outputs.deleted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-degraded-mobile
          path: ${{ runner.temp }}/preview-degraded.txt
          retention-days: 14

      - name: Seed global baseline for the mobile pass (setup project, worker 0)
        env:
          CI: "true"
          APP_URL: http://localhost:3000
          PREVIEW_URL: ${{ needs.setup.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WORKER_INDEX: "0"
          PAUSED_PLATFORMS: ${{ vars.NEONBINDER_PAUSED_PLATFORMS }}
          PW_REPORT_DIR: playwright/report
        run: |
          setup_start=$(date +%s)
          npx playwright test --project=setup
          echo "- Setup project wall-clock: $(( $(date +%s) - setup_start ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Enrichment fixture coverage
        working-directory: apps/web
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
          COVERAGE_LABEL: "after the mobile seed"
          COVERAGE_SINCE_MS: "${{ env.NB_SEED_SINCE_MS }}"
        run: |
          set -uo pipefail
          if [ -z "${CONVEX_NAME:-}" ]; then
            echo "::warning::No Convex preview name from setup — skipping enrichment fixture coverage (${COVERAGE_LABEL})."
            exit 0
          fi
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::warning::CONVEX_PREVIEW_DEPLOY_KEY is not set — skipping enrichment fixture coverage (${COVERAGE_LABEL})."
            exit 0
          fi
          "$GITHUB_WORKSPACE/.github/scripts/enrichment-fixture-coverage.sh"

      - name: Stop Convex log capture (seed-mobile)
        if: always()
        working-directory: apps/web
        run: |
          set -uo pipefail
          if [ -n "${CONVEX_LOGS_SEED_MOBILE_PID:-}" ]; then
            kill "${CONVEX_LOGS_SEED_MOBILE_PID}" 2>/dev/null || true
            wait "${CONVEX_LOGS_SEED_MOBILE_PID}" 2>/dev/null || true
          fi
          RAW_LOG_FILE="${RUNNER_TEMP}/convex-logs-seed-mobile.raw.jsonl"
          OUT_FILE="convex-logs-seed-mobile.jsonl"
          if [ -s "$RAW_LOG_FILE" ]; then
            jq -c '
                ((.logLines // [])
                | map(select(
                    .level == "ERROR" or .level == "WARN"
                    or ((.messages // []) | join(" ") | test("\"msg\""))
                  )))
                as $keep
                | if .kind == "Completion" then
                    # NEO-392: every completion keeps its timing, queue delay,
                    # read/write sizes and OCC info (no user data), so a stall
                    # shows which function was slow, queued or retried.
                    {identifier, udfType, timestamp, executionTimestamp,
                     executionTime, userExecutionTime, requestId, executionId,
                     parentExecutionId, cachedResult, willRetry, occInfo, kind, error,
                     readDocs: .usageStats.databaseReadDocuments,
                     readBytes: .usageStats.databaseReadBytes,
                     writeDocs: .usageStats.databaseWriteDocuments,
                     logLines: $keep}
                  else
                    select((.error != null) or ($keep | length) > 0)
                    | {identifier, udfType, timestamp, requestId, executionId, kind, error, logLines: $keep}
                  end
              ' "$RAW_LOG_FILE" > "$OUT_FILE" 2>"${RUNNER_TEMP}/convex-logs-seed-mobile-jq.stderr.log" || true
            gzip -f "$OUT_FILE" || true
            echo "Wrote $(du -h "${OUT_FILE}.gz" 2>/dev/null | cut -f1) of filtered Convex logs for the seed-mobile job."
          else
            echo "No Convex logs captured for the seed-mobile job (capture may have been skipped or produced nothing)."
          fi

      - name: Upload Convex log capture (seed-mobile)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: convex-logs-seed-mobile
          path: apps/web/convex-logs-seed-mobile.jsonl.gz
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload seed report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pw-report-seed-mobile
          # Not under a dot-directory: upload-artifact skips hidden paths by
          # default. report/ holds the blob, results.json and junit.xml;
          # results/ holds failure screenshots. The blob in report/ also embeds
          # error-context ARIA snapshots (accepted, see the header). No traces.
          path: |
            apps/web/playwright/report/
            apps/web/playwright/results/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  shard-mobile:
    # MOBILE pass (after seed-mobile): 8 identical shards, each its own VM = ONE Chrome (web can't parallelize
    # within a VM — the NEO-46 contention). shard i -> global worker i-1 ->
    # TEST_EMAIL_<i-1> (0..7 provisioned). A test failure fails the shard, but
    # `fail-fast: false` lets every other shard finish and report; the `e2e`
    # gate below reads the merged results for the verdict.
    needs: [setup, seed-mobile, timings]
    # Explicit condition: the default success() also looks at seed-mobile's
    # own needs, so a red desktop shard would skip the whole mobile pass even
    # though seed-mobile ran and passed. Mobile results are collected anyway.
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.seed-mobile.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Listed, not computed: Actions expressions have no arithmetic.
      matrix:
        include:
          - { shard: 1, worker: 0 }
          - { shard: 2, worker: 1 }
          - { shard: 3, worker: 2 }
          - { shard: 4, worker: 3 }
          - { shard: 5, worker: 4 }
          - { shard: 6, worker: 5 }
          - { shard: 7, worker: 6 }
          - { shard: 8, worker: 7 }
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NEO-389: plan from the run's fresh timings (see the `timings` job).
      # Every shard of both passes downloads the same file or none, so the
      # plans always agree. A failed download fails the shard rather than let
      # it plan from different numbers than the others. Downloaded outside the
      # tree and copied by name, so the artifact can only ever replace
      # timings.json.
      - name: Download this run's shard timings
        if: needs.timings.outputs.fresh == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shard-timings
          path: ${{ runner.temp }}/shard-timings
      - name: Use this run's shard timings
        if: needs.timings.outputs.fresh == 'true'
        run: cp "$RUNNER_TEMP/shard-timings/timings.json" playwright/timings.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # NEO-301: the seed job ends before the shard matrix starts, so it can
      # only cover its own window (captured above) — nothing spans the WHOLE
      # E2E run. Every shard streams the preview's logs for its own lifetime
      # (NEO-391): shards end at different times, so shard 1 alone missed most
      # of each pass. The streams overlap; dedupe on requestId when reading
      # them. Measured cost is nil (shard 1, which always captured, was
      # routinely the fastest shard). See "Stop Convex log capture" below for
      # the filtering rationale. Best-effort only: never fails the job.
      - name: Start Convex log capture (mobile shard ${{ matrix.shard }})
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: |
          set -uo pipefail
          # Warm the npx cache sequentially so the backgrounded logs process and the
          # later npx convex commands never install into _npx concurrently.
          "$GITHUB_WORKSPACE/.github/scripts/convex-env-retry.sh" --version
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::warning::CONVEX_PREVIEW_DEPLOY_KEY not set — skipping Convex log capture for mobile shard ${{ matrix.shard }}."
            exit 0
          fi
          RAW_LOG_FILE="${RUNNER_TEMP}/convex-logs-mobile-${{ matrix.shard }}.raw.jsonl"
          rm -f "$RAW_LOG_FILE"
          nohup npx --yes convex@1.39.1 logs --deployment "$CONVEX_NAME" --jsonl \
            > "$RAW_LOG_FILE" 2>"${RUNNER_TEMP}/convex-logs-mobile-${{ matrix.shard }}.stderr.log" &
          disown
          echo "CONVEX_LOGS_MOBILE1_PID=$!" >> "$GITHUB_ENV"
          echo "Started Convex log capture for mobile shard ${{ matrix.shard }} (pid $!) -> $RAW_LOG_FILE"

      # NEO-407: a latency probe beside the shard. It calls a one-document
      # query every second (and a no-write mutation every fourth) on this pass's
      # preview and records each answer's latency, so a stall in the preview
      # shows as a run of slow probe calls with its own timestamps, apart from
      # whatever the specs were doing. Needs only the deployment URL (public
      # functions, no key). Best-effort only: never fails the job.
      - name: Start Convex latency probe (mobile shard ${{ matrix.shard }})
        working-directory: apps/web
        env:
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: |
          set -uo pipefail
          if [ -z "${CONVEX_NAME:-}" ]; then
            echo "::warning::No preview deployment name — skipping the latency probe."
            exit 0
          fi
          OUT="${RUNNER_TEMP}/convex-probe-mobile-${{ matrix.shard }}.jsonl"
          rm -f "$OUT"
          nohup node scripts/convex-probe.mjs --url "https://${CONVEX_NAME}.convex.cloud" --out "$OUT" \
            >"${RUNNER_TEMP}/convex-probe-mobile.stdout.log" 2>&1 &
          disown
          echo "CONVEX_PROBE_PID=$!" >> "$GITHUB_ENV"
          echo "Started the latency probe (pid $!) -> $OUT"

      - name: Run mobile shard ${{ matrix.shard }}/8
        env:
          CI: "true"
          APP_URL: http://localhost:3000
          PREVIEW_URL: ${{ needs.setup.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WORKER_INDEX: ${{ matrix.worker }}
          PAUSED_PLATFORMS: ${{ vars.NEONBINDER_PAUSED_PLATFORMS }}
          PW_REPORT_DIR: playwright/report
          SHARD: ${{ matrix.shard }}
          PROJECT: e2e-mobile
        run: |
          set -euo pipefail
          # Longest-first file plan instead of --shard (see shard-plan.mjs),
          # on this pass's project timings.
          files=$(node playwright/shard-plan.mjs 8 "$SHARD" --project "$PROJECT")
          node playwright/shard-plan.mjs 8 --project "$PROJECT"   # per-shard totals, to stderr
          if [ -z "$files" ]; then
            # `playwright test` with no file arguments runs the WHOLE suite, and
            # an empty plan means the planner and the spec tree disagree. Either
            # way, refuse rather than pass a shard that ran nothing.
            echo "::error::Shard ${SHARD}/8 ($PROJECT) has no specs planned."
            exit 1
          fi
          echo "Shard ${SHARD} runs --project=$PROJECT:"; echo "$files"
          start=$(date +%s)
          # `bootstrap` runs first via the project dependency (this pass's
          # account re-seed, after the pass's reset).
          # shellcheck disable=SC2086 # one path per line, no spaces
          npx playwright test "--project=$PROJECT" $files || code=$?
          echo "Shard ${SHARD} ($PROJECT): exit ${code:-0}, $(( $(date +%s) - start ))s"
          exit "${code:-0}"

      # NEO-301: stop the background capture and filter before upload — same
      # filter and same reasoning as "Stop Convex log capture (seed)" above
      # (keep ERROR/WARN + our structured `{"msg": …}` lines, drop plain
      # INFO/LOG chatter that can carry a Convex userId). Never fails the job.
      - name: Stop Convex log capture (mobile shard ${{ matrix.shard }})
        if: always()
        working-directory: apps/web
        run: |
          set -uo pipefail
          if [ -n "${CONVEX_LOGS_MOBILE1_PID:-}" ]; then
            kill "${CONVEX_LOGS_MOBILE1_PID}" 2>/dev/null || true
            wait "${CONVEX_LOGS_MOBILE1_PID}" 2>/dev/null || true
          fi
          RAW_LOG_FILE="${RUNNER_TEMP}/convex-logs-mobile-${{ matrix.shard }}.raw.jsonl"
          OUT_FILE="convex-logs-mobile-${{ matrix.shard }}.jsonl"
          if [ -s "$RAW_LOG_FILE" ]; then
            jq -c '
                ((.logLines // [])
                | map(select(
                    .level == "ERROR" or .level == "WARN"
                    or ((.messages // []) | join(" ") | test("\"msg\""))
                  )))
                as $keep
                | if .kind == "Completion" then
                    # NEO-392: every completion keeps its timing, queue delay,
                    # read/write sizes and OCC info (no user data), so a stall
                    # shows which function was slow, queued or retried.
                    {identifier, udfType, timestamp, executionTimestamp,
                     executionTime, userExecutionTime, requestId, executionId,
                     parentExecutionId, cachedResult, willRetry, occInfo, kind, error,
                     readDocs: .usageStats.databaseReadDocuments,
                     readBytes: .usageStats.databaseReadBytes,
                     writeDocs: .usageStats.databaseWriteDocuments,
                     logLines: $keep}
                  else
                    select((.error != null) or ($keep | length) > 0)
                    | {identifier, udfType, timestamp, requestId, executionId, kind, error, logLines: $keep}
                  end
              ' "$RAW_LOG_FILE" > "$OUT_FILE" 2>"${RUNNER_TEMP}/convex-logs-mobile-${{ matrix.shard }}-jq.stderr.log" || true
            gzip -f "$OUT_FILE" || true
            echo "Wrote $(du -h "${OUT_FILE}.gz" 2>/dev/null | cut -f1) of filtered Convex logs for mobile shard ${{ matrix.shard }}."
          else
            echo "No Convex logs captured for mobile shard ${{ matrix.shard }} (capture may have been skipped or produced nothing)."
          fi

      - name: Stop Convex latency probe (mobile shard ${{ matrix.shard }})
        if: always()
        working-directory: apps/web
        run: |
          set -uo pipefail
          if [ -n "${CONVEX_PROBE_PID:-}" ]; then
            kill "${CONVEX_PROBE_PID}" 2>/dev/null || true
            sleep 1
          fi
          OUT="${RUNNER_TEMP}/convex-probe-mobile-${{ matrix.shard }}.jsonl"
          if [ -s "$OUT" ]; then
            node scripts/convex-probe.mjs --summary "$OUT" --stall-ms 2000 || true
            gzip -c "$OUT" > "convex-probe-mobile-${{ matrix.shard }}.jsonl.gz" || true
          else
            echo "No latency probe data for this shard."
          fi

      - name: Upload Convex latency probe (mobile shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: convex-probe-mobile-${{ matrix.shard }}
          path: apps/web/convex-probe-mobile-${{ matrix.shard }}.jsonl.gz
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Convex log capture (mobile shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: convex-logs-mobile-${{ matrix.shard }}
          path: apps/web/convex-logs-mobile-${{ matrix.shard }}.jsonl.gz
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pw-report-mobile-${{ matrix.shard }}
          # Same paths and the same published-content rule as the seed report.
          path: |
            apps/web/playwright/report/
            apps/web/playwright/results/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  # Single stable gate required by the `production` ruleset (through pr-pipeline's
  # `e2e` job and `ci-gate`). The shard matrices emit "shard-desktop (N)" / "shard-mobile (N)" checks whose
  # names change with the matrix length, so they can't be the required check.
  # This ONE `e2e` job is the verdict. It is green iff
  #   * setup and seed succeeded,
  #   * every shard job succeeded,
  #   * the merged report has no failed / timed-out / interrupted / skipped test,
  #   * and EVERY spec the planner knows about produced a result on EVERY spec
  #     project (desktop and mobile) — so a shard, or one project's half of
  #     it, that died before reporting cannot pass by omission.
  e2e:
    needs: [setup, seed, shard-desktop, seed-mobile, shard-mobile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Upstream jobs
        # Runs before (or without) checkout: apps/web, the default
        # working directory, may not exist yet.
        working-directory: ${{ github.workspace }}
        env:
          R_SETUP: ${{ needs.setup.result }}
          R_SEED: ${{ needs.seed.result }}
          R_SHARD_DESKTOP: ${{ needs.shard-desktop.result }}
          R_SEED_MOBILE: ${{ needs.seed-mobile.result }}
          R_SHARD_MOBILE: ${{ needs.shard-mobile.result }}
        run: |
          echo "jobs: setup=$R_SETUP seed=$R_SEED shard-desktop=$R_SHARD_DESKTOP seed-mobile=$R_SEED_MOBILE shard-mobile=$R_SHARD_MOBILE"
          if [ "$R_SETUP" != "success" ] || [ "$R_SEED" != "success" ] || [ "$R_SEED_MOBILE" != "success" ]; then
            echo "::error::setup or a seed did not succeed (setup=$R_SETUP seed=$R_SEED seed-mobile=$R_SEED_MOBILE)"
            # Record, don't exit: the reports still merge and publish so a red
            # run is readable; the "Upstream verdict" step fails the gate.
            echo "UPSTREAM_FAILED=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Download all reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pw-report-*
          path: apps/web/pw-all

      - name: Merge reports
        run: |
          set -euo pipefail
          mkdir -p pw-blobs pw-merged
          # Prefix each blob with its artifact (pass) name so two passes can
          # never overwrite one another's report-*.zip.
          while IFS= read -r z; do
            art=$(echo "$z" | cut -d/ -f2)
            cp "$z" "pw-blobs/${art}__$(basename "$z")"
          done < <(find pw-all -path '*/blob/*.zip')
          ls -la pw-blobs
          if [ -z "$(ls -A pw-blobs)" ]; then
            echo "::error::No report blobs from any job — nothing ran to completion."
            exit 1
          fi
          PLAYWRIGHT_JSON_OUTPUT_FILE=pw-merged/results.json \
          PLAYWRIGHT_JUNIT_OUTPUT_FILE=pw-merged/junit.xml \
          PLAYWRIGHT_HTML_OUTPUT_DIR=pw-merged/html \
          PLAYWRIGHT_HTML_OPEN=never \
            npx playwright merge-reports --reporter=json,junit,html pw-blobs

      # Screenshots and reports only (see the header). The merged HTML report
      # embeds attachments, which in CI are failure screenshots.
      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pw-merged
          path: apps/web/pw-merged/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify results
        run: |
          set -euo pipefail
          # What SHOULD have run, per project: every spec the planner would
          # hand out on it (one shard of one = the whole plan), relative to the
          # tests dir. The two plans differ only by playwright/project-scope.mjs
          # (NEO-389).
          node playwright/shard-plan.mjs --projects > projects.txt
          while read -r proj; do
            node playwright/shard-plan.mjs 1 1 --project "$proj" | sed 's#^playwright/tests/##' | sort -u > "planned-${proj}.txt"
            if [ ! -s "planned-${proj}.txt" ]; then
              echo "::error::The shard planner lists no specs for ${proj}."
              exit 1
            fi
          done < projects.txt
          python3 - pw-merged/results.json projects.txt <<'PY'
          import json, sys

          data = json.load(open(sys.argv[1]))
          projects = [l.strip() for l in open(sys.argv[2]) if l.strip()]
          planned_by = {p: {l.strip() for l in open(f"planned-{p}.txt") if l.strip()} for p in projects}
          if "e2e" not in projects or "e2e-mobile" not in projects:
              print(f"::error::shard-plan.mjs --projects must name e2e and e2e-mobile, got {projects}")
              sys.exit(1)

          rows = []  # (project, file, title, verdict)
          def walk(suite, file=""):
              file = suite.get("file", file)
              for spec in suite.get("specs", []):
                  for t in spec.get("tests", []):
                      res = t.get("results", [])
                      last = res[-1].get("status") if res else None
                      bad = (
                          t.get("status") in ("unexpected", "skipped")
                          or last in (None, "failed", "timedOut", "interrupted", "skipped")
                      )
                      rows.append((t.get("projectName"), file, spec.get("title"), "bad" if bad else "ok", last or "not run"))
              for s in suite.get("suites", []):
                  walk(s, file)
          for s in data.get("suites", []):
              walk(s)

          errors = []
          for e in data.get("errors", []) or []:
              errors.append("report error: " + str(e.get("message", e))[:300])

          for proj, file, title, verdict, last in rows:
              if verdict == "bad":
                  errors.append(f"[{proj}] {file} :: {title} -> {last}")

          # One seed per pass: the desktop pass and the mobile pass each ran
          # the `setup` project once, so two passing results are required.
          seed_ok = [r for r in rows if r[0] == "setup" and r[3] == "ok"]
          if len(seed_ok) < 2:
              errors.append(f"expected a passing `setup` (seed) result for EACH pass (desktop + mobile), found {len(seed_ok)}")

          # Bad results are errors above, so "a result on every project" plus
          # "no bad result" is "a passing result on every project".
          missing = []
          for proj in projects:
              seen = {r[1] for r in rows if r[0] == proj}
              for m in sorted(planned_by[proj] - seen):
                  missing.append((proj, m))
                  errors.append(f"planned spec produced no result on [{proj}]: {m}")

          counts = " · ".join(f"{p} tests reported={sum(1 for r in rows if r[0] == p)}" for p in projects)
          planned_n = " · ".join(f"{p} planned={len(planned_by[p])}" for p in projects)
          print(f"{planned_n} · {counts} · missing={len(missing)}")
          if errors:
              for line in errors[:200]:
                  print("::error::" + line.replace("\n", " "))
              if len(errors) > 200:
                  print(f"::error::... and {len(errors) - 200} more")
              sys.exit(1)
          print(f"All planned specs ran and passed on {', '.join(projects)}.")
          PY

      # Last on purpose: a red verdict above already fails the job, and this
      # catches the rarer case of a shard that failed outside any test (install,
      # crash) while the surviving results still looked complete.
      - name: Shard jobs
        if: always()
        # Runs before (or without) checkout: apps/web, the default
        # working directory, may not exist yet.
        working-directory: ${{ github.workspace }}
        env:
          R_SHARD_DESKTOP: ${{ needs.shard-desktop.result }}
          R_SHARD_MOBILE: ${{ needs.shard-mobile.result }}
        run: |
          if [ "${UPSTREAM_FAILED:-0}" = "1" ]; then
            echo "::error::Upstream verdict: setup or a seed did not succeed (see the Upstream jobs step)"
            exit 1
          fi
          if [ "$R_SHARD_DESKTOP" != "success" ] || [ "$R_SHARD_MOBILE" != "success" ]; then
            echo "::error::a shard job did not succeed (desktop=$R_SHARD_DESKTOP mobile=$R_SHARD_MOBILE)"
            exit 1
          fi

  report:
    # Publish even when the gate is red. Informational only: the `e2e` job is
    # the verdict, so this check publishes results without double-failing.
    needs: [setup, seed-mobile, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # NEO-330: the seed-time calls never see what the specs look up. Run it
      # once more after the mobile shards have finished, with the mobile seed's
      # `since` (the reset before it wiped the desktop pass's rows; the desktop
      # pass is read in seed-mobile before that reset). Non-failing; skipped
      # with a note when the deploy key or deployment name is missing (e.g. a
      # Dependabot run, or setup did not produce a name).
      - name: Enrichment fixture coverage (mobile shards drained)
        working-directory: apps/web
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
          COVERAGE_LABEL: "after the mobile shards drained"
          COVERAGE_SINCE_MS: "${{ needs.seed-mobile.outputs.seed_since_ms }}"
        run: |
          set -uo pipefail
          if [ -z "${CONVEX_NAME:-}" ]; then
            echo "::warning::No Convex preview name from setup — skipping enrichment fixture coverage (${COVERAGE_LABEL})."
            exit 0
          fi
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::warning::CONVEX_PREVIEW_DEPLOY_KEY is not set — skipping enrichment fixture coverage (${COVERAGE_LABEL})."
            exit 0
          fi
          "$GITHUB_WORKSPACE/.github/scripts/enrichment-fixture-coverage.sh"

      - name: Download merged report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pw-merged
          path: merged

      - name: Publish Playwright JUnit report (merged)
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: merged/junit.xml
          check_name: Playwright E2E
          detailed_summary: true
          include_passed: true
          fail_on_failure: false

      - name: Build combined summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os

          out = "combined-summary.md"
          try:
              data = json.load(open("merged/results.json"))
          except Exception as e:
              with open(out, "w") as fh:
                  fh.write("## Playwright E2E results\n\n")
                  fh.write(f"No merged results were produced ({e}). A shard or the seed may have failed before reporting; check the `seed`, `shard-desktop`, `seed-mobile`, `shard-mobile` and `e2e` jobs.\n")
              raise SystemExit(0)

          tests = []
          def walk(suite, file=""):
              file = suite.get("file", file)
              for spec in suite.get("specs", []):
                  for t in spec.get("tests", []):
                      res = t.get("results", [])
                      dur = sum(r.get("duration", 0) for r in res) / 1000
                      status = res[-1].get("status") if res else "skipped"
                      tests.append((dur, file, spec.get("title"), status, t.get("projectName")))
              for s in suite.get("suites", []):
                  walk(s, file)
          for s in data.get("suites", []):
              walk(s)

          failing = ("failed", "timedOut", "interrupted")
          passed = sum(1 for t in tests if t[3] == "passed")
          failed = sum(1 for t in tests if t[3] in failing)
          skipped = sum(1 for t in tests if t[3] == "skipped")
          total = sum(t[0] for t in tests)
          icon = "✅" if failed == 0 and skipped == 0 and tests else "❌"
          lines = [
              "## Playwright E2E results",
              "",
              f"{icon} **{passed} passed" + (f" · {failed} failed" if failed else "") + (f" · {skipped} skipped" if skipped else "") + f"** · {total:.0f}s total test time",
              "",
              "| Test | Project | Status | Duration |",
              "|---|---|---|---|",
          ]
          # Failures first, then slowest first.
          for dur, file, title, status, proj in sorted(tests, key=lambda t: (t[3] == "passed", -t[0])):
              flag = " :warning:" if dur > 180 else ""
              lines.append(f"| {file} :: {title}{flag} | {proj} | {status} | {dur:.0f}s |")
          with open(out, "w") as fh:
              fh.write("\n".join(lines) + "\n")
          PY
          cat combined-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post Playwright summary as sticky PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: e2e-results
          path: combined-summary.md

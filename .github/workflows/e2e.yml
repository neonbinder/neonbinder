name: E2E Tests

# Reusable workflow. The single PR entry point is the top-level deployment
# pipeline (.github/workflows/pr-pipeline.yml), which — when the PR changes
# services/browser — first points the Convex preview's NEONBINDER_BROWSER_URL at
# the PR's OWN per-PR browser preview, and only THEN calls this. Keeping the
# browser-URL wiring in that pipeline (not here) is deliberate: it belongs to the
# overall deployment, not to E2E. workflow_dispatch is retained for manual /
# standalone runs (which exercise the canonical dev browser default).
on:
  workflow_call:
    inputs:
      preview_url:
        description: >-
          The PR's Vercel preview URL. Supplied by pr-pipeline.yml's
          `web-preview` job (NEO-162), which BUILDS the preview rather than
          waiting for Vercel's git integration to — the integration is disabled
          for every branch in apps/web/vercel.json. Required: without a preview
          there is no per-PR Convex deployment either, so there is nothing for
          this suite to run against.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      preview_url:
        description: >-
          Vercel preview URL to run against. Must be passed explicitly for a
          standalone run — with the git integration disabled there is no
          vercel[bot] deployment to discover. Get one with
          `vercel deploy --token=…` from the branch you want to exercise.
        required: true
        type: string
# Cancel any in-flight run on this PR/branch when a newer commit arrives.
# Two concurrent runs share the same Convex dev deployment, browser service,
# and test users — concurrent /login/bsc calls for the same BSC account
# reliably trigger a 503 on the slower request. One active run per branch.
# (On workflow_call the caller pr-pipeline owns concurrency; this still applies
# to direct workflow_dispatch runs.)
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# action-junit-report needs checks:write to publish the per-flow PR check,
# and pull-requests:write to add its summary comment. Repo default is read-only.
permissions:
  contents: read
  checks: write
  pull-requests: write

# ─── Dynamic work-queue (NEO-49) ──────────────────────────────────────────────
# main deploys to prod on every merge, so the FULL suite is the merge-blocking
# gate. We run it across many FREE ubuntu-latest runners (public repos get ~20
# concurrent free jobs), each one isolated (PARALLELISM=1 = one Chrome/VM — web
# can't parallelize within a VM, the NEO-46 contention). Instead of pre-assigning
# a static slice per runner, a homogeneous runner pool DRAINS A SHARED QUEUE
# (work-stealing) so the legs balance themselves and the suite scales by changing
# only the matrix length — no flow-count re-tuning.
#
#   setup  → resolve the PR's Vercel preview URL AND the preview Convex .convex.site
#            URL (where the queue's HTTP endpoints live).
#   seed   → seed the shared per-PR Convex preview's global baseline ONCE (setup
#            track, worker 0), THEN enqueue the runnable flow list into the queue.
#   runner → strategy.matrix.runner: identical runners, each bootstraps its account
#            (runner N → TEST_EMAIL_N) then loops claim→run→report until the queue
#            drains. A flow failure is recorded in the queue, not the job exit code.
#   e2e    → the single ruleset-required gate: reads QUEUE status; green iff every
#            queued flow passed and the queue fully drained.
#   report → merge every runner's JUnit into ONE "Maestro E2E" check + sticky comment.
#
# Runner prep (bypass proxy + pinned Java/Chrome/Xvfb/Maestro) is the local
# composite action .github/actions/maestro-runner.
#
# To scale: extend matrix.runner (e.g. add 8..11) and provision TEST_EMAIL_8.. —
# the queue auto-distributes; nothing else changes. Requires the E2E_QUEUE_SECRET
# GitHub secret + the same value set on the Convex preview env.

# ─── Queue scope (NEO-187) ────────────────────────────────────────────────────
# The run ATTEMPT is part of the key, and that is what makes the rerun button
# work. `github.run_id` alone is stable across attempts, so a rerun re-entered
# an already-seeded queue: seedQueue returned `alreadySeeded`, every row was
# already terminal, `claimNext` found nothing pending, and the gate re-read the
# same `failed: 1` and exited — in about five seconds, having re-executed
# nothing. That reads as "the failure is real and reproducible" when it means
# only "the queue remembers". Adding run_attempt makes each attempt a genuinely
# fresh queue while preserving the within-attempt idempotency seedQueue exists
# for (parallel seed steps must not double-insert).
#
# Defined ONCE here and inherited by every job: the seed, the runners, and the
# gate MUST agree on this string, and three step-level copies of it was a
# standing invitation to drift.
#
# Note: queue rows are never purged, so a rerun adds another full set of rows
# rather than replacing the old attempt's. That is deliberate — the previous
# attempt's results stay readable — and small next to the accumulation the
# table already carries per run.
env:
  E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      url: ${{ steps.vercel-preview.outputs.url }}
      convex_site: ${{ steps.convex.outputs.convex_site }}
      convex_name: ${{ steps.convex.outputs.convex_name }}
    steps:
      # NEO-162: this was a 60-attempt poll of the GitHub Deployments API,
      # hunting for the vercel[bot] deployment on this SHA. The preview is now
      # BUILT by pr-pipeline.yml's `web-preview` job and handed straight down, so
      # the URL cannot be missing, cannot belong to a different commit, and
      # cannot cost five minutes of polling before failing.
      #
      # The old poll's real hazard was that its absence read as a timeout rather
      # than as a cause: a PR shape that produced no preview spent 5 minutes
      # looking for one and then reported "timed out", which says nothing about
      # why. A `needs:` edge says it at graph level instead.
      #
      # Readiness is still the NEXT step's job — `vercel deploy` returns once the
      # deployment is READY, but Deployment Protection means the runner still has
      # to prove itself with the bypass header before the URL answers 200.
      - name: Adopt the Vercel preview URL
        id: vercel-preview
        env:
          URL: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ]; then
            echo "::error::No preview_url supplied — the caller must build a preview first (pr-pipeline.yml's web-preview job)."
            exit 1
          fi
          echo "Vercel preview URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Wait for preview to respond (with bypass)
        env:
          PREVIEW_URL: ${{ steps.vercel-preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "No preview URL discovered."
            exit 1
          fi
          echo "Polling $PREVIEW_URL with bypass header..."
          for attempt in $(seq 1 60); do
            status=$(curl -sS -o /dev/null -w "%{http_code}" -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PREVIEW_URL/" || echo 000)
            if [ "$status" = "200" ]; then
              echo "Preview ready after $attempt attempt(s)."
              exit 0
            fi
            echo "attempt $attempt: HTTP $status — retrying in 5s"
            sleep 5
          done
          echo "Preview never returned 200."
          exit 1

      - name: Resolve preview Convex URL (.convex.site)
        id: convex
        env:
          PREVIEW_URL: ${{ steps.vercel-preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # The preview's index.html carries
          #   <meta name="x-convex-url" content="https://<deployment>.convex.cloud">
          # (Vite substitutes VITE_CONVEX_URL at build). Extract it and swap the
          # .convex.cloud API host for the .convex.site HTTP-actions host, where
          # the E2E work-queue endpoints live. The queue runners hit this directly.
          html=$(curl -sS -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PREVIEW_URL/")
          cloud=$(printf '%s' "$html" | grep -oE 'name="x-convex-url" content="[^"]*"' | grep -oE 'https://[a-z0-9-]+\.convex\.cloud' | head -1)
          if [ -z "$cloud" ]; then
            echo "::error::Could not resolve Convex URL from preview index.html (x-convex-url meta missing)"
            exit 1
          fi
          site="${cloud/.convex.cloud/.convex.site}"
          echo "Convex site URL: $site"
          echo "convex_site=$site" >> "$GITHUB_OUTPUT"
          # Same slug pr-pipeline.yml's "Resolve Convex preview deployment
          # name" step derives (NEO-214) — the `--deployment` selector the
          # `seed` job's scripted reset (e2e-baseline.sh, via
          # `run-e2e-smoke.sh setup`) passes as $CONVEX_NAME. Assert its shape
          # before writing it out: CONVEX_PREVIEW_DEPLOY_KEY is TEAM+PROJECT
          # scoped (not deployment-scoped), so a malformed/empty slug here
          # wouldn't fail closed on its own — the key would still authenticate
          # fine against a wrong or empty --deployment, and e2e-baseline.sh
          # would end up resetting some OTHER preview in the project rather
          # than erroring.
          name="${cloud#https://}"; name="${name%.convex.cloud}"
          if [ -z "$name" ] || [[ ! "$name" =~ ^[a-z-]+-[0-9]+$ ]]; then
            echo "::error::Could not derive a Convex preview deployment name from '$cloud'"
            exit 1
          fi
          echo "Convex deployment: $name"
          echo "convex_name=$name" >> "$GITHUB_OUTPUT"

  seed:
    defaults:
      run:
        working-directory: apps/web
    # Seed the shared per-PR Convex preview's global baseline ONCE, before the
    # matrix fans out. Runs the setup track (setup → insert → parallel) as worker
    # 0 at parallelism 1; `run-e2e-smoke.sh setup` is the only entry point that
    # runs setup-tagged flows. Because resetMyTestState (the per-shard Phase-0
    # bootstrap) is auth-scoped per user, it never wipes this global baseline.
    # By the time this runs, NEONBINDER_BROWSER_URL on the Convex preview already
    # points at the PR's own browser preview (when services/browser changed): the
    # top-level pr-pipeline.yml sets it and only THEN invokes this workflow, so
    # seeding marketplace creds here hits the PR's browser service, not dev.
    needs: setup
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./apps/web/.github/actions/maestro-runner
        with:
          preview-url: ${{ needs.setup.outputs.url }}
          bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # NEO-301: capture this PR preview's Convex logs for the seed job's own
      # lifetime. Preview log HISTORY is only ~15 minutes, and every attempt to
      # read it after a red run (PR #275, #277) was already gone — so capture
      # while it's live instead of trying to read it back afterwards.
      # `npx convex logs --jsonl` never exits on its own, so it's backgrounded
      # with `nohup … &` (a background process survives past the step that
      # started it, within the same job/VM — a standard GHA pattern) and
      # stopped explicitly in "Stop Convex log capture (seed)" below, which is
      # also where the filtering happens (see that step's comment for why the
      # raw stream is filtered before upload).
      #
      # Best-effort only: never fails the job. A missing CONVEX_DEPLOY_KEY
      # skips capture with a warning, not an error.
      - name: Start Convex log capture (seed)
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: |
          set -uo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::warning::CONVEX_PREVIEW_DEPLOY_KEY not set — skipping Convex log capture for the seed job."
            exit 0
          fi
          RAW_LOG_FILE="${RUNNER_TEMP}/convex-logs-seed.raw.jsonl"
          rm -f "$RAW_LOG_FILE"
          nohup npx --yes convex@1.39.1 logs --deployment "$CONVEX_NAME" --jsonl \
            > "$RAW_LOG_FILE" 2>"${RUNNER_TEMP}/convex-logs-seed.stderr.log" &
          disown
          echo "CONVEX_LOGS_SEED_PID=$!" >> "$GITHUB_ENV"
          echo "Started Convex log capture for seed job (pid $!) -> $RAW_LOG_FILE"

      # NEO-287: mirror the `vars.NEONBINDER_PAUSED_PLATFORMS` repo variable onto
      # THIS PR's Convex preview before seeding, so the preview env and the
      # Maestro `-e PAUSED_PLATFORMS` variable agree by construction. Without
      # this, a branch-reused preview keeps whatever the dashboard default was
      # last set to (NEO-184) — the exact drift that made per-run wiring
      # necessary for NEONBINDER_BROWSER_URL too. An empty variable means
      # nothing is paused: remove the var rather than set it to "", tolerating
      # "not set" so the very first run (before anyone has ever paused
      # anything) doesn't fail on a remove of a var that never existed.
      - name: Mirror NEONBINDER_PAUSED_PLATFORMS onto the Convex preview
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
          PAUSED_PLATFORMS: ${{ vars.NEONBINDER_PAUSED_PLATFORMS }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::CONVEX_PREVIEW_DEPLOY_KEY is not set. Add a Convex *preview* deploy key for the monorepo project as a repo secret."
            exit 1
          fi
          if [ -n "${PAUSED_PLATFORMS:-}" ]; then
            # Validate before writing anything to the preview: a typo'd or
            # unknown key here must fail loudly, never run the live suite
            # against SportLots while everyone believes the pause is in
            # effect (the exact silent-drift failure mode this whole
            # mechanism exists to avoid).
            IFS=',' read -ra _keys <<< "$PAUSED_PLATFORMS"
            for _key in "${_keys[@]}"; do
              _key="$(echo "$_key" | xargs)"  # trim whitespace
              [ -z "$_key" ] && continue
              _key_lower="$(echo "$_key" | tr '[:upper:]' '[:lower:]')"
              case "$_key_lower" in
                buysportscards|sportlots) ;;
                *)
                  echo "::error::vars.NEONBINDER_PAUSED_PLATFORMS contains an unknown platform key '$_key' (from '$PAUSED_PLATFORMS'). Valid keys: buysportscards, sportlots."
                  exit 1
                  ;;
              esac
            done
            npx --yes convex@1.39.1 env set NEONBINDER_PAUSED_PLATFORMS "$PAUSED_PLATFORMS" --deployment "$CONVEX_NAME"
          else
            npx --yes convex@1.39.1 env remove NEONBINDER_PAUSED_PLATFORMS --deployment "$CONVEX_NAME" \
              || echo "NEONBINDER_PAUSED_PLATFORMS was not set on this preview — nothing to remove."
          fi
          got=$(npx --yes convex@1.39.1 env get NEONBINDER_PAUSED_PLATFORMS --deployment "$CONVEX_NAME" || true)
          echo "Convex preview NEONBINDER_PAUSED_PLATFORMS = '${got}'"
          {
            echo "### SportLots/marketplace pause (NEO-287)";
            echo "- \`vars.NEONBINDER_PAUSED_PLATFORMS\` = \`${PAUSED_PLATFORMS:-<empty>}\`";
            echo "- Convex preview \`NEONBINDER_PAUSED_PLATFORMS\` = \`${got:-<unset>}\`";
          } >> "$GITHUB_STEP_SUMMARY"

      # NEO-289: unconditionally set the enrichment-fixtures switch on THIS PR's
      # Convex preview before seeding, for the same NEO-184 reason as the
      # NEONBINDER_PAUSED_PLATFORMS mirror above — a branch-reused preview keeps
      # whatever a dashboard default was last set to, so the flag must be written
      # every run rather than assumed. The switch (`NEONBINDER_ENRICHMENT_FIXTURES`)
      # is honoured by the lookup boundary only when `TESTING_RESET_SECRET` is also
      # set (prod has neither, so a stray value there is inert); on a preview it
      # makes the seed answer Wikidata/ESPN lookups for the 2024 Topps Chrome name
      # set from the committed recording instead of a live round-trip, so the seed
      # no longer depends on query.wikidata.org's health. Read back like the
      # NEONBINDER_BROWSER_URL wiring in pr-pipeline.yml — a silent no-op here would
      # otherwise pass and just seed slow/flaky instead of failing loudly.
      - name: Set NEONBINDER_ENRICHMENT_FIXTURES on the Convex preview
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::CONVEX_PREVIEW_DEPLOY_KEY is not set. Add a Convex *preview* deploy key for the monorepo project as a repo secret."
            exit 1
          fi
          npx --yes convex@1.39.1 env set NEONBINDER_ENRICHMENT_FIXTURES 1 --deployment "$CONVEX_NAME"
          got=$(npx --yes convex@1.39.1 env get NEONBINDER_ENRICHMENT_FIXTURES --deployment "$CONVEX_NAME")
          echo "Convex preview NEONBINDER_ENRICHMENT_FIXTURES = $got"
          if [ "$got" != "1" ]; then
            echo "::error::read-back mismatch: expected 1, got '$got'"; exit 1
          fi
          {
            echo "### Enrichment fixtures (NEO-289)";
            echo "- Convex preview \`NEONBINDER_ENRICHMENT_FIXTURES\` = \`${got}\`";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Seed global baseline (scripted reset, then setup track worker 0)
        env:
          APP_URL: http://localhost:3000
          PAUSED_PLATFORMS: ${{ vars.NEONBINDER_PAUSED_PLATFORMS }}
          # NEO-214: `run-e2e-smoke.sh setup` runs the scripted
          # `e2e-baseline.sh reset` itself (single writer, single entry point
          # shared with local use) before launching setup.yaml, which then
          # does Base + Insert + Parallel in one in-place pass (NEO-62).
          # e2e-baseline.sh needs a PREVIEW deploy key + the deployment slug
          # to reach THIS PR's Convex preview rather than the CLI's local
          # default. CONVEX_PREVIEW_DEPLOY_KEY is TEAM+PROJECT scoped, not
          # deployment-scoped (a wrong CONVEX_NAME would reach ANOTHER PR's
          # preview in this project, not dev/prod — previews are a separate
          # deployment class from either) — hence the shape assertion on
          # `name` in the `setup` job above. Also note: once --deployment is
          # passed, the CLI selects the target BY THAT NAME directly and
          # never consults the key for target selection at all — the key
          # only authenticates the call, so a right key + wrong name is
          # exactly the "reach another PR's preview" failure mode, not a
          # fail-closed one.
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
          # Forced serial in the scheduler too (SELECT_MODE setup); pinned
          # here for clarity. No SHARD_* → single-shard, worker 0.
          MAESTRO_PARALLELISM: "1"
          # Skip Phase-0 worker-bootstrap (NEO-62): the setup flow's own url chain
          # (/testing/sign-in?redirect=/testing/reset?redirect=/testing/seed-credentials)
          # already signs in + per-user resets + seeds creds + warms BSC/SL for
          # worker 0, so a separate bootstrap is pure duplication (~66s). Runner
          # jobs still bootstrap (they don't set this).
          MAESTRO_SKIP_BOOTSTRAP: "1"
          # NEO-236: the setup flow answers one New Team step per team the
          # first sync stages from the players' Wikidata careers (~380 steps at
          # ~1s each on the Base sync alone), so setup takes ~13 min, not ~6.
          # The default 600s flow timeout killed it mid-way on CI run 7.
          MAESTRO_FLOW_TIMEOUT_SEC: "1500"
          REPORT_DIR: maestro-report
        run: |
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::CONVEX_PREVIEW_DEPLOY_KEY is not set. Add a Convex *preview* deploy key for the monorepo project as a repo secret."
            exit 1
          fi
          npm run test:e2e -- setup

      # NEO-289: report how much of the seed's name set the fixture recording
      # actually covered, without blocking the run on it. `continue-on-error`
      # AND tolerating a missing function are both deliberate: this can run
      # before the Convex-side change (enrichmentFixtures.ts) has landed on
      # this preview, and coverage drifting (a fixture set going stale) is an
      # operator signal, not a CI failure — the seed itself already fell back
      # to live lookups for anything uncovered, so the suite is correct either
      # way. The coverage action is read-only and internal (reachable only
      # with the deploy key), so it takes just the `confirm` literal — NOT the
      # `ALLOW_ENRICHMENT_FIXTURE_CAPTURE` deployment env var that arms the
      # capture action: a shell env var on `convex run` never reaches the
      # Convex runtime, so arming coverage that way would fail every run and
      # this step's tolerance would hide it forever. No `--identity` is
      # passed, matching every other `convex run` this job makes.
      - name: Enrichment fixture coverage
        working-directory: apps/web
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: |
          set -uo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::warning::CONVEX_PREVIEW_DEPLOY_KEY is not set — skipping enrichment fixture coverage."
            exit 0
          fi
          report=$(npx --yes convex@1.39.1 run enrichmentFixtures:coverageReportFromCli \
            '{"sportQid":"Q5369","confirm":"CAPTURE_ENRICHMENT_FIXTURES"}' \
            --deployment "$CONVEX_NAME" 2>&1)
          status=$?
          echo "$report"
          if [ $status -ne 0 ]; then
            # Name the cause: a missing function means the Convex side is not
            # on this preview yet; anything else is a real error to look at.
            case "$report" in
              *"Could not find"*|*"not found"*|*"does not exist"*)
                why="function not on this preview yet (Convex side not deployed here)";;
              *)
                why="coverage action returned an error";;
            esac
            echo "::warning::Enrichment fixture coverage report could not be run — ${why}. See job log for details."
            {
              echo "### Enrichment fixture coverage (NEO-289)";
              echo "- Could not run \`enrichmentFixtures:coverageReportFromCli\` — ${why}; see job log.";
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The report is the LAST line of output (Convex CLI may print log lines
          # above it); parse defensively and never fail the job on a parse miss.
          parsed=$(echo "$report" | tail -n 1 | python3 -c '
          import json, sys
          try:
              d = json.load(sys.stdin)
              covered = d.get("covered", [])
              missing = d.get("missing", [])
              covered_n = len(covered) if isinstance(covered, list) else covered
              missing_joined = ",".join(missing) if isinstance(missing, list) else missing
              print(str(covered_n) + "|" + str(missing_joined))
          except Exception:
              print("?|")
          ' 2>/dev/null || echo "?|")
          covered_n="${parsed%%|*}"
          missing="${parsed#*|}"
          {
            echo "### Enrichment fixture coverage (NEO-289)";
            echo "- covered: \`${covered_n}\`";
            echo "- missing: \`${missing:-<none>}\`";
            echo '<details><summary>Raw report</summary>';
            echo;
            echo '```json';
            echo "$report";
            echo '```';
            echo '</details>';
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$missing" ]; then
            echo "::warning::Enrichment fixture coverage gaps for sportQid Q5369: ${missing}"
          fi

      - name: Enqueue flows into the work-queue
        # After the baseline exists, populate the shared queue with the runnable
        # flow list (non-util/wip/setup). Idempotent per runId. The homogeneous
        # runner pool then drains it. Just curl + find + python3 — no Maestro/Chrome.
        env:
          CONVEX_SITE_URL: ${{ needs.setup.outputs.convex_site }}
          E2E_QUEUE_SECRET: ${{ secrets.E2E_QUEUE_SECRET }}
        run: ./run-e2e-queue.sh enqueue

      # NEO-301: stop the background capture and filter before upload.
      # Filtered, not raw: keep only ERROR/WARN log lines and our structured
      # `{"msg": …}` JSON lines (the house convention — see
      # convex/observability.ts and the adapters), dropping plain INFO/LOG
      # chatter. That chatter can carry a Convex userId (an opaque internal
      # id, e.g. the `player_created`/`team_created`/`marketplace_token_paused`
      # lines) which has no diagnostic value for a red E2E flow and is
      # unnecessary to keep in an artifact anyone logged into GitHub can
      # download on this public repo. A grep of apps/web/convex found no raw
      # emails, passwords, tokens or secrets ever reach console.* —
      # credentials.ts and machineAuth.ts are deliberately written to log only
      # status codes and public ids (see machineAuth.ts's own comment on this)
      # — so the filter is belt-and-suspenders for the one thing that does
      # appear (userId) and for anything a future console.log adds. `jq` is
      # preinstalled on ubuntu-latest.
      #
      # Never fails the job: `|| true` throughout, `if: always()`.
      - name: Stop Convex log capture (seed)
        if: always()
        working-directory: apps/web
        run: |
          set -uo pipefail
          if [ -n "${CONVEX_LOGS_SEED_PID:-}" ]; then
            kill "${CONVEX_LOGS_SEED_PID}" 2>/dev/null || true
            wait "${CONVEX_LOGS_SEED_PID}" 2>/dev/null || true
          fi
          RAW_LOG_FILE="${RUNNER_TEMP}/convex-logs-seed.raw.jsonl"
          OUT_FILE="convex-logs-seed.jsonl"
          if [ -s "$RAW_LOG_FILE" ]; then
            jq -c '
                ((.logLines // [])
                | map(select(
                    .level == "ERROR" or .level == "WARN"
                    or ((.messages // []) | join(" ") | test("\"msg\""))
                  )))
                as $keep
                | select((.error != null) or ($keep | length) > 0)
                | {identifier, udfType, timestamp, requestId, executionId, kind, error, logLines: $keep}
              ' "$RAW_LOG_FILE" > "$OUT_FILE" 2>"${RUNNER_TEMP}/convex-logs-seed-jq.stderr.log" || true
            gzip -f "$OUT_FILE" || true
            echo "Wrote $(du -h "${OUT_FILE}.gz" 2>/dev/null | cut -f1) of filtered Convex logs for the seed job."
          else
            echo "No Convex logs captured for the seed job (capture may have been skipped or produced nothing)."
          fi

      - name: Upload Convex log capture (seed)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: convex-logs-seed
          path: apps/web/convex-logs-seed.jsonl.gz
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload seed report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-report-seed
          path: |
            apps/web/maestro-report/
            !apps/web/maestro-report/**/commands-*.json
            !apps/web/maestro-report/maestro-home/**
          if-no-files-found: ignore
          retention-days: 14

  runner:
    defaults:
      run:
        working-directory: apps/web
    # Homogeneous runner pool (NEO-49 dynamic queue). Every runner is identical —
    # it drains the SHARED Convex work-queue (work-stealing) instead of a static
    # shard slice, so the legs balance themselves (no slow-shard tail) and the
    # suite scales by changing the matrix length alone — no SHARD_TOTAL re-tuning.
    # Each runner is its own VM = ONE maestro/Chrome (web can't parallelize within
    # a VM — that was the NEO-46 p=2 Chrome contention). runner N → global worker
    # N → TEST_EMAIL_N (0..7 provisioned). Needs the preview URL (setup), the
    # seeded baseline AND the enqueued queue (seed).
    needs: [setup, seed]
    # `seed` runs with `if: always()` so it isn't skipped when an upstream
    # conditional job is. A downstream job that omits `always()` is itself skipped
    # whenever ANY need was skipped — that cascade would leave the matrix
    # un-expanded, the queue never drains, and the gate fails on pending>0 having
    # run zero flows (NEO-68). So gate explicitly on seed's result instead.
    if: always() && needs.seed.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One runner failing must NOT cancel the others — the queue + gate decide
      # the verdict, and we want every runner's report.
      fail-fast: false
      matrix:
        runner: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./apps/web/.github/actions/maestro-runner
        with:
          preview-url: ${{ needs.setup.outputs.url }}
          bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # NEO-301: the seed job ends before the runner matrix starts, so it can
      # only cover its own window (captured above) — nothing spans the WHOLE
      # E2E run. Runner 0 does: it drains the shared queue until empty, which
      # by construction covers every flow any runner executes. So runner 0
      # alone streams Convex logs for its full lifetime; runners 1-7 skip
      # this (one stream is enough, and it would just be the same preview's
      # logs duplicated 8x). See "Stop Convex log capture (runner 0)" below
      # for the filtering rationale. Best-effort only: never fails the job.
      - name: Start Convex log capture (runner 0)
        if: matrix.runner == 0
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ needs.setup.outputs.convex_name }}
        run: |
          set -uo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::warning::CONVEX_PREVIEW_DEPLOY_KEY not set — skipping Convex log capture for runner 0."
            exit 0
          fi
          RAW_LOG_FILE="${RUNNER_TEMP}/convex-logs-runner-0.raw.jsonl"
          rm -f "$RAW_LOG_FILE"
          nohup npx --yes convex@1.39.1 logs --deployment "$CONVEX_NAME" --jsonl \
            > "$RAW_LOG_FILE" 2>"${RUNNER_TEMP}/convex-logs-runner-0.stderr.log" &
          disown
          echo "CONVEX_LOGS_RUNNER0_PID=$!" >> "$GITHUB_ENV"
          echo "Started Convex log capture for runner 0 (pid $!) -> $RAW_LOG_FILE"

      - name: Drain the work-queue (runner ${{ matrix.runner }})
        env:
          APP_URL: http://localhost:3000
          # NO secrets to Maestro -e (NEO-29). The queue secret is sent ONLY as an
          # HTTP header inside run-e2e-queue.sh and never reaches Maestro / its
          # uploaded debug artifacts.
          RUNNER_INDEX: ${{ matrix.runner }}
          CONVEX_SITE_URL: ${{ needs.setup.outputs.convex_site }}
          E2E_QUEUE_SECRET: ${{ secrets.E2E_QUEUE_SECRET }}
          PAUSED_PLATFORMS: ${{ vars.NEONBINDER_PAUSED_PLATFORMS }}
          REPORT_DIR: maestro-report
        # Exits 0 once the queue is drained — a FLOW failure is recorded in the
        # queue (not a job failure), so the single `e2e` gate reads queue status
        # for the real verdict. A HARD error (bootstrap fail / crash) still fails
        # this job, which the gate also checks.
        run: ./run-e2e-queue.sh

      # NEO-301: stop the background capture and filter before upload — same
      # filter and same reasoning as "Stop Convex log capture (seed)" above
      # (keep ERROR/WARN + our structured `{"msg": …}` lines, drop plain
      # INFO/LOG chatter that can carry a Convex userId). Never fails the job.
      - name: Stop Convex log capture (runner 0)
        if: always() && matrix.runner == 0
        working-directory: apps/web
        run: |
          set -uo pipefail
          if [ -n "${CONVEX_LOGS_RUNNER0_PID:-}" ]; then
            kill "${CONVEX_LOGS_RUNNER0_PID}" 2>/dev/null || true
            wait "${CONVEX_LOGS_RUNNER0_PID}" 2>/dev/null || true
          fi
          RAW_LOG_FILE="${RUNNER_TEMP}/convex-logs-runner-0.raw.jsonl"
          OUT_FILE="convex-logs-runner-0.jsonl"
          if [ -s "$RAW_LOG_FILE" ]; then
            jq -c '
                ((.logLines // [])
                | map(select(
                    .level == "ERROR" or .level == "WARN"
                    or ((.messages // []) | join(" ") | test("\"msg\""))
                  )))
                as $keep
                | select((.error != null) or ($keep | length) > 0)
                | {identifier, udfType, timestamp, requestId, executionId, kind, error, logLines: $keep}
              ' "$RAW_LOG_FILE" > "$OUT_FILE" 2>"${RUNNER_TEMP}/convex-logs-runner-0-jq.stderr.log" || true
            gzip -f "$OUT_FILE" || true
            echo "Wrote $(du -h "${OUT_FILE}.gz" 2>/dev/null | cut -f1) of filtered Convex logs for runner 0."
          else
            echo "No Convex logs captured for runner 0 (capture may have been skipped or produced nothing)."
          fi

      - name: Upload Convex log capture (runner 0)
        if: always() && matrix.runner == 0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: convex-logs-runner-0
          path: apps/web/convex-logs-runner-0.jsonl.gz
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Maestro report — runner ${{ matrix.runner }}
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-report-runner-${{ matrix.runner }}
          # Keep junit + failure screenshots + summary, but exclude the files
          # that serialize Maestro's `-e` env map (NEO-29 defense-in-depth) and
          # the verbose per-worker home dirs.
          path: |
            apps/web/maestro-report/
            !apps/web/maestro-report/**/commands-*.json
            !apps/web/maestro-report/maestro-home/**
          if-no-files-found: ignore
          retention-days: 14

  # Single stable gate required by the `production` ruleset. The runner matrix
  # emits "runner (N)" checks whose names change with the matrix length, so they
  # can't be the required check. This ONE "e2e" check is the real verdict: it
  # reads the QUEUE status (a flow failure is recorded there, not in a runner's
  # exit code) and is green iff setup + seed succeeded AND every queued flow
  # passed (failed==0) AND the queue fully drained (pending==0, running==0 — a
  # nonzero running means a runner died holding a claimed flow). Stable name
  # regardless of how many runners.
  e2e:
    needs: [setup, seed, runner]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Gate — queue fully drained with zero failures
        env:
          CONVEX_SITE_URL: ${{ needs.setup.outputs.convex_site }}
          E2E_QUEUE_SECRET: ${{ secrets.E2E_QUEUE_SECRET }}
        run: |
          echo "jobs: setup=${{ needs.setup.result }} seed=${{ needs.seed.result }} runner=${{ needs.runner.result }}"
          if [ "${{ needs.setup.result }}" != "success" ] || [ "${{ needs.seed.result }}" != "success" ]; then
            echo "::error::setup or seed did not succeed"; exit 1
          fi
          status=$(curl -fsS -X POST "$CONVEX_SITE_URL/e2e/status" \
            -H "x-e2e-queue-secret: $E2E_QUEUE_SECRET" -H "Content-Type: application/json" \
            -d "{\"runId\":\"$E2E_RUN_ID\"}")
          echo "queue status: $status"
          echo "$status" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('passed=%s failed=%s pending=%s running=%s total=%s' % (
              d.get('passed'), d.get('failed'), d.get('pending'), d.get('running'), d.get('total')))
          if d.get('total', 0) == 0:
              print('::error::work-queue is empty — enqueue step failed?'); sys.exit(1)
          if d.get('failed', 0) > 0 or d.get('pending', 0) > 0 or d.get('running', 0) > 0:
              print('::error::E2E gate failed — flow failures or undrained queue'); sys.exit(1)
          print('All queued flows passed.')
          "
          # Also fail if a runner job itself hard-failed (bootstrap/crash) even
          # when the queue otherwise looks clean.
          if [ "${{ needs.runner.result }}" != "success" ]; then
            echo "::error::a runner job hard-failed (bootstrap or crash)"; exit 1
          fi

  report:
    defaults:
      run:
        working-directory: apps/web
    needs: [runner]
    # Run even when a runner fails so the merged report always publishes.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all runner reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: maestro-report-runner-*
          path: apps/web/all-shards

      - name: Regenerate flow-timings.tsv (LPT seed table)
        if: always()
        # Rebuild .maestro/flow-timings.tsv from this run's per-flow JUnit times so a
        # later run can seed the queue longest-first (NEO-61). Flows not measured this
        # run keep their committed value. Uploaded as an artifact (NOT committed here);
        # the weekly refresh-flow-timings.yml downloads it and opens a chore PR when
        # it drifts.
        run: bash gen-flow-timings.sh all-shards .maestro/flow-timings.tsv > flow-timings.tsv

      - name: Upload flow-timings artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flow-timings
          path: apps/web/flow-timings.tsv
          if-no-files-found: ignore
          retention-days: 14

      - name: ⏱️ Flow timing summary (slowest first)
        if: always()
        run: |
          {
            echo "## ⏱️ Flow timings (slowest first)"
            echo "| flow | seconds |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # Pull "time<TAB>name" from every flow's JUnit <testsuite>, sort slowest-first,
          # flag anything over 3 min. (maestro writes one testsuite per flow with time=.)
          find all-shards -path '*/junit/*.xml' -print0 2>/dev/null \
            | xargs -0 grep -hoE '<testsuite [^>]*>' 2>/dev/null \
            | sed -E 's/.*name="([^"]+)"[^>]*time="([0-9.]+)".*/\2\t\1/' \
            | sort -rn \
            | awk -F'\t' '
                { secs=$1+0; name=$2; total+=secs; if (secs>180) slow++;
                  flag=(secs>180)?" :warning:":"";
                  printf "| %s%s | %.0f |\n", name, flag, secs }
                END { printf "\n**Total flow-seconds:** %.0f &middot; **flows > 3 min:** %d\n", total, slow }
              ' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Maestro JUnit report (merged)
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          # Every shard's per-flow JUnit, merged into ONE "Maestro E2E" check.
          report_paths: apps/web/all-shards/**/junit/*.xml
          check_name: Maestro E2E
          detailed_summary: true
          include_passed: true
          # The matrix legs are the gate; this check is informational so it
          # publishes results without double-failing the run.
          fail_on_failure: false

      - name: Build combined summary
        if: always()
        # Render a per-test pass/fail + duration table from the merged JUnit
        # (all-shards/**/junit/*.xml) — the same files the "Maestro E2E" check
        # reads. Replaces the old summary.md-based builder, which always fell
        # through to "No shard summaries found" once the runners stopped
        # emitting summary.md (NEO-64). Failures are surfaced first, then
        # passing flows slowest-first.
        run: |
          combined=combined-summary.md
          rows="$(mktemp)"

          # One <testsuite> per flow → TSV: <rank>\t<seconds>\t<name>\t<status>
          # rank 0 = failed/errored (listed first), 1 = passed/skipped.
          # Attributes parsed by name, space-anchored so "classname" can't
          # shadow "name".
          find all-shards -path '*/junit/*.xml' -print0 2>/dev/null \
            | xargs -0 grep -hoE '<testsuite [^>]*>' 2>/dev/null \
            | awk '
                function attr(s, k,   re, m) {
                  re = "[[:space:]]" k "=\"[^\"]*\""
                  if (match(s, re)) {
                    m = substr(s, RSTART, RLENGTH)
                    sub("^[[:space:]]" k "=\"", "", m); sub(/"$/, "", m)
                    return m
                  }
                  return ""
                }
                {
                  name = attr($0, "name"); if (name == "") next
                  tests = attr($0, "tests") + 0
                  fails = attr($0, "failures") + 0
                  errs  = attr($0, "errors") + 0
                  skips = attr($0, "skipped") + 0
                  secs  = attr($0, "time") + 0
                  if (fails > 0 || errs > 0)             { rank = 0; status = "failed" }
                  else if (tests == 0 || skips >= tests) { rank = 1; status = "skipped" }
                  else                                   { rank = 1; status = "passed" }
                  printf "%d\t%.3f\t%s\t%s\n", rank, secs, name, status
                }
              ' > "$rows"

          shards=$(find all-shards -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          passed=$(awk -F'\t' '$4=="passed"'  "$rows" | wc -l | tr -d ' ')
          failed=$(awk -F'\t' '$4=="failed"'  "$rows" | wc -l | tr -d ' ')
          skipped=$(awk -F'\t' '$4=="skipped"' "$rows" | wc -l | tr -d ' ')
          total_secs=$(awk -F'\t' '{t+=$2} END{printf "%.0f", t+0}' "$rows")
          n_rows=$(wc -l < "$rows" | tr -d ' ')

          {
            echo "## Maestro E2E results (sharded)"
            echo ""
            if [ "$n_rows" -eq 0 ]; then
              echo "⚠️ _No JUnit results were produced by any shard. All shards may have failed before reporting — check the \`runner\` job logs._"
            else
              if [ "$failed" -eq 0 ]; then icon="✅"; else icon="❌"; fi
              line="$icon **${passed} passed"
              [ "$failed"  -gt 0 ] && line="$line · ${failed} failed"
              [ "$skipped" -gt 0 ] && line="$line · ${skipped} skipped"
              line="$line** · ${total_secs}s total · ${shards} shards"
              echo "$line"
              echo ""
              echo "| Test | Status | Duration |"
              echo "|---|---|---|"
              sort -t$'\t' -k1,1n -k2,2nr "$rows" \
                | awk -F'\t' '
                    { secs=$2; name=$3; status=$4
                      sym = (status=="failed") ? "❌ fail" : (status=="skipped") ? "⏭️ skip" : "✅ pass"
                      printf "| %s | %s | %.0fs |\n", name, sym, secs }
                  '
            fi
          } > "$combined"

          rm -f "$rows"
          cat "$combined" >> "$GITHUB_STEP_SUMMARY"

      - name: Post Maestro summary as sticky PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: maestro-results
          path: apps/web/combined-summary.md


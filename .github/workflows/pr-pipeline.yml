name: PR Pipeline

# Top-level per-PR deployment orchestration (NEO-18). The single pull_request
# entry point that ties the web E2E to the PR's OWN browser code:
#
#   changes ──► wire-browser-url ──► e2e   (reusable .github/workflows/e2e.yml)
#
# When a PR changes services/browser, Browser CI (browser.yml) independently
# builds + deploys a `pr-<N>` tagged, NO-traffic Cloud Run preview on the dev
# service. THIS pipeline then points the Convex preview's NEONBINDER_BROWSER_URL
# at that tagged URL and only AFTERWARD invokes the E2E suite — so the Maestro
# flows exercise the PR's browser service, not shared dev. Web-only PRs skip the
# wiring and run E2E against the canonical dev browser default.
#
# Why the wiring lives HERE (not in e2e.yml, not in the Vercel build):
#  • Vercel stays "dumb": it only builds the SPA + `convex deploy`. The
#    FE → Convex → browser security boundary means Vercel never talks to the
#    browser service, so the browser-URL wiring can't live in the Vercel build.
#  • It's a deployment concern, not an E2E concern — so it doesn't belong inside
#    e2e.yml either (which is now a reusable workflow called from here).
#  • Ordering is explicit via `needs:` — the Convex preview is guaranteed to
#    exist (its Vercel deployment resolved) AND the pr-<N> browser revision is
#    guaranteed live BEFORE the env var is set and E2E starts. No races.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Superset of what the reusable e2e.yml needs (a called workflow's GITHUB_TOKEN
# can't exceed the caller's): deployments:read to resolve the Vercel preview,
# checks:write + pull-requests:write for the E2E "Maestro E2E" check + sticky
# comment. The wire-browser-url job adds id-token:write at the job level (for
# WIF) without granting it to the E2E jobs.
permissions:
  contents: read
  deployments: read
  checks: write
  pull-requests: write

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      browser: ${{ steps.filter.outputs.browser }}
      preprocess: ${{ steps.filter.outputs.preprocess }}
      deps_only: ${{ steps.deps.outputs.deps_only }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
            browser:
              - 'services/browser/**'
            preprocess:
              - 'services/preprocess/**'

      # May this PR skip the 8-worker matrix? Only if BOTH hold:
      #   1. it was authored by dependabot[bot]  (NEO-108), and
      #   2. it touches nothing but dependency manifests  (NEO-87).
      # If so `e2e` skips and `ci-gate` accepts that skip (and ONLY that skip;
      # see the gate below).
      #
      # THE POLICY THIS ENCODES: a Dependabot PR is never merged directly. Those
      # PRs are screening — they prove a bump compiles and carry the changelog.
      # What lands is a maintainer batch branch (NEO-86 / PR #70): combine the
      # bumps, validate locally one at a time, ONE full E2E run, one squash-
      # merge, then close the Dependabot PRs. So the skip is not "dependency
      # changes are safe" — it is "these particular PRs are not the thing that
      # ships, and the thing that ships gets the full suite."
      #
      # Condition 1 is what makes that true rather than aspirational. NEO-87
      # gated on paths ALONE, which cannot distinguish a throwaway Dependabot PR
      # from the maintainer batch — the batch is manifest-only too, so it skipped
      # E2E as well, and could have merged with no browser-level coverage at all.
      # The carve-out swallowed the exact PR it existed to spare.
      #
      # Condition 2 stays deliberately narrow: manifests ONLY. CI-infrastructure
      # bumps that Dependabot also raises — `.github/workflows/**` and
      # `apps/web/.github/actions/maestro-runner/**` (setup-chrome, setup-java,
      # actions/cache) — ARE the E2E harness. Skipping E2E on those would leave
      # an unexercised test runner, so they keep running the full matrix.
      #
      # Do not "simplify" condition 1 to `github.actor`. See the note at the
      # check itself: the triggering actor becomes the maintainer on any push to
      # a Dependabot branch, which we do routinely to grant Actions secrets.
      #
      # Fail-CLOSED: any error, empty file list, unreadable author, or
      # non-pull_request event leaves deps_only=false ⇒ E2E runs. A false 'true'
      # here would silently wave changes through the gate, so ambiguity must cost
      # a redundant E2E run, never a skipped one.
      #
      # Escape hatch the other way: the `run-e2e` label (NEO-103) forces the
      # matrix back on for a Dependabot PR you want browser-verified in place.
      - name: Detect dependency-only PR
        id: deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # Single assignment at the very end — `verdict` is the only thing that
          # reaches GITHUB_OUTPUT, so duplicate-key precedence is never relied on.
          verdict=false

          decide() {
            if [ "${GITHUB_EVENT_NAME}" != "pull_request" ] || [ -z "${PR:-}" ]; then
              echo "Not a pull_request event — E2E runs."
              return
            fi

            local pr_json author labels files offenders

            # One API call, two signals (author + labels). Read live rather than
            # from `github.event.pull_request.*`: the event payload is frozen at
            # trigger time and replayed verbatim on a re-run, so a label added
            # after the fact would never be seen. Querying makes "label it, hit
            # re-run" work, which is the whole point of the NEO-103 override.
            pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}") || {
              echo "::warning::could not read PR metadata — E2E runs."
              return
            }
            author=$(printf '%s' "$pr_json" | jq -r '.user.login // ""')
            labels=$(printf '%s' "$pr_json" | jq -r '.labels[].name')

            # NEO-108: only Dependabot's OWN PRs may skip the matrix.
            #
            # Dependabot PRs are screening-only — they prove a bump compiles and
            # carry the changelog, and are never merged directly. What actually
            # lands is a maintainer batch branch (the NEO-86 pattern: combine the
            # bumps, validate locally one at a time, ONE full E2E run, one
            # squash-merge, then close the Dependabot PRs).
            #
            # NEO-87 gated this on PATHS ALONE, which could not tell those two
            # apart — the batch PR is manifest-only too, so it skipped E2E as
            # well. The carve-out swallowed the exact PR it existed to spare, and
            # the batch could have merged with no browser-level coverage at all.
            #
            # Keyed on the PR AUTHOR, deliberately not `github.actor`. The
            # triggering actor becomes the maintainer as soon as anyone pushes to
            # a Dependabot branch — which we do routinely, since a maintainer push
            # is what grants Actions secrets to those runs. Using `github.actor`
            # would flip every Dependabot PR to a full matrix on its second run
            # and reintroduce the spend this exists to prevent. `user.login` stays
            # `dependabot[bot]` no matter who pushes.
            if [ "$author" != "dependabot[bot]" ]; then
              echo "PR author is '${author:-unknown}', not dependabot[bot] — E2E runs (NEO-108)."
              return
            fi

            # NEO-103 override, one-way by construction: it can only ever force
            # the matrix ON. No label turns it off, and every failure path above
            # also leaves E2E running, so the escape hatch cannot become a bypass.
            if printf '%s\n' "$labels" | grep -qxF 'run-e2e'; then
              echo "🔬 \`run-e2e\` label present — forcing the full matrix regardless of paths (NEO-103)."
              return
            fi
            files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
              --paginate --jq '.[].filename') || {
                echo "::warning::could not list PR files — E2E runs."
                return
              }

            if [ -z "$files" ]; then
              echo "::warning::empty PR file list — E2E runs."
              return
            fi

            echo "Changed files:"; printf '%s\n' "$files" | sed 's/^/  /'

            # Anything that is NOT a bare dependency manifest at any depth
            # disqualifies the PR. npm: package.json / package-lock.json.
            # pip (services/preprocess, NEO-123): requirements.txt /
            # requirements-dev.txt — without these a Dependabot pip bump runs
            # the full 8-worker matrix it cannot possibly affect.
            #
            # Keep this enumeration EXPLICIT rather than a permissive
            # `requirements-.*\.txt`: a future requirements-<x>.txt should
            # require a deliberate edit here, not slip through.
            offenders=$(printf '%s\n' "$files" \
              | grep -vE '(^|/)package(-lock)?\.json$|(^|/)requirements(-dev)?\.txt$' || true)

            if [ -n "$offenders" ]; then
              echo "Non-manifest files present — E2E runs:"
              printf '%s\n' "$offenders" | sed 's/^/  /'
              return
            fi

            verdict=true
            echo "✅ Dependency-manifest-only PR — the 8-worker E2E matrix will be skipped (NEO-87)."
          }

          decide
          echo "deps_only=${verdict}" >> "$GITHUB_OUTPUT"

  # Point the Convex preview's NEONBINDER_BROWSER_URL at the PR's own pr-<N>
  # browser preview, so the E2E suite (invoked next) hits the PR's browser code.
  # Skipped for web-only PRs and for workflow_dispatch (no PR ⇒ no pr-<N>
  # preview) → E2E then uses the canonical dev browser default.
  #
  # NEO-104: also skipped on a dependency-manifest-only PR. E2E is the ONLY
  # consumer of this wiring, so when `deps_only` skips the matrix this job spends
  # ~3.5 min (resolve Cloud Run host → poll Vercel → resolve the Convex slug →
  # wait for the pr-<N> revision → set + read-back the env var) wiring up a suite
  # that never runs.
  #
  # Note what is deliberately NOT skipped: browser.yml's `deploy-preview` and
  # `preview-login-probe` still run. That probe does a live BSC + SportLots login
  # round-trip against the PR's own deployed browser code, and once E2E is gone
  # it is the only real integration coverage a browser deps PR has — it is what
  # makes those PRs safe to merge at all. Only the unused Convex wiring goes.
  wire-browser-url:
    name: Wire NEONBINDER_BROWSER_URL → pr-<N> browser preview
    needs: changes
    if: |
      github.event_name == 'pull_request'
      && needs.changes.outputs.browser == 'true'
      && needs.changes.outputs.deps_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-scoped perms: id-token (WIF for gcloud), deployments (resolve Vercel
    # preview via the API), contents (checkout). Does NOT need checks/PR-write.
    permissions:
      contents: read
      deployments: read
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Resolve the dev browser service's BASE host from Cloud Run (authoritative;
      # no hardcoded subdomain). Tagged revisions are reachable at
      # `pr-<N>---<base-host>`, and convex/browserAudience.ts (NEO-35) validates
      # the OIDC token against this base host even for the tagged URL.
      - name: Resolve browser base host
        id: host
        run: |
          set -euo pipefail
          base=$(gcloud run services describe neonbinder-browser \
            --region=us-central1 --project=neonbinder-dev \
            --format='value(status.url)')
          host="${base#https://}"
          if [ -z "$host" ]; then echo "::error::could not resolve browser base host"; exit 1; fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "Browser base host: $host"

      # Resolve this PR's Vercel preview (proves the Convex preview exists). Same
      # approach as e2e.yml's setup: poll the GitHub Deployments API for the
      # vercel[bot] deployment on this SHA, then its success status URL.
      - name: Resolve Vercel preview URL
        id: vercel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 60); do
            deployment_id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&per_page=100" \
              --jq '[.[] | select(.creator.login == "vercel[bot]")] | sort_by(.created_at) | reverse | .[0].id // empty')
            if [ -n "$deployment_id" ]; then
              url=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                --jq '[.[] | select(.state == "success")] | .[0] | (.environment_url // .target_url // empty)')
              if [ -n "$url" ]; then
                echo "Vercel preview URL: $url"
                echo "url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              failed=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                --jq '[.[] | select(.state == "failure" or .state == "error")] | length')
              if [ "${failed:-0}" -gt 0 ]; then
                echo "::error::Vercel deployment ${deployment_id} reported failure/error — cannot wire browser URL."; exit 1
              fi
            fi
            echo "attempt $attempt/60: Vercel deployment not ready for $SHA — retry in 5s"
            sleep 5
          done
          echo "::error::Timed out (5 min) waiting for a successful Vercel deployment on $SHA."; exit 1

      # Extract the Convex deployment NAME (slug) from the preview's x-convex-url
      # meta (Vite injects VITE_CONVEX_URL at build). The slug is the
      # `--deployment` selector for `convex env set`.
      - name: Resolve Convex preview deployment name
        id: convex
        env:
          PREVIEW_URL: ${{ steps.vercel.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            html=$(curl -sS -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PREVIEW_URL/" || true)
            cloud=$(printf '%s' "$html" | grep -oE 'name="x-convex-url" content="[^"]*"' | grep -oE 'https://[a-z0-9-]+\.convex\.cloud' | head -1 || true)
            if [ -n "$cloud" ]; then
              name="${cloud#https://}"; name="${name%.convex.cloud}"
              echo "Convex deployment: $name"
              echo "name=$name" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt $attempt/60: preview not serving x-convex-url yet — retry in 5s"
            sleep 5
          done
          echo "::error::Could not resolve Convex deployment name from preview index.html."; exit 1

      # Wait for the PR's pr-<N> browser revision to be live before pointing the
      # Convex preview at it. browser.yml deploys it in parallel (~3-5 min). The
      # service requires OIDC, so an UNauthenticated probe returns 403 once the
      # revision exists (404 = tag not present yet, 000 = unreachable).
      - name: Wait for pr-<N> browser preview to be live
        id: browser
        env:
          HOST: ${{ steps.host.outputs.host }}
        run: |
          set -euo pipefail
          PREVIEW_BROWSER_URL="https://pr-${PR}---${HOST}"
          echo "browser_url=$PREVIEW_BROWSER_URL" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 60); do  # ~10 min ceiling
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${PREVIEW_BROWSER_URL}/health" || echo 000)
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then
              echo "pr-${PR} browser preview is live (HTTP ${code}): $PREVIEW_BROWSER_URL"
              exit 0
            fi
            echo "attempt $attempt/60: $PREVIEW_BROWSER_URL → HTTP ${code} — retry in 10s"
            sleep 10
          done
          echo "::error::pr-${PR} browser preview never came up — browser.yml deploy may have failed."; exit 1

      # Point the Convex preview at the pr-<N> browser. A PREVIEW deploy key is
      # project-scoped; `--deployment <slug>` selects THIS PR's preview. Verified
      # with a read-back so a silent no-op can't masquerade as success.
      - name: Set NEONBINDER_BROWSER_URL on the Convex preview
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ steps.convex.outputs.name }}
          BROWSER_URL: ${{ steps.browser.outputs.browser_url }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::CONVEX_PREVIEW_DEPLOY_KEY is not set. Add a Convex *preview* deploy key for the monorepo project as a repo secret."
            exit 1
          fi
          npx --yes convex@1.39.1 env set NEONBINDER_BROWSER_URL "$BROWSER_URL" --deployment "$CONVEX_NAME"
          got=$(npx --yes convex@1.39.1 env get NEONBINDER_BROWSER_URL --deployment "$CONVEX_NAME")
          echo "Convex preview NEONBINDER_BROWSER_URL = $got"
          if [ "$got" != "$BROWSER_URL" ]; then
            echo "::error::read-back mismatch: expected $BROWSER_URL, got '$got'"; exit 1
          fi
          echo "✅ Wired — E2E will run against the PR's own browser preview."

  # Sibling of wire-browser-url above: points the Convex preview's
  # NEONBINDER_PREPROCESS_URL (heavy) and NEONBINDER_PREPROCESS_FAST_URL (fast,
  # NEO-175) at the PR's own pr-<N> preprocess preview(s), deployed in parallel
  # by preprocess.yml. Same mechanism, same reason it lives here rather than in
  # e2e.yml or the Vercel build — see the block comment at the top of this file.
  #
  # Gated like wire-browser-url: only on a PR that touched services/preprocess,
  # and never on a dependency-manifest-only PR (NEO-104 — E2E is the only
  # consumer of this wiring, and deps-only PRs already skip E2E below).
  #
  # Heavy (`neonbinder-preprocess`) predates the fast split and always exists.
  # Fast (`neonbinder-preprocess-fast`, NEO-175) is newer and may not exist yet
  # in every environment, so its host resolution is describe-guarded the same
  # way preprocess.yml's own deploy-preview-fast job guards its deploy — a PR
  # opened before terraform provisions it still wires heavy and gets a green,
  # not-a-failure skip for fast (adapters/preprocess.ts falls back to the heavy
  # URL whenever NEONBINDER_PREPROCESS_FAST_URL is unset, so leaving it unset
  # here is the correct no-op, not a gap).
  #
  # Uses the preprocess deployer SA (GCP_WIF_PROVIDER_PREPROCESS_DEV /
  # GCP_SA_PREPROCESS_DEPLOYER_DEV), NOT the browser deployer wire-browser-url
  # uses above — same least-privilege split preprocess.yml itself follows
  # (neonbinder-preprocess-deployer is a dedicated SA, separate from
  # neonbinder-browser-deployer). Its WIF binding is repo-scoped (not
  # job_workflow_ref-pinned — see main.tf's github_actions_wif_preprocess), so
  # any monorepo workflow, including this one, may assume it.
  wire-preprocess-url:
    name: Wire NEONBINDER_PREPROCESS_URL → pr-<N> preprocess preview(s)
    needs: changes
    if: |
      github.event_name == 'pull_request'
      && needs.changes.outputs.preprocess == 'true'
      && needs.changes.outputs.deps_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-scoped perms: id-token (WIF), deployments (resolve Vercel preview),
    # contents (checkout). Does NOT need checks/PR-write.
    permissions:
      contents: read
      deployments: read
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS_DEV }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Resolve the heavy preprocess service's BASE host from Cloud Run
      # (authoritative; no hardcoded subdomain). Always exists — no guard
      # needed. convex/preprocessAudience.ts (NEO-175) validates the OIDC
      # token against this base host even for the tagged URL.
      - name: Resolve heavy preprocess base host
        id: host-heavy
        run: |
          set -euo pipefail
          base=$(gcloud run services describe neonbinder-preprocess \
            --region=us-central1 --project=neonbinder-dev \
            --format='value(status.url)')
          host="${base#https://}"
          if [ -z "$host" ]; then echo "::error::could not resolve heavy preprocess base host"; exit 1; fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "Heavy preprocess base host: $host"

      # Fast may not exist yet — describe-guarded the same way
      # preprocess.yml's deploy-preview-fast guards its own deploy, so this
      # step never fails outright on a 404, it just records exists=false.
      - name: Resolve fast preprocess base host (if it exists)
        id: host-fast
        run: |
          set -euo pipefail
          if base=$(gcloud run services describe neonbinder-preprocess-fast \
              --region=us-central1 --project=neonbinder-dev \
              --format='value(status.url)' 2>/dev/null); then
            host="${base#https://}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "host=$host" >> "$GITHUB_OUTPUT"
            echo "Fast preprocess base host: $host"
          else
            echo "::notice::neonbinder-preprocess-fast not found in neonbinder-dev (terraform hasn't created it yet) — wiring heavy only."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Resolve this PR's Vercel preview (proves the Convex preview exists).
      # Exact copy of wire-browser-url's equivalent step.
      - name: Resolve Vercel preview URL
        id: vercel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 60); do
            deployment_id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&per_page=100" \
              --jq '[.[] | select(.creator.login == "vercel[bot]")] | sort_by(.created_at) | reverse | .[0].id // empty')
            if [ -n "$deployment_id" ]; then
              url=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                --jq '[.[] | select(.state == "success")] | .[0] | (.environment_url // .target_url // empty)')
              if [ -n "$url" ]; then
                echo "Vercel preview URL: $url"
                echo "url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              failed=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                --jq '[.[] | select(.state == "failure" or .state == "error")] | length')
              if [ "${failed:-0}" -gt 0 ]; then
                echo "::error::Vercel deployment ${deployment_id} reported failure/error — cannot wire preprocess URL."; exit 1
              fi
            fi
            echo "attempt $attempt/60: Vercel deployment not ready for $SHA — retry in 5s"
            sleep 5
          done
          echo "::error::Timed out (5 min) waiting for a successful Vercel deployment on $SHA."; exit 1

      # Extract the Convex deployment NAME (slug) from the preview's
      # x-convex-url meta. Exact copy of wire-browser-url's equivalent step.
      - name: Resolve Convex preview deployment name
        id: convex
        env:
          PREVIEW_URL: ${{ steps.vercel.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            html=$(curl -sS -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PREVIEW_URL/" || true)
            cloud=$(printf '%s' "$html" | grep -oE 'name="x-convex-url" content="[^"]*"' | grep -oE 'https://[a-z0-9-]+\.convex\.cloud' | head -1 || true)
            if [ -n "$cloud" ]; then
              name="${cloud#https://}"; name="${name%.convex.cloud}"
              echo "Convex deployment: $name"
              echo "name=$name" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt $attempt/60: preview not serving x-convex-url yet — retry in 5s"
            sleep 5
          done
          echo "::error::Could not resolve Convex deployment name from preview index.html."; exit 1

      # Wait for the PR's pr-<N> heavy preprocess revision to be live before
      # pointing Convex at it. preprocess.yml deploys it in parallel. IAM-only
      # (no allUsers — NEO-175 removed the legacy allUsers grant), so an
      # UNauthenticated probe returns 403 once the revision exists (404 = tag
      # not present yet, 000 = unreachable). Same technique as
      # wire-browser-url's wait step.
      - name: Wait for pr-<N> heavy preprocess preview to be live
        id: heavy
        env:
          HOST: ${{ steps.host-heavy.outputs.host }}
        run: |
          set -euo pipefail
          PREVIEW_URL="https://pr-${PR}---${HOST}"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 60); do  # ~10 min ceiling
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${PREVIEW_URL}/health" || echo 000)
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then
              echo "pr-${PR} heavy preprocess preview is live (HTTP ${code}): $PREVIEW_URL"
              exit 0
            fi
            echo "attempt $attempt/60: $PREVIEW_URL → HTTP ${code} — retry in 10s"
            sleep 10
          done
          echo "::error::pr-${PR} heavy preprocess preview never came up — preprocess.yml deploy-preview may have failed."; exit 1

      # Same wait, fast service — only when it exists.
      - name: Wait for pr-<N> fast preprocess preview to be live
        id: fast
        if: steps.host-fast.outputs.exists == 'true'
        env:
          HOST: ${{ steps.host-fast.outputs.host }}
        run: |
          set -euo pipefail
          PREVIEW_URL="https://pr-${PR}---${HOST}"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 60); do  # ~10 min ceiling
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${PREVIEW_URL}/health" || echo 000)
            if [ "$code" != "404" ] && [ "$code" != "000" ]; then
              echo "pr-${PR} fast preprocess preview is live (HTTP ${code}): $PREVIEW_URL"
              exit 0
            fi
            echo "attempt $attempt/60: $PREVIEW_URL → HTTP ${code} — retry in 10s"
            sleep 10
          done
          echo "::error::pr-${PR} fast preprocess preview never came up — preprocess.yml deploy-preview-fast may have failed."; exit 1

      # Point the Convex preview at the pr-<N> preprocess preview(s). Same
      # deploy-key mechanism + read-back verification as wire-browser-url.
      # NEONBINDER_PREPROCESS_FAST_URL is only set when the fast service
      # exists — left unset otherwise so adapters/preprocess.ts's built-in
      # fallback-to-heavy takes over, rather than pointing it at heavy
      # ourselves and duplicating that fallback logic here.
      - name: Set NEONBINDER_PREPROCESS_URL (+ _FAST_URL) on the Convex preview
        working-directory: apps/web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_NAME: ${{ steps.convex.outputs.name }}
          HEAVY_URL: ${{ steps.heavy.outputs.url }}
          FAST_EXISTS: ${{ steps.host-fast.outputs.exists }}
          FAST_URL: ${{ steps.fast.outputs.url }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::error::CONVEX_PREVIEW_DEPLOY_KEY is not set. Add a Convex *preview* deploy key for the monorepo project as a repo secret."
            exit 1
          fi

          npx --yes convex@1.39.1 env set NEONBINDER_PREPROCESS_URL "$HEAVY_URL" --deployment "$CONVEX_NAME"
          got=$(npx --yes convex@1.39.1 env get NEONBINDER_PREPROCESS_URL --deployment "$CONVEX_NAME")
          echo "Convex preview NEONBINDER_PREPROCESS_URL = $got"
          if [ "$got" != "$HEAVY_URL" ]; then
            echo "::error::read-back mismatch: expected $HEAVY_URL, got '$got'"; exit 1
          fi

          if [ "$FAST_EXISTS" = "true" ]; then
            npx --yes convex@1.39.1 env set NEONBINDER_PREPROCESS_FAST_URL "$FAST_URL" --deployment "$CONVEX_NAME"
            got_fast=$(npx --yes convex@1.39.1 env get NEONBINDER_PREPROCESS_FAST_URL --deployment "$CONVEX_NAME")
            echo "Convex preview NEONBINDER_PREPROCESS_FAST_URL = $got_fast"
            if [ "$got_fast" != "$FAST_URL" ]; then
              echo "::error::read-back mismatch: expected $FAST_URL, got '$got_fast'"; exit 1
            fi
          else
            echo "NEONBINDER_PREPROCESS_FAST_URL left unset — fast service doesn't exist yet; adapters/preprocess.ts falls back to the heavy URL."
          fi

          echo "✅ Wired — E2E will run against the PR's own preprocess preview(s)."

  # Invoke the (reusable) E2E suite. Runs AFTER wiring so the Convex preview is
  # already pointed at the PR's browser and preprocess previews (when those
  # areas changed). For PRs that touch neither, both wiring jobs are SKIPPED
  # and E2E still runs (dev defaults). If either wiring job FAILS, E2E is
  # skipped (no false green against dev) and the red wiring job surfaces the
  # problem.
  #
  # Also skipped for dependency-manifest-only PRs (NEO-87). That skip is the ONE
  # case ci-gate treats as acceptable — every other skip still fails the gate.
  e2e:
    name: E2E
    needs: [changes, wire-browser-url, wire-preprocess-url]
    if: |
      always()
      && needs.changes.result == 'success'
      && needs.changes.outputs.deps_only != 'true'
      && (needs.wire-browser-url.result == 'success' || needs.wire-browser-url.result == 'skipped')
      && (needs.wire-preprocess-url.result == 'success' || needs.wire-preprocess-url.result == 'skipped')
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  # --- Pre-merge area CI -----------------------------------------------------
  # Inlined here (the only all-PR workflow) so they run + skip per changed area
  # and can be gated by the always-running `ci-gate` below. web-ci.yml was
  # removed in favor of web-lint/web-unit. browser.yml's own `test` job is left
  # intact (it gates the push-to-main deploy lane, which this PR-only workflow
  # can't cover), so on a services/browser PR the browser build+test runs in
  # both places — ~1-2 min parallel, no shared state, harmless.
  web-lint:
    name: ESLint (apps/web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint

  web-unit:
    name: Unit & component tests (vitest, apps/web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  # Mirror of browser.yml `test` (kept in sync intentionally — see note above).
  browser-test:
    name: Browser build + unit tests
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: services/browser/.nvmrc
          cache: npm
          cache-dependency-path: services/browser/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Mirror of preprocess.yml `test` (kept in sync intentionally — same rationale
  # as browser-test above).
  #
  # This is the FIRST Python job in the repo. Two things about it are not
  # obvious from the YAML:
  #
  #  1. `working-directory` is load-bearing for pip and pytest, NOT for ruff.
  #     `pip install -r requirements-dev.txt`, `pytest tests/unit` and
  #     `--cov=app` are all cwd-relative and only resolve inside the service
  #     directory; each fails loudly from anywhere else. (Ruff is the exception
  #     — `ruff check .` from the repo root walks the tree and finds exactly the
  #     same files, resolving config per-file from services/preprocess's own
  #     pyproject.toml. Verified, rather than assumed.)
  #
  #  2. `cache-dependency-path` is an ACTION INPUT, so `defaults.run` does not
  #     apply to it. It resolves from ${{ github.workspace }} and has to carry
  #     the services/preprocess prefix explicitly. The requirements*.txt glob is
  #     deliberate: requirements-dev.txt is `-r requirements.txt` plus tools, so
  #     keying on the dev file alone would leave the cache blind to a runtime
  #     pin bump.
  preprocess-test:
    name: Preprocess lint + unit tests
    needs: changes
    if: needs.changes.outputs.preprocess == 'true'
    runs-on: ubuntu-latest
    # 20, not 10: requirements-dev.txt transitively installs torch+cpu,
    # transformers and opencv. A cold pip cache is several minutes.
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/preprocess
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/preprocess/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/unit --cov=app --cov-report=term-missing --cov-fail-under=80

  # Single stable aggregator REQUIRED by the main ruleset. MUST stay in this
  # all-PR workflow (no `paths:` trigger) with `if: always()` so its check
  # registers on EVERY PR — including docs-only PRs where every gated job
  # skips. Adding a `paths:` filter or dropping `always()` re-introduces the
  # "required check never registers" wedge that blocks out-of-area PRs.
  # Verdict: `changes` + `e2e` MUST succeed; area/wiring jobs pass on
  # success OR skipped (out-of-area); any failure/cancelled fails.
  # NEO-87 carve-out: `e2e` may be `skipped` IFF changes.deps_only == 'true'.
  # That pairing is what keeps the NEO-68 vacuous-skip trap closed — a skipped
  # E2E is green only when an authoritative, fail-closed signal says the PR
  # touched nothing but dependency manifests. Every other skip is still red.
  ci-gate:
    name: CI Gate
    needs: [changes, web-lint, web-unit, browser-test, preprocess-test, wire-browser-url, wire-preprocess-url, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Aggregate required-check verdict
        env:
          R_CHANGES: ${{ needs.changes.result }}
          R_WEB_LINT: ${{ needs.web-lint.result }}
          R_WEB_UNIT: ${{ needs.web-unit.result }}
          R_BROWSER_TEST: ${{ needs.browser-test.result }}
          R_PREPROCESS_TEST: ${{ needs.preprocess-test.result }}
          R_WIRE: ${{ needs.wire-browser-url.result }}
          R_WIRE_PREPROCESS: ${{ needs.wire-preprocess-url.result }}
          R_E2E: ${{ needs.e2e.result }}
          R_DEPS_ONLY: ${{ needs.changes.outputs.deps_only }}
        run: |
          set -euo pipefail
          echo "changes=$R_CHANGES web-lint=$R_WEB_LINT web-unit=$R_WEB_UNIT browser-test=$R_BROWSER_TEST preprocess-test=$R_PREPROCESS_TEST wire-browser-url=$R_WIRE wire-preprocess-url=$R_WIRE_PREPROCESS e2e=$R_E2E deps_only=$R_DEPS_ONLY"
          fail=0
          # changes must SUCCEED (skipped => gate unreliable)
          [ "$R_CHANGES" = "success" ] || { echo "::error::changes=$R_CHANGES (must succeed)"; fail=1; }
          # e2e must SUCCEED, except on a dependency-manifest-only PR where a
          # SKIP is the intended outcome (NEO-87). Note the deps_only check reads
          # the same job output that gated the skip, so the two can't disagree.
          if [ "$R_E2E" != "success" ]; then
            if [ "$R_DEPS_ONLY" = "true" ] && [ "$R_E2E" = "skipped" ]; then
              echo "e2e=skipped — dependency-manifest-only PR, matrix intentionally not run (NEO-87)."
            else
              echo "::error::e2e=$R_E2E (must succeed; skip allowed only when deps_only=true)"; fail=1
            fi
          fi
          # area + wiring jobs: success OR skipped (out-of-area) OK; else fail
          for kv in "web-lint=$R_WEB_LINT" "web-unit=$R_WEB_UNIT" "browser-test=$R_BROWSER_TEST" "preprocess-test=$R_PREPROCESS_TEST" "wire-browser-url=$R_WIRE" "wire-preprocess-url=$R_WIRE_PREPROCESS"; do
            r="${kv#*=}"
            case "$r" in
              success|skipped) ;;
              *) echo "::error::${kv%%=*}=$r"; fail=1 ;;
            esac
          done
          [ "$fail" = "0" ] || { echo "CI Gate: FAIL"; exit 1; }
          echo "CI Gate: PASS — in-scope checks green, out-of-scope skipped."

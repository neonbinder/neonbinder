name: Preprocess CI

# Ported from neonbinder/neonbinder_preprocess `preprocess-deploy.yml` in
# NEO-123, restructured to match browser.yml. Behavioural deltas from the
# source, each deliberate:
#
#   * `paths:` filters added. The source had NONE — dropped into a monorepo
#     unchanged it would rebuild a multi-GB image (torch + baked SAM weights)
#     on every push to main regardless of what changed.
#   * `dev-rollback` DELETED (NEO-67 / the NEO-34 bug). Dev now uses the same
#     blue/green shape as prod, so there is nothing to roll back. See deploy-dev.
#   * dev + prod promote is ONE atomic update-traffic that also drops the
#     scratch tag (NEO-114). The source deliberately retained the sha tag,
#     which is exactly what keeps a revision addressable — and therefore warm —
#     forever.
#   * the `:<head-sha>` preview image tag is gone; see deploy-preview.
#   * `report-failure` files against this repo, not the archived one.
#
# This is the PRE-MERGE lane only. The deploy lane moved to
# preprocess-deploy.yml in NEO-143 — see the note below the triggers. It is
# still gated on `vars.PREPROCESS_DEPLOY_ENABLED == 'true'`; an unset variable
# is not 'true', so the lane stays dormant by default (fail-closed).

on:
  pull_request:
    paths:
      - "services/preprocess/**"
      # The workflow's own path is included so a change to THIS file is
      # exercised by the PR that makes it. Without it a syntax error here ships
      # unreviewed by CI.
      - ".github/workflows/preprocess.yml"
      # Same reasoning for the extracted deploy lane and the release driver.
      - ".github/workflows/preprocess-deploy.yml"
      - ".github/workflows/release.yml"

# NEO-143: deliberately NO `push:` trigger. The prod deploy lane moved to
# preprocess-deploy.yml so release.yml can order it AHEAD of the web/Convex
# release. Re-adding a push trigger here would deploy in parallel with that
# release, which is the failure mode NEO-143 exists to remove.
# `workflow_dispatch` moved with the lane.

concurrency:
  # NOTE the `preprocess-` prefix: reusing browser.yml's `browser-ci-` group
  # would make a preprocess PR cancel an in-flight browser run.
  # Pre-merge only now, so this always groups per-PR and cancels.
  group: preprocess-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: services/preprocess

env:
  SERVICE: neonbinder-preprocess
  # NEO-175 Phase D: fast runs the SAME preview image built for deploy-preview
  # below — see deploy-preview-fast, which deploys it a second time rather
  # than rebuilding.
  FAST_SERVICE: neonbinder-preprocess-fast
  REGION: us-central1
  DEV_PROJECT: neonbinder-dev
  PROD_PROJECT: neonbinder
  DEV_IMAGE: gcr.io/neonbinder-dev/neonbinder-preprocess
  PROD_IMAGE: gcr.io/neonbinder/neonbinder-preprocess
  # Previews go to a SEPARATE package (NEO-130), not `:pr-<N>` on DEV_IMAGE.
  #
  # Artifact Registry's `most_recent_versions` keep policy ranks by PUSH
  # recency, not by deploy. While previews shared this package, every PR
  # synchronize pushed a new version (plus left an untagged predecessor), so
  # preview churn consumed the keep window meant to protect deploys — measured
  # on browser-dev, 6 of 10 protected slots were pr-*/untagged across a 9-day
  # span. With a low-frequency service like preprocess that also defeats the
  # age gate, both guards can be false at once and the policy collects the image
  # the LIVE revision pins. At minScale=0 that is unrecoverable.
  #
  # Split out, rank in DEV_IMAGE is driven only by merges, so keep_count
  # genuinely means "N deploys deep".
  #
  # No new cleanup policy is needed: `delete-stale-pr-images` (tag prefix `pr-`,
  # 30d) and `delete-old-untagged` (14d) both apply to ALL packages.
  DEV_PREVIEW_IMAGE: gcr.io/neonbinder-dev/neonbinder-preprocess-preview

jobs:
  # Unit tests + lint. Mirrors pr-pipeline.yml's `preprocess-test` on purpose:
  # that copy is what the required `CI Gate` aggregates, this copy is what gates
  # the push-to-main deploy lane, which a PR-only workflow cannot cover.
  #
  # Integration tests (real Vision + Anthropic against fixture images) are NOT
  # run in CI — the fixtures live in GCS and are gitignored. Smoke tests against
  # the deployed URL cover end-to-end validation.
  # Name is deliberately NOT "Preprocess lint + unit tests" — that is
  # pr-pipeline.yml's copy, and two checks with the same name are
  # indistinguishable in the PR check list. Same split browser.yml uses:
  # "Build + unit tests" here (the workflow name already says which service),
  # "Browser build + unit tests" there.
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          # Action INPUT, so `defaults.run` does NOT apply — this resolves from
          # the workspace root and must carry the prefix explicitly.
          cache-dependency-path: services/preprocess/requirements*.txt
      # pip, pytest and --cov=app are all cwd-relative and depend on the
      # workflow-level `working-directory`. Ruff does not: `ruff check .` from
      # the repo root walks the tree to the same files and resolves config
      # per-file. Keeping the cwd right is still required for the other three.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/unit --cov=app --cov-report=term-missing --cov-fail-under=80

  # ---------------------------------------------------------------------------
  # PR preview path (PRs from branches in this repo).
  #
  # Each PR gets a stable `pr-<N>` tagged revision on the dev Cloud Run service.
  # Smoke runs against the same preview URL a human would QA against.
  # Traffic-serving dev (main's HEAD) is untouched. Fork PRs are skipped
  # because they cannot access WIF/OIDC.
  #
  # Teardown lives in preview-cleanup.yml on `pull_request: closed`.
  # ---------------------------------------------------------------------------
  deploy-preview:
    name: Deploy per-PR Cloud Run preview
    needs: test
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.PREPROCESS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # 30, not browser's 15: the Dockerfile bakes ~375MB of SAM weights pulled
    # from HuggingFace on every build, with no layer cache.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      preview_url: ${{ steps.capture.outputs.preview_url }}
      preview_tag: ${{ steps.capture.outputs.preview_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS_DEV }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push preview image
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # `.` is the JOB's working-directory (services/preprocess), so the
          # build context, Dockerfile and .dockerignore are all the service's
          # own — `COPY requirements.txt .` and `COPY app ./app` resolve
          # unchanged from the standalone repo. Building from the repo root
          # would upload apps/web/node_modules as context and then fail.
          #
          # The source also pushed a `:<head-sha>` tag for "merge-to-main
          # artifact promotion". That path is unreachable here: this repo is
          # squash-merge only, so github.sha on main is a NEW commit and can
          # never equal a PR head SHA. All it did was leave a multi-GB image
          # per push that preview-cleanup never deleted.
          #
          # DEV_PREVIEW_IMAGE, not DEV_IMAGE — previews live in their own
          # package so they cannot consume the deploy keep-window (NEO-130).
          docker build -t "$DEV_PREVIEW_IMAGE:pr-$PR_NUMBER" .
          docker push "$DEV_PREVIEW_IMAGE:pr-$PR_NUMBER"

      - name: Deploy tagged no-traffic preview to dev Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: neonbinder-preprocess
          region: us-central1
          image: gcr.io/neonbinder-dev/neonbinder-preprocess-preview:pr-${{ github.event.pull_request.number }}
          project_id: neonbinder-dev
          # env_vars is REPLACE-semantics for plain env vars, so every plain var
          # terraform sets on the service must be repeated here or the deploy
          # drops it. Secret-backed vars (INTERNAL_API_KEY, ANTHROPIC_API_KEY)
          # are managed separately via --set-secrets and are NOT affected.
          # GCS_PLACEHOLDER_BUCKET (NEO-170 Phase D) names the dev
          # placeholder-uploads bucket — must match
          # apps/web/convex/adapters/placeholderUploads.ts's Convex-side env
          # var of the same name, and terraform's
          # google_storage_bucket.placeholder_uploads naming
          # (neonbinder-placeholder-uploads-${var.gcp_project_id}). Previews
          # deploy into the dev project, so this is the dev bucket.
          # PREVIEW_SHA (NEO-191) stamps the revision with the commit it was
          # built from. Nothing else on a preview revision identifies its
          # source: the `:<head-sha>` image tag was dropped under NEO-130 to
          # stop previews consuming package version slots, so a revision is
          # otherwise distinguishable only by digest.
          #
          # Without it, consumers that wait on the pr-<N> URL cannot tell a
          # freshly-built revision from the PREVIOUS push's. `wire-preprocess-url`
          # waits only for that URL to stop 404ing, which on any second-or-later
          # push is already true of the stale revision — so it passed in ~30s and
          # everything downstream tested the old container. Observed on PR #193.
          env_vars: |
            ENVIRONMENT=dev
            GOOGLE_CLOUD_PROJECT=neonbinder-dev
            GCS_PLACEHOLDER_BUCKET=neonbinder-placeholder-uploads-neonbinder-dev
            PREVIEW_SHA=${{ github.event.pull_request.head.sha }}
          no_traffic: true
          tag: pr-${{ github.event.pull_request.number }}

      - id: capture
        name: Capture preview URL
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TAG="pr-$PR"
          TAGGED_URL=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$DEV_PROJECT" --format=json \
            | jq -r ".status.traffic[] | select(.tag == \"$TAG\") | .url")
          if [ -z "$TAGGED_URL" ] || [ "$TAGGED_URL" = "null" ]; then
            echo "::error::preview URL for tag=$TAG not found on service."
            exit 1
          fi
          echo "preview_url=$TAGGED_URL" >> "$GITHUB_OUTPUT"
          echo "preview_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $TAGGED_URL"

  preview-smoke:
    name: Smoke the preview
    needs: deploy-preview
    if: needs.deploy-preview.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/preprocess/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS_DEV }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # NEO-170 Phase D: mint an IAM identity token alongside the pre-existing
      # x-internal-key header — see preprocess-deploy.yml's dev-smoke for the
      # full transition rationale. Cloud Run validates the ID token's audience
      # against the BASE service URL even though the preview lives on a
      # tagged (`pr-<N>`) host.
      - id: base-url
        name: Capture base service URL (token audience)
        run: |
          set -euo pipefail
          BASE_URL=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$DEV_PROJECT" \
            --format='value(status.url)')
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - id: probe-token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS_DEV }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER_DEV }}
          token_format: id_token
          id_token_audience: ${{ steps.base-url.outputs.base_url }}
          id_token_include_email: true

      # The auth action masks the token internally, but that guarantee belongs
      # to the action's implementation — assert it ourselves so an action bump
      # cannot silently start echoing the token into logs.
      - name: Mask probe token
        env:
          PROBE_TOKEN: ${{ steps.probe-token.outputs.id_token }}
        run: echo "::add-mask::$PROBE_TOKEN"

      - name: Fetch internal API key (dev)
        env:
          SMOKE_TARGET_URL: ${{ needs.deploy-preview.outputs.preview_url }}
        run: |
          # `set -euo pipefail` and the emptiness assertions are load-bearing.
          # tests/smoke calls pytest.skip() when SMOKE_TARGET_URL or
          # SMOKE_INTERNAL_KEY is unset, so without these a failed secret fetch
          # would skip every test and exit 0 — a green smoke that ran nothing.
          set -euo pipefail
          KEY=$(gcloud secrets versions access latest --secret=internal-api-key --project="$DEV_PROJECT")
          echo "::add-mask::$KEY"
          [ -n "$KEY" ] || { echo "::error::internal-api-key came back empty"; exit 1; }
          [ -n "${SMOKE_TARGET_URL:-}" ] || { echo "::error::SMOKE_TARGET_URL is empty"; exit 1; }
          echo "SMOKE_INTERNAL_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Run smoke tests against preview
        env:
          SMOKE_TARGET_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          SMOKE_ID_TOKEN: ${{ steps.probe-token.outputs.id_token }}
        run: pytest tests/smoke -v

  # ---------------------------------------------------------------------------
  # Fast-service preview lane (NEO-175 Phase D).
  #
  # Deploys the SAME pr-<N> preview image built by deploy-preview above to the
  # fast Cloud Run service a second time — no rebuild, just a second tagged
  # no-traffic deploy. Mirrors preprocess-deploy.yml's fast-lane tolerances:
  #
  #   * EXISTENCE — guarded by a `gcloud run services describe` before ever
  #     calling deploy-cloudrun, so a PR opened before terraform creates
  #     neonbinder-preprocess-fast still gets a green (skipped, not failed)
  #     preview job. `gcloud run deploy` is never reached in that case — it
  #     would happily create the missing service, racing terraform for
  #     ownership of a resource it owns exclusively.
  #
  #   * SMOKE — preview-smoke-fast pings /health rather than running the full
  #     tests/smoke suite against the fast preview. See
  #     preprocess-deploy.yml's fast-lane comment for why: that suite's
  #     happy-path test exercises /process, which runs the full BiRefNet/SAM
  #     cascade regardless of PREPROCESS_ROLE, and would be slow-to-OOM on the
  #     fast service's smaller container. continue-on-error means a flake here
  #     can never fail this job or the PR preview overall; the result still
  #     surfaces in the sticky comment below.
  #
  # No env_vars input: terraform owns every var on this service, same as the
  # deploy lane.
  # ---------------------------------------------------------------------------
  deploy-preview-fast:
    name: Deploy per-PR Cloud Run preview (fast service) if it exists
    needs: deploy-preview
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.PREPROCESS_DEPLOY_ENABLED == 'true'
      && needs.deploy-preview.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    # This job never checks out the repo (gcloud-only steps), so the
    # workflow-level `defaults.run.working-directory: services/preprocess`
    # would point `run:` steps at a path that doesn't exist on the runner —
    # bash fails to even start (observed: job red at ~13s on the guard step,
    # before gcloud ever ran). Same override deploy-dev-fast already carries
    # in preprocess-deploy.yml; ported here too.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      exists: ${{ steps.guard.outputs.exists }}
      preview_url: ${{ steps.capture.outputs.preview_url }}
      preview_tag: ${{ steps.capture.outputs.preview_tag }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS_DEV }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - id: guard
        name: Check whether the fast Cloud Run service exists yet
        run: |
          set -euo pipefail
          if gcloud run services describe "$FAST_SERVICE" \
              --region="$REGION" --project="$DEV_PROJECT" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$FAST_SERVICE not found in $DEV_PROJECT (terraform hasn't created it yet) — skipping the fast-service preview deploy."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy tagged no-traffic preview to fast Cloud Run
        if: steps.guard.outputs.exists == 'true'
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: neonbinder-preprocess-fast
          region: us-central1
          # Same already-pushed preview image deploy-preview built above — see
          # that job's comment for why previews live in DEV_PREVIEW_IMAGE
          # rather than DEV_IMAGE.
          image: gcr.io/neonbinder-dev/neonbinder-preprocess-preview:pr-${{ github.event.pull_request.number }}
          project_id: neonbinder-dev
          no_traffic: true
          tag: pr-${{ github.event.pull_request.number }}

      - id: capture
        name: Capture fast preview URL
        if: steps.guard.outputs.exists == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TAG="pr-$PR"
          TAGGED_URL=$(gcloud run services describe "$FAST_SERVICE" \
            --region="$REGION" --project="$DEV_PROJECT" --format=json \
            | jq -r ".status.traffic[] | select(.tag == \"$TAG\") | .url")
          if [ -z "$TAGGED_URL" ] || [ "$TAGGED_URL" = "null" ]; then
            echo "::error::fast preview URL for tag=$TAG not found on $FAST_SERVICE."
            exit 1
          fi
          echo "preview_url=$TAGGED_URL" >> "$GITHUB_OUTPUT"
          echo "preview_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Fast preview URL: $TAGGED_URL"

  preview-smoke-fast:
    name: Ping the fast preview
    needs: deploy-preview-fast
    if: |
      needs.deploy-preview-fast.outputs.exists == 'true'
      && needs.deploy-preview-fast.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    # No checkout here either — same reasoning as deploy-preview-fast above.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      smoke_passed: ${{ steps.ping.outputs.passed }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS_DEV }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - id: base-url
        name: Capture fast base service URL (token audience)
        run: |
          set -euo pipefail
          BASE_URL=$(gcloud run services describe "$FAST_SERVICE" \
            --region="$REGION" --project="$DEV_PROJECT" \
            --format='value(status.url)')
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - id: probe-token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS_DEV }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER_DEV }}
          token_format: id_token
          id_token_audience: ${{ steps.base-url.outputs.base_url }}
          id_token_include_email: true

      - name: Mask probe token
        env:
          PROBE_TOKEN: ${{ steps.probe-token.outputs.id_token }}
        run: echo "::add-mask::$PROBE_TOKEN"

      - id: ping
        name: Ping /health on the tagged URL
        continue-on-error: true
        env:
          TAGGED_URL: ${{ needs.deploy-preview-fast.outputs.preview_url }}
          PROBE_TOKEN: ${{ steps.probe-token.outputs.id_token }}
        run: |
          set -uo pipefail
          STATUS=$(curl -s -o /tmp/health.json -w '%{http_code}' \
            -H "Authorization: Bearer $PROBE_TOKEN" \
            "$TAGGED_URL/health")
          BODY=$(cat /tmp/health.json 2>/dev/null || true)
          echo "status=$STATUS body=$BODY"
          if [ "$STATUS" = "200" ] && [ "$BODY" = '{"status":"ok"}' ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::fast preview /health ping failed (status=$STATUS body=$BODY) — not blocking the PR."
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  # Sticky PR comment with preview URL + results. Runs regardless of outcome so
  # a failure still leaves a trace pointing at the run.
  comment-preview:
    name: Comment preview URL
    needs: [deploy-preview, preview-smoke, deploy-preview-fast, preview-smoke-fast]
    if: |
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.PREPROCESS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        # This job never checks out, so the workflow-level
        # `working-directory: services/preprocess` would point at a
        # non-existent path and every run step would fail.
        working-directory: ${{ github.workspace }}
    steps:
      - name: Sticky preview comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ needs.deploy-preview.outputs.preview_url }}
          TAG: ${{ needs.deploy-preview.outputs.preview_tag }}
          DEPLOY_RESULT: ${{ needs.deploy-preview.result }}
          SMOKE_RESULT: ${{ needs.preview-smoke.result }}
          FAST_EXISTS: ${{ needs.deploy-preview-fast.outputs.exists }}
          FAST_URL: ${{ needs.deploy-preview-fast.outputs.preview_url }}
          FAST_TAG: ${{ needs.deploy-preview-fast.outputs.preview_tag }}
          FAST_DEPLOY_RESULT: ${{ needs.deploy-preview-fast.result }}
          FAST_SMOKE_PASSED: ${{ needs.preview-smoke-fast.outputs.smoke_passed }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          status() {
            case "$1" in
              success) echo "PASS" ;;
              failure) echo "FAIL" ;;
              cancelled) echo "CANCELLED" ;;
              skipped) echo "skipped" ;;
              *) echo "$1" ;;
            esac
          }

          URL_LINE="not deployed — see workflow run"
          if [ "$DEPLOY_RESULT" = "success" ] && [ -n "$URL" ]; then
            URL_LINE="$URL"
          fi

          # NEO-175 Phase D: the fast service's preview is a distinct
          # tri-state, not just pass/fail — it may not exist yet at all
          # (terraform hasn't created neonbinder-preprocess-fast in this
          # environment), which is expected and not an error.
          if [ "$FAST_EXISTS" != "true" ]; then
            FAST_URL_LINE="not created yet — terraform hasn't provisioned neonbinder-preprocess-fast"
            FAST_DEPLOY_LINE="skipped (service absent)"
            FAST_SMOKE_LINE="skipped"
          else
            FAST_URL_LINE="not deployed — see workflow run"
            if [ "$FAST_DEPLOY_RESULT" = "success" ] && [ -n "$FAST_URL" ]; then
              FAST_URL_LINE="$FAST_URL"
            fi
            FAST_DEPLOY_LINE="$(status "$FAST_DEPLOY_RESULT")"
            if [ "$FAST_SMOKE_PASSED" = "true" ]; then
              FAST_SMOKE_LINE="PASS"
            else
              FAST_SMOKE_LINE="FAIL (non-blocking)"
            fi
          fi

          # Marker invariant: comment lookup below is a SUBSTRING match, so no
          # marker may be a substring of another. This one and browser.yml's
          # `neonbinder-browser-preview-marker` are disjoint. Never introduce a
          # generic `neonbinder-preview-marker`.
          cat > body.md <<EOF
          <!-- neonbinder-preprocess-preview-marker -->
          ## Preprocess service preview

          **URL:** $URL_LINE
          **Tag:** \`$TAG\`

          **Checks**
          - Deploy: $(status "$DEPLOY_RESULT")
          - Smoke: $(status "$SMOKE_RESULT")

          **Fast service preview**
          - URL: $FAST_URL_LINE
          - Tag: \`$FAST_TAG\`
          - Deploy: $FAST_DEPLOY_LINE
          - Health ping: $FAST_SMOKE_LINE

          Preview auto-updates on each push to this PR and is torn down when the PR closes. [Workflow run]($RUN_URL)
          EOF

          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("neonbinder-preprocess-preview-marker")) | .id' \
            | head -n 1)

          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$(cat body.md)" > /dev/null
            echo "Updated sticky comment $EXISTING."
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$(cat body.md)" > /dev/null
            echo "Created sticky comment."
          fi


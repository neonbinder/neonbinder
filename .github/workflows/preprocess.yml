name: Preprocess CI

# Ported from neonbinder/neonbinder_preprocess `preprocess-deploy.yml` in
# NEO-123, restructured to match browser.yml. Behavioural deltas from the
# source, each deliberate:
#
#   * `paths:` filters added. The source had NONE — dropped into a monorepo
#     unchanged it would rebuild a multi-GB image (torch + baked SAM weights)
#     on every push to main regardless of what changed.
#   * `dev-rollback` DELETED (NEO-67 / the NEO-34 bug). Dev now uses the same
#     blue/green shape as prod, so there is nothing to roll back. See deploy-dev.
#   * dev + prod promote is ONE atomic update-traffic that also drops the
#     scratch tag (NEO-114). The source deliberately retained the sha tag,
#     which is exactly what keeps a revision addressable — and therefore warm —
#     forever.
#   * the `:<head-sha>` preview image tag is gone; see deploy-preview.
#   * `report-failure` files against this repo, not the archived one.
#
# The deploy lane is gated on `vars.PREPROCESS_DEPLOY_ENABLED == 'true'`. An
# unset variable is not 'true', so the lane is dormant by default (fail-closed).

on:
  pull_request:
    paths:
      - "services/preprocess/**"
      # The workflow's own path is included so a change to THIS file is
      # exercised by the PR that makes it. Without it a syntax error here ships
      # unreviewed by CI (browser.yml has that gap; it is not copied).
      - ".github/workflows/preprocess.yml"
  push:
    branches: [main]
    paths:
      - "services/preprocess/**"
      - ".github/workflows/preprocess.yml"
  workflow_dispatch:

concurrency:
  # NOTE the `preprocess-` prefix: reusing browser.yml's `browser-ci-` group
  # would make a preprocess PR cancel an in-flight browser run.
  # PRs group per-PR and cancel so rapid pushes don't stack redundant builds.
  # Pushes group per-ref without cancel so back-to-back merges serialize
  # cleanly through dev -> prod.
  group: preprocess-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: services/preprocess

env:
  SERVICE: neonbinder-preprocess
  REGION: us-central1
  DEV_PROJECT: neonbinder-dev
  PROD_PROJECT: neonbinder
  DEV_IMAGE: gcr.io/neonbinder-dev/neonbinder-preprocess
  PROD_IMAGE: gcr.io/neonbinder/neonbinder-preprocess

jobs:
  # Unit tests + lint. Mirrors pr-pipeline.yml's `preprocess-test` on purpose:
  # that copy is what the required `CI Gate` aggregates, this copy is what gates
  # the push-to-main deploy lane, which a PR-only workflow cannot cover.
  #
  # Integration tests (real Vision + Anthropic against fixture images) are NOT
  # run in CI — the fixtures live in GCS and are gitignored. Smoke tests against
  # the deployed URL cover end-to-end validation.
  # Name is deliberately NOT "Preprocess lint + unit tests" — that is
  # pr-pipeline.yml's copy, and two checks with the same name are
  # indistinguishable in the PR check list. Same split browser.yml uses:
  # "Build + unit tests" here (the workflow name already says which service),
  # "Browser build + unit tests" there.
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          # Action INPUT, so `defaults.run` does NOT apply — this resolves from
          # the workspace root and must carry the prefix explicitly.
          cache-dependency-path: services/preprocess/requirements*.txt
      # pip, pytest and --cov=app are all cwd-relative and depend on the
      # workflow-level `working-directory`. Ruff does not: `ruff check .` from
      # the repo root walks the tree to the same files and resolves config
      # per-file. Keeping the cwd right is still required for the other three.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/unit --cov=app --cov-report=term-missing --cov-fail-under=80

  # ---------------------------------------------------------------------------
  # PR preview path (PRs from branches in this repo).
  #
  # Each PR gets a stable `pr-<N>` tagged revision on the dev Cloud Run service.
  # Smoke runs against the same preview URL a human would QA against.
  # Traffic-serving dev (main's HEAD) is untouched. Fork PRs are skipped
  # because they cannot access WIF/OIDC.
  #
  # Teardown lives in preview-cleanup.yml on `pull_request: closed`.
  # ---------------------------------------------------------------------------
  deploy-preview:
    name: Deploy per-PR Cloud Run preview
    needs: test
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.PREPROCESS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # 30, not browser's 15: the Dockerfile bakes ~375MB of SAM weights pulled
    # from HuggingFace on every build, with no layer cache.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      preview_url: ${{ steps.capture.outputs.preview_url }}
      preview_tag: ${{ steps.capture.outputs.preview_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS_DEV }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push preview image
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # `.` is the JOB's working-directory (services/preprocess), so the
          # build context, Dockerfile and .dockerignore are all the service's
          # own — `COPY requirements.txt .` and `COPY app ./app` resolve
          # unchanged from the standalone repo. Building from the repo root
          # would upload apps/web/node_modules as context and then fail.
          #
          # The source also pushed a `:<head-sha>` tag for "merge-to-main
          # artifact promotion". That path is unreachable here: this repo is
          # squash-merge only, so github.sha on main is a NEW commit and can
          # never equal a PR head SHA. All it did was leave a multi-GB image
          # per push that preview-cleanup never deleted.
          docker build -t "$DEV_IMAGE:pr-$PR_NUMBER" .
          docker push "$DEV_IMAGE:pr-$PR_NUMBER"

      - name: Deploy tagged no-traffic preview to dev Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: neonbinder-preprocess
          region: us-central1
          image: gcr.io/neonbinder-dev/neonbinder-preprocess:pr-${{ github.event.pull_request.number }}
          project_id: neonbinder-dev
          # env_vars is REPLACE-semantics for plain env vars, so every plain var
          # terraform sets on the service must be repeated here or the deploy
          # drops it. Secret-backed vars (INTERNAL_API_KEY, ANTHROPIC_API_KEY)
          # are managed separately via --set-secrets and are NOT affected.
          env_vars: |
            ENVIRONMENT=dev
            GOOGLE_CLOUD_PROJECT=neonbinder-dev
          no_traffic: true
          tag: pr-${{ github.event.pull_request.number }}

      - id: capture
        name: Capture preview URL
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          TAG="pr-$PR"
          TAGGED_URL=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$DEV_PROJECT" --format=json \
            | jq -r ".status.traffic[] | select(.tag == \"$TAG\") | .url")
          if [ -z "$TAGGED_URL" ] || [ "$TAGGED_URL" = "null" ]; then
            echo "::error::preview URL for tag=$TAG not found on service."
            exit 1
          fi
          echo "preview_url=$TAGGED_URL" >> "$GITHUB_OUTPUT"
          echo "preview_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $TAGGED_URL"

  preview-smoke:
    name: Smoke the preview
    needs: deploy-preview
    if: needs.deploy-preview.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/preprocess/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS_DEV }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Fetch internal API key (dev)
        env:
          SMOKE_TARGET_URL: ${{ needs.deploy-preview.outputs.preview_url }}
        run: |
          # `set -euo pipefail` and the emptiness assertions are load-bearing.
          # tests/smoke calls pytest.skip() when SMOKE_TARGET_URL or
          # SMOKE_INTERNAL_KEY is unset, so without these a failed secret fetch
          # would skip every test and exit 0 — a green smoke that ran nothing.
          set -euo pipefail
          KEY=$(gcloud secrets versions access latest --secret=internal-api-key --project="$DEV_PROJECT")
          echo "::add-mask::$KEY"
          [ -n "$KEY" ] || { echo "::error::internal-api-key came back empty"; exit 1; }
          [ -n "${SMOKE_TARGET_URL:-}" ] || { echo "::error::SMOKE_TARGET_URL is empty"; exit 1; }
          echo "SMOKE_INTERNAL_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Run smoke tests against preview
        env:
          SMOKE_TARGET_URL: ${{ needs.deploy-preview.outputs.preview_url }}
        run: pytest tests/smoke -v

  # Sticky PR comment with preview URL + results. Runs regardless of outcome so
  # a failure still leaves a trace pointing at the run.
  comment-preview:
    name: Comment preview URL
    needs: [deploy-preview, preview-smoke]
    if: |
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.PREPROCESS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        # This job never checks out, so the workflow-level
        # `working-directory: services/preprocess` would point at a
        # non-existent path and every run step would fail.
        working-directory: ${{ github.workspace }}
    steps:
      - name: Sticky preview comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ needs.deploy-preview.outputs.preview_url }}
          TAG: ${{ needs.deploy-preview.outputs.preview_tag }}
          DEPLOY_RESULT: ${{ needs.deploy-preview.result }}
          SMOKE_RESULT: ${{ needs.preview-smoke.result }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          status() {
            case "$1" in
              success) echo "PASS" ;;
              failure) echo "FAIL" ;;
              cancelled) echo "CANCELLED" ;;
              skipped) echo "skipped" ;;
              *) echo "$1" ;;
            esac
          }

          URL_LINE="not deployed — see workflow run"
          if [ "$DEPLOY_RESULT" = "success" ] && [ -n "$URL" ]; then
            URL_LINE="$URL"
          fi

          # Marker invariant: comment lookup below is a SUBSTRING match, so no
          # marker may be a substring of another. This one and browser.yml's
          # `neonbinder-browser-preview-marker` are disjoint. Never introduce a
          # generic `neonbinder-preview-marker`.
          cat > body.md <<EOF
          <!-- neonbinder-preprocess-preview-marker -->
          ## Preprocess service preview

          **URL:** $URL_LINE
          **Tag:** \`$TAG\`

          **Checks**
          - Deploy: $(status "$DEPLOY_RESULT")
          - Smoke: $(status "$SMOKE_RESULT")

          Preview auto-updates on each push to this PR and is torn down when the PR closes. [Workflow run]($RUN_URL)
          EOF

          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("neonbinder-preprocess-preview-marker")) | .id' \
            | head -n 1)

          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$(cat body.md)" > /dev/null
            echo "Updated sticky comment $EXISTING."
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$(cat body.md)" > /dev/null
            echo "Created sticky comment."
          fi

  # ---------------------------------------------------------------------------
  # Push-to-main flow.
  #
  #   test -> build-push -> deploy-dev -> dev-smoke -> dev-promote
  #                                                        |
  #                                                   deploy-prod
  #                                                        |
  #                                                    prod-smoke
  #                                                        |
  #                                                   prod-promote
  #
  # Build happens ONCE; the same image bytes are retagged for prod. BOTH envs
  # use blue/green (no_traffic + sha tag, smoke the tagged URL, then promote),
  # so a failed smoke leaves that environment serving its previous revision and
  # there is nothing to roll back.
  #
  # This is the NEO-67 fix. The source deployed dev at 100% traffic FIRST and
  # then smoked it, so a failure meant dev was already broken; a `dev-rollback`
  # job tried to repair that using the NEO-34 `status.traffic[0].revisionName`
  # query, which can select a revision that is not the one actually serving.
  # Deploying at 0% removes the entire failure class instead of patching it.
  # ---------------------------------------------------------------------------

  build-push:
    name: Build + push image (dev + prod GCR)
    needs: test
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.PREPROCESS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      short_sha: ${{ steps.short.outputs.short_sha }}
      deploy_tag: ${{ steps.short.outputs.deploy_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: short
        name: Compute sha tag
        run: |
          set -euo pipefail
          SHORT="$(echo "$GITHUB_SHA" | cut -c1-7)"
          echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"
          echo "deploy_tag=sha-$SHORT" >> "$GITHUB_OUTPUT"

      - name: Auth to dev
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS_DEV }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for GCR (dev)
        run: gcloud auth configure-docker --quiet

      - name: Build + push to dev GCR
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$DEV_IMAGE:$SHA" -t "$DEV_IMAGE:latest" .
          docker push "$DEV_IMAGE:$SHA"
          docker push "$DEV_IMAGE:latest"

      # The prod steps below are guarded on `push` so a validation
      # `workflow_dispatch` can exercise the dev build without ever writing to
      # the production registry. The source had no such guard.
      - name: Re-auth to prod
        if: github.event_name == 'push'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER }}

      - name: Configure Docker for GCR (prod)
        if: github.event_name == 'push'
        run: gcloud auth configure-docker --quiet

      - name: Retag + push to prod GCR
        if: github.event_name == 'push'
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Same image bytes, new tags under the prod project path — prod never
          # rebuilds, so what smoke passed in dev is bit-identical to prod.
          docker tag "$DEV_IMAGE:$SHA" "$PROD_IMAGE:$SHA"
          docker tag "$DEV_IMAGE:$SHA" "$PROD_IMAGE:latest"
          docker push "$PROD_IMAGE:$SHA"
          docker push "$PROD_IMAGE:latest"

  deploy-dev:
    name: Deploy dev (no-traffic, sha tag)
    needs: build-push
    if: |
      github.event_name == 'push'
      && vars.PREPROCESS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      new_revision: ${{ steps.capture-new.outputs.new_revision }}
      tagged_url: ${{ steps.capture-new.outputs.tagged_url }}
      prev_revision: ${{ steps.capture-prev.outputs.prev_revision }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS_DEV }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - id: capture-prev
        name: Capture dev's currently-serving revision
        # REPORTING INPUT ONLY — this feeds report-failure's blast-radius line.
        # It is NOT a rollback source. The new revision lands at 0% traffic and
        # is promoted only after dev-smoke passes, so on any failure path dev
        # never stopped serving this revision. Do not reintroduce a rollback
        # job from the presence of this step (NEO-67 / NEO-34).
        run: |
          PREV=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$DEV_PROJECT" \
            --format='value(status.traffic[0].revisionName)')
          echo "Previous dev revision: $PREV"
          echo "prev_revision=$PREV" >> "$GITHUB_OUTPUT"

      - name: Deploy to dev Cloud Run (no_traffic + sha tag)
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: neonbinder-preprocess
          region: us-central1
          image: gcr.io/neonbinder-dev/neonbinder-preprocess:${{ github.sha }}
          project_id: neonbinder-dev
          env_vars: |
            ENVIRONMENT=dev
            GOOGLE_CLOUD_PROJECT=neonbinder-dev
          no_traffic: true
          tag: ${{ needs.build-push.outputs.deploy_tag }}

      - id: capture-new
        name: Capture new dev revision + tagged URL
        env:
          TAG: ${{ needs.build-push.outputs.deploy_tag }}
        run: |
          set -euo pipefail
          NEW=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$DEV_PROJECT" \
            --format='value(status.latestCreatedRevisionName)')
          TAGGED_URL=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$DEV_PROJECT" --format=json \
            | jq -r ".status.traffic[] | select(.tag == \"$TAG\") | .url")
          if [ -z "$TAGGED_URL" ] || [ "$TAGGED_URL" = "null" ]; then
            echo "::error::tagged URL for tag=$TAG not found on service."
            exit 1
          fi
          echo "new_revision=$NEW" >> "$GITHUB_OUTPUT"
          echo "tagged_url=$TAGGED_URL" >> "$GITHUB_OUTPUT"

  dev-smoke:
    name: Smoke dev (tagged URL)
    needs: deploy-dev
    if: github.event_name == 'push' && needs.deploy-dev.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/preprocess/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS_DEV }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Fetch internal API key (dev)
        env:
          SMOKE_TARGET_URL: ${{ needs.deploy-dev.outputs.tagged_url }}
        run: |
          set -euo pipefail
          KEY=$(gcloud secrets versions access latest --secret=internal-api-key --project="$DEV_PROJECT")
          echo "::add-mask::$KEY"
          [ -n "$KEY" ] || { echo "::error::internal-api-key came back empty"; exit 1; }
          [ -n "${SMOKE_TARGET_URL:-}" ] || { echo "::error::SMOKE_TARGET_URL is empty"; exit 1; }
          echo "SMOKE_INTERNAL_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Run smoke tests against dev tagged URL
        env:
          SMOKE_TARGET_URL: ${{ needs.deploy-dev.outputs.tagged_url }}
        run: pytest tests/smoke -v

  dev-promote:
    name: Promote dev to 100%
    needs: [build-push, deploy-dev, dev-smoke]
    if: |
      github.event_name == 'push'
      && vars.PREPROCESS_DEPLOY_ENABLED == 'true'
      && needs.dev-smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS_DEV }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER_DEV }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Promote and drop the scratch tag
        env:
          NEW_REVISION: ${{ needs.deploy-dev.outputs.new_revision }}
          TAG: ${{ needs.build-push.outputs.deploy_tag }}
        run: |
          set -euo pipefail
          # ONE atomic call (NEO-114). Promoting and then removing the tag in a
          # separate step leaves a window — and if the second call is skipped
          # entirely, as the source workflow did deliberately, the tag keeps the
          # revision addressable and therefore warm forever. That is what pinned
          # idle instances and drove the cost incident.
          gcloud run services update-traffic "$SERVICE" \
            --region="$REGION" --project="$DEV_PROJECT" \
            --to-revisions="$NEW_REVISION=100" \
            --remove-tags="$TAG"

  deploy-prod:
    name: Deploy prod (no-traffic, sha tag)
    needs: [build-push, dev-promote]
    if: |
      github.event_name == 'push'
      && vars.PREPROCESS_DEPLOY_ENABLED == 'true'
      && needs.dev-promote.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      new_revision: ${{ steps.capture-new.outputs.new_revision }}
      tagged_url: ${{ steps.capture-new.outputs.tagged_url }}
      prev_revision: ${{ steps.capture-prev.outputs.prev_revision }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - id: capture-prev
        name: Capture prod's currently-serving revision
        # Reporting input only — same rationale as deploy-dev's copy.
        run: |
          PREV=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROD_PROJECT" \
            --format='value(status.traffic[0].revisionName)')
          echo "Previous prod revision: $PREV"
          echo "prev_revision=$PREV" >> "$GITHUB_OUTPUT"

      - name: Deploy to prod Cloud Run (no_traffic + sha tag)
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: neonbinder-preprocess
          region: us-central1
          image: gcr.io/neonbinder/neonbinder-preprocess:${{ github.sha }}
          project_id: neonbinder
          env_vars: |
            ENVIRONMENT=prod
            GOOGLE_CLOUD_PROJECT=neonbinder
          no_traffic: true
          tag: ${{ needs.build-push.outputs.deploy_tag }}

      - id: capture-new
        name: Capture new prod revision + tagged URL
        env:
          TAG: ${{ needs.build-push.outputs.deploy_tag }}
        run: |
          set -euo pipefail
          NEW=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROD_PROJECT" \
            --format='value(status.latestCreatedRevisionName)')
          TAGGED_URL=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROD_PROJECT" --format=json \
            | jq -r ".status.traffic[] | select(.tag == \"$TAG\") | .url")
          if [ -z "$TAGGED_URL" ] || [ "$TAGGED_URL" = "null" ]; then
            echo "::error::tagged URL for tag=$TAG not found on service."
            exit 1
          fi
          echo "new_revision=$NEW" >> "$GITHUB_OUTPUT"
          echo "tagged_url=$TAGGED_URL" >> "$GITHUB_OUTPUT"

  prod-smoke:
    name: Smoke prod (tagged URL)
    needs: deploy-prod
    if: github.event_name == 'push' && needs.deploy-prod.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/preprocess/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Fetch internal API key (prod)
        env:
          SMOKE_TARGET_URL: ${{ needs.deploy-prod.outputs.tagged_url }}
        run: |
          set -euo pipefail
          KEY=$(gcloud secrets versions access latest --secret=internal-api-key --project="$PROD_PROJECT")
          echo "::add-mask::$KEY"
          [ -n "$KEY" ] || { echo "::error::internal-api-key came back empty"; exit 1; }
          [ -n "${SMOKE_TARGET_URL:-}" ] || { echo "::error::SMOKE_TARGET_URL is empty"; exit 1; }
          echo "SMOKE_INTERNAL_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Run smoke tests against prod tagged URL
        env:
          SMOKE_TARGET_URL: ${{ needs.deploy-prod.outputs.tagged_url }}
        run: pytest tests/smoke -v

  prod-promote:
    name: Promote prod to 100%
    needs: [build-push, deploy-prod, prod-smoke]
    if: |
      github.event_name == 'push'
      && vars.PREPROCESS_DEPLOY_ENABLED == 'true'
      && needs.prod-smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PREPROCESS }}
          service_account: ${{ secrets.GCP_SA_PREPROCESS_DEPLOYER }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Promote and drop the scratch tag
        env:
          NEW_REVISION: ${{ needs.deploy-prod.outputs.new_revision }}
          TAG: ${{ needs.build-push.outputs.deploy_tag }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" \
            --region="$REGION" --project="$PROD_PROJECT" \
            --to-revisions="$NEW_REVISION=100" \
            --remove-tags="$TAG"

  # Unified failure report: fires if any stage between test and promote failed.
  # Identifies the FIRST failed stage so the issue title names the actionable
  # step.
  report-failure:
    name: Report deploy failure
    needs: [test, build-push, deploy-dev, dev-smoke, dev-promote, deploy-prod, prod-smoke, prod-promote]
    if: |
      always() && github.event_name == 'push'
      && vars.PREPROCESS_DEPLOY_ENABLED == 'true'
      && (
        needs.test.result == 'failure' ||
        needs.build-push.result == 'failure' ||
        needs.deploy-dev.result == 'failure' ||
        needs.dev-smoke.result == 'failure' ||
        needs.dev-promote.result == 'failure' ||
        needs.deploy-prod.result == 'failure' ||
        needs.prod-smoke.result == 'failure' ||
        needs.prod-promote.result == 'failure'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Open GitHub issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R_TEST: ${{ needs.test.result }}
          R_BUILD: ${{ needs.build-push.result }}
          R_DEV: ${{ needs.deploy-dev.result }}
          R_DEV_SMOKE: ${{ needs.dev-smoke.result }}
          R_DEV_PROMOTE: ${{ needs.dev-promote.result }}
          R_PROD: ${{ needs.deploy-prod.result }}
          R_PROD_SMOKE: ${{ needs.prod-smoke.result }}
          R_PROMOTE: ${{ needs.prod-promote.result }}
          NEW_REV: ${{ needs.deploy-prod.outputs.new_revision }}
          DEV_NEW_REV: ${{ needs.deploy-dev.outputs.new_revision }}
          TAG: ${{ needs.build-push.outputs.deploy_tag }}
          TAGGED_URL: ${{ needs.deploy-prod.outputs.tagged_url }}
          DEV_TAGGED_URL: ${{ needs.deploy-dev.outputs.tagged_url }}
          PROD_PREV: ${{ needs.deploy-prod.outputs.prev_revision }}
          DEV_PREV: ${{ needs.deploy-dev.outputs.prev_revision }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Values are quoted because `STAGE=test` would otherwise read as an
          # assignment of the `test` shell builtin (shellcheck SC2209).
          if   [ "$R_TEST" = "failure" ];        then STAGE="test"
          elif [ "$R_BUILD" = "failure" ];       then STAGE="build-push"
          elif [ "$R_DEV" = "failure" ];         then STAGE="deploy-dev"
          elif [ "$R_DEV_SMOKE" = "failure" ];   then STAGE="dev-smoke"
          elif [ "$R_DEV_PROMOTE" = "failure" ]; then STAGE="dev-promote"
          elif [ "$R_PROD" = "failure" ];        then STAGE="deploy-prod"
          elif [ "$R_PROD_SMOKE" = "failure" ];  then STAGE="prod-smoke"
          elif [ "$R_PROMOTE" = "failure" ];     then STAGE="prod-promote"
          else STAGE="unknown"
          fi

          case "$STAGE" in
            test|build-push)
              BLAST="No infra touched. Dev and prod both still serving their previous revisions." ;;
            deploy-dev|dev-smoke)
              BLAST="Dev has a parked revision at 0% traffic (\`$DEV_NEW_REV\`, tag \`$TAG\`) and is STILL SERVING \`$DEV_PREV\`. Prod never touched. Tagged URL for poking: $DEV_TAGGED_URL" ;;
            dev-promote)
              BLAST="Dev blue/green smoke passed but the traffic shift itself failed. Dev is still serving \`$DEV_PREV\`. Prod never touched." ;;
            deploy-prod|prod-smoke)
              BLAST="Dev is serving main's HEAD. Prod has a parked revision at 0% traffic (\`$NEW_REV\`, tag \`$TAG\`) and is still serving \`$PROD_PREV\`. Tagged URL for poking: $TAGGED_URL" ;;
            prod-promote)
              BLAST="Dev is serving main's HEAD. Prod blue/green smoke passed but the traffic shift itself failed. Prod is still serving \`$PROD_PREV\` — re-run the promote job or investigate update-traffic errors." ;;
            *)
              BLAST="Unknown failure mode — check the run directly." ;;
          esac

          cat > body.md <<EOF
          Preprocess deploy failed at **\`$STAGE\`** for commit \`$SHA\`.

          **Blast radius:** $BLAST

          **Stage results**
          | Stage | Result |
          |---|---|
          | test | \`$R_TEST\` |
          | build-push | \`$R_BUILD\` |
          | deploy-dev | \`$R_DEV\` |
          | dev-smoke | \`$R_DEV_SMOKE\` |
          | dev-promote | \`$R_DEV_PROMOTE\` |
          | deploy-prod | \`$R_PROD\` |
          | prod-smoke | \`$R_PROD_SMOKE\` |
          | prod-promote | \`$R_PROMOTE\` |

          **Links**
          - Deploy run: $RUN_URL

          Fix forward in a new PR; close this issue when a subsequent green deploy lands.
          EOF

          # \${{ github.repository }}, not a hardcoded slug. The source hardcoded
          # the (now archived) standalone repo, which this token cannot write to
          # — so the failure reporter would itself fail, silently, at the end of
          # a job that only runs when something is already broken.
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Preprocess deploy failed at ${STAGE}: ${SHA}" \
            --body-file body.md

name: Recreate degraded preview

# NEO-392: when an E2E seed finds the PR's Convex preview degraded (its
# reference import ran past NB_SEED_MAX_IMPORT_S), e2e.yml deletes that preview
# and uploads a `preview-degraded-*` artifact. This re-runs the WHOLE PR
# Pipeline run once, so `web-preview` rebuilds and its `npx convex deploy`
# creates a fresh Convex preview. Never a failed-jobs-only re-run: that skips the
# seed (see CLAUDE.md, cloud rule 6).
#
# Bounded: only attempts 1 and 2 are re-run, so a preview that is slow again
# after recreation stops at attempt 3 for a person to look at.
#
# workflow_run always runs this file from the default branch.

on:
  workflow_run:
    workflows: ["PR Pipeline"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.run_attempt < 3
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run the whole pipeline if the preview was degraded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          # Artifacts listed for a run cover its latest attempt only when
          # filtered by creation time; the marker is uploaded by this attempt's
          # seed, so match on name and keep only ones newer than the attempt.
          started=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT" --jq '.run_started_at')
          n=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq "[.artifacts[] | select((.name | startswith(\"preview-degraded\")) and .created_at >= \"$started\")] | length")
          if [ "$n" = "0" ]; then
            echo "Run $RUN_ID attempt $ATTEMPT failed for another reason; nothing to do."
            exit 0
          fi
          echo "Run $RUN_ID attempt $ATTEMPT stopped on a degraded preview; re-running the whole workflow for a fresh one."
          gh run rerun "$RUN_ID" --repo "$REPO"
          echo "- Re-ran PR Pipeline run $RUN_ID (attempt $ATTEMPT hit a degraded preview, NEO-392)" >> "$GITHUB_STEP_SUMMARY"

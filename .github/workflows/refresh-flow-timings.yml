name: Refresh flow timings

# Keeps apps/web/playwright/timings.json (the longest-first shard-plan seed) "generally
# correct" as specs are added / changed, with no babysitting.
#
# It does NOT run the E2E suite. It downloads the `pw-merged` artifact (the merged
# Playwright JSON report, both passes, desktop and mobile) that e2e.yml's `e2e` job
# uploads on every PR Pipeline run,
# rewrites the timings with `shard-plan.mjs --from-results`, RE-ALIGNS them to main's
# current spec set (branch-only specs drop; specs the run did not measure keep their
# committed value; main-only specs fall to the planner's median default), and — when
# the table has drifted — force-pushes chore/flow-timings-refresh and posts a
# job-summary with a one-click "Compare & pull request" link.
#
# Why the nudge (not an auto-opened PR): this public repo is hardened so the built-in
# GITHUB_TOKEN can't create PRs (and a token-opened PR wouldn't auto-start the required
# `e2e` check anyway). You open the PR from the link — because you author it, `e2e` runs
# normally and it's mergeable. Timings only affect how specs are split across shards
# (longest-first), never pass/fail — review is a glance.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC. workflow_dispatch needs this file on main.
  workflow_dispatch:

permissions:
  contents: write # push the chore branch (you open the PR from it)

concurrency:
  group: refresh-flow-timings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web # shard-plan.mjs + playwright/ live here
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shard-plan.mjs is plain node (no dependencies), so no npm ci.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc

      - name: Download the latest PR Pipeline run's merged Playwright report
        id: dl
        run: |
          set -uo pipefail
          # The newest green runs may be dependency-only PRs (E2E skipped, so no
          # artifact): walk back through recent ones until one has pw-merged.
          for rid in $(gh run list --workflow "PR Pipeline" --status success --limit 15 \
                         --json databaseId --jq '.[].databaseId'); do
            rm -rf dl
            if gh run download "$rid" -n pw-merged -D dl 2>/dev/null && [ -f dl/results.json ]; then
              echo "Using PR Pipeline run $rid"
              echo "found=1" >> "$GITHUB_OUTPUT"
              echo "rid=$rid" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No recent successful 'PR Pipeline' run has a pw-merged artifact (expired, or none ran E2E) — nothing to refresh."
          echo "found=0" >> "$GITHUB_OUTPUT"

      - name: Rewrite timings, re-align to main's spec set, detect drift
        id: drift
        if: steps.dl.outputs.found == '1'
        run: |
          set -uo pipefail
          cp playwright/timings.json old-timings.json
          node playwright/shard-plan.mjs --from-results dl/results.json
          python3 - old-timings.json playwright/timings.json <<'PY'
          import json, os, sys

          old_doc = json.load(open(sys.argv[1]))
          new_doc = json.load(open(sys.argv[2]))

          def per_project(doc):
              # {project: {spec: seconds}} from either schema: `seconds` is
              # the desktop (e2e) run, `byProject` carries the others. A
              # legacy `projects` list (seconds summed over several projects)
              # is divided back to one project's figure.
              legacy = len(doc.get("projects") or []) or 1
              out = {"e2e": {k: v / legacy for k, v in doc.get("seconds", {}).items()}}
              for proj, secs in (doc.get("byProject") or {}).items():
                  out[proj] = dict(secs)
              return out

          old_pp = per_project(old_doc)
          measured_pp = per_project(new_doc)

          # main's current spec set (the checkout), same filter as shard-plan.mjs.
          tests = "playwright/tests"
          excluded = {"setup.spec.ts", "profile/worker-bootstrap.spec.ts"}
          current = set()
          for root, _, files in os.walk(tests):
              for f in files:
                  rel = os.path.relpath(os.path.join(root, f), tests).replace(os.sep, "/")
                  if rel.endswith(".spec.ts") and rel not in excluded:
                      current.add(rel)

          # Per project: measured value where the run has one, else the
          # committed value; branch-only specs (not on main) are dropped.
          merged_pp, old_pp_r = {}, {}
          reasons = []
          drift = False
          for proj in sorted(set(old_pp) | set(measured_pp)):
              measured = measured_pp.get(proj, {})
              old = {k: round(v) for k, v in old_pp.get(proj, {}).items()}
              old_pp_r[proj] = old
              merged = {}
              for spec in sorted(current):
                  if spec in measured:
                      merged[spec] = measured[spec]
                  elif spec in old:
                      merged[spec] = old[spec]
              merged_pp[proj] = merged
              added = [p for p in merged if p not in old]
              removed = [p for p in old if p not in merged]
              if added:
                  reasons.append(f"[{proj}] {len(added)} added: " + ", ".join(p.split("/")[-1] for p in added[:5]))
              if removed:
                  reasons.append(f"[{proj}] {len(removed)} removed: " + ", ".join(p.split("/")[-1] for p in removed[:5]))
              moved = []
              for p in set(old) & set(merged):
                  o, n = old[p], merged[p]
                  if abs(n - o) >= max(10, 0.20 * o):  # >= max(20%, 10s)
                      moved.append((p, o, n))
              if moved:
                  moved.sort(key=lambda x: -abs(x[2] - x[1]))
                  reasons.append(f"[{proj}] {len(moved)} moved, e.g. " +
                      ", ".join(f"{p.split('/')[-1]} {o}->{n}s" for p, o, n in moved[:5]))
              drift = drift or bool(added or removed or moved)
          reason = "; ".join(reasons) if reasons else "no material drift"
          print("Drift:", drift, "-", reason)

          if drift:
              out = {"_source": new_doc.get("_source", old_doc.get("_source", "")),
                     "seconds": merged_pp.get("e2e", {})}
              extra = {k: v for k, v in merged_pp.items() if k != "e2e" and v}
              if extra:
                  out["byProject"] = extra
              with open(sys.argv[2], "w") as fh:
                  fh.write(json.dumps(out, indent=2) + "\n")
          else:
              with open(sys.argv[2], "w") as fh:
                  fh.write(json.dumps(old_doc, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"drift={'true' if drift else 'false'}\n")
              fh.write(f"reason={reason}\n")
          PY

      - name: Push refreshed timings + post PR nudge
        if: steps.dl.outputs.found == '1' && steps.drift.outputs.drift == 'true'
        env:
          RID: ${{ steps.dl.outputs.rid }}
          REASON: ${{ steps.drift.outputs.reason }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR=chore/flow-timings-refresh
          git checkout -B "$BR"
          git add playwright/timings.json
          if git diff --cached --quiet; then
            echo "Candidate is byte-identical to committed — nothing to commit."; exit 0
          fi
          git commit \
            -m "chore(e2e): refresh shard timings from run ${RID}" \
            -m "${REASON}" \
            -m "Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
          git push --force origin "$BR"
          # Nudge only — the hardened public repo blocks GITHUB_TOKEN from opening PRs, so
          # a maintainer opens it from this link (authoring it triggers the required `e2e`
          # gate). The force-push above auto-updates an already-open PR — no gh pr calls.
          COMPARE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BR}?expand=1"
          {
            echo "## Spec-timings drift detected"
            echo ""
            echo "**Drift:** ${REASON}"
            echo ""
            echo "Refreshed timings pushed to \`${BR}\` (from PR Pipeline run \`${RID}\`)."
            echo ""
            echo "➡️ **[Open the PR to apply](${COMPARE})** — you author it, so the required \`e2e\` check runs and it's mergeable."
            echo ""
            echo "_Timings only affect how specs are split across shards (longest-first), never pass/fail — review is a glance._"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Nudge posted. Open the PR: ${COMPARE}"

  # NEO-310: one Discord message when this weekly chore run fails, one
  # "recovered" message the next time it goes green after a failure. Note
  # `refresh` succeeding is the normal case whether or not drift was found —
  # only an actual failure (bad artifact, git push rejected, etc.) is a
  # failure here.
  notify:
    name: Notify Discord
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine status
        id: status
        env:
          RESULT: ${{ needs.refresh.result }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify on failure
        if: steps.status.outputs.status == 'failed'
        uses: ./.github/actions/notify-discord
        with:
          webhook-url: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          status: failed
          workflow: "Refresh flow timings"
          details: "refresh"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ref: ${{ github.ref_name }}
          event: ${{ github.event_name }}

      - name: Check for recovery
        id: recovery
        if: steps.status.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          bash .github/scripts/discord-notify-recovered.sh \
            "refresh-flow-timings.yml" "$EVENT_NAME" "$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Notify on recovery
        if: steps.status.outputs.status == 'success' && steps.recovery.outputs.recovered == 'true'
        uses: ./.github/actions/notify-discord
        with:
          webhook-url: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          status: recovered
          workflow: "Refresh flow timings"
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ref: ${{ github.ref_name }}
          event: ${{ github.event_name }}

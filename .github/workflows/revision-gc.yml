name: Cloud Run Revision GC

# Backstop for NEO-114.
#
# browser.yml now drops each deploy's `sha-<short>` scratch tag as part of the
# promote step, which closes the leak at the source. But promotion only happens
# on a successful deploy — a run that deploys and then fails its login probe
# leaves a tagged, never-promoted revision behind. Under the old
# `--min-instances=1` those revisions each held a warm instance 24/7; 27 of them
# across dev and prod were costing $869.63/month, ~90% of the entire GCP bill.
#
# This sweep reclaims whatever slips through. It is deliberately conservative:
# dry-run unless explicitly applied, never touches the serving revision, and
# keeps the 5 most recent revisions for rollback.

on:
  schedule:
    # 09:00 UTC Sunday — 04:00 CDT / 03:00 CST, well clear of the E2E queue.
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually delete (unchecked = dry-run report only)'
        type: boolean
        default: false
      keep:
        description: 'Number of recent revisions to retain'
        type: string
        default: '5'

# Never let two sweeps mutate the same service concurrently.
concurrency:
  group: revision-gc
  cancel-in-progress: false

jobs:
  gc:
    name: GC ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # fail-fast off: prod must still be swept if dev errors, and vice versa —
      # each environment bills independently.
      fail-fast: false
      matrix:
        include:
          - env: dev
            project: neonbinder-dev
            wif: GCP_WIF_PROVIDER_DEV
            sa: GCP_SERVICE_ACCOUNT_DEPLOYER_DEV
          - env: prod
            project: neonbinder
            wif: GCP_WIF_PROVIDER
            sa: GCP_SERVICE_ACCOUNT_DEPLOYER
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets[matrix.wif] }}
          service_account: ${{ secrets[matrix.sa] }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Sweep stale revisions
        env:
          PROJECT: ${{ matrix.project }}
          KEEP: ${{ inputs.keep || '5' }}
          # Scheduled runs apply; manual dispatch is dry-run unless the box is
          # ticked. That way the weekly job actually reclaims instances, while a
          # human poking at it by hand cannot delete anything by accident.
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          set -euo pipefail
          ARGS=(--project "$PROJECT" --keep "$KEEP")
          if [ "$APPLY" = "true" ]; then
            ARGS+=(--apply)
          fi
          bash scripts/cleanup-cloudrun-revisions.sh "${ARGS[@]}" | tee "$RUNNER_TEMP/gc.log"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Revision GC — ${{ matrix.env }} (\`${{ matrix.project }}\`)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/gc.log" 2>/dev/null || echo "(no output — the sweep failed before reporting)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: Cloud Run Revision Image Check

# Detector for NEO-130.
#
# A Cloud Run revision immutably pins the image DIGEST it was deployed with, and
# every revision here runs minScale=0 — nothing holds the image open. If an
# Artifact Registry cleanup policy collects that digest, the revision is dead:
# the next request cold-starts against a missing image and fails, and the
# revision cannot be repaired, only replaced.
#
# That already happened once (neonbinder-browser-00001-47f in prod) and nothing
# noticed. Retention policies are tuned to make it unlikely — keep_count plus an
# age gate, and since NEO-130 previews live in their own package so they no
# longer consume the deploy keep-window — but "unlikely" is not "detected".
# This is the backstop that makes the failure mode loud regardless of which
# policy or tuning error caused it.
#
# Read-only: it never deletes or modifies anything.

on:
  schedule:
    # 10:00 UTC Sunday — deliberately ONE HOUR AFTER revision-gc (09:00 UTC).
    # Running after the sweep means this observes the post-GC state, so a GC
    # that collects something load-bearing is caught the same morning rather
    # than a week later.
    - cron: "0 10 * * 0"
  workflow_dispatch:
  # Also runs on changes to itself or the script, so the checker cannot ship
  # broken and sit silently green until someone reads a cron summary.
  pull_request:
    paths:
      - ".github/workflows/revision-image-check.yml"
      - "scripts/check-revision-images.sh"

concurrency:
  group: revision-image-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Image check ${{ matrix.service }} ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A missing image in one service/env says nothing about the others, and
      # each is independently actionable — so never let one failure mask the
      # rest.
      fail-fast: false
      matrix:
        # Same service x env shape as revision-gc.yml, and each service
        # authenticates as its OWN deployer SA. Both hold project-wide
        # roles/run.admin, so either could read either service — keeping them
        # separate means revoking a deploy lane also revokes its checks.
        include:
          - service: neonbinder-browser
            env: dev
            project: neonbinder-dev
            wif: GCP_WIF_PROVIDER_DEV
            sa: GCP_SERVICE_ACCOUNT_DEPLOYER_DEV
          - service: neonbinder-browser
            env: prod
            project: neonbinder
            wif: GCP_WIF_PROVIDER
            sa: GCP_SERVICE_ACCOUNT_DEPLOYER
          - service: neonbinder-preprocess
            env: dev
            project: neonbinder-dev
            wif: GCP_WIF_PROVIDER_PREPROCESS_DEV
            sa: GCP_SA_PREPROCESS_DEPLOYER_DEV
          - service: neonbinder-preprocess
            env: prod
            project: neonbinder
            wif: GCP_WIF_PROVIDER_PREPROCESS
            sa: GCP_SA_PREPROCESS_DEPLOYER
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fork PRs get no OIDC, so the auth step would fail confusingly. Skip the
      # whole check there rather than go red on something a fork cannot fix.
      - name: Guard — same-repo only
        id: guard
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::notice::fork PR — no OIDC available, skipping"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets[matrix.wif] }}
          service_account: ${{ secrets[matrix.sa] }}

      - if: steps.guard.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Check revision images
        if: steps.guard.outputs.ready == 'true'
        env:
          PROJECT: ${{ matrix.project }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -uo pipefail
          # --service is passed EXPLICITLY and the script refuses to default it,
          # so adding a service to the matrix cannot silently check the wrong one.
          bash scripts/check-revision-images.sh \
            --project "$PROJECT" --service "$SERVICE" | tee "$RUNNER_TEMP/check.log"
          exit "${PIPESTATUS[0]}"

      - name: Summarise
        if: always() && steps.guard.outputs.ready == 'true'
        run: |
          {
            echo "### Revision image check — \`${{ matrix.service }}\` in ${{ matrix.env }} (\`${{ matrix.project }}\`)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/check.log" 2>/dev/null || echo "(no output — the check failed before reporting)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

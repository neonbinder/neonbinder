name: Secret Version GC

# Backstop for NEO-115.
#
# BSC sessions expire on a one-hour TOKEN_TTL_MS, and each expiry historically
# wrote new secret versions instead of reusing the existing one — twice per
# refresh — instead of destroying the ones they replaced. neonbinder-dev had
# accumulated 1,326 ENABLED versions across 33 secrets (~$70/month), growing
# ~25/day. The write-back path is fixed separately to stop new accumulation
# at the source; this sweep reclaims the existing backlog and catches
# anything that slips through again.
#
# This sweep is deliberately conservative: dry-run unless explicitly applied,
# never destroys the newest version of any secret, and only touches ENABLED
# versions.
#
# DEPENDENCY: this job authenticates as a dedicated `neonbinder-secret-gc`
# service account that is created, granted (`roles/secretmanager.viewer` +
# `roles/secretmanager.secretVersionManager`) and pinned to this workflow file
# in the neonbinder_terraform repo. Until that ships, WIF cannot mint a token
# for the SA at all and every run here fails to authenticate.
#
# Renaming or moving this file BREAKS auth: the SA's workloadIdentityUser
# binding matches on GitHub's `job_workflow_ref` claim, which embeds the literal
# path `.github/workflows/secret-version-gc.yml`. Update
# `secret_gc_workflow_ref` in neonbinder_terraform/variables.tf in the same
# change if this file ever moves.

on:
  schedule:
    # 03:00 UTC Sunday — 22:00 CDT / 21:00 CST Saturday, well clear of both
    # the E2E queue and revision-gc.yml's 09:00 UTC Sunday run.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually destroy (unchecked = dry-run report only)'
        type: boolean
        default: false
      keep:
        description: 'Number of newest ENABLED versions to retain per secret'
        type: string
        default: '1'

# Never let two sweeps mutate the same project's secrets concurrently.
concurrency:
  group: secret-version-gc
  cancel-in-progress: false

jobs:
  gc:
    name: GC ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # fail-fast off: prod must still be swept if dev errors, and vice versa
      # — each environment bills and grows independently.
      fail-fast: false
      matrix:
        # `sa` is the dedicated neonbinder-secret-gc identity, NOT the
        # neonbinder-browser-deployer SA the other workflows use. It holds only
        # secretmanager.viewer + secretVersionManager (no accessor — it cannot
        # read a payload), and its workloadIdentityUser binding is pinned to
        # THIS workflow file via the job_workflow_ref OIDC claim, so no other
        # workflow and no PR preview can mint a token for it. Defined in
        # neonbinder_terraform (google_service_account.secret_gc); see the long
        # rationale above it there.
        #
        # Written inline rather than kept in a GitHub secret deliberately: an SA
        # email is not sensitive, the project IDs sit in plaintext two lines
        # away, and inlining removes a manual repo-settings step that could
        # silently drift from what Terraform actually created.
        include:
          - env: dev
            project: neonbinder-dev
            wif: GCP_WIF_PROVIDER_DEV
            sa: neonbinder-secret-gc@neonbinder-dev.iam.gserviceaccount.com
          - env: prod
            project: neonbinder
            wif: GCP_WIF_PROVIDER
            sa: neonbinder-secret-gc@neonbinder.iam.gserviceaccount.com
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets[matrix.wif] }}
          service_account: ${{ matrix.sa }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Sweep stale secret versions
        env:
          PROJECT: ${{ matrix.project }}
          KEEP: ${{ inputs.keep || '1' }}
          # Scheduled runs apply; manual dispatch is dry-run unless the box is
          # ticked. That way the weekly job actually reclaims versions, while
          # a human poking at it by hand cannot destroy anything by accident.
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          set -euo pipefail
          ARGS=(--project "$PROJECT" --keep "$KEEP")
          if [ "$APPLY" = "true" ]; then
            ARGS+=(--apply)
          fi
          bash scripts/prune-secret-versions.sh "${ARGS[@]}" | tee "$RUNNER_TEMP/gc.log"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Secret Version GC — ${{ matrix.env }} (\`${{ matrix.project }}\`)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/gc.log" 2>/dev/null || echo "(no output — the sweep failed before reporting)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

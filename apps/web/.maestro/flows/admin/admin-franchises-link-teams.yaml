appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/admin/players&worker=${WORKER_INDEX || "0"}
name: "Franchises — two team rows are strung onto one franchise from the team side, and taken off again from the franchise side"
tags:
  - admin
---
# R1 — ONE FEATURE (NEO-254): **franchise MEMBERSHIP**. A franchise is an
# operator saying that two separately-named team rows are one continuous club,
# and this flow drives the whole round trip of that decision:
#   Team Management's Franchise picker STARTS a thread and puts team A on it →
#   the same picker puts team B on the SAME thread by picking the pill →
#   Franchise Management shows both on the thread →
#   "Remove <team>" takes one back off.
# Nothing else in the product can do any of that.
#
# ── WHY THIS FLOW EXISTS ONLY NOW ───────────────────────────────────────────
# It could not be written before 4666a57. The Franchise control was a native
# `<select>`, and maestro-web gives an `<option>` synthetic tap bounds from its
# index inside its own parent, then resolves a tap by scanning
# `document.querySelectorAll('option')` in DOCUMENT ORDER and taking the FIRST
# bounds match — so on a page with several selects only the first is reachable.
# `/admin/teams` had `league-filter`, then `team-league`, then `team-franchise`:
# a tap meant for the third silently mutated the first. 4666a57 rebuilt it as a
# `role="radiogroup"` of `role="radio"` pills with a separate
# "+ Start a new franchise…" disclosure — the same remedy `NewTeamForm` already
# used for its League pills — and that is what makes every step below possible.
#
# ⚠️ The League `<select>` beside it still has the defect and is deliberately
# NOT touched by this flow (deferred, per that commit's own note). Do not add a
# league here; the tap would land in the screen's league FILTER.
#
# R2 — HARD ASSERTIONS, none satisfiable by an inert page:
#     (a) both teams really were written: after a page load, filtering
#         `/admin/teams` by this run's token reads "2 of N teams";
#     (b) the thread is STARTED, not adopted: the inline box's pill appears
#         carrying this run's own franchise name, which no other row can be;
#     (c) team A's link is COMMITTED by Save, not by picking — the franchise
#         view is reached from team B's own "See the franchise" deep link, and
#         it can only name a franchise id that a save actually stored;
#     (d) BOTH teams are on ONE thread: "2 teams on this thread" plus both
#         composed names. Two rows that merely *have* a franchise each would
#         not produce this — the count is the join, read back out of Convex by
#         a different query (`franchises.get`) than the one that wrote it;
#     (e) removal is real and is only a LINK being cut: the thread drops to
#         "1 team on this thread", team B is gone from it, and team A is
#         untouched beside it.
#     There are no `when:` branches and no conditional runFlow, so no path
#     reaches the end without exercising all of it.
#
# R3 — DEDUP. Nothing else links a team to a franchise.
#   * `admin-franchises-start-and-rename.yaml` owns the franchise ROW — start
#     it, name it, rename it — and asserts an EMPTY thread. It never links.
#   * `player-management-add-and-career-history.yaml` owns adding a player and
#     recording stints; this flow adds no stint and never saves the player.
#   * `team-management-edit-a-team.yaml` owns the Location/Name split and the
#     colours; this flow edits neither.
#   The "mint a player, then create a team through its career picker" PREAMBLE
#   is shared with those last two by copy, not by util — there is no
#   `util-create-team-*` in the suite today, and extracting one would mean
#   editing two flows this change has no other reason to touch. Worth doing as
#   its own change; noted rather than smuggled in here. (R9 governs set-builder
#   drilling, and this flow does none.)
#
# ── WHY A PLAYER IS MINTED AT ALL ───────────────────────────────────────────
# Because there is no other door. A team row can ONLY be created through the
# New Team dialog, and every mount of that dialog is behind a TeamPicker:
# CardDetailPanel, the checklist quick-add and UnreviewedNameFixer all live
# inside `/admin/set-builder` behind a full Sport→Year→Manufacturer→Set→Variant
# drill, and the career-history editor on `/admin/players` does not.
# `/admin/teams` itself has no "add team" control. So the cheapest way to two
# team rows is one throwaway player, exactly as the two sibling admin flows do
# it. No stint is added and the player is never saved — the teams exist the
# moment the dialog's Create returns, which is what the chip proves.
#
# R4 — the entry URL is the whole setup. No in-body login, no credential step.
#
# R5 — EVERY step below states its timeout explicitly, because the defaults are
#   not 7s: `ScrollUntilVisibleCommand.DEFAULT_TIMEOUT_IN_MILLIS` is "20000" and
#   `Orchestra.lookupTimeoutMs` (what a bare `extendedWaitUntil` gets) is 17000,
#   so omitting the key is a violation rather than a way of complying. Every
#   scroll and every wait here says 7000. The only exceptions are the two R5
#   sanctions by name: the cold sign-in gate (45s, the post-launchApp heading
#   gate) and the mid-flow reload gate (30s, openLink re-auth — the README's
#   "Launching a flow" section rules on it). No marketplace is touched, so
#   nothing here has any other claim on a longer ceiling.
#
#   The figures are measured, not chosen. In green run 34431109073 every in-app
#   wait in this flow cost 0.33-0.35s and every scroll 0.54-2.70s EXCEPT four,
#   which paid the full give-up path with frozen bounds: both `Save` steps
#   (7.63s / 7.61s at y=552), `Loc… A` on the franchise view (9.65s at y=519)
#   and `Remove Loc… B` (7.59s at y=554). All four are R8 case 1 — a panel
#   parked against the fold with no headroom — and all four are fixed by
#   NEO-260's 208px spacer, which is noted at each site. The controlled proof is
#   the sibling flow admin-franchises-start-and-rename: same signature on the
#   same shell, 7.73-9.34s frozen in 34431109073, 0.56-2.03s at try 0/1 in
#   post-spacer run 34437403394.
#
# R7 / R7a — no set, checklist, card or variant is touched, so this flow owns no
#   SET-REGISTRY.md entry and writes to no shared row. It CREATES four
#   permanent, globally-shared rows — one player, two teams, one franchise —
#   and the product has no delete mutation for any of them, so they stay. They
#   are made inert by their names: every one is suffixed with this run's own
#   attempt token, unique per worker AND per attempt, so no two runners and no
#   retry can collide, and nothing else in the suite or the product will ever
#   search for them. The teams are left with no league, no colours and no
#   years; the franchise is left holding exactly one of them.
#
#   ⚠️ SINGLE-TOKEN NAMES. `players.search` and the team typeahead are Convex
#   SEARCH indexes and match on TOKENS: a hyphenated "Fr-w3-a1-23945" tokenizes
#   into four terms and would answer to another flow's rows. Stripping the
#   hyphens out of ATTEMPT_ID makes each name one term nothing else can share.
#   `Loc…` is a separate word by design — a Location and a Name are two fields
#   — but each half is itself a single token.
#
# R8 — every scroll that precedes a tap centers its target, and the ones that
#   have to travel back UP the page say so (the default is DOWN, and a downward
#   scroll can never find a target above the current position). On the 1024x629
#   headless viewport the team detail panel is taller than the page: the
#   Franchise group, Save, and "See the franchise" are each below the fold, and
#   the master list is above it once Save has been reached.
#
#   TWO deliberate departures on the player page: the `Create player` scroll
#   drops `centerElement`, and "+ Add team" is asserted rather than scrolled to
#   at all. This header used to justify both as R8 case 2 ("the add form and the
#   career editor are the LAST things on that page, so anything in them is
#   locked to the page bottom", six futile swipes in CI run 34071657961).
#   ⚠️ THAT JUSTIFICATION IS STALE and must not be repeated: NEO-260's 208px
#   spacer (src/layouts/binder-layout.tsx) gave every page in the signed-in
#   shell a full swipe of travel below its last control, and R8 is explicit that
#   an element which moves on the first swipe is case 1, not case 2. The reasons
#   that survive are written at the two sites, with the run numbers.
#
#   "No stints recorded yet." is still load-bearing, for a different reason than
#   this header used to give. It does NOT drive the page to maximum scroll — in
#   run 34431109073 it took two swipes to bring the line on screen and then
#   ACCEPTED at try 0, centred at y=383. What it does is put the page in one
#   known position, from which "+ Add team" sits at y=484 and the picker's
#   popover clears the fold. Every geometry figure quoted below is taken from
#   that position, so the step stays and stays centred.
#
# R10 — no conditional branches, no `notVisible:` guard on a normally-present
#   element, no settle waits. Every scroll is its own assertion (R6), so none is
#   followed by an assertVisible of the same text.

- launchApp

# The COUNTER, not the "Player Management" heading — the heading paints while
# the list is still loading and the filter box exists during loading, so the
# heading is actively misleading. The counter renders when the query resolves.
- extendedWaitUntil:
    visible: ".*of .* players.*"
    timeout: 45000

# Both runners inject ATTEMPT_ID with `-e` on every attempt, so the binding is
# always there. Single-quoted because the expression contains double quotes.
- evalScript: '${output.TOKEN = String(ATTEMPT_ID).split("-").join("")}'

# ============================================================
# PART 1 — THE FIXTURE: ONE PLAYER, THEN TWO TEAMS THROUGH THE NEW TEAM DIALOG
# ============================================================

# ── EMPTY THE LIST, THEN PICK THE SPORT ─────────────────────────────────────
# A precondition, not a claim about filtering. Every player row prints its sport
# beside the name, so with rows on screen "Baseball" is on the page many times
# over and the sport picker could not be identified by what it says. And the
# sport MUST be chosen with the add form CLOSED: maestro resolves an <option>
# tap by index against the FIRST <select> in the document, so a pick made while
# the form's own `new-player-sport` is mounted would land in the list's
# `sport-filter`. With the form closed the list's picker is the only one there,
# and the form then opens with this sport already selected.
#
# The sport carries all the way through: the player's sport is the picker's
# sport, which is the sport the teams are created under, which is the sport the
# Franchise pills are scoped to.
- tapOn: "Filter players"
- inputText: "zzzznotaplayer"
- assertVisible: "No players match that filter."
- assertVisible: "0 matches"

- tapOn: "All sports"
- tapOn: "Baseball"
# maestro reads a <select> as its SELECTED option's text, so this is a direct
# read of what the picker holds. The list is empty, so nothing else can answer.
- assertVisible: "Baseball"

- tapOn: "Add player"
- tapOn: "New player name"
- inputText: "Frp${output.TOKEN}"
# NO `centerElement` — but NOT because the button row is pinned, which is what
# this comment used to claim ("the add form is the last thing on this page, so
# its button row is LOCKED to the page bottom and centring can never settle",
# citing six futile swipes at y=552 in CI run 34071657961). That was R8 case 2
# and it no longer holds: NEO-260's 208px spacer (src/layouts/binder-layout.tsx)
# put a full swipe of travel below this form. The button that sat frozen at
# y=552 in pre-spacer run 34431109073 was read at y=500 in post-spacer run
# 34437403394, and the sibling `Start franchise` button in
# admin-franchises-start-and-rename moved y=594 -> y=344 on ONE swipe in that
# same run against 42px pre-spacer. R8 is explicit that an element which moves
# on the first swipe is case 1, not case 2, so do not cite case 2 here.
#
# It stays uncentred on cost, stated honestly: uncentred it settles at try 0 in
# 2.70s (34431109073) / 2.72s (34437403394), stopping the moment the button is
# 100% visible, and `tapOn` re-reads the settled hierarchy for its coordinates
# anyway. Turning centring ON here is an untested change — post-spacer the
# button lands at centre y=516, above the ~464 lowest observed give-up, so it
# could well pay the full give-up path — and it needs its own measurement
# before anyone makes it, not this comment's old assumption.
- scrollUntilVisible:
    element:
      id: "Create player Frp${output.TOKEN}"
    timeout: 7000
- tapOn:
    id: "Create player Frp${output.TOKEN}"
# "Added <name>." is said only for an INSERTED row — an adopted one says "That
# player already exists — opened it." So the vehicle for the rest of the flow
# is this run's own player and nobody else's.

# THE CONFIRMATION MOVED. THIS SCROLL STAYED, AND NOT FOR THE ASSERTION.
#
# NEO-260 took `Added <name>.` out of `PlayerManagement`'s page-level status
# line and put it at the head of the DETAIL COLUMN, `sticky` under the binder
# header. The old line sat at document y=293-313 while the `Create player`
# button that earns it is at y=809-841: the button is fully visible only from
# scroll 216 and the line is clear of the 79px header only to scroll 214, so no
# scroll position on the 1024x629 viewport ever showed both, and the line's own
# insertion moved the page away from it (+39px of content above the scroll
# position, +39px of Chrome scroll anchoring). That is what reddened six flows
# in run 34437403394. A stuck element reports its STUCK position to the driver
# — `binder-header`, `sticky top-0`, reads [64,16][228,61] in every hierarchy
# dump at every scroll — so the assertion below now passes from wherever the
# tap left the page, with or without this step.
#
# WHAT THIS STEP IS FOR NOW is the commands AFTER it: the centred career-history scroll below, whose measured bounds were taken
# from the page position THIS step produces. It stays until a green run says
# otherwise.
# It is positioning only, and nothing this flow proves changes. `Filter
# players` is still the right anchor — it is the label of the list this screen
# is built around and it is on the page whatever the create did, so a create
# that was genuinely REFUSED still fails on the assertion below with the
# refusal on screen in the screenshot. Its document position moved 332 -> 293
# with the page-level line's removal, and the post-create scroll is now
# 367 (813 - 500 for the button, +54 for the notice inserted above the
# scroll position), so the travel is one UP swipe of ~313px, landing the page at scroll ~54 — the same swipe count as the
# green measurement this note replaces.
- scrollUntilVisible:
    element:
      text: "Filter players"
    direction: UP
    centerElement: true
    timeout: 7000

- extendedWaitUntil:
    visible: ".*Added Frp${output.TOKEN}.*"
    timeout: 7000

# The career-history section is below the fold the moment the panel opens: at
# 1024x629 the panel runs out of viewport around the Wikidata box. The scroll IS
# the check (R6) that we are on a player with no history, so the picker below is
# starting from nothing.
#
# `centerElement` is LOAD-BEARING here rather than habit — but not for the
# reason this comment used to give. It said "this line cannot be centred either,
# so the swipes run until the page stops moving, and that maximum-scroll
# position is what puts '+ Add team' at y=484". The log disagrees: in run
# 34431109073 this step logged two ElementNotFound reads with a swipe after
# each, then ACCEPTED at try count 0 with bounds y=383 — it centred, it did not
# bottom out, and the whole step cost 4.79s. So what the centring buys is a
# DETERMINISTIC page position, not a maximum one: the anchor is parked mid-
# viewport, which is what puts "+ Add team" at y=484 and the picker's popover
# clear of the fold for every step below. Every geometry figure that follows is
# taken from that position, so do not remove the centring — and do not repeat
# the "cannot be centred" claim, which was never true of this step.
#
# 7000 against a measured 4.79s is the tightest margin in this file. It is
# deliberate: 4.79s is two full driver swipes before the line is ever seen, so
# if this step starts failing the page above it has grown, which is a product
# finding (R5) and not a number to raise.
- scrollUntilVisible:
    element:
      text: "No stints recorded yet."
    centerElement: true
    timeout: 7000

# ── TEAM A ──────────────────────────────────────────────────────────────────
# NO SCROLL — the step above already did it. Centring "No stints recorded yet."
# parks the page in one known position, and from there the trigger sits at
# y=484 at 100% visibility (measured in runs 34071657961 and 34431109073, and
# unchanged by the spacer because the anchor above it is what fixes the page).
# ⚠️ The old wording here — "drives the page to its maximum scroll … five more
# swipes moved nothing (the page had no room left)" — described a give-up the
# anchor step does not actually reach: 34431109073 shows it accepting at try
# count 0. The position is deterministic, not terminal; that is all this step
# needs. An `assertVisible` reads it in 0.33s, and it is still a hard assertion
# that the career editor rendered.
- assertVisible:
    id: "Add team"
- tapOn:
    id: "Add team"
- tapOn:
    id: "Search teams"
- inputText: "Fr${output.TOKEN}A"

# NOTHING MATCHES — the precondition for creating it, and a real assertion that
# this name is this attempt's alone.
- assertVisible: "No matches."

# OPEN THE DIALOG WITH ENTER, NOT BY TAPPING THE "+ New team" ROW. The career
# editor is the LAST thing on the player panel, so once the page is scrolled as
# far as it goes the picker sits near the bottom of the viewport and its
# `absolute top-full` popover opens below it: the search box and one result row
# fit, and the "+ New team" row under "No matches." lands past y=629. maestro
# still reports its layout bounds, so a `tapOn` "succeeds" while the click lands
# outside the picker — which is a pointerdown-outside, so the popover closes and
# nothing opens. Enter on the input runs the SAME handler: TeamPicker's keydown
# takes the highlighted match when there is one and otherwise opens the dialog,
# and "No matches." above is what proves there is none.
- pressKey: Enter

# THE DIALOG IS OPEN. Portalled to `document.body` at `z-[60]`, `fixed inset-0
# flex items-center justify-center`, so it is centred and clipped by nothing —
# none of the geometry above can reach it. The heading is its `aria-labelledby`
# target, so this is the dialog being correctly LABELLED and correctly SEEDED
# with what was typed.
- assertVisible: "New team: Fr${output.TOKEN}A"

# LOCATION IS THE HALF NEO-236 ADDED, and filling it is what makes the composed
# name below more than an echo of the search box. Addressed by its aria-label —
# `NewTeamForm` sets one explicitly, which `primitives/Input` never does — and
# the brackets are escaped because a matcher is a regex.
- tapOn:
    id: "New team location \\(optional\\)"
- inputText: "Loc${output.TOKEN}"

# THE WRITE. The Create button's accessible name is the COMPOSED name, rebuilt
# on every keystroke, so targeting it by that string is itself the assertion
# that Location and Name were put together in that order. Tapped by id rather
# than driven with a second Enter: Create and Cancel are NeonButtons with an
# identical class string, and maestro-web's pressKey re-finds the focused
# element by an XPath that falls back to that class — an Enter aimed at Create
# can land on Cancel.
- tapOn:
    id: "Create team Loc${output.TOKEN} Fr${output.TOKEN}A"

# The chip is the proof the row was written — the picker paints it from the id
# the mutation returned. Waiting for it also removes a race before the next tap.
- extendedWaitUntil:
    visible:
      id: "Remove team Loc${output.TOKEN} Fr${output.TOKEN}A"
    timeout: 7000

# ── DROP THE CHIP BEFORE BUILDING TEAM B ────────────────────────────────────
# Geometry, not tidiness. The popover is positioned under the WHOLE picker —
# chips included — so a chip left in place pushes the popover down by a line,
# and the "No matches." row team B depends on would land past the bottom of the
# 629px viewport (see the note above; the picker is already at max scroll). The
# team row itself is untouched: this unstages it from a career draft that is
# never saved. PART 2 re-finds it on `/admin/teams`, which is the honest proof
# it persisted anyway.
- tapOn:
    id: "Remove team Loc${output.TOKEN} Fr${output.TOKEN}A"

# ── REOPEN THE PICKER ───────────────────────────────────────────────────────
# Removing a chip CLOSES the popover, and that is correct app behaviour rather
# than a bug: the × button that was just tapped is the focused element, removing
# the chip unmounts it, `document.activeElement` falls back to `<body>`, and
# TeamPicker's `handleRootBlur` — which defers a read of activeElement precisely
# because `relatedTarget` is unreliable — sees focus outside its root and runs
# `setPopoverOpen(false); setQuery("")`. CI run 34071657961 failed here:
# "Element not found: Id matching regex: Search teams", 17s of polling at a
# picker whose popover had closed a second earlier.
#
# The trigger ALWAYS opens (`setPopoverOpen(true)`, never a toggle — TeamPicker
# documents why), so this is one tap and the picker is back to the exact shape
# team A was created from: no chip, trigger at y=484, search box at y=519,
# "No matches." clear of the fold.
- assertVisible:
    id: "Add team"
- tapOn:
    id: "Add team"

# ── TEAM B ──────────────────────────────────────────────────────────────────
- tapOn:
    id: "Search teams"
- inputText: "Fr${output.TOKEN}B"
# Still nothing — team A does not answer to this name, so the create row is
# what Enter reaches.
- assertVisible: "No matches."
- pressKey: Enter

- assertVisible: "New team: Fr${output.TOKEN}B"
- tapOn:
    id: "New team location \\(optional\\)"
- inputText: "Loc${output.TOKEN}"
- tapOn:
    id: "Create team Loc${output.TOKEN} Fr${output.TOKEN}B"
- extendedWaitUntil:
    visible:
      id: "Remove team Loc${output.TOKEN} Fr${output.TOKEN}B"
    timeout: 7000

# ============================================================
# PART 2 — THE THREAD IS STARTED FROM TEAM A AND JOINED BY TEAM B
# ============================================================

# A full reload rather than a tab click: it separates "the picker is holding
# what I made" from "the database holds it", and it lands on the screen with
# the Franchise control. 30s matches the identical openLink in both sibling
# admin flows — a full SPA reload and re-auth, not a UI wait.
- openLink: ${APP_URL || "http://localhost:3000"}/admin/teams
- extendedWaitUntil:
    visible: ".*of .* teams.*"
    timeout: 30000

# R2(a). The filter matches on the COMPOSED name, so one needle finds both rows,
# and the counter saying TWO is the proof that PART 1 wrote two rows and that
# both carry the Location typed into the dialog.
- tapOn: "Filter teams"
- inputText: "Fr${output.TOKEN}"
- extendedWaitUntil:
    visible: "2 of .* teams.*"
    timeout: 7000

# ── TEAM A: START THE FRANCHISE, THEN SAVE ──────────────────────────────────
# The master row is targeted by `id:` — NEO-236 made the row's `aria-label` the
# full composed name exactly, which maestro turns into `resource-id`, so this
# names one row and cannot drift onto the panel heading or the "Shows as:"
# preview that print the same string as TEXT.
- tapOn:
    id: "Loc${output.TOKEN} Fr${output.TOKEN}A"

# The Franchise group is below the fold once the panel opens. Matched loosely
# on purpose: the button reads "+ Start a new franchise…" and a leading "+" is
# an invalid regex quantifier, so the literal is avoided rather than escaped.
# Nothing else on this screen says "Start a new franchise".
- scrollUntilVisible:
    element:
      text: ".*Start a new franchise.*"
    centerElement: true
    timeout: 7000
- tapOn: ".*Start a new franchise.*"

- tapOn: "New franchise name"
- inputText: "Fran${output.TOKEN}"
- tapOn: "Start"

# R2(b). `createFranchise` closes the box, clears it, and makes the new thread
# the CHECKED pill — so this run's franchise name being on screen at all, with
# the box gone, is the pill and only the pill. It is a find-or-create, and the
# per-attempt name is what makes this one a create.
#
# Nothing is written to the TEAM yet: starting a thread and deciding this team
# belongs to it are two decisions, and Save commits the second.
- extendedWaitUntil:
    visible: "Fran${output.TOKEN}"
    timeout: 7000

# ⚠️ THIS STEP'S 7000 DEPENDS ON THE 208px SPACER (R8 case 1). In pre-spacer run
# 34431109073 it cost 7.63s: bounds y=584 on the first read, y=552 after one
# swipe, then frozen at y=552 for four more — a panel jammed against the fold
# with 32px of travel left, paying the whole give-up path on every run. The
# spacer (`src/layouts/binder-layout.tsx`) gives it 208px more, which brings this
# button's centre from 568 to ~360, well inside the measured acceptance band.
# If the spacer is shortened this step fails at 7000; that is the signal R5 wants
# and a product finding, not a number to raise.
- scrollUntilVisible:
    element:
      text: "Save"
    centerElement: true
    timeout: 7000
- tapOn: "Save"

# The mutation confirms by the composed name, which is also the first read-back
# proving the save took the row this flow means.
- extendedWaitUntil:
    visible: ".*Saved Loc${output.TOKEN} Fr${output.TOKEN}A.*"
    timeout: 7000

# ── TEAM B: PICK THE PILL THAT NOW EXISTS, THEN SAVE ────────────────────────
# `direction: UP` is load-bearing: reaching Save scrolled the panel down, and
# the master list sits ABOVE it. A default downward scroll can never find this.
- scrollUntilVisible:
    element:
      id: "Loc${output.TOKEN} Fr${output.TOKEN}B"
    direction: UP
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Loc${output.TOKEN} Fr${output.TOKEN}B"

# THE STEP THE WHOLE FLOW EXISTS FOR. Team B's panel is a fresh mount with no
# franchise, and this pill is offered because `franchises.list` returned the row
# team A's save committed — so tapping it is an operator picking an EXISTING
# thread, not making a second one. Before 4666a57 this tap was impossible.
#
# The pill lives inside a `max-h-40 overflow-y-auto` wrap of the whole group, so
# it is centred rather than merely scrolled to. See the note at the end of this
# file about what happens once a sport carries more than 24 franchises.
- scrollUntilVisible:
    element:
      text: "Fran${output.TOKEN}"
    centerElement: true
    timeout: 7000
- tapOn: "Fran${output.TOKEN}"

# Same spacer dependency as team A's Save above, same signature: 7.61s with
# bounds frozen at y=552 across all six tries in pre-spacer run 34431109073.
- scrollUntilVisible:
    element:
      text: "Save"
    centerElement: true
    timeout: 7000
- tapOn: "Save"
- extendedWaitUntil:
    visible: ".*Saved Loc${output.TOKEN} Fr${output.TOKEN}B.*"
    timeout: 7000

# ============================================================
# PART 3 — THE FRANCHISE VIEW: BOTH TEAMS ON ONE THREAD, THEN ONE TAKEN OFF
# ============================================================

# R2(c). Reached by team B's OWN deep link rather than by typing a URL: the link
# is `/admin/franchises?franchise=<franchiseId>`, and that id is read off the
# panel's committed draft — so a save that dropped the franchise would send this
# to the bare list instead, and every assertion below would fail. `direction: UP`
# for the same reason as before: Save is below this link.
- scrollUntilVisible:
    element:
      text: "See the franchise"
    direction: UP
    centerElement: true
    timeout: 7000
- tapOn: "See the franchise"

# The followed param selects the row and clears the screen's own filters, so the
# panel below is this franchise's.
- extendedWaitUntil:
    visible: ".*of .* franchises.*"
    timeout: 7000

# R2(d) — THE JOIN, read back by a different query than the one that wrote it.
# `franchises.get` counts the team rows pointing AT this franchise; two teams
# that merely each had a franchise could not produce this line.
- extendedWaitUntil:
    visible: ".*2 teams on this thread.*"
    timeout: 7000

# Both members, by their composed names. Neither team name appears anywhere else
# on this screen — the master list on the left prints FRANCHISE names — so these
# can only be the thread's own rows. They carry no active years, so they sit in
# the undated group under the rail rather than in it.
#
# Spacer-dependent, and the most expensive give-up this flow had: 9.65s in
# pre-spacer run 34431109073, bounds frozen at y=519 across all six tries.
- scrollUntilVisible:
    element:
      text: "Loc${output.TOKEN} Fr${output.TOKEN}A"
    centerElement: true
    timeout: 7000
- assertVisible: "Loc${output.TOKEN} Fr${output.TOKEN}B"

# ── TAKE TEAM B BACK OFF ────────────────────────────────────────────────────
# The inverse of the pill, and the only membership control this screen has: it
# sends the same `franchiseId: null` the "No franchise" pill sends. The button's
# visible text IS its accessible name and it names the team, so this cannot land
# on team A's.
#
# Spacer-dependent: 7.59s with bounds frozen at y=554 across all six tries in
# pre-spacer run 34431109073.
- scrollUntilVisible:
    element:
      text: "Remove Loc${output.TOKEN} Fr${output.TOKEN}B"
    centerElement: true
    timeout: 7000
- tapOn: "Remove Loc${output.TOKEN} Fr${output.TOKEN}B"

# ⚠️ THIS ONE IS NOT THE STATUS LINE. The screen's own confirmation, "Took
# <team> off this franchise.", is fine and was on screen: run 34442670233
# runner 7 shows it at viewport y=360, immediately under the "Remove <team>"
# button that was tapped at y=346. What failed is this COUNT, which is the
# panel's SUBTITLE, directly under the franchise-name heading — 410px above the
# control that changes it, and above the fold at the position the tap left.
# MEASURED, from that run's failure dump: root [0,-483][1009,629] with
# "Franchise name" (the panel's first field label) at viewport y=-8, which puts
# the heading and its subtitle at roughly y=-60..-20, pruned outright. The
# REMOVAL WORKED and the dump proves it: team B's row is gone from the thread,
# team A's is still there at y=311, and the confirmation names team B.
# WHY IT ONLY BROKE NOW, and it is the spacer rather than any product change:
# pre-spacer, maximum scroll on this page was 279, so the centred scroll to
# "Remove <team>" above could not reach the centre band and gave up with the
# page CLAMPED at 279 — where the count sat at viewport y=164 and team A at
# y=515, both comfortably on screen. NEO-260's 208px spacer (`h-[208px]`,
# src/layouts/binder-layout.tsx) takes maximum scroll to 487, the centring now
# succeeds, and it parks the page 204px deeper. Textbook R5 "never depend on
# the document bottoming out".
# THE TWO ASSERTIONS CANNOT SHARE ONE POSITION. The count needs scroll <= 363
# and team A's row needs scroll >= 189; the driver's swipe is ~313px, so from
# 483 the reachable stops are 483 and 170, and neither is in [189, 363]. So
# each read gets its own anchor: UP to the panel's own "Franchise name" label
# for the count (one swipe to scroll 170, label centred at ~315, count at
# ~y=273), then DOWN to team A's OWN "Remove" button for the row (one swipe
# back to ~483, where the run already measured the row at y=311). Positioning
# only, and neither anchor is a target of the assertion it precedes (R6).
- scrollUntilVisible:
    element:
      text: "Franchise name"
    direction: UP
    centerElement: true
    timeout: 7000

# R2(e). The count is the assertion — it is recomputed from the database, not
# from the row disappearing on screen. "1 team", singular, is the screen's own
# wording for exactly one.
- extendedWaitUntil:
    visible: ".*1 team on this thread.*"
    timeout: 7000

- scrollUntilVisible:
    element:
      text: "Remove Loc${output.TOKEN} Fr${output.TOKEN}A"
    direction: DOWN
    centerElement: true
    timeout: 7000

# And the removal cut a LINK, not a row, and only team B's: A is still on the
# thread, B is off it. The negative is paired with a positive so an error
# boundary — which satisfies every notVisible — cannot pass this.
- assertVisible: "Loc${output.TOKEN} Fr${output.TOKEN}A"
- assertNotVisible: "Loc${output.TOKEN} Fr${output.TOKEN}B"

# ── ONE KNOWN LIMIT, WRITTEN DOWN RATHER THAN GUARDED ───────────────────────
# `FRANCHISE_PILL_CAP` is 24: past 24 franchises IN ONE SPORT the pill group
# renders a filtered slice and grows its own "Filter franchises" box, and the
# pill this flow taps for team B could be sliced out (team A's is safe either
# way — the picked thread is always force-kept). It is not guarded here because
# a `when:` on a normally-absent element costs a full 7s poll on every run for
# a case that cannot arise on a healthy preview: a preview starts empty, only
# these two admin flows ever create a franchise, and they add at most two per CI
# run. It also degrades LOUDLY — the tap fails to find the pill — rather than
# silently. Alphabetical ordering buys further headroom: this flow's names sort
# under "Fran", and `admin-franchises-start-and-rename` leaves its rows renamed
# to "Ren", which sort after. If this ever does bite, type the token into that
# filter box before the tap; do not raise the cap.

appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/admin/players&worker=${WORKER_INDEX || "0"}
name: "Player Management — a birth year is bounded, shows on the row, and is what lets a repeated name become a genuinely second player"
tags:
  - admin
---
# R1 — ONE FEATURE (NEO-254): the **birth year** on `/admin/players`. It is the
# field that tells two people with one name apart, and on this form it is also
# the MECHANISM by which the second of them gets created. This flow drives the
# whole of that: the field's bounds, the year showing up on the master row, and
# the three-way adopt / fork decision the add form makes.
#
# `players.createByAdmin` → `adoptOrForkOnCreate`:
#   * no birth year, one row on file          → ADOPT ("already exists")
#   * a birth year no row on file carries     → FORK  ("Added <name>.")
#   * a birth year exactly one row carries    → ADOPT
# `players.findOrCreate` (the pickers) deliberately does NOT fork — one match
# there is an answer, because a picker's job is to LINK, not to create.
#
# R2 — HARD ASSERTIONS, none satisfiable by an inert page:
#     (a) an out-of-bounds year is REFUSED client-side: the field says what it
#         wants and the create button is inert — the form is still open, still
#         holding the typed name, and no "Added …" was ever said;
#     (b) a valid year lets that same create through — "Added <name>." is said
#         only for an INSERTED row (an adopted one says "already exists");
#     (c) the year is stored: after a server-side search re-reads the row from
#         the database, the master row prints "b. 1960";
#     (d) repeating the name DEMOTES creation — the primary becomes
#         "Open <name>" and creation moves behind "Create anyway". That control
#         exists only when an exact match came back, so waiting for it also
#         proves the first row persisted;
#     (e) "Create anyway" with NO year ADOPTS: the page says the player already
#         exists and the list still reads "1 matches";
#     (f) "Create anyway" with a year nobody carries FORKS: "Added <name>." and
#         the list grows to "2 matches" holding BOTH "b. 1960" and "b. 1975" —
#         which is the state the review wizard's "Same name, different people"
#         panel exists for, and which nothing in the product could produce from
#         the UI before this ticket.
#
# ── WHAT THIS FLOW DELIBERATELY DOES NOT PROVE ──────────────────────────────
# The PlayerPicker's refusal. Once two rows share the name, a picker's
# "+ Create" (`players.findOrCreate`) throws
# "2 players are already filed under <name>. Pick the right one instead of
# adding another." into the picker's own role="alert" and adds no chip. It is
# NOT asserted here because every PlayerPicker in the product (CardDetailPanel,
# CardChecklist's quick-add, UnreviewedNameFixer) is mounted inside
# `/admin/set-builder` behind a full Sport→Year→Manufacturer→Set→Variant drill.
# Reaching one read-only would mean this flow creating and OWNING a per-worker
# set + variant — rows it would then have to register in SET-REGISTRY.md —
# which is state left behind, a second feature on a second screen (R1), and a
# set-builder fixture bolted onto the one admin flow that today leans on no
# fixture at all. The refusal is covered where it is cheap:
# `PlayerPicker.test.tsx` and `convex/playersAmbiguity.test.ts`.
#
# R3 — DEDUP: `player-management-add-and-career-history.yaml` owns hand-adding a
#   player and its career history; it never types a birth year, never repeats a
#   name and never touches the near-match hierarchy. Nothing else in the suite
#   goes near `/admin/players`.
#
# R4 — the entry URL is the whole setup. No in-body login, no credential step.
#
# R5 — EVERY step below states its timeout explicitly, because the defaults are
#   not 7s and omitting the key is a violation rather than a way of complying:
#   `ScrollUntilVisibleCommand.DEFAULT_TIMEOUT_IN_MILLIS` is "20000" and
#   `Orchestra.lookupTimeoutMs` (what a bare `extendedWaitUntil` gets) is 17000.
#   Every scroll and every wait here says 7000; the one exception is the cold
#   sign-in gate (45s), which is R5's post-launchApp heading gate. No
#   marketplace is touched, so nothing else here earns a long timeout.
#
#   Measured, not chosen: in green run 34431109073 every in-app wait in this
#   flow cost 0.33-0.34s and every scroll 0.55-2.67s, none of them reaching the
#   centring give-up path, and post-spacer run 34437403394 reproduced the same
#   figures for every step it got to (0.56-2.72s).
#
# R7 / R7a — no set, checklist, card or variant is touched, so this flow owns no
#   SET-REGISTRY.md entry. It DOES create TWO globally-shared `players` rows and
#   there is no delete-player mutation anywhere in the product, so they are
#   permanent — the same footprint the sibling admin flow already carries, one
#   row larger. They are made harmless by the name: "Samename<attempt token>" is
#   unique per worker AND per attempt, so no two runners or retries can collide,
#   and nothing else in the suite or the product will ever search for it.
#
#   ⚠️ THE NAME MUST BE A SINGLE TOKEN. `players.search` is a Convex SEARCH
#   index and matches on TOKENS: a hyphenated "Samename-w3-a1-23945" tokenizes
#   into four terms, so it would answer to any other flow's "Samename-…" row and
#   the exact-match hierarchy below could resolve against somebody else's
#   player. Stripping the hyphens out of ATTEMPT_ID makes it one term nothing
#   else can share.
#
# R8 — EVERYTHING on this form is below the fold on the 1024x629 headless
#   viewport, and that is the whole geometry story of this flow (CI run
#   34071657961 failed on it): the birth-year box ends at y=625, so its helper
#   line — which is where the bounds refusal is SAID — and the button row under
#   it are both off-screen, and maestro's hierarchy is viewport-clipped, so an
#   `assertVisible` cannot see them however long it waits. Every one of those
#   targets is therefore reached by a `scrollUntilVisible`, and the scroll is
#   left to be its own assertion (R6).
#
#   None of those scrolls centers. ⚠️ THE REASON THIS FILE USED TO GIVE IS NO
#   LONGER TRUE, so do not repeat it: it said "the add form is the LAST thing on
#   the page, so its button row is locked to the bottom and centring can never
#   settle", R8 case 2, citing six futile swipes in run 34071657961. NEO-260's
#   208px spacer (src/layouts/binder-layout.tsx) put a full swipe of travel below
#   this form. The Create button that sat frozen at y=552 in pre-spacer run
#   34431109073 was read at y=462 in post-spacer run 34437403394, and the
#   equivalent button in admin-franchises-start-and-rename moved y=594 -> y=344
#   on ONE swipe in that run against 42px pre-spacer. R8 says an element that
#   moves on the first swipe is case 1, not case 2.
#
#   What survives is a cost argument, and only that: uncentred these steps stop
#   the moment the target is 100% visible and settle at try 0 in 0.55-2.72s
#   across both runs, and `tapOn` re-reads the settled hierarchy for its
#   coordinates anyway. Switching them to centred is an untested change — the
#   Create button's post-spacer centre is y=478, above the ~464 lowest observed
#   give-up — and needs its own measurement, not this comment's old assumption.
#   Where a target sits ABOVE the current position the scroll says
#   `direction: UP`, because the default is DOWN and a downward scroll can never
#   find it.
#
# R10 — no conditional branches at all, so there is no poll on a normally-absent
#   element and no path to the end that skips the feature.

- launchApp

# Wait for the COUNTER, not the "Player Management" heading: the heading paints
# while the list is still loading and the filter box exists during loading, so
# the heading is actively misleading. The counter renders when the query
# resolves.
- extendedWaitUntil:
    visible: ".*of .* players.*"
    timeout: 45000

# ⚠️ READ `ATTEMPT_ID`, NOT `output.ATTEMPT_ID` — both runners inject it with
# `-e` on EVERY attempt (run-e2e-smoke.sh and run-e2e-queue.sh), which Maestro
# exposes as the binding, so there is no un-injected path to guard against. The
# hyphen strip is explained in the R7 note above. Single-quoted because the
# expression contains double quotes.
- evalScript: '${output.TOKEN = String(ATTEMPT_ID).split("-").join("")}'

# ============================================================
# STEP 1 — EMPTY THE LIST, THEN PICK THE SPORT
#
# Not decoration. Every player row prints its sport beside the name, so with
# rows on screen "Baseball" is on the page many times over and the sport picker
# could not be identified by what it says. And the sport MUST be chosen with the
# add form CLOSED: Maestro reaches a native picker's options by their index
# within their own parent and then resolves that index against the FIRST
# <select> in the document, so a choice made while the form's own picker
# (`new-player-sport`) is mounted would land in the list's (`sport-filter`)
# instead. With the form closed the list's picker is the only one there. The add
# form then opens with this sport already selected (`defaultSportId={sportId}`).
# ============================================================

- tapOn: "Filter players"
- inputText: "zzzznotaplayer"
- assertVisible: "No players match that filter."
- assertVisible: "0 matches"

- tapOn: "All sports"
- tapOn: "Baseball"
# maestro reads a <select> as its SELECTED option's text, so this is a direct
# read of what the picker now holds. The list is empty, so nothing else on the
# page can be answering here.
- assertVisible: "Baseball"

# ============================================================
# STEP 2 — R2(a): A YEAR OUTSIDE THE BOUNDS IS REFUSED, AND SAYS SO
#
# 1700 is below `MIN_BIRTH_YEAR` (1850, lib/players/career-years.ts). The upper
# bound is `maxBirthYear()` — THIS year, not next, because nobody is born in a
# year that has not started — so it is matched as a pattern rather than written
# down: a literal would fail on 1 January.
#
# The label is escaped: Maestro treats a matcher as a regex, and a bare
# "(optional)" would be a capture group matching the word without its brackets.
# ============================================================

- scrollUntilVisible:
    element:
      text: "Add player"
    centerElement: true
    timeout: 7000
- tapOn: "Add player"
- extendedWaitUntil:
    visible: "Add a player"
    timeout: 7000

- tapOn: "New player name"
- inputText: "Samename${output.TOKEN}"

- tapOn: "Birth year \\(optional\\)"
- inputText: "1700"
# ⚠️ SCROLLED TO, NOT MERELY ASSERTED. The refusal renders in the field's own
# helper line, directly under the box — and on the 1024x629 headless viewport
# that line sits at y≈635, off the bottom. `assertVisible` never scrolls, and
# maestro's hierarchy is viewport-CLIPPED, so the line was simply absent from
# it: CI run 34071657961 failed here with "Assertion is false", and its
# hierarchy dump ends at the birth-year input at [345,583][798,625]. The refusal
# was rendering correctly the whole time. The scroll IS the assertion (R6).
- scrollUntilVisible:
    element:
      text: "Use a whole year between 1850 and 2[0-9]{3}\\."
    timeout: 7000

# The create button is inert while the year is out of bounds, so this tap must
# do nothing. Three independent readings of "nothing happened" follow it: the
# form is still open (the scroll back up to its heading), the name is still
# sitting in the field a successful create would have taken away with it, and
# the page never said it added anything.
#
# NO `centerElement`, here or on any of the button scrolls below — see the R8
# note in the header, which now says WHY. In short: the "LOCKED to the page
# bottom / centring can never settle" reading of CI run 34071657961 was true
# then and is false since NEO-260's 208px spacer, so this is NOT R8 case 2 and
# must not be cited as such. It stays uncentred on cost: 0.56s at try 0 in
# 34431109073 and 0.57s in 34437403394, stopping the moment the button is fully
# visible, and `tapOn` re-reads the settled hierarchy for its coordinates
# anyway.
- scrollUntilVisible:
    element:
      id: "Create player Samename${output.TOKEN}"
    timeout: 7000
- tapOn:
    id: "Create player Samename${output.TOKEN}"
# Back UP to the top of the form to read the two "nothing happened" facts. The
# tap above left the page at the bottom, and the heading and the name box are
# both above the fold from there. The scroll is the first of the two assertions.
- scrollUntilVisible:
    element:
      text: "Add a player"
    direction: UP
    timeout: 7000
# Matched as bare text, NOT as `id: "New player name"`. `primitives/Input`
# deliberately emits no `id` and no `aria-label` (its header says why: an
# auto-generated id would clobber the `resource-id` every `tapOn id:` selector
# in the suite depends on), and maestro-web builds `resource-id` from
# `node.id || node.ariaLabel` — the ATTRIBUTE, not the computed accessible name
# — so this field has no resource-id at all. What it does have is its VALUE:
# maestro reads an <input> as `node.value`, so the run's own name is the field,
# exactly and uniquely. Nothing else on screen carries it — the near-match panel
# renders nothing while there are no matches, and the button's visible text is
# "Create player".
- assertVisible: "Samename${output.TOKEN}"

# ⚠️ THIS NEGATIVE WAS VACUOUS, AND THE SAME MEASUREMENT SAID SO.
# When it was written, `PlayerManagement` rendered every add-form message —
# `Added <name>.` and the refusals alike — in the PAGE-LEVEL status line, the
# FIRST child of the screen container at document y=293-313. The scroll to
# "Add a player" above leaves the page at scroll 349 (run 34437403394: that
# heading was read at viewport y=41 and it is at document y=390), which put the
# status area at viewport y=-56, off the top and pruned from the hierarchy.
# `assertNotVisible` on an element the driver cannot see passes whether or not
# the screen said it, so the step was proving nothing.
# NEO-260 fixed the underlying reason: `Added <name>.` now renders at the head
# of the detail column, `sticky` under the binder header, so it CANNOT be off
# screen when it exists — the negative is real from any page position, and the
# refusal it is paired against renders in the Create button's own row. This
# scroll stays because the steps after it need the top of the screen: the very
# next command taps "Birth year (optional)" in the add form, whose label the
# green run read at viewport y=559 with the page where this scroll leaves it.
# Positioning only; the target is unchanged.
- scrollUntilVisible:
    element:
      text: "Filter players"
    direction: UP
    centerElement: true
    timeout: 7000
- assertNotVisible:
    text: ".*Added Samename${output.TOKEN}.*"

# ============================================================
# STEP 3 — R2(b): CORRECT THE YEAR AND THE SAME CREATE GOES THROUGH
#
# The field is re-tapped before erasing because focus is not where the previous
# step left it — a disabled button never takes it. `eraseText: 6` clears the
# four digits with headroom.
#
# The helper line flipping back to the explanatory copy is the other half of
# STEP 2: it says the refusal was the FIELD's, and that it lifted.
# ============================================================

- tapOn: "Birth year \\(optional\\)"
- eraseText: 6
- inputText: "1960"
# Same helper line, same place below the fold — so the same scroll-as-assertion.
# The line flipping back to the explanatory copy is what says the refusal was
# the FIELD's, and that it lifted.
- scrollUntilVisible:
    element:
      text: "Tells this player apart from anyone else with the same name."
    timeout: 7000

- scrollUntilVisible:
    element:
      id: "Create player Samename${output.TOKEN}"
    timeout: 7000
- tapOn:
    id: "Create player Samename${output.TOKEN}"

# "Added <name>." is said ONLY for a row that was INSERTED — a create that
# adopted an existing row says "That player already exists — opened it."
# instead, which is exactly the string STEP 5 asserts. So this line is the
# create, not the adopt.

# THE CONFIRMATION MOVED. THIS SCROLL STAYED, AND NOT FOR THE ASSERTION.
#
# NEO-260 took `Added <name>.` out of `PlayerManagement`'s page-level status
# line and put it at the head of the DETAIL COLUMN, `sticky` under the binder
# header. The old line sat at document y=293-313 while the `Create player`
# button that earns it is at y=809-841: the button is fully visible only from
# scroll 216 and the line is clear of the 79px header only to scroll 214, so no
# scroll position on the 1024x629 viewport ever showed both, and the line's own
# insertion moved the page away from it (+39px of content above the scroll
# position, +39px of Chrome scroll anchoring). This flow was one of the six that
# reddened on it in run 34437403394. A stuck element reports its STUCK position
# to the driver — `binder-header`, `sticky top-0`, reads [64,16][228,61] in
# every hierarchy dump at every scroll — so the assertion below now passes from
# wherever the tap left the page, with or without this step.
#
# WHAT THIS STEP IS FOR NOW is the commands AFTER it: STEP 4 taps
# "Filter players" itself and then waits on the counter, both of which live in
# the filter row at the top of the screen and neither of which scrolls.
# It is positioning only, and nothing this flow proves changes. `Filter players`
# is still the right anchor — it is the label of the list this screen is built
# around and it is on the page whatever the create did, so a create that was
# genuinely REFUSED still fails on the assertion below with the refusal on
# screen in the screenshot. Its document position moved 332 -> 293 with the
# page-level line's removal, and the post-create scroll is now 405 (813 - 462
# for the button, +54 for the notice inserted above the scroll position), so
# the travel is one or two UP swipes of ~313px, landing the page at scroll 92
# or 0 — either of which puts the filter row and the notice on screen together.
- scrollUntilVisible:
    element:
      text: "Filter players"
    direction: UP
    centerElement: true
    timeout: 7000
- extendedWaitUntil:
    visible: ".*Added Samename${output.TOKEN}.*"
    timeout: 7000

# ============================================================
# STEP 4 — R2(c): THE YEAR IS STORED, AND THE MASTER ROW PRINTS IT
#
# The filter box still holds "zzzznotaplayer" from STEP 1, so it is erased
# rather than appended to. Past `SEARCH_MIN_CHARS` this screen switches to a
# server SEARCH, so the row below is read back out of the database rather than
# off the draft that was on screen a moment ago.
#
# Anchored `below:` the counter for the reason the sibling admin flow documents:
# maestro reports an input's current value as its text, so the filter box itself
# answers to this name. The counter renders between the box and the list, so
# "below the counter" is a list row and only a list row.
#
# The filter is left holding this name for the rest of the flow — the search is
# a live Convex query, so STEP 6's second row appears in it without retyping.
# ============================================================

- tapOn: "Filter players"
- eraseText: 20
- inputText: "Samename${output.TOKEN}"
- extendedWaitUntil:
    visible: "1 matches"
    timeout: 7000
- assertVisible:
    text: ".*b. 1960.*"
    below:
      text: "1 matches"

# ============================================================
# STEP 5 — R2(d)+(e): THE SAME NAME AGAIN, WITH NO BIRTH YEAR → ADOPT
#
# The form is reopened and the identical name typed. `players.nearMatches` finds
# the row this flow made, and the screen REACTS: the green button becomes
# "Open <name>" and creation is demoted to a plain "Create anyway" link. Waiting
# for that demoted control is an assertion in itself — it exists only when an
# exact match came back (~300ms after typing stops), so it proves the row
# persisted and that the hierarchy fired.
#
# Taking "Create anyway" with NO year offers the mutation no tiebreaker, so
# `adoptOrForkOnCreate` adopts the single candidate. That is the guard half of
# the feature: a repeated name does not become a second person by accident.
# ============================================================

- scrollUntilVisible:
    element:
      text: "Add player"
    centerElement: true
    timeout: 7000
- tapOn: "Add player"
- extendedWaitUntil:
    visible: "Add a player"
    timeout: 7000
- tapOn: "New player name"
- inputText: "Samename${output.TOKEN}"

# ONE command, not a wait and then a scroll. A bare `extendedWaitUntil` here
# would be asserting a control in the same button row as the one above — a row
# that sits BELOW THE FOLD when the page is where the previous step left it, and
# `extendedWaitUntil: visible` never scrolls. ("bottom-locked" is how this note
# used to put it; the spacer retired that word — see the header — but the fold
# problem it names is unchanged, which is why this step is a scroll.) That is
# exactly how the refusal line failed this flow in CI run 34071657961.
# `scrollUntilVisible` polls for it AND brings it on screen, and it still fails
# loudly if the demoted control never appears — which is the assertion this step
# is for: it exists only when an exact match came back.
- scrollUntilVisible:
    element:
      id: "Create player Samename${output.TOKEN} anyway"
    timeout: 7000
- tapOn:
    id: "Create player Samename${output.TOKEN} anyway"

# THE STEP THIS FLOW WAS RED FOR, AND THE ONE SITE THAT HAD NO POSITIONING AT
# ALL.
#
# Run 34442670233 runner 2 died here on `Assertion is false: "That player
# already exists — opened it." is visible`. The adopt itself SUCCEEDED, and the
# dump proves it rather than assuming it: root [0,-423][1009,1016] with the
# adopted player's own detail panel open, its `Player name` box holding this
# run's name and `Birth year` reading 1960 — only `onCreated` -> `selectPlayer`
# reaches that. What was not on screen was the message: `PlayerManagement` put
# it in the page-level status line at document y=293, and "Create anyway" was
# tapped at viewport y=428 with the page at scroll 390, so the line was at
# viewport y=-130. `extendedWaitUntil: visible` never scrolls, and the five
# sibling sites in this suite had each been given a positioning scroll in
# `1f0aa6b`. This one was missed.
# NEO-260 fixed the cause instead: the message renders at the head of the
# detail column and is `sticky` under the binder header, so it is on screen
# from any scroll position and the assertion below needs no help.
# THE SCROLL BELOW IS FOR THE TWO ASSERTIONS AFTER IT, which were never
# exercised post-spacer — the run has died before reaching them twice — and
# which would fail without it: "1 matches" is the counter in the filter row at
# document y~293-333, and at the post-create scroll (444) that is ~150px above
# the fold. Same anchor, same shape and same reasoning as STEP 3's.
- scrollUntilVisible:
    element:
      text: "Filter players"
    direction: UP
    centerElement: true
    timeout: 7000
- extendedWaitUntil:
    visible: "That player already exists — opened it."
    timeout: 7000

# Nothing was added. The list is still the one row, still carrying the year it
# was created with — so the adopt neither inserted nor overwrote.
- assertVisible: "1 matches"
- assertVisible:
    text: ".*b. 1960.*"
    below:
      text: "1 matches"

# ============================================================
# STEP 6 — R2(f): THE FEATURE — A YEAR NOBODY CARRIES FORKS A SECOND PERSON
#
# 1975 against a single row born 1960. `adoptOrForkOnCreate` reads that as the
# operator asserting a different man — they have been shown the existing row and
# pressed the button that says "anyway" — so it INSERTS rather than adopting.
#
# This is the only way in the product to reach two same-name players from the
# UI, and therefore the only thing that makes the review wizard's "Same name,
# different people" panel reachable at all outside the terminal-only preload.
# ============================================================

- scrollUntilVisible:
    element:
      text: "Add player"
    centerElement: true
    timeout: 7000
- tapOn: "Add player"
- extendedWaitUntil:
    visible: "Add a player"
    timeout: 7000
- tapOn: "New player name"
- inputText: "Samename${output.TOKEN}"
- tapOn: "Birth year \\(optional\\)"
- inputText: "1975"

# ONE command, not a wait and then a scroll. A bare `extendedWaitUntil` here
# would be asserting a control in the same button row as the one above — a row
# that sits BELOW THE FOLD when the page is where the previous step left it, and
# `extendedWaitUntil: visible` never scrolls. ("bottom-locked" is how this note
# used to put it; the spacer retired that word — see the header — but the fold
# problem it names is unchanged, which is why this step is a scroll.) That is
# exactly how the refusal line failed this flow in CI run 34071657961.
# `scrollUntilVisible` polls for it AND brings it on screen, and it still fails
# loudly if the demoted control never appears — which is the assertion this step
# is for: it exists only when an exact match came back.
- scrollUntilVisible:
    element:
      id: "Create player Samename${output.TOKEN} anyway"
    timeout: 7000
- tapOn:
    id: "Create player Samename${output.TOKEN} anyway"

# "Added", not "already exists" — the same string STEP 3 earned and STEP 5 was
# refused. One line, and it separates a fork from an adopt outright.

# Same anchor and same reasoning as STEP 3 and STEP 5. Since NEO-260 the
# confirmation itself needs no help — it renders at the head of the detail
# column, `sticky` under the binder header — but the two counter assertions
# below it do: "2 matches" is in the filter row at the top of the screen and
# `extendedWaitUntil: visible` never scrolls. This site parks DEEPER than STEP
# 3's: `NearMatchPanel` is rendering the row this fork is being made against,
# so the button row sits below its own height as well, and the scroll above
# stops as soon as "Create anyway" is merely visible.
- scrollUntilVisible:
    element:
      text: "Filter players"
    direction: UP
    centerElement: true
    timeout: 7000
- extendedWaitUntil:
    visible: ".*Added Samename${output.TOKEN}.*"
    timeout: 7000

# THE LIST IS THE PROOF, not the message. The filter has held this name since
# STEP 4 and the search behind it is a live Convex query, so the count moving
# 1 → 2 is the database answering: two rows now share this name, and they are
# told apart by the one field that can tell them apart.
- extendedWaitUntil:
    visible: "2 matches"
    timeout: 7000
- assertVisible:
    text: ".*b. 1960.*"
    below:
      text: "2 matches"
- assertVisible:
    text: ".*b. 1975.*"
    below:
      text: "2 matches"

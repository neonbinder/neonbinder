# R1 — Single feature: the /admin section (NEO-155). One admin nav destination
# now opens a hub listing the admin tools, and its two sub-tabs — Set Builder
# and Teams — each open their tool and can be switched between.
#
# SELF-CONTAINED (R3/R4): the entry URL is the whole setup — Clerk sign-in
# redirecting to /admin. No in-body login and no credential typing. The Set
# Builder panel does need the worker's marketplace credentials to render its
# cascade, and those come from the Phase-0 worker-bootstrap exactly as they do
# for the ~48 existing set-selector flows — this flow adds no credential step of
# its own.
#
# R2 — this cannot go green without the feature working. Every navigation is a
# real tap followed by a hard assert on content that ONLY the destination
# renders ("Team Management" for /admin/teams, the Set Builder panel's own
# subtitle for /admin/set-builder). Nothing is conditional, so a sub-tab that
# stopped routing fails the flow rather than skipping a branch.
#
# R3 — deliberately does NOT re-test the /set-selector -> /admin/set-builder
# redirect: the ~48 existing set-selector flows all enter by that old URL and
# gate on the same panel subtitle, so that redirect is already the most-covered
# line in the suite. Duplicating it here would add nothing.
#
# R7/R7a — read-only navigation. Nothing is created, edited or deleted, and
# nothing is touched inside the Set Builder cascade.
appId: com.neonbinder.web
url: ${APP_URL || "https://localhost:3000"}/testing/sign-in?redirect=/admin&worker=${WORKER_INDEX || "0"}
name: Admin — the hub and its Set Builder / Teams sub-tabs
tags:
  - smoke
  - admin
---
# Step 1: land on the admin hub.
#
# Gated on a HUB CARD's sentence, not on a heading. "Admin" is unusable — it is
# both the binder nav tab and the section h1. The section
# subtitle that used to serve here was deleted: it was one of five header lines
# stacked above the Set Builder cascade, and on the 1024x629 headless viewport
# that pushed the Sports column below the fold and broke setup.yaml. Anchoring
# on chrome makes a flow hostage to how tall the chrome is; a card's own
# sentence is content, and content is what this flow is actually about.
- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters from marketplace data.*"
    timeout: 45000

# Step 2: the hub lists BOTH tools with a sentence each — that is the reason
# bare /admin is a hub and not a redirect to the first tool. These sentences
# exist nowhere else in the app, so they identify the cards unambiguously (the
# tool NAMES appear twice on this page — once as a sub-tab, once as a card
# heading — and so cannot be used as selectors here). Step 1 already proved the
# Set Builder card; this is the one that proves the hub lists more than one.
- assertVisible: ".*Resolve team colors, confirm ambiguous matches.*"

# Step 3: open Team Management from its hub card. The description sits inside
# the card's link, so tapping it follows the link — this is the hub doing its
# job, not a nav shortcut.
- scrollUntilVisible:
    element:
      text: ".*Resolve team colors, confirm ambiguous matches.*"
    centerElement: true
- tapOn: ".*Resolve team colors, confirm ambiguous matches.*"
- assertVisible: "Team Management"

# Step 4: switch to the other tool with the sub-tab. On this page "Set Builder"
# appears only in that nav strip, so it is unambiguous here.
- scrollUntilVisible:
    element:
      text: "Set Builder"
    centerElement: true
- tapOn: "Set Builder"

# The Set Builder PANEL's own subtitle. Deliberately not "Set Builder": that is
# also the sub-tab's own label, which the section layout paints instantly on
# every /admin route, so waiting on it would pass before the panel had mounted.
# This sentence belongs to the panel alone — the /admin hub's card for the same
# tool reads "Build set parameters FROM MARKETPLACE DATA…", so "using
# marketplace APIs" is unique to the loaded panel and cannot be satisfied by the
# hub we started on. (NEO-155 removed the old "Set Builder" <h1> that every
# set-selector flow used to gate on; this string replaced it suite-wide.)
# 7s default (R5): mounting a route is a page load and a Convex read, not a
# marketplace round-trip.
- assertVisible: ".*Build set parameters using marketplace APIs.*"

# NEO-214 — and the Admin Tools panel is NOT on it. "Admin Tools" was the h2 of
# a box that sat between that subtitle and the cascade, offering "Reset Set
# Builder Data", "Seed Test Teams" and "Wipe Legacy Base Children": three
# irreversible, deployment-wide data operations one click away for any admin.
# They are scripted commands now, and the panel is gone.
#
# Placed HERE, immediately after the positive assert above, and that placement
# is the whole point: an assertNotVisible on its own passes on a blank page, a
# 404 or a route that never mounted. Following a hard assert that the Set
# Builder panel IS on screen means this can only be read as "the panel rendered
# and the box is not in it".
- assertNotVisible: "Admin Tools"

# Step 5: and back again, via the Teams sub-tab. "Teams" appears only in the nav
# strip on the Set Builder page, so this too is unambiguous.
- scrollUntilVisible:
    element:
      text: "Teams"
    centerElement: true
- tapOn: "Teams"
- assertVisible: "Team Management"

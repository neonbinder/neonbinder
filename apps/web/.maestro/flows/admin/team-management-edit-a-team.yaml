appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/admin/players&worker=${WORKER_INDEX || "0"}
name: "Team Management — select a team and edit it"
tags:
  - admin
---
# R1 — Single feature: the master-detail half of Team Management. Selecting a
# team from the list opens an edit panel for it, and the fields saved there
# persist. The sibling flow team-management-filter covers the master side
# (filtering, empty state); this one covers the detail side.
#
# WHY IT STARTS ON /admin/players (NEO-214). This flow used to edit "New York
# Yankees", a team that setup.yaml seeded globally by clicking a "Seed Test
# Teams" button. The button and the mutation behind it are gone, so `teams` is
# empty until something puts a row in it — and Team Management itself has no
# "add a team" control, by design: teams are born from the product's team
# typeahead (`teams.findOrCreate`), never typed into an admin form. So the flow
# creates the row the same way the product does, on the one screen that offers
# that typeahead outside the set-builder cascade: /admin/players' career-history
# editor. That is also the honest user story it now tells end to end —
#
#   an operator adds a player, gives them a team the app has never heard of,
#   and then goes to Team Management to fill in what that new team is.
#
# A team born that way carries nothing but a name, which is exactly the state
# Team Management exists to resolve, and it is what the panel's empty colour
# field asserts below.
#
# SELF-CONTAINED (R3/R4): the entry URL is the whole setup — Clerk sign-in
# redirecting to /admin/players. No in-body login and no credential step. The
# player it creates on the way is scaffolding, not coverage: the hand-entry
# feature itself belongs to player-management-add-and-career-history, and this
# flow deliberately asserts nothing about it beyond what it needs to get a team.
#
# R2 — this cannot go green without the feature working. It selects the team,
# proves the panel opened on a row with NO location and NO colours yet (both
# fields show their placeholders, so anything already filled in would fail),
# types a Location and a colour, saves, and asserts BOTH values survive a full
# reload and re-selection. A panel that rendered but did not persist, or
# persisted to the wrong row, fails.
#
# NEO-236 — WHAT "LOCATION" IS, AND WHY THE FLOW ENDS BACK IN A TEAM PICKER.
# A team's stored name is now two halves: `location` ("San Diego") and `name`
# ("Padres"), and the name anyone says out loud is the two composed. This
# screen is the ONLY place either half is typed, so it is the only place the
# split can be proved. After the save the flow reads the row back three ways —
# the panel heading says the FULL name, the master row PRINTS the short one
# while answering to the full one, and the Location box holds what was typed —
# and then walks back to the product's team typeahead and types the FULL name
# there. That last step is the whole risk of the split in one assertion: if the
# picker matched on `name` alone, an operator typing "San Diego Padres" would
# be offered "+ New team" and would quietly make a SECOND Padres.
#
# R7 / R7a — writes to NO shared row. Both the player and the team are named
# "<Prefix><token>" — ONE search token that carries the worker AND the attempt
# inside it (see the ATTEMPT_TOKEN note below) — so eight concurrent runners and
# a retry can never land on the same row, and nothing pre-existing is read or
# edited. The per-attempt half is mechanical as well as safe: the typeahead
# offers "+ New team <name>" only while no team of that name exists, so a name
# left behind by a previous attempt would render "Add <name>" instead. The
# player and the team diverge at their third character ("TME<token>" vs
# "TMT<token>"), so neither name is a prefix of the other.
#
# "Discover" is NEVER tapped. It performs a live outbound fetch of
# teamcolorcodes.com's sitemap (~1.5MB) from CI, against a third party with no
# contract.

- launchApp

# Wait for the COUNTER, not the "Player Management" heading — the heading paints
# while the list is still loading, and the filter would swallow keystrokes then.
- extendedWaitUntil:
    visible: ".*of .* players.*"
    timeout: 45000

# ── The minted name's single search token (SET-REGISTRY.md, "A name typed into
# a team picker must be a SINGLE search token") ──────────────────────────────
# `teams.search` / `players.search` are Convex SEARCH indexes: they match on
# TOKENS split at non-alphanumerics, so a hyphenated `Prefix-<attempt>` name
# tokenizes to ["Prefix", "<attempt>"] and every row any flow ever left behind
# under that prefix comes back as a suggestion — the per-attempt suffix buys
# nothing. Nothing deletes a team (the app has no delete-team affordance; the
# picker's "Remove team" only unlinks it from the card), so those rows stand for
# the whole run and are visible to every concurrent worker. The names below are
# therefore ONE alphanumeric token with no separator at all.
#
# The token is ATTEMPT_ID with its hyphens stripped: "w3-a1-23945" is three
# search terms, "w3a123945" is one — and it still carries the worker index, so
# the per-worker distinction the old `${WORKER_INDEX}` prefix gave is folded in
# rather than separated out.
#
# ⚠️ READ `ATTEMPT_ID`, NOT `output.ATTEMPT_ID`. The runner injects it with
# `-e ATTEMPT_ID=…`, which Maestro exposes as the binding `${ATTEMPT_ID}`; it
# never populates `output.ATTEMPT_ID`, so the older idiom always fell through to
# its 4-digit `Date.now()` fallback and two runners collided constantly.
#
# Single-quoted: the expression contains double quotes, and quoting the scalar
# keeps YAML out of it. `Date.now()` is the standalone-run fallback.
- evalScript: '${output.ATTEMPT_TOKEN = String(ATTEMPT_ID || Date.now()).split("-").join("")}'

# ── SCAFFOLDING: A PLAYER, SO THERE IS A CAREER EDITOR TO PICK A TEAM IN ────
# Every player row prints its sport beside the name, so with rows on screen the
# word "Baseball" is on the page a hundred times over and the sport picker below
# could not be identified by what it says. Filtering to a name nothing matches
# clears the list, and then "Baseball" belongs to the picker alone. (Same
# precondition, and the same reasoning, as
# player-management-add-and-career-history — see its note for the long version.)
- tapOn: "Filter players"
- inputText: "zzzznotaplayer"
- assertVisible: "No players match that filter."

# The sport is picked on the LIST's picker, with the add form closed: Maestro
# resolves a native picker's choice against the FIRST picker on the page, so a
# choice made while the form's own picker is also mounted lands in the wrong
# one. The form then opens with this sport already chosen.
- tapOn: "All sports"
- tapOn: "Baseball"

- tapOn: "Add player"
# The form's own heading — it gates the two taps below, which would otherwise
# reach for fields that have not mounted yet.
- assertVisible: "Add a player"
- tapOn: "New player name"
- inputText: "TME${output.ATTEMPT_TOKEN}"
# R8 case 1 -> R5's 7000. MEASURED over 4 green CI runs (n=3): `Element
# bounds` frozen at y=552 through `Scrolling try count: 0`..`5`, completing on
# the give-up path at 8.0 s EVERY run — the page is already at maximum
# scroll, so the target never reaches the centre band (250-375) and the five
# swipes buy nothing. NEO-260 ships the fix: a 208px spacer at the bottom of
# the authenticated shell (`h-[208px]`, src/layouts/binder-layout.tsx), which
# gives the page exactly that much more to scroll. 552 - 208 = 344 (centre
# 360) — and across 2,396 centred DOWN scrolls in 4 green CI runs the lowest
# give-up sat at a centre of 464, with clean accepts throughout this range.
# So it centres on the first swipe (measured 1.38-1.43 s) and the whole step
# costs ~2.1 s. 7000 DEPENDS on that spacer; delete it and this step reds.
- scrollUntilVisible:
    element:
      id: "Create player TME${output.ATTEMPT_TOKEN}"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Create player TME${output.ATTEMPT_TOKEN}"

# "Added <name>." is said only for a row that was inserted, so this is also the
# signal that the new player's own panel — and its career editor — is open.
- extendedWaitUntil:
    visible: ".*Added TME${output.ATTEMPT_TOKEN}.*"
    timeout: 7000

# ── THE TEAM THIS FLOW IS ACTUALLY ABOUT, CREATED FROM THE TYPEAHEAD ────────
# The career editor sits below the panel's five fields, past the fold on the
# 1024x629 headless viewport, so it is scrolled to and centred first.
# R8 case 1 -> R5's 7000. MEASURED over 4 green CI runs (n=6): `Element
# bounds` frozen at y=484 through `Scrolling try count: 0`..`5`, completing on
# the give-up path at 10.0 s EVERY run — the page is already at maximum
# scroll, so the target never reaches the centre band (250-375) and the five
# swipes buy nothing. NEO-260 ships the fix: a 208px spacer at the bottom of
# the authenticated shell (`h-[208px]`, src/layouts/binder-layout.tsx), which
# gives the page exactly that much more to scroll. 484 - 208 = 276 (centre
# 287) — and across 2,396 centred DOWN scrolls in 4 green CI runs the lowest
# give-up sat at a centre of 464, with clean accepts throughout this range.
# So it centres on the first swipe (measured 1.38-1.43 s) and the whole step
# costs ~4.2 s. 7000 DEPENDS on that spacer; delete it and this step reds.
- scrollUntilVisible:
    element:
      id: "Add team"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Add team"
- tapOn:
    id: "Search teams"
- inputText: "TMT${output.ATTEMPT_TOKEN}"

# NOTHING MATCHES THAT NAME — which is the precondition for creating it, and the
# reason the popover is now showing its "+ New team" row. It is also a real
# assertion about the name being this attempt's alone.
- assertVisible: "No matches."

# OPEN THE NEW TEAM DIALOG WITH ENTER, NOT BY TAPPING THE "+ New team" ROW.
#
# NEO-236 — the popover no longer creates anything. Its one create affordance is
# a row reading `+ New team "<typed>"…` (accessible name `New team <typed>`)
# that OPENS a dialog, and the dialog is where Location, Team name and League
# are answered and where the write happens.
#
# That row exists and is correctly labelled — but on this screen it cannot be
# tapped, and that is geometry, not flakiness. The career editor is the LAST
# thing on the player panel, so once the page is scrolled as far as it goes
# "+ Add team" sits at y=510-532 of the 629px headless viewport (measured, CI
# run 33875599981) and cannot be centred: there is no page left to scroll. Its
# popover is `absolute top-full`, so it opens BELOW that — search input at
# y=545-579, first row at y=583. One row fits. Two do not: with no match the
# popover renders "No matches." AND the "+ New team" row under it, which puts
# that row at y>=609, off the bottom of the screen. maestro-web still reports
# its layout bounds, so `tapOn` "succeeds" while the click lands outside the
# picker — which is a pointerdown-outside, so the popover closes and nothing
# opens. That is exactly how this step failed.
#
# Enter on the search input runs the SAME handler the row does: TeamPicker's
# keydown takes the highlighted match when there is one, and otherwise opens the
# New Team dialog. "No matches." above is what proves there is none, so Enter
# here can only mean "open the dialog" — and it needs no coordinates at all.
- pressKey: Enter

# THE DIALOG IS OPEN. It is portalled to `document.body` at `z-[60]` and
# `fixed inset-0 flex items-center justify-center`, so it is centred in the
# viewport and clipped by nothing — none of the geometry above can reach it.
#
# TWO assertions, because they say two different things.
#
# The HEADING is the dialog's `aria-labelledby` target, so it is what a screen
# reader announces on arrival — "New team: <what I typed>" is the dialog being
# correctly LABELLED. (It briefly was not: opening by CLICK used to blank the
# name, because the picker's focus-out handler read a stale "is the dialog open"
# flag and cleared the query behind the portal. Fixed under NEO-236 with a
# synchronous ref; this assertion is what keeps it fixed.)
#
# The NAME BOX and its VALUE is the dialog being correctly SEEDED — maestro-web
# reports an input by its value, so this says the search text really reached the
# field the operator is about to submit.
- assertVisible: "New team: TMT${output.ATTEMPT_TOKEN}"
- assertVisible:
    id: "New team name"
    text: "TMT${output.ATTEMPT_TOKEN}"

# THE WRITE. `Create team <composed full name>` is the SAME accessible name this
# flow has always used — it moved from the popover row onto the dialog's own
# button. Location is left blank and no League is picked, so the composed name
# is exactly what was typed and every later matcher is unchanged.
#
# Tapped by id rather than driven with a second Enter: the dialog's Create and
# Cancel are NeonButtons with an identical class string, and maestro-web's
# pressKey re-finds the focused element by an XPath that falls back to that
# class — so a synthetic Enter aimed at Create can land on Cancel.
- tapOn:
    id: "Create team TMT${output.ATTEMPT_TOKEN}"

# The chip is the proof the row was really created; creation is a round-trip and
# the chip is what the picker paints when it returns. Nothing else is done with
# the player — the stint is never added and the player is never saved, because
# the team row exists the moment `findOrCreate` returns, not when the player is.
- extendedWaitUntil:
    visible:
      id: "Remove team TMT${output.ATTEMPT_TOKEN}"
    timeout: 7000

# ════════════════════════════════════════════════════════════════════════════
# TEAM MANAGEMENT — the feature under test starts here.
# ════════════════════════════════════════════════════════════════════════════
- openLink: ${APP_URL || "http://localhost:3000"}/admin/teams
- extendedWaitUntil:
    visible: ".*of .* teams.*"
    timeout: 30000

# No tapOn before typing: the filter takes focus on arrival (NEO-156), and the
# assertion below is what proves the keystrokes landed. The name is unique to
# this worker and attempt, so unlike the old shared fixture it cannot be widened
# by a concurrent worker's get-or-create.
- inputText: "TMT${output.ATTEMPT_TOKEN}"

# The list narrows to the one team. Composed with the count so this cannot pass
# against an unfiltered list that merely happens to contain it.
- extendedWaitUntil:
    visible: "1 of .* teams.*"
    timeout: 15000

# Tap the ROW, anchored below the counter. maestro-web reports an input's
# current value as its text, so now that the filter box holds this exact name
# the box itself answers to that string too — and it sits above the list, so an
# unanchored tap could land in the filter instead of selecting the team. The
# counter renders between the two, so "below the counter" is the row and only
# the row.
- tapOn:
    text: "TMT${output.ATTEMPT_TOKEN}"
    below:
      text: "1 of .* teams.*"

# ── THE DETAIL PANEL, AND IT IS SHOWING THIS ROW'S REAL STATE ──────────────
# The panel's fields sit below the filter row, past the fold on the 1024x629
# headless viewport, so each field is scrolled to and centred — and each scroll
# IS the assertion (R6), which is why nothing re-asserts the same text after it.
#
# maestro-web reports an empty input by its PLACEHOLDER (value ‖ placeholder ‖
# aria-label), so a placeholder found here is proof the field mapped an ABSENT
# value rather than someone else's — the precondition that makes the save below
# mean something. Two placeholders are read, in the order the form lists them:
#
#   "San Diego" — the Location box (NEO-236). A team born from the typeahead
#                 has a name and nothing else, so its location is empty.
#   "#01214b"   — the Primary colour box. Same story, and the reason the list
#                 flags this row as needing attention.
#
# Neither string appears anywhere else on a screen filtered to one team, and
# the tap after each goes to the same node — the input itself rather than its
# label, the most direct handle there is, and the one that stops answering the
# moment a value is typed.
#
# ── EDIT AND SAVE ───────────────────────────────────────────────────────────
# Two fields, chosen deliberately: Location is the half of the name this ticket
# added, and the colour is what this screen exists to supply. Both are empty on
# arrival, so neither needs erasing first, and they are filled top-down in the
# order the form lists them (NEO-236 put Location and Name at the TOP, above the
# league and the colours) so every scroll below moves the page one way.
#
# R5: 7000, the bar. MEASURED in CI (green run, this flow's log): found on
# scroll try 1, y=500 → y=229, 1.44 s. Note that DROPPING the value would not
# put this on the bar — `scrollUntilVisible` defaults to 20 s, not 7 s
# (ScrollUntilVisibleCommand.DEFAULT_TIMEOUT_IN_MILLIS = "20000" in the pinned
# maestro-orchestra-models.jar), so the bar has to be written out.
- scrollUntilVisible:
    element:
      text: "San Diego"
    centerElement: true
    timeout: 7000
- tapOn: "San Diego"
- inputText: 'Loc${WORKER_INDEX || "0"}'
# THE ONLY COMPOSED NAME IN THE SUITE — and the one place the single-token rule
# has to be reasoned about rather than just applied. From this save onward the
# row's stored name is `Loc<w> TMT<token>`, which has a SPACE in it, so
# `nameNormalized` carries TWO search terms, "loc<w>" and "tmt<token>", and the
# search index will answer a query for either of them.
#
# That does not re-open the collision the rule closes. The rule protects the
# step where a flow types a name IN ORDER TO CREATE it and then reaches for the
# "+ New team" row: a stray suggestion there covers the row and replaces the
# typed text. Every such step in the suite — including the one 250 lines above,
# which typed `TMT<token>` and asserted "No matches." — still types ONE token
# that no other flow can produce, and the second term this row gains here is
# added AFTER that step, by a Save. It is inert besides: no flow types a name
# beginning "Loc".
#
# The one query in the suite that is deliberately MULTI-term is the full-name
# lookup at the bottom of this file, and it is safe for the opposite reason —
# it exists to prove the typeahead finds the composed row, asserts on the exact
# composed option id, and never reaches for a create affordance afterwards.
#
# Give a second flow a Location, or type one into a picker before creating, and
# both of those arguments lapse — the Location half would then need a
# per-attempt token of its own.

# R8 case 1 -> R5's 7000. MEASURED over 4 green CI runs (n=3): `Element bounds`
# FROZEN at y=490 through `Scrolling try count: 0`..`5` — not one of the five
# swipes moves it a pixel — completing on the give-up path at 7.7 s EVERY run.
# The panel is in normal document flow (TeamManagement.tsx renders it into a
# plain bordered div), so the freeze is not a fixed container: the page is
# already at its maximum scroll and nothing sits below the panel to scroll.
#
# NEO-260 ships the fix: a 208px spacer at the bottom of the authenticated
# shell (`h-[208px]`, src/layouts/binder-layout.tsx). 490 - 208 = 282 (centre
# 303), well inside the range where centring demonstrably succeeds — across
# 2,396 centred DOWN scrolls in 4 green CI runs the lowest give-up sat at a
# centre of 464. It centres on the first swipe (measured 1.38-1.43 s) and the
# whole step costs ~2.1 s. Jason 2026-09-09 ruled
# 7s across the board, and a step that reaches the give-up path every run is
# centring that never centres. 7000 DEPENDS on that padding landing.
- scrollUntilVisible:
    element:
      text: "#01214b"
    centerElement: true
    timeout: 7000
- tapOn: "#01214b"
- inputText: "#132448"

# Save and Discover only exist inside the panel, so reaching them is the other
# half of the proof that it opened rather than rendering the "Select a team"
# placeholder. Discover is asserted, never tapped — it fires a live outbound
# fetch of teamcolorcodes.com's ~1.5MB sitemap from CI.
# Same screen, same cause, same remedy as the colour box above: bounds FROZEN
# at y=552 across tries 0..5, give-up at 7.7 s over 4 green CI runs (n=3).
# 552 - 208 = 344 (centre 360). 7000 depends on the same 208px spacer.
- scrollUntilVisible:
    element:
      text: "Save"
    centerElement: true
    timeout: 7000
- assertVisible: "Discover"
- tapOn: "Save"

# GO AND LOOK AT THE STATUS LINE — it is not where Save is.
#
# `TeamManagement` prints `Saved <full name>` in the PAGE-LEVEL status line, the
# first child of the screen's container, ~250px above the fold at document
# y≈293; the panel that carries Save is the right-hand column far below it. The
# component says so itself, in the comment above `saveError`: the screen-level
# status line "on a panel that is usually scrolled past the fold, is off-screen
# at the moment Save is pressed" — which is why a REFUSED save was moved inline
# in NEO-236. The success message was left where it was.
# MEASURED. `extendedWaitUntil: visible` never scrolls, so this assertion can
# only read what is already on screen. Green CI 34361627641 passed it in 0.34 s
# with the page at maximum scroll (Save at y=552, i.e. document scroll 307): the
# status line was at viewport y≈-14 and six of its twenty pixels were on screen.
# That is the whole margin it ever had. NEO-260's 208px spacer
# (src/layouts/binder-layout.tsx) gives the page 208px more travel, and run
# 34429321550 runner 6 failed here with root bounds [0,-515][1009,625] — maximum
# scroll, 208 lower — putting the line ~222px above the viewport, where the
# driver prunes it from the hierarchy entirely.
# THE SAVE ITSELF WAS FINE, and the dump proves it rather than assuming it: 16 s
# after the tap the button still reads "Save" and not "Saving…", so `busy` had
# cleared; no `role="alert"` refusal is present, so the mutation did not throw;
# and the only branch left calls `onStatus({text: "Saved …"})`. The assertion was
# reporting where the confirmation renders, not whether the save happened.
# So re-anchor first. "Location" is the panel's own first field label and is on
# screen at maximum scroll (y=33 in the failure dump), so this scroll always
# finds it at try 0 and needs exactly one swipe to centre it (~y346), which
# leaves the page ~313px higher and the status line comfortably in view. It is
# positioning only: nothing about what this flow proves changes.
- scrollUntilVisible:
    element:
      text: "Location"
    direction: UP
    centerElement: true
    timeout: 7000

# The mutation confirms by name — and NEO-236 made that the COMPOSED name, so
# this line is itself the first read-back of the split: "Saved Loc0 TMT<token>"
# can only be said by a save that took the Location box and the Name box and
# put them together in that order.
- extendedWaitUntil:
    visible: '.*Saved Loc${WORKER_INDEX || "0"} TMT${output.ATTEMPT_TOKEN}.*'
    timeout: 15000

# ── IT PERSISTED ────────────────────────────────────────────────────────────
# A reload is what separates "the form still holds what I typed" from "the
# database holds it". Re-select and read both fields back.
- openLink: ${APP_URL || "http://localhost:3000"}/admin/teams
- extendedWaitUntil:
    visible: ".*of .* teams.*"
    timeout: 30000
# Same filter and same counter-anchored row tap as on the way in — see the
# comments above for why neither can be shortened.
- inputText: "TMT${output.ATTEMPT_TOKEN}"
- extendedWaitUntil:
    visible: "1 of .* teams.*"
    timeout: 15000
- tapOn:
    text: "TMT${output.ATTEMPT_TOKEN}"
    below:
      text: "1 of .* teams.*"
# ONE SCROLL, THEN EVERY READ-BACK IN ONE VIEWPORT.
#
# The "Location" label is the anchor because it is the only node on this screen
# that says that word, and centring it puts the whole top of the form on screen
# together with the list row beside it: measured against the shipped layout at
# 1024x629, centring the label at y≈315 puts the counter at ≈240, the master
# row at ≈259, the panel heading at ≈267 and the colour boxes at ≈480. So the
# four assertions below need no further scrolling, and each one names a
# DIFFERENT node than the scroll did (R6).
#
# R5: 7000, the bar. MEASURED in CI (green run, this flow's log): found on
# scroll try 1, y=476 → y=205, 1.43 s — this one DOES centre, because the page
# has just been re-entered at the top and has headroom below.
- scrollUntilVisible:
    element:
      text: "Location"
    centerElement: true
    timeout: 7000

# 1. THE HEADING SAYS THE FULL NAME. Anchored ABOVE the Location label, because
#    the live "Shows as: <full name>" preview under the two boxes says the same
#    string — and it sits BELOW the label, so this can only be the heading.
- assertVisible:
    text: 'Loc${WORKER_INDEX || "0"} TMT${output.ATTEMPT_TOKEN}'
    above:
      text: "Location"

# 2. THE MASTER ROW ANSWERS TO THE FULL NAME. Its `aria-label` is exactly
#    `teamFullName`, and maestro-web derives `resource-id` from `aria-label`, so
#    `id:` is the row and only the row. This is the handle every other flow taps
#    an admin team row by, which is why it is asserted rather than assumed.
- assertVisible:
    id: 'Loc${WORKER_INDEX || "0"} TMT${output.ATTEMPT_TOKEN}'

# 3. …AND PRINTS THE SHORT ONE. The matcher is fully anchored, so "TMT<token>"
#    cannot be answered by a node reading "Loc0 TMT<token>" — this fails if the row
#    ever goes back to printing the whole string. Two anchors pin it to the row:
#    BELOW the counter rules out the filter box (which holds this exact string
#    as its value), ABOVE the Location label rules out the panel's own Name box
#    (which holds it too, and sits under the label).
- assertVisible:
    text: "TMT${output.ATTEMPT_TOKEN}"
    below:
      text: "1 of .* teams.*"
    above:
      text: "Location"

# 4. THE LOCATION BOX HOLDS WHAT WAS TYPED. Anchored BELOW the label for the
#    mirror-image reason: the row's muted second line prints the location too,
#    and it sits above the label.
- assertVisible:
    text: 'Loc${WORKER_INDEX || "0"}'
    below:
      text: "Location"

# 5. And the colour came back too — the field now reports a VALUE where it
#    reported its placeholder before the save, which is the same field answering
#    differently for the same team.
- assertVisible: "#132448"

# ════════════════════════════════════════════════════════════════════════════
# THE OTHER SIDE OF THE SPLIT: THE TEAM TYPEAHEAD FINDS THE ROW BY ITS FULL
# NAME, SO NOBODY CAN CREATE A SECOND ONE (NEO-236)
#
# This is the risk the split introduces, and it is worth ten steps to close.
# The row now stores "Loc0" and "TMT<token>" in two columns. An operator adding a
# team to a card types what they say — the whole thing — and if the picker
# matched on the nickname column alone it would find nothing, offer to CREATE
# the name they typed, and leave the deployment with two teams that read
# identically.
#
# It runs in the picker this flow already used to make the team (the career
# editor on /admin/players), against the same player it created on the way in —
# no new fixture, no new screen.
# ════════════════════════════════════════════════════════════════════════════
- openLink: ${APP_URL || "http://localhost:3000"}/admin/players
- extendedWaitUntil:
    visible: ".*of .* players.*"
    timeout: 30000

# Filter to this attempt's player, then wait for THE ROW — never for the count.
#
# The count is not ours to predict. While a search term is present the counter
# reads "{n} matches", and that query runs through Convex's search index, which
# is WORD-WISE — which is the whole reason the name above is one token. The
# hyphenated "TME-2-r2-a1-4406" it replaced was a bag of tokens other workers'
# fixtures shared: measured in CI run 33982239886, this exact filter returned
# "3 matches" — our TME row plus a `KOPlayer-r5-a1-…` and a `PM-0-r0-a1-…` that
# merely shared the `a1` token. "TME<token>" is one token nothing else can
# share, so that particular collision is gone. The count still goes unasserted:
# it would be a claim about what the other seven runners happened to create
# rather than about this flow (the data-isolation rule), and the ROW below is
# both the settle gate and the real assertion anyway.
#
# The ROW is unambiguous and is the thing actually needed next: every admin
# master row prints its name in a `title`-bearing span, and maestro-web derives
# `resource-id` from `title`, so `id:` is that row and only that row (a `text:`
# matcher would also answer for the filter box now holding the same string).
# Waiting on it is both the settle gate and the real assertion — the search
# came back and it found the player this flow created.
- tapOn: "Filter players"
- inputText: "TME${output.ATTEMPT_TOKEN}"
- extendedWaitUntil:
    visible:
      id: "TME${output.ATTEMPT_TOKEN}"
    timeout: 15000
- tapOn:
    id: "TME${output.ATTEMPT_TOKEN}"

# R8 case 1 -> R5's 7000. MEASURED over 4 green CI runs (n=6): `Element
# bounds` frozen at y=484 through `Scrolling try count: 0`..`5`, completing on
# the give-up path at 10.0 s EVERY run — the page is already at maximum
# scroll, so the target never reaches the centre band (250-375) and the five
# swipes buy nothing. NEO-260 ships the fix: a 208px spacer at the bottom of
# the authenticated shell (`h-[208px]`, src/layouts/binder-layout.tsx), which
# gives the page exactly that much more to scroll. 484 - 208 = 276 (centre
# 287) — and across 2,396 centred DOWN scrolls in 4 green CI runs the lowest
# give-up sat at a centre of 464, with clean accepts throughout this range.
# So it centres on the first swipe (measured 1.38-1.43 s) and the whole step
# costs ~4.2 s. 7000 DEPENDS on that spacer; delete it and this step reds.
# Same step, same screen, same measurement as the first `Add team` above.
- scrollUntilVisible:
    element:
      id: "Add team"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Add team"
- tapOn:
    id: "Search teams"
- inputText: 'Loc${WORKER_INDEX || "0"} TMT${output.ATTEMPT_TOKEN}'

# THE ASSERTION THIS BLOCK EXISTS FOR. Every option in the typeahead is labelled
# `Add <the team's composed name>`, so this can only be satisfied by a stored row
# whose location and nickname compose to exactly what was typed. A picker still
# matching on the nickname column would show "No matches." here.
- assertVisible:
    id: 'Add Loc${WORKER_INDEX || "0"} TMT${output.ATTEMPT_TOKEN}'

# And the create row is gone, which is the same fact said the other way: an
# exact match suppresses it. NEO-236 — that row is `New team <typed>` now (it
# opens the dialog; `Create team <name>` is the dialog's own button and exists
# only while the dialog is open), so this is the id that proves it is absent.
# Corroborating rather than load-bearing — the career editor is near the bottom
# of the player panel, so a create row rendered here would hang below the fold
# where Maestro cannot see it either way. The assertion that carries the weight
# is the one above, and the one below.
- assertNotVisible:
    id: 'New team Loc${WORKER_INDEX || "0"} TMT${output.ATTEMPT_TOKEN}'

# Take the match with Enter — the picker's keydown selects the highlighted match
# when there is one — and the chip that comes back carries the FULL name. A chip
# is only ever painted from a row that exists, so this is the operator linking
# the team they already had instead of minting a twin.
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: 'Remove team Loc${WORKER_INDEX || "0"} TMT${output.ATTEMPT_TOKEN}'
    timeout: 7000

url: ${APP_URL || "https://localhost:3000"}/testing/sign-in?redirect=/dashboard&worker=${WORKER_INDEX || "0"}
name: Sign In
tags:
  - smoke
  - auth
---
- launchApp
# Gate on "Sign out", not the "Neon Binder" header — the header also renders on
# the signed-out landing page (app/landing.tsx), so it proves only that we left
# the bootstrap screen, not that sign-in actually succeeded.
- extendedWaitUntil:
    visible: "Sign out"
    timeout: 45000
- assertVisible: "Neon Binder"

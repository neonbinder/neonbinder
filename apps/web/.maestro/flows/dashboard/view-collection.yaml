url: ${APP_URL || "https://localhost:3000"}/testing/sign-in?redirect=/dashboard&worker=${WORKER_INDEX || "0"}
name: View Collection (Dashboard)
tags:
  - smoke
  - dashboard
---
- launchApp
# Gate on the dashboard's own content, not the "Neon Binder" header — the header
# also renders on the signed-out landing page (app/landing.tsx), so it proves
# only that we left the bootstrap screen, not that /dashboard rendered.
- extendedWaitUntil:
    visible: "COMING SOON"
    timeout: 45000
- assertVisible: "Neon Binder"

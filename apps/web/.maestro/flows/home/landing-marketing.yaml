url: ${APP_URL || "https://localhost:3000"}
name: Landing Page Marketing Content
tags:
  - marketing
  - home
---
- launchApp
- assertVisible: "Neon Binder"

# Free Tier section
# R5: 7000, the bar — MEASURED over 4 green CI runs (n=3), worst sample 2.93 s.
- scrollUntilVisible:
    element:
      text: ".*Free Tier.*"
    timeout: 7000

# Feature detail sections (6-up grid — NEO-118 added the shipping-label card,
# NEO-207 the two Print Shop cards). Two rows on desktop now, so the later
# cards need scrolls rather than bare assertVisible on the 1024x629 viewport.
# R5: 7000, the bar — MEASURED over 4 green CI runs (n=3), worst sample 5.03 s.
- scrollUntilVisible:
    element:
      text: ".*Collection Tracking.*"
    timeout: 7000
- assertVisible:
    text: ".*AI-Based Card Identification.*"
- assertVisible:
    text: ".*Inventory.*"
# R5: 7000, the bar — MEASURED over 4 green CI runs (n=3), worst sample 2.81 s.
- scrollUntilVisible:
    element:
      text: ".*Shipping Labels.*"
    timeout: 7000
# R5: 7000, the bar — MEASURED over 4 green CI runs (n=3), worst sample 0.59 s.
- scrollUntilVisible:
    element:
      text: ".*Spine Labels in Team Colors.*"
    timeout: 7000
- assertVisible:
    text: ".*9-Pocket Placeholder Sheets.*"

# How It Works section
# R5: 7000, the bar — MEASURED over 4 green CI runs (n=3), worst sample 2.74 s.
- scrollUntilVisible:
    element:
      text: "How It Works"
    timeout: 7000

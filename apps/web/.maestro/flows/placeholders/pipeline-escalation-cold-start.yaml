# R1 — Single feature: the placeholder pipeline's HEAVY escalation path and its
# cold-start notice (NEO-175). Six INSET-on-noise scans go in; the fast classical
# service DECLINES every one (there is a card to crop out of a background), so
# Convex re-enqueues each to the HEAVY BiRefNet service, which cold-loads the
# ~191s model. The one thing this flow exists to prove is that WHILE that heavy
# cold start runs, the user is TOLD — the "Warming up the full card processor…"
# notice is on screen — rather than staring at a frozen screen. It then proves
# the batch still finishes correctly through the heavy service.
#
# The FAST path (frame-filling scans → accepted in ~1-2s → no cold start) is the
# opposite user case, proved by pipeline-pairs-uploaded-scans.yaml. This flow is
# the escalation half.
#
# R2 — It cannot go green without the feature.
#   * If nothing escalated (a regression where the fast path accepted these inset
#     cards), `heavyWarming` never turns true, the notice never renders, and
#     Step 3 times out and FAILS.
#   * If images escalated but the notice was never shown — the exact "frozen
#     screen" bug this flow is the guard against — Step 3 FAILS.
#   * If the heavy service dropped or failed an image, the completion arithmetic
#     ("6 of 6 … 0 failed, 3 pairs") never matches and Step 6 FAILS. Every image
#     can only reach "done"/counted via a HEAVY completion (an escalated row is
#     not counted until heavy resolves it), so 6/6 here proves the heavy service
#     processed all six.
# There is no `when:` branch anywhere in it, and the precondition proves a real
# six-image job exists before any wait.
#
# R3 — Nothing else covers the escalation path. The fast-path and print-layout
# placeholders flows do not. Both fixture sets are described in
# apps/web/scripts/generate-placeholder-fixtures.py.
#
# R4 — Standard /testing/sign-in entry, no in-body login. It uses the DEFAULT
# fixture set (the inset cards), so the entry adds no `fixtures=` param.
#
# R7 — Non-destructive: a per-user placeholder job under the signed-in worker's
# own account; no shared/marketplace data. It never taps "Abort Session".
#
# ── WHY A TESTING PAGE UPLOADS THE FILES ──────────────────────────────────
# maestro-web cannot drive a file input, so /testing/seed-placeholder-upload
# fetches the committed fixtures and pushes them through the SAME client upload
# path the real page uses (same signed POST policy, same GCS objects, same
# pipeline kickoff); only the OS picker is bypassed. Gated on
# VITE_CLERK_TESTING_ENABLED plus a server-side secret unset in production.
#
# ── WHY THE INSET FIXTURES ESCALATE ───────────────────────────────────────
# apps/web/public/placeholder-fixtures/, generated by
# apps/web/scripts/generate-placeholder-fixtures.py (default mode). Each card is a
# 720x1010 rectangle INSET on a grainy scanner bed — a smaller card on a uniform
# margin. The fast classical pass sees a card to crop OUT of a background, which
# is not the "already a frame-filling card" identity case, so it declines and the
# image escalates to the heavy model (validated against the real fast_tiered_crop:
# all six return None → escalate). Both sides print the same full name so the
# identity pool still pairs them into three.
appId: com.neonbinder.web
url: ${APP_URL || "https://localhost:3000"}/testing/sign-in?redirect=/testing/seed-placeholder-upload&worker=${WORKER_INDEX || "0"}
name: Placeholder pipeline (heavy escalation) — inset scans, cold-start notice, three pairs
tags:
  - placeholders
  - regression
---
# Step 1: sign in, then the seed page uploads the six inset fixtures and forwards
# to the run view. This wait covers cold Clerk sign-in, fetching six fixtures,
# and six real signed-POST uploads to GCS — an external round-trip, which is why
# it is allowed past the 7s budget.
- launchApp
- extendedWaitUntil:
    visible: "Placeholder Scans"
    timeout: 90000

# Step 2: PRECONDITION — a real six-image session exists. Matches at any point in
# the run and pins the batch size before we commit to waiting.
- assertVisible: ".*of 6 images processed.*"

# Step 3a: bring the session panel into view so the cold-start notice's location
# is on screen when it appears. The notice renders asynchronously (only once the
# first fast decline has escalated an image), and extendedWaitUntil never scrolls,
# so we position first on a STABLE element that is present from the start and sits
# just below where the notice appears: the "resolver calls" line. No
# centerElement — this line sits high on the page with little above it to centre
# against (centering there cannot settle), and this is a position-only scroll, not
# a scroll-to-tap.
- scrollUntilVisible:
    element:
      text: ".*resolver calls.*"

# ── Step 3: THE hard requirement — the user is told during the cold start ──────
# `heavyWarming` turns true the moment the first image escalates and stays true
# until the first HEAVY result lands (the ~191s cold load), so this notice is on
# screen for that whole window — the visible progress the user must see instead of
# a frozen screen. This is the sanctioned wait on a live compute round-trip: the
# fast declines that trigger it are a real fast-service pass. It resolves the
# instant the notice appears (typically well under a minute, since the fast
# instances are pre-warmed and declines are quick), so the 120s ceiling is margin
# for a fast-service cold start, not time this burns. The regex tolerates the
# exact copy "…the full card processor…" via `.*` between "the" and "card".
- extendedWaitUntil:
    visible: ".*[Ww]arming up the .*card processor.*"
    timeout: 120000

# Step 4: the per-image "Escalating — deeper processing…" badge. While
# `heavyWarming` is true (which Step 3 just proved), NO escalated image has
# resolved yet, so every escalated row is still processing on the heavy service
# and badged. scrollUntilVisible scrolls DOWN into the Images section and IS the
# assertion (R6): if nothing is escalating, it scrolls to the end and fails.
- scrollUntilVisible:
    element:
      text: ".*Escalating.*deeper processing.*"

# Step 5: re-anchor the status line into view for the completion wait. Step 4
# scrolled down to the Images section, so the status line is now ABOVE — scroll
# UP to it. Plain scroll (no centerElement): it leaves the line low in the
# viewport, which keeps it on screen even after the cold-start notice above it
# disappears (the first heavy result clears `heavyWarming`, removing ~70px above
# the line). extendedWaitUntil below never scrolls, so the line must be in view
# before it runs.
- scrollUntilVisible:
    direction: UP
    element:
      text: ".*of 6 images processed.*"

# ── Step 6: the batch finishes through the HEAVY service (<=5 min) ─────────────
# This is the ONE sanctioned multi-minute wait, and only because Step 3 proved
# the user is watching visible progress the whole time. It must cover the heavy
# service's ~191s BiRefNet cold load for the first escalated image PLUS the rest
# draining at the heavy pool's capacity (dev/preview run 3 heavy instances, so
# six images are ~two warm waves after the cold start). Every number is
# load-bearing: six accounted for, none failed, exactly three pairs — a dropped
# image, a failed heavy crop, or a mis-pair produces different numbers and fails
# here. A warm-and-drained batch that genuinely needs longer than five minutes is
# a heavy-capacity PRODUCT finding to raise, never a timeout to inflate.
- extendedWaitUntil:
    visible: ".*6 of 6 images processed, 0 failed, 3 pairs.*"
    timeout: 300000

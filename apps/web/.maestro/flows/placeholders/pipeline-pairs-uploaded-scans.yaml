# R1 — Single feature: the placeholder scan pipeline on its FAST path (NEO-175).
# Six FULL-BLEED card scans go in as one upload; because each fills the frame,
# the fast classical service accepts every one as a "frame" identity in seconds
# and NONE escalates to the heavy model — all six process on the fast path with
# zero failures. This is the common real-user case — a folder of already-cropped
# scans — and the path the product must keep fast.
#
# The HEAVY escalation path (cards in the scanner bed's corner → the ~191s
# BiRefNet cold start → the "A few of these need a closer look…" notice) is a
# DIFFERENT user case, proved by its own flow, pipeline-escalation-cold-start.yaml,
# and so is the fast QUAD crop of cards centred on a scanner bed
# (pipeline-fast-crops-inset-scans.yaml). This flow proves the identity case:
# fast in, nothing to crop, no model.
#
# This is the release gate for the fast pipeline: signed-URL upload to GCS, the
# Convex workpool fanning images at the FAST Cloud Run service's capacity, the
# classical crop, Google Vision OCR, and the pairing port.
#
# R2 — It cannot go green without the feature. Five proofs, none of which a
# broken fast pipeline can satisfy:
#   * Step 3 waits for "All 6 photos read." — every row has SETTLED. That alone
#     is not the zero-failures proof (a failed row counts as settled); the
#     arithmetic in Step 4 is.
#   * Step 3's 180s ceiling is what proves these cards stayed on the FAST path.
#     The only other way they can be read is the HEAVY service, and HEAVY cannot
#     settle six inside it: a PR preview's heavy cap is 3
#     (convex/preprocessCapacity.json), so six escalations take at least two
#     rounds of CPU BiRefNet inference (~124s each, the arithmetic in
#     pipeline-escalation-cold-start.yaml Step 6), ~248s before any cold load. A
#     regression that pushed these frame-filling cards onto the heavy service
#     (the fast path silently declining them) fails Step 3 on the ceiling.
#     There is deliberately NO absence check on the cold-start notice: see the
#     note under Step 3.
#   * "3 pairs ready to print." (Step 4) accounts for every image: 3 pairs x 2 =
#     6. Pairing reads only rows whose status is "done", so this is also the
#     proof that none failed. A pipeline that lost an image, or a matcher that
#     trusted a misread side label and left two "backs" unpaired (exactly what
#     this flow asserted as "2 pairs" before NEO-327), lands on a different
#     number and fails here.
#   * Steps 5 and 7 read WHICH scan is the front of each pair, off the review
#     grid's side captions ("Front · <file>"). Every card's back is uploaded
#     BEFORE its front (see "WHY BACK-FIRST" below), so a pairing that let
#     arrival order pick the side would caption 02-vorkle-back.jpg as the front
#     and fail.
#   * Step 6 asserts the crops the pipeline wrote can be SHOWN back to the
#     collector: the signed-read mint answers and the review renders an image,
#     not "Image unavailable" (NEO-315).
# There is no `when:` branch anywhere in it, and the precondition below proves a
# real six-image job exists BEFORE the wait.
#
# ── NEO-327: WHY THIS FLOW USED TO ASSERT TWO PAIRS ──────────────────────────
# The fixture set was always three pairs, but this flow asserted "2 pairs ready
# to print." plus "Not paired (2)", and called that a synthetic-fixture
# artifact: the classifier labelled the full-bleed Grebble VORKLE front "back",
# the matcher only ever paired a "front" with a "back", so the pool held two
# fronts and four backs and two backs were left over. It was not an artifact.
# It was the product bug NEO-327 fixed, and a real collector hits it whenever a
# front carries little text. Pairing now forms a pair on identity (the same
# player on both scans), and only then orients it: a side the person set wins;
# otherwise the scan with clearly more Vision text is the back; the classifier's
# label only breaks a text-count tie and is never a gate; upload order never
# decides. (The classifier prompt was fixed in the same ticket, but this flow
# does not depend on that — orientation by text holds on its own.)
#
# ── WHY BACK-FIRST ──────────────────────────────────────────────────────────
# The entry URL adds `order=back-first`, which makes the seed page upload each
# adjacent manifest pair swapped: 02, 01, 04, 03, 06, 05. So every BACK gets the
# lower entry index and reaches the pipeline first. Under the old matcher, and
# under any regression that orients by arrival, 02-vorkle-back.jpg would be the
# front of its pair. Steps 5 and 7 assert the opposite, by filename.
#
# WHICH pairs formed, and at what confidence or mechanism, is still NOT
# asserted beyond the side captions — that is a model-dependent per-pair verdict
# owned by convex/lib/pairing/*.test.ts, and NEO-152 made confidence
# legitimately fixture-dependent. The side captions are asserted because they
# are the feature: three scans named *-front.jpg captioned "Front", with three
# pairs from six scans, leaves only the three *-back.jpg scans to be the backs.
#
# R3 — Nothing else covers this. pipeline-escalation-cold-start.yaml exercises
# the ESCALATION path and pipeline-fast-crops-inset-scans.yaml the fast quad crop;
# flip-edge-mirrors-the-backs tests print-sheet layout, not intake. Every fixture
# set and this flow's entry are described in
# apps/web/scripts/generate-placeholder-fixtures.py.
#
# R4 — Standard /testing/sign-in entry, no in-body login. The only additions to
# the entry URL are `fixtures=placeholder-fixtures-fullbleed`, which tells the
# seed page WHICH committed fixture set to push through the real upload path,
# and `order=back-first` (NEO-327, "WHY BACK-FIRST" above). Both ride inside the
# sign-in `redirect`, so the seed page's `?` `=` and `&` are percent-encoded
# (%3F %3D %26); a bare `&` would end the redirect and hand `order` to the
# sign-in page instead.
#
# R7 — Non-destructive: the flow creates its own upload session under the
# signed-in worker's own account and touches nothing shared (no marketplace set —
# this is a per-user placeholder job). Closing the session (Step 4) is NOT
# destructive — it is the batch's normal terminal transition (collecting →
# pairing → succeeded), the sanctioned way to finish a stream. It deliberately
# does NOT tap "Discard this batch", which IS destructive.
#
# ── WHY A TESTING PAGE UPLOADS THE FILES ──────────────────────────────────
# maestro-web cannot attach a file to <input type=file> (there is no working
# inputFile/attachFile in the YAML surface; CdpWebDriver.addMedia is an empty
# stub that reports COMPLETED having uploaded nothing). So the OS file picker is
# genuinely undrivable. /testing/seed-placeholder-upload fetches the committed
# fixtures and pushes them through the SAME client upload path the real page uses
# — the same signed POST policy, the same GCS objects, the same pipeline kickoff.
# Only the picker is bypassed. It is gated on VITE_CLERK_TESTING_ENABLED plus a
# server-side secret unset in production.
#
# ── WHY THE FULL-BLEED FIXTURES ───────────────────────────────────────────
# apps/web/public/placeholder-fixtures-fullbleed/, generated by
# apps/web/scripts/generate-placeholder-fixtures.py --full-bleed. Each card FILLS
# the whole frame apart from a thin border ring, so the NEO-175 fast classical
# pass reads it as an object covering >=92% of a card-aspect frame — the "frame"
# identity verdict that keeps it on the fast path (validated against the real
# fast_tiered_crop: all six return the input untouched, none escalates). Each
# front and back print the SAME full player name so the identity pool pairs them,
# and each back carries a card number, a ~40-word blurb and a copyright line
# where its front carries only the name, so the back always has clearly more text — the signal NEO-327 orients
# on. Manifest (public/placeholder-fixtures-fullbleed/manifest.json, written
# front-first): 01-vorkle-front.jpg, 02-vorkle-back.jpg, 03-quillden-front.jpg,
# 04-quillden-back.jpg, 05-mossbaum-front.jpg, 06-mossbaum-back.jpg — three
# pairs; back-first upload order is 02, 01, 04, 03, 06, 05.
appId: com.neonbinder.web
url: ${APP_URL || "https://localhost:3000"}/testing/sign-in?redirect=/testing/seed-placeholder-upload%3Ffixtures%3Dplaceholder-fixtures-fullbleed%26order%3Dback-first&worker=${WORKER_INDEX || "0"}
name: Placeholder pipeline (fast path) — six frame-filling scans process fast and pair front-side-up whatever order they arrive in
tags:
  - placeholders
---
# Step 1: sign in, then the seed page uploads the six full-bleed fixtures and
# forwards to the run view for the session it just created.
#
# This wait covers the whole chain: cold Clerk sign-in, fetching six fixtures,
# and six real signed-POST uploads to GCS (~300KB each). That upload is an
# external round-trip, which is why it is allowed past the 7s budget.
- launchApp
- extendedWaitUntil:
    visible: "Upload your cards"
    timeout: 90000

# Step 2: PRECONDITION — a real six-image session exists. The status line reads
# "<status> — <n> of 6 images processed, ...", so this matches at any point in
# the run and pins the batch size before we commit to waiting on it. It also
# proves the status line is on screen without scrolling, which Step 3 relies on.
# The panel exists at all — it renders as soon as a job id is in the URL. The
# old assertion matched a composed status line ("… of 6 images processed …")
# that NEO-152 replaced with stage-specific copy: while images are in flight it
# reads "Reading your cards — N of 6 done.", and the instant the last one lands
# it becomes "All 6 photos read." A precondition cannot depend on which of those
# it catches, so it asserts the panel and lets Step 3 gate on the real state.
# The session panel sits BELOW THE FOLD on the CI viewport (1024x625), so it has
# to be scrolled to before anything in it can be asserted. Measured on the real
# page: "Upload your cards" is at y=533 — the last thing on screen — while the
# session heading is at y=653 and the status line at y=714. `assertVisible` and
# `extendedWaitUntil` never scroll, so they can only ever see the top of the
# page. `scrollUntilVisible` scrolls AND is the assertion (it fails if it
# reaches the end without a match), so it does both jobs here.
#
# This is what NEO-152 changed out from under these flows: the old /placeholders
# stopgap was a short page whose status line was above the fold, and the flows
# were written against that. The real tool leads with the dropzone.
- scrollUntilVisible:
    element:
      text: "Your cards"
    centerElement: true
    timeout: 7000

# ── Step 3: the fast-path completion wait ─────────────────────────────────────
# All six images process on the FAST classical service and none touches the model.
# Warm, the fast /process-entry is ~4s/image; but the E2E runs against a COLD
# Convex preview with no warm traffic, so the burst pays fast-service cold-starts
# (~22s to spin the first instance) plus contention from other queue flows. 120s
# absorbs that cold batch with margin while still catching a real regression — a
# fast path that genuinely needs longer than two minutes for six frame-filling
# cards is a PRODUCT finding to raise, not a timeout to inflate. The
# "N of 6 images processed" counter is visible progress the whole time. Every
# number in the assert is load-bearing: six accounted for, none failed; a dropped
# image or a crashed crop produces different numbers and fails here. The pair
# count is not available yet at this point — it is written by the FINAL pairing
# run, which Step 4 fires by finishing the batch. The status line is above the
# fold (Step 2), and extendedWaitUntil never scrolls, so no scroll is needed.
# 180s, not the 120s this flow used to carry. The identical wait — six
# frame-filling fixtures through the fast path — is budgeted at 180s in
# flip-edge-mirrors-the-backs.yaml, and two flows disagreeing about how long the
# same operation takes is a bug in one of them. Neither number was ever
# observed, because until now this wait could not see the status line at all
# (it is below the fold; see the scroll note above), so both flows failed before
# reaching it. Taking the more conservative value already in the tree is not
# inflating a budget to hide a slow path: it resolves the instant the batch
# completes, and a fast path that genuinely needs longer than three minutes for
# six cards is still a PRODUCT finding to raise rather than a number to raise.
- extendedWaitUntil:
    visible: "All 6 photos read."
    timeout: 180000

# WHY NO ABSENCE CHECK ON THE COLD-START NOTICE HERE. This flow used to assert
# `assertNotVisible: ".*A few of these need a closer look.*"` at this point, as
# the guard against a batch that quietly escalated. It could never fail. The
# notice renders only while `heavyWarming` is true, and `deriveHeavyWarming`
# (convex/placeholderPipeline.ts) is true only while an escalated row is still
# processing — so once "All 6 photos read." is on screen it is false whatever
# happened, escalated or not. Before Step 3 resolves the notice MAY be on screen
# under that regression, depending on how far the fast declines have got, so an
# absence check there would not be deterministic either. The 180s ceiling above
# is the discriminator: a fully escalated batch cannot reach 6/6 inside it (R2
# note in the header). If GPU heavy inference (NEO-173) ever brings six heavy
# crops under 180s, this flow loses that proof and needs another one.

# ── Step 4: CLOSE the session so the FINAL pairing run records the count ───────
# The 6/6 completion above happened while the stream was still "Collecting": the
# provisional pairing runs formed the pairs but deliberately do NOT record
# the batch as SUCCEEDED. Only the FINAL run does, and it fires when the stream
# is CLOSED. Without this step the panel stays on "All 6 photos read." and Step
# 5 never sees the finished state.
- scrollUntilVisible:
    element:
      text: "Finish the batch"
    centerElement: true
    timeout: 7000
- tapOn: "Finish the batch"
# Finishing is guarded behind an "are you sure". Its focus opens on the cancel
# choice (so a reflexive Enter does the safe thing), which is why the confirm is
# the SECOND button, "Finish it".
- assertVisible: "Finish this batch?"
- tapOn: "Finish it"
# Wait for the batch to reach its terminal state. For a small batch (this flow's
# six images; ≤100), the close mutation finalizes pairing INLINE in its own
# transaction — the final pairing and markJobSucceeded commit together, NOT via a
# scheduled runPairing hop — then the reactive push flips the panel straight to
# the finished copy. There is no external compute here: every image is already done,
# so there is no crop/OCR round-trip. The status line goes "Collecting" →
# the finished state directly (no visible "Pairing" step for a small batch), and
# the pair count in that copy is written by the same transaction — so once
# "3 pairs ready to print." is on screen the final run has demonstrably
# completed.
#
# Three pairs from six photos is the arithmetic proof (R2 note in the header):
# every image was read, none failed, and none was left over. Before NEO-327 this
# read "2 pairs" because the matcher refused to pair two images the classifier
# had both labelled "back"; that refusal is gone, and a regression back to it
# fails here.
#
# R5: 7000, the in-app bar. The finalize is our own server answering the
# "Finish it" tap — an inline mutation, sub-second even under the preview's
# runner contention — and the identical wait in pipeline-fast-crops-inset-scans
# and pipeline-escalation-cold-start already holds to 7000. (This flow carried
# 15000 from the days the FINAL run was a scheduled action; NEO-175 made it
# inline.) A finalize that misses 7s is a product finding, not a bigger number.
- extendedWaitUntil:
    visible: "3 pairs ready to print."
    timeout: 7000

# ── Step 5: every pair is FRONT-SIDE-UP, whatever order the scans arrived in ──
# The NEO-327 proof. Each pair in "Check the pairs" captions its two scans
# "Front · <file>" and "Back · <file>" — ONE text node per caption
# (review-grid.tsx `sideCaption`), so a plain full-match selector reads it.
#
# 01-vorkle-front.jpg is the load-bearing one: it was uploaded AFTER its back
# (`order=back-first`), so a pairing that let arrival or entry order pick the
# side captions it "Back" and 02-vorkle-back.jpg "Front", and this fails. It was
# also the scan the old classifier misread as a back — the one this flow used to
# leave in "Not paired". 03 and 05 are the other two fronts, each likewise
# uploaded after its back. Three fronts named *-front.jpg plus "3 pairs" leaves
# the three *-back.jpg scans as the backs; 02-vorkle-back.jpg, the very first
# file uploaded, is asserted as a back explicitly because "first in" is exactly
# what the old matcher would have made a front.
#
# WHY RE-ANCHOR ON "Check the pairs" BEFORE EVERY CAPTION. Pairs render in
# insertion order (listPlaceholderPairs reads the by_job index raw), which
# depends on which images finished first, so the row a caption sits in is not
# deterministic. scrollUntilVisible only scrolls one way: a DOWN scroll cannot
# find a caption in a row above the one just centred. Centring the heading
# first puts every pair row at or below the viewport middle, so each DOWN
# scroll finds its caption wherever the matcher put it. The heading is above
# the list, so the re-anchor is UP. (R6: these scrolls ARE the assertions; no
# assertVisible follows them. R5: every one states the 7000 in-app bar.)
#
# The review step existing at all is the correction surface NEO-152 §3
# requires, which is what makes the pairing trustworthy rather than merely
# present.
- scrollUntilVisible:
    element:
      text: "Check the pairs"
    centerElement: true
    timeout: 7000
- scrollUntilVisible:
    element:
      text: "Front · 01-vorkle-front.jpg"
    centerElement: true
    timeout: 7000

# ── Step 6: the processed crops can be SHOWN back to the collector (NEO-315) ────
# Each scan in a pair row renders its crop through the signed-read mint
# (createPlaceholderImageDownloadUrl, via ScanImage). NEO-315 rewrote that mint
# (the memoised extension skips the storage HEAD, the storage client is cached
# per isolate) and changed how the pipeline writes the crop it serves (the
# cascade's already-rotated bytes are stored as-is). If the mint throws — no
# object at the key the row describes, a signing failure — the scan shows
# "Image unavailable" instead. Nothing else in the suite looks: PrintRun falls
# back to numbered pockets in silence, and flip-edge asserts only the pocket
# numbers.
#
# WHY A NEGATIVE CHECK. maestro-web drops <img> from the view hierarchy
# entirely (`INVALID_TAGS` in the driver's maestro-web.js), so a loaded scan
# has no user-visible handle at all: its `alt` never reaches a selector. The
# only states the driver can see are the two placeholders ScanImage draws in
# the image's own box: "Loading image…" while the mint is in flight, and
# "Image unavailable" once it has failed (after one re-mint on a load error).
#
# WHY THE CHECK CAN FAIL HERE (not a look-somewhere-else no-op). Step 5 leaves
# the "Front · 01-vorkle-front.jpg" caption centred. Each scan's box (h-28,
# 112px) sits directly ABOVE its own caption in the same figure, so the Vorkle
# pair's two image boxes — and either placeholder text drawn in them — are on
# screen, and so are the neighbouring rows' within half a viewport. This
# check used to run on the "Not paired" pile, which no longer exists for this
# fixture: three pairs leave nothing loose.
#
# The gate below is R5's 7s budget for our own server answering, for a scan
# whose row only just rendered; it resolves at once otherwise. The order
# matters for a URL that mints but then fails to load: that slot goes Loading →
# image → re-mint → "Image unavailable" over a second or two. Both checks are
# negatives, so a POSITIVE assertion follows them (the Step 7 scrolls) — a
# negative can pass on a page that has fallen to its error boundary.
- extendedWaitUntil:
    notVisible: ".*Loading image.*"
    timeout: 7000
- assertNotVisible: "Image unavailable"

# ── Step 7: the other three captions, each re-anchored (see Step 5) ──────────
- scrollUntilVisible:
    direction: UP
    element:
      text: "Check the pairs"
    centerElement: true
    timeout: 7000
- scrollUntilVisible:
    element:
      text: "Back · 02-vorkle-back.jpg"
    centerElement: true
    timeout: 7000
- scrollUntilVisible:
    direction: UP
    element:
      text: "Check the pairs"
    centerElement: true
    timeout: 7000
- scrollUntilVisible:
    element:
      text: "Front · 03-quillden-front.jpg"
    centerElement: true
    timeout: 7000
- scrollUntilVisible:
    direction: UP
    element:
      text: "Check the pairs"
    centerElement: true
    timeout: 7000
- scrollUntilVisible:
    element:
      text: "Front · 05-mossbaum-front.jpg"
    centerElement: true
    timeout: 7000

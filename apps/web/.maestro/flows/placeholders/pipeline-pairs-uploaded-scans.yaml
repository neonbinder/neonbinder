# R1 — Single feature: the placeholder scan pipeline. Six card scans go in as
# one upload; three matched front/back pairs come out, each with a cropped
# image the operator can see. (NEO-170.)
#
# This is the release gate for the whole pipeline: signed-URL upload to GCS,
# the Convex workpool fanning images at the Cloud Run preprocess service's
# capacity, BiRefNet cropping, Google Vision OCR, and the pairing port.
#
# R2 — It cannot go green without the feature. The completion assert names the
# exact arithmetic of a finished run ("6 of 6 images processed, 0 failed, 3
# pairs"); a pipeline that dropped an image, failed one, or paired wrongly
# produces different numbers and the flow fails. There is no `when:` branch
# anywhere in it, and the precondition below proves a real six-image job exists
# BEFORE the long wait — so a seed page that silently uploaded nothing fails
# fast and loudly instead of timing out four minutes later with a vague message.
#
# R3 — Nothing else covers this. The only other placeholders flow
# (flip-edge-mirrors-the-backs) tests print-sheet layout, not intake.
#
# R4 — Standard /testing/sign-in entry, no in-body login.
#
# ── WHY A TESTING PAGE UPLOADS THE FILES ──────────────────────────────────
# maestro-web cannot attach a file to <input type=file>. Verified against
# maestro-client.jar 2.6.0: there is no inputFile/attachFile command in the
# YAML surface at all, `DOM.setFileInputFiles` is referenced nowhere in any
# Maestro jar, and `CdpWebDriver.addMedia` — the one file-shaped command — is
# an empty stub (null-check, return) that would report COMPLETED having
# uploaded nothing. So the OS file picker is genuinely undrivable and a flow
# built on `addMedia` would be green and worthless.
#
# /testing/seed-placeholder-upload therefore fetches the committed fixtures and
# pushes them through the SAME client upload path the real page uses — the same
# signed POST policy, the same GCS objects, the same pipeline kickoff. Only the
# file picker is bypassed. It is gated on VITE_CLERK_TESTING_ENABLED plus a
# server-side secret that is unset in production, exactly like /testing/reset
# and /testing/seed-credentials.
#
# ── WHY THE FIXTURES LOOK THE WAY THEY DO ─────────────────────────────────
# apps/web/public/placeholder-fixtures/, generated by
# apps/web/scripts/generate-placeholder-fixtures.py (read its header). Two
# things matter to this flow:
#
#   * Each FRONT and each BACK print the SAME full player name; the back is also
#     dense with text while the front is a photo plus the nameplate, so every
#     image classifies to the right SIDE (from the model's own read, with
#     `textCount` — the free Vision word count, front ~2, back ~40+ — as the clean
#     fallback). Matching names on both sides let the identity pool pair a front
#     to its own back.
#   * Each BACK prints a distinct card number (#17 / #42 / #83) large and
#     high-contrast, so the number OCRs reliably — those numbers are how Step 5
#     tells the three pairs apart.
#   * The manifest is in front/back alternation — realistic scan order, and the
#     order the guarded adjacency FALLBACK reads if the identity pool ever cannot
#     place a card. WHICH pairs the pool places vs. the fallback is a per-pair,
#     model-dependent verdict (see Step 5) and is NOT what this flow asserts.
#
# Pairing is IDENTITY-FIRST (placeholderPairing.ts runs pairBatch with
# useAdjacency:false, after the rework that stopped a Gray front pairing with a
# Hosmer back purely for being adjacent). Identity resolution is now a dictionary
# lookup over the row the classifier already wrote, not a model call — so it is
# neither billable nor something to avoid: every one of the 6 done images is
# resolved, which is why "resolver calls: 6" is the healthy count Step 4 asserts.
#
# R5 — TWO bounded waits, split so the pipeline's PROCESSING time gets a tight
# regression guard instead of hiding inside one long blanket timeout. Both are
# the sanctioned external-compute case: BiRefNet inference on Cloud Run plus a
# Vision round-trip per image, at the preprocess service's own concurrency.
#   * Phase 1 (cold-start, <=300s) absorbs the one-off cost the user has agreed
#     to tolerate — a scale-to-zero Cloud Run cold start with a ~191s model load
#     — but ONLY because the page shows visible progress ("Warming up the card
#     processor…") while it happens.
#   * Phase 2 (processing, <=60s) is the SLA guard: once ANY image has processed
#     the instance is warm, so the remaining five must finish fast. A warm
#     6-image batch that needs >60s is a PRODUCT FINDING to raise, never a
#     timeout to inflate. Everything else in this flow runs on Maestro's default
#     lookup. Do not pad anything here.
#
# R7 — Non-destructive: the flow creates its own upload session under the
# signed-in worker's own account and touches nothing shared. Closing the session
# (Step 3b below) is NOT destructive — it is the batch's normal terminal
# transition (collecting → pairing → succeeded), the sanctioned way to finish a
# stream, and it only ever touches this worker's own job. It deliberately does
# NOT tap "Abort Session", which IS destructive: abort cancels queued images and
# marks the batch failed, which would destroy the very evidence this flow asserts.
#
# R8 — Engaged for the one tap: "Close Session" sits in the Session panel near
# the top of the run view, so Step 3b scrolls it to centre before tapping. The
# confirm button that follows is in a fixed, centred modal and needs no scroll.
appId: com.neonbinder.web
url: ${APP_URL || "https://localhost:3000"}/testing/sign-in?redirect=/testing/seed-placeholder-upload&worker=${WORKER_INDEX || "0"}
name: Placeholder pipeline — six scans in, three cropped pairs out
tags:
  - placeholders
  - regression
---
# Step 1: sign in, then the seed page uploads the six fixtures and forwards to
# the run view for the session it just created.
#
# This wait covers the whole chain: cold Clerk sign-in, fetching six fixtures,
# and six real signed-POST uploads to GCS (~300KB each). That upload is an
# external round-trip, which is why it is allowed past the 7s budget.
- launchApp
- extendedWaitUntil:
    visible: "Placeholder Scans"
    timeout: 90000

# Step 2: PRECONDITION — a real six-image session exists. The status line reads
# "<status> — <n> of 6 images processed, ...", so this matches at any point in
# the run and pins the batch size before we commit to waiting on it. Without
# this, a seed page that uploaded nothing would leave the flow waiting out the
# full timeout below and then failing on a much less obvious assertion.
- assertVisible: ".*of 6 images processed.*"

# ── Step 3: THE pipeline wait, split into two bounded phases ───────────────────
# Why split it: a scale-to-zero preprocess Cloud Run can cold-start (~191s model
# load). The user has accepted that long FIRST-RUN wait, but ONLY because the FE
# shows visible progress — and demands the PROCESSING time stay tightly guarded.
# A single 400s blanket wait would go green even if warm processing silently
# took six minutes; splitting it puts a short, load-bearing timeout around the
# processing phase so a regression there fails fast instead of hiding.
#
# Both phases watch the SAME status line at the top of the run view (Step 2
# already asserted it visible without scrolling), so neither needs a scroll;
# extendedWaitUntil never scrolls anyway. The line streams
# "<status> — <done> of 6 images processed, <failed> failed, <pairs> pairs",
# where <done> counts every settled (processed + failed) image.
#
# Phase 1 — COLD START (<=300s): wait for processing to demonstrably ENGAGE.
# The regex matches <done> = 1..6 and NEVER "0 of 6": the only " of 6 images
# processed" in the line is preceded by the <done> digit, which is "0" while
# cold, so [1-6] cannot match until the first image finishes — the moment the
# service is warm. On a warm CI revision processing can race straight to "6 of
# 6" between status polls; 6 ∈ [1-6], so this still matches and Phase 1 falls
# through at once. While cold the page shows "Warming up the card processor…" —
# the visible progress the user accepted this long wait for. `done` counts a
# PROCESSED image, not a loaded model, so this phase must cover the ~191s cold
# load PLUS the first image's own crop+OCR (~226s clean; up to ~275s if a
# request rides the 240s adapter timeout into a warm retry). 300s gives real
# margin over cold-load variance — the known scale-to-zero cost, tracked
# separately for the GPU/warming work, NOT something a 200s timeout should flake
# on. The tight, load-bearing guard is Phase 2 below, not this phase; a warm run
# clears this in ~35s regardless of the ceiling.
- extendedWaitUntil:
    visible: ".*[1-6] of 6 images processed.*"
    timeout: 300000

# Phase 2 — PROCESSING (<=60s): the SLA guard. From the first image done the
# instance is warm, so all six must reach the finished arithmetic quickly. Every
# number is load-bearing: six accounted for, none failed, exactly three pairs. A
# dropped image, a crashed crop or a mis-pair produces different numbers and
# fails here. A warm batch that needs longer than 60s is a product finding — the
# timeout does NOT get bumped to paper over it.
- extendedWaitUntil:
    visible: ".*6 of 6 images processed, 0 failed, 3 pairs.*"
    timeout: 60000

# ── Step 3b: CLOSE the session so the FINAL pairing run records the count ──────
# The 6/6 completion above happened while the stream was still "Collecting":
# every image finished, and the PROVISIONAL pairing runs that fire after each
# completion formed all three pairs — but those incremental runs deliberately do
# NOT record `resolverCalls`. Only the FINAL run does, over the whole batch at
# once (placeholderPairing.ts returns before recordResolverCalls unless
# `final`), so at this instant the page still reads "resolver calls: 0".
#
# Closing the session is the user action that ends collection and fires that
# final run: closePlaceholderStream sees every image already settled, moves the
# job collecting → pairing, and schedules the final runPairing, which resolves
# each of the 6 done images once (identity-first, useAdjacency:false — the
# dictionary lookup, not a model call), records "resolver calls: 6", and marks
# the batch succeeded. Without this step the final run never happens and Step 4
# can never see 6 — which is exactly the gap that failed this flow before.
- scrollUntilVisible:
    element:
      text: "Close Session"
    centerElement: true
- tapOn: "Close Session"
# Closing is guarded behind an "are you sure". Its focus opens on Cancel (so a
# reflexive Enter does the safe thing), which is why the confirm is the SECOND
# button, "Yes, Close".
- assertVisible: "Close this scan session?"
- tapOn: "Yes, Close"
# Wait for the batch to reach its terminal state — the final pairing run
# settling. This is a Convex-internal, multi-hop scheduled chain (close mutation
# → scheduled runPairing → recordResolverCalls → markJobSucceeded → reactive
# push), NOT external compute: every image is already done, so there is no
# BiRefNet/Vision round-trip here. That is why this is 15s and not Step 3's 400s
# — a close that takes longer is a product finding (slow scheduler), never a wait
# to inflate. The status line flips "Collecting" → "Pairing" → "Succeeded";
# matching "Succeeded" on the same 6/0/3 arithmetic proves the final run
# finished, and recordResolverCalls commits before markJobSucceeded, so once the
# status is "Succeeded" the count is already 6 for Step 4 to read.
- extendedWaitUntil:
    visible: ".*Succeeded.*6 of 6 images processed, 0 failed, 3 pairs.*"
    timeout: 15000

# Step 4: identity matching ran over the whole batch. Under identity-first
# pairing every done image is resolved once (a cheap dictionary lookup, not a
# model call), so 6 done images = 6 resolver calls. Only the FINAL pairing run
# records the count, over all six rows at once — which is why Step 3b had to
# close the session to fire it — so it is a stable 6 rather than an artefact of
# how the completions happened to interleave (schema.ts's resolverCalls comment
# spells this out). This proves identity-first pairing RAN over the whole batch —
# the pool was consulted for all 6 rows; it was 0 under the OLD adjacency pre-pass,
# which paired confident neighbours without ever resolving identity. WHICH pairs
# the pool places vs. the guarded adjacency fallback is a per-pair verdict that
# depends on model OCR and is NOT asserted here — that logic is owned by the
# deterministic unit suite (convex/lib/pairing/pool.test.ts). Step 5 asserts only
# the deterministic outcome: 3 correct pairs.
- assertVisible: "resolver calls: 6"

# Step 5: the three pairs are present and CORRECT, each identified by its distinct
# card number (#17 / #42 / #83).
#
# WHAT THIS DELIBERATELY DOES NOT ASSERT — and why. It does NOT pin HOW each pair
# was matched (identity pool "by image pool" vs. the guarded-adjacency fallback
# "by scan order"). That verdict depends on a real vision model OCR-ing the
# invented names off synthetic cards, which is non-deterministic — an observed CI
# run had VORKLE fall to the fallback while QUILLDEN and MOSSBAUM matched by pool —
# and a release gate must be deterministic. The pool-vs-fallback matching logic is
# instead owned by the ~50 controlled-input unit tests in
# convex/lib/pairing/pool.test.ts (surname-only fronts, fuzzy match, side-only
# fallback, player-disagreement reject). What the E2E proves is what only the E2E
# can: the pipeline ran end-to-end (signed-URL upload → workpool → crop → OCR →
# pairing) and produced 3 CORRECT pairs, and — via Step 4's "resolver calls: 6" —
# that identity-first pairing RAN over all 6 rows.
#
# WHAT THE PAGE RENDERS. Each pair is one <p>, the parts joined with " · ":
#   "<name> · #17 · <confidence> · <mechanism>"
# The name, the confidence word and the mechanism word all vary with the model
# read, so we pin only the CARD NUMBER — large and high-contrast on the back, it
# OCRs reliably and all three rendered correctly. Three number matches prove three
# DISTINCT correct pairs.
#
# WHY THE MATCHER IS "#NN" FOLLOWED BY AT LEAST ONE CHAR (".*#17.+"), not a bare
# "#NN". The same number also appears in the Images-section summary of that card's
# back ("Done — back side · <name> · #17"), where it is the LAST token — nothing
# follows it. On a PAIR row the number sits mid-line, always followed by
# " · <confidence> · <mechanism>", so requiring one trailing character uniquely
# selects the pair row and never the image summary. It keys on row STRUCTURE (is
# anything printed after the number?), not on the confidence or mechanism words, so
# it stays deterministic as those vary — and, unlike matching a literal separator,
# it does not depend on exact whitespace, which a driver may normalize.
#
# ORDER-INDEPENDENT. Pairs render in insertion (image-completion) order, which is
# non-deterministic — #17/#42/#83 are not guaranteed top-to-bottom. So before each
# number we re-anchor UP to the "Matched pairs" heading and scroll DOWN from there:
# every search starts above all three rows and finds its target wherever it sits.
#
# NO centerElement ON THESE SCROLLS. They are assertions, not taps, so R8 (about
# taps landing on a fully-visible target) does not apply; and centering oscillates
# to the 20s timeout on this page's ~half-viewport swipe steps against the 629px
# headless viewport (the exact 2026-08-18 failure). A plain scroll only needs the
# element 100% visible, which a single step satisfies.
- scrollUntilVisible:
    element:
      text: "Matched pairs"
- scrollUntilVisible:
    element:
      text: ".*#17.+"
- scrollUntilVisible:
    direction: UP
    element:
      text: "Matched pairs"
- scrollUntilVisible:
    element:
      text: ".*#42.+"
- scrollUntilVisible:
    direction: UP
    element:
      text: "Matched pairs"
- scrollUntilVisible:
    element:
      text: ".*#83.+"

# Step 6: every image ended up in a pair. The page only renders this heading
# when something was left over, so its absence is the claim — and it is made
# from a scroll position where the pairs above are on screen, which is what
# stops it being the kind of assertNotVisible that passes merely because we are
# looking somewhere else.
- assertNotVisible: "Unmatched images"

# Step 7: the crops actually rendered. Maestro cannot see an <img> at all (the
# web driver drops img from the hierarchy), so the assertion is made on the two
# placeholders the image slot shows INSTEAD of a picture: it is still resolving
# a signed URL, or it gave up. Waiting for "Loading image…" to clear is real
# synchronisation — six signed-URL actions and six GCS fetches — not dead time.
- extendedWaitUntil:
    notVisible: ".*Loading image.*"
    timeout: 30000
- assertNotVisible: "Image unavailable"

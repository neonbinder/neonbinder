# R1 — Single feature: the placeholder scan pipeline. Six card scans go in as
# one upload; three matched front/back pairs come out, each with a cropped
# image the operator can see. (NEO-170.)
#
# This is the release gate for the whole pipeline: signed-URL upload to GCS,
# the Convex workpool fanning images at the Cloud Run preprocess service's
# capacity, BiRefNet cropping, Google Vision OCR, and the pairing port.
#
# R2 — It cannot go green without the feature. The completion assert names the
# exact arithmetic of a finished run ("6 of 6 images processed, 0 failed, 3
# pairs"); a pipeline that dropped an image, failed one, or paired wrongly
# produces different numbers and the flow fails. There is no `when:` branch
# anywhere in it, and the precondition below proves a real six-image job exists
# BEFORE the long wait — so a seed page that silently uploaded nothing fails
# fast and loudly instead of timing out four minutes later with a vague message.
#
# R3 — Nothing else covers this. The only other placeholders flow
# (flip-edge-mirrors-the-backs) tests print-sheet layout, not intake.
#
# R4 — Standard /testing/sign-in entry, no in-body login.
#
# ── WHY A TESTING PAGE UPLOADS THE FILES ──────────────────────────────────
# maestro-web cannot attach a file to <input type=file>. Verified against
# maestro-client.jar 2.6.0: there is no inputFile/attachFile command in the
# YAML surface at all, `DOM.setFileInputFiles` is referenced nowhere in any
# Maestro jar, and `CdpWebDriver.addMedia` — the one file-shaped command — is
# an empty stub (null-check, return) that would report COMPLETED having
# uploaded nothing. So the OS file picker is genuinely undrivable and a flow
# built on `addMedia` would be green and worthless.
#
# /testing/seed-placeholder-upload therefore fetches the committed fixtures and
# pushes them through the SAME client upload path the real page uses — the same
# signed POST policy, the same GCS objects, the same pipeline kickoff. Only the
# file picker is bypassed. It is gated on VITE_CLERK_TESTING_ENABLED plus a
# server-side secret that is unset in production, exactly like /testing/reset
# and /testing/seed-credentials.
#
# ── WHY THE FIXTURES LOOK THE WAY THEY DO ─────────────────────────────────
# apps/web/public/placeholder-fixtures/, generated by
# apps/web/scripts/generate-placeholder-fixtures.py (read its header). Two
# things matter to this flow:
#
#   * Each FRONT carries exactly one word. Side is decided from `textCount`
#     (the free Vision word count), and pairBatch only pairs neighbours without
#     a model call when the counts are unambiguous: <=2 is confidently a front,
#     >=7 confidently a back, 3-6 pays for a classify. A realistic "name +
#     team" front is 4-5 words and would land in that ambiguous band, making
#     this gate probabilistic and billable. Measured on the live pipeline:
#     front textCount=1, back textCount=56.
#   * The manifest is in strict front/back alternation, which is the order the
#     adjacency pre-pass walks.
#
# Together those are what make "resolver calls: 0" true, and asserting it is
# the regression trap: if a future change pushes fixtures into the ambiguous
# band, this gate starts paying a model call per image and goes red here rather
# than silently costing money on every run.
#
# R5 — ONE long wait, and it is the sanctioned external-compute case: BiRefNet
# inference on Cloud Run plus a Vision round-trip per image, throttled to three
# in flight (container_concurrency=1, max_instances=3, and the Convex workpool
# is pinned to match). Six images is two full waves, so the queue behaviour is
# exercised. Budget ~80-120s of pipeline plus cold start; 240s leaves real
# headroom under the harness's 600s hard kill. Everything else in this flow
# runs on Maestro's default lookup. Do not pad anything here — a slow
# non-pipeline step is a product finding.
#
# R7 — Non-destructive: the flow creates its own upload session under the
# signed-in worker's own account and touches nothing shared. It deliberately
# does NOT tap "Close Session" or "Abort Session" — those are a different
# feature with their own flow, and aborting here would destroy the evidence.
#
# R8 — Not engaged: this flow contains no taps at all.
appId: com.neonbinder.web
url: ${APP_URL || "https://localhost:3000"}/testing/sign-in?redirect=/testing/seed-placeholder-upload&worker=${WORKER_INDEX || "0"}
name: Placeholder pipeline — six scans in, three cropped pairs out
tags:
  - placeholders
  - regression
---
# Step 1: sign in, then the seed page uploads the six fixtures and forwards to
# the run view for the session it just created.
#
# This wait covers the whole chain: cold Clerk sign-in, fetching six fixtures,
# and six real signed-POST uploads to GCS (~300KB each). That upload is an
# external round-trip, which is why it is allowed past the 7s budget.
- launchApp
- extendedWaitUntil:
    visible: "Placeholder Scans"
    timeout: 90000

# Step 2: PRECONDITION — a real six-image session exists. The status line reads
# "<status> — <n> of 6 images processed, ...", so this matches at any point in
# the run and pins the batch size before we commit to waiting on it. Without
# this, a seed page that uploaded nothing would leave the flow waiting out the
# full timeout below and then failing on a much less obvious assertion.
- assertVisible: ".*of 6 images processed.*"

# Step 3: THE pipeline wait — the one sanctioned long wait (see R5 above).
# Every number here is load-bearing: six images accounted for, none failed, and
# exactly three pairs. A dropped image, a crashed crop or a mis-pair all
# produce different arithmetic and fail this assert.
#
# 400s, not the ~160s the arithmetic suggests: on a stone-cold service one
# request can sit through the adapter's ENTIRE 240s timeout (it arrived during
# model load) before its retry lands on a warm instance — observed live
# 2026-08-18, where a fully cold 6-image run took ~8 minutes end to end. In CI
# this flow runs after the preprocess smoke test has already warmed the PR
# revision, so the fully-cold pathology is a local-run anomaly; 400s covers one
# stuck-request cycle plus the warm waves while keeping the whole flow ≈430s,
# inside the 600s harness cap.
- extendedWaitUntil:
    visible: ".*6 of 6 images processed, 0 failed, 3 pairs.*"
    timeout: 400000

# Step 4: the pairing did NOT pay for the identity resolver. See the fixture
# note above — this is the cost/determinism regression trap.
- assertVisible: "resolver calls: 0"

# Step 5: the three pairs, each identified by its card number, each paired by
# scan order.
#
# WHAT THE PAGE ACTUALLY RENDERS (measured live 2026-08-18):
#   "Grebble · #17 · front/back only · by scan order"
#   "Marcus · #42 · front/back only · by scan order"
#   "Teodor · #83 · front/back only · by scan order"
# — one <p> per pair, the parts joined with " · ". So each line is one text node
# Maestro can match whole.
#
# WHY MATCH ON THE CARD NUMBER, NOT THE NAME. The leading name is read off the
# card by the vision model and is the least stable thing on the line — it came
# back as the given name ("Grebble"), not the surname on the front, and a model
# can word it differently run to run. The card number is a large, high-contrast
# "#17" on the back (the fixtures are drawn that way), which OCRs reliably, and
# #17 / #42 / #83 are the invented numbers that tie each line to one specific
# card — so three number matches prove three DISTINCT correct pairs. "by scan
# order" is the deterministic label for an adjacency-mechanism pair, so pairing
# it with the number proves each pair came out of the zero-resolver free path
# (the same property Step 4 asserts in aggregate).
#
# NO centerElement ON THESE SCROLLS. They are assertions, not taps, so R8 (which
# is about taps landing on a fully-visible target) does not apply. Worse,
# centering actively breaks them here: "Matched pairs" sits ~800px down a
# ~1540px page, and scrollUntilVisible swipes in ~half-viewport (~314px) steps.
# On the 629px headless viewport those steps straddle the narrow centring band
# (scrollY≈373–625) — 314 lands the heading below it, 628 above it — so
# centering oscillates to the 20s timeout and never settles. That is the exact
# failure observed on 2026-08-18. A plain scroll only needs the element 100%
# visible, which the first downward step already satisfies. (The sticky binder
# header does not change this: visibility is geometric against the viewport, not
# occlusion-aware, and nothing here is tapped.)
- scrollUntilVisible:
    element:
      text: "Matched pairs"
- scrollUntilVisible:
    element:
      text: ".*#17.*by scan order.*"
- scrollUntilVisible:
    element:
      text: ".*#42.*by scan order.*"
- scrollUntilVisible:
    element:
      text: ".*#83.*by scan order.*"

# Step 6: every image ended up in a pair. The page only renders this heading
# when something was left over, so its absence is the claim — and it is made
# from a scroll position where the pairs above are on screen, which is what
# stops it being the kind of assertNotVisible that passes merely because we are
# looking somewhere else.
- assertNotVisible: "Unmatched images"

# Step 7: the crops actually rendered. Maestro cannot see an <img> at all (the
# web driver drops img from the hierarchy), so the assertion is made on the two
# placeholders the image slot shows INSTEAD of a picture: it is still resolving
# a signed URL, or it gave up. Waiting for "Loading image…" to clear is real
# synchronisation — six signed-URL actions and six GCS fetches — not dead time.
- extendedWaitUntil:
    notVisible: ".*Loading image.*"
    timeout: 30000
- assertNotVisible: "Image unavailable"

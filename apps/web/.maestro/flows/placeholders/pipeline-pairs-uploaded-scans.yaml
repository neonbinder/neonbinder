# R1 — Single feature: the placeholder scan pipeline on its FAST path (NEO-175).
# Six FULL-BLEED card scans go in as one upload; because each fills the frame,
# the fast classical service accepts every one as a "frame" identity in seconds
# and NONE escalates to the heavy model — all six process on the fast path with
# zero failures. This is the common real-user case — a folder of already-cropped
# scans — and the path the product must keep fast.
#
# The HEAVY escalation path (inset-on-noise scans → the ~191s BiRefNet cold start
# → the "Warming up the full card processor…" notice) is a DIFFERENT user case,
# proved by its own flow, pipeline-escalation-cold-start.yaml. This flow proves
# the opposite: fast in, no model, no cold-start notice.
#
# This is the release gate for the fast pipeline: signed-URL upload to GCS, the
# Convex workpool fanning images at the FAST Cloud Run service's capacity, the
# classical crop, Google Vision OCR, and the pairing port.
#
# R2 — It cannot go green without the feature. Three deterministic proofs, none of
# which a broken fast pipeline can satisfy:
#   * The completion assert names the exact arithmetic of a finished run ("6 of 6
#     images processed, 0 failed") — a pipeline that dropped or failed an image
#     produces different numbers and the flow fails.
#   * Step 3b asserts the cold-start notice is ABSENT — so a regression that pushed
#     these frame-filling cards onto the heavy service (the fast path silently
#     declining them) surfaces here instead of passing unnoticed.
#   * "2 pairs ready to print." together with "Not paired (2)" (Step 5)
#     accounts for every image: 2 pairs x 2 + 2 loose = 6. Pairing demonstrably
#     ran over the whole batch and dropped nothing. A pipeline that lost an
#     image, or a matcher that paired greedily across sides, lands on different
#     numbers and fails here.
# There is no `when:` branch anywhere in it, and the precondition below proves a
# real six-image job exists BEFORE the wait.
#
# WHY TWO PAIRS AND NOT THREE. The fixture set was designed as three pairs, and
# the number asserted here is deliberately 2. On the FAST classical crop the
# synthetic full-bleed FRONT of one pair (Marcus VORKLE) deterministically
# classifies as side "back" (reproduced with a direct /process-entry probe:
# needs_escalation false, side "back"). The pool therefore holds two fronts and
# four backs: two pairs form, and the two left over are BOTH backs, which can
# never pair with each other. That is also why NEO-152's adjacency bonus does not
# rescue them — adjacency only corroborates a match, it cannot create one across
# two same-side images.
#
# This is a synthetic-fixture artifact, not a product bug: a real card front
# carries a player PHOTO and side-classifies reliably, while a flat full-bleed
# synthetic front does not. Verified against the dev deployment on 2026-08-26 by
# pushing this exact fixture set through the same seed page this flow uses —
# "All 6 photos read.", no cold-start notice, then "2 pairs ready to print."
# and "Not paired (2)" once the batch was finished.
#
# WHICH pairs formed, and at what confidence, is still NOT asserted — that is a
# model-dependent per-pair verdict owned by convex/lib/pairing/*.test.ts, and
# NEO-152 made confidence legitimately fixture-dependent, so pinning the
# mechanism here would fail on a card change rather than on a regression. What
# is asserted is the arithmetic, which is deterministic.
#
# R3 — Nothing else covers this. pipeline-escalation-cold-start.yaml exercises
# the ESCALATION path; flip-edge-mirrors-the-backs tests print-sheet layout, not
# intake. Both fixture sets and this flow's entry are described in
# apps/web/scripts/generate-placeholder-fixtures.py.
#
# R4 — Standard /testing/sign-in entry, no in-body login. The only addition to
# the entry URL is `fixtures=placeholder-fixtures-fullbleed`, which tells the
# seed page WHICH committed fixture set to push through the real upload path.
#
# R7 — Non-destructive: the flow creates its own upload session under the
# signed-in worker's own account and touches nothing shared (no marketplace set —
# this is a per-user placeholder job). Closing the session (Step 4) is NOT
# destructive — it is the batch's normal terminal transition (collecting →
# pairing → succeeded), the sanctioned way to finish a stream. It deliberately
# does NOT tap "Discard this batch", which IS destructive.
#
# ── WHY A TESTING PAGE UPLOADS THE FILES ──────────────────────────────────
# maestro-web cannot attach a file to <input type=file> (there is no working
# inputFile/attachFile in the YAML surface; CdpWebDriver.addMedia is an empty
# stub that reports COMPLETED having uploaded nothing). So the OS file picker is
# genuinely undrivable. /testing/seed-placeholder-upload fetches the committed
# fixtures and pushes them through the SAME client upload path the real page uses
# — the same signed POST policy, the same GCS objects, the same pipeline kickoff.
# Only the picker is bypassed. It is gated on VITE_CLERK_TESTING_ENABLED plus a
# server-side secret unset in production.
#
# ── WHY THE FULL-BLEED FIXTURES ───────────────────────────────────────────
# apps/web/public/placeholder-fixtures-fullbleed/, generated by
# apps/web/scripts/generate-placeholder-fixtures.py --full-bleed. Each card FILLS
# the whole frame apart from a thin border ring, so the NEO-175 fast classical
# pass reads it as an object covering >=92% of a card-aspect frame — the "frame"
# identity verdict that keeps it on the fast path (validated against the real
# fast_tiered_crop: all six return the input untouched, none escalates). Each
# front and back print the SAME full player name so the identity pool pairs them.
# (The set was DESIGNED as three pairs, but on the fast crop one synthetic front
# side-classifies as "back", so the fast path forms 2 and leaves two backs loose
# — see the "WHY TWO PAIRS AND NOT THREE" note above.)
appId: com.neonbinder.web
url: ${APP_URL || "https://localhost:3000"}/testing/sign-in?redirect=/testing/seed-placeholder-upload%3Ffixtures%3Dplaceholder-fixtures-fullbleed&worker=${WORKER_INDEX || "0"}
name: Placeholder pipeline (fast path) — six frame-filling scans process fast, no cold start
tags:
  - placeholders
  - regression
---
# Step 1: sign in, then the seed page uploads the six full-bleed fixtures and
# forwards to the run view for the session it just created.
#
# This wait covers the whole chain: cold Clerk sign-in, fetching six fixtures,
# and six real signed-POST uploads to GCS (~300KB each). That upload is an
# external round-trip, which is why it is allowed past the 7s budget.
- launchApp
- extendedWaitUntil:
    visible: "Upload your cards"
    timeout: 90000

# Step 2: PRECONDITION — a real six-image session exists. The status line reads
# "<status> — <n> of 6 images processed, ...", so this matches at any point in
# the run and pins the batch size before we commit to waiting on it. It also
# proves the status line is on screen without scrolling, which Step 3 relies on.
# The panel exists at all — it renders as soon as a job id is in the URL. The
# old assertion matched a composed status line ("… of 6 images processed …")
# that NEO-152 replaced with stage-specific copy: while images are in flight it
# reads "Reading your cards — N of 6 done.", and the instant the last one lands
# it becomes "All 6 photos read." A precondition cannot depend on which of those
# it catches, so it asserts the panel and lets Step 3 gate on the real state.
- assertVisible: "Your cards"

# ── Step 3: the fast-path completion wait ─────────────────────────────────────
# All six images process on the FAST classical service and none touches the model.
# Warm, the fast /process-entry is ~4s/image; but the E2E runs against a COLD
# Convex preview with no warm traffic, so the burst pays fast-service cold-starts
# (~22s to spin the first instance) plus contention from other queue flows. 120s
# absorbs that cold batch with margin while still catching a real regression — a
# fast path that genuinely needs longer than two minutes for six frame-filling
# cards is a PRODUCT finding to raise, not a timeout to inflate. The
# "N of 6 images processed" counter is visible progress the whole time. Every
# number in the assert is load-bearing: six accounted for, none failed; a dropped
# image or a crashed crop produces different numbers and fails here. The pair
# count is not available yet at this point — it is written by the FINAL pairing
# run, which Step 4 fires by finishing the batch. The status line is above the
# fold (Step 2), and extendedWaitUntil never scrolls, so no scroll is needed.
- extendedWaitUntil:
    visible: "All 6 photos read."
    timeout: 120000

# Step 3b: the cold-start notice is ABSENT. The fast path escalates nothing, so
# `heavyWarming` is false and the "Warming up the full card processor…" notice
# never renders. This is what distinguishes the fast path from the heavy one:
# without it, a run that quietly escalated every card could still reach 6/6 and
# pass Step 3. The assertion is meaningful here (not a look-somewhere-else
# no-op): we are still at the top of the run view with the status line on screen,
# and the notice, if it existed, would sit in the same session panel right below
# that line — in view. (The regex tolerates the exact copy "…the full card
# processor…" via `.*` between "the" and "card".)
- assertNotVisible: ".*[Ww]arming up the .*card processor.*"

# ── Step 4: CLOSE the session so the FINAL pairing run records the count ───────
# The 6/6 completion above happened while the stream was still "Collecting": the
# provisional pairing runs formed the pairs but deliberately do NOT record
# the batch as SUCCEEDED. Only the FINAL run does, and it fires when the stream
# is CLOSED. Without this step the panel stays on "All 6 photos read." and Step
# 5 never sees the finished state.
- scrollUntilVisible:
    element:
      text: "Finish the batch"
    centerElement: true
- tapOn: "Finish the batch"
# Finishing is guarded behind an "are you sure". Its focus opens on the cancel
# choice (so a reflexive Enter does the safe thing), which is why the confirm is
# the SECOND button, "Finish it".
- assertVisible: "Finish this batch?"
- tapOn: "Finish it"
# Wait for the batch to reach its terminal state. For a small batch (this flow's
# six images; ≤100), the close mutation finalizes pairing INLINE in its own
# transaction — the final pairing and markJobSucceeded commit together, NOT via a
# scheduled runPairing hop — then the reactive push flips the panel straight to
# the finished copy. There is no external compute here: every image is already done,
# so there is no crop/OCR round-trip. The status line goes "Collecting" →
# the finished state directly (no visible "Pairing" step for a small batch), and
# the pair count in that copy is written by the same transaction — so once
# "2 pairs ready to print." is on screen the final run has demonstrably
# completed. (WHICH pairs, and at what confidence, stays unasserted — see the
# two-pairs note in the header.)
#
# The terminal transition is finalized INLINE in the close mutation for small
# batches (NEO-175, commit 557f1d4): match fronts↔backs, write the pairs, and
# flip the job to succeeded all commit atomically when the "Finish it"
# tap's mutation returns — sub-second even under the preview's 8-runner
# contention, with no scheduler hop and no action-queue wait. (Previously this
# FINAL run was a Convex *action* scheduled at runAfter(0); as an action it backed
# up behind the E2E runners' preprocess actions, so close→"Succeeded" took 16–33s
# — which is why this budget had been interim-bumped to 20s. The code fix removed
# the hop, so no inflated ceiling is needed.) The "Succeeded" text and the 6/0
# arithmetic below are UNCHANGED, so a broken finalize still fails here and R2
# holds. 15s is the tight restored budget (the pre-regression value): the
# transition is now <1s, so extendedWaitUntil resolves instantly on a healthy run
# and still fails a genuinely broken finalize.
- extendedWaitUntil:
    visible: "2 pairs ready to print."
    timeout: 15000

# Step 5: pairing ran over the whole batch, and every image is accounted for.
# Two pairs plus two loose images is exactly six, and only the FINAL run writes
# those counts — which is why Step 4 had to finish the session to fire it. The
# orphan count is asserted alongside the pair count on purpose: the pair count
# alone would still pass if the pipeline quietly lost the two leftovers, and
# surfacing orphans rather than hiding them is a NEO-152 requirement in its own
# right.
#
# WHICH pairs the pool placed vs. the guarded adjacency fallback, and at what
# confidence, is a per-pair model-dependent verdict owned by the deterministic
# unit suite (convex/lib/pairing/pool.test.ts) and NOT asserted here. That
# restraint matters more since NEO-152: confidence now varies legitimately with
# the fixture — a set whose backs omit the player name pairs correctly on weaker
# evidence — so an E2E that pinned the mechanism would fail on a card change
# rather than on a regression.
# And the review step exists for the pairs just formed — the correction surface
# NEO-152 §3 requires, which is what makes the pairing trustworthy rather than
# merely present.
- assertVisible: "Check the pairs"
# The two unpaired backs are surfaced as their own bucket, not swallowed.
- assertVisible: "Not paired (2)"

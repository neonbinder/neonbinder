url: ${APP_URL || "https://localhost:3000"}/testing/sign-in?redirect=/profile/credentials&account=new-profile&worker=${WORKER_INDEX || "0"}
name: Credentials lifecycle — save, auth-fail, recover, clear (BSC + SportLots)
tags:
  - credentials
  - profile
---
# Full lifecycle test for marketplace credential management on the profile page.
# Uses the isolated "new-profile" Clerk account so its credential state never
# collides with the main worker or other flows.
#
# Covers PER PLATFORM (BSC first, then SportLots):
#   a. Save REAL creds (via seed-credentials) → Test → assert auth SUCCESS
#   b. Clear → enter FAKE creds → Save → assert "saved but auth failed"
#   c. Restore REAL creds (via seed-credentials) → Test → assert auth SUCCESS
#      (proves token re-mint after credential swap — token-invalidation behavior)
#   d. Clear → assert "Credentials cleared" + input form returns
#
# Cross-platform seed coupling: /testing/seed-credentials seeds BOTH BSC and
# SL in one call (the page does not forward a sites= param). The flow accounts
# for this by visiting seed-credentials once before each platform's real-cred
# steps — the second seed call is a no-op for the platform already seeded (the
# action returns skipped=true for existing credentials). After each platform's
# lifecycle we clear its credentials before moving on.
#
# Auth-failed timing: saving fake credentials triggers a full Puppeteer BSC
# login attempt (no cached token — saveCredentials clears it). BSC bot
# challenges and retries can exceed 30s, so we allow 120s. The auth-failed
# banner is React state (transient) — it disappears on navigate, so we must wait
# for it in-place with extendedWaitUntil.
#
# NEO-128 — WHY THERE ARE NO SCROLLS LEFT IN THIS FLOW:
# Credentials are their own route now, so the entire panel (tablist, heading,
# form or Edit/Test/Clear buttons, confirm dialog, result banner) renders inside
# the 1024×629 headless fold. Every scrollUntilVisible this flow used to carry
# was compensating for geometry that no longer exists — centering a heading so
# the form below it landed in a safe tap band, scrolling UP to re-anchor because
# a DOWN scroll walked to the Prize Pool section and never came back, avoiding
# centerElement on "Yes, Clear" because centering near the page bottom hit
# max-scroll and dropped the button to y≈19 inside the sticky-header occlusion
# zone where the tap was silently stolen (run 28308194220). None of those
# failure modes are reachable from a single-section route. What is KEPT is the
# re-tap guard on the confirm dialog, which defends against non-positional lost
# taps and is independent of layout.

- launchApp

# The new-profile user is signed in via the URL's redirect chain. Wait for the
# page to load — "Profile Settings" is the h1, which lives in the profile shell
# and so appears on every /profile sub-route, once Clerk auth and Convex data
# are ready.
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 45000

# =========================================================================
# BSC LIFECYCLE
# =========================================================================

# -----------------------------------------------------------------------
# a. Save REAL BSC credentials (via seed-credentials) + verify Test success
# -----------------------------------------------------------------------

# Seed real credentials for the new-profile user. Seeds both BSC + SL;
# only BSC matters for this step. The page auto-redirects when done.
- openLink: ${APP_URL || "http://localhost:3000"}/testing/seed-credentials?redirect=/profile/credentials
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 30000

# BSC is the default tab. Gate on the section heading: the panel renders
# "Loading credentials…" until the profile query resolves, so this proves the
# credential UI is really mounted rather than just the shell.
- extendedWaitUntil:
    visible: "BuySportsCards Credentials"
    timeout: 30000

- extendedWaitUntil:
    visible: "Test Credentials"
    timeout: 10000

- tapOn: "Test Credentials"

# 30s sanctioned exception: cold Puppeteer/SSO BSC login on new-profile.
# Clear stays disabled until this banner appears (serialized-ops product fix).
# Non-scrolling: a scrollUntilVisible here would double as the ~22s WAIT and
# park the viewport wherever the page ends, with the banner above it (NEO-125).
- extendedWaitUntil:
    visible: ".*BSC account authenticated successfully.*"
    timeout: 30000

# -----------------------------------------------------------------------
# b. Change BSC to fake credentials → Save → assert auth-failed banner
# -----------------------------------------------------------------------

# Clear the existing real credentials to expose the input form.
- tapOn: "Clear Credentials"

# The confirm dialog appears in place, just below the "Clear Credentials"
# button. Assert it, then tap.
- extendedWaitUntil:
    visible:
      text: "Yes, Clear"
    timeout: 7000
- tapOn: "Yes, Clear"

# Verify the confirm tap REGISTERED (defense-in-depth for any non-positional
# lost tap). handleConfirmClear's first line is setConfirmingClear(false),
# which unmounts this button — so once the onClick fires, "Yes, Clear" vanishes.
# If it is STILL visible, the tap did not register — re-issue it.
# handleConfirmClear is idempotent (it only deletes credentials, and the button
# disables the instant the first onClick fires), so a second fire is harmless.
- runFlow:
    when:
      visible:
        text: "Yes, Clear"
    commands:
      - tapOn: "Yes, Clear"

- extendedWaitUntil:
    visible: ".*Credentials cleared.*"
    timeout: 30000

# After "Credentials cleared" fires, the clear mutation has completed and the
# input form has swapped in IN PLACE (replacing the Edit/Test/Clear buttons).
- extendedWaitUntil:
    visible: "Save Credentials"
    timeout: 10000

- tapOn:
    id: "username"
- inputText: "e2e-fake-bsc-user"

- tapOn:
    id: "password"
- inputText: "e2e-fake-bsc-pass"

- tapOn: "Save Credentials"

# 120s exception: saving fake BSC credentials triggers a full Puppeteer/SSO
# login attempt (no cached token — saveCredentials clears it). BSC bot
# challenges + 503 retries can take 60–90s on a cold Cloud Run instance.
# Non-scrolling so the transient React-state banner is not navigated away from.
- extendedWaitUntil:
    visible: ".*Credentials were saved.*authentication failed.*"
    timeout: 120000

# -----------------------------------------------------------------------
# c. Restore REAL BSC credentials → Test → assert auth SUCCESS (recovery)
# -----------------------------------------------------------------------

# Re-seed real credentials. This overwrites the fake creds in the DB AND
# invalidates the cached marketplace token (proving token-invalidation behavior —
# the next Test Credentials call must re-authenticate from scratch).
- openLink: ${APP_URL || "http://localhost:3000"}/testing/seed-credentials?redirect=/profile/credentials
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 30000

- extendedWaitUntil:
    visible: "BuySportsCards Credentials"
    timeout: 30000

- extendedWaitUntil:
    visible: "Test Credentials"
    timeout: 10000

- tapOn: "Test Credentials"

# 30s sanctioned exception: the re-seed invalidated the token, so this login
# is cold again (~22s Puppeteer round-trip).
- extendedWaitUntil:
    visible: ".*BSC account authenticated successfully.*"
    timeout: 30000

# -----------------------------------------------------------------------
# d. Clear BSC credentials → assert cleared + input form returns
# -----------------------------------------------------------------------

# Reload before the Clear step. After a cold Test Credentials login, Convex
# reactive subscription events keep flushing through the React tree for several
# seconds; a fresh page render gives the Clear flow a stable starting point.
# (The confirm tap is additionally protected by the re-tap guard below — the
# reload alone is not sufficient, per run 28308194220.)
- openLink: ${APP_URL || "http://localhost:3000"}/profile/credentials
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 30000

- extendedWaitUntil:
    visible: "BuySportsCards Credentials"
    timeout: 30000

- tapOn: "Clear Credentials"

- extendedWaitUntil:
    visible:
      text: "Yes, Clear"
    timeout: 7000
- tapOn: "Yes, Clear"

# Re-tap guard — see the rationale at the first occurrence above.
- runFlow:
    when:
      visible:
        text: "Yes, Clear"
    commands:
      - tapOn: "Yes, Clear"

- extendedWaitUntil:
    visible: ".*Credentials cleared.*"
    timeout: 30000

# Confirm the UI returned to the credential-entry state: once cleared,
# hasStoredCredentials flips false and the username/password input form swaps
# in IN PLACE. Assert it without scrolling — the post-clear reactive flush is
# still settling, and a scrollUntilVisible here crashes CdpWebDriver mid-
# re-render (MismatchedInputException), which is how run 28308194220 attempt 2
# hard-failed at this step.
- extendedWaitUntil:
    visible: ".*Username.*"
    timeout: 7000

# =========================================================================
# SPORTLOTS LIFECYCLE
# =========================================================================

# -----------------------------------------------------------------------
# a. Save REAL SportLots credentials (via seed-credentials) + verify Test success
# -----------------------------------------------------------------------

# Re-seed. Both BSC and SL are seeded — BSC is already clear from step (d)
# above, so BSC gets seeded again (harmless). SL gets its real creds seeded.
- openLink: ${APP_URL || "http://localhost:3000"}/testing/seed-credentials?redirect=/profile/credentials
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 30000

# Switch to the SportLots tab — the tablist is at the top of the panel.
- extendedWaitUntil:
    visible: "Sportlots"
    timeout: 10000
- tapOn: "Sportlots"

- extendedWaitUntil:
    visible: ".*Sportlots Credentials.*"
    timeout: 20000

- extendedWaitUntil:
    visible: "Test Credentials"
    timeout: 10000

- tapOn: "Test Credentials"

# 30s sanctioned exception: cold Puppeteer/SSO SportLots login on new-profile.
# Wait for the auth-success banner specifically — serialized-ops: Clear is
# disabled until login completes (drops stale "Credentials saved" alternative).
- extendedWaitUntil:
    visible: ".*Sportlots account authenticated successfully.*"
    timeout: 30000

# -----------------------------------------------------------------------
# b. Change SportLots to fake credentials → Save → assert auth-failed banner
# -----------------------------------------------------------------------

- tapOn: "Clear Credentials"

- extendedWaitUntil:
    visible:
      text: "Yes, Clear"
    timeout: 7000
- tapOn: "Yes, Clear"

# Re-tap guard — see the rationale at the first occurrence above.
- runFlow:
    when:
      visible:
        text: "Yes, Clear"
    commands:
      - tapOn: "Yes, Clear"

- extendedWaitUntil:
    visible: ".*Credentials cleared.*"
    timeout: 30000

# Reload and re-select the SL tab from a clean state after the Clear block.
- openLink: ${APP_URL || "http://localhost:3000"}/profile/credentials
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 30000

- extendedWaitUntil:
    visible: "Sportlots"
    timeout: 10000
- tapOn: "Sportlots"

- extendedWaitUntil:
    visible: ".*Sportlots Credentials.*"
    timeout: 20000

- extendedWaitUntil:
    visible: "Save Credentials"
    timeout: 10000

- tapOn:
    id: "username"
- inputText: "e2e-fake-sl-user"

- tapOn:
    id: "password"
- inputText: "e2e-fake-sl-pass"

- tapOn: "Save Credentials"

# 120s exception: SportLots auth failure still goes through the browser
# service's session check. Allow 120s for parity with BSC and Cloud Run
# cold-start scenarios.
- extendedWaitUntil:
    visible: ".*Credentials were saved.*authentication failed.*"
    timeout: 120000

# -----------------------------------------------------------------------
# c. Restore REAL SportLots credentials → Test → assert auth SUCCESS (recovery)
# -----------------------------------------------------------------------

- openLink: ${APP_URL || "http://localhost:3000"}/testing/seed-credentials?redirect=/profile/credentials
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 30000

- extendedWaitUntil:
    visible: "Sportlots"
    timeout: 10000
- tapOn: "Sportlots"

- extendedWaitUntil:
    visible: ".*Sportlots Credentials.*"
    timeout: 20000

- extendedWaitUntil:
    visible: "Test Credentials"
    timeout: 10000

- tapOn: "Test Credentials"

# 30s sanctioned exception: token invalidated by re-seed — cold login (~22s).
- extendedWaitUntil:
    visible: ".*Sportlots account authenticated successfully.*"
    timeout: 30000

# -----------------------------------------------------------------------
# d. Clear SportLots credentials → assert cleared + input form returns
# -----------------------------------------------------------------------

# Reload before the Clear step — same as BSC step (d): a cold SL Test
# Credentials floods Convex reactive subscriptions; a fresh render stabilizes
# the Clear flow.
- openLink: ${APP_URL || "http://localhost:3000"}/profile/credentials
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 30000

# Re-select the SportLots tab after the reload (default tab is BSC).
- extendedWaitUntil:
    visible: "Sportlots"
    timeout: 10000
- tapOn: "Sportlots"

- extendedWaitUntil:
    visible: ".*Sportlots Credentials.*"
    timeout: 20000

- tapOn: "Clear Credentials"

- extendedWaitUntil:
    visible:
      text: "Yes, Clear"
    timeout: 7000
- tapOn: "Yes, Clear"

# Re-tap guard — see the rationale at the first occurrence above.
- runFlow:
    when:
      visible:
        text: "Yes, Clear"
    commands:
      - tapOn: "Yes, Clear"

- extendedWaitUntil:
    visible: ".*Credentials cleared.*"
    timeout: 30000

# Verify UI returned to input state — the SportLots username/password form
# swaps in IN PLACE once cleared. Assert without scrolling, same as BSC step (d).
- extendedWaitUntil:
    visible: ".*Sportlots Username.*"
    timeout: 7000

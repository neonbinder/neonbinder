url: ${APP_URL || "https://localhost:3000"}/testing/sign-in?redirect=/profile/credentials&account=new-profile&worker=${WORKER_INDEX || "0"}
name: Credentials lifecycle — connect, rejected sign-in, recover, clear (BSC + SportLots)
tags:
  - credentials
  - profile
---
# Full lifecycle test for marketplace credential management on the profile page.
# Uses the isolated "new-profile" Clerk account so its credential state never
# collides with the main worker or other flows.
#
# Covers PER PLATFORM (BSC first, then SportLots):
#   a. Connect REAL creds (via seed-credentials) → Test → assert auth SUCCESS
#   b. Clear → enter FAKE creds → Connect → assert the connect was REJECTED and
#      that NOTHING was saved (the sign-in form is still on screen — the panel
#      did NOT flip to the connected card)
#   c. Re-connect REAL creds (via seed-credentials) → Test → assert auth SUCCESS
#      (proves a user can recover after a rejected sign-in attempt)
#   d. Clear → assert "Cleared your <platform> connection." + input form returns
#
# NEO-141 — WHAT HAPPENED TO STEP (b):
# The product no longer has a "credentials were saved, but authentication
# failed" outcome, so this flow can no longer assert one. The password is now
# used once, in flight, to mint a marketplace session; a rejected sign-in stores
# NOTHING. Step (b) therefore asserts the new contract instead: the rejection
# message names the platform and says nothing was saved, AND the panel is still
# showing the sign-in form. That second assert is the "nothing was saved" half —
# the form only renders while the account is unconnected, so if the failed
# attempt had stored anything the connected card would have replaced it (the
# flow is not in edit mode at that point; it arrived from a cleared state).
#
# NEO-141 — WHY THE SEED WAITS ARE LONG NOW:
# /testing/seed-credentials performs a REAL marketplace sign-in whenever it has
# to (re-)store credentials, and the seed page awaits that action before it
# redirects. Every seed call in this flow is a re-store — step (d) clears the
# platform, so the next run starts with nothing stored — so each one costs a
# live login round-trip. Each seed is scoped with &sites=<platform> so it only
# signs in to the platform that step needs; without the scope every seed would
# re-connect BOTH marketplaces and roughly double the flow's runtime.
#
# Rejected-connect timing: connecting with fake credentials triggers a full
# marketplace login attempt. Bot challenges and retries can exceed 30s, so we
# allow 120s. The result banner is React state (transient) — it disappears on
# navigate, so we must wait for it in-place with extendedWaitUntil.
#
# NEO-128 — WHAT HAPPENED TO THE SCROLLING IN THIS FLOW:
# Credentials are their own route now, so the whole panel (tablist, heading,
# form or Edit/Test/Clear buttons, confirm dialog, result banner) renders inside
# the 1024×629 headless fold. Every PAGE-LEVEL scrollUntilVisible this flow used
# to carry was compensating for geometry that no longer exists — centering a
# heading so the form below it landed in a safe tap band, scrolling UP to
# re-anchor because a DOWN scroll walked to the Prize Pool section and never
# came back, avoiding centerElement on "Yes, Clear" because centering near the
# page bottom hit max-scroll and dropped the button to y≈19 inside the
# sticky-header occlusion zone where the tap was silently stolen (run
# 28308194220). None of those failure modes are reachable from a single-section
# route, and those scrolls are gone.
#
# What REMAINS is a short centering scroll immediately before each button tap.
# That is not page traversal: the buttons sit at the bottom of the panel (the
# Test/Clear row measured at y=594-626, 3px inside the fold), and tapping that
# close to the edge is the documented tap-time scrollToPoint hazard. Each of
# these moves at most a few dozen pixels.
#
# Also KEPT: the re-tap guard on the confirm dialog, which defends against
# non-positional lost taps and is independent of layout.

- launchApp

# The new-profile user is signed in via the URL's redirect chain. Wait for the
# page to load — "Profile Settings" is the h1, which lives in the profile shell
# and so appears on every /profile sub-route, once Clerk auth and Convex data
# are ready.
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 45000

# =========================================================================
# BSC LIFECYCLE
# =========================================================================

# -----------------------------------------------------------------------
# a. Connect REAL BSC credentials (via seed-credentials) + verify Test success
# -----------------------------------------------------------------------

# Connect real credentials for the new-profile user, server-side. Scoped to BSC
# with &sites=buysportscards — this platform's steps are all that follow, and an
# unscoped seed would also sign in to SportLots (a second live login) for
# nothing. The page auto-redirects when done.
- openLink: ${APP_URL || "http://localhost:3000"}/testing/seed-credentials?sites=buysportscards&redirect=/profile/credentials

# 90s exception (live marketplace round-trip): since NEO-141 the seed page
# awaits a REAL BSC sign-in before it redirects — see the header note.
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 90000

# BSC is the default tab. Gate on the section heading: the panel renders
# "Loading credentials…" until the profile query resolves, so this proves the
# credential UI is really mounted rather than just the shell.
- extendedWaitUntil:
    visible: "BuySportsCards Credentials"
    timeout: 30000

# The seed must have left the account CONNECTED. Asserting this before reaching
# for the buttons is what makes the next step legible when it isn't: the two
# other states the panel can be in ("Sign in to BuySportsCards again" after a
# dead session, or the sign-in form when nothing is stored) both render WITHOUT
# a "Test Credentials" button, so without this assert the flow would sit out the
# 30s button wait below and fail with a misleading "button never appeared".
- extendedWaitUntil:
    visible: ".*Connected to BuySportsCards.*"
    timeout: 7000

# Wait in place until the button is genuinely tappable. Its label is keyed off
# `credsBusy`, so while a credential op holds the server-side lock it reads
# "Testing..." and this waits rather than tapping a disabled control (NEO-128 —
# the seed track failed exactly that way once the flows stopped scrolling and
# reached the button in 0.7s instead of 17s).
- extendedWaitUntil:
    visible: "Test Credentials"
    timeout: 30000

# Then centre it before tapping: the button lands near the 1024x629 fold
# (measured at y=594-626, 3px of margin) and tapping that close to the edge is
# what `centerElement` has always existed to avoid. The panel is short now, so
# this is one small in-panel move rather than a page traversal.
- scrollUntilVisible:
    element:
      text: "Test Credentials"
    centerElement: true
    timeout: 10000
    waitToSettleTimeoutMs: 1000

- tapOn: "Test Credentials"

# 30s sanctioned exception: cold Puppeteer/SSO BSC login on new-profile.
# Clear stays disabled until this banner appears (serialized-ops product fix).
# Non-scrolling: a scrollUntilVisible here would double as the ~22s WAIT and
# park the viewport wherever the page ends, with the banner above it (NEO-125).
- extendedWaitUntil:
    visible: ".*BSC account authenticated successfully.*"
    timeout: 30000

# -----------------------------------------------------------------------
# b. Clear BSC → enter fake credentials → Connect → assert REJECTED and
#    that nothing was saved
# -----------------------------------------------------------------------

# Clear the existing real credentials to expose the input form.

# Wait in place until the button is genuinely tappable. Its label is keyed off
# `credsBusy`, so while a credential op holds the server-side lock it reads
# "Clearing..." and this waits rather than tapping a disabled control (NEO-128 —
# the seed track failed exactly that way once the flows stopped scrolling and
# reached the button in 0.7s instead of 17s).
- extendedWaitUntil:
    visible: "Clear Credentials"
    timeout: 30000

# Then centre it before tapping: the button lands near the 1024x629 fold
# (measured at y=594-626, 3px of margin) and tapping that close to the edge is
# what `centerElement` has always existed to avoid. The panel is short now, so
# this is one small in-panel move rather than a page traversal.
- scrollUntilVisible:
    element:
      text: "Clear Credentials"
    centerElement: true
    timeout: 10000
    waitToSettleTimeoutMs: 1000

- tapOn: "Clear Credentials"

# The confirm dialog appears in place, just below the "Clear Credentials"
# button. Assert it, then tap.
- extendedWaitUntil:
    visible:
      text: "Yes, Clear"
    timeout: 7000
- tapOn: "Yes, Clear"

# Verify the confirm tap REGISTERED (defense-in-depth for any non-positional
# lost tap). handleConfirmClear's first line is setConfirmingClear(false),
# which unmounts this button — so once the onClick fires, "Yes, Clear" vanishes.
# If it is STILL visible, the tap did not register — re-issue it.
# handleConfirmClear is idempotent (it only deletes credentials, and the button
# disables the instant the first onClick fires), so a second fire is harmless.
- runFlow:
    when:
      visible:
        text: "Yes, Clear"
    commands:
      - tapOn: "Yes, Clear"

- extendedWaitUntil:
    visible: ".*Cleared your BuySportsCards connection.*"
    timeout: 30000

# After the "Cleared your…" banner fires, the clear mutation has completed and
# the input form has swapped in IN PLACE (replacing the Sign in again/Test/Clear
# buttons). Assert the FIELD LABEL, not the "Connect" button (NEO-128). This step only needs
# to prove the input form came back, and the label is the TOP of that form —
# always in view. The Connect button is the BOTTOM of it, and the input form is
# taller than the connected-account summary it replaces, so after a reload
# (viewport back at the top) the button sits below the 625px fold. Asserting it
# here failed on CI with the form plainly rendered and both fields visible in
# the failure screenshot. The tap on Connect further down does its own wait and
# centering, so nothing is lost by not asserting it here.
- extendedWaitUntil:
    visible: ".*BuySportsCards Username.*"
    timeout: 30000

# Centre the field before tapping: the password input measured partially
# clipped at the fold in the CI screenshot, and tapping a clipped element
# triggers Maestro's scrollToPoint — the documented CDP flake.
- scrollUntilVisible:
    element:
      id: "username"
    centerElement: true
    timeout: 10000
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "username"
- inputText: "e2e-fake-bsc-user"

# Centre the field before tapping: the password input measured partially
# clipped at the fold in the CI screenshot, and tapping a clipped element
# triggers Maestro's scrollToPoint — the documented CDP flake.
- scrollUntilVisible:
    element:
      id: "password"
    centerElement: true
    timeout: 10000
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "password"
- inputText: "e2e-fake-bsc-pass"

# Wait in place until the button is genuinely tappable. Its label is keyed off
# `credsBusy`, so while a credential op holds the server-side lock it reads
# "Connecting..." and this waits rather than tapping a disabled control (NEO-128 —
# the seed track failed exactly that way once the flows stopped scrolling and
# reached the button in 0.7s instead of 17s).
- extendedWaitUntil:
    visible: "Connect"
    timeout: 30000

# Then centre it before tapping: the button lands near the 1024x629 fold
# (measured at y=594-626, 3px of margin) and tapping that close to the edge is
# what `centerElement` has always existed to avoid. The panel is short now, so
# this is one small in-panel move rather than a page traversal.
- scrollUntilVisible:
    element:
      text: "Connect"
    centerElement: true
    timeout: 10000
    waitToSettleTimeoutMs: 1000

- tapOn: "Connect"

# 120s exception: connecting with fake BSC credentials triggers a full live
# login attempt — the password is used in-flight to try to mint a session. BSC
# bot challenges + 503 retries can take 60–90s on a cold Cloud Run instance.
# Non-scrolling so the transient React-state banner is not navigated away from.
#
# This asserts the SIGN-IN was REJECTED, specifically. The other failure the
# server can report here is "Could not reach BuySportsCards to verify your
# credentials" — that means the browser service never answered, which is an
# infrastructure failure and must NOT count as this test passing.
- extendedWaitUntil:
    visible: ".*Could not sign in to BuySportsCards.*Nothing was saved.*"
    timeout: 120000

# …and NOTHING was saved. This is the other half of the NEO-141 contract, and
# this assert is what proves it: the sign-in form only renders while the account
# is unconnected. The flow is not in edit mode here (it came from the cleared
# state above and a rejected connect does not change that), so had the rejected
# attempt stored anything, `hasCredentials` would have flipped true and the
# panel would have swapped this form for the "Connected to BuySportsCards" card.
- assertVisible: ".*BuySportsCards Username.*"

# -----------------------------------------------------------------------
# c. Re-connect REAL BSC credentials → Test → assert auth SUCCESS (recovery)
# -----------------------------------------------------------------------

# Re-connect with real credentials, server-side and BSC-scoped. This is the
# recovery half of the feature: a user whose sign-in was rejected can enter the
# right password and be connected again. The seed signs in for real, so a
# session exists again by the time the page redirects back.
- openLink: ${APP_URL || "http://localhost:3000"}/testing/seed-credentials?sites=buysportscards&redirect=/profile/credentials

# 90s exception (live marketplace round-trip) — see the header note.
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 90000

- extendedWaitUntil:
    visible: "BuySportsCards Credentials"
    timeout: 30000

# Recovered: the panel is back to the connected card. (Also keeps the button
# wait below from being the thing that reports a failed re-connect — see the
# note at step (a).)
- extendedWaitUntil:
    visible: ".*Connected to BuySportsCards.*"
    timeout: 7000

# Wait in place until the button is genuinely tappable. Its label is keyed off
# `credsBusy`, so while a credential op holds the server-side lock it reads
# "Testing..." and this waits rather than tapping a disabled control (NEO-128 —
# the seed track failed exactly that way once the flows stopped scrolling and
# reached the button in 0.7s instead of 17s).
- extendedWaitUntil:
    visible: "Test Credentials"
    timeout: 30000

# Then centre it before tapping: the button lands near the 1024x629 fold
# (measured at y=594-626, 3px of margin) and tapping that close to the edge is
# what `centerElement` has always existed to avoid. The panel is short now, so
# this is one small in-panel move rather than a page traversal.
- scrollUntilVisible:
    element:
      text: "Test Credentials"
    centerElement: true
    timeout: 10000
    waitToSettleTimeoutMs: 1000

- tapOn: "Test Credentials"

# 30s sanctioned exception: Test is a live marketplace round-trip. The re-connect
# above minted a fresh session, so this is usually the fast path — but it is
# still a real login call and keeps the same ceiling as every other one.
- extendedWaitUntil:
    visible: ".*BSC account authenticated successfully.*"
    timeout: 30000

# -----------------------------------------------------------------------
# d. Clear BSC credentials → assert cleared + input form returns
# -----------------------------------------------------------------------

# Reload before the Clear step. After a cold Test Credentials login, Convex
# reactive subscription events keep flushing through the React tree for several
# seconds; a fresh page render gives the Clear flow a stable starting point.
# (The confirm tap is additionally protected by the re-tap guard below — the
# reload alone is not sufficient, per run 28308194220.)
- openLink: ${APP_URL || "http://localhost:3000"}/profile/credentials
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 30000

- extendedWaitUntil:
    visible: "BuySportsCards Credentials"
    timeout: 30000

# Wait in place until the button is genuinely tappable. Its label is keyed off
# `credsBusy`, so while a credential op holds the server-side lock it reads
# "Clearing..." and this waits rather than tapping a disabled control (NEO-128 —
# the seed track failed exactly that way once the flows stopped scrolling and
# reached the button in 0.7s instead of 17s).
- extendedWaitUntil:
    visible: "Clear Credentials"
    timeout: 30000

# Then centre it before tapping: the button lands near the 1024x629 fold
# (measured at y=594-626, 3px of margin) and tapping that close to the edge is
# what `centerElement` has always existed to avoid. The panel is short now, so
# this is one small in-panel move rather than a page traversal.
- scrollUntilVisible:
    element:
      text: "Clear Credentials"
    centerElement: true
    timeout: 10000
    waitToSettleTimeoutMs: 1000

- tapOn: "Clear Credentials"

- extendedWaitUntil:
    visible:
      text: "Yes, Clear"
    timeout: 7000
- tapOn: "Yes, Clear"

# Re-tap guard — see the rationale at the first occurrence above.
- runFlow:
    when:
      visible:
        text: "Yes, Clear"
    commands:
      - tapOn: "Yes, Clear"

- extendedWaitUntil:
    visible: ".*Cleared your BuySportsCards connection.*"
    timeout: 30000

# Confirm the UI returned to the credential-entry state: once cleared,
# hasStoredCredentials flips false and the username/password input form swaps
# in IN PLACE. Assert it without scrolling — the post-clear reactive flush is
# still settling, and a scrollUntilVisible here crashes CdpWebDriver mid-
# re-render (MismatchedInputException), which is how run 28308194220 attempt 2
# hard-failed at this step.
- extendedWaitUntil:
    visible: ".*BuySportsCards Username.*"
    timeout: 7000

# =========================================================================
# SPORTLOTS LIFECYCLE
# =========================================================================

# -----------------------------------------------------------------------
# a. Connect REAL SportLots credentials (via seed-credentials) + verify Test success
# -----------------------------------------------------------------------

# Connect SportLots, server-side and SL-scoped. BSC is deliberately left cleared
# by step (d) above: an unscoped seed would sign in to BSC again as well, which
# is a second live login this half of the flow has no use for.
- openLink: ${APP_URL || "http://localhost:3000"}/testing/seed-credentials?sites=sportlots&redirect=/profile/credentials

# 90s exception (live marketplace round-trip) — see the header note.
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 90000

# Switch to the SportLots tab — the tablist is at the top of the panel.
- extendedWaitUntil:
    visible: "SportLots"
    timeout: 10000
- tapOn: "SportLots"

- extendedWaitUntil:
    visible: ".*SportLots Credentials.*"
    timeout: 20000

# The seed must have left SportLots CONNECTED — same reasoning as the BSC half:
# the re-auth card and the sign-in form both lack a "Test Credentials" button,
# so asserting the connected state here is what keeps a failed seed from
# surfacing as a misleading "button never appeared" 30s later.
- extendedWaitUntil:
    visible: ".*Connected to SportLots.*"
    timeout: 7000

# Wait in place until the button is genuinely tappable. Its label is keyed off
# `credsBusy`, so while a credential op holds the server-side lock it reads
# "Testing..." and this waits rather than tapping a disabled control (NEO-128 —
# the seed track failed exactly that way once the flows stopped scrolling and
# reached the button in 0.7s instead of 17s).
- extendedWaitUntil:
    visible: "Test Credentials"
    timeout: 30000

# Then centre it before tapping: the button lands near the 1024x629 fold
# (measured at y=594-626, 3px of margin) and tapping that close to the edge is
# what `centerElement` has always existed to avoid. The panel is short now, so
# this is one small in-panel move rather than a page traversal.
- scrollUntilVisible:
    element:
      text: "Test Credentials"
    centerElement: true
    timeout: 10000
    waitToSettleTimeoutMs: 1000

- tapOn: "Test Credentials"

# 30s sanctioned exception: cold Puppeteer/SSO SportLots login on new-profile.
# Wait for the auth-success banner specifically — serialized-ops: Clear is
# disabled until login completes.
- extendedWaitUntil:
    visible: ".*SportLots account authenticated successfully.*"
    timeout: 30000

# -----------------------------------------------------------------------
# b. Clear SportLots → enter fake credentials → Connect → assert REJECTED and
#    that nothing was saved
# -----------------------------------------------------------------------

# Wait in place until the button is genuinely tappable. Its label is keyed off
# `credsBusy`, so while a credential op holds the server-side lock it reads
# "Clearing..." and this waits rather than tapping a disabled control (NEO-128 —
# the seed track failed exactly that way once the flows stopped scrolling and
# reached the button in 0.7s instead of 17s).
- extendedWaitUntil:
    visible: "Clear Credentials"
    timeout: 30000

# Then centre it before tapping: the button lands near the 1024x629 fold
# (measured at y=594-626, 3px of margin) and tapping that close to the edge is
# what `centerElement` has always existed to avoid. The panel is short now, so
# this is one small in-panel move rather than a page traversal.
- scrollUntilVisible:
    element:
      text: "Clear Credentials"
    centerElement: true
    timeout: 10000
    waitToSettleTimeoutMs: 1000

- tapOn: "Clear Credentials"

- extendedWaitUntil:
    visible:
      text: "Yes, Clear"
    timeout: 7000
- tapOn: "Yes, Clear"

# Re-tap guard — see the rationale at the first occurrence above.
- runFlow:
    when:
      visible:
        text: "Yes, Clear"
    commands:
      - tapOn: "Yes, Clear"

- extendedWaitUntil:
    visible: ".*Cleared your SportLots connection.*"
    timeout: 30000

# Reload and re-select the SL tab from a clean state after the Clear block.
- openLink: ${APP_URL || "http://localhost:3000"}/profile/credentials
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 30000

- extendedWaitUntil:
    visible: "SportLots"
    timeout: 10000
- tapOn: "SportLots"

- extendedWaitUntil:
    visible: ".*SportLots Credentials.*"
    timeout: 20000

# Assert the FIELD LABEL, not the "Connect" button (NEO-128). This step only needs
# to prove the input form came back, and the label is the TOP of that form —
# always in view. The Connect button is the BOTTOM of it, and the input form is
# taller than the connected-account summary it replaces, so after a reload
# (viewport back at the top) the button sits below the 625px fold. Asserting it
# here failed on CI with the form plainly rendered and both fields visible in
# the failure screenshot. The tap on Connect further down does its own wait and
# centering, so nothing is lost by not asserting it here.
- extendedWaitUntil:
    visible: ".*SportLots Username.*"
    timeout: 30000

# Centre the field before tapping: the password input measured partially
# clipped at the fold in the CI screenshot, and tapping a clipped element
# triggers Maestro's scrollToPoint — the documented CDP flake.
- scrollUntilVisible:
    element:
      id: "username"
    centerElement: true
    timeout: 10000
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "username"
- inputText: "e2e-fake-sl-user"

# Centre the field before tapping: the password input measured partially
# clipped at the fold in the CI screenshot, and tapping a clipped element
# triggers Maestro's scrollToPoint — the documented CDP flake.
- scrollUntilVisible:
    element:
      id: "password"
    centerElement: true
    timeout: 10000
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "password"
- inputText: "e2e-fake-sl-pass"

# Wait in place until the button is genuinely tappable. Its label is keyed off
# `credsBusy`, so while a credential op holds the server-side lock it reads
# "Connecting..." and this waits rather than tapping a disabled control (NEO-128 —
# the seed track failed exactly that way once the flows stopped scrolling and
# reached the button in 0.7s instead of 17s).
- extendedWaitUntil:
    visible: "Connect"
    timeout: 30000

# Then centre it before tapping: the button lands near the 1024x629 fold
# (measured at y=594-626, 3px of margin) and tapping that close to the edge is
# what `centerElement` has always existed to avoid. The panel is short now, so
# this is one small in-panel move rather than a page traversal.
- scrollUntilVisible:
    element:
      text: "Connect"
    centerElement: true
    timeout: 10000
    waitToSettleTimeoutMs: 1000

- tapOn: "Connect"

# 120s exception: the fake SportLots password is tried against a real sign-in.
# Allow 120s for parity with BSC and Cloud Run cold-start scenarios.
#
# As on the BSC side, this asserts the SIGN-IN was REJECTED specifically — a
# "Could not reach SportLots to verify your credentials" message means the
# browser service never answered and must not count as a pass.
- extendedWaitUntil:
    visible: ".*Could not sign in to SportLots.*Nothing was saved.*"
    timeout: 120000

# …and NOTHING was saved: the sign-in form is still on screen. See the fuller
# note on the BSC half — the form only renders while the account is
# unconnected, so a stored credential would have replaced it with the
# "Connected to SportLots" card.
- assertVisible: ".*SportLots Username.*"

# -----------------------------------------------------------------------
# c. Re-connect REAL SportLots credentials → Test → assert auth SUCCESS (recovery)
# -----------------------------------------------------------------------

- openLink: ${APP_URL || "http://localhost:3000"}/testing/seed-credentials?sites=sportlots&redirect=/profile/credentials

# 90s exception (live marketplace round-trip) — see the header note.
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 90000

- extendedWaitUntil:
    visible: "SportLots"
    timeout: 10000
- tapOn: "SportLots"

- extendedWaitUntil:
    visible: ".*SportLots Credentials.*"
    timeout: 20000

# Recovered: back to the connected card — see the note at step (a).
- extendedWaitUntil:
    visible: ".*Connected to SportLots.*"
    timeout: 7000

# Wait in place until the button is genuinely tappable. Its label is keyed off
# `credsBusy`, so while a credential op holds the server-side lock it reads
# "Testing..." and this waits rather than tapping a disabled control (NEO-128 —
# the seed track failed exactly that way once the flows stopped scrolling and
# reached the button in 0.7s instead of 17s).
- extendedWaitUntil:
    visible: "Test Credentials"
    timeout: 30000

# Then centre it before tapping: the button lands near the 1024x629 fold
# (measured at y=594-626, 3px of margin) and tapping that close to the edge is
# what `centerElement` has always existed to avoid. The panel is short now, so
# this is one small in-panel move rather than a page traversal.
- scrollUntilVisible:
    element:
      text: "Test Credentials"
    centerElement: true
    timeout: 10000
    waitToSettleTimeoutMs: 1000

- tapOn: "Test Credentials"

# 30s sanctioned exception: Test is a live marketplace round-trip. The
# re-connect above minted a fresh session, so this is usually the fast path.
- extendedWaitUntil:
    visible: ".*SportLots account authenticated successfully.*"
    timeout: 30000

# -----------------------------------------------------------------------
# d. Clear SportLots credentials → assert cleared + input form returns
# -----------------------------------------------------------------------

# Reload before the Clear step — same as BSC step (d): a cold SL Test
# Credentials floods Convex reactive subscriptions; a fresh render stabilizes
# the Clear flow.
- openLink: ${APP_URL || "http://localhost:3000"}/profile/credentials
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 30000

# Re-select the SportLots tab after the reload (default tab is BSC).
- extendedWaitUntil:
    visible: "SportLots"
    timeout: 10000
- tapOn: "SportLots"

- extendedWaitUntil:
    visible: ".*SportLots Credentials.*"
    timeout: 20000

# Wait in place until the button is genuinely tappable. Its label is keyed off
# `credsBusy`, so while a credential op holds the server-side lock it reads
# "Clearing..." and this waits rather than tapping a disabled control (NEO-128 —
# the seed track failed exactly that way once the flows stopped scrolling and
# reached the button in 0.7s instead of 17s).
- extendedWaitUntil:
    visible: "Clear Credentials"
    timeout: 30000

# Then centre it before tapping: the button lands near the 1024x629 fold
# (measured at y=594-626, 3px of margin) and tapping that close to the edge is
# what `centerElement` has always existed to avoid. The panel is short now, so
# this is one small in-panel move rather than a page traversal.
- scrollUntilVisible:
    element:
      text: "Clear Credentials"
    centerElement: true
    timeout: 10000
    waitToSettleTimeoutMs: 1000

- tapOn: "Clear Credentials"

- extendedWaitUntil:
    visible:
      text: "Yes, Clear"
    timeout: 7000
- tapOn: "Yes, Clear"

# Re-tap guard — see the rationale at the first occurrence above.
- runFlow:
    when:
      visible:
        text: "Yes, Clear"
    commands:
      - tapOn: "Yes, Clear"

- extendedWaitUntil:
    visible: ".*Cleared your SportLots connection.*"
    timeout: 30000

# Verify UI returned to input state — the SportLots username/password form
# swaps in IN PLACE once cleared. Assert without scrolling, same as BSC step (d).
- extendedWaitUntil:
    visible: ".*SportLots Username.*"
    timeout: 7000

url: ${APP_URL || "https://localhost:3000"}/testing/sign-in?redirect=/testing/reset?redirect=/profile/public&account=new-profile&worker=${WORKER_INDEX || "0"}
name: Fill Profile Data
tags:
  - profile
# TEST_USERNAME must be unique per run. The runner (run-e2e-smoke.sh) sets it
# to neontester-$(date +%s); when running this flow directly pass
# -e TEST_USERNAME=neontester-$(date +%s). No env-block default — a hardcoded
# fallback caused "Username already taken" when a prior run's account still
# owned the shared name.
---
- launchApp
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 45000

# Basic Info — tap label to focus, then type.
# Skips eraseText: account=new-profile guarantees empty fields, saving ~13 erase
# cycles (~2-3 min) per run. See NEO-7.
- scrollUntilVisible:
    element:
      text: "Basic Info"
- tapOn: "Username.*"
- inputText: "${TEST_USERNAME}"
- tapOn: "Display Name"
- inputText: "${TEST_USERNAME}"
- tapOn: "Tagline"
- inputText: "Buying and Selling all kinds of Sports Cards"

# Marketplace Links
# Every field here is reached the way a person reaches it: scroll its VISIBLE
# label into view, tap the label (its htmlFor focuses the input), then type.
# These steps used to target the inputs' DOM ids, which no user can perceive —
# NEO-260 retired that. The labels are unique full strings on this route
# (/profile/public renders only PublicProfileEditor plus the section nav since
# NEO-128 split the sections into routes, so the old "the credentials section
# below also has a Username/Email label" caveat no longer applies).
# R8: every centred scroll carries timeout: 20000 — centring re-reads the
# hierarchy up to six times (8-13s in CI) before it gives up gracefully, and a
# shorter timeout turns that give-up into "No visible element found".
- scrollUntilVisible:
    element:
      text: "Marketplace Links"
- scrollUntilVisible:
    element:
      text: "eBay Store URL"
    centerElement: true
    timeout: 20000
- tapOn: "eBay Store URL"
- inputText: "https://www.ebay.com/str/${TEST_USERNAME}"
- scrollUntilVisible:
    element:
      text: "BuySportsCards URL"
    centerElement: true
    timeout: 20000
- tapOn: "BuySportsCards URL"
# The seller path and the MySlabs short link below are Jason's REAL PUBLIC
# seller URLs, deliberately (confirmed 2026-09-09). Validating the real public
# links is the point of this step, so do not "scrub" them to placeholders — the
# assertions near the end of this flow match them exactly and would break.
- inputText: "https://www.buysportscards.com/Seller/1d8570d204/${TEST_USERNAME}"
- scrollUntilVisible:
    element:
      text: "Sportlots URL"
    centerElement: true
    timeout: 20000
- tapOn: "Sportlots URL"
- inputText: "https://sportlots.com/dealers/?dealer=${TEST_USERNAME}"
# "MySlabs URL" is the label; the sibling helper button reads "Find my MySlabs
# url", a different full string, and Maestro text matches are full-string
# anchored, so this cannot pick up the button.
- scrollUntilVisible:
    element:
      text: "MySlabs URL"
    centerElement: true
    timeout: 20000
- tapOn: "MySlabs URL"
- inputText: "http://myslabs.to/e8c447c0-5917-4326-be26-be2201e36d4a"

# Payment Handles — same visible-label targeting. Each of these labels carries a
# trailing "→ paypal.me/…" preview span once a value is typed, so they are
# matched with .* on both sides rather than as an exact string. A bare
# "PayPal.*" would still be ambiguous across the username and email rows, so
# these name the row: "PayPal username" appears in exactly one label.
- scrollUntilVisible:
    element:
      text: "Payment Handles"
- scrollUntilVisible:
    element:
      text: ".*PayPal username.*"
    centerElement: true
    timeout: 20000
- tapOn:
    text: ".*PayPal username.*"
- inputText: "${TEST_USERNAME}-pp"
- assertVisible: "→ paypal.me/${TEST_USERNAME}-pp"
- scrollUntilVisible:
    element:
      text: ".*Venmo username.*"
    centerElement: true
    timeout: 20000
- tapOn:
    text: ".*Venmo username.*"
- inputText: "${TEST_USERNAME}-venmo"
- assertVisible: "→ venmo.com/${TEST_USERNAME}-venmo"
- scrollUntilVisible:
    element:
      text: ".*Cash App username.*"
    centerElement: true
    timeout: 20000
- tapOn:
    text: ".*Cash App username.*"
- inputText: "${TEST_USERNAME}-cashapp"
- assertVisible: "→ cash.app/$${TEST_USERNAME}-cashapp"

# Social Media — visible labels again ("Twitter / X URL", "Instagram URL",
# "TikTok URL"). The remaining rows (YouTube / Facebook / Threads) are not
# exercised here, as before.
- scrollUntilVisible:
    element:
      text: "Social Media"
- scrollUntilVisible:
    element:
      text: "Twitter / X URL"
    centerElement: true
    timeout: 20000
- tapOn: "Twitter / X URL"
- inputText: "https://x.com/${TEST_USERNAME}-twit"
- scrollUntilVisible:
    element:
      text: "Instagram URL"
    centerElement: true
    timeout: 20000
- tapOn: "Instagram URL"
- inputText: "https://instagram.com/${TEST_USERNAME}-ig"
- scrollUntilVisible:
    element:
      text: "TikTok URL"
    centerElement: true
    timeout: 20000
- tapOn: "TikTok URL"
- inputText: "https://tiktok.com/@${TEST_USERNAME}-tt"

# Save — centerElement keeps "Save Public Profile" fully in view rather than
# clipped at the edge of the 1024x629 headless viewport (R8).
- scrollUntilVisible:
    element:
      text: "Save Public Profile"
    centerElement: true
    timeout: 20000
- tapOn: "Save Public Profile"
# Non-scrolling on purpose. The save confirmation renders BELOW the Save button,
# which is the last element on /profile/public, so it used to land past the fold
# — PublicProfileEditor now scrolls it into view when it appears (NEO-128). This
# assertion is what proves that: a scrollUntilVisible here would pass even if
# the message were invisible to a real operator, which is the bug, not the test.
- extendedWaitUntil:
    visible: "Profile saved.*"
    timeout: 10000
# Verify the profile link shows the correct URL path
- assertVisible: "View your profile at /u/${TEST_USERNAME}"

# Navigate to the public profile — openLink avoids the CDP-context destruction
# that tapOn-on-a-link causes when the client-side router tears down the page
# mid-tap (null→Int cast crash; seen in CI run 27905676068). The assertVisible
# above already proved the link text/path is correct; this just gets us there.
- openLink: ${APP_URL || "http://localhost:3000"}/u/${TEST_USERNAME}
- assertVisible: "Buying and Selling all kinds of Sports Cards"

# Validate public profile content
- assertVisible: "${TEST_USERNAME}"

# Verify each link on the public profile page points to the correct URL.
# The link buttons include their href as screen-reader text, so we can
# match the actual destination URL rendered on the page.

# Marketplace links
- assertVisible: ".*ebay.com/str/${TEST_USERNAME}.*"
- assertVisible: ".*buysportscards.com/Seller/1d8570d204/${TEST_USERNAME}.*"
- assertVisible: ".*sportlots.com/dealers.*${TEST_USERNAME}.*"
- assertVisible: ".*myslabs.to/.*"

# Payment links — Marketplace Stores render at the top of the public profile,
# Payment Handles below the fold. Scroll each into view before asserting; we
# already do this for Cash App + the social links below, just bring PayPal
# and Venmo in line.
- scrollUntilVisible:
    element:
      text: ".*paypal.me/${TEST_USERNAME}-pp.*"
- scrollUntilVisible:
    element:
      text: ".*venmo.com/${TEST_USERNAME}-venmo.*"
- scrollUntilVisible:
    element:
      text: ".*cash.app.*${TEST_USERNAME}-cashapp.*"

# Social media links
- scrollUntilVisible:
    element:
      text: ".*x.com/${TEST_USERNAME}-twit.*"
- assertVisible: ".*instagram.com/${TEST_USERNAME}-ig.*"
- assertVisible: ".*tiktok.com.*${TEST_USERNAME}-tt.*"

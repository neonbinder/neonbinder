url: ${APP_URL || "https://localhost:3000"}/testing/sign-in?redirect=/profile/credentials&worker=${WORKER_INDEX || "0"}
name: "Expired marketplace session — the panel says sign in again, and goes back to connected once the session proves good"
tags:
  - credentials
  - profile
---
# THE ONE FEATURE THIS FLOW PROVES (NEO-140/141):
# When a stored marketplace session dies, the credentials panel stops pretending
# the account is fine. It shows a distinct "sign in again" state — not the
# connected card, and not the "you have no credentials" form — and that state
# clears itself the moment the connection is proven to work again.
#
# WHY THIS NEEDS A TESTING HOOK:
# `needsReauth` is set in exactly one place: the browser service reporting a
# stored session that is dead AND cannot be renewed from anything we hold. No UI
# action produces it and the honest wait is a 24h token expiry, so the state was
# untestable until /testing/needs-reauth (auth-scoped, TESTING_RESET_SECRET-gated,
# patches only the caller's own row). The hook sets the FLAG; everything this
# flow asserts afterwards is ordinary product behaviour.
#
# WHY SPORTLOTS: its session is a 30-day cookie, so the seed below almost always
# skips its (live, 30-65s) sign-in. BSC's 24h refresh token would pay for one far
# more often, for identical coverage.
#
# WHY THE RECOVERY IS A *TEST*, NOT A RE-SEED — READ BEFORE "TIDYING UP":
# The recovery below is the feature's second half, not housekeeping. A re-seed
# WOULD clear the flag — when the stored session is still renewable,
# seedMyTestCredentials skips the store and calls updateSiteCredentialStatus
# with `needsReauth: false` (convex/testing.ts calls that load-bearing, and
# set-selector/reauth-notice-on-set-builder.yaml relies on it for its restore)
# — but that is a testing hook, not something a user can do. The product's own
# repair path is the re-auth card's "Sign in again", which opens the form and
# its "Test Stored Credentials" button; a successful login is what clears the
# flag in production (applyLoginOutcome). The re-auth card deliberately offers
# no "Test Credentials" button. That is the path a real user takes, minus
# typing a password (never available to a flow — no secrets via -e), and it is
# what this flow proves.
#
# NEO-278 (re-auth backoff): "Test Stored Credentials" runs testSiteCredentials
# → authenticateSportlots directly; only fetch-driven refreshes in getSiteToken
# are subject to the 15-minute backoff, and the testing hook stamps no
# `reauthObservedAt` anyway. Nothing this flow asserts waits on a login being
# re-attempted by a sync.
#
# HOUSEKEEPING: this flow flags, then unflags, its OWN worker account. If it
# fails BEFORE the recovery, the worker's SportLots row is left flagged, and the
# only thing that reads that flag is this panel — the Set Builder gate keys on
# `hasCredentials`, which is untouched. The one flow that would then also go red
# on the same runner is profile/test-credentials.yaml (its SportLots half). If
# you are looking at that pair of failures, this is the cause and the fix is
# whatever made THIS flow fail.
#
# NEO-287 — PAUSED BRANCH. While the operator has SportLots on pause
# (`-e PAUSED_PLATFORMS`, decided once by util-paused-platforms below), the
# re-auth state this flow proves is unreachable by design: paused beats
# needs-reauth on the Profile card (plan decision 6), because "sign in again"
# is exactly what the pause refuses, so the card would prescribe a dead
# control. The paused branch proves THAT precedence instead: the seed hop
# lands (SportLots skipped, no login), the paused card is up, and after the
# same /testing/needs-reauth hop the panel STILL shows the paused card and NOT
# the re-auth card. Under the pause the seed never connects a SportLots row
# after the run's reset, so the hook usually finds no row and is a no-op —
# the assertions hold either way, and when a row IS there (a deployment that
# was connected before the pause) the precedence is what is being proved.
# No restore step: the flag, if set, is cleared by the seed's self-heal on
# the first run after the pause lifts (convex/testing.ts), and nothing reads
# it while the pause is on. The live branch is unchanged.

- runFlow:
    file: ../util/util-paused-platforms.yaml

- launchApp

# Cold sign-in (Clerk + Convex handshake).
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 45000

# NEO-287 — LIVE: the re-auth state and its recovery, verbatim. PAUSED: the
# paused card outranks the re-auth card. See the header.
- runFlow:
    when:
      true: "${!output.SL_PAUSED}"
    commands:
      # -----------------------------------------------------------------------
      # Precondition: this worker is CONNECTED to SportLots
      # -----------------------------------------------------------------------

      # Phase-0 worker-bootstrap already connected both platforms; this scoped seed
      # just makes the precondition explicit (and keeps the flow runnable on its own
      # with the bootstrap skipped). 90s exception (live marketplace round-trip):
      # since NEO-141 the seed page awaits a REAL sign-in whenever it cannot skip.
      - openLink: ${APP_URL || "http://localhost:3000"}/testing/seed-credentials?sites=sportlots&redirect=/profile/credentials
      - extendedWaitUntil:
          visible: "Profile Settings"
          timeout: 90000

      # Switch to the SportLots tab — the tablist is at the top of the panel.
      - extendedWaitUntil:
          visible: "SportLots"
          timeout: 10000
      - tapOn: "SportLots"

      # R5: 7000, the bar. This is a local tab switch, not a marketplace round-trip —
      # the tap above is already gated on the tab being present — so it is exactly the
      # kind of interaction the bar exists to hold. MEASURED in CI (green run): the
      # heading resolves 0.33 s after the tap, every time, on both flows. The old
      # 20000 was 60x the measurement and would have hidden a real regression.
      - extendedWaitUntil:
          visible: ".*SportLots Credentials.*"
          timeout: 7000

      - extendedWaitUntil:
          visible: ".*Connected to SportLots.*"
          timeout: 7000

      # Prove the "Test Credentials" button is HERE, now, on this page — because two
      # steps below the whole point is that it is GONE. Asserting its absence is only
      # meaningful once the same selector has matched something in the same run;
      # otherwise a typo'd selector would make that later assertion pass forever.
      - assertVisible: "Test Credentials"

      # -----------------------------------------------------------------------
      # The SportLots session dies
      # -----------------------------------------------------------------------

      - openLink: ${APP_URL || "http://localhost:3000"}/testing/needs-reauth?site=sportlots&redirect=/profile/credentials

      # 30s: a /testing/* page is a full document load that has to re-do the
      # Clerk → Convex handshake before it can call anything — the same budget every
      # other openLink of a /testing/* page in this suite uses. The mutation itself is
      # a single patch; there is no marketplace call on this path.
      - extendedWaitUntil:
          visible: "Profile Settings"
          timeout: 30000

      - extendedWaitUntil:
          visible: "SportLots"
          timeout: 10000
      - tapOn: "SportLots"

      # R5: 7000, the bar. This is a local tab switch, not a marketplace round-trip —
      # the tap above is already gated on the tab being present — so it is exactly the
      # kind of interaction the bar exists to hold. MEASURED in CI (green run): the
      # heading resolves 0.33 s after the tap, every time, on both flows. The old
      # 20000 was 60x the measurement and would have hidden a real regression.
      - extendedWaitUntil:
          visible: ".*SportLots Credentials.*"
          timeout: 7000

      # THE FEATURE. Three assertions, one per state the panel can be in, so this
      # cannot pass unless the panel is in the re-auth state specifically:
      #   1. the re-auth card is shown…
      - extendedWaitUntil:
          visible: ".*Sign in to SportLots again.*"
          timeout: 7000
      #   2. …it is NOT the connected card — no "Test Credentials" here, deliberately,
      #      because a session that cannot be renewed would fail that test by
      #      construction (this absence is why the shared util flows have to
      #      assert-fast on the connected state instead of waiting for the button)…
      - assertNotVisible: "Test Credentials"
      #   3. …and it does NOT read as "you have no credentials": the sign-in form is
      #      not showing. The account is still connected; only the session died.
      - assertNotVisible: ".*SportLots Username.*"

      # -----------------------------------------------------------------------
      # Recovery: sign in again → the connection proves good → the warning clears
      # -----------------------------------------------------------------------

      # Centre before tapping: the card's buttons sit low in the 1024x629 fold.
      - scrollUntilVisible:
          element:
            text: "Sign in again"
          centerElement: true
          timeout: 7000
          waitToSettleTimeoutMs: 1000
      - tapOn: "Sign in again"

      # The sign-in form opens. (Same selector asserted absent above — its appearing
      # now is what makes that assertion trustworthy.)
      - extendedWaitUntil:
          visible: ".*SportLots Username.*"
          timeout: 7000

      # A flow can never type a real password, so the honest repair available here is
      # the form's other button: re-check the stored session. It is enabled because
      # the account never stopped being connected.
      - scrollUntilVisible:
          element:
            text: "Test Stored Credentials"
          centerElement: true
          timeout: 7000
          waitToSettleTimeoutMs: 1000
      - tapOn: "Test Stored Credentials"

      # 30s sanctioned exception: a live SportLots session check. Non-scrolling so the
      # transient React-state banner is not scrolled past while the call is in flight.
      - extendedWaitUntil:
          visible: ".*SportLots account authenticated successfully.*"
          timeout: 30000

      # Leave the form (a successful test does not close it — only the user does) and
      # assert the panel is back to CONNECTED. That card renders only when the account
      # has credentials AND is not flagged for re-auth, so this single assertion is
      # the proof that a working connection cleared the warning.
      - scrollUntilVisible:
          element:
            text: "Cancel"
          centerElement: true
          timeout: 7000
          waitToSettleTimeoutMs: 1000
      - tapOn: "Cancel"

      - extendedWaitUntil:
          visible: ".*Connected to SportLots.*"
          timeout: 7000
- runFlow:
    when:
      true: "${output.SL_PAUSED}"
    commands:
      # The seed hop: under the pause it reports SportLots skipped and performs
      # no login, so this is one status read and a redirect — but it is still
      # a /testing/* full document load with the Clerk → Convex handshake, the
      # same 30s budget every other openLink of a /testing/* page uses.
      - openLink: ${APP_URL || "http://localhost:3000"}/testing/seed-credentials?sites=sportlots&redirect=/profile/credentials
      - extendedWaitUntil:
          visible: "Profile Settings"
          timeout: 30000
      - extendedWaitUntil:
          visible: "SportLots"
          timeout: 10000
      - tapOn: "SportLots"
      - extendedWaitUntil:
          visible: ".*SportLots Credentials.*"
          timeout: 7000
      # Precondition, stated: the paused card, not the connected card.
      - extendedWaitUntil:
          visible: "SportLots is on pause"
          timeout: 7000
      - assertNotVisible: "Test Credentials"

      # The session "dies" (no-op when there is no row; see the header).
      - openLink: ${APP_URL || "http://localhost:3000"}/testing/needs-reauth?site=sportlots&redirect=/profile/credentials
      - extendedWaitUntil:
          visible: "Profile Settings"
          timeout: 30000
      - extendedWaitUntil:
          visible: "SportLots"
          timeout: 10000
      - tapOn: "SportLots"
      - extendedWaitUntil:
          visible: ".*SportLots Credentials.*"
          timeout: 7000

      # THE FEATURE UNDER THE PAUSE: paused beats needs-reauth. The paused card
      # is (still) up, the re-auth card is NOT, and neither live control is
      # offered. Positives first, so the negatives cannot pass on a dead page.
      - extendedWaitUntil:
          visible: "SportLots is on pause"
          timeout: 7000
      - assertVisible: "Sign-ins to SportLots are benched for now.*"
      - assertNotVisible: ".*Sign in to SportLots again.*"
      - assertNotVisible: "Sign in again"
      - assertNotVisible: "Test Credentials"
      - assertNotVisible: ".*SportLots Username.*"

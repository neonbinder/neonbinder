url: ${APP_URL || "https://localhost:3000"}/testing/sign-in?redirect=/profile/credentials&worker=${WORKER_INDEX || "0"}
name: Test BSC and SportLots Credentials
tags:
  - credentials
  - profile
---
# Verifies that both the BSC and SportLots "Test Credentials" buttons succeed
# when real credentials are present. The worker-bootstrap Phase-0 flow seeds
# real credentials server-side via /testing/seed-credentials — this flow
# reuses them without re-seeding so the Puppeteer token cache is intact.
#
# No clear, no restore. This flow's sole purpose is asserting that the
# "Test Credentials" UI action works for both platforms.
#
# Re-seeding is intentionally avoided: since NEO-141 a seed that has to re-store
# performs a REAL marketplace sign-in (30-65s) before its page redirects, so
# re-seeding here would add a live login this flow has no use for. The bootstrap
# already connected and warmed both platforms via util-login-to-{bsc,sportlots}.
#
# NEO-128: credentials are their own route, so this flow no longer scrolls at
# all. Every step below used to be a scrollUntilVisible hunting for a section on
# a ~5000px page, including a direction: UP scroll to walk back to the platform
# tablist after the viewport had been parked further down. None of that geometry
# exists on a single-section route — the tablist, the button and the result
# banner all sit inside the 1024×629 headless fold.
#
# NEO-287 — the SportLots half branches on the operator's pause switch
# (`-e PAUSED_PLATFORMS`, decided once by util-paused-platforms below). LIVE:
# the test round-trip, unchanged. PAUSED: the panel offers no test at all — the
# paused card is up and "Test Credentials" is gone — which is the product's
# contract for a paused platform (todos/neo-287-plan.md §4). The BSC half is
# untouched: only SportLots is paused. Both branches end in hard asserts (R2).

- runFlow:
    file: ../util/util-paused-platforms.yaml

- launchApp

# Wait for the page to finish loading. "Profile Settings" is the <h1> and lives
# in the profile shell, so it is present on every /profile sub-route — it
# appears only after Clerk auth and Convex data are both ready. The old "Neon
# Binder" 45s wait added no product value (pure-UI text with no relationship to
# cred-section readiness); removed per Rule 5.
- extendedWaitUntil:
    visible: "Profile Settings"
    timeout: 45000

# -----------------------------------------------------------------------
# BSC (default tab — no tab switch needed)
# -----------------------------------------------------------------------

# BSC is always the default-selected tab, so its section renders without a tab
# tap. Gate on the section heading so the panel is proven rendered (the panel
# shows "Loading credentials…" until the profile query resolves) before tapping.
- extendedWaitUntil:
    visible: "BuySportsCards Credentials"
    timeout: 30000

# Fail fast if this worker is not connected to BSC (NEO-141): only the connected
# card renders a "Test Credentials" button, so without this the flow would sit
# out the 30s wait below and blame a missing button for a missing connection.
- extendedWaitUntil:
    visible: ".*Connected to BuySportsCards.*"
    timeout: 7000

# Wait in place until the button is genuinely tappable. Its label is keyed off
# `credsBusy`, so while a credential op holds the server-side lock it reads
# "Testing..." and this waits rather than tapping a disabled control (NEO-128 —
# the seed track failed exactly that way once the flows stopped scrolling and
# reached the button in 0.7s instead of 17s).
- extendedWaitUntil:
    visible: "Test Credentials"
    timeout: 30000

# Then centre it before tapping: the button lands near the 1024x629 fold
# (measured at y=594-626, 3px of margin) and tapping that close to the edge is
# what `centerElement` has always existed to avoid. The panel is short now, so
# this is one small in-panel move rather than a page traversal.
- scrollUntilVisible:
    element:
      text: "Test Credentials"
    centerElement: true
    timeout: 7000
    waitToSettleTimeoutMs: 1000

- tapOn: "Test Credentials"

# 30s sanctioned exception: a cold Puppeteer/SSO BSC login takes ~22s.
# extendedWaitUntil (non-scrolling), matching the SportLots banner below: a
# scrollUntilVisible here would double as the ~22s WAIT, so it would keep
# swiping the whole time the login is in flight and park the viewport wherever
# the page happens to end — then the banner appears above it and is never seen.
# Waiting in place is both correct and stable.
- extendedWaitUntil:
    visible: ".*BSC account authenticated successfully.*"
    timeout: 30000

# -----------------------------------------------------------------------
# SportLots tab
# -----------------------------------------------------------------------

# Switch to the SportLots tab. The BSC | Sportlots tablist sits at the top of
# the credentials panel and has never left the viewport, so this is a plain tap.
- tapOn: "Sportlots"

# NEO-287 — LIVE: test the stored SportLots session. PAUSED: the panel says the
# platform is on pause and offers no test. See the header.
- runFlow:
    when:
      true: "${!output.SL_PAUSED}"
    commands:
      # Confirm the tab switch actually re-rendered the panel before acting on it.
      - extendedWaitUntil:
          visible: ".*Sportlots Credentials.*"
          timeout: 10000

      # Fail fast if this worker is not connected to SportLots (NEO-141) — same
      # reasoning as the BSC half above.
      - extendedWaitUntil:
          visible: ".*Connected to SportLots.*"
          timeout: 7000

      # Wait in place until the button is genuinely tappable. Its label is keyed off
      # `credsBusy`, so while a credential op holds the server-side lock it reads
      # "Testing..." and this waits rather than tapping a disabled control (NEO-128 —
      # the seed track failed exactly that way once the flows stopped scrolling and
      # reached the button in 0.7s instead of 17s).
      - extendedWaitUntil:
          visible: "Test Credentials"
          timeout: 30000

      # Then centre it before tapping: the button lands near the 1024x629 fold
      # (measured at y=594-626, 3px of margin) and tapping that close to the edge is
      # what `centerElement` has always existed to avoid. The panel is short now, so
      # this is one small in-panel move rather than a page traversal.
      - scrollUntilVisible:
          element:
            text: "Test Credentials"
          centerElement: true
          timeout: 7000
          waitToSettleTimeoutMs: 1000

      - tapOn: "Test Credentials"

      # 30s sanctioned exception: cold Puppeteer/SSO SportLots login takes ~22s.
      # Non-scrolling for the same reason as the BSC banner above (NEO-125).
      - extendedWaitUntil:
          visible: ".*Sportlots account authenticated successfully.*"
          timeout: 30000
- runFlow:
    when:
      true: "${output.SL_PAUSED}"
    commands:
      - extendedWaitUntil:
          visible: ".*Sportlots Credentials.*"
          timeout: 10000
      # THE PAUSED STATE (copy: lib/marketplace/pause-notice.ts). The heading is
      # the card's <strong>; the body prefix is shared by the connected and the
      # not-connected bodies, so this holds for a worker in either state.
      - extendedWaitUntil:
          visible: "SportLots is on pause"
          timeout: 7000
      - assertVisible: "Sign-ins to SportLots are benched for now.*"
      # The live control this flow exists to press is NOT offered while paused
      # — a test would be refused server-side, so the panel must not claim one
      # is possible. Paired with the positives above.
      - assertNotVisible: "Test Credentials"
      - assertNotVisible: "Sign in again"

appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&account=admin-no-credentials&worker=${WORKER_INDEX || "0"}
name: "Set Builder Gate — admin with neither BSC nor SportLots credentials sees the warning banner"
tags:
  - set-selector
---
# Uses the dedicated never-seeded account (admin-no-credentials / dev+e2e-no-creds@neonbinder.io).
# No clear / restore / seed / reset — strictly sign-in and assert.

- launchApp
- extendedWaitUntil:
    visible: "Set Builder requires marketplace credentials"
    timeout: 45000
# NEO-287 — which platforms the banner names depends on the operator's pause
# switch (`-e PAUSED_PLATFORMS`, decided once by util-paused-platforms, R3): a
# paused platform is not REQUIRED (plan decision 5), so with SportLots paused
# this credential-less admin is gated on BuySportsCards ALONE and the banner
# must name only that. Both branches are hard (R2); the rest of the flow (the
# panel is absent, the CTA lands on the profile) is shared.
- runFlow:
    file: ../util/util-paused-platforms.yaml
- runFlow:
    when:
      true: "${!output.SL_PAUSED}"
    commands:
      - assertVisible: ".*BuySportsCards and SportLots.*"
- runFlow:
    when:
      true: "${output.SL_PAUSED}"
    commands:
      # "BuySportsCards" alone, inside the sentence, and SportLots not named
      # anywhere on the banner (the pause strip lives on the panel this
      # account cannot open, so it is not here either).
      - assertVisible: ".*You need to connect.*"
      - assertVisible: "BuySportsCards"
      - assertNotVisible: ".*BuySportsCards and SportLots.*"
      - assertNotVisible: "SportLots"
- assertNotVisible: ".*Build set parameters using marketplace APIs.*"
- assertNotVisible: "Sync Sports"

# Verify the "Configure credentials" link navigates to the profile page.
- scrollUntilVisible:
    element:
      id: "Configure credentials in Profile"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Configure credentials in Profile"
- assertVisible: "Profile Settings"

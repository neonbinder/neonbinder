appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&account=admin-sl-only&worker=${WORKER_INDEX || "0"}
name: "Set Builder Gate — admin without BSC credentials sees the warning banner"
tags:
  - set-selector
---
# Verifies the credentials gate on /set-selector:
#   - Signs in as the dedicated admin-sl-only account (dev+e2e-sl-only@neonbinder.io).
#   - Seeds ONLY SportLots creds via ?sites=sportlots (no BSC seed).
#   - Navigating to /set-selector renders the MissingCredentialsBanner
#     naming BuySportsCards only — NOT SportLots.
#   - The "Configure credentials in Profile" link points to /profile.
#
# No clear, no restore, no reset — the account starts and ends with SL-only.
#
# NEO-141: the seed step is a live marketplace round-trip whenever it has to
# (re-)store credentials — connecting IS signing in now, and the seed page waits
# for that sign-in before it redirects. It is skipped while the account's stored
# session can still be renewed, so most runs pay nothing; the wait below only has
# to be big enough for the runs that don't.

# Step 1: open /set-selector as admin-sl-only (nothing seeded yet — don't assert gate here)
#
# GATED ON THE BANNER'S OWN HEADING, NOT ON "Set Builder" (NEO-260, R2/R5).
# /set-selector redirects to /admin/set-builder, where "Set Builder" is ALSO the
# admin section's sub-tab NavLink — the layout paints that strip before the page
# body mounts, so the old gate passed early and raced (README → "Launching a
# flow", NEO-155 note). Every other flow re-anchors on the panel subtitle
# ".*Build set parameters using marketplace APIs.*"; this flow cannot, because it
# asserts that subtitle is ABSENT — on a credential-gated account
# app/admin/set-builder/page.tsx renders MissingCredentialsBanner INSTEAD of the
# panel. The banner's own h2 is the equivalent mount signal: it renders only once
# userProfile.getUserProfile has resolved and the gate has decided, so neither the
# nav strip nor the "Loading credentials…" placeholder can satisfy it. It names no
# platform, so it still does not pre-judge Step 3.
- launchApp
- extendedWaitUntil:
    visible: "Set Builder requires marketplace credentials"
    timeout: 45000

# Step 2: seed ONLY SportLots, then redirect back to /set-selector.
- openLink: ${APP_URL || "http://localhost:3000"}/testing/seed-credentials?sites=sportlots&redirect=/set-selector

# Wait for the redirect to land before asserting anything about the page. 90s
# exception (live marketplace round-trip) — see the NEO-141 note above; the seed
# page does not forward until its sign-in finishes, and a bare assert here would
# be judging the seed page instead of /set-selector.
# Same anchor as Step 1 (NEO-260): the banner's h2, not the sub-tab NavLink.
- extendedWaitUntil:
    visible: "Set Builder requires marketplace credentials"
    timeout: 90000

# Step 3: the gate banner must appear naming BuySportsCards only
- assertVisible: "Set Builder requires marketplace credentials"
# BuySportsCards must be named in the banner (the missing platform)
- assertVisible: "BuySportsCards"
# SportLots must NOT appear — asserting only the BSC name is insufficient
# because the both-missing banner also contains "BuySportsCards"
- assertNotVisible: "SportLots"
# The Set Builder UI itself must not be visible
- assertNotVisible: ".*Build set parameters using marketplace APIs.*"

# Step 4: the CTA link leads to /profile
- scrollUntilVisible:
    element:
      id: "Configure credentials in Profile"
    centerElement: true
- tapOn:
    id: "Configure credentials in Profile"
- assertVisible: "Profile Settings"

appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "2024 Topps Chrome Parallel — Build the base set's parallels from Base, stop after one, and the copy's title names its parallel (NEO-321)"
tags:
  - set-selector
---
# ════════════════════════════════════════════════════════════════════════════
# R1 — ONE FEATURE: THE BASE SET'S PARALLELS ARE BUILT FROM BASE, FROM THE
# PARALLEL VARIANT TYPE, IN ONE GO (NEO-321). On live data, under Baseball →
# 2024 → Topps → Topps Chrome › `Parallel`:
#
#   1. Selecting the variant type whose NB role is `parallel` shows the
#      section `Parallels of Base` with `Build N parallels from Base` (D2:
#      nothing runs until it is pressed).
#   2. Pressing it asks first, because some parallels already hold cards
#      (D4): `Replace the cards on K of N parallels with fresh copies of
#      Base's?` → `Replace and build`.
#   3. The run is the shared ledger: `Stop after this one` ends it after the
#      parallel in flight (`Base parallels — stopped after b of N`), and that
#      parallel's line reads `<parallel> — Built|Rebuilt N cards`, N > 0.
#   4. A copy is a card OF the parallel: its listing title carries the
#      parallel row's own NB name (`features.parallelName`, NEO-321, Jason
#      2026-10-04). Read in the card drawer's `Card title`.
#
# Claim 4 is the regression proof for the server fix that sets
# `parallelName` from the NB parallel row (`insertParallelCardsPage` →
# `buildCardRowForInsert`). Without it a copy of a plain Base card carries no
# `parallelName` at all — the parallel row's snapshot never sets one for an
# insert-level row (`deriveSetLevelFeatures`), and Base's own "Base" is
# inherited, so `copyFeaturesForParallel` drops it — and the generated title
# has no parallel token (`generateListing.ts`, `isRealParallel`). The title
# assert then fails by name.
#
# WHAT THIS FLOW DOES NOT RE-PROVE (R3): the per-row `Build from Base` button
# (setup.yaml's Gold Wave step builds through it, and its SportLots
# pagination guard reads the copies); an insert's automatic build after a
# save (`bowman-insert-grouping-builds-parallels`). The section's disabled
# states, the no-confirm path (K = 0) and Stop's own wording are unit-tested
# (`BaseParallelsBuildSection.test.tsx`, `ParallelBuildPanel.test.tsx`).
#
# THE `name:` STAYS UNDER ~200 BYTES (Maestro names the debug directory after
# it; Linux refuses a path component over 255 bytes).
#
# ── THE FIXTURE AND THE WRITE SET (R7a, SET-REGISTRY.md → this flow) ────────
#   setup.yaml syncs Topps Chrome's Variant Types, saves the `Parallel`
#   reconcile (every parallel of the base set as an insert-level row under
#   it) and builds ONE of them, `Gold Wave Refractors`, from Base. So on
#   every run K >= 1 and the confirm is the path, not a branch (R2): the flow
#   asserts it hard.
#
#   The run builds the parallels in the type's own child order
#   (`getParallelsForBuild` sorts by `parent.children`), skipping the
#   unlinked and the blocked. Stop is pressed while the FIRST buildable one
#   is in flight, so this flow writes that parallel's cards and no other
#   (STEP 3 asserts `stopped after 1`). That set is order-defined, not
#   chosen: MEASURED as `Sepia Refractors` (CI 37179999943, runner 2,
#   recorded in SET-REGISTRY.md), but the flow still reads the name off the
#   ledger at run time and never assumes it — the claim is about whichever
#   parallel the run built, and a reordered reconcile must not fail it. Every
#   row under Topps Chrome › Parallel is safe to write: no queue flow reads a
#   base parallel's cards (Gold Wave's are read only by setup.yaml, which runs
#   alone before the queue). The run touches no Base card (Base is the
#   SOURCE: read, never written) and mints no player, team or row.
#
#   If Stop never lands, the run walks on through the parallels — Gold Wave
#   included — until this flow's browser closes (the run is client-side and
#   ends "stopped when you left"). Still no reader is harmed; the flow fails
#   at the stopped-heading wait, by name.
#
#   A re-run on the same preview finds that parallel already holding cards:
#   K grows by one and its line reads `Rebuilt`. Both are accepted.
#
# ── LIVE / PAUSED ───────────────────────────────────────────────────────────
#   No `when:` branch. Under `PAUSED_PLATFORMS=sportlots` every parallel is
#   BSC-only and the build fetches BSC alone; the section, the confirm, Stop,
#   the ledger line and the title read the same. ONE value differs: the
#   parallel count N is pinned to the measured 41 live and left open paused,
#   where the BSC-only reconcile's count is unmeasured (STEP 1,
#   `output.PARALLELS_N`). (README → "Operator switches".)
#
# ── TIMEOUTS (R5) ───────────────────────────────────────────────────────────
#   7000 on every step this flow owns after the launch gate, with NO
#   exception (the drill util carries its own sanctioned waits). The wait for
#   the in-flight build after Stop used to carry R5's marketplace round-trip
#   exception at 90000; the first green run measured the whole 300-card live
#   build (BSC + paged SportLots) at ~5 s, so it fits the bar — see STEP 3.
#
# ── THE LEDGER GROWS WITH ITS LINES (NEO-321, commit 7543bc7) ──────────────
#   The run's ledger lists all N parallels as plain page content (no inner
#   scroller below 100 lines): ~41 x 22px ≈ 900px between the columns row and
#   everything under the section. So STEP 3 scrolls DOWN to the built line
#   before reading it, and STEP 4 reloads the set builder instead of
#   travelling past the ledger — see each step.
# ════════════════════════════════════════════════════════════════════════════

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# STEP 1 — SELECT TOPPS CHROME › PARALLEL; THE SECTION SHOWS (D2)
# ============================================================

# R9 — the warm drill. Returns with the Variant Types column on screen and
# "Base" listed.
- runFlow:
    file: util-drill-to-2024-topps-chrome.yaml

# N, THE PARALLEL COUNT. MEASURED 41 on the live seed (CI 37874717642: the
# section read `Build 41 parallels from Base`, the seed's reconcile pressed
# `Save 41 sets`): every row the seed's `Parallel` reconcile saved, i.e. the
# pairs its matcher made. It was 42 (CI 37179999943) until NEO-325: SportLots
# lists TWO "Chrome Black Refractor" sets (#305604, #309103), and a name
# twin is never auto-paired (Jason, 2026-10-08), so BSC's `Black Refractors`
# now waits in Pending, unsaved, instead of being linked to whichever twin
# SportLots listed first. Verified 2026-10-08 by running main's and NEO-325's
# `computeMatches` on the live dialog's names: 42 vs 41, the only difference
# `Black Refractors <-> Chrome Black Refractor (305604)`. Pinned,
# so a plan that drops rows (`getParallelsForBuild`'s byte-bounded read, a
# truncation) fails by count rather than building fewer parallels quietly.
# Under `PAUSED_PLATFORMS=sportlots` the reconcile is BSC's list alone and
# that count has not been measured, so the paused branch keeps any count
# (the drill util has just run `util-paused-platforms`, which sets
# `output.SL_PAUSED`). Used in the button, the confirm and the stopped
# heading below.
- evalScript: '${output.PARALLELS_N = output.SL_PAUSED ? "[0-9]+" : "41"}'

# "Parallel" sits under "Base" in the same column; DOWN (the default),
# centred for the tap (R8). Exact text: the column's three rows are Base,
# Insert, Parallel, and nothing else on the page full-matches "Parallel".
- scrollUntilVisible:
    element:
      text: "Parallel"
    centerElement: true
    timeout: 7000
- tapOn: "Parallel"

# THE BUTTON, with its count — `buildAllLabel` names a count only once the
# server's list is in, so this scroll is also the wait for
# `getParallelsForBuild` (our own query: the 7000 bar). The section renders
# BELOW the columns row (SetSelector.tsx, the variant-type slot), so DOWN.
# R8 case 1: below it are only the section's sleeve strip (no ledger before a
# run), the collapsed attributes bar and the NEO-260 208px spacer, which is
# the headroom this centring depends on (MEASURED: centred at y=256 on try 1).
# The pattern names Base, so it also proves the source is the set's Base row.
- scrollUntilVisible:
    element:
      text: "Build ${output.PARALLELS_N} parallels from Base"
    centerElement: true
    timeout: 7000
# The section's own heading (a different element, R6), named for its source.
- assertVisible: "Parallels of Base"

# ============================================================
# STEP 2 — BUILD, AND CONFIRM THE REPLACE (D4)
# ============================================================

- tapOn:
    text: "Build ${output.PARALLELS_N} parallels from Base"

# HARD (R2), not a branch: K >= 1 on every run (Gold Wave holds cards from
# the seed — see the header). K stays open: it is 1 on a fresh seed and
# grows on a re-run against the same preview (this flow's own parallel then
# holds cards too). The dialog's title is its header (README → "Asserting
# inside a dialog"). `Base.s`: the possessive's apostrophe is one character
# either way. One state change, no server call: 7000.
- extendedWaitUntil:
    visible: "Replace the cards on [1-9][0-9]* of ${output.PARALLELS_N} parallels with fresh copies of Base.s\\?"
    timeout: 7000
# The footer confirm. `ConfirmDialog` is a fixed full-viewport overlay with
# no scroller around its footer, so a direct tap (R8 case 2, the documented
# dialog-footer exception).
- tapOn: "Replace and build"

# ============================================================
# STEP 3 — STOP AFTER THE ONE IN FLIGHT; IT BUILT WITH CARDS
# ============================================================

# Stop is live from the run's first step and sits in the ledger's heading
# row inside the section, just under the button centred above, so this
# exits at try 0 (R8; MEASURED at y=301, try 0). The ledger's lines grow
# DOWNWARD from that row, so its height does not move Stop. A Topps Chrome
# base parallel is a live BSC fetch plus a paged SportLots fetch of ~300
# cards and two insert pages — MEASURED 5.07 s server-side — so Stop lands
# while the FIRST buildable parallel is in flight: its click landed 1.9 s
# into that build. (README NEO-312 note: never chase a transient state on a
# run that can finish first; this one cannot finish one parallel in the time
# two taps take, let alone N.)
- scrollUntilVisible:
    element:
      text: "Stop after this one"
    centerElement: true
    timeout: 7000
- tapOn: "Stop after this one"

# THE RUN STOPPED AFTER EXACTLY THE ONE IN FLIGHT — `Stop after this one`'s
# own claim. `panelHeading`'s stopped form counts BUILT lines, so `1` refuses
# both a Stop that landed before anything built (0) and a Stop that let the
# run carry on into the next parallel (2+). MEASURED `stopped after 1`
# (CI 37179999943: Convex logged exactly one `parallel_checklist_built` for
# the run). If a build ever finishes inside the two taps this reads
# `stopped after 2` and fails by name: that is a finding about the build's
# speed against Stop, not a reason to widen the count. Full match with no
# trailing `.`, so the sr-only live line (which repeats a heading WITH one)
# cannot answer.
#
# 7000 — R5's bar, with NO exception (was 90000, an unmeasured ceiling
# borrowed from setup.yaml's fetch). This waits on the rest of the build in
# flight: the live `fetchBscChecklist` + paged `fetchSportLotsChecklist`, the
# link pass and the 300-card copy. MEASURED (CI 37179999943) 5.07 s for the
# whole build, of which 2.07 s was left when this step began (Stop tapped
# 05:59:13.19, heading seen 05:59:15.26); setup.yaml's Gold Wave build of the
# same set took 4.81 s. The step starts ~3 s into the build (two taps), so
# 7000 here admits a whole build of ~10 s, twice the measurement, without
# leaving the bar — no marketplace exception, so no sign-off. A build that
# needs more is a product finding: the operator pressed Stop and is waiting
# on it. Never raise this number.
#
# `extendedWaitUntil` never scrolls, and need not: the heading is the
# panel's first row, where Stop was. When the run ends Stop unmounts under
# focus and the panel takes the focus (`ParallelBuildPanel`'s focus park);
# a 41-line panel is taller than the viewport, so that focus may scroll the
# page until the panel's top meets html's `scroll-padding-top` (80px). The
# heading is on screen either way.
- extendedWaitUntil:
    visible: "Base parallels — stopped after 1 of ${output.PARALLELS_N}"
    timeout: 7000

# THE LINE. `parallelLineText` = "<parallel> — <builtText>": "Built N cards"
# on a first build, "Rebuilt N cards" on a re-run, then only the clauses
# that are true. "Nothing copied — …", "Blocked — …", "Failed — …" and
# "Stopped" do not match, so a parallel that built nothing fails here with
# its reason on screen. Exactly one line can match (`stopped after 1`).
#
# THE COUNT STAYS OPEN, ON PURPOSE, though it is measured (300 copied, 35
# left off, the same split as setup.yaml's Gold Wave build, which pins its
# 300). Unlike the seed, this build runs mid-queue: `signed-by-autofills-
# from-players` edits Base card #300 concurrently, and a copy taken while
# that edit lands is skipped ("1 skipped — Base changed them mid-build"),
# so a pinned 300 would go red on a correct build (SET-REGISTRY.md, the
# section on this flow). `[1-9]` still refuses an empty build.
#
# SCROLLED TO FIRST. The ledger is page content (header note): the line sits
# at its own index in the type's child order, ~22px per line below the
# heading, and is not guaranteed on screen. It is BELOW the heading in DOM
# order and the heading is on screen, so DOWN (R5 direction). Nothing is
# tapped, so no centring (R8): when the line is already in view this exits
# at try 0, and each ~14 skipped (unlinked or blocked) lines ahead of it in
# the type's order cost one swipe. Its index was not measurable from the
# green run (no hierarchy dump; the old ledger scrolled itself to the line in
# flight). Then a plain read (R6: `copyTextFrom` is not an assert).
- scrollUntilVisible:
    element:
      text: ".+ — (Built|Rebuilt) [1-9][0-9]* cards?(, .+)?"
    direction: DOWN
    timeout: 7000
- copyTextFrom:
    text: ".+ — (Built|Rebuilt) [1-9][0-9]* cards?(, .+)?"
# The parallel's NB name is everything before the first " — " (a row name
# carries no em dash). Escaped once for the full-match `text:` / `id:`
# selectors below (runtime names need regex escaping); the raw form goes
# into the search box.
- evalScript: '${output.BUILT = maestro.copiedText.split(" — ")[0].trim()}'
- evalScript: '${output.BUILT_RE = output.BUILT.replace(/[\^\[\]()*+?.|]/g, function (c) { return "\\" + c; })}'

# ============================================================
# STEP 4 — THE COPY'S LISTING TITLE NAMES ITS PARALLEL
# ============================================================

# A FRESH SET BUILDER, ON PURPOSE. The built parallel's cards are in its
# row's checklist, which renders BELOW the section — and while the run is on
# screen the section holds the whole ledger, one line per parallel (~950px
# for 41; NEO-321 7543bc7 removed the 192px inner scroller). From the
# columns row, where the row is picked, to its `Attributes for …` header is
# then ~1,750px of DOWN travel: ~5 driver swipes at ~2 s each, past R5's
# 7000, and splitting it across two steps would only hide the same travel.
# The run is client-side and ends with the page (`useHostedParallelBuildRun`;
# it has stopped, so nothing is left behind and no `beforeunload` prompt is
# armed), so re-entering the set builder draws the section with its sleeve
# strip only — the layout setup.yaml's Gold Wave pick crosses to the same
# header in one swipe plus one centring swipe (3.9 s). R9: the same warm
# drill as STEP 1 (~32 s measured). It also replaces the UP scroll back to
# the columns row, whose distance the ledger's focus park (STEP 3) made
# variable.
- runFlow:
    file: util-drill-to-2024-topps-chrome.yaml
# As STEP 1.
- scrollUntilVisible:
    element:
      text: "Parallel"
    centerElement: true
    timeout: 7000
- tapOn: "Parallel"

# Open the built parallel through the Parallels column's search box (the
# column holds dozens of rows; setup.yaml's Gold Wave pick does the same).
# The column mounts on its own Convex read: the 7000 bar, as a gate, because
# a centred scroll that swipes before the column exists would move the page
# under it. Then centred for the tap (R8): the box sits at the TOP of the
# columns row, level with the `Parallel` row just tapped (MEASURED y=176 at
# try 0 after the identical steps in setup.yaml), so if it is ever off
# screen it is ABOVE — UP (R5 direction).
- extendedWaitUntil:
    visible: ".*Search parallels.*"
    timeout: 7000
- scrollUntilVisible:
    element:
      text: ".*Search parallels.*"
    direction: UP
    centerElement: true
    timeout: 7000
- tapOn:
    text: ".*Search parallels.*"
    waitToSettleTimeoutMs: 250
- inputText: ${output.BUILT}
- extendedWaitUntil:
    visible:
      text: "^${output.BUILT_RE}$"
      below:
        id: "Search parallels"
    timeout: 7000
- tapOn:
    text: "^${output.BUILT_RE}$"
    below:
      id: "Search parallels"

# The attributes panel follows the selection, below the columns, the
# section (no ledger on a fresh page) and the Multi-source panel: DOWN,
# centred, NEO-260 spacer headroom (R8 case 1) — the same step every
# attributes-panel header takes.
- scrollUntilVisible:
    element:
      text: ".*Attributes for ${output.BUILT_RE}.*"
    centerElement: true
    visibilityPercentage: 10
    waitToSettleTimeoutMs: 1000
    timeout: 7000

# THE ROW TO OPEN: the LAST one. CardChecklist's virtuoso opens at its end
# (`initialTopMostItemIndex`) and over-renders ~200px of CLIPPED rows above
# its own viewport, which Maestro reports as 100% visible and which a tap
# misses (virtualized-list phantom rows). `index: -1` is the BOTTOM-MOST
# match — `Filters.index` sorts by bounds y, then x, and counts back from
# the end (decompiled from the pinned maestro-client.jar) — so it is always a
# row inside the list's viewport, never a phantom. Every copy carries the
# same parallel name, so any real row proves the claim. DOWN, centred; the
# checklist card and the spacer below it are the headroom (R8 case 1).
# `(, .*)?`-style tails are not needed: `.+` takes the whole label.
- scrollUntilVisible:
    element:
      id: "Edit card .+"
      index: -1
    centerElement: true
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
    timeout: 7000
# Result-keyed and bounded, as in checklist-one-marketplace-skips-match-
# dialog STEP 8: tap, wait for the drawer, tap once more if the first was
# eaten by a Virtuoso re-measure. The gate is `Card title`, which only the
# drawer carries.
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          id: "Edit card .+"
          index: -1
          waitToSettleTimeoutMs: 1000
      - extendedWaitUntil:
          visible:
            id: "Card title"
          timeout: 7000

# THE CLAIM. For an `<input>` Maestro reads its VALUE, so this is the stored
# `listingTitle`. The parallel token is the third optional token after AUTO
# and RELIC (`optionalTokens`), behind a core of year + "Topps Chrome" +
# player + "#<n>", well inside the 80 cap for every Topps Chrome parallel
# name.
- assertVisible:
    id: "Card title"
    text: ".*${output.BUILT_RE}.*"

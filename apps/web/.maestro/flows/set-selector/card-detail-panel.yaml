appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Card detail drawer — every field autosaves as you leave it (no Save button)"
tags:
  - set-selector
  - regression
---
# NEO-25 drawer, re-pointed at the NEO-216 behaviour: the card detail drawer is
# a LIVE per-field editor. There is no Save button, no draft, and no discard
# bar — each field writes itself the moment the operator leaves it, and says so.
#
# THE ONE FEATURE THIS FLOW PROVES (R1):
#   Editing a field in the card detail drawer PERSISTS without any save action —
#   the operator types, moves on, and the change is already stored.
#
# WHAT THIS TESTS:
#   1. Opening the drawer via the "Edit card {n}" button (row action).
#   2. Drawer header shows "Card #{n}".
#   3. The footer states the rule ("Changes save as you leave each field.") and
#      offers "Done" — the save control it replaced is gone from the DOM.
#   4. Card name: type + Enter -> "Saved Card name".
#   5. Card title: type + Enter -> "Saved Card title".
#   6. Card description (a textarea, so Enter is a NEWLINE): type, then leave
#      the field -> "Saved Card description".
#   7. RC attribute chip: the tap itself writes -> "Saved Attributes".
#   8. Print run: type 99 + Enter -> "Saved Print run", and the row's sub-line
#      picks up "/99" once the drawer is closed.
#   9. Re-opening the drawer shows every one of those values still there —
#      nothing was ever "saved", and nothing was lost.
#  10. Print run CLEARED (NEO-217): erase it + Enter -> "Cleared Print run",
#      and "/99" is gone from the row. A blank number is a real answer ("this
#      card is not numbered"), not a no-op.
#
# WHY THERE IS NO DIRTY-GUARD SECTION ANY MORE:
#   This flow used to tap the backdrop and the x while dirty and assert an
#   inline confirm bar offering to throw the draft away. None of that exists:
#   there is nothing unsaved to discard, so closing just closes. The
#   replacement coverage is step 9 — reopening and finding the values there is
#   the same guarantee, stated positively.
#
# PER-WORKER DATA ISOLATION:
#   Drills to E2E Test Sport ${WORKER_INDEX} -> 2026 -> Topps -> cd-<WORKER_INDEX> (custom set, Insert VT,
#   "Base" insert). Each worker operates on its own custom checklist — no shared
#   state with the cascade's Baseball/2024/Topps Chrome checklist. Concurrent
#   workers never touch the same card rows.
#
# DRAWER BODY ORDER (top to bottom in scroll container):
#   1. Card name
#   2. Teams (TeamPicker)
#   3. Features editor (collapsed "Show features editor" button)
#   4. Card title  <- visible near top; no scroll needed after header
#      (NEO-101 added a "62/80" counter + "Regenerate" to its label row and an
#      over-cap alert BELOW the input — the input itself did not move, and its
#      aria-label is still "Card title".)
#   5. Card description
#   6. Attributes chips (Toggle RC / AU / RELIC / SP / SSP / NUM)  <- may need scroll
#   7. grid[ Print run | Autographed dropdown ]  (Autographed is always-visible
#      here now — promoted out of the collapsed features editor, NEO-71-74)
#   8. Card variation
#   9. Players (PlayerPicker — editable, NEO-25)
#  10. Inherited from set (read-only)
#  11. Images / "No image yet" placeholder
#   + FOOTER (pinned, outside the scroll container): the "Changes save as you
#     leave each field." note and the "Done editing card" button.
#
# COMMIT MECHANICS (NEO-216) — how a flow makes a field write itself:
#   - single-line inputs (Card name, Card title, Print run, Card variation)
#     commit on Enter IN PLACE. The drawer stays open; a toast confirms.
#   - Card description is a <textarea>: Enter types a newline. It commits when
#     the operator LEAVES it, so the flow taps another element to blur it.
#   - chips and pickers write on the tap itself — no key, no blur.
#   - one toast region serves the whole drawer, so assert each toast BEFORE
#     making the next edit; the next write replaces the message.

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# DRILL TO PER-WORKER CUSTOM SET + ADD A CUSTOM CARD
# E2E Test Sport ${WORKER_INDEX} → 2026 → Topps → cd-<WORKER_INDEX> → Insert → "Base" (custom insert)
# util-add-custom-card.yaml calls util-drill-to-custom-set, adds the "Base" insert
# entry (idempotent), opens the CardChecklist, adds card 888-${ATTEMPT_ID}, and
# returns with the "Edit card 888-${ATTEMPT_ID}" button scrolled into view.
# ============================================================

- runFlow:
    file: util-add-custom-card.yaml
    env:
      SET_NAME: "cd-${WORKER_INDEX || 0}"
      VARIANT_TYPE: "Insert"
      INSERT_NAME: "Base"
      CARD_NUMBER: "888-${ATTEMPT_ID}"
      PLAYER_NAME: "Detail Panel Test ${ATTEMPT_ID}"

# ============================================================
# OPEN THE DRAWER
# ============================================================

# waitToSettleTimeoutMs mitigates the virtualisation race — parallel workers'
# add/delete mutations refetch the per-worker cardChecklist live query, shifting
# row y-coords between Maestro's lookup and tap dispatch.
- tapOn:
    id: "Edit card 888-${ATTEMPT_ID}"
    waitToSettleTimeoutMs: 2000

# The drawer opens. The header shows "Card #888-<ATTEMPT_ID}".
# Card name input appears with autofocus.
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 15000

# Assert the new drawer title (NEO-25 delta 3: was "Edit card #", now "Card #").
- assertVisible:
    text: ".*Card #888-${ATTEMPT_ID}.*"

# ============================================================
# THE FOOTER STATES THE RULE — and there is no Save button.
# This is the NEO-216 delta in one assertion pair: the drawer tells the
# operator that leaving a field saves it, and offers only "Done".
# ============================================================

- assertVisible: "Changes save as you leave each field."
- assertVisible:
    id: "Done editing card"

# ============================================================
# EDIT 1 — Card name. Enter commits IN PLACE (the drawer stays open).
# The toast is the product's own confirmation that the write landed.
# ============================================================

- tapOn:
    id: "Card name"
# eraseText: 60 clears the original card name. Maestro web taps place the
# cursor one position before the end of a React input, so one trailing
# character may remain after eraseText. Harmless here — the assertions below
# match the typed prefix as a substring.
- eraseText: 60
- inputText: "Renamed Detail Player ${ATTEMPT_ID}"
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*Saved Card name.*"
    timeout: 7000

# ============================================================
# EDIT 2 — Card title (listingTitle), position 4 in the drawer body.
# These fields are directly below the (collapsed) features editor. The header +
# Card name + Teams + features button consume roughly 220px; Card title starts
# at ~220px from the top of the scroll area, well above the 629px fold. No
# scroll required. We interact with these BEFORE scrolling down to the
# attribute chips so we never have to scroll back UP to reach them.
#
# NEO-24/NEO-25 AUTO-TITLE: Card title and description are NOT empty on a
# freshly-created card — generateListingTitle/Description (addCustomCard) now
# pre-fill both (e.g. title "2026 Topps cd-0 #888-…"). A Maestro-web tap on a
# pre-filled input drops the caret roughly at the clicked character (mid-string),
# so inputText INSERTS our marker contiguously into the existing value rather
# than appending to an empty field — the final value is a concatenation. We type
# a unique, contiguous marker and assert it as a SUBSTRING (regex-contains) on
# reopen, which still proves listingTitle editing round-trips to the DB (R2)
# without depending on a clean-slate exact match we can no longer produce (there
# is no reliable full-clear of a mid-caret pre-filled input in maestro-web).
#
# NEO-101 — WHY THE MARKER IS SHORT ("T${ATTEMPT_ID}", ~12 chars):
# listingTitle has a HARD 80-character cap. Over it the COMMIT is refused (the
# field keeps the text and shows "Shorten it before saving." beside it — see
# checklist-title-length-limits-and-fixer.yaml, which owns that behaviour), so a
# marker long enough to push the concatenated value past 80 would fail this flow
# on the toast wait below, for a reason that reads like a product bug.
#
# THE ARITHMETIC, recomputed against the fill-toward-80 generator by running
# `assessListingTitle` on this flow's exact fixture:
#
#   "2026 Topps cd-0 #888-<attempt> E2E Test Sport 0"     45–49 chars
#   + the marker "T<attempt>"                             8–12 chars
#   ─────────────────────────────────────────────────────────────────
#                                                         ≤ 61 / 80
#
# PLAYER_NAME IS NOT IN THE TITLE, and that is the part worth knowing before
# doing this sum by eye. `util-add-custom-card` types PLAYER_NAME into the
# **Card name** field (whose placeholder happens to read "Player name"); the
# generator's `playerNames` come from the SEPARATE "Players" field, which the
# util leaves empty, so they arrive as `pendingPlayerNames: []`. The card's
# display name never reaches the title. What the title DOES now carry, since
# titles fill toward 80, is the sport ancestor's value — "E2E Test Sport N",
# 16 characters of it — appended as the last filler token. That is already in
# the numbers above.
#
# So there are ~19 characters of headroom, not the 6 an eyeball estimate
# suggests. The marker's only job is to be UNIQUE per attempt: keep it short,
# and re-run the sum (not a guess) if the fixture, the set name, or the sport
# name ever grows.
# ============================================================

- assertVisible:
    id: "Card title"
- tapOn:
    id: "Card title"
- inputText: "T${ATTEMPT_ID}"
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*Saved Card title.*"
    timeout: 7000

# ============================================================
# EDIT 3 — Card description. This one is a <textarea>, so Enter types a
# NEWLINE rather than saving (a bare Enter belongs to the operator writing a
# paragraph). It commits when the operator LEAVES the field, so the flow taps
# the Card name input above it — a harmless parking spot that only moves the
# caret — and waits for the description's own confirmation.
# ============================================================

- assertVisible:
    id: "Card description"
- tapOn:
    id: "Card description"
- inputText: "NEO-25 description body for ${ATTEMPT_ID}"
- tapOn:
    id: "Card name"
- extendedWaitUntil:
    visible: ".*Saved Card description.*"
    timeout: 7000

# ============================================================
# EDIT 4 — the RC attribute chip writes on the TAP itself (no key, no blur).
# The chip starts inactive (a new custom card has no attributes).
# Attributes are at position 6 (below Card title/description) — scroll
# down to bring the row into view before tapping.
# ============================================================

- scrollUntilVisible:
    element:
      id: "Toggle RC"
    centerElement: true
    visibilityPercentage: 50
    timeout: 10000
- tapOn:
    id: "Toggle RC"
- extendedWaitUntil:
    visible: ".*Saved Attributes.*"
    timeout: 7000

# ============================================================
# EDIT 5 — Print run (NEO-217). A number commits on Enter like any other
# single-line field. The row's sub-line renders "/99" for it, which is what
# the close below verifies.
# ============================================================

# NO scrollUntilVisible here, deliberately. The drawer is right-anchored
# (x>=544 at 1024), so scrollUntilVisible's viewport-centre swipe drives the
# BACKDROP, not the drawer's own scroll container — it can only ever be a
# no-op on this panel. Print run is the row directly beneath the attribute
# chips that were just brought into view, so it is in the same fold; if the
# drawer's field order ever grows enough to push it out, the fix is the
# pin-then-correct swipe pair documented in
# checklist-title-length-limits-and-fixer.yaml, not a longer timeout.
- extendedWaitUntil:
    visible:
      id: "Print run"
    timeout: 7000
- tapOn:
    id: "Print run"
- inputText: "99"
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*Saved Print run.*"
    timeout: 7000

# ============================================================
# CLOSE — "Done" just closes. Nothing is pending; everything above is stored.
#
# The footer sits OUTSIDE the drawer's scroll container (a flex-col panel with
# a pinned footer), so it is always on screen. scrollUntilVisible cannot
# satisfy centering on it and would time out even while it is plainly visible —
# so this is the R8 exception: assert + tap, no scroll.
# ============================================================

- tapOn:
    id: "Done editing card"
- assertNotVisible:
    id: "Card name"

# The row behind the drawer now carries the print run in its sub-line. On this
# per-worker custom card the sub-line has no teams, no variation and no
# autograph, so "/99" is the whole line.
- scrollUntilVisible:
    element:
      text: ".*/99.*"
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
    timeout: 10000

# ============================================================
# VERIFY PERSISTENCE — reopen and confirm saved values
# ============================================================

# The renamed card (888-*) still sorts to the bottom of the virtualized list.
# Scroll into view before tapping its Edit button.
- scrollUntilVisible:
    element:
      id: "Edit card 888-${ATTEMPT_ID}"
    # No centerElement: the new card sorts to the BOTTOM of the virtualized
    # list, and centering a bottom element can't be satisfied locally (the list
    # can't scroll further to center it) — it loops until timeout. Scrolling
    # until the row is 50% visible is enough to tap it. waitToSettleTimeoutMs
    # lets Virtuoso render the row after each scroll step.
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
    timeout: 10000
- tapOn:
    id: "Edit card 888-${ATTEMPT_ID}"
    waitToSettleTimeoutMs: 2000

# Drawer reopens — wait for Card name input.
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 15000

# The card name input should reflect the saved name (Renamed Detail Player ...).
# Use a ".*" suffix regex because Maestro web's eraseText leaves the last
# character of the original value when the cursor is placed at the penultimate
# position (known Maestro web cursor behavior). The prefix is unique enough to
# verify the rename persisted — the full title and description are verified
# below with exact full-string matches (those fields were appended to empty).
- assertVisible:
    text: ".*Renamed Detail Player ${ATTEMPT_ID}.*"

# Card title is at position 4 in the drawer body — near the top, above the
# attribute chips. Assert it without scrolling (it's visible from mount). The
# value is the auto-generated title with our typed marker inserted contiguously,
# so we match the marker as a SUBSTRING of the Card title input's value (a
# <input>'s node text = its value). This fails loudly (R2) if the listingTitle
# edit did NOT persist — the marker would be absent on reopen.
- assertVisible:
    id: "Card title"
    text: ".*T${ATTEMPT_ID}.*"

# Card description is position 5, immediately below the title — also above the
# fold on reopen. It was committed by a BLUR rather than by Enter, so this is
# the assertion that the blur path writes too.
- assertVisible:
    id: "Card description"
    text: ".*NEO-25 description body for ${ATTEMPT_ID}.*"

# The RC chip should be active (aria-pressed="true"). Attributes are at
# position 6 — below Card title — so scroll down to bring the row into view.
- scrollUntilVisible:
    element:
      id: "Toggle RC"
    centerElement: true
    visibilityPercentage: 50
    timeout: 10000
# Assert RC chip is present in the drawer. The visual state (green fill vs
# outline) confirms the toggle is ON, but Maestro web cannot read aria-pressed
# state reliably (checked: true times out — same CDP bridge limitation as
# checked: false, confirmed at validation). Presence + the fact that we toggled
# it in the first session is sufficient evidence; the real persistence assertion
# is that the save + reopen cycle did NOT reset the chip back to unchecked.
- assertVisible:
    id: "Toggle RC"

# ============================================================
# PRINT RUN PERSISTED — and can be CLEARED again (NEO-217)
#
# The number survived the close with no save action, and blanking the field is
# a real answer rather than a no-op: the commit sends `null`, the server drops
# the field, and the confirmation says "Cleared", never "Saved".
# ============================================================

# Same fold as the attribute chips just scrolled to — see the note on the first
# session for why scrollUntilVisible cannot drive this drawer's inner scroll.
- extendedWaitUntil:
    visible:
      id: "Print run"
      text: "99"
    timeout: 7000

- tapOn:
    id: "Print run"
- eraseText: 10
# Prove the field really is EMPTY before committing. An <input> with no value
# reads back its placeholder, so "e.g. 99" IS the empty state — and if a stray
# character survived the erase this fails here, saying so, instead of silently
# committing a different number and failing later on the toast.
- assertVisible:
    id: "Print run"
    text: "e.g. 99"
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*Cleared Print run.*"
    timeout: 7000

# ============================================================
# CLOSE via "Done" — the only close control the drawer has now.
# It sits in the pinned footer OUTSIDE the scroll container, so it is always on
# screen; scrollUntilVisible cannot satisfy centering on it (R8 exception).
# ============================================================

- assertVisible:
    id: "Done editing card"
- tapOn:
    id: "Done editing card"
- assertNotVisible:
    id: "Card name"

# Bring the row back into view before reading it — closing the drawer can leave
# Virtuoso showing a different window of the list, and a row that is merely
# absent from the DOM would make the negative below pass for the wrong reason.
# R6: this scroll IS the positive assertion; nothing repeats it.
- scrollUntilVisible:
    element:
      text: ".*Renamed Detail Player ${ATTEMPT_ID}.*"
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
    timeout: 10000

# THE POINT: the row's sub-line lost its "/99". The clear reached the stored
# row, not just the input it was typed into.
- assertNotVisible: ".*/99.*"

# ============================================================
# CLEANUP — delete this attempt's test card
# ============================================================

- scrollUntilVisible:
    element:
      id: "Delete card 888-${ATTEMPT_ID}"
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
    timeout: 10000
- tapOn:
    id: "Delete card 888-${ATTEMPT_ID}"
- assertVisible: "Confirm?"
- tapOn:
    id: "Confirm delete card 888-${ATTEMPT_ID}"
- assertNotVisible: "Renamed Detail Player ${ATTEMPT_ID}"

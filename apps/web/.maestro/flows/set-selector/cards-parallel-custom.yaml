appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Add custom Parallel — a hand-added parallel appears in the Parallels column and is selectable"
tags:
  - set-selector
---
# PRODUCT-FEATURE test: a user can ADD A CUSTOM PARALLEL under a set's Parallel
# variant type, and the new entry shows up as a selectable row in the column.
#
# This is the ONLY flow that exercises adding a parallel via the "Add custom
# Parallels" column. (Adding a custom INSERT is covered by
# variant-metadata-editor-insert; NESTING parallels under an insert is covered
# by move-parallels-of-inserts-custom.)
#
# It asserts the ADD outcome — deliberately NOT "Fetch from Marketplaces". That
# button is an IMPORT (pull the checklist from BSC/SportLots); a parallel you
# invented by hand sits under ancestors that carry no marketplace ids, so
# neither marketplace side is resolvable and neither is fetched — it imports 0
# cards. That is exercised elsewhere and is not this flow's concern. Putting
# cards INTO a hand-made variant is the separate "Add Card" path
# (custom-card-crud.yaml).
#
# Fully hand-made subtree (E2E Test Sport ${WORKER_INDEX} → 2026 → Topps →
# a hand-added set): no ancestor carries a BSC or SportLots id, so neither
# side is resolvable at any level and no live marketplace call is made — every
# column goes idle immediately. Every wait below is the 7s default; the util
# owns the cold hand-made drill and its sync-tolerant waits.

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# Drill to a per-flow custom set and land on its Parallels column (idle, with
# the "Add custom Parallels" button scrolled into view).
- runFlow:
    file: util-drill-to-custom-set.yaml
    env:
      SET_NAME: "parallel-feature-${WORKER_INDEX || 0}"
      VARIANT_TYPE: "Parallel"

# ── ADD A CUSTOM PARALLEL "Prizm Gold" ──────────────────────────────────────
- scrollUntilVisible:
    element:
      id: "Add custom Parallels"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Add custom Parallels"
- assertVisible: "Add Custom Entry"
- inputText: "Prizm Gold"
- pressKey: Enter
# NEO-272: press the confirm's Create button by name. The second blind
# `pressKey: Enter` that used to stand here was the defect: maestro-web
# re-finds the focused element by an XPath built from its CLASS LIST, so it
# raced the confirm unmounting the input (CI 34592010317 attempt 2 died here
# with "no such element" on the input's own class string). The button's
# accessible name is EntityColumn.tsx's `confirmCreateLabel` —
# "Create " + LEVEL_SINGULAR[level] lower-cased.
#
# CONDITIONAL because a confirm is only ONE of two outcomes. If the typed
# value already exists in THIS column, `handleCustomSubmit` short-circuits
# (`items.find(...)` -> `onSelectExisting`), closing the form and advancing
# the cascade with no confirm ever rendered. A `notVisible: <value>` guard
# cannot rule that out — the column's max-h-[400px] scroller clips rows
# that really are there (team-picker, local run 2026-09-11). MEASURED locally 2026-09-11: the confirm is up in 0.34-0.38s, so
# a `when:` that finds it costs nothing; a miss pays the ~7s condition poll
# and only on the already-existed path. The hard result gate is the
# "Add Custom Entry" check below — the form is gone either way, so this
# branch cannot fall through silently (R2).
- runFlow:
    when:
      visible:
        id: "Create insert"
    commands:
      - tapOn:
          id: "Create insert"
- assertNotVisible: "Add Custom Entry"

# ── FEATURE ASSERTION: the new parallel appears in the column ───────────────
# The entry renders at the Parallels column top (visible without scrolling).
#
# NEO-239 removed the "Custom" badge: a row either carries marketplace ids or
# it does not, and both kinds render identically. The BSC/SL pills are now the
# only provenance a row shows, and a hand-added parallel has neither — so the
# fact to assert here is simply that the value is in the column.
- assertVisible: ".*Prizm Gold.*"

# ── …and it is a real, selectable entry: tapping it opens its CardChecklist ──
# The CardChecklist panel renders BELOW the columns (off-fold on 1024×629), so
# scroll it into view. The page is settled by now (the entry assert above
# already passed without scrolling), so this scroll is clear of the fresh-render
# CDP scroll bug that bit the drill. Centred, because the next step taps it (R8).
- scrollUntilVisible:
    element:
      text: ".*Prizm Gold.*"
    centerElement: true
    timeout: 7000
- tapOn: ".*Prizm Gold.*"

# R8 EXCEPTION — deliberately NOT centred. "Fetch from Marketplaces" is the last
# thing on the page: with the checklist open there is only ~100px of document
# below it, so at maximum scroll it sits at y≈500 and centring it at y≈315 is
# unreachable. `centerElement` then swipes until it times out and reports the
# element as missing while it is plainly in view — measured on the NEO-239 PR
# preview at bounds [333,497][521,529] with the page already scrolled to its
# limit (root y0 = -694). Nothing is tapped here; the scroll only has to bring
# the checklist into view for the assert below, so plain visibility is both
# sufficient and the only thing that can settle.
#
# What made this newly reachable: NEO-239 dropped MultiSourcePanel's
# "hide the panel for a row with no marketplace ids" branch, so a hand-made
# variant now renders the whole "Multi-source sets / Attach more… / BSC /
# SportLots" block above its checklist. Any flow that centre-scrolls to
# something at the bottom of a hand-made variant's checklist can hit this.
#
# R5 — 7000, the bar (was 10000). MEASURED (CI 34349299679 + 34361627641):
# 4.73s worst, 0 centring swipes — a slow single hierarchy read on this
# page, never a give-up. 7000 is the ceiling; the slow read itself is the
# product finding to raise, not something to settle with a bigger number.
- scrollUntilVisible:
    element:
      text: ".*Fetch from Marketplaces.*|Refresh"
    timeout: 7000
- assertVisible: "No cards in this checklist yet."

appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Checklist attention — a card with no team is badged and counted in the header's need-you pill; a card born linked is neither"
tags:
  - set-selector
---
# ════════════════════════════════════════════════════════════════════════════
# R1 — ONE feature (NEO-102, NEO-335): a stored checklist card that carries NO
# team is surfaced to the operator — an amber "needs attention" mark on its own
# row, and the checklist header's amber "N need you" pill ("1 needs you" for
# one) counting how many rows are in that state and opening the walker on
# exactly those rows.
#
# NEO-335 retired the filter chip ("N need attention" / "Show only cards
# needing attention") together with the "Fix them one at a time" link and the
# set-wide Fill teams control: the pill is the one control. What the filter
# used to prove — WHICH rows are flagged, not just how many — is now proved by
# the walker the pill opens: its queue is derived from the same rule, it opens
# on the lowest-numbered flagged card, and its counter is the queue's length.
#
# WHAT THIS PROVES
#   `deriveCardAttention` (convex/features/cardAttention.ts) is a pure rule the
#   browser runs on every getCardChecklist row: flag it when `teamOnCardIds` is
#   empty, no operator has confirmed "no team", and the card is not still
#   waiting on the automatic BSC team lookup. This flow builds that state by
#   hand — two custom cards with no team, and (NEO-208) a third added WITH a
#   team picked on the way in — then proves all three surfaces move together:
#     • the two teamless rows badged, the born-linked row NOT badged, showing
#       the team it was given and (drawer) the player it was given; the pill
#       reads "2 need you";
#     • give ONE of the teamless two a real team through the card drawer's
#       TeamPicker;
#     • that row's badge disappears, the pill drops to "1 needs you", the
#       other row keeps its badge;
#     • the pill opens the walker on that one card and no other ("1 card needs
#       attention · 0 fixed", "Skip card 701-… for now").
#   The count is asserted as an EXACT number, so a rule that over- or
#   under-flags fails here rather than reading as "some badge exists" (R2).
#
#   NEO-208 is inside this one feature rather than beside it: the rule's input
#   is the LINK, and there are exactly two ways a card gets one — born with it
#   (the quick-add form's TeamPicker, card 3) or given one later (the drawer's,
#   card #702). This flow now covers both, and the exact "2 need you" count is
#   what proves the born-linked card was never counted. A separate flow would
#   have had to rebuild this whole set and checklist to assert a number this
#   one already asserts (R3).
#
#   Card 3 is also born linked to a PLAYER, created in the quick-add form's
#   PlayerPicker ("Create player CNAP<token>") and read back from the card's
#   drawer. That is the NEO-221 half of the same rule — a card that links its
#   player raises no "unreviewed name" — and it is the quick-add create path's
#   only E2E proof since NEO-335 retired set-fill-teams-from-teammate-card,
#   which used to carry it. (Picking an EXISTING player in the quick-add form
#   is admin/player-sports-multi-sport-membership's and
#   card-player-picker-cross-sport's; the drawer's create path is
#   player-picker-create-custom-card's.)
#
# WHAT THIS DELIBERATELY DOES NOT COVER (see the sibling flow / unit tests)
#   • The walker and its missing-team fixer — that is
#     `checklist-attention-walker-missing-team.yaml`.
#   • Clause 3 of the rule ("a BSC-linked card is not badged until
#     teamCheckDoneAt lands"). No E2E flow can reach it: a BSC-linked card
#     only exists on a REAL marketplace set, which is read-only (R7a), and a
#     per-worker hand-made subtree carries no marketplace ids, so neither side
#     is fetched (NEO-239) and its cards never carry a BSC ref. The clause
#     is unit-covered in convex/features/cardAttention.test.ts. The same wall
#     is documented at length in checklist-bsc-team-enrichment.yaml's header.
#
# R7a / DATA ISOLATION — writes go to a PER-WORKER, PER-ATTEMPT CUSTOM SET
#   `cna-${WORKER_INDEX}-${ATTEMPT_ID}` under the REAL Baseball / 2024 / Topps
#   ancestors (registered in .maestro/SET-REGISTRY.md). Two reasons for that
#   exact shape:
#     • The real Sport ancestor keeps sport="baseball", which is the sport row
#       TeamPicker scopes its list by and TAGS a team it creates with — and no
#       sport row means no "+ New team" row at all (NEO-96). This flow creates
#       both of the teams it uses (NEO-214 removed the global seeded fixture),
#       named CNAA<token>/CNAB<token> so eight runners and a retry cannot
#       collide, and so the create row is offered rather than an "Add" row.
#     • A custom Set node makes the subtree custom, so no BSC/SL call fires and
#       nothing shared is read or written.
#   The set name carries ATTEMPT_ID because this flow asserts an EXACT
#   attention COUNT: a fresh, empty checklist is the only way that number can
#   be known. A reused set would inherit a failed attempt's leftover rows and
#   the count assertion would be a coin flip.
#
# HOW FAR THIS RUNS LOCALLY (NEO-208)
#   Local E2E drives this branch's Vite bundle against SHARED DEV, which tracks
#   main, and main's `addCustomCard` has no `teamOnCardIds` argument yet. Card 3
#   therefore gets as far as the picker — the form, "+ Add team", the popover,
#   the "+ New team" row, the dialog it opens, the chip, the popover closing —
#   and its
#   Submit is then refused by Convex's argument validator, so no card is created
#   and nothing after it can run. Cards #701/#702 and the whole badge / count /
#   filter half are verified locally against a backend WITHOUT card 3; the
#   born-linked assertions need the PR's own Convex preview.
# ════════════════════════════════════════════════════════════════════════════

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ── The minted name's single search token (SET-REGISTRY.md, "A name typed into
# a team picker must be a SINGLE search token") ──────────────────────────────
# `teams.search` / `players.search` are Convex SEARCH indexes: they match on
# TOKENS split at non-alphanumerics, so a hyphenated `Prefix-<attempt>` name
# tokenizes to ["Prefix", "<attempt>"] and every row any flow ever left behind
# under that prefix comes back as a suggestion — the per-attempt suffix buys
# nothing. Nothing deletes a team (the app has no delete-team affordance; the
# picker's "Remove team" only unlinks it from the card), so those rows stand for
# the whole run and are visible to every concurrent worker. The names below are
# therefore ONE alphanumeric token with no separator at all.
#
# The token is ATTEMPT_ID with its hyphens stripped: "w3-a1-23945" is three
# search terms, "w3a123945" is one — and it still carries the worker index, so
# the per-worker distinction the old `${WORKER_INDEX}` prefix gave is folded in
# rather than separated out.
#
# ⚠️ READ `ATTEMPT_ID`, NOT `output.ATTEMPT_ID`. The runner injects it with
# `-e ATTEMPT_ID=…`, which Maestro exposes as the binding `${ATTEMPT_ID}`; it
# never populates `output.ATTEMPT_ID`, so the older idiom always fell through to
# its 4-digit `Date.now()` fallback and two runners collided constantly.
#
# Single-quoted: the expression contains double quotes, and quoting the scalar
# keeps YAML out of it. `Date.now()` is the standalone-run fallback.
- evalScript: '${output.ATTEMPT_TOKEN = String(ATTEMPT_ID || Date.now()).split("-").join("")}'

# ════════════════════════════════════════════════════════════════════════════
# DRILL to this attempt's private custom set (R9 — the drill util owns this).
# Baseball → 2024 → Topps → cna-<worker>-<attempt> → Insert → Base.
# Returns with the CardChecklist open and "Open add card form" in viewport.
# ════════════════════════════════════════════════════════════════════════════

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "cna-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
      VARIANT_TYPE: "Insert"
      VARIANT: "Base"

# ════════════════════════════════════════════════════════════════════════════
# CARD 1 — #701, added with NO team.
#
# The add-card form's "Team (optional)" field is left empty on purpose, and
# since NEO-208 that is the ONLY way to get a teamless card out of this form:
# the field is a TeamPicker whose picked teams are written as real
# `teamOnCardIds` at creation, so a card added WITH one is born linked and is
# not badged. (Card 3 below is exactly that card, and proves it.) Before
# NEO-208 the field was free text that landed in `pendingTeamNames` and never
# produced a link — filling it then would not have changed this card's badge,
# which is what the comment here used to say. It would now.
# ════════════════════════════════════════════════════════════════════════════

- tapOn:
    id: "Open add card form"
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 15000

# The card-number input is autofocused — type straight into it.
- inputText: "701-${ATTEMPT_ID}"
- tapOn: "Player name"
- inputText: "Attn Alpha ${ATTEMPT_ID}"

# Submit sits at the bottom of the add-card form; centerElement drives it to
# mid-viewport so Maestro's own scroll-before-tap has content to scroll to
# (without it the CDP scroll returns nothing and the tap crashes with
# "null cannot be cast to non-null type kotlin.Int").
- scrollUntilVisible:
    element:
      id: "Submit new card"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Submit new card"

# Virtuoso only renders rows near the current scroll position, so the new row
# is not in the DOM yet — scroll to materialise it rather than waiting on its
# text. centerElement matches the component's own scrollToIndex({align:
# "center"}) so the two scroll authorities agree and the row's bounds are
# stable when read.
- scrollUntilVisible:
    element:
      id: "Edit card 701-${ATTEMPT_ID}(, .*)?"
    centerElement: true
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
    timeout: 7000

# ════════════════════════════════════════════════════════════════════════════
# CARD 2 — #702, also with no team.
# Added inline rather than through util-add-custom-card: that util's first act
# is a full re-drill of all six EntitySelector levels, and we are already
# standing on the checklist those levels lead to (the same reasoning, and the
# same measured cost, as variation-link-group-and-unlink.yaml).
# direction: UP — the add-card button sits ABOVE the checklist and the scroll
# above left the list scrolled DOWN to #701's row.
# ════════════════════════════════════════════════════════════════════════════

- scrollUntilVisible:
    element:
      id: "Open add card form"
    direction: UP
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000
- tapOn:
    id: "Open add card form"
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 7000
- inputText: "702-${ATTEMPT_ID}"
- tapOn: "Player name"
- inputText: "Attn Bravo ${ATTEMPT_ID}"
- scrollUntilVisible:
    element:
      id: "Submit new card"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Submit new card"
- scrollUntilVisible:
    element:
      id: "Edit card 702-${ATTEMPT_ID}(, .*)?"
    centerElement: true
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
    timeout: 7000

# ════════════════════════════════════════════════════════════════════════════
# CARD 3 — #703, added WITH a player and a team picked on the way in (NEO-208,
# NEO-220).
#
# This is the born-linked case. The quick-add form's Team field is the same
# TeamPicker the card drawer uses, and its picked ids go to `addCustomCard` as
# `teamOnCardIds`, so the card is LINKED from the moment it exists; its Players
# field is the PlayerPicker, whose picks go as `playerIds`. Three things
# follow, and all are asserted below: the row shows the team, the row is NOT
# badged, and the card's drawer shows the player.
#
# TEAM "CNAB", not "CNAA", and that choice is load-bearing. #702 is given CNAA
# further down, so naming that one here would stop being specific to a single row
# the moment it happens; CNAB is this card's alone for the whole flow, which
# makes the team text below a single-row assertion without needing a relational
# matcher (Maestro's `below:` compares top edges only — see the driver notes —
# and is not trustworthy inside a virtualized list). Both teams are created by
# this flow, in this picker, under the real Baseball sport row — which is why it
# drills the real Baseball ancestor (see the isolation note at the top).
#
# direction: UP — the add-card button sits ABOVE the checklist and the scroll
# above left the list scrolled DOWN to #702's row.
# ════════════════════════════════════════════════════════════════════════════

- scrollUntilVisible:
    element:
      id: "Open add card form"
    direction: UP
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000
- tapOn:
    id: "Open add card form"
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 7000
- inputText: "703-${ATTEMPT_ID}"
- tapOn: "Player name"
- inputText: "Attn Charlie ${ATTEMPT_ID}"

# THE QUICK-ADD PLAYER PICKER (NEO-220). Its four container names are the
# quick-add form's own (QUICK_ADD_PLAYER_LABELS, CardChecklist.tsx), reworded so
# they share no substring with the drawer's "Add player" / "Search players".
# The option rows keep the component's names: "Create player <typed>" for a name
# no player in this sport carries, "Add <name>" for one that does
# (PlayerPicker.tsx). The name is this attempt's single search token (README),
# so the create row is the only answer and it names exactly what it creates.
#
# SCROLL FIRST (R8) — the same fold trap as the Team row below: the form opens
# with its Players row at y≈595 and everything under it off screen. Centred,
# the Card name input is two rows above and the popover that opens BELOW the
# trigger has room. The scroll is the assertion the picker rendered (R6).
- scrollUntilVisible:
    element:
      id: "Add a player to the new card"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Add a player to the new card"
- assertVisible:
    id: "Find a player for the new card"
- tapOn:
    id: "Find a player for the new card"
- inputText: "CNAP${output.ATTEMPT_TOKEN}"
- assertVisible:
    id: "Create player CNAP${output.ATTEMPT_TOKEN}"
# Choosing it runs players.findOrCreate and chips the new row in one gesture.
- tapOn:
    id: "Create player CNAP${output.ATTEMPT_TOKEN}"
- extendedWaitUntil:
    visible:
      id: "Remove player CNAP${output.ATTEMPT_TOKEN}"
    timeout: 7000

# Close the player popover BEFORE reaching for the Team row: it hangs under its
# trigger at w-64 and is drawn over the Team picker. A pointerdown anywhere
# outside the picker closes it; the Card name input is in the form and outside
# the picker (focusing a field commits nothing). Escape is not a web keycode.
- tapOn:
    id: "Card name"
- extendedWaitUntil:
    notVisible:
      id: "Find a player for the new card"
    timeout: 7000

# The picker, driven by the same four handles as the drawer's (team-picker.yaml
# owns the component's own behaviour; this is the quick-add form's use of it).
# The name typed here belongs to no team yet, so the popover answers with its
# "+ New team" row and the dialog it opens — which is what creates the team and
# chips it. The name is
# per-worker and per-attempt: the candidate pool is every Baseball team and other
# flows create rows in it mid-run, so a name that could be shared would be a
# race in two directions at once.
#
# SCROLL FIRST (R8), and this is not optional. On the 1024×629 CI viewport the
# add-card form opens with its lower half below the fold — measured: the Players
# input sits at y≈595, which puts the Team picker and the Add/Cancel row off
# screen entirely. Maestro reads an off-screen element as ABSENT, so an
# unscrolled `tapOn: "Add team"` fails with "Element not found: Id matching
# regex: Add team" and looks exactly like a picker that never rendered. (That is
# also why the two cards above scroll to "Submit new card" before tapping it.)
# centerElement lands the trigger near y≈315, which leaves the Card name input
# two rows above it and the Add/Cancel row just below — every handle this block
# needs is then in one viewport, so nothing here scrolls again.
# R6 — the scroll IS the assertion that the picker rendered; no assertVisible
# repeats it.
- scrollUntilVisible:
    element:
      id: "Add team"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Add team"
- assertVisible:
    id: "Search teams"
- tapOn:
    id: "Search teams"
- inputText: "CNAB${output.ATTEMPT_TOKEN}"
# Offered only for a name no team in this sport already carries, and labelled
# with the name it would create, so this cannot land on another team. NEO-236 —
# the row OPENS the New Team dialog; the dialog is what writes.
- tapOn:
    id: "New team CNAB${output.ATTEMPT_TOKEN}"

# The New Team dialog — portalled to `document.body` at `z-[60]`, `fixed inset-0`
# and centred, so nothing clips it. It is where the three questions a team row
# needs (Location, Team name, League) are answered and where the write happens.
#
# TWO assertions, because they say two different things.
#
# The HEADING is the dialog's `aria-labelledby` target, so it is what a screen
# reader announces on arrival — "New team: <what I typed>" is the dialog being
# correctly LABELLED. (It briefly was not: opening by CLICK used to blank the
# name, because the picker's focus-out handler read a stale "is the dialog open"
# flag and cleared the query behind the portal. Fixed under NEO-236 with a
# synchronous ref; this assertion is what keeps it fixed.)
#
# The NAME BOX and its VALUE is the dialog being correctly SEEDED — maestro-web
# reports an input by its value, so this says the search text really reached the
# field the operator is about to submit.
- assertVisible: "New team: CNAB${output.ATTEMPT_TOKEN}"
- assertVisible:
    id: "New team name"
    text: "CNAB${output.ATTEMPT_TOKEN}"

# THE WRITE. Nothing is typed in the dialog: Team name is pre-filled with what
# was searched, Location stays blank and no League is picked, so the COMPOSED
# name is exactly what was typed and every later matcher is unchanged.
#
# `Create team <composed full name>` is the same accessible name this flow always
# used — it moved from the popover row onto the dialog's own button. Tapped by id
# rather than driven with a second Enter: Create and Cancel are NeonButtons with
# an identical class string, and maestro-web's pressKey re-finds the focused
# element by an XPath that falls back to that class, so an Enter aimed at Create
# could land on Cancel.
- tapOn:
    id: "Create team CNAB${output.ATTEMPT_TOKEN}"
# The chip is the proof the pick landed. Unlike the drawer's picker this one is
# not a draft — its value goes straight into `addCustomCard` on Submit.
- assertVisible:
    id: "Remove team CNAB${output.ATTEMPT_TOKEN}"

# Close the popover BEFORE reaching for Submit. It is `absolute top-full`, and
# in this form the picker sits directly above the Add/Cancel row, so an open
# popover covers "Submit new card". A pointerdown anywhere outside the picker
# closes it; the Card name input above is in the form and outside the picker.
# Escape is deliberately NOT used — it is the drawer's "close" and the walker's
# "defer this card", and this flow should not depend on which handler happens to
# see it. (It is also not a web keycode Maestro can send.)
- tapOn:
    id: "Card name"
- extendedWaitUntil:
    notVisible:
      id: "Search teams"
    timeout: 7000

- scrollUntilVisible:
    element:
      id: "Submit new card"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Submit new card"

# Materialise the new row, centred, so the two assertions that follow are read
# against a row that is really on screen.
- scrollUntilVisible:
    element:
      id: "Edit card 703-${ATTEMPT_ID}(, .*)?"
    centerElement: true
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
    timeout: 7000

# THE TEAM IS ON THE ROW. The sub-line is one text node — the row's facts joined
# with " · " — and a hand-added card's only fact is its team, so this is the
# operator seeing what they picked. Before NEO-208 this line was empty: the
# typed name went to `pendingTeamNames`, which nothing rendered at all, and
# that invisibility is the whole of the ticket.
- assertVisible: ".*CNAB${output.ATTEMPT_TOKEN}.*"

# AND THE ROW IS NOT BADGED, because a picked team IS a `teamOnCardIds` link and
# that is precisely what deriveCardAttention asks for. The scroll above is what
# makes this meaningful: an off-screen element reads as ABSENT to Maestro, so a
# notVisible on a row nobody scrolled to would pass for free.
- assertNotVisible:
    id: "Card 703-${ATTEMPT_ID}(, .*)? needs attention: no team on this card yet"

# AND THE PLAYER WAS STORED, read where only the stored row can put it. The row
# prints no player (its sub-line is team · print run · variation), and an
# unlinked card raises no badge either way (a card with no player link AND no
# pending name has nothing unreviewed), so neither surface above can tell a
# persisted pick from a dropped one. The drawer's PlayerPicker chips the card's
# `playerIds` off the live query, so its "Remove player <name>" is the read-
# back. The row was centred by the scroll above (R8), and nothing since has
# moved the page. The drawer is gated on "Card title", which only the drawer
# carries (the add form also has a "Card name").
- tapOn:
    id: "Edit card 703-${ATTEMPT_ID}(, .*)?"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: "Card title"
    timeout: 7000
# Players is the drawer body's last editable section, and the body is a fixed
# portal's inner scroller the window never moves — so three touch swipes at
# x=80% (inside the 720px right-anchored drawer), exactly the reach
# player-picker-create-custom-card uses and documents (README R8 case 2). They
# chain to the window once the body bottoms out, leaving the PAGE at maximum
# scroll; every scroll after this block is therefore UP, which is the
# direction the next step already takes.
- swipe:
    start: "80%, 80%"
    end: "80%, 20%"
- swipe:
    start: "80%, 80%"
    end: "80%, 20%"
- swipe:
    start: "80%, 80%"
    end: "80%, 20%"
# 7000, not a bare assert: the chip's name is the player's, resolved by its
# own query, and reads "Remove player <id>" for the frame before it lands.
- extendedWaitUntil:
    visible:
      id: "Remove player CNAP${output.ATTEMPT_TOKEN}"
    timeout: 7000
# "Done" lives in the drawer's pinned footer, outside the scroll body: no
# scroll can centre it and none is needed (R8 case 2).
- tapOn:
    id: "Done editing card"
- extendedWaitUntil:
    notVisible:
      id: "Card title"
    timeout: 7000

# ════════════════════════════════════════════════════════════════════════════
# THE BADGE — both teamless rows carry the attention mark.
#
# The mark is a single amber "!" glyph, so its MEANING lives in its accessible
# name: "Card <number>, <card name> needs attention: no team on this card yet"
# (NEO-272 — the number alone is never unique). That is what
# an operator's screen reader says and what Maestro matches on (aria-label →
# `id:`). Asserting the per-card name rather than a generic marker is what
# makes this specific to THESE rows.
#
# R6 — the scrollUntilVisible IS the assertion for #701; a badge that never
# appears fails the scroll loudly. No redundant assertVisible follows it.
#
# direction: UP, spelled out rather than left to default. #701 is the LOWEST card
# number and therefore the TOP row, and we arrive here with the page at MAXIMUM
# scroll — the drawer swipes above chained to the window — below every row (the
# same position player-picker-create-custom-card re-anchors from, UP, after its
# own drawer swipes). A DOWN scroll from there can only travel away from the
# row. Getting this wrong does not read as "wrong direction", it reads as "the
# badge is missing".
# ════════════════════════════════════════════════════════════════════════════

- scrollUntilVisible:
    element:
      id: "Card 701-${ATTEMPT_ID}(, .*)? needs attention: no team on this card yet"
    direction: UP
    centerElement: true
    timeout: 7000
- assertVisible:
    id: "Card 702-${ATTEMPT_ID}(, .*)? needs attention: no team on this card yet"

# ════════════════════════════════════════════════════════════════════════════
# THE HEADER PILL — an exact count (NEO-335).
# The pill's visible text IS its accessible name (SetRowActionButton takes no
# aria-label), so a `text:` full match on it is the count; its DOM id is never
# a handle (README). It is the walker's one door, exercised at the end.
#
# TWO, out of THREE cards on this checklist. The number is the second half of
# the NEO-208 assertion: the born-linked card is not merely un-badged on its own
# row, it is not COUNTED either. A regression that wrote the picked team
# somewhere the rule cannot see would read "3 need you" here.
# UP — the attention row is in the checklist header, above the rows.
# ════════════════════════════════════════════════════════════════════════════

- scrollUntilVisible:
    element:
      text: "2 need you"
    direction: UP
    centerElement: true
    timeout: 7000

# ════════════════════════════════════════════════════════════════════════════
# ANSWER ONE CARD — give #702 a real team through the card drawer's TeamPicker.
#
# This is the "the badge goes away because the ROW changed" half of the rule:
# nothing clears a flag by hand, the card simply stops satisfying
# deriveCardAttention once teamOnCardIds is non-empty.
#
# Teams is position 2 in the drawer body, so no in-drawer swipe is needed. This
# card gets its own team, CNAA, created here the same way card 3 created CNAB —
# under the real Baseball sport row, which is why this flow drills the real
# Baseball ancestor (see the isolation note at the top).
# ════════════════════════════════════════════════════════════════════════════

- scrollUntilVisible:
    element:
      id: "Edit card 702-${ATTEMPT_ID}(, .*)?"
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000
- tapOn:
    id: "Edit card 702-${ATTEMPT_ID}(, .*)?"
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 15000

- tapOn:
    id: "Add team"
- assertVisible:
    id: "Search teams"
- tapOn:
    id: "Search teams"
- inputText: "CNAA${output.ATTEMPT_TOKEN}"
# NEO-236 — the popover's one create affordance, which opens the New Team
# dialog rather than writing.
- assertVisible:
    id: "New team CNAA${output.ATTEMPT_TOKEN}"
- tapOn:
    id: "New team CNAA${output.ATTEMPT_TOKEN}"

# The New Team dialog — portalled to `document.body` at `z-[60]`, `fixed inset-0`
# and centred, so nothing clips it. It is where the three questions a team row
# needs (Location, Team name, League) are answered and where the write happens.
#
# TWO assertions, because they say two different things.
#
# The HEADING is the dialog's `aria-labelledby` target, so it is what a screen
# reader announces on arrival — "New team: <what I typed>" is the dialog being
# correctly LABELLED. (It briefly was not: opening by CLICK used to blank the
# name, because the picker's focus-out handler read a stale "is the dialog open"
# flag and cleared the query behind the portal. Fixed under NEO-236 with a
# synchronous ref; this assertion is what keeps it fixed.)
#
# The NAME BOX and its VALUE is the dialog being correctly SEEDED — maestro-web
# reports an input by its value, so this says the search text really reached the
# field the operator is about to submit.
- assertVisible: "New team: CNAA${output.ATTEMPT_TOKEN}"
- assertVisible:
    id: "New team name"
    text: "CNAA${output.ATTEMPT_TOKEN}"

# THE WRITE. Nothing is typed in the dialog: Team name is pre-filled with what
# was searched, Location stays blank and no League is picked, so the COMPOSED
# name is exactly what was typed and every later matcher is unchanged.
#
# `Create team <composed full name>` is the same accessible name this flow always
# used — it moved from the popover row onto the dialog's own button. Tapped by id
# rather than driven with a second Enter: Create and Cancel are NeonButtons with
# an identical class string, and maestro-web's pressKey re-finds the focused
# element by an XPath that falls back to that class, so an Enter aimed at Create
# could land on Cancel.
- tapOn:
    id: "Create team CNAA${output.ATTEMPT_TOKEN}"

# The chip proves the pick landed. NEO-216: there is no draft and no Save
# button — TeamPicker sends `updateCard.teamOnCardIds` on the tap itself, and
# the drawer confirms it in its one status region. Waiting on that confirmation
# is what makes the badge assertion below meaningful: without it we would be
# racing an in-flight mutation.
- assertVisible:
    id: "Remove team CNAA${output.ATTEMPT_TOKEN}"
- extendedWaitUntil:
    visible: ".*Saved Teams.*"
    timeout: 7000

# Tapping "Card name" parks the caret on a field ABOVE the picker, which closes
# the popover (Escape is not a web keycode, and the drawer has no discard path
# to trip any more). Then "Done" closes the drawer so the row behind it — and
# its attention badge — is readable again.
- tapOn:
    id: "Card name"
- tapOn:
    id: "Done editing card"

# ════════════════════════════════════════════════════════════════════════════
# THE COUNT MOVES — and only for the card that was answered.
# ════════════════════════════════════════════════════════════════════════════

- extendedWaitUntil:
    notVisible:
      id: "Card 702-${ATTEMPT_ID}(, .*)? needs attention: no team on this card yet"
    timeout: 7000
- assertVisible:
    id: "Card 701-${ATTEMPT_ID}(, .*)? needs attention: no team on this card yet"
- assertVisible: "1 needs you"
# The row now shows the team it was given — the reason its badge went away.
- assertVisible:
    text: ".*CNAA${output.ATTEMPT_TOKEN}.*"

# ════════════════════════════════════════════════════════════════════════════
# WHICH CARD — the pill opens the walker on the flagged set, and only that.
#
# This replaces the retired filter chip's proof (NEO-335). A count says HOW
# MANY rows are flagged; the walker's queue says WHICH, because it is derived
# from the same rule over the same rows. It opens on the lowest-numbered
# flagged card — #701 — and its counter is the queue's length, so a walker
# that also held #702 (answered) or #703 (born linked) reads "2 cards" or "3
# cards" and fails here. The Skip button's accessible name is the dialog's one
# card-specific handle. Nothing is answered: Close defers, writes nothing, and
# the sibling walker flow owns the fixer itself.
#
# Centred before the tap (R8). UP: the #702 drawer step above centred that
# row, and the attention row sits above the rows in the checklist header.
# ════════════════════════════════════════════════════════════════════════════

- scrollUntilVisible:
    element:
      text: "1 needs you"
    direction: UP
    centerElement: true
    timeout: 7000
- tapOn: "1 needs you"
- extendedWaitUntil:
    visible: "Cards Needing Attention"
    timeout: 7000
- assertVisible:
    id: "Skip card 701-${ATTEMPT_ID} for now"
# The "." matches the middot separator.
- assertVisible:
    text: ".*1 card needs attention . 0 fixed.*"
- tapOn:
    text: "Close \\(Esc\\)"
- extendedWaitUntil:
    notVisible: "Cards Needing Attention"
    timeout: 7000
# Closing deferred, so #701 is still the one flagged card.
- assertVisible: "1 needs you"

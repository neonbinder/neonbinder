appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Attention walker — answering a card's missing team, one card at a time"
tags:
  - set-selector
---
# ════════════════════════════════════════════════════════════════════════════
# R1 — ONE feature (NEO-102): the "Fix them one at a time" walker lets an
# operator answer the missing-team question on each flagged card, and each of
# its three answers behaves differently.
#
#   • SKIP  — defers. Nothing is written: the card keeps its badge and comes
#             back the next time the walker opens.
#   • A TEAM — picked in the multi-select TeamPicker and saved with
#             "Save & Next". The badge goes away because the ROW changed
#             (teamOnCardIds is now non-empty), not because anything cleared a
#             flag by hand.
#   • NO TEAM — "No team on this card" is an ANSWER, not an abandonment. It is
#             server-stamped (confirmCardNoTeam), so the card must still be
#             un-flagged after a full reload — that is the assertion this flow
#             exists for, and the one thing that distinguishes a real
#             persisted decision from a local UI toggle.
#
# The walker's counter ("N cards need attention · k fixed") is asserted at each
# step, so a walker that advances without recording anything, or records
# without advancing, fails here (R2).
#
# ORDER IS DETERMINISTIC, NOT ASSUMED
#   getCardChecklist returns its rows already sorted by compareCardNumbers, and
#   the walker pins the first flagged row of that list at mount. So with #801
#   and #802 both flagged, the walker opens on #801 — and every step below
#   names the card it expects in the Skip button's accessible name
#   ("Skip card <number> for now"), so a walker that presents the wrong card
#   fails immediately instead of silently answering someone else's question.
#
# NOT COVERED HERE — and why
#   • The post-commit banner CTA ("K need attention — Fix them one at a time").
#     It only renders after a commitCardChecklist, which needs a real
#     marketplace fetch; a hand-made subtree carries no marketplace ids so
#     neither side is ever fetched (NEO-239), and the real sets are read-only
#     (R7a). Component-covered in
#     CardChecklist.test.tsx. (The walker never opens on its own — an earlier
#     auto-open was removed after it swallowed taps in two wizard flows.)
#   • The preselected suggestion chips. They come from the card's PLAYERS'
#     career years, and a custom card added through the add-card form has
#     pending player NAMES, not linked player rows with careers — so there is
#     nothing to suggest from. Reaching a linked player with career history
#     means the entity-review wizard, which since NEO-220/221 is only reachable
#     from a real cold marketplace fetch (STEP 6 of
#     inserts-1996-score-one-nb-set-two-bsc-sources.yaml) — a different feature
#     and a multi-minute path. Unit/component-covered.
#   • Escape-to-defer as a literal keypress. maestro-web's pressKey maps only
#     Enter and Backspace (CdpWebDriver.mapToSeleniumKey throws on anything
#     else), so Escape cannot be driven from a flow at all. The walker's
#     "Close (Esc)" / "Done (Esc)" button runs the SAME onClose handler, and
#     that is what this flow taps; the key binding itself is component-covered.
#
# R7a / DATA ISOLATION — per-worker, per-attempt custom set
#   `cnw-${WORKER_INDEX}-${ATTEMPT_ID}` under the REAL Baseball / 2024 / Topps
#   ancestors (registered in .maestro/SET-REGISTRY.md). The real Sport ancestor
#   keeps sport="baseball", which is what lets TeamPicker create its team under
#   a real sport row at all (NEO-96 — no sport row, no "+ New team"); the custom
#   Set node makes the subtree custom so no marketplace call fires. The team
#   itself is this flow's own, per-worker and per-attempt — see the note beside
#   the picker. ATTEMPT_ID keeps the walker's queue exactly
#   the two cards this attempt created — a leftover row from a failed attempt
#   would put an unexpected card in front of the operator and every
#   card-specific assertion below would fail for the wrong reason.
# ════════════════════════════════════════════════════════════════════════════

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ── The minted name's single search token (SET-REGISTRY.md, "A name typed into
# a team picker must be a SINGLE search token") ──────────────────────────────
# `teams.search` / `players.search` are Convex SEARCH indexes: they match on
# TOKENS split at non-alphanumerics, so a hyphenated `Prefix-<attempt>` name
# tokenizes to ["Prefix", "<attempt>"] and every row any flow ever left behind
# under that prefix comes back as a suggestion — the per-attempt suffix buys
# nothing. Nothing deletes a team (the app has no delete-team affordance; the
# picker's "Remove team" only unlinks it from the card), so those rows stand for
# the whole run and are visible to every concurrent worker. The names below are
# therefore ONE alphanumeric token with no separator at all.
#
# The token is ATTEMPT_ID with its hyphens stripped: "w3-a1-23945" is three
# search terms, "w3a123945" is one — and it still carries the worker index, so
# the per-worker distinction the old `${WORKER_INDEX}` prefix gave is folded in
# rather than separated out.
#
# ⚠️ READ `ATTEMPT_ID`, NOT `output.ATTEMPT_ID`. The runner injects it with
# `-e ATTEMPT_ID=…`, which Maestro exposes as the binding `${ATTEMPT_ID}`; it
# never populates `output.ATTEMPT_ID`, so the older idiom always fell through to
# its 4-digit `Date.now()` fallback and two runners collided constantly.
#
# Single-quoted: the expression contains double quotes, and quoting the scalar
# keeps YAML out of it. `Date.now()` is the standalone-run fallback.
- evalScript: '${output.ATTEMPT_TOKEN = String(ATTEMPT_ID || Date.now()).split("-").join("")}'

# R9 — the drill util owns the six-level navigation.
- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "cnw-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
      VARIANT_TYPE: "Insert"
      VARIANT: "Base"

# ════════════════════════════════════════════════════════════════════════════
# TWO CARDS, NEITHER WITH A TEAM — the walker's queue.
# "Team (optional)" on the add form is left empty deliberately, and since
# NEO-208 that is the only way to build this queue from the form: the field is a
# TeamPicker whose picked teams are written as real `teamOnCardIds` at creation,
# so a card added WITH one is born linked, is not flagged `missingTeam`, and
# would never reach the walker. (Before NEO-208 the field was free text that
# became a `pendingTeamNames` string and produced no link, so filling it made no
# difference to the badge — which is what this comment used to say. It would
# now.) That a picked team really does keep a card out of this state is asserted
# in the sibling flow, checklist-attention-badge-and-filter.yaml.
# ════════════════════════════════════════════════════════════════════════════

- tapOn:
    id: "Open add card form"
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 15000
- inputText: "801-${ATTEMPT_ID}"
- tapOn: "Player name"
- inputText: "Walker Alpha ${ATTEMPT_ID}"
# centerElement so Maestro's own scroll-before-tap has content to scroll to —
# without it the CDP scroll returns nothing and the tap dies with
# "null cannot be cast to non-null type kotlin.Int".
- scrollUntilVisible:
    element:
      id: "Submit new card"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Submit new card"
- scrollUntilVisible:
    element:
      id: "Edit card 801-${ATTEMPT_ID}"
    centerElement: true
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
    timeout: 7000

# Second card, added inline rather than through util-add-custom-card: that
# util's first act is a full six-level re-drill, and we are already standing on
# the checklist it leads to (same reasoning and same measured cost as
# variation-link-group-and-unlink.yaml). direction: UP because the add-card
# button sits ABOVE the list, which is currently scrolled down to #801's row.
- scrollUntilVisible:
    element:
      id: "Open add card form"
    direction: UP
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000
- tapOn:
    id: "Open add card form"
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 7000
- inputText: "802-${ATTEMPT_ID}"
- tapOn: "Player name"
- inputText: "Walker Bravo ${ATTEMPT_ID}"
- scrollUntilVisible:
    element:
      id: "Submit new card"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Submit new card"
- scrollUntilVisible:
    element:
      id: "Edit card 802-${ATTEMPT_ID}"
    centerElement: true
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
    timeout: 7000

# ════════════════════════════════════════════════════════════════════════════
# OPEN THE WALKER from the header. Centering the chip row also parks the two
# card rows just below it, in view — which is what makes the badge assertions
# after each close meaningful rather than trivially-absent (an off-screen
# element reads as ABSENT to Maestro). Nothing scrolls the window from here on;
# the walker is a fixed z-50 portal, so its controls are tapped directly.
# ════════════════════════════════════════════════════════════════════════════

- scrollUntilVisible:
    element:
      text: "2 need attention"
    direction: UP
    centerElement: true
    timeout: 7000
- tapOn: "Fix them one at a time"

- extendedWaitUntil:
    visible: "Cards Needing Attention"
    timeout: 7000
# The walker opened on the LOWEST-numbered flagged card, and its own counter
# agrees with the header chip. The "." matches the middot separator.
- assertVisible:
    id: "Skip card 801-${ATTEMPT_ID} for now"
- assertVisible:
    text: ".*2 cards need attention . 0 fixed.*"
# The fixer body rendered for this card: a custom card carries pending player
# NAMES rather than linked player rows, so there is nothing to suggest from and
# nothing preselected — the operator has to answer it themselves.
- assertVisible: "No players on this card."
- assertVisible: "Pick at least one team, or record that this card has none."

# ════════════════════════════════════════════════════════════════════════════
# ANSWER 1 — SKIP #801. Deferring advances to the next card and writes nothing.
# ════════════════════════════════════════════════════════════════════════════

- tapOn:
    id: "Skip card 801-${ATTEMPT_ID} for now"
- extendedWaitUntil:
    visible:
      id: "Skip card 802-${ATTEMPT_ID} for now"
    timeout: 7000
# One card left in this sitting, and NOTHING has been fixed — a skip is not a
# write, so the "fixed" half of the counter must not have moved.
- assertVisible:
    text: ".*1 card needs attention . 0 fixed.*"

# ════════════════════════════════════════════════════════════════════════════
# ANSWER 2 — "No team on this card" for #802. The explicit, recordable answer.
# ════════════════════════════════════════════════════════════════════════════

- tapOn: "No team on this card"
- extendedWaitUntil:
    visible: "All clear — nothing on this checklist needs attention."
    timeout: 7000
- assertVisible:
    text: ".*0 cards need attention . 1 fixed.*"
# The footer button says "Done" rather than "Close" once nothing is left.
- tapOn: "Done (Esc)"
- extendedWaitUntil:
    notVisible: "Cards Needing Attention"
    timeout: 7000

# Back on the grid: #802 is answered and un-flagged, #801 was only DEFERRED and
# keeps its badge, and the header count is back to the truth.
- extendedWaitUntil:
    notVisible:
      id: "Card 802-${ATTEMPT_ID} needs attention: no team on this card yet"
    timeout: 7000
- assertVisible:
    id: "Card 801-${ATTEMPT_ID} needs attention: no team on this card yet"
- assertVisible: "1 need attention"

# ════════════════════════════════════════════════════════════════════════════
# ANSWER 3 — a real team for #801, through the walker's own TeamPicker.
# Re-opening also proves the skip was session-only: #801 is back in the queue.
# ════════════════════════════════════════════════════════════════════════════

- tapOn: "Fix them one at a time"
- extendedWaitUntil:
    visible:
      id: "Skip card 801-${ATTEMPT_ID} for now"
    timeout: 7000
- assertVisible:
    text: ".*1 card needs attention . 0 fixed.*"

# The same picker the card drawer uses, including its typeahead — and its
# "+ New team" row, which is how this flow gets a team at all (NEO-214: the global
# seeded Yankees/Mets fixture is gone; `teams` is empty until a flow fills it).
# The name is per-worker AND per-attempt because `teams` is a global table and
# because the create row is offered only while no team of that name exists — one
# left behind by a previous attempt would render "Add <name>" instead.
- tapOn:
    id: "Add team"
- assertVisible:
    id: "Search teams"
- tapOn:
    id: "Search teams"
- inputText: "CNWT${output.ATTEMPT_TOKEN}"

# NOTHING MATCHES THAT NAME — the precondition for creating it, and a real
# assertion that the name is this attempt's alone.
- assertVisible: "No matches."

# OPEN THE NEW TEAM DIALOG WITH ENTER, NOT BY TAPPING THE "+ New team" ROW
# (NEO-236).
#
# The popover's create affordance is one row — `+ New team "<typed>"…`,
# accessible name `New team <typed>` — and taking it opens a dialog where
# Location, Team name and League are answered. The write is the dialog's, not
# the row's.
#
# That row used to be at the mercy of a 320px scroll box inside THIS host. The
# walker's body is `min-h-[min(20rem,55vh)] overflow-y-auto` under the panel's
# `max-h-full`, and the popover was `absolute top-full` INSIDE it: measured at
# 1024x629 the body's visible box was y=162-482 and the trigger sat at
# y=258-280, so anything the popover put below its search box was one bad
# row-count away from the clip edge — and Maestro reports layout bounds
# regardless, so a `tapOn` on a clipped row "succeeded" while
# `document.elementFromPoint` handed the click to the walker's footer.
#
# NEO-272 FIXED THE CLIP: the popover is portalled to `document.body` and
# positioned `fixed` against its trigger, so no scrolling ancestor can cut it
# off any more (see components/SetSelector/PickerPopover.tsx). Tapping the row
# would therefore work now.
#
# THE ENTER STEP STAYS ANYWAY, because it is not a workaround for the clip — it
# is the cheaper handle. Enter on the search input runs the SAME code the row
# does: TeamPicker's keydown takes the highlighted match when there is one and
# otherwise opens the New Team dialog. "No matches." above is what proves there
# is none, so Enter here can only mean "open the dialog" — and it reads no
# coordinates at all, which no `tapOn` can beat for reliability. It is also how
# team-management-edit-a-team, player-management-add-and-career-history and the
# spine-label flow all reach the same dialog, so the four stay consistent.
#
# The dialog itself was never exposed to any of this: it is portalled to
# `document.body` at `z-[60]` (the popover sits under it at `z-[55]`), which is
# why NEO-236's earlier `scrollIntoView` workaround is gone rather than tuned.
- pressKey: Enter

# THE DIALOG IS OPEN. It is portalled to `document.body` at `z-[60]` and
# `fixed inset-0 flex items-center justify-center`, so it is centred in the
# viewport and clipped by nothing — none of the geometry above can reach it.
#
# TWO assertions, because they say two different things.
#
# The HEADING is the dialog's `aria-labelledby` target, so it is what a screen
# reader announces on arrival — "New team: <what I typed>" is the dialog being
# correctly LABELLED. (It briefly was not: opening by CLICK used to blank the
# name, because the picker's focus-out handler read a stale "is the dialog open"
# flag and cleared the query behind the portal. Fixed under NEO-236 with a
# synchronous ref; this assertion is what keeps it fixed.)
#
# The NAME BOX and its VALUE is the dialog being correctly SEEDED — maestro-web
# reports an input by its value, so this says the search text really reached the
# field the operator is about to submit.
- assertVisible: "New team: CNWT${output.ATTEMPT_TOKEN}"
- assertVisible:
    id: "New team name"
    text: "CNWT${output.ATTEMPT_TOKEN}"

# THE WRITE. `Create team <composed full name>` is the SAME accessible name this
# flow has always used — it moved from the popover row onto the dialog's own
# button. Location is left blank and no League is picked, so the composed name
# is exactly what was typed and every later matcher is unchanged.
#
# Tapped by id rather than driven with a second Enter: the dialog's Create and
# Cancel are NeonButtons with an identical class string, and maestro-web's
# pressKey re-finds the focused element by an XPath that falls back to that
# class — so a synthetic Enter aimed at Create can land on Cancel.
- tapOn:
    id: "Create team CNWT${output.ATTEMPT_TOKEN}"

# Wait for the chip to carry the resolved NAME before tapping Save. Two
# reasons: it proves the pick landed, and the chip's width is what pushes the
# still-open typeahead popover clear of the Save button's centre. TeamPicker
# closes its popover only on Escape (which maestro-web cannot send, and which
# this dialog treats as "defer" anyway), so the popover is still open here —
# see the product finding filed with NEO-102.
- extendedWaitUntil:
    visible:
      id: "Remove team CNWT${output.ATTEMPT_TOKEN}"
    timeout: 7000

# CLOSE THE POPOVER BEFORE REACHING FOR SAVE — and close it from the WALKER
# HEADER, which is the one handle in here that the picker cannot move.
#
# The popover is a `w-64` box hanging directly under the trigger and therefore
# directly over "Save & Next (Enter)" and "No team on this card", and picking a
# team deliberately leaves it OPEN. So it has to be dismissed before any
# coordinate below it is read, or the click lands on the popover instead of the
# button. NEO-272 made that MORE necessary rather than less: portalled and
# `fixed`, the popover is no longer trimmed at the scroll box's edge, so the
# whole rectangle is now over those buttons.
#
# A pointerdown anywhere outside the picker root closes it, and the walker's own
# `<h2>` is outside the scrolling body altogether — its position cannot move
# with the body's scroll, which is why it is chosen over anything inside the
# fixer. Escape is deliberately not used: in this walker it means "defer this
# card" (and maestro-web cannot send it anyway).
#
# NEO-236 removed the `scrollIntoView` the old inline create form needed, which
# is what used to move this whole panel 63px a second after the create (CI run
# 33982239886) and made "Save & Next" a moving target. The New Team dialog is
# portalled, so nothing scrolls the walker's body any more — and since NEO-272
# the popover is portalled too, so it no longer adds to the body's scrollable
# height either.
- tapOn:
    id: "card-attention-walker-title"
# The popover is gone. Only now is "Save & Next" read for its coordinates.
- extendedWaitUntil:
    notVisible:
      id: "Search teams"
    timeout: 7000
- tapOn:
    text: ".*Save & Next.*"

- extendedWaitUntil:
    visible: "All clear — nothing on this checklist needs attention."
    timeout: 7000
- assertVisible:
    text: ".*0 cards need attention . 1 fixed.*"
- tapOn: "Done (Esc)"
- extendedWaitUntil:
    notVisible: "Cards Needing Attention"
    timeout: 7000

# Nothing on this checklist needs attention any more, so the whole header row
# — count chip and walker link — is gone, and #801 shows the team it was given.
- extendedWaitUntil:
    notVisible:
      id: "Card 801-${ATTEMPT_ID} needs attention: no team on this card yet"
    timeout: 7000
- assertNotVisible: "Fix them one at a time"
- assertVisible:
    text: ".*CNWT${output.ATTEMPT_TOKEN}.*"

# ════════════════════════════════════════════════════════════════════════════
# RELOAD — the answers were written to the server, not just to this tab.
#
# This is the whole point of the "no team" answer being a stamped column rather
# than a UI state: re-drilling reloads the page and re-reads every row from
# Convex. If confirmCardNoTeam had not stamped #802, its badge would be back
# here — which is exactly the bug the feature exists to fix, one field over.
# ════════════════════════════════════════════════════════════════════════════

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "cnw-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
      VARIANT_TYPE: "Insert"
      VARIANT: "Base"

- scrollUntilVisible:
    element:
      text: "Walker Bravo ${ATTEMPT_ID}"
    centerElement: true
    timeout: 7000
- assertVisible: "Walker Alpha ${ATTEMPT_ID}"
- assertNotVisible:
    id: "Card 802-${ATTEMPT_ID} needs attention: no team on this card yet"
- assertNotVisible:
    id: "Card 801-${ATTEMPT_ID} needs attention: no team on this card yet"
- assertNotVisible: "Fix them one at a time"

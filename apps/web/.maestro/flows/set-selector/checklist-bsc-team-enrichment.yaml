appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Checklist — a synced Base card carries its real BSC-resolved team into the card detail drawer (NEO-90, NEO-195)"
tags:
  - set-selector
  - regression
---
# ════════════════════════════════════════════════════════════════════════════
# R1 — ONE feature: a synced BSC Base card carries its real, marketplace-
# resolved TEAM through to the card detail drawer an operator opens.
#
# WHAT THIS PROVES
#   setup.yaml syncs 2024 Topps Chrome Base. Somewhere in that pipeline each
#   BSC-sourced card acquires a real team, and by the time an operator opens
#   the card the Teams field shows it. We open an ordinary single-player Base
#   card (Julio Rodriguez #300) and assert its "Teams" field shows that team.
#   If the team is dropped anywhere along the chain the field stays empty and
#   the assert below fails loudly (R2) — there is no when:/branch that can
#   green this flow without the team actually appearing.
#
# WHICH ENRICHMENT PATH THIS ACTUALLY WALKS — read before editing
#   This flow was originally written (NEO-90) to cover the BACKGROUND queue:
#   processBscTeamEnrichmentQueue → resolveBscCardTeam → applyBscTeamResolution,
#   scheduled by commitCardChecklist for cards committed WITHOUT a team. That
#   is no longer the path #300 takes, and this header must not claim it is.
#
#   NEO-195 moved the per-card BSC team lookup INTO the fetch (step 4 of
#   `fetchCardChecklist`: every candidate that has a BSC ref and got no team
#   from the bulk `players` parse is looked up in chunks of 50) — and fixed
#   CardPairingModal's ABSORB reducer, which had been throwing every one of
#   those resolved teams away. Since that fix #300's team reaches the modal,
#   rides Confirm into commitCardChecklist as a team link, and the commit
#   therefore never enqueues #300 for the background queue at all.
#
#   So what this flow now covers is the END STATE — the card has its real team
#   when a human opens it — and not any one mechanism. It cannot tell the two
#   mechanisms apart: both read the same BSC `card-listing` endpoint, and by
#   the time this flow runs (setup finished minutes earlier) either path has
#   long since landed.
#
#   THE BACKGROUND QUEUE IS NOT EXERCISED HERE, and no E2E flow can exercise
#   it against this suite's data:
#     - A card only reaches the queue if it has a BSC ref and still has no team
#       at commit. Post-NEO-195 the in-fetch pass has already tried every such
#       card against the same endpoint, so the cards left over are the ones BSC
#       has no team on file for — nothing to assert — plus transient-failure
#       retries, which are timing, not structure.
#     - Reaching it deliberately would mean a fresh fetch + commit, i.e. a
#       WRITE. Writes must go to a per-worker hand-made subtree (R7a), which
#       carries no marketplace ids — so BSC is never fetched there (NEO-239)
#       and its cards have no BSC ref to enrich. Writing to the real Topps
#       Chrome set is banned.
#   The queue's own logic is unit-covered instead, in
#   convex/bscTeamEnrichmentQueue.test.ts (+ .tolerance.test.ts). The in-fetch
#   lookup is covered by convex/fetchCardChecklistTeamLookup.test.ts, and the
#   ABSORB merge that carries its result through to Confirm by the "a team
#   resolved mid-session reaches onConfirm" test in
#   components/SetSelector/CardPairingModal.test.tsx.
#
# WHY CARD #300 (Julio Rodriguez), and why the exact team name
#   - It is an ordinary single-player card (no TC suffix, no parenthetical), so
#     parsePlayersField gives it no team and it genuinely needs a per-card BSC
#     lookup. The enrichment work is exercised rather than short-circuited by
#     a team that fell out of the cheap synchronous parse.
#   - REACHABILITY (proven empirically): after the drill, react-virtuoso does
#     NOT mount at the top, and a DOWN scroll walks to the BOTTOM of the list —
#     so the lowest card numbers (#1…) are unreachable, but the bottom cards
#     (…#300) settle reliably into view. #300 is the second-to-last row (its
#     Edit control sits at ~y438, comfortably inside the fold), so it
#     is the natural, stable, reliably-tappable target. (Targeting #1 was tried
#     first and confirmed unreachable — the DOWN scroll lands on #295–#300b.)
#   - Ground truth verified live (unauthenticated) against
#     GET api-prod.buysportscards.com/marketplace/card/{bscCardId}/card-listing
#     for #300's real bscCardId (e37718c040123c15fba3b8d3aa83a752):
#     teamName = "Seattle Mariners". Julio Rodriguez is a lifelong Mariner in
#     this immutable printed set, so we assert the EXACT team name, per this
#     suite's fixed-assertion convention. If BSC ever returns a different team
#     for this card it's a real data regression, not "marketplace drift" — do
#     not loosen it to hide a bug.
#
# READ-ONLY on shared data (data-isolation rule)
#   This flow READS the shared, global 2024 Topps Chrome Base checklist that
#   setup.yaml pre-syncs — it never edits it (opens the drawer, asserts, then
#   Cancels; no Save). Reads don't collide with concurrent workers, so this is
#   safe to run on the shared real set without a per-worker subtree. (The old
#   `isolated` serial lane is gone; concurrency safety here comes from being
#   read-only, not from a lane.)
#
# DEPENDS ON: setup.yaml having pre-synced the 2024 Topps Chrome Base checklist
#   (~335 cards) with its team enrichment applied. If the checklist is empty
#   this flow fails loudly — the fix is to ensure setup ran, not to paper over
#   it.
# ════════════════════════════════════════════════════════════════════════════

# ── LAUNCH + SIGN IN ────────────────────────────────────────────────────────
- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000   # cold sign-in / app load; UI-only waits below use the 7s default

# ── DRILL TO THE PRE-SYNCED BASE CHECKLIST (R9) ─────────────────────────────
# util-drill-to-base-variant leaves the CardChecklist visible with the
# "Add Card" header row centered; the card rows render below it.
- runFlow:
    file: util-drill-to-base-variant.yaml

# ── REACH CARD #300 (Julio Rodriguez) AND OPEN ITS DETAIL DRAWER ────────────
# A DOWN scroll from the drill's resting position walks to the bottom of the
# list, where #300 lives. No centerElement: #300 is in the bottom region and
# the list can't scroll far enough past it to center it (that loops until
# timeout) — vis:50 is enough to bring its Edit control into the tappable band,
# and it lands at ~y438, inside the fold. waitToSettleTimeoutMs lets
# Virtuoso finish rendering each windowed row between scroll steps.
- scrollUntilVisible:
    element:
      id: "Edit card 300"
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
    timeout: 30000
- tapOn:
    id: "Edit card 300"
    waitToSettleTimeoutMs: 2000

# Drawer opened — confirm it's the RIGHT card before asserting the feature.
# Header shows "Card #300"; the "Card name" input value is the player name.
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 15000
- assertVisible:
    text: ".*Card #300.*"
- extendedWaitUntil:
    visible:
      id: "Card name"
      text: ".*Julio Rodriguez.*"
    timeout: 15000

# ── ASSERT THE RESOLVED TEAM (the feature) ──────────────────────────────────
# "Teams" is at the top of the drawer body (position 2, directly under Card
# name) — visible without scrolling. A resolved team renders as a TeamPicker
# chip with aria-label "Remove team <name>".
- assertVisible:
    text: "Teams"
# 7s default (R5). This assert used to carry a 60s "marketplace exception" on
# the grounds that the team arrived from a LIVE background BSC round-trip that
# might still be draining when the flow started. Since NEO-195 the team is
# resolved during the fetch and stored at commit, so by the time this flow runs
# it is already in the database and the only thing being waited on is an
# ordinary Convex read of the team's name. (The chip can briefly read
# "Loading…" for that one query; waiting on the exact name covers it.) If this
# ever needs longer than 7s, that is a product finding to raise — not a timeout
# to inflate.
- assertVisible:
    id: "Remove team Seattle Mariners"

# ── CLOSE (read-only: this flow never edits a field) ────────────────────────
# NEO-216: the drawer autosaves per field and has no Save/Cancel pair, so
# "read-only" is now a property of what the flow TOUCHES, not of which button
# it leaves by. Nothing above typed into a field, toggled a chip or picked in a
# picker, so no mutation was sent and "Done" simply closes — this flow leaves
# the shared checklist exactly as it found it (R7).
- tapOn:
    id: "Done editing card"
- assertNotVisible:
    id: "Card name"

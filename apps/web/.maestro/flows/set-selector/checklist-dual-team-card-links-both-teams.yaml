appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Checklist — a BSC dual-team card links both of its teams, never one combined team (NEO-333)"
tags:
  - set-selector
---
# ════════════════════════════════════════════════════════════════════════════
# R1 — ONE FEATURE: A BSC TEAM VALUE THAT NAMES TWO CLUBS BECOMES TWO TEAMS.
# BuySportsCards' per-card team lookup answers a two-player card with ONE
# string, e.g. "Boston Red Sox, Detroit Tigers". NEO-333 splits it on the
# comma (unless the WHOLE string matches an existing team or alias, even
# ambiguously — then it stays one), so a checklist fetch links the card to
# BOTH clubs and never asks the operator to create a team named after the
# pair. Proved on live data, through the operator's own path (Sync card
# checklist → the "Tidy up this set" wizard → Confirm & Save):
#
#   (a) STEP 5 — the fetch stages no team named after a comma-joined value.
#       On the reference catalogue every name on the set is known (see "WHICH
#       PLAYERS AND TEAMS ARE NEW" below), so the correct fetch commits
#       straight to `Saved N cards` with no wizard at all. An UNSPLIT value
#       ("Detroit Tigers, Boston Red Sox") resolves to no team, so it is an
#       unknown team, and an unknown team always opens the wizard
#       (`resolveChecklistEntities` → `unknownTeams`). So whenever the wizard
#       opens, every `New Team:` / `New League:` step it presents is checked
#       BEFORE it is answered, on its pinned footer control (whose accessible
#       name carries the row's name) and on its heading. Neither half of
#       PDA-WW's value may be a step either.
#   (b) STEP 6 — after the save, the dual card's row reads both clubs as
#       resolved teams (`teamFullName` of each linked row, joined ", "), with
#       no "(unconfirmed)" tail.
#   (c) STEP 7 — Team Management holds exactly ONE team whose name contains
#       "Boston Red Sox". That is what makes (b) unambiguous: a row reading
#       "Boston Red Sox, Detroit Tigers" could also be ONE combined team
#       linked once (memory: multi-team-row-needs-a-team-count), and (c)
#       rules that team out wherever it might have been minted.
#
# THE `name:` STAYS UNDER ~200 BYTES (memory: flow-name-is-a-directory-name).
#
# ── THE FIXTURE (SET-REGISTRY.md → "Baseball → 2025 — the NEO-333 dual-team
#    fixture") ───────────────────────────────────────────────────────────────
#   Baseball → 2025 → Bowman › Bowman Draft › Insert › `Prospect Dual
#   Autographs`. Published checklists list 14 cards, each signed by two
#   draftees, 10 of them from two organisations. The owner's own example pair
#   (Bazzana / Willits, Guardians / Nationals) is its PDA-BW. The owner chose
#   an UNCONTESTED set over 2026 Bowman's Draft Pick Pairings Autographs
#   (NEO-333, option B): that insert exists only in 2026 Bowman, whose insert
#   level `bowman-insert-grouping-builds-parallels` owns.
#
#   TARGET CARD for (b)/(c): PDA-WW, Kyson Witherspoon (Boston Red Sox) /
#   Malachi Witherspoon (Detroit Tigers). Chosen because
#    * it is the LAST row in natural card-number order (`compareCardNumbers`),
#      and the checklist's react-virtuoso list opens at its END
#      (`initialTopMostItemIndex`) and renders only its ~440px window — so
#      the last row is the one row guaranteed to be in the DOM;
#    * each club is ONE Baseball row in the reference catalogue (the README's
#      "A reference catalogue is on every CI preview"), current and open-ended,
#      with no alias; the only other "Detroit Tigers" is a Football row, and
#      team resolution is per sport. So with the fix each half resolves on
#      its own (`resolveTeamForSetYear`, set year 2025) and neither raises a
#      team step;
#    * no other card in the set carries either club, so the pair names the
#      card on its own.
#   VERIFIED 2026-10-12 (NEO-330) against BSC's public catalog facets and
#   the green #316 CI run: the set is `Bowman Draft`, the insert's
#   variantName `Prospect Dual Autographs` (14 cards, PDA-AD … PDA-WW), and
#   PDA-WW's BSC teams are Detroit Tigers + Boston Red Sox. SportLots paired
#   no set with the insert in that run (Pending → Keep all), so the fetch took
#   the one-marketplace path.
#
# ── WHICH PLAYERS AND TEAMS ARE NEW ON A FRESH PREVIEW ──────────────────────
#   NONE, measured 2026-10-12 against the catalogue (SET-REGISTRY.md has the
#   detail). The catalogue is a prod snapshot and prod has built this set:
#   all 21 draftees are single Baseball rows (`players.resolveNameForReview`
#   answers each with one `playerId`), and every one of the 16 clubs BSC
#   names resolves to exactly one row for 2025 (BSC's bare "Athletics" on
#   PDA-DM included). So the correct fetch commits straight to `Saved N cards`
#   and the wizard never opens. Before the catalogue all 21 draftees were
#   unknown and staged a Wikidata career team ("Sydney Blue Sox"); that is
#   why STEP 5 still drains the wizard when it does open. A catalogue refresh
#   that drops a name, or a SportLots set pairing with the insert, can open it
#   legitimately. Whatever it holds, each team or league step is checked for
#   a comma and SKIPPED, and players are skipped in one press. This flow mints
#   no player and no team, which is what lets (c) count to exactly one.
#
# ── WRITES (R7, R7a) ────────────────────────────────────────────────────────
#   SOLE WRITER OF BASEBALL → 2025. No other flow opens the year. The cold
#   drill syncs its Manufacturers and the year-wide Sets (BSC files every
#   2025 set under the brands; SportLots answers for Bowman and leaves a
#   review pill nobody saves); selecting `Bowman Draft` syncs its Variant
#   Types; the Insert reconcile (STEP 2) saves every Ready set it holds,
#   including the target insert. Then this insert's checklist is committed;
#   if the wizard opened, its skips leave per-set `entityReviewSkips`. No
#   player, team or league row is created; nothing is renamed, moved or
#   deleted. Not
#   self-cleaning: the scripted reset at the head of every run is its cleanup.
#   FRESH-ONLY — a re-run on the same preview finds the Insert column already
#   saved (no reconcile) and the checklist committed, and fails at STEP 2's
#   reconcile gate, by name. Re-seed first.
#
# ── NEO-287: BOTH MODES, HARD ASSERTS IN EACH (R2) ──────────────────────────
#   Paused, nothing is asked of SportLots: the cold util hand-makes `Bowman`,
#   the Insert column fills straight from BSC with no reconcile, the fetch
#   takes the one-marketplace path, and STEPS 4–7 run the same.
#
# ── R5 ──────────────────────────────────────────────────────────────────────
#   7000 for every NB read and write. Longer only for live external
#   round-trips, each named at its site: the cold drill's own ceilings
#   (util-drill-to-cold-real-set), the set's cold Variant Types (60000), the
#   cold Insert fetch (240000), the checklist fetch (120000), the wizard or
#   the direct commit behind it (60000), and, only when the wizard opens, its
#   Wikidata lookups settling (180000, util-wizard-walk-to-player-row's).
#
# ── HANDLES (visible text and accessible names; never a DOM id) ─────────────
#   columns    `Sets` (listbox), `Search sets`, `Variant Types`, `Insert`,
#              `Inserts` (listbox), `Search inserts`, row text
#   reconcile  `Reconcile Inserts`, `Filter NeonBinder sets`, `Filter BSC
#              items`, `NeonBinder set name for <set>`, `Make its own set:
#              <item>`, `Keep all <n>, BSC set(s)`, `Save N sets`
#   checklist  `Sync card checklist`, `No cards in this checklist yet.`,
#              `Match Cards — <row>`, `Confirm card matches`, `Kept all N
#              cards from BSC`, `Saved N cards`; a row's sub-line is ONE text
#              node, `<teams> · <print run> · <auto>` (CardChecklistItem
#              `subParts.join(" · ")`)
#   wizard     `Tidy up this set` (the title, NEO-335 WIZARD_TITLE), `N still
#              looking up — wait or skip`, `Skip <name> — not a person|not a
#              team`, `Skip <name> — this team has no league`, `New Team:
#              <name>` / `New League: <name>` (h3), `Skip remaining names
#              (N)`, `Next (Enter)` (visible text only, no accessible name of
#              its own), `Ready to save`, `Confirm & Save` (accessible name
#              `Confirm & Save (Enter) — commit this review`; rendered only
#              on the Save step)
#   teams      `Filter teams`, `N teams` browsing / `N match(es)` filtering
#              (TeamManagement.tsx `teamCounterSentence`, NEO-330)
#
# ── R3 ──────────────────────────────────────────────────────────────────────
#   No other flow proves a multi-team BSC value. `checklist-bsc-team-
#   enrichment` reads ONE club off a single-player 2024 Topps Chrome card,
#   read-only. The reconcile handling follows `bowman-insert-grouping-builds-
#   parallels` STEP 2 and the set pick `checklist-one-marketplace-skips-match-
#   dialog` STEP 2. The team-step drain is util-wizard-walk-to-player-row's
#   loop plus one addition that IS this flow's claim — the per-step comma
#   check — so it is written inline rather than called.
# ════════════════════════════════════════════════════════════════════════════

- runFlow:
    file: ../util/util-paused-platforms.yaml

# ============================================================
# LAUNCH + SIGN IN (R4)
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# STEP 1 — COLD DRILL TO Baseball / 2025 / Bowman, THEN PICK `Bowman Draft`
# (R9). No flow has opened 2025, so every column arrives empty and syncs
# itself: util-drill-to-cold-real-set pays those waits (its own R5
# marketplace ceilings) and, under the pause, makes the `Bowman` row by hand.
# It stops one level short on purpose; the set pick is this flow's, exactly
# as checklist-one-marketplace-skips-match-dialog STEP 2 makes it.
# ============================================================

- runFlow:
    file: util-drill-to-cold-real-set.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2025"
      MANUFACTURER: "Bowman"

# The column's LISTBOX renders only once it holds a row; the util already
# waited out the Sets sync, so this is a Convex read (the 15000 the sibling
# flow gives the same gate after the same util).
- extendedWaitUntil:
    visible:
      id: "Sets"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Search sets.*"
    centerElement: true
    timeout: 7000
- tapOn:
    text: ".*Search sets.*"
    waitToSettleTimeoutMs: 250
- inputText: "Bowman Draft"
# Result-keyed retry (NEO-85 coordinate staleness, the sibling's shape):
# re-fire the row tap once iff the next column never appears. `text:` is a
# full match, so "Bowman Draft" cannot pick a longer sibling's row.
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: "Bowman Draft"
          below:
            id: "Search sets"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "Variant Types"
          timeout: 20000
# Selecting the set fires its COLD variant-type sync (BSC + SportLots): 60000,
# the drill utils' variant-type contract (R5 marketplace exception).
- extendedWaitUntil:
    visible: "Insert"
    timeout: 60000

# ============================================================
# STEP 2 — MAKE THE INSERT AN NB SET: THE INSERTS RECONCILE (sole writer)
# ============================================================

- scrollUntilVisible:
    element:
      text: "Insert"
    centerElement: true
    timeout: 7000
- tapOn: "Insert"

# LIVE — the column is EMPTY on a fresh preview, so selecting the type fires
# its own two-sided sync, which opens the reconcile. REQUIRED, not optional
# (inserts-1996-score STEP 1 has the history): if it does not open, the year
# is dirty and the flow fails here, by name. 240000: a COLD insert-level BSC
# + SportLots fetch, the ceiling setup.yaml and inserts-1996-score give it
# (R5 marketplace exception).
- runFlow:
    when:
      true: "${!output.SL_PAUSED}"
    commands:
      - extendedWaitUntil:
          visible: "Reconcile Inserts"
          timeout: 240000

      # NARROW BOTH LISTS TO THE INSERT — the dialog body is its own
      # overflow-y-auto scroller that Maestro cannot drive, and the filters
      # are what put the row and its column header inside the body's band.
      # The Save still writes EVERY Ready set; the filter narrows the view,
      # not the write.
      - tapOn:
          id: "Filter NeonBinder sets"
          waitToSettleTimeoutMs: 250
      - inputText: "Prospect Dual Autographs"
      - tapOn:
          id: "Filter BSC items"
          waitToSettleTimeoutMs: 250
      - inputText: "Prospect Dual Autographs"

      # TWO LEGITIMATE SHAPES, named by this gate so the branch after it can
      # only choose between them (R2): Ready already (the matcher paired it
      # with a SportLots set) or Pending (BSC only). `id:` is a full match;
      # `$` states the anchor so a longer BSC parallel name cannot answer.
      - extendedWaitUntil:
          visible:
            id: "NeonBinder set name for Prospect Dual Autographs$|Make its own set: Prospect Dual Autographs$"
          timeout: 7000

      # PENDING → "Keep all" on the FILTERED BSC column, which makes every
      # item it shows its own set: the insert, plus any of its parallels BSC
      # lists at insert level under the same words (harmless — they are
      # sets in a year this flow owns, and nothing groups them). Chosen over
      # the row's own `Make its own set` button because the button sits on
      # the row's right edge, deep in the body where the footer clips it
      # (the Bowman inserts flow needs three measured swipes to reach it);
      # "Keep all" is in the column HEADER, which run 271 put at y=376-392
      # under ONE Ready row — and the filtered Ready list holds none of this
      # insert's family in the Pending shape. The hard assert after the
      # branch is what proves the press landed (R2).
      - runFlow:
          when:
            visible:
              id: "Make its own set: Prospect Dual Autographs$"
          commands:
            - tapOn:
                id: "Keep all [1-9][0-9]*, BSC sets?"
            # PIN THE BODY BACK TO ITS TOP: the Keep all handler focuses the
            # BSC filter, which scrolls the body, and a Ready row pushed above
            # the WINDOW's top edge is pruned from the hierarchy (the Bowman
            # inserts flow, CI 35603675951). Two touch swipes DOWN starting at
            # x=3%, inside the body's padding and off every dnd-kit handle; a
            # swipe past the top is a no-op.
            - swipe:
                start: "3%, 30%"
                end: "3%, 80%"
            - swipe:
                start: "3%, 30%"
                end: "3%, 80%"
      - extendedWaitUntil:
          visible:
            id: "NeonBinder set name for Prospect Dual Autographs$"
          timeout: 7000

      # SAVE. R8 case 2, MEASURED on this footer by inserts-1996-score (CI
      # 34349299679 + 34361627641): bounds unmoved across all six tries —
      # ReconciliationModal's footer sits outside its only scroller — so no
      # centring. The save is our own write: 7000 (R5).
      - scrollUntilVisible:
          element:
            text: ".*Save [0-9]+ sets.*"
          timeout: 7000
      - tapOn:
          text: ".*Save [0-9]+ sets.*"
      - extendedWaitUntil:
          notVisible: "Reconcile Inserts"
          timeout: 7000

      # RE-DRILL — saving leaves the columns row at the horizontal offset the
      # dialog was opened from, and Maestro has no horizontal scroll
      # (inserts-1996-score STEP 2). Every level is warm now, so the warm util
      # (no CREATE_MANUFACTURER: the cold util made any row it needed).
      - runFlow:
          file: util-drill-to-2024-topps-chrome.yaml
          env:
            SPORT: "Baseball"
            YEAR: "2025"
            MANUFACTURER: "Bowman"
            SET: "Bowman Draft"
      - scrollUntilVisible:
          element:
            text: "Insert"
          centerElement: true
          timeout: 7000
      - tapOn: "Insert"

# PAUSED — one marketplace, nothing to reconcile: the column fills straight
# from BSC and the dialog never opens. Its LISTBOX (`Inserts`) renders only
# once it holds a row (NEO-224; the search box proves nothing). 240000, the
# same cold BSC fetch.
- runFlow:
    when:
      true: "${output.SL_PAUSED}"
    commands:
      - extendedWaitUntil:
          visible:
            id: "Inserts"
          timeout: 240000
      - assertNotVisible: "Reconcile Inserts"

# ============================================================
# STEP 3 — SELECT THE INSERT
# Type first, then gate on the filtered row (memory: search-box-is-not-a-
# content-signal). `below:` because once typed, the box's VALUE is the same
# string the exact row pattern matches (README → getNodeText). The column is
# saved, so the search is a Convex read: 7000.
# ============================================================

- scrollUntilVisible:
    element:
      text: ".*Search inserts.*"
    centerElement: true
    timeout: 7000
- tapOn:
    text: ".*Search inserts.*"
    waitToSettleTimeoutMs: 250
- inputText: "Prospect Dual Autographs"
- extendedWaitUntil:
    visible:
      text: "^Prospect Dual Autographs$"
      below:
        id: "Search inserts"
    timeout: 7000
- tapOn:
    text: "^Prospect Dual Autographs$"
    below:
      id: "Search inserts"

# ============================================================
# STEP 4 — FETCH FROM MARKETPLACES ON THE INSERT
# The checklist renders below MultiSourcePanel and SetAttributesPanel
# (SetSelector.tsx DOM order) and the row was just tapped in the columns row,
# so DOWN. Centred for the tap (R8); it depends on the NEO-260 scroll spacer
# (src/layouts/binder-layout.tsx), as the same step in the Bowman inserts
# flow (STEP 6) does. The empty-checklist assert makes the saved cards below
# THIS fetch's.
# ============================================================

- scrollUntilVisible:
    element:
      id: "Sync card checklist"
    direction: DOWN
    centerElement: true
    timeout: 7000
- assertVisible: "No cards in this checklist yet."
- tapOn:
    id: "Sync card checklist"

# LEGITIMATE SHAPES (the Bowman inserts flow's STEP 6): a SportLots set
# paired with the insert opens "Match Cards"; one source takes the NEO-255
# one-marketplace path ("Kept all N cards from BSC"). On that path with every
# name known (the catalogue, header note) the run commits at once, and the
# commit's `Saved N cards` REPLACES the Kept-all line: CardChecklist holds one
# notice (`syncNotice`), and the line lives only through the entity check and
# the commit's own round trip. So `Saved` is accepted here as the same
# fetch's later state. The checklist was empty a step ago, so it can only be
# this fetch's. A fetch that lost the BSC side would carry no BSC team
# values, and STEP 6's row read fails it by name. BSC's per-card team lookup
# (NEO-195, `fetchCardChecklist` step 4 — the code NEO-333 changed) runs
# INSIDE this fetch. Live BSC (+ SportLots) round-trip: 120000 (R5).
- extendedWaitUntil:
    visible:
      text: "Match Cards.*|.*Kept all [0-9]+ cards? from BSC.*|.*Saved [1-9][0-9]* cards?.*"
    timeout: 120000

# NEO-287 — paused, nothing was asked of SportLots, so the pairing dialog is
# the bug (R2: the paused branch asserts its own shape).
- runFlow:
    when:
      true: "${output.SL_PAUSED}"
    commands:
      - assertNotVisible: "Match Cards.*"

# The pairing dialog OPENING is not the fetch FINISHING (NEO-195, streaming):
# Confirm reads "Loading…" and is inert until the action resolves, so its
# settled text is the sync point (120000, the same live fetch). The teams the
# fetch resolved ride Confirm into the batch (CardPairingModal's ABSORB fix).
- runFlow:
    when:
      visible: "Match Cards.*"
    commands:
      - extendedWaitUntil:
          visible:
            text: "^Confirm$"
          timeout: 120000
      - assertVisible:
          text: ".*Match Cards — Prospect Dual Autographs"
      - tapOn:
          id: "Confirm card matches"
      # An NB write: the 7000 bar (R5; measured 1.06s on the same dialog,
      # SET-REGISTRY.md → 2026 Bowman).
      - extendedWaitUntil:
          notVisible: "Match Cards.*"
          timeout: 7000

# ============================================================
# STEP 5 — CLAIM (a): NO TEAM STEP IS A COMMA-JOINED NAME
#
# TWO LEGITIMATE SHAPES, and the gate names both (R2):
#  * `Saved N cards`: the fetch committed straight through. This is the
#    EXPECTED shape on the catalogue, where every player and every club on the
#    set is known (header note), so nothing was staged. It is also the proof
#    of (a) on this path: an unsplit value resolves to no team, is reported
#    as an unknown team, and would have opened the wizard instead.
#  * the wizard (`Tidy up this set`, NEO-335): something was staged (a
#    catalogue refresh dropped a name, a SportLots pairing brought its own
#    spellings, or the split regressed), and it is drained below, every team
#    or league step checked before it is answered — OR no name was unknown
#    and the wizard opened only for its post-name steps (a teamless card, a
#    title that needs a look), which the advance util walks on the defaults.
# 60000: the wizard opens behind the batch the entity check starts, and the
# direct commit behind the card write (R5; the Bowman inserts flow's STEP 7
# gives the same two shapes the same gate and ceiling).
# The branch reads the gate's own node rather than paying a second visibility
# guard, which costs ~6.6s whenever it misses (memory: branch-on-copied-
# button-text). Nothing else on the page matches the pattern, and no notice
# reads `Saved` before a commit, so the copy is the node the gate just saw.
# ============================================================

- extendedWaitUntil:
    visible:
      text: "Tidy up this set|.*Saved [1-9][0-9]* cards?.*"
    timeout: 60000
- copyTextFrom:
    text: "Tidy up this set|.*Saved [1-9][0-9]* cards?.*"
- runFlow:
    when:
      true: '${maestro.copiedText === "Tidy up this set"}'
    commands:
      # WAIT OUT THE LOOKUPS FIRST. Team rows go through the same Wikidata
      # pool as players (`startBatch` inserts them `status: "pending"`), and
      # the wizard presents a team only once it has SETTLED (entity-review-
      # nav.ts `nextUndecided`, teams before players). Draining before the
      # batch settles would let a still-pending combined row be skipped
      # wholesale, unseen, by the "Skip remaining names" below, and (a) would
      # pass without looking. "N still looking up — wait or skip" is the
      # wizard's own footer status and is absent exactly when no undecided row
      # is pending; the title the gate matched renders only once the rows have
      # loaded (`rows === undefined` returns null), so this negative cannot
      # pass on a half-mounted wizard. R5 marketplace-class exception, the
      # ceiling util-wizard-walk-to-player-row gives it: a live Wikidata
      # round-trip per staged name, five-wide over a pool every runner shares
      # (measured 34.8s for the 21 draftees on the pre-catalogue seed, #316's
      # green run). It returns the moment the queue drains.
      - extendedWaitUntil:
          notVisible: ".*still looking up.*"
          timeout: 180000

      # R2 PRECONDITION: the settled wizard is presenting a step — a name (a
      # team, a league or a player, by its skip control's visible text) or,
      # when nothing on the batch is an unknown name, a post-name step by its
      # footer "Next (Enter)" / Confirm & Save — so the loop below cannot exit
      # on a blank or wedged dialog. NEO-335 Phase 2: a fetch whose names are
      # all known still opens the wizard when a card would save teamless or a
      # title needs a look, straight onto that step ("Step 1 of 2"). CI run
      # 38302511049 attempt 2 opened this set on "Card titles" (the set's
      # long name trims every title): every name was known, so no team step
      # existed, (a) held trivially, and the drain below has nothing to do.
      # One TEXT matcher, because "Next (Enter)" has no accessible name.
      - extendedWaitUntil:
          visible:
            text: "Skip . (not a (person|team)|no league)|Next \\(Enter\\)|.*Confirm & Save.*"
          timeout: 7000

      # A SAME-NAME PICK STEP HOLDS ITS PLACE (NEO-339). If the wizard opened
      # on one ("Which <name> is this?", inserted ready while every other
      # name waited on its lookup), it is still on screen now, and it is a
      # player row: the drain below would exit on it at once, check no team
      # step, and the bulk skip would then decide every team unseen, so (a)
      # would pass without looking. Skip it first and the league and team
      # steps come next. One read when the wizard is on anything else,
      # including a post-name step (NEO-335 Phase 2, above). After the
      # precondition, so the read lands on a presented step.
      - runFlow: util-wizard-skip-held-pick-step.yaml

      # THE DRAIN, util-wizard-walk-to-player-row's step 2 plus this flow's
      # check. Every settled undecided TEAM (and the LEAGUE step staged ahead
      # of a team that needs one) is presented before any player, so the team
      # queue is empty once a player is presented, or once the names-done
      # footer renders (every row decided: a batch that staged teams and no
      # player). Either is the loop's exit. NEO-335 Phase 2: names-done is
      # `Next (Enter)` (a teams / titles step) or `Confirm & Save` (Save), and
      # `Next (Enter)` has no accessible name, so the exit predicate and the
      # post-condition match on TEXT: the player's skip control reads
      # `Skip — not a person` (`.` for the em dash), and a full match keeps
      # `Skip remaining names (N)` and a team's `Skip — not a team` out.
      #
      # Each presented team or league step is CHECKED, then SKIPPED:
      #  * the check is POSITIVE, on the pinned footer control (README →
      #    "Asserting inside a dialog": header and footer only). Its
      #    accessible name is `Skip <row name> — not a team` (`— this team has
      #    no league` on a league step), the same `current.name` the heading
      #    prints, so `[^,]+` is the claim "this step's name has no comma".
      #    The alternation's player branch is there for the TOCTOU the util
      #    documents: the previous iteration's skip can land after this
      #    iteration's guard read, and the wizard is then already on the
      #    player (or, with no player, onto Save's `Confirm & Save`; a late
      #    landing onto a teams/titles step's `Next (Enter)` has no accessible
      #    name to alternate on, so that one residual race fails this wait
      #    by name rather than passing). A comma-joined team step matches
      #    neither branch, and the
      #    wait fails naming the selector. That is the regression this flow
      #    exists to catch (before NEO-333 the wizard presented exactly
      #    `New Team: Cleveland Guardians, Washington Nationals`).
      #  * the same check refuses a step for either HALF of PDA-WW's value.
      #    Both clubs are single catalogue rows, so the split parts must each
      #    resolve (`chooseCandidateTeams` → the review gate) and raise
      #    nothing. A step named `Boston Red Sox` or `Detroit Tigers` means
      #    the split happened but a part failed to resolve, and the card would
      #    then commit with that club missing. `(?!…)` is a lookahead in the
      #    driver's Java regex (the alias flow uses one too). A staged
      #    Wikidata stint at either club resolves to the same current row, so
      #    it raises no step either.
      #  * WHY THESE CHECKS SEE BSC's VALUES (NEO-333 fence). Before the
      #    fence, the one-marketplace path snapshotted the candidates before
      #    the fetch's team lookup reached the client. The wizard then saw NO
      #    BSC team name, so (a) passed vacuously, and the commit saved cards
      #    with no team for the background BSC queue to link seconds later.
      #    CI run 38068514601 attempt 2 caught that as (b) reading the row
      #    about 8s after `Saved`. `fetchCardChecklist` now returns a fence,
      #    and the client waits for it on both paths before the candidates go
      #    anywhere. So every BSC team value the gate cannot resolve is a step
      #    here, and only those.
      #  * the heading negative is the same claim read off the body's h3. It
      #    rides on the positive above, so it cannot pass on a dead page
      #    (memory: negative-asserts-pass-on-a-dead-page).
      #  * SKIP, never "Add as New Team": this flow mints no team, which is
      #    what lets STEP 7 count to exactly one. A skipped spelling the
      #    catalogue lacks (or a staged career team) only leaves THAT club off
      #    its card; the card (b) reads needs no team step at all, and fails
      #    there if it did.
      #  * `optional: true` on the tap is the util's documented TOCTOU
      #    tolerance (the control vanishing between guard and tap means the
      #    row was answered); R2 is held by the hard post-condition after the
      #    loop.
      - repeat:
          times: 40
          while:
            notVisible:
              text: "Skip . not a person|Next \\(Enter\\)|.*Confirm & Save.*"
          commands:
            - runFlow:
                when:
                  visible:
                    id: "Skip .* — (not a team|this team has no league)"
                commands:
                  - extendedWaitUntil:
                      visible:
                        id: "Skip (?!Boston Red Sox —|Detroit Tigers —)[^,]+ — (not a team|this team has no league)|Skip .* — not a person|Confirm & Save.*"
                      timeout: 7000
                  - assertNotVisible:
                      text: "New (Team|League): .*,.*|New Team: (Boston Red Sox|Detroit Tigers)"
                  - tapOn:
                      id: "Skip .* — (not a team|this team has no league)"
                      optional: true
      # POST-CONDITION (R2): a player is presented or every row is decided, so
      # every team step was answered. A Convex-free re-render after the last
      # skip's write: the 7000 bar.
      - extendedWaitUntil:
          visible:
            text: "Skip . not a person|Next \\(Enter\\)|.*Confirm & Save.*"
          timeout: 7000

      # THE PLAYERS ARE NOT WHAT THIS FLOW IS ABOUT: skip them all in one
      # press (the Bowman inserts flow's STEP 7). The button renders only
      # while a row is undecided, so it is absent when the loop ended on the
      # names-done footer. Landing on the first player can stage its Wikidata
      # career teams a few seconds later (memory: neo236-wizard-teams-first-
      # walk); those are Wikidata labels, not BSC values, so they are skipped
      # with the players rather than checked. That is why the press is
      # retried once: a late staged row leaves one row undecided after the
      # first press. Skip remaining is an NB write: 7000 (R5).
      - runFlow:
          when:
            visible:
              text: ".*Skip remaining names \\([0-9]+\\).*"
          commands:
            # NEO-335: deciding the last name no longer lands on Save. The
            # wizard walks up to two more screens first, "Cards with no team"
            # (a skipped team spelling leaves its card teamless) and "Card
            # titles", each with "Next (Enter)" and no Confirm & Save. So the
            # press's terminal state is EITHER footer, and
            # `util-wizard-advance-to-save` (below, after this inner branch) presses
            # Next on whatever comes up, leaving every line on its default
            # ("Leave for later" or a pre-filled team, every title kept), until
            # "Ready to save". PDA-WW is not on the teams step: both its clubs
            # resolve, so it never saves teamless. Teams and titles are not
            # this flow's claim; (b) below reads what the save stored.
            - retry:
                maxRetries: 1
                commands:
                  - tapOn:
                      text: ".*Skip remaining names \\([0-9]+\\).*"
                  - extendedWaitUntil:
                      visible:
                        text: "Next \\(Enter\\)|.*Confirm & Save.*"
                      timeout: 7000
      - runFlow: util-wizard-advance-to-save.yaml
      - tapOn:
          text: ".*Confirm & Save.*"

# BOTH SHAPES END HERE (R2's hard result). On the direct path the notice is
# already up; after the wizard it is the commit, an NB write: the 7000 bar
# (R5; measured 0.33s on this flow in #316's green run).
- extendedWaitUntil:
    visible:
      text: ".*Saved [1-9][0-9]* cards?.*"
    timeout: 7000

# ============================================================
# STEP 6 — CLAIM (b): PDA-WW'S ROW READS BOTH CLUBS, RESOLVED
#
# The checklist rows render from `getCardChecklist` after the commit, so this
# is a read-back of what was stored, not an echo of the wizard's draft
# (memory: draft-echo-is-not-a-read-back). The sub-line is ONE text node:
# the linked teams' `teamFullName`s joined ", ", then " · /N", " · <x> auto".
# A FULL match, so:
#  * an unresolved name — `<name> (unconfirmed)` — cannot answer;
#  * a card that linked only one of the clubs cannot answer;
#  * either order is accepted: BSC's order is kept for display, but the row
#    reads its team rows through a query, and the claim is "both", not "in
#    BSC's order".
# No other card in the set carries either club, so the pair IS PDA-WW.
# The links are written BY THE SAVE (the NEO-333 fence: the candidates carry
# the fetch's teams into the commit), so the row is final the moment `Saved`
# renders and the 7000 bar is the whole budget. Before the fence they came
# from the background BSC queue, one card at a time, and this read missed by
# about 1s (CI 38068514601 attempt 2). If it ever reds again with the row
# fully on screen in the failure dump, that is the same lateness and a
# product finding, not a timeout to raise.
# The `Saved N cards` notice sits in the checklist header and the rows below
# it, so DOWN. Nothing is tapped, so no centring (R8), and the scroll is the
# assertion (R6). PDA-WW is the list's last row, which the list opens on.
# ============================================================

- scrollUntilVisible:
    element:
      text: "(Boston Red Sox, Detroit Tigers|Detroit Tigers, Boston Red Sox)( · .*)?"
    direction: DOWN
    timeout: 7000

# ============================================================
# STEP 7 — CLAIM (c): NO COMBINED TEAM EXISTS
#
# Exactly one team on the deployment answers to "Boston Red Sox": the
# catalogue's club (measured 2026-10-12 on #314's preview after a full run:
# one row in every sport, no alias carrying the name). A team minted from the
# joined value — by the wizard, the commit or the background enrichment pass —
# would answer too, whichever half came first, and make this "2 matches".
# From two typed characters Team Management asks the server
# (`teams.searchForManagement`, NEO-330) and keeps a row when EVERY typed word
# starts a word of its composed full name or of an alias (`teamMatchesFilter`,
# the same rule the screen's browser-side filter uses). "boston", "red" and
# "sox" all start words of "Boston Red Sox, Detroit Tigers" in either order,
# so "1 match" is the positive and the negative in one read. The counter is
# `teamCounterSentence`: "N teams" browsing, "N match(es)" filtering, plus
# " · K need attention" when any listed row needs it. Scoped to this club
# rather than to a bare "," across every team: a global comma check would
# fail on any other flow's comma-bearing team (career teams staged from
# Wikidata, real names like "Korea, South"), which is not this flow's claim.
#
# A reload separates the database from the session, and lands on the screen
# that owns teams. 30000 on the page gate: openLink is a full reload, the
# in-app-return ceiling profile/credentials-lifecycle and
# checklist-wizard-link-team-saves-alias give the same screen; the gate is
# admin-teams-two-eras' browsing counter.
# ============================================================

- openLink: ${APP_URL || "http://localhost:3000"}/admin/teams
- extendedWaitUntil:
    visible: "[0-9,]+ teams?( . [0-9,]+ need attention)?"
    timeout: 30000
- tapOn: "Filter teams"
- inputText: "Boston Red Sox"
# A Convex read on the search index: the 7000 bar. Full match, so "11
# matches" cannot answer. The browser filters its capped window first and the
# server's answer replaces that count; a combined team minted mid-run sits in
# the window while the catalogue club may not, so the interim count can read
# "1 match" with the WRONG row. The anchored assert below rules that out: the
# combined row's short name is not "(Boston )?Red Sox", and once the server
# answers the counter reads "2 matches" and the anchor is gone.
- extendedWaitUntil:
    visible: "1 match( . [0-9,]+ need attention)?"
    timeout: 7000
# And the one row is the club: the master list prints the SHORT name on its
# first line, anchored under the counter so the filter box (whose VALUE is
# the typed string) cannot answer. The catalogue row stores Location "Boston"
# and Name "Red Sox", so it prints "Red Sox"; "(Boston )?" keeps a row with a
# blank Location (the whole name as its Name) acceptable too.
- assertVisible:
    text: "(Boston )?Red Sox"
    below:
      text: "1 match( . [0-9,]+ need attention)?"

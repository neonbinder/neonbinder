appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Checklist — cancel the entity-review wizard; no cards are saved (per-worker custom set)"
tags:
  - set-selector
---
# R1 — ONE FEATURE: cancelling the NEO-92 EntityReviewWizard (the step-through
# replacement for the old all-at-once UnknownEntitiesDialog) aborts the commit —
# no cards are written and no entities are created. Cancel is available on EVERY
# step of the wizard (not only an initial screen), and it calls a real mutation
# (entityReviewQueue.cancelBatch) whose user-visible effect is identical to
# before: "no cards saved".
#
# NEO-220 EXTENDS THAT ONE FEATURE — cancel no longer throws work away on a
# single click. With a decision on the books it asks "Discard N decision(s)?"
# first, and the answer is honoured BOTH ways. That is the same feature (what
# cancel costs you), not a second one, so it lives here rather than in a flow
# of its own.
#
# WHAT THIS TESTS:
#   - The wizard opens after a fetch that surfaces unknown players.
#   - One name is decided ("Add as New Player").
#   - "Cancel (Esc)" then opens a confirm naming the exact count —
#     "Discard 1 decision?" — rather than closing.
#   - The confirm's own Cancel KEEPS the session: the wizard is still open and
#     the decision is still listed under "Decided (1)".
#   - "Cancel (Esc)" again, then "Discard", closes the wizard without saving.
#   - The status message reads "Fetch cancelled — no cards saved."
#   - The custom card the preamble added is still present (cancel only discards
#     the fetch preview, never previously-saved rows).
#   - The Fetch/Refresh button is still available for a retry.
#
# NOTE ON ESCAPE KEY (unchanged from the old flow): Maestro's web driver cannot
#   drive a document-level keydown, so the physical Escape key path is not tested
#   here. "Cancel (Esc)" calls the same onCancel path as the key — tapping the
#   button is sufficient to prove the cancel logic.
#
# ── DATA-ISOLATION MIGRATION (was: shared real "2024 Topps Chrome Base") ──
#   This flow used to add its custom card to the SHARED real "2024 Topps Chrome
#   Base" variant AND then deliberately CANCEL — leaving the card behind with
#   CDPlayerA/CDPlayerB-${ATTEMPT_ID} never created as players. Because
#   fetchCardChecklist's custom-card pending-name pass reads ALL custom cards on
#   a selectorOptionId GLOBALLY (no author scoping), that abandoned card seeded
#   OTHER runners' wizard batches with this flow's unknown names.
#
#   Proven in CI run 30505189226: this flow (runner 4) typed
#   CDPlayerA/CDPlayerB-r4-a1-27829 at 01:30:33 and cancelled; 91s later
#   checklist-keyboard-only-dialog (runner 2) opened its wizard on 3 unknowns
#   instead of its own 1, and failed. This flow is the polluter, and it also
#   accumulated a junk card into the shared read-only set on every attempt
#   (screenshot evidence: "Cards (337)" against "Found 335 cards").
#
#   The old header claimed "a custom subtree short-circuits the fetch to empty,
#   so there is no per-worker-custom alternative here". That is STALE: NEO-92
#   changed the custom-subtree branch of fetchCardChecklist to call the shared
#   resolveUnknownsAndStartBatch helper, so a custom subtree's own custom cards'
#   pendingPlayerNames DO open the review wizard. The sibling flow
#   checklist-fetch-unknown-entities-link-existing.yaml already runs the full
#   wizard this way and passes.
#
#   WHY A CUSTOM SET UNDER *REAL* Baseball/2024/Topps (not a synthetic sport):
#     A custom SET node makes the whole subtree custom (isCustomSubtree → BSC/SL
#     skipped, NEO-22), so the wizard opens ONLY from this worker's own custom
#     cards' pending names. Keeping the REAL "Baseball" sport ancestor means
#     fetchCardChecklist still derives sport="baseball" (selectorOptions.ts
#     lowercases the sport ancestor's value), so the wizard's entity lookup
#     behaves exactly as on the old real-Base path. Same Baseball/2024/Topps
#     custom-set pattern as team-picker.yaml, set-attributes-edit.yaml and the
#     link-existing flow.
#
#   NO NEW REAL SET IS SYNCED BY THIS FLOW. See .maestro/SET-REGISTRY.md —
#   adding a real marketplace set costs a 30–90s sync and requires explicit
#   owner approval.
#
#   THE CANCEL RETRY IS GONE. The old flow wrapped the Cancel tap in a
#   `retry: maxRetries: 1` whose own comment stated the cause: "a DIFFERENT
#   concurrent CI runner exercising the wizard against this SAME real 2024 Topps
#   Chrome Base set can commit the shared batch mid-tap … so Maestro's captured
#   tap coordinates go stale". On a private per-worker subtree no other runner
#   can touch this batch, so that cause is eliminated and the retry is removed
#   rather than carried forward as an unexplained allowance. `retryTapIfNoChange`
#   (the maestro-native single-tap nudge) is kept.
#
# WIZARD GUARANTEE: the preamble adds a custom card carrying TWO per-attempt-
#   unique player names (CDPlayerA/CDPlayerB-${ATTEMPT_ID}), so the wizard always
#   opens with at least two undecided items — enough to prove cancel works with
#   outstanding items. An empty players/teams DB is NOT required.
#
# PRE-CLEAN IS PRIVATE (self-heal, not cross-runner): ATTEMPT_ID is unique per
#   RETRY and setup.yaml's global reset runs once per CI run, so a mid-flow
#   failure can leave THIS worker's own pending unknowns on the subtree. Step 1
#   clears that debris on this worker's own private subtree, so a retry starts as
#   clean as attempt-1. On attempt-1 the subtree is empty → the fetch just
#   commits "Saved 0 cards" (no wizard) — a quick custom-subtree round-trip.
#
# R3 — DEDUP: the keyboard Enter-commit is covered by
#   checklist-keyboard-only-dialog and "Link to Existing" by the link-existing
#   flow; this flow uniquely covers the cancel path.

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# DRILL TO A PER-WORKER CUSTOM SET UNDER REAL Baseball/2024/Topps
# fcd-<worker> is unique per worker → private selectorOptionId. The card this
# flow deliberately abandons can no longer reach any other flow's wizard.
# ============================================================

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "fcd-${WORKER_INDEX || 0}"
      VARIANT_TYPE: "Insert"
      VARIANT: "Base"

# ============================================================
# STEP 1 — PRIVATE SELF-HEAL PRE-CLEAN (this worker's own subtree only)
# If a wizard opens here it can only be leftover debris from THIS worker's own
# prior failed attempt (the subtree is private), so bulk-confirm every
# pre-existing unknown to commit + clear it. That guarantees the wizard opened
# in Step 3 contains only this attempt's CDPlayerA/CDPlayerB.
#
# The Sync button (aria "Sync card checklist") is the empty-state "Fetch from
# Marketplaces" button when the checklist is empty (attempt-1) OR the header
# "Refresh" button when debris cards exist (retry) — exactly one renders at a
# time, so targeting it by aria-label is unambiguous.
# ============================================================

- scrollUntilVisible:
    element:
      id: "Sync card checklist"
    centerElement: true
    timeout: 10000
- tapOn:
    id: "Sync card checklist"
- extendedWaitUntil:
    visible:
      text: ".*Confirm New Players.*|.*Saved [0-9]+ cards.*"
    timeout: 60000
- runFlow:
    when:
      visible: "Confirm New Players & Teams"
    commands:
      - runFlow:
          when:
            visible:
              text: ".*Add All Remaining as New.*"
          commands:
            - tapOn:
                text: ".*Add All Remaining as New.*"
      # NEO-221 — the bulk add now decides only rows whose Wikidata lookup has
      # SETTLED, staying armed for the rest, so this wait is gated on that live
      # external round-trip rather than on one mutation. Raised from 30s for that
      # reason; it resolves the moment the wizard is done, so a healthy run pays
      # nothing for the bigger ceiling.
      - extendedWaitUntil:
          visible:
            text: ".*Confirm & Save.*"
          timeout: 120000
      - tapOn:
          text: ".*Confirm & Save.*"
      # NEO-163: no gate on the wizard closing. The "Saved N cards" wait below is
      # a positive terminal signal proving the same thing and more, so this
      # negative gate against a repainting node only added a failure mode.
- extendedWaitUntil:
    visible:
      text: ".*Saved [0-9]+ cards.*"
    # NEO-163: absorbs the removed notVisible gate's budget.
    timeout: 120000

# ============================================================
# STEP 2 — ADD A CUSTOM CARD WITH TWO UNIQUE PLAYER NAMES
# Guarantees the wizard opens with at least two undecided unknown players, so a
# genuine "cancel with items still outstanding" can be exercised. The custom
# card's players go through fetchCardChecklist's reconciliation via the
# cardChecklist.pendingPlayerNames field.
# ============================================================

- tapOn: "Add Card"
# "Player name" is the card-name input's placeholder (still rendered visually)
# and becomes visible after the autoFocused "#" input renders.
- extendedWaitUntil:
    visible: "Player name"
# Card number includes ATTEMPT_ID so a retry doesn't add a duplicate row.
- inputText: "9001-${ATTEMPT_ID}"
# Address inputs by aria-label (Maestro's `id:` = accessibility-tree identifier).
# Placeholders overlap ("Player name", "Player(s) — comma separated, optional")
# and the text matcher cannot disambiguate them — see NEO-13 root cause.
- tapOn:
    id: "Card name"
- inputText: "Cancel Dialog Test ${ATTEMPT_ID}"
- scrollUntilVisible:
    element:
      text: "Player(s) — comma separated, optional"
    centerElement: true
- tapOn:
    id: "Players"
- inputText: "CDPlayerA-${ATTEMPT_ID}, CDPlayerB-${ATTEMPT_ID}"
# Defensive: confirm at least one typed player name landed before submitting.
- assertVisible:
    text: ".*CDPlayerA-${ATTEMPT_ID}.*"
- scrollUntilVisible:
    element:
      text: "Add"
    centerElement: true
- tapOn:
    text: "Add"
# The new card row renders in the virtualized checklist wherever its number
# sorts — scroll to anchor on its title rather than assuming the viewport.
- scrollUntilVisible:
    element:
      text: "Cancel Dialog Test ${ATTEMPT_ID}"
    timeout: 15000

# ============================================================
# STEP 3 — TRIGGER THE FETCH AND WAIT FOR THE WIZARD
# After the add-custom-card preamble scrolled DOWN, the Sync button can land at
# y~17-49 when centerElement is applied to it directly — inside the 64px sticky
# binder-header (z-20), whose overlay absorbs the tap. Fix: scroll UP to
# "Add Card" (same flex row as "Sync card checklist") so centering it at ~y=315
# puts the Sync button in the tap band.
# ============================================================

- scrollUntilVisible:
    element:
      text: "Add Card"
    direction: UP
    centerElement: true
    visibilityPercentage: 50
- extendedWaitUntil:
    visible:
      id: "Sync card checklist"
- tapOn:
    id: "Sync card checklist"
# The wizard shows the same title text as the old dialog ("Confirm New Players &
# Teams"). This is a private custom subtree (no BSC/SL round-trip), but the
# wizard still resolves each row against the background entity lookup, so 60s
# remains the sanctioned ceiling. The unique CDPlayerA/B-${ATTEMPT_ID} guarantee
# the wizard opens — no escape hatch to "Saved N cards".
- extendedWaitUntil:
    visible:
      text: "Confirm New Players & Teams"
    timeout: 60000

# ============================================================
# STEP 4 — DECIDE ONE NAME, so the cancel has something to lose (NEO-220)
# Cancel used to throw a review session away on one click. It now asks first,
# and only once there IS something to lose: with nothing decided it still
# closes straight away (that is Step 6 below, unchanged).
#
# Step 1's pre-clean guarantees this attempt's two unknowns (CDPlayerA and
# CDPlayerB) are the only items, so deciding one leaves exactly one decision
# on the books and the confirm can name an exact number.
#
# WHICH of the two is presented first is not asserted: the wizard presents the
# first name whose background lookup has SETTLED, and the two lookups race. The
# decision is taken on whichever is on screen, which is all this step needs.
#
# The wait is 30s, not the 7s default: the wizard only offers an action once
# that name's live Wikidata lookup has come back, which is an external
# round-trip (same allowance, and the same number, as the sibling
# checklist-fetch-unknown-entities-link-existing flow).
# ============================================================

- extendedWaitUntil:
    visible:
      id: "Add as New Player"
    timeout: 30000
- tapOn:
    id: "Add as New Player"

# ============================================================
# STEP 5 — CANCEL, THEN CHANGE YOUR MIND — the session is still there
# "Cancel (Esc)" with a decision on the books opens a confirm naming the count.
# Pressing the confirm's own Cancel means "keep working": the wizard is still
# open and the decision is still recorded.
# ============================================================

- tapOn:
    text: "Cancel (Esc)"
    retryTapIfNoChange: true
# The confirm names exactly what is at stake. One decision → "Discard 1
# decision?" (singular), which is also the proof that the decision above landed.
- assertVisible:
    text: "Discard 1 decision.*"
# "Cancel" here is the confirm's own keep-working button, NOT the wizard's
# "Cancel (Esc)" behind it. Anchored below the confirm's explanation so it can
# only be the one inside the dialog.
- tapOn:
    text: "Cancel"
    below:
      text: ".*The same names come back the next time you sync this set.*"

# Nothing was lost: the wizard is still open …
- assertVisible: "Confirm New Players & Teams"
# … and the decision is still on the books, listed under the current name.
- assertVisible:
    text: "Decided \\(1\\)"

# ============================================================
# STEP 6 — CANCEL FOR REAL — confirm the discard, and nothing is saved
# Same "Cancel (Esc)", this time followed through. The confirm's destructive
# button is labelled exactly "Discard" (the dialog's HEADING is the longer
# "Discard 1 decision?"), so this matcher cannot land on the title.
# ============================================================

- tapOn:
    text: "Cancel (Esc)"
    retryTapIfNoChange: true
- tapOn:
    text: "Discard"
- extendedWaitUntil:
    notVisible: "Confirm New Players & Teams"
    timeout: 5000

# ============================================================
# STEP 7 — VERIFY NOTHING WAS SAVED
# ============================================================

# Cancel message — set by CardChecklist's onCancel (cancelBatch + this text).
- assertVisible: "Fetch cancelled — no cards saved."

# Our custom card is still there (cancel only discards the fetch preview).
- scrollUntilVisible:
    element:
      text: "Cancel Dialog Test ${ATTEMPT_ID}"
    centerElement: true
    timeout: 15000

# Fetch/Refresh button still available for a retry — it lives at the TOP of the
# CardChecklist, off-screen after scrolling to the custom card. Scroll UP to it.
- scrollUntilVisible:
    element:
      id: "Sync card checklist"
    direction: UP
    centerElement: true

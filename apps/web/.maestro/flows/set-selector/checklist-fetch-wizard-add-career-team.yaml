appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
# NO COLON IN THIS NAME. Maestro derives the failure-screenshot FILENAME from
# the flow name, and actions/upload-artifact rejects any path containing a colon
# ("The path for one of the files in artifact is not valid ... Contains the
# following character:  Colon :"). That fails the whole runner job — after the
# flows themselves have passed — so CI goes red on a green test run.
#
# It only fires when this flow fails at least once and leaves a
# `screenshot-❌-…(<flow name>).png` behind, which is why it lay dormant from
# 2026-07-24 (#73) until it took down runner (3) on PR #149. Keep flow names to
# em dashes and commas.
name: "Checklist — review wizard adds career-team history to a player row (chip appears, invalid input is a no-op, wizard advances on Add as New)"
tags:
  - set-selector
  - regression
---
# R1 — ONE FEATURE: the NEO-92 follow-up CareerTeamEntry sub-component, rendered
# inline in the EntityReviewWizard ONLY for a player row (kind === "player"). It
# lets the admin hand-add {team, fromYear, toYear?} career-history entries — in
# ADDITION to whatever the background Wikidata lookup found — before choosing
# "Add as New Player". This flow proves that manual-entry mini-form end to end.
#
# R2 — HARD ASSERTIONS, no silent fall-through:
#   - The wizard opens on the unique unknown CareerPlayer-${ATTEMPT_ID} (asserted
#     by the wizard heading — the current item's name; the wizard renders exactly
#     ONE item at a time, so a visible name IS the current item). Because that
#     item is a PLAYER, the manual career-team affordance ("Add career team
#     history manually", aria "Career team name") is asserted PRESENT before the
#     feature action — the R2 precondition guard.
#   - VALIDATION IS ENFORCED, garbage not silently accepted: with a team name but
#     NO from-year, "+ Add" (aria "Add career team") is disabled, so tapping it is
#     a no-op — asserted by the team name STILL sitting in the input (a successful
#     add clears the form) and NO staged-chip list rendering yet.
#   - A VALID add (name + from-year + to-year) makes a chip appear with the exact
#     text "CareerTeam-<token> (2001–2005)" inside the "Staged career teams" list, and
#     clears the mini-form.
#   - The to-year-OPTIONAL branch renders "… (2010–present)"; the per-chip Remove
#     control (aria "Remove {name}") deletes a staged entry.
#   - "Add as New Player" (carrying the one kept staged entry) advances the wizard
#     PAST the player row to the final "All reviewed" step; Confirm & Save commits
#     with no error ("Saved 0 cards"). Because recordDecision re-validates the
#     manual years server-side and commit's resolveTeamIdByName get-or-creates the
#     staged team, a clean "Saved 0 cards" also proves the staged entry round-trips
#     through the decision write AND commit-time team resolution without throwing.
#
# ── PERSISTED-STATE ASSERTION GAP (reported to owner, NOT worked around) ──
#   The manually-staged team IS persisted at commit: resolveTeamIdByName inserts
#   it into `teams` and it is attached to the new player's `teamYears`
#   (selectorOptions.ts ~L4053-4065). But there is NO in-app UI surface to assert
#   it against today:
#     (a) No page renders a player's teamYears / career history at all (verified —
#         teamYears has no consumer outside this wizard).
#     (b) The obvious inverse-check — open the card's TeamPicker and find the new
#         team as an existing row — DOES NOT WORK because of a sport-casing split:
#         commit creates the team with sport="baseball" (lowercased sport ancestor,
#         selectorOptions.ts:3459) while CardDetailPanel's TeamPicker queries
#         teams.list({sport: ancestorSport}) with the RAW "Baseball"
#         (CardChecklist.tsx:79). "baseball" ≠ "Baseball" → the created team is
#         never in that picker's candidate pool. (This is the same casing hazard
#         already documented in checklist-fetch-unknown-entities-link-existing.)
#   So the assertable CEILING for this feature is the wizard chip + successful
#   advance/commit, which this flow asserts fully. Adding a UI surface for a
#   player's career-team history (or aligning the sport casing so the created team
#   shows in the card's TeamPicker) is a PRODUCT change — flagged, not invented.
#
# ── DATA ISOLATION (per-worker custom set — same story as link-existing) ──
#   The whole flow runs on a PER-WORKER CUSTOM SET (cte-${WORKER_INDEX}) under real
#   Baseball/2024/Topps. A custom SET node makes the subtree custom (isCustomSubtree
#   → BSC/SL skipped) so the wizard opens ONLY from THIS worker's own custom card's
#   pending player name — never a shared marketplace fetch — and the selectorOptionId
#   is private to this worker, so no concurrent runner can seed this wizard's batch.
#   Because the SPORT ancestor is real "Baseball", fetchCardChecklist derives
#   sport="baseball" (selectorOptions.ts lowercases it), so the wizard row / the
#   CareerTeamEntry combobox both operate in sport "baseball". Its team-suggestion
#   pool is NOT empty any more — no marketplace populates `teams`, but since
#   NEO-214 removed the seeded fixture the other flows on this deployment create
#   their own teams under Baseball — which is why the names typed below are built
#   from a separator-free attempt token that the search index cannot match. See
#   the note beside that evalScript; the mini-form still accepts a name matching
#   nothing and creates it, and this keeps it matching nothing.
#
# R3 — DEDUP: "Add as New" and "Link to Existing" are covered by
#   checklist-keyboard-only / checklist-fetch-unknown-entities-link-existing. This
#   flow UNIQUELY covers the manual career-team entry sub-component. Navigation
#   reuses util-drill-to-custom (R9), same Baseball/2024/Topps custom-set pattern.
#
# NOTE — no separate `smoke` variant: exercising this feature REQUIRES the full
#   fetch → live-Wikidata-gated wizard path (minutes, external round-trip), so there
#   is no fast happy-path subset that qualifies as a smoke test. It lives with its
#   siblings under set-selector/regression.

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ── A TEAM NAME THAT MATCHES NOTHING, AND THE TOKEN THAT MAKES IT SO ────────
# The two names this flow types must return ZERO suggestions, and that is a hard
# requirement rather than a nicety: CareerTeamEntry's suggestion dropdown is
# `absolute z-10 left-0 right-0`, so the moment it has a single row it covers the
# "From year" box and the "+ Add" button directly beneath it — and it can only be
# closed by picking a suggestion, by a successful add, or by Escape, which
# maestro-web cannot send at all. A tap aimed at "+ Add" then lands on the first
# suggestion, which REPLACES the typed name with that team's. That is exactly how
# this flow failed in CI run 33875599981: the input came back holding another
# worker's "CNAA-1-r1-a1-19072".
#
# What made the list non-empty is that the suggestions come from `teams.search`,
# a Convex SEARCH index — it matches on TOKENS, not substrings. ATTEMPT_ID is
# "r<runner>-a<attempt>-<random>", so every flow that names a team after it
# contributes the token "a1", and "CareerTeam-r3-a1-23945" shares that token with
# every one of them. This flow's header used to be able to say the team pool was
# "routinely empty"; since NEO-214 deleted the seeded fixture, flows create their
# own teams and it never is again.
#
# Stripping the hyphens is what fixes it: "r3-a1-23945" tokenizes as three terms,
# "r3a123945" as one, and no other team in the deployment carries that token or a
# prefix of it. The names stay unique per runner and per attempt exactly as
# before — this only changes how the search index reads them.
- evalScript: ${output.ATTEMPT_ID = output.ATTEMPT_ID || String(Date.now()).slice(-4)}
# Single-quoted, like the evalScript in checklist-pairing-dialog-cancel: the
# expression contains double quotes, and quoting the scalar keeps YAML out of it.
- evalScript: '${output.ATTEMPT_TOKEN = String(output.ATTEMPT_ID).split("-").join("")}'

# ============================================================
# DRILL TO A PER-WORKER CUSTOM SET UNDER REAL Baseball/2024/Topps
# ============================================================

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "cte-${WORKER_INDEX || 0}"
      VARIANT_TYPE: "Insert"
      VARIANT: "Base"

# ============================================================
# STEP 1 — PRIVATE SELF-HEAL PRE-CLEAN (this worker's own subtree only)
# Fetch once BEFORE adding this attempt's card. If a wizard opens it can only be
# leftover debris from THIS worker's own prior failed attempt (private subtree —
# no other runner can write here), so bulk-confirm every pre-existing unknown and
# commit, guaranteeing this attempt's CareerPlayer-${ATTEMPT_ID} is the SOLE unknown
# below. On the clean attempt-1 path the subtree is empty → the fetch just commits
# "Saved 0 cards" (no wizard) — a quick custom-subtree round-trip (no BSC/SL).
# ============================================================

- scrollUntilVisible:
    element:
      id: "Sync card checklist"
    centerElement: true
    timeout: 10000
- tapOn:
    id: "Sync card checklist"
- extendedWaitUntil:
    visible:
      text: ".*Confirm New Players.*|.*Saved [0-9]+ cards.*"
    timeout: 60000
- runFlow:
    when:
      visible: "Confirm New Players & Teams"
    commands:
      - runFlow:
          when:
            visible:
              text: ".*Add All Remaining as New.*"
          commands:
            - tapOn:
                text: ".*Add All Remaining as New.*"
      # NEO-221 — the bulk add now decides only rows whose Wikidata lookup has
      # SETTLED, staying armed for the rest, so this wait is gated on that live
      # external round-trip rather than on one mutation. Raised for that reason;
      # it resolves the moment the wizard is done, so a healthy run pays nothing
      # for the bigger ceiling.
      - extendedWaitUntil:
          visible:
            text: ".*Confirm & Save.*"
          timeout: 120000
      - tapOn:
          text: ".*Confirm & Save.*"
      # NEO-163: no gate on the wizard closing. The "Saved N cards" wait below is
      # a positive terminal signal proving the same thing and more, so this
      # negative gate against a repainting node only added a failure mode.
- extendedWaitUntil:
    visible:
      text: ".*Saved [0-9]+ cards.*"
    # NEO-163: absorbs the removed notVisible gate's budget.
    timeout: 120000

# ============================================================
# STEP 2 — ADD THE CARD WHOSE UNKNOWN PLAYER OPENS THE WIZARD
# A custom card carrying the per-attempt-unique CareerPlayer-${ATTEMPT_ID} in its
# Players field (→ cardChecklist.pendingPlayerNames). That name matches no player
# entity, so the next fetch surfaces it as the SOLE unknown player row.
# ============================================================

- tapOn: "Add Card"
- extendedWaitUntil:
    visible: "Player name"
- inputText: "8003-${ATTEMPT_ID}"
- tapOn:
    id: "Card name"
- inputText: "Career Main Card ${ATTEMPT_ID}"
- scrollUntilVisible:
    element:
      text: "Player(s) — comma separated, optional"
    centerElement: true
- tapOn:
    id: "Players"
- inputText: "CareerPlayer-${ATTEMPT_ID}"
- assertVisible: "CareerPlayer-${ATTEMPT_ID}"
- scrollUntilVisible:
    element:
      text: "Add"
    centerElement: true
- tapOn:
    text: "Add"
- scrollUntilVisible:
    element:
      text: "Career Main Card ${ATTEMPT_ID}"
    timeout: 15000

# ============================================================
# STEP 3 — FETCH AND OPEN THE WIZARD ON THE UNKNOWN PLAYER
# ============================================================

- scrollUntilVisible:
    element:
      text: "Add Card"
    direction: UP
    centerElement: true
    visibilityPercentage: 50
- extendedWaitUntil:
    visible:
      id: "Sync card checklist"
- tapOn:
    id: "Sync card checklist"
- extendedWaitUntil:
    visible:
      text: "Confirm New Players & Teams"
    timeout: 60000

# The wizard presents the unknown once its background Wikidata lookup completes
# (or errors) — a live external round-trip, so 30s (outside the 7s UI budget).
# The wizard shows the CURRENT item's name; assert it is our unknown PLAYER.
- extendedWaitUntil:
    visible:
      text: ".*CareerPlayer-${ATTEMPT_ID}.*"
    timeout: 30000

# ============================================================
# STEP 4 — THE FEATURE: MANUAL CAREER-TEAM ENTRY (player row only)
# R2 precondition guard: the player row must render the manual-entry affordance.
# ============================================================

# Maestro text matchers are full-node-anchored regexes; the <p>'s text is
# "Add career team history manually (optional):", so wrap with .* to match it
# as a substring.
- assertVisible:
    text: ".*Add career team history manually.*"
- assertVisible:
    id: "Career team name"

# ── 4a. VALIDATION: name but NO from-year → "+ Add" disabled → tap is a no-op ──
# Type only the team name, then tap "+ Add" (aria "Add career team"). Because
# from-year is empty the button is disabled, so nothing is staged: the name is
# STILL in the input (a successful add clears the form) and no staged-chip list
# has rendered. This proves garbage is not silently accepted.
- tapOn:
    id: "Career team name"
- inputText: "CareerTeam-${ATTEMPT_TOKEN}"
- tapOn:
    id: "Add career team"
- assertVisible:
    id: "Career team name"
    text: ".*CareerTeam-${ATTEMPT_TOKEN}.*"
- assertNotVisible:
    id: "Staged career teams"

# ── 4b. VALID add (name already typed + from-year + to-year) → chip appears ──
- tapOn:
    id: "From year"
- inputText: "2001"
- tapOn:
    id: "To year \\(optional\\)"
- inputText: "2005"
- tapOn:
    id: "Add career team"
# Chip text: "{name} ({fromYear}–{toYear})" — the separator is an en-dash (U+2013),
# matched here with "." to avoid a literal-unicode YAML matcher; parens escaped.
- assertVisible:
    text: ".*CareerTeam-${ATTEMPT_TOKEN} \\(2001.2005\\).*"

# ── 4c. to-year OPTIONAL branch ("–present") + the per-chip Remove control ──
# Add a second, throwaway entry with NO to-year → chip reads "… (2010–present)",
# then remove it (aria "Remove {name}") so only the first entry is committed.
- tapOn:
    id: "Career team name"
- inputText: "TempTeam-${ATTEMPT_TOKEN}"
- tapOn:
    id: "From year"
- inputText: "2010"
- tapOn:
    id: "Add career team"
- assertVisible:
    text: ".*TempTeam-${ATTEMPT_TOKEN} \\(2010.present\\).*"
- tapOn:
    id: "Remove TempTeam-${ATTEMPT_TOKEN}"
- assertNotVisible:
    text: ".*TempTeam-${ATTEMPT_TOKEN}.*"
# The kept entry is still staged.
- assertVisible:
    text: ".*CareerTeam-${ATTEMPT_TOKEN} \\(2001.2005\\).*"

# ============================================================
# STEP 5 — ADD AS NEW PLAYER (carrying the staged team) → WIZARD ADVANCES
# recordDecision(create, manualCareerTeams) re-validates the years server-side.
# CareerPlayer is the SOLE unknown on this private subtree → the wizard reaches the
# final "All reviewed" step. Confirm & Save commits (0 marketplace cards on a custom
# subtree) — a clean "Saved 0 cards" proves the staged entry survived recordDecision
# AND commit-time resolveTeamIdByName (team get-or-create) without error.
# ============================================================

- tapOn: "Add as New Player"
- extendedWaitUntil:
    visible:
      text: ".*Confirm & Save.*"
    timeout: 30000
# The player row is gone (advanced past it) — the manual-entry affordance no longer
# shows, confirming the create decision took effect and moved the wizard forward.
# (.* wrap so this genuinely asserts the substring is absent — a bare, anchored
# regex would false-pass since it never full-matches the "(optional):" node.)
- assertNotVisible:
    text: ".*Add career team history manually.*"
- tapOn:
    text: ".*Confirm & Save.*"
# NEO-163: the positive gate below proves the wizard closed AND the save
# landed. Waiting on the modal vanishing raced the "Saving..." state.
- extendedWaitUntil:
    visible:
      text: ".*Saved [0-9]+ cards.*"
    timeout: 30000

# ============================================================
# CLEANUP — delete this attempt's test card so the subtree stays clean
# ============================================================

- scrollUntilVisible:
    element:
      id: "Delete card 8003-${ATTEMPT_ID}"
    centerElement: true
    visibilityPercentage: 50
    timeout: 15000
- tapOn:
    id: "Delete card 8003-${ATTEMPT_ID}"
- assertVisible: "Confirm?"
- tapOn:
    id: "Confirm delete card 8003-${ATTEMPT_ID}"
- assertNotVisible: "Career Main Card ${ATTEMPT_ID}"

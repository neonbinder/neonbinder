appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Checklist — the review wizard never loses a decision — Back re-shows one, and a reload resumes the session with a newly-added name"
tags:
  - set-selector
---
# ════════════════════════════════════════════════════════════════════════════
# R1 — ONE FEATURE (NEO-220 / NEO-221): a review session is DURABLE. A decision
# you have already taken can be looked at again without being re-asked, and it
# survives losing the screen entirely — reopen the wizard and it is still there,
# alongside any name that turned up while you were away.
#
# WHAT THIS PROVES, in the order the flow proves it:
#   1. Two unknown names on one card open the wizard with both of them —
#      "Add All Remaining as New (2)" is the count, read straight off the
#      footer.
#   2. Deciding the presented name drops that count to (1) and reveals "Back".
#   3. "Back" re-shows the decision READ-ONLY — "Already decided: Added as new",
#      with "Change decision" and "Next" — instead of asking the same question
#      twice. Nothing is written by looking.
#   4. "Next" hands the wizard back its own rule and returns to the undecided
#      name.
#   5. A full page reload throws the wizard away WITHOUT discarding the batch
#      (no Cancel, no Confirm — the operator simply lost the tab).
#   6. A third name is added on a second card, and the next sync RESUMES the
#      same session: the footer reads "Add All Remaining as New (2)" again —
#      three names, one of them still decided — and "Decided (1)" still lists
#      the name decided before the reload.
#
#      That single number is the whole assertion, and it is exact on purpose:
#        • (2) — resumed, additive: the new name joined, the decision survived.
#        • (1) — the new name was NOT added (a resume that touches nothing).
#        • (3) — a brand-new batch: the decision was thrown away.
#      Nothing else on screen distinguishes those three outcomes.
#   7. Bulk-adding the rest and saving commits with no "names were not
#      reviewed" note — every name in the resumed batch was answered.
#
# WHY NOT "Back to matching" (the footer button of the same family):
#   It renders only when a PAIRING session is parked behind the wizard, and a
#   pairing session only exists on a REAL marketplace-backed set. Reaching the
#   wizard from one means CONFIRMING the pairing, which writes cards to that
#   shared set — forbidden by R7a / SET-REGISTRY.md, and not something a
#   per-worker custom subtree can stand in for (a custom subtree is
#   short-circuited before any marketplace call, NEO-22, so it produces no
#   candidates and no pairing modal at all). It is unit-covered instead. The
#   in-body "Back" this flow DOES drive is the other half of the same feature:
#   returning to a decision without re-opening the question.
#
# R3 — DEDUP: the discard-confirm ("Discard N decisions?", keep and discard) is
#   checklist-fetch-cancel-dialog's; the keyboard commit is
#   checklist-keyboard-only-dialog's; "Link to Existing" is the link-existing
#   flow's. This flow is the only one that reloads mid-session, and the only one
#   that reads the footer count as evidence.
#
# R7a / DATA ISOLATION — every write goes to `wbr-${WORKER_INDEX}`, a per-worker
#   CUSTOM set under the REAL Baseball / 2024 / Topps ancestors (registered in
#   .maestro/SET-REGISTRY.md). A custom Set node makes the subtree custom
#   (isCustomSubtree, NEO-22) so no BSC/SportLots call fires and nothing shared
#   is read or written; keeping the real Baseball ancestor means
#   fetchCardChecklist still derives sport="baseball", so the entity lookups
#   behave exactly as they do on a real set. No real set is synced by this flow.
#
#   The set name carries no ATTEMPT_ID: the batch under test has to survive
#   between two syncs on the SAME selectorOption, and Step 1's pre-clean is what
#   makes a retry start clean instead. The card NUMBERS and player NAMES do
#   carry ATTEMPT_ID, so a retry never reads a previous attempt's names.
# ════════════════════════════════════════════════════════════════════════════

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ════════════════════════════════════════════════════════════════════════════
# DRILL to this worker's private custom set (R9 — the util owns the drill).
# ════════════════════════════════════════════════════════════════════════════

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "wbr-${WORKER_INDEX || 0}"
      VARIANT_TYPE: "Insert"
      VARIANT: "Base"

# ════════════════════════════════════════════════════════════════════════════
# STEP 1 — PRIVATE SELF-HEAL PRE-CLEAN (this worker's own subtree only)
# Sync once BEFORE adding this attempt's cards. Anything the wizard surfaces
# here is debris from THIS worker's own earlier attempt — the subtree is
# private, so no other runner can have put it there — and bulk-confirming it
# commits the names away, leaving this attempt's three the only ones below. On
# attempt 1 the subtree is empty and the sync just reports "Saved 0 cards".
#
# The Sync control is the empty-state "Fetch from Marketplaces" button when the
# checklist is empty and the header "Refresh" button once cards exist; exactly
# one renders, so its aria-label is unambiguous either way.
# ════════════════════════════════════════════════════════════════════════════

- scrollUntilVisible:
    element:
      id: "Sync card checklist"
    centerElement: true
    timeout: 10000
- tapOn:
    id: "Sync card checklist"
- extendedWaitUntil:
    visible:
      text: ".*Confirm New Players.*|.*Saved [0-9]+ cards.*"
    timeout: 60000
- runFlow:
    when:
      visible: "Confirm New Players & Teams"
    commands:
      - runFlow:
          when:
            visible:
              text: ".*Add All Remaining as New.*"
          commands:
            - tapOn:
                text: ".*Add All Remaining as New.*"
      # NEO-221 — the bulk add now decides only rows whose Wikidata lookup has
      # SETTLED, staying armed for the rest, so this wait is gated on that live
      # external round-trip rather than on one mutation. It resolves the moment
      # the wizard is done, so a healthy run pays nothing for the ceiling.
      - extendedWaitUntil:
          visible:
            text: ".*Confirm & Save.*"
          timeout: 120000
      - tapOn:
          text: ".*Confirm & Save.*"
- extendedWaitUntil:
    visible:
      text: ".*Saved [0-9]+ cards.*"
    timeout: 120000

# ════════════════════════════════════════════════════════════════════════════
# STEP 2 — ONE CARD, TWO UNKNOWN NAMES
# Two names on one card is what gives the wizard a second row to walk to after
# the first is decided — which is the only condition under which "Back" exists
# at all (there is nothing to go back to on a one-name batch).
# ════════════════════════════════════════════════════════════════════════════

- tapOn:
    id: "Open add card form"
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 15000
# The card-number input is autofocused — type straight into it.
- inputText: "9301-${ATTEMPT_ID}"
- tapOn:
    id: "Card name"
- inputText: "Back And Resume A ${ATTEMPT_ID}"
- tapOn:
    id: "Players"
- inputText: "WbrPlayerA-${ATTEMPT_ID}, WbrPlayerB-${ATTEMPT_ID}"
# Defensive: at least one typed name landed in the field before submitting.
- assertVisible:
    text: ".*WbrPlayerA-${ATTEMPT_ID}.*"
- scrollUntilVisible:
    element:
      id: "Submit new card"
    centerElement: true
    timeout: 10000
- tapOn:
    id: "Submit new card"
# Virtuoso renders only rows near the scroll position, so scroll to materialise
# the new one rather than waiting on its text.
- scrollUntilVisible:
    element:
      id: "Edit card 9301-${ATTEMPT_ID}"
    centerElement: true
    visibilityPercentage: 50
    timeout: 15000

# ════════════════════════════════════════════════════════════════════════════
# STEP 3 — SYNC, AND READ THE SESSION'S SIZE OFF THE FOOTER
# Scroll UP to the add-card button (same flex row as the Sync control) and
# centre it, so the Sync button lands clear of the sticky binder-header.
# ════════════════════════════════════════════════════════════════════════════

- scrollUntilVisible:
    element:
      id: "Open add card form"
    direction: UP
    centerElement: true
    visibilityPercentage: 50
    timeout: 10000
# The scroll targeted the add-card button; the Sync control is its neighbour in
# the same row, so check THAT one is on screen before reaching for it (R6 does
# not apply — different element).
- extendedWaitUntil:
    visible:
      id: "Sync card checklist"
- tapOn:
    id: "Sync card checklist"
- extendedWaitUntil:
    visible:
      text: "Confirm New Players & Teams"
    timeout: 60000

# TWO names, none decided. The footer count is the session's size, and it is
# what every later assertion in this flow is measured against.
- assertVisible:
    text: ".*Add All Remaining as New \\(2\\).*"

# ════════════════════════════════════════════════════════════════════════════
# STEP 4 — DECIDE THE PRESENTED NAME
# WHICH of the two is presented is not asserted: the wizard shows the first
# name whose background lookup has SETTLED and the two lookups race. Whichever
# it is, deciding it is what this step needs.
#
# 30s, not the 7s default: the action only appears once that name's live
# Wikidata lookup has come back — an external round-trip, the same allowance
# (and the same number) the sibling link-existing flow uses.
# ════════════════════════════════════════════════════════════════════════════

- extendedWaitUntil:
    visible:
      id: "Add as New Player"
    timeout: 30000
- tapOn:
    id: "Add as New Player"

# One decided, one to go — the count moved, which is what proves the decision
# was recorded rather than merely clicked.
- extendedWaitUntil:
    visible:
      text: ".*Add All Remaining as New \\(1\\).*"

# ════════════════════════════════════════════════════════════════════════════
# STEP 5 — "Back" RE-SHOWS THE DECISION WITHOUT RE-ASKING
# A misclick used to be unrecoverable: the wizard walked forward only. "Back"
# now presents the last decision READ-ONLY — it states what was decided and
# offers the two things worth doing with it, "Change decision" and "Next".
# Looking writes nothing.
# ════════════════════════════════════════════════════════════════════════════

# "Back" only exists while a QUESTION is on screen, and the second name's
# question only appears once ITS live lookup has landed — hence the same 30s
# external-round-trip allowance as Step 4.
- extendedWaitUntil:
    visible:
      id: "Back to previous decision"
    timeout: 30000
- tapOn:
    id: "Back to previous decision"
# "Change decision" belongs to the read-only panel and to nothing else — the
# list of decided names further down offers a bare "Change" — so this is the
# proof the panel opened rather than the list merely being on screen.
- assertVisible: "Change decision"
# And it states WHAT was decided, rather than asking again.
- assertVisible: "Added as new"

# ════════════════════════════════════════════════════════════════════════════
# STEP 6 — "Next" GOES BACK TO THE QUESTION STILL OUTSTANDING
# The read-only panel is gone and the action row is back, so the operator is
# being asked about the undecided name again — not the decided one.
#
# "Next" is the panel's own link and the only bare "Next" the app renders (the
# card drawer's is "Next card"), so it needs no anchor.
# ════════════════════════════════════════════════════════════════════════════

- tapOn: "Next"
# The panel's own control is gone …
- extendedWaitUntil:
    notVisible: "Change decision"
# … and a question is being asked again. (The other name's lookup landed long
# ago — Step 5 waited for it — so this is the 7s default.)
- assertVisible:
    id: "Add as New Player"
# Still one decided, one outstanding — "Back" and "Next" moved the view, not
# the data.
- assertVisible:
    text: ".*Add All Remaining as New \\(1\\).*"

# ════════════════════════════════════════════════════════════════════════════
# STEP 7 — LOSE THE SCREEN
# A real reload, not a Cancel and not a Confirm: this is the operator whose tab
# closed, whose laptop slept, who clicked a link. The wizard is client state and
# goes with it; the review session is server state and must not. openLink is the
# same real-reload idiom setup.yaml uses to reset scroll.
# ════════════════════════════════════════════════════════════════════════════

- openLink: ${APP_URL || "http://localhost:3000"}/set-selector
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000
# The wizard really is gone — otherwise the rest of this flow would be reading
# the state it was supposed to have lost.
- assertNotVisible: "Confirm New Players & Teams"

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "wbr-${WORKER_INDEX || 0}"
      VARIANT_TYPE: "Insert"
      VARIANT: "Base"

# ════════════════════════════════════════════════════════════════════════════
# STEP 8 — A THIRD NAME TURNS UP WHILE THE SESSION IS UNATTENDED
# A second card, one new player name. Nothing about it is special — it is the
# ordinary case of the checklist changing between two syncs, which is exactly
# what the resumed session has to cope with.
# ════════════════════════════════════════════════════════════════════════════

- tapOn:
    id: "Open add card form"
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 15000
- inputText: "9302-${ATTEMPT_ID}"
- tapOn:
    id: "Card name"
- inputText: "Back And Resume C ${ATTEMPT_ID}"
- tapOn:
    id: "Players"
- inputText: "WbrPlayerC-${ATTEMPT_ID}"
- assertVisible:
    text: ".*WbrPlayerC-${ATTEMPT_ID}.*"
- scrollUntilVisible:
    element:
      id: "Submit new card"
    centerElement: true
    timeout: 10000
- tapOn:
    id: "Submit new card"
- scrollUntilVisible:
    element:
      id: "Edit card 9302-${ATTEMPT_ID}"
    centerElement: true
    visibilityPercentage: 50
    timeout: 15000

# ════════════════════════════════════════════════════════════════════════════
# STEP 9 — THE SESSION RESUMES: THE DECISION KEPT, THE NEW NAME JOINED
# ════════════════════════════════════════════════════════════════════════════

- scrollUntilVisible:
    element:
      id: "Open add card form"
    direction: UP
    centerElement: true
    visibilityPercentage: 50
    timeout: 10000
# The scroll targeted the add-card button; the Sync control is its neighbour in
# the same row, so check THAT one is on screen before reaching for it (R6 does
# not apply — different element).
- extendedWaitUntil:
    visible:
      id: "Sync card checklist"
- tapOn:
    id: "Sync card checklist"
- extendedWaitUntil:
    visible:
      text: "Confirm New Players & Teams"
    timeout: 60000

# ── THE CORE ASSERTION ──────────────────────────────────────────────────────
# THREE names now, ONE of them already decided → two remaining. See the header
# for why (1) and (3) are the two ways this can go wrong and why no other
# on-screen fact separates them.
- extendedWaitUntil:
    visible:
      text: ".*Add All Remaining as New \\(2\\).*"

# And the decision itself is still on the books, listed by name — the wizard is
# offering to CHANGE it, not to ask the question again.
- assertVisible:
    text: "Decided \\(1\\)"
- assertVisible:
    id: "Change decision for Wbr.*-${ATTEMPT_ID}"

# ════════════════════════════════════════════════════════════════════════════
# STEP 10 — FINISH THE SESSION AND SAVE
# Every remaining name answered, so the commit reports no unreviewed names. The
# positive "Saved N cards." assertion comes first deliberately: a notVisible on
# a page that failed to render would otherwise pass for free.
# ════════════════════════════════════════════════════════════════════════════

- tapOn:
    text: ".*Add All Remaining as New.*"
# NEO-221 — gated on the live Wikidata lookups for the rows still settling, not
# on a single mutation. See Step 1.
- extendedWaitUntil:
    visible:
      text: ".*Confirm & Save.*"
    timeout: 120000
- tapOn:
    text: ".*Confirm & Save.*"
- extendedWaitUntil:
    visible:
      text: ".*Saved [0-9]+ cards.*"
    timeout: 120000
# NEO-221 (D12) — the commit says so when names went unanswered. None did here,
# so the banner is the plain "Saved N cards." and nothing more.
- assertNotVisible:
    text: ".*were not reviewed.*"

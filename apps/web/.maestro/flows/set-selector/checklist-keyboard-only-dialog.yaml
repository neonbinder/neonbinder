appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Checklist — keyboard-only confirm of the review wizard's final Save step via Enter (per-worker custom set)"
tags:
  - set-selector
---
# R1 — ONE FEATURE: a keyboard user can complete the NEO-92 EntityReviewWizard
# and commit with the Enter key. After every unknown name is decided, the wizard
# shows a final "All reviewed — save N cards?" step whose "Confirm & Save (Enter)"
# button is AUTO-FOCUSED (confirmButtonRef.focus() on the allDecided transition),
# and the wizard's keydown handler fires onConfirm on Enter when allDecided. This
# proves the keyboard path end-to-end without touching the mouse for the commit.
#
# WHAT THIS TESTS:
#   1. The wizard opens after a fetch that surfaces one unknown player.
#   2. Every unknown is decided via the bulk "Add All Remaining as New (N)"
#      button, reaching the final "All reviewed" step (this tap is the one
#      click; the commit is keyboard).
#   3. The final "Confirm & Save (Enter)" button is auto-focused, so pressing
#      Enter immediately fires onConfirm and commits — no prior navigation.
#   4. Cards are saved after the keyboard-only confirmation.
#
# MAESTRO KEYBOARD CONSTRAINTS (carried forward, re-verified for the wizard):
#   - `pressKey: Tab` is NOT supported on Maestro web. Not needed: the wizard
#     shows one item at a time, so there is no multi-control Tab traversal to
#     drive (the old checkbox-list keyboard model is gone).
#   - `pressKey: Escape` does NOT reach the wizard's div-level keydown handler
#     (Maestro can't originate a document/element keydown that bubbles there
#     unless the element is focused), so the Escape-cancels path is exercised
#     manually, not here. The link-search sub-panel's own Escape (on its focused
#     input) and the throughout-available Cancel button are covered by
#     checklist-fetch-cancel-dialog.yaml and the link-existing flow.
#   - `pressKey: Enter` IS supported and fires the focused element's handler.
#     On the final step the confirm button is auto-focused, so Enter goes
#     straight to onConfirm — the mechanism the old dialog relied on, unchanged.
#
# ── DATA-ISOLATION MIGRATION (was: shared real "2024 Topps Chrome Base") ──
#   This flow used to add a custom card to the SHARED real "2024 Topps Chrome
#   Base" variant. Its old header claimed "PER-ATTEMPT ISOLATION: KOPlayer-
#   ${ATTEMPT_ID} is unique per attempt, so the wizard always opens with exactly
#   this one fresh unknown" — that reasoned about PRIOR RUNS and ignored
#   CONCURRENT WORKERS. fetchCardChecklist's custom-card pending-name pass reads
#   ALL custom cards on a selectorOptionId GLOBALLY (no author scoping), so a
#   concurrent runner's custom card on that same shared variant seeds THIS flow's
#   wizard batch with foreign unknown names.
#
#   Proven in CI run 30505189226: checklist-fetch-cancel-dialog (runner 4) typed
#   CDPlayerA/CDPlayerB-r4-a1-27829 into the shared set at 01:30:33 and then
#   CANCELLED — leaving its custom card behind with those player names never
#   created. 91s later THIS flow's sync (runner 2) surfaced 3 unknowns, not 1.
#
#   The old header also claimed "a custom subtree short-circuits the fetch to
#   empty, so there is no per-worker-custom alternative here". That is STALE:
#   NEO-92 changed the custom-subtree branch of fetchCardChecklist to call the
#   shared resolveUnknownsAndStartBatch helper, so a custom subtree's own custom
#   cards' pendingPlayerNames DO open the review wizard. The sibling flow
#   checklist-fetch-unknown-entities-link-existing.yaml already runs the full
#   wizard this way and passes.
#
#   WHY A CUSTOM SET UNDER *REAL* Baseball/2024/Topps (not a synthetic sport):
#     A custom SET node makes the whole subtree custom (isCustomSubtree → BSC/SL
#     skipped, NEO-22), so the wizard opens ONLY from this worker's own custom
#     cards' pending names. Keeping the REAL "Baseball" sport ancestor means
#     fetchCardChecklist still derives sport="baseball" (selectorOptions.ts
#     lowercases the sport ancestor's value), so the wizard's entity lookup and
#     roster context behave exactly as on the old real-Base path. Same
#     Baseball/2024/Topps custom-set pattern as team-picker.yaml,
#     set-attributes-edit.yaml and the link-existing flow.
#
#   NO NEW REAL SET IS SYNCED BY THIS FLOW. See .maestro/SET-REGISTRY.md —
#   adding a real marketplace set costs a 30–90s sync and requires explicit
#   owner approval.
#
# PRE-CLEAN IS PRIVATE (self-heal, not cross-runner): ATTEMPT_ID is unique per
#   RETRY (w<n>-a<attempt>-<rand>) and setup.yaml's global reset runs once per CI
#   run, so a mid-flow failure BETWEEN wizard-open and commit leaves THIS worker's
#   own pending unknown on the subtree. Step 1 fetches and bulk-confirms any
#   leftover debris on this worker's own private subtree before adding the new
#   card, so a retry self-heals exactly the way attempt-1 already runs cleanly.
#   On the clean attempt-1 path the subtree is empty → the fetch just commits
#   "Saved 0 cards" (no wizard) — a quick custom-subtree round-trip, no BSC/SL.
#
# R3 — DEDUP: "Link to Existing" is covered by the link-existing flow and cancel
#   by checklist-fetch-cancel-dialog; this flow uniquely covers the keyboard
#   Enter-commit of the final step.

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# DRILL TO A PER-WORKER CUSTOM SET UNDER REAL Baseball/2024/Topps
# kod-<worker> is unique per worker → private selectorOptionId, so no other
# runner can write a custom card into this flow's wizard batch.
# ============================================================

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "kod-${WORKER_INDEX || 0}"
      VARIANT_TYPE: "Insert"
      VARIANT: "Base"

# ============================================================
# STEP 1 — PRIVATE SELF-HEAL PRE-CLEAN (this worker's own subtree only)
# If a wizard opens here it can only be leftover debris from THIS worker's own
# prior failed attempt (the subtree is private), so bulk-confirm every
# pre-existing unknown to commit + clear it. That guarantees this attempt's
# KOPlayer-${ATTEMPT_ID} is the SOLE unknown below.
#
# The Sync button (aria "Sync card checklist") is the empty-state "Fetch from
# Marketplaces" button when the checklist is empty (attempt-1) OR the header
# "Refresh" button when debris cards exist (retry) — exactly one renders at a
# time, so targeting it by aria-label is unambiguous. centerElement keeps it in
# the tap band clear of the sticky binder-header at the top.
# ============================================================

- scrollUntilVisible:
    element:
      id: "Sync card checklist"
    centerElement: true
    timeout: 10000
- tapOn:
    id: "Sync card checklist"
- extendedWaitUntil:
    visible:
      text: ".*Confirm New Players.*|.*Saved [0-9]+ cards.*"
    timeout: 60000
- runFlow:
    when:
      visible: "Confirm New Players & Teams"
    commands:
      - runFlow:
          when:
            visible:
              text: ".*Add All Remaining as New.*"
          commands:
            - tapOn:
                text: ".*Add All Remaining as New.*"
      # NEO-221 — the bulk add now decides only rows whose Wikidata lookup has
      # SETTLED, staying armed for the rest, so this wait is gated on that live
      # external round-trip rather than on one mutation. Raised from 30s for that
      # reason; it resolves the moment the wizard is done, so a healthy run pays
      # nothing for the bigger ceiling.
      - extendedWaitUntil:
          visible:
            text: ".*Confirm & Save.*"
          timeout: 120000
      - tapOn:
          text: ".*Confirm & Save.*"
      # NEO-163: no gate on the wizard closing. The "Saved N cards" wait below is
      # a positive terminal signal proving the same thing and more, so this
      # negative gate against a repainting node only added a failure mode.
- extendedWaitUntil:
    visible:
      text: ".*Saved [0-9]+ cards.*"
    # NEO-163: absorbs the removed notVisible gate's budget.
    timeout: 120000

# ============================================================
# STEP 2 — ADD A CUSTOM CARD WITH A UNIQUE PLAYER NAME
# Guarantees the wizard opens with exactly one fresh unknown, so deciding it
# reaches the final "All reviewed" step immediately (the cleanest keyboard case).
# The custom card's player goes through fetchCardChecklist's reconciliation via
# the cardChecklist.pendingPlayerNames field.
# ============================================================

- tapOn: "Add Card"
# "Player name" is the card-name input's placeholder (still rendered visually)
# and becomes visible after the autoFocused "#" input renders.
- extendedWaitUntil:
    visible: "Player name"
- inputText: "9002-${ATTEMPT_ID}"
# Address inputs by aria-label (Maestro's `id:` = accessibility-tree identifier).
# Placeholders overlap ("Player name", "Player(s) — comma separated, optional")
# and the text matcher cannot disambiguate them — see NEO-13 root cause.
- tapOn:
    id: "Card name"
- inputText: "Keyboard Dialog Test ${ATTEMPT_ID}"
- scrollUntilVisible:
    element:
      text: "Player(s) — comma separated, optional"
    centerElement: true
- tapOn:
    id: "Players"
- inputText: "KOPlayer-${ATTEMPT_ID}"
# Defensive: confirm the typed player name landed before submitting.
- assertVisible: "KOPlayer-${ATTEMPT_ID}"
# Plain "Add" (full-match) binds to the submit button, not the "Add Card" header.
- scrollUntilVisible:
    element:
      text: "Add"
    centerElement: true
- tapOn:
    text: "Add"
- scrollUntilVisible:
    element:
      text: "Keyboard Dialog Test ${ATTEMPT_ID}"

# Defensive: under parallel load addCustomCard has been observed to commit
# server-side while the client's setShowAddForm(false) doesn't fire, leaving the
# Add Card form open and the header buttons hidden. Tapping the form's Cancel
# restores them. If the form already closed (happy path) this is a no-op.
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - scrollUntilVisible:
          element:
            text: "Cancel"
          centerElement: true
      - tapOn:
          text: "Cancel"
          optional: true
      - extendedWaitUntil:
          notVisible: "Cancel"

# ============================================================
# STEP 3 — TRIGGER THE FETCH AND OPEN THE WIZARD
# Scroll UP to "Add Card" (same flex row as "Sync card checklist") and center it
# so the Sync button lands in the tap band clear of the sticky binder-header.
# ============================================================

- scrollUntilVisible:
    element:
      text: "Add Card"
    direction: UP
    centerElement: true
    visibilityPercentage: 50
- extendedWaitUntil:
    visible:
      id: "Sync card checklist"
- tapOn:
    id: "Sync card checklist"
# The wizard shows the same title text as the old dialog. This is a private
# custom subtree (no BSC/SL round-trip), but the wizard still resolves each row
# against the background entity lookup, so 60s remains the sanctioned ceiling.
# KOPlayer-${ATTEMPT_ID} guarantees the wizard opens.
- extendedWaitUntil:
    visible:
      text: "Confirm New Players & Teams"
    timeout: 60000

# ============================================================
# STEP 4 — REACH THE FINAL "All reviewed" STEP
# The keyboard assertion is the final Enter-confirm below; getting there just
# requires every unknown decided. Decide them all at once via the bulk
# "Add All Remaining as New (N)" button, which is visible whenever any item is
# undecided. Since NEO-221 it marks every SETTLED remaining row as "create" and
# then keeps going as the rest of the lookups land, so the wait below is on the
# lookups rather than on one mutation. Its label can also carry a
# "— N still looking up, wait or skip" suffix, which the prefix regex tolerates.
#
# The guard is retained because Step 1's pre-clean can leave the batch already
# fully decided in a retry edge case, in which case the button is absent and the
# final step is already showing.
# ============================================================

- runFlow:
    when:
      visible:
        text: ".*Add All Remaining as New.*"
    commands:
      - tapOn:
          text: ".*Add All Remaining as New.*"

# ============================================================
# STEP 5 — KEYBOARD CONFIRMATION — Enter on the auto-focused final Save button
# Once every unknown is decided the wizard shows the final step and auto-focuses
# "Confirm & Save (Enter)" (confirmButtonRef.focus() on the allDecided
# transition), then Enter fires onConfirm — the keyboard-only commit.
# ============================================================

# NEO-221 — the bulk add now decides only rows whose Wikidata lookup has
# SETTLED, staying armed for the rest, so this wait is gated on that live
# external round-trip rather than on one mutation. Raised from 30s for that
# reason; it resolves the moment the wizard is done, so a healthy run pays
# nothing for the bigger ceiling.
- extendedWaitUntil:
    visible:
      text: ".*Confirm & Save.*"
    timeout: 120000
- pressKey: Enter

# ============================================================
# STEP 6 — VERIFY THE COMMIT LANDED
# On a custom subtree there are no marketplace cards to write, so the message
# reads "Saved 0 cards" — same assertion shape as the link-existing flow. The
# old `.*#[0-9].*` assert relied on the real 335-card checklist being committed;
# asserting this attempt's own card title is the deterministic equivalent here.
# ============================================================

# NEO-163: the positive gate below proves the wizard closed AND the save
# landed. Waiting on the modal vanishing raced the "Saving..." state.
- extendedWaitUntil:
    visible:
      text: ".*Saved [0-9]+ cards.*"
    timeout: 30000
- assertVisible: "Keyboard Dialog Test ${ATTEMPT_ID}"

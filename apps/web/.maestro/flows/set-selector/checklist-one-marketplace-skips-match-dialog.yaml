appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Checklist — a set with exactly ONE marketplace attached skips the Match Cards dialog and keeps every fetched card"
tags:
  - set-selector
---
# ════════════════════════════════════════════════════════════════════════════
# R1 — ONE FEATURE (NEO-255): when exactly ONE marketplace is attached to a
# set, "Sync card checklist" no longer opens the Match Cards dialog. There is
# nothing to line up, so every fetched card is kept as a single-marketplace
# card and the operator lands straight on the entity review with NO
# "Back to Match Cards".
#
# WHAT THIS FLOW PROVES, end to end, on live marketplace data:
#   1. PRECONDITION: BSC really answers for this set — the base picker offers a
#      BSC base candidate — and the flow CANCELS rather than attaching a
#      SportLots set, so the SportLots slot stays empty and exactly one
#      marketplace is attached when the sync runs.
#   2. The "Match Cards" dialog NEVER appears — asserted at the two moments it
#      would still have to be up if it were coming (the result surface, and
#      again at the entity review), not once at a random instant.
#   3. The entity review opens with NO "Back to Match Cards": there was no pairing
#      session to go back to.
#   4. Every card the fetch produced is SAVED. The count is read ONCE, off the
#      run's own "Kept all N cards from <marketplace>" sentence, and then has
#      to hold at three later points — what the review offers to save, what the
#      commit reports, and what the checklist header shows. Nothing can be
#      dropped in between without failing.
#   5. Each saved card carries the single-marketplace badge "BSC only", and no
#      row carries "SL only" — the side that was never attached invented
#      nothing.
#
# ── WHY THE "Kept all N cards …" WAIT IS THE R2 GATE ────────────────────────
#   `soloKeptMessage` is produced on ONE code path: `expectSolo && agreed &&
#   serverSides.length === 1`, after the streamed batch has arrived in full.
#   The long-standing `candidateCount === 0` path (a subtree with no
#   marketplace ids, which skipped the dialog long before this ticket) prints
#   NOTHING and commits an empty checklist, and a two-sided run opens the
#   dialog and prints the ordinary sync message. So this one sentence, with a
#   count > 0, is a positive assertion that the NEO-255 branch ran — it cannot
#   be satisfied by the pre-existing fall-through this fixture exists to avoid.
#
# ── WHY THIS FLOW WRITES, AND IS THEREFORE A SOLE WRITER (R7 / R7a) ─────────
#   The defining outcome of NEO-255 is that the cards are KEPT. That is only
#   observable after a commit: without one, a build that skipped the dialog and
#   then committed nothing would pass a read-only version of this flow. So this
#   flow commits, and it is the 1996-Score / NEO-248-committing-fixture shape —
#   its own real set, exactly ONE flow ever touching it, no other flow reading
#   it. Nothing needs restoring afterwards, and it races nothing, because no
#   other flow shares its `selectorOptionId`.
#
#   ⚠️ It DRAINS its own fixture, deliberately and acceptably: after a commit
#   the set holds cards, so a second sync is a RE-SYNC (content-diff review,
#   not a first fetch) and its names are known. CI reseeds the preview every
#   run, so the first-fetch path is the CI path. A LOCAL re-run against an
#   already-committed deployment fails at STEP 5's "No cards in this checklist
#   yet." assertion, correctly — same contract as `checklist-wizard-*-commits`.
#   `MAESTRO_NO_DEPS=1` will not do.
#
# ── WHY THIS FIXTURE, AND WHY IT CANNOT BE A HAND-MADE SET ──────────────────
#   A hand-made subtree carries no marketplace ids on any ancestor, so NEITHER
#   side is resolvable, neither is fetched (NEO-239), no candidates exist, and
#   `CardChecklist` takes its `candidateCount === 0` path. That path already
#   skipped the dialog before this ticket — it would pass whether NEO-255
#   shipped or not. The feature only exists where ONE marketplace really
#   answers, which needs a real, BSC-listed set synced through the real
#   hierarchy.
#
#   Hockey → 1995 → `Unknown` is where those live (NEO-237). The BSC phase of
#   `syncSetsAcrossManufacturers` files every BSC set under the year's
#   manufacturer rows — by the id a row already holds, then by each brand's
#   set-name prefix — and the rest, the minor-league, junior, college and
#   team sets no brand's prefix claims, under the year's brand-unknown row,
#   the one NB mints as "Unknown" (`ensureBrandUnknownRow`). Those sets carry
#   a BSC id and no SportLots id, at any level a SportLots attachment can
#   live on (`setName | variantType | insert | parallel`, `attachedSidesOf`),
#   so the sync sees exactly one attached side.
#
#   The set is REACHED through the "All Brands" VIEW — the entry pinned to
#   the top of the Manufacturers column that lists every set in the year with
#   its brand as a muted second line — because a flow cannot know which
#   brand-unknown row a year will mint before the year's Sets sync has run,
#   and the view is where that sync fires from. Picking the set there
#   BACK-FILLS the Manufacturers column from the set's own parent, and STEP 2
#   asserts that the collapsed card then reads `Unknown`: that one assertion
#   proves the year-wide sync ran, the set was filed under the brand-unknown
#   row rather than a brand, and the back-fill resolved the view to the row.
#
#   ⚠️ MEASURED CORRECTION (PR #242 preview, 2026-09-07), RESTATED FOR NEO-237.
#   An earlier draft claimed SportLots could not even be OFFERED here and
#   asserted the picker's "SportLots returned no base set for <set>" line as
#   its precondition. That is FALSE in live mode and the assertion is gone:
#   SportLots' hockey brand list carries its own no-filter option, "All
#   Brands", and the manufacturer sync now ROUTES that option's id onto the
#   year's `Unknown` row (never storing a row under the option's label), so
#   the base picker offers the year's whole SportLots catalogue under it
#   (measured on the old row: 1 BSC candidate, 321 SportLots candidates, no
#   "no base set" line — the same list, now held by `Unknown`). None of that
#   attaches anything: attachment is an id ON A ROW at set level or below,
#   and the manufacturer's id is not one. What keeps this set one-sided is
#   that we CANCEL the picker — and the product states the outcome itself, in
#   the sentence STEP 6 waits on.
#
#   NB owns the data either way: nothing here depends on a marketplace NAME.
#   The set is selected by its NB display value, "one marketplace attached"
#   is read off the row's slots, and the brand-unknown row is found by its NB
#   role (`metadata.isBrandUnknown`), never by the name "Unknown".
#
# ── R9 — THE DRILL GOES THROUGH `util-drill-to-cold-real-set`, ONCE ─────────
#   With MANUFACTURER "All Brands", which the util reads as "tap the pinned
#   view" (its NEO-237 block) in BOTH modes — there is no row to create and
#   nothing to search for. Before NEO-237 the drill selected a manufacturer
#   ROW of that name straight off SportLots' brand list; under the pause it
#   typed the name into "+ Custom", which the form now refuses.
#
# ── R5 ──────────────────────────────────────────────────────────────────────
#   The 7s default everywhere, EXCEPT the live marketplace round-trips: the
#   cold Hockey year/manufacturer/set syncs (owned by the drill util), the cold
#   variant-type sync, the base picker's own fetch, and the checklist fetch and
#   its entity lookups. Each is commented where it appears, with what it
#   measured.
#
# ── WHAT THIS FLOW DELIBERATELY DOES NOT ASSERT: the inline progress line ───
#   NEO-255 reports the solo fetch on an inline line under the Sync button
#   ("Fetching from BSC… <n> of <m> cards ready.") with a `Cancel checklist
#   fetch` button beside it. Measured twice on the PR #242 preview, on the two
#   smallest candidate fixtures:
#
#     Roanoke Express ECHL (25 cards): line up at t=0.12s, denominator at
#       t=1.12s, replaced by the result at t=1.37s → whole line ~1.3s, the
#       "<n> of <m>" half ~0.25s.
#     Dayton Bombers ECHL  (32 cards): line up at t=0.13s, denominator at
#       t=2.38s, replaced at t=3.13s → whole line ~3.0s, "<n> of <m>" ~0.75s.
#
#   maestro-web spends ~2s in `hierarchyBasedTap`'s view-hierarchy wait per
#   step, so the whole window is gone before the command AFTER the tap can read
#   the screen. Asserting it would be a coin flip, and the only way to widen it
#   is a fixture with hundreds of cards — which this flow then has to review and
#   commit, for a line that is already covered by unit tests
#   (`soloProgressMessage` in `CardChecklist.test.tsx`). So it is not asserted
#   here, on purpose, and this paragraph is the disclosure. Do not "fix" it by
#   padding a wait: the line is not slow, it is finished.
#
# ── R1/R2 — A SECOND FEATURE RIDES THIS FIXTURE, DELIBERATELY (NEO-272) ─────
#   STEP 8 at the bottom proves something else: that the name of the year's
#   brand-unknown row — `Unknown`, and the marketplace's "All Brands" it used
#   to wear — never reaches a card's generated listing title on a set filed
#   under it. The `name:` above still names the primary feature, and it stays
#   that way — read STEP 8's own block before blaming NEO-255 for a red down
#   there.
#
#   This is the two-in-one shape `custom-card-row-opens-panel-with-autotitle`
#   documents in its own R2 block, where one drawer assertion covers both the
#   row-click feature and NEO-24's auto-title. Same justification here, plus a
#   harder one: `Hockey → 1995 → Unknown` is the suite's ONLY subtree under a
#   manufacturer row whose brand NB has not identified, and giving NEO-272 its
#   own flow would mean a SECOND real set (30-90s of cold marketplace sync) plus
#   owner approval, for a claim this flow is already standing three lines away
#   from. STEP 8 adds eight commands: it hand-adds ONE card of its own to read
#   the title off, because every card the commit wrote is numbered `NNO` and no
#   selector can pick one of twenty-five identical rows that is also on screen —
#   the whole argument is in STEP 8's block, along with what that trades away.
#
# ── R1/R2 — AND A THIRD, ON THE SAME FIXTURE (NEO-335) ──────────────────────
#   STEPS 5, 6, 6b, 6c, 7, 9 and 10 prove the team half of a sync, which
#   NEO-335 moved in front of the save, and the wizard chrome Phase 2 put
#   around it:
#     • the wizard is "Tidy up this set" with ONE counter, "Step x of y", and
#       a subtitle per screen type — "New player" and "New team" on the name
#       steps (STEP 6), "Cards with no team" on the teams step (STEP 6b) and
#       "Ready to save" on the Save step, which is always "Step y of y"
#       (STEP 6c);
#     • every card that would save with NO team is asked about on its OWN
#       step after the names ("Pick a team for each card, or leave it for
#       later.", one line per player, and ONE shared line "Cards with no
#       players (N)" for every card nobody is on, whose cards open one by one
#       for answers of their own), left with "Next (Enter)";
#     • a line whose evidence gives exactly one team is PRE-FILLED with it —
#       here a player created in this review with ONE career team covering the
#       set's window [setYear-1, setYear] (STEP 6), whose card's line comes up
#       with that team checked (STEP 6b), and whose card carries it after the
#       save (STEP 9, read in the card drawer);
#     • "Other team…" on any answer row finds or CREATES a team the evidence
#       never offered: here a brand-new team typed into its search field,
#       created in the New Team dialog it opens, selected on ONE card of the
#       shared line through "Just this card…" (STEP 6b), and read back on
#       that card's drawer after the save (STEP 9);
#     • "No team on this card" and "Leave for later" are answers that ride the
#       commit (STEP 6b), and the checklist's "N need you" count is FINAL the
#       moment "Saved N cards." shows (STEP 7) — a card whose fetch-time BSC
#       lookup answered is stamped at the commit, so nothing is left to climb
#       (before NEO-335 it climbed for ~15s, SET-REGISTRY measurement 10);
#     • a RE-SYNC with no names left to ask but teamless cards stored opens the
#       review TEAMS-ONLY, "Step 1 of 2", straight onto its teams step and then
#       Save (STEP 10).
#
#   Same justification as STEP 8: this is the suite's one fixture where every
#   card saves TEAMLESS (K = the fetch count), it is already committed here,
#   it is this flow's alone, and
#   only a real fetch + commit can put a BSC-linked card through the stamp. A
#   hand-made set carries no BSC ref (NEO-239), so its cards never wait on a
#   lookup and could never be re-synced at all.
#
#   ⚠️ MEASURED (CI run 38285320710, after NEO-333 #316 merged): the fetch now
#   waits for BSC's per-card team lookups, so all 25 cards ARRIVE listing
#   "Roanoke Express". Before, the lookup landed after the commit and the
#   cards came in blank (green run 38208753526 raised no team step). The walk
#   util in STEP 6 now meets a "New Team: Roanoke Express" step before the
#   first player and answers it "Skip — not a team". That skip is recorded
#   for this set (`entityReviewSkips`), so the listed team holds no guess back
#   and links nothing: the cards still save teamless, K is still the fetch
#   count, and STEP 10's re-sync has no team NAME left to ask, only
#   teamless cards.
#
#   ⚠️ WRITES BEYOND THE CARDS, deliberately: ONE player (whichever Roanoke
#   name the wizard presents first — a name no other flow touches, filed under
#   Hockey) and TWO teams, `RXT<token>` (the career team) and `RXO<token>T`
#   (the "Other team…" create), each a single search token, per attempt. All
#   three are global; the same trade `checklist-wizard-career-team-commits`
#   makes for the same reason.
#
#   COST, measured nowhere yet: the walk to a settled player row waits out the
#   batch's Wikidata lookups (fixture-backed on previews, NEO-289) plus the
#   util's deliberate 7s dwell; the career team's own lookup; a second live
#   BSC fetch for the re-sync; and up to one drawer step per card to reach the
#   pre-filled one. All inside the 600s per-flow kill, but this is now one of
#   the longer set-selector flows.

# ── R3 — NO OTHER FLOW TESTS THIS ───────────────────────────────────────────
#   Every other flow that reaches the pairing dialog is on a TWO-sided set and
#   proves the opposite half of the same rule, unchanged by this ticket:
#   `checklist-pairing-dialog-cancel` (Future Stars),
#   `topps-chrome-insert-known-roster-no-wizard` (once the retired `setup.yaml`),
#   `util-fetch-real-set-checklist-to-wizard` (Topps Big League),
#   `inserts-1996-score-one-nb-set-two-bsc-sources`. None of them is modified.
#
# maestro-lint: streaming-ok — this flow never DRIVES the pairing dialog; it
#   proves the dialog is absent, and there is no Confirm button to settle on.
#   `scripts/maestro-pairing-sync.test.mjs` keys on the literal "Match Cards"
#   appearing anywhere in a file, which here appears only inside
#   `assertNotVisible`. The sync point this flow waits for instead is the run's
#   own "Kept all N cards from <marketplace>" result line, which — exactly like
#   `^Confirm$` — appears only once the fetch action has RESOLVED and the
#   streamed batch has arrived in full, and every count assertion below hangs
#   off it rather than off a mid-stream reading.
# ════════════════════════════════════════════════════════════════════════════

# ============================================================
# STEP 0 — THE FIXTURE, IN ONE PLACE
#
# These two values are the ONLY place the fixture is named; swapping the set is
# a two-line edit here and a matching edit to .maestro/SET-REGISTRY.md, whose
# "ONE-MARKETPLACE fixture" section carries the measured numbers.
#
#   SET   the BSC-only set the year files under `Unknown`. Measured on the
#         PR #242 preview: 25 cards, 25 unknown player names, 0 unknown teams.
#   YEAR  plain four digits. NB files Hockey years as bare years, never
#         "1994-95" — the Years column for Hockey holds 122 rows, 1905–2026,
#         all four-digit (measured 2026-09-07, and on dev 2026-09-03/NEO-211).
#
# NOTE for whoever swaps the fixture: `text:` is a full-node REGEX, so a set
# name carrying regex metacharacters — brackets, a `+`, a `?`, a `.` — must be
# escaped here and everywhere it is used below. "Roanoke Express ECHL" carries
# none. Prefer a set with no apostrophe or slash for the same reason.
# ============================================================

- evalScript: '${output.SET = "Roanoke Express ECHL"}'
- evalScript: '${output.YEAR = "1995"}'
# One alphanumeric search token per attempt (README, "Minted names are single
# tokens"); `ATTEMPT_ID` is the runner's binding, never `output.ATTEMPT_ID`.
# Names the TWO teams this flow creates, `RXT<token>` and `RXO<token>T`
# (SET-REGISTRY). RXO ends in a LETTER so it cannot be a prefix of another
# attempt's longer token (Convex search treats the last term as a prefix), which
# would turn the picker's "No matches." into a match and Enter into a pick.
- evalScript: '${output.ATTEMPT_TOKEN = String(ATTEMPT_ID || Date.now()).split("-").join("")}'

# ============================================================
# LAUNCH + SIGN IN (R4 — the entry URL IS the Clerk handshake; no in-body login)
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# STEP 1 — DRILL TO Hockey › <YEAR> › the "All Brands" VIEW
#
# The scripted seed (`npm run setbuild`) provisions Baseball only, so this whole hierarchy is COLD and the
# cold util owns every marketplace-length wait in it. "All Brands" is the
# util's cue for the PINNED VIEW (its NEO-237 block), so its return contract
# here is "the view is open and the Sets column has finished the YEAR-WIDE
# cold sync" — `syncSetsAcrossManufacturers` with no brand scope: BSC's
# whole 1995 list filed under the brands by prefix and the remainder under
# the year's `Unknown` row (minted by that sync if the manufacturer sync
# had not already routed SportLots' no-filter option onto one), then one
# SportLots set list per brand that carries the ids. Measured on the PR #242
# preview, before NEO-237: 134 BSC sets under the brand-unknown row alone;
# the view now lists every set of the year, so hundreds.
# ============================================================

- runFlow:
    file: util-drill-to-cold-real-set.yaml
    env:
      SPORT: "Hockey"
      YEAR: ${output.YEAR}
      MANUFACTURER: "All Brands"

# ============================================================
# STEP 2 — SELECT THE SET FROM THE VIEW, AND READ WHICH ROW IT LIVES UNDER
#
# The util stops one level short on purpose (its header says why: the caller
# owns the set pick).
#
# Only the SEARCH shape is handled. Since NEO-224 every open column renders
# its search input, so there is no other shape. The gate is the view's
# LISTBOX (accessible name `Sets`), which renders only once the column holds
# a row — a year that synced to nothing fails here, by name (the search box
# itself renders from the column's first frame and proves nothing).
#
# The rows here carry the set NAME as their own text node and the brand as a
# muted second line in a sibling node, so `text: "<set>"` still finds exactly
# the name (maestro-web's `text` is direct text nodes only). Nothing here
# asserts the second line — which brand the set was filed under is read off
# the COLLAPSED MANUFACTURERS CARD after the pick, below, where it is one
# accessible name rather than one of hundreds of identical "Unknown" lines.
# ============================================================

- extendedWaitUntil:
    visible:
      id: "Sets"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Search sets.*"
    centerElement: true
    timeout: 7000
- tapOn:
    text: ".*Search sets.*"
    waitToSettleTimeoutMs: 250
- inputText: ${output.SET}
# NEO-85 residual coordinate-staleness: result-keyed retry — re-fire the row
# tap ONCE iff the next column never appears. `below: {id: "Search sets"}`
# rather than `index:` (NEO-46: the input/row DOM order flips between a cold
# sync and a re-drill, so an index can land on the input itself).
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: ${output.SET}
          below:
            id: "Search sets"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "Variant Types"
          timeout: 20000

# ── THE ROW THE SET LIVES UNDER IS `Unknown` (NEO-237, R2) ──────────────────
# Picking a set in the view back-fills the Manufacturers column from the
# set's own parent (`handleSetSelect`, SetSelector.tsx), and the column then
# collapses to a card named `Manufacturers: <row> — change`. Asserting that
# card reads `Unknown` is the live proof of three things at once: the
# year-wide Sets sync RAN (STEP 1's util only waited its panel out), it filed
# this BSC-only set under the year's brand-unknown row and not under a brand
# (no brand's set-name prefix claims "Roanoke Express ECHL"), and the view
# resolved to a real row on the pick. In live mode that row is the one the
# manufacturer sync minted when it routed SportLots' "All Brands" option
# onto it (D6); under the pause it is the one the BSC phase minted for want
# of any brand. Either way its NAME is NB's — the marketplace's option label
# is never stored — which is why "Unknown" and not "All Brands" is what a
# correct build shows here. The em dash is U+2014, as EntitySelector composes
# it; the accessible name is a FULL match on the pinned CLI. No scroll: the
# card sits in the columns row that the pick just re-laid out, and a
# horizontal offset is nothing a flow can correct anyway (README R8).
- assertVisible:
    id: "Manufacturers: Unknown — change"

# Selecting the set fires its variant-type sync — BSC-only, and cold here.
# Measured ~15s; 60s matches the drill utils' own variant-type contract, and is
# the R5 marketplace exception.
- extendedWaitUntil:
    visible: "Base"
    timeout: 60000

# ============================================================
# STEP 3 — SELECT Base, READ THE PRECONDITION, AND CANCEL
#
# `baseHasMapping` counts the SPORTLOTS slot only, so an unmapped Base
# auto-opens BaseSetPicker. That is not an obstacle here — it is where the
# flow's precondition is legible:
#
#   at least one `BSC base candidate: …` row  →  BSC genuinely answers for this
#   set, so the run below is a real one-marketplace fetch and not the empty
#   `candidateCount === 0` path.
#
# We then CANCEL. Cancelling writes nothing (R7) and leaves the SportLots slot
# empty, which is what keeps "exactly one marketplace attached" true for the
# sync below. `CardChecklist` mounts regardless of the mapping —
# `cardChecklistId` is the variantType id the moment a Base row is selected —
# so the checklist is reachable underneath the recovery panel.
#
# (The SportLots pane is asserted by MODE only, below. Measured on the PR #242
# preview it holds 321 candidates in live mode, because the `Unknown` row
# carries SportLots' no-filter option id (routed there by the manufacturer
# sync, NEO-237 D6) and that row has no set-name prefix to narrow the list
# by; see the MEASURED CORRECTION in the header. Offering a candidate is not
# attaching one, and this flow attaches none.)
# ============================================================

# No scroll: the Variant Types column is level with the ones already on screen
# (measured y=382), and the set has just been selected, which is exactly where
# maestro-web's frame stall begins — see STEP 4.
# Result-keyed retry, same maestro-web tap-drop class the drill utils handle:
# the still-settling Variant Types column reflows under the captured bounds.
# 7s keys on the picker OPENING, which is synchronous — not the round-trip.
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: "Base"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "Select Base Set"
          timeout: 7000

# The confirm button reads "Loading…" until the live SportLots + BSC round-trip
# lands and flips to "Confirm Base Set". Waiting on that flip is what makes the
# candidate assertion below a FINISHED answer rather than an empty skeleton.
# Measured ~8s; 60s is the R5 marketplace exception.
- extendedWaitUntil:
    visible: "Confirm Base Set"
    timeout: 60000

# ── THE PRECONDITION (R2): BSC has a base set for this row ──────────────────
- assertVisible:
    id: "BSC base candidate: .*"
# NEO-287 — the SportLots pane, by mode (`-e PAUSED_PLATFORMS`, decided by
# util-paused-platforms). This set is one-sided in BOTH modes and the picker
# is cancelled in both; what differs is what the pane SAYS: live, SportLots'
# catalogue is offered (and declined); paused, the pane says the platform is
# on pause and offers nothing. Both branches are hard (R2).
- runFlow:
    file: ../util/util-paused-platforms.yaml
- runFlow:
    when:
      true: "${!output.SL_PAUSED}"
    commands:
      - assertVisible:
          id: "SportLots base candidate: .*"
- runFlow:
    when:
      true: "${output.SL_PAUSED}"
    commands:
      - assertVisible: "SportLots returned no base set for .*"
      - assertNotVisible:
          id: "SportLots base candidate: .*"

# The picker is a fixed full-viewport portal — nothing overlays it and it
# cannot be scrolled, so a direct tap is correct (documented R8 exception).
- tapOn: "Cancel"

# Cancel leaves the recovery panel, NOT a dead end (that panel's own behaviour
# is `base-mapping-cancel-recovers`' feature, not this flow's — it is asserted
# here only as proof the picker really closed without writing a mapping).
- assertVisible:
    text: ".*Base mapping cancelled.*"

# ── PUT THE PANEL AWAY — "Close to leave it unmapped for now" ────────────────
# The operator's own way out of the recovery panel, and it writes nothing: it
# dismisses the panel for this variantType and hands back a primary
# `Map Base Set` button in its place. That button is also the positive proof
# that Cancel left the row UNMAPPED — a Base that had acquired a SportLots
# mapping would offer "Re-map Base" instead, and this flow's whole precondition
# would be gone. Dismissal is per variantType and clears when the selection
# changes, so it leaks into nothing.
- tapOn: "Close"
- extendedWaitUntil:
    notVisible:
      text: ".*Base mapping cancelled.*"
    timeout: 7000
- assertVisible: "Map Base Set"

# ============================================================
# STEP 4 — SYNC. THIS MUST NOT OPEN THE DIALOG.
#
# The checklist renders BELOW the columns container, under the 1024x629 fold,
# so it is reached the way the retired seed flow reached it: scroll to the Base-mapping
# button (the settle anchor — here "Map Base Set", proof the row stayed
# unmapped), then centre "Add Card" (same flex row as the Cards header) before
# asserting and tapping.
#
# ⚠️ LOCAL RUNS ON A MAC CAN STALL HERE (NEO-258): maestro-web's only scroll is
# `window.scroll({behavior:'smooth'})`, frame-driven, and headless Chrome's
# renderer can stop producing frames at the set-selection render, so every
# scroll moves 0px and still reports COMPLETED. CI (Linux) does not stall —
# PR #242 run 5 rendered and scrolled this page normally. Tell a stall apart in
# ten seconds and the harness fix (`--run-all-compositor-stages-before-draw`
# via SE_BROWSER_PATH):
#   .claude/agent-memory/neonbinder-web-dev/
#     reference_maestro_web_frame_stall_kills_scrolling.md
# ============================================================

# R5 — 7000, the bar (was 30000). MEASURED (CI 34349299679 +
# 34361627641): worst 2.0s, 1 centring swipe. Nothing here waits on a
# marketplace — the `extendedWaitUntil`/`assertVisible` pair above already
# holds this element.
- scrollUntilVisible:
    element:
      text: "Map Base Set"
    centerElement: true
    timeout: 7000
# R5 — 7000, the bar (was 30000). MEASURED (CI 34349299679 +
# 34361627641): worst 1.98s, 1 centring swipe. Nothing here waits on a
# marketplace — same flex row as the Cards header the step above just centred.
- scrollUntilVisible:
    element:
      text: "Add Card"
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000

# The checklist is empty here, so the button reads "Fetch from Marketplaces";
# its accessible name is stable in both states. Asserting the empty state first
# is what makes the saved COUNT in STEP 7 a claim about this fetch alone — and
# it is also the guard that fails a re-run against an already-committed
# deployment, loudly and in the right place.
- assertVisible: "No cards in this checklist yet."
- tapOn:
    id: "Sync card checklist"

# ============================================================
# STEP 5 — EVERY FETCHED CARD IS KEPT, AND THE REVIEW OPENS WITH NO WAY BACK
#
# The fetch resolved and the run said what it did with the cards, in the same
# banner every other sync result uses. This sentence IS the feature's headline,
# it is produced on the NEO-255 branch and nowhere else (see the header), and
# it carries the FETCH COUNT — the number the rest of this flow follows all the
# way to the commit, so nothing can be dropped in between without failing.
#
# Measured 1.4s (25 cards) / 3.1s (32 cards). 60s covers a cold BSC round-trip
# on a slower day (R5 exception); it is a ceiling, not an expectation.
#
# ⚠️ COPY-SENSITIVE (the only such assertion left in this flow). Matched
# loosely on purpose: the count and "Kept all" are what is being claimed, not
# the wording around them.
# ============================================================

- extendedWaitUntil:
    visible:
      text: ".*Kept all [0-9]+ cards? from .*"
    timeout: 60000
- copyTextFrom:
    text: ".*Kept all [0-9]+ cards? from .*"
- evalScript: '${output.FETCHED = maestro.copiedText.match(/[0-9]+/)[0]}'
# A fetch that produced nothing would make every assertion below vacuously
# true, so say the precondition out loud.
- assertTrue: ${Number(output.FETCHED) > 0}

# ── ZERO SPORTLOTS CARDS, SAID ON SCREEN (NEO-256) ──────────────────────────
# The gate above is loose about the side on purpose (copy-sensitive). This
# line pins it. `soloKeptMessage` prints only on the one-marketplace branch
# (CardChecklist: the server's attached sides, less paused ones, are exactly
# one AND no fetched card paired or carried a conflict), it names that one
# side, and "no other marketplace attached." is its tail when no paused side
# is attached either. So "from BSC. … no other marketplace attached." says
# the run asked BSC alone. Before NEO-256 a chain attached to BSC alone could
# still come back with SportLots cards through the adapter's name-keyed set
# lookup; SportLots' cards for this set would pair with BSC's by number, send
# the run to Match Cards instead, and fail here by name. A SportLots card
# that paired with nothing would be kept as "SL only" — STEP 7's badge check
# is the cover for that shape. Same node the gate just matched, so no wait.
# Both modes: the fixture never carries a SportLots id on the set, so the
# pause does not change this sentence.
- assertVisible:
    text: ".*Kept all ${output.FETCHED} cards? from BSC\\. Nothing to match, no other marketplace attached\\..*"

# ── THE DIALOG IS NOT THERE — first of two moments ──────────────────────────
# The dialog closes only on Confirm or Cancel, so a regressed build that opened
# it would still have it up here. Paired with the positive assert above on
# purpose: an `assertNotVisible` on its own is satisfied by a dead
# error-boundary page.
- assertNotVisible: "Match Cards.*"

# Entity resolution then runs on the kept set with no screen in between.
# Measured ~0.8s to the wizard; 60s covers the live Wikidata lookup each
# unknown name queues (R5 exception).
- extendedWaitUntil:
    visible: "Tidy up this set"
    timeout: 60000
# NEO-335 Phase 2 — the sitting starts at its first step: nothing is decided,
# and on a name step x is the decided count plus one. y is the batch's own
# business (and grows as staged steps arrive), so it is left free. Header
# text, pinned.
- assertVisible: "Step 1 of [0-9]+"

# ── STILL NO DIALOG, at the terminal surface ────────────────────────────────
- assertNotVisible: "Match Cards.*"

# ── NO "Back to Match Cards" ──────────────────────────────────────────────
# The wizard offers it only when there is a parked pairing session to go back
# TO. There was never one, so the footer must not offer it. This is the clause
# that would break if the client entered the review phase "just in case".
- assertNotVisible: "Back to Match Cards"

# ============================================================
# STEP 6 — CREATE ONE PLAYER WITH ONE CAREER TEAM, THEN SKIP EVERY OTHER NAME
#
# NEO-335 needs ONE card whose team the evidence knows, and none of these
# cards carries a team, so the evidence has to be a player's career. The
# cheapest honest source is the review itself: create the first player the
# wizard presents, with ONE career team staged by hand. `teams-on-cards.ts`
# (`createdPlayerVerdict`) reads a created row's `enrichment.careerTeams` plus
# its decision's `manualCareerTeams` through the shared WINDOW rule (NEO-335
# Phase 2, C2 — `careerTeamVerdict` in convex/lib/teamFill.ts): a career
# pre-fills only when EXACTLY ONE of its teams covers [setYear-1, setYear].
# The set year is 1995, so the window is [1994, 1995], and the staged stint
# 1994–1996 covers it (`stintCoversWindow`: from 1994 <= 1995, to 1996 >=
# 1994). Nothing else can share the window: a Wikidata career team the util
# met on the way is answered as a SKIP, and a skipped team string is not a team
# (`refFromString` returns null), so it never counts. There is no year-blind
# "one-team career" shortcut any more — the stint years are what make this
# card pre-fill. The staged team is decided "Add as New Team" in its own New
# Team step, so the line's chip is that row's composed name, `RXT<token>`.
#
# The mechanics are `checklist-wizard-career-team-commits` STEPs 1–3, reused
# step for step (R3): the util walks to a SETTLED player row the operator's
# way; "Add career team" stages a New Team step and hops the walk to it once
# its lookup settles; "Add as New Team" brings the player back with the chip
# (years intact); "Add as New Player" records the create. Which Roanoke name
# that is, the flow never learns — every later assertion keys on the TEAM.
#
# The header names each screen type as the walk passes it (NEO-335 Phase 2):
# "New player" on the player row, "New team" on the staged team's step.
#
# Every other name is then SKIPPED, the cheapest way to a commit: it decides
# every remaining row in one press — lookups included — creates no players,
# and raises none of the per-team "New Team" steps the bulk ADD path raises
# (NEO-236). Skip coverage itself belongs to `checklist-wizard-skip-not-a-
# person` and the entity-review unit files; nothing here re-asserts it.
#
# THE RETRY IS NOT DECORATION. The batch can still GROW after the wizard opens:
# a player's Wikidata career history stages that player's TEAMS as further
# rows. Measured on the neighbouring Dayton Bombers ECHL fixture, the footer
# went "Skip remaining names (28)" → "(29)" three seconds after the wizard
# appeared, which is exactly when this flow presses it. One press then leaves
# one row undecided and "Confirm & Save" never renders. Result-keyed and
# bounded: press, wait 60s for the end of the names, and press once more if a
# late row turned up. The end of the names is the footer's "Next (Enter)": every
# card here is teamless, so the wizard MUST walk on to its teams step — a
# straight "Confirm & Save" would mean the step never came, and STEP 6b then
# fails by name on its subtitle. (Roanoke Express ECHL measured 25 players and 0 teams,
# stable for 27s — so on the happy path the retry costs nothing at all. Since
# NEO-333 the listed team "Roanoke Express" is a 26th row, a team, which the
# walk util skips before it reaches the player; header ⚠️.)
# ============================================================

# R9-equivalent for the wizard: the util owns the walk (and its R5 lookup
# exceptions — the batch's live Wikidata round-trips).
- runFlow: util-wizard-walk-to-player-row.yaml

# The career-team mini-form renders only on a PLAYER row — the precondition —
# and the header says which screen type this is.
- assertVisible:
    id: "Career team name"
- assertVisible: "New player"
- tapOn:
    id: "Career team name"
- inputText: "RXT${output.ATTEMPT_TOKEN}"
# The name is a fresh single token, so no "Existing team suggestions" row can
# open over "From year" (career-team-commits' header has the trap).
- tapOn:
    id: "From year"
- inputText: "1994"
- tapOn:
    id: "To year \\(optional\\)"
- inputText: "1996"
- tapOn:
    id: "Add career team"

# The staged club's New Team step appears once ITS Wikidata lookup settles
# (career-team-commits STEP 3 has the CI evidence): a 7s proof the stage
# landed, the long gate named for the external round-trip (R5 exception),
# then 7s for the step itself.
- extendedWaitUntil:
    visible: "New Team: RXT${output.ATTEMPT_TOKEN}|.*still looking up.*"
    timeout: 7000
- extendedWaitUntil:
    notVisible: ".*still looking up.*"
    timeout: 180000
- extendedWaitUntil:
    visible: "New Team: RXT${output.ATTEMPT_TOKEN}"
    timeout: 7000
- assertVisible: "New team"
# One tap accepts the pre-filled Location (blank: the name has no place in
# it), Name and League; the name is unique, so the button cannot have
# relabelled itself to "Link to …".
- tapOn: "Add as New Team"
- extendedWaitUntil:
    visible:
      id: "Career team name"
    timeout: 7000
# Back on the player, the staged stint survived the hop, years and all
# (71f23a4). The en dash is matched with ".".
- assertVisible:
    text: ".*RXT${output.ATTEMPT_TOKEN} \\(1994.1996\\).*"
- tapOn: "Add as New Player"
- extendedWaitUntil:
    visible:
      text: "Added as new"
    timeout: 7000

- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: ".*Skip remaining names \\([0-9]+\\).*"
      - extendedWaitUntil:
          visible:
            text: "Next \\(Enter\\)|.*Confirm & Save.*"
          timeout: 60000

# ============================================================
# STEP 6b — THE CARDS THAT WOULD SAVE WITH NO TEAM GET THEIR OWN STEP
#           (NEO-335; see the third R1/R2 block in the header)
#
# NEO-335 Phase 2: past the names the wizard walks on to a TEAMS step — header
# subtitle "Cards with no team", the intro "Pick a team for each card, or
# leave it for later.", and the footer's "Next (Enter)" (class
# `btn-next-step`) in place of Confirm & Save, which lives on the Save step
# alone. The header's "Step x of y" is the step's only running number.
#
# Each line is a radio group "Team for <owner>" whose radios are named
# "<choice> — <owner>" (`lineOwner`, TeamsOnCardsSection.tsx), followed by an
# "Other team… — <owner>" button. Two lines here:
#   • the card of the player STEP 6 created — a PLAYER line, owned by that
#     player's printed name, offering the career team `RXT<token>` CHECKED;
#   • every other card. A skipped name is nobody, so those cards have NO
#     players, and every teamless card with no players shares ONE line, owned
#     "Cards with no players (N)" — keyed on having no players, never on a
#     card's name or number. It offers "No team on this card" and "Leave for
#     later", defaults to the second, and is never pre-filled (no player, no
#     evidence). Its card numbers and count ("#NNO, #NNO, #NNO +21 · 24 cards
#     ▸") are a button that opens the cards one by one, each with
#     "Just this card… — #<n> <name>", which gives that card its own answers
#     (a "Match the others" button takes it back).
#
# Every card number here is `NNO` and the card names are the marketplace's
# (STEP 8's block), so the cards inside the shared line are told apart by
# POSITION: `index:` sorts by y then x, and card 1 is the top-most.
#
# ⚠️ BODY CONTENT, which the README's dialog rule ("header and footer only")
# warns about: the section lives in the wizard's inner-scrolling body. Only
# the shared line and its FIRST two cards are touched, and each tap's target
# is first asserted above the pinned footer's "Next (Enter)", so it cannot
# land on a footer button through a clipped row (README;
# guard-a-tap-at-a-footer). Nothing here scrolls the body until the pre-fill
# read at the end.
#
# "checked" is unreadable as an attribute on maestro-web, so it is read off
# the radio's own ✓ glyph — rendered INSIDE the checked radio only (1.4.1:
# checked is not colour alone), and a `childOf:` scope ties it to one radio.
# ============================================================

# THE STEP, by its own header and intro. The subtitle is pinned header text;
# the intro is the first line of the body, at its top on arrival.
- assertVisible: "Cards with no team"
# …and the step OPENS AT ITS TOP (the wizard resets its body's scroll on
# every step change): the intro sits under the header, not scrolled up behind
# it. A step that inherited the previous step's scroll would put the lines
# above the body's visible top — where Maestro still "sees" them (an inner
# scroller's clip is invisible to it) and a tap lands on the header. `below:`
# compares top edges, so the intro reads below the subtitle only while the
# body is at (or within ~60px of) its top.
- assertVisible:
    text: "Pick a team for each card, or leave it for later\\."
    below:
      text: "Cards with no team"

# ── THE SHARED NO-PLAYERS LINE ──────────────────────────────────────────────
# Every card whose name was SKIPPED has no players, and all of them are ONE
# line — keyed on having no players, never on a card's name or number. How
# many that is is no longer FETCHED - 1: with the reference catalogue loaded
# (NEO-330) a Roanoke player the catalogue already holds is never a name step,
# so his card keeps its player and gets a PLAYER line of its own. CI run
# 38302511049 attempt 2: 25 cards, "24 names need a look" (23 players + the
# listed team), Daniel Berthiaume and Matt DelGuidice known (their own lines,
# career chips, "Leave for later"), Paul Croteau created → "Cards with no
# players (22)". Which players the catalogue knows is the catalogue's
# business, so the count is READ off the line's own heading (one text node)
# and every later check is exact against it. Card 1 and card 2 below need two
# cards in the line.
- copyTextFrom:
    text: "Cards with no players \\([0-9]+\\)"
- evalScript: '${output.NO_PLAYERS = maestro.copiedText.match(/[0-9]+/)[0]}'
- assertTrue: '${Number(output.NO_PLAYERS) >= 2 && Number(output.NO_PLAYERS) <= Number(output.FETCHED) - 1}'
# "LEAVE FOR LATER" IS ITS DEFAULT — nothing is known about a card nobody is
# on, so nothing is pre-filled.
- assertVisible:
    text: "✓"
    childOf:
      id: "Leave for later — Cards with no players \\(${output.NO_PLAYERS}\\)"

# Open its cards. The button's words are the line's card numbers and its card
# count ("… · 24 cards"); no accessible name of its own, so by text.
- assertVisible:
    text: "#.* · ${output.NO_PLAYERS} cards"
    above:
      text: "Next \\(Enter\\)"
- tapOn:
    text: "#.* · ${output.NO_PLAYERS} cards"
# Client-side disclosure: 7000. `.` matches the label's U+2026 ellipsis.
- extendedWaitUntil:
    visible:
      id: "Just this card. — #.*"
    timeout: 7000
# PIN THE OPENED LIST INTO THE BODY'S SLICE. With the reference catalogue the
# known players' lines sit ABOVE the shared line (Daniel Berthiaume, Paul
# Croteau's pre-filled line), so the opened cards start at the body's bottom
# edge: card 1's "Just this card…" at y=476-500 while the body shows ~96-475,
# where Maestro still reports it and its tap lands under the footer on
# nothing (local run on the PR preview, 2026-10-12: "Match the others" never
# appeared). When the THIRD card's button is not above the footer's Next, the
# list is that low, and the opened list makes the body taller than its slice
# — the one case where a touch drag latches to the body (memory:
# touch-swipe-scrolls-a-dialog-body). ONE drag of a quarter viewport (~156px,
# the same gesture as the RXT pre-fill read below; x=18% is the dialog's left
# gutter, never a control) lifts card 1 to ~320. The guard after it is the
# hard check.
- runFlow:
    when:
      notVisible:
        id: "Just this card. — #.*"
        index: 2
        above:
          text: "Next \\(Enter\\)"
    commands:
      - swipe:
          start: "18%, 70%"
          end: "18%, 45%"

# ── CARD 1: "NO TEAM ON THIS CARD" ──────────────────────────────────────────
# GUARD, then "Just this card…" gives card 1 its own answers, starting from
# the line's ("Leave for later"); its button turns into "Match the others".
# Card 1's button is clear of the slice's bottom when card 3's top is above
# the footer's Next (`above:` compares top edges; ~24px rows).
- assertVisible:
    id: "Just this card. — #.*"
    index: 2
    above:
      text: "Next \\(Enter\\)"
- tapOn:
    id: "Just this card. — #.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "Match the others — #.*"
    timeout: 7000
# Card 1's own row is the only per-card row open, so its "No team on this
# card — #…" is the only one on screen (the line's own is owned "Cards with no
# players (…)" and cannot match `— #`). Recorded on the card at commit as the
# operator's answer (`teamNone`), so it is not flagged after the save.
- assertVisible:
    id: "No team on this card — #.*"
    above:
      text: "Next \\(Enter\\)"
- tapOn:
    id: "No team on this card — #.*"
- extendedWaitUntil:
    visible:
      text: "✓"
      childOf:
        id: "No team on this card — #.*"
    timeout: 7000
# …and the LINE, untouched, is still left for later — a card's own answer is
# per card, not the line's.
- assertVisible:
    text: "✓"
    childOf:
      id: "Leave for later — Cards with no players \\(${output.NO_PLAYERS}\\)"

# ── CARD 2: "OTHER TEAM…" CREATES A TEAM NOBODY OFFERED (C1) ────────────────
# Card 1's button now reads "Match the others", so the top-most
# "Just this card…" is card 2's.
- assertVisible:
    id: "Just this card. — #.*"
    index: 0
    above:
      text: "Next \\(Enter\\)"
- tapOn:
    id: "Just this card. — #.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "Match the others — #.*"
      index: 1
    timeout: 7000
# Every answer row carries "Other team…". It opens ONE focused search field
# under the row (placeholder "Search or add a team…", accessible name
# "Team name to find"); its last option is always `+ New team "<typed>"…`,
# and a name nothing matches opens the New Team dialog, where the team is
# created at once and joins the row selected. The fixture comes from the UI (a
# single-token name minted per attempt), and its chip is read back on the
# card after the save (STEP 9).
#
# Two per-card rows are open now, card 1's above card 2's, so card 2's
# "Other team… — #…" is index 1 (the line's own is owned "Cards with no
# players (…)", the player line's by his name; neither matches `— #`).
- assertVisible:
    id: "Other team. — #.*"
    index: 1
    above:
      text: "Next \\(Enter\\)"
- tapOn:
    id: "Other team. — #.*"
    index: 1
# Client-side mount: 7000. The field takes focus on arrival; the tap below is
# belt-and-braces so the typing cannot land anywhere else.
- extendedWaitUntil:
    visible:
      id: "Team name to find"
    timeout: 7000
- tapOn:
    id: "Team name to find"
- inputText: "RXO${output.ATTEMPT_TOKEN}T"
# NOTHING MATCHES THAT NAME — the precondition for creating it, and the proof
# that Enter below can only mean "create": the field shows "No matches." only
# once the search has answered for exactly what was typed and returned
# nothing, leaving `+ New team "<typed>"…` the one option. In-app search
# behind a debounce: 7000.
- extendedWaitUntil:
    visible: "No matches."
    timeout: 7000
# Enter picks the field's highlighted option — the create row — and reads no
# coordinates. The field sits under a uniquely-id'd host, so maestro-web's
# XPath re-find of the focused element lands on it and no other node
# (README, pressKey).
- pressKey: Enter
# THE DIALOG, labelled and seeded (`checklist-attention-walker-missing-team`
# has why both): portalled to `document.body` at z-[60], so nothing clips it.
- extendedWaitUntil:
    visible: "New team: RXO${output.ATTEMPT_TOKEN}T"
    timeout: 7000
- assertVisible:
    id: "New team name"
    text: "RXO${output.ATTEMPT_TOKEN}T"
# THE WRITE. Location blank and no League picked, so the composed name is
# exactly what was typed. By id, never a second Enter (Create and Cancel share
# a class string — README, pressKey).
- tapOn:
    id: "Create team RXO${output.ATTEMPT_TOKEN}T"
# The created team joins card 2's row SELECTED. The chip reads "Loading…"
# until the team's row arrives, so this waits on the chip's real name being
# the checked radio — a create that wrote nothing, or a pick that missed the
# row, leaves no such radio. Our own write and a query: 7000.
- extendedWaitUntil:
    visible:
      text: "✓"
      childOf:
        id: "RXO${output.ATTEMPT_TOKEN}T — #.*"
    timeout: 7000

# THE PRE-FILL. The created player's line offers his one in-window career team
# and has it CHECKED by default — nobody touched it. Read last, because
# reaching it may scroll the wizard's body: lines are in preview order, so his
# line is either above the shared no-players line or below it — and below it
# means below that line's opened list of 24 cards. The body is an inner
# scroller the window never moves, so the reach is TOUCH swipes (half a swipe,
# ~157px each) that start in the body's own left padding (the max-w-2xl dialog
# spans x≈168-840, so x=18% is its p-6 gutter, clear of every radio) and stop
# the moment the chip is in the hierarchy; 8 cover ~1,250px, more than the
# opened list.
- repeat:
    times: 8
    while:
      notVisible:
        id: "RXT${output.ATTEMPT_TOKEN} — .*"
    commands:
      - swipe:
          start: "18%, 70%"
          end: "18%, 45%"
- extendedWaitUntil:
    visible:
      text: "✓"
      childOf:
        id: "RXT${output.ATTEMPT_TOKEN} — .*"
    timeout: 7000

# What the checklist must say once this saves: every card left for later is
# flagged; the one answered "no team" is not, nor the pre-filled one, nor the
# one given RXO — K - 3, in the pill's own words ("1 needs you" singular, "N
# need you" otherwise). Exactly 3 because one Roanoke card per player
# (SET-REGISTRY measurement 5), so each answer above covers one card. The
# catalogue-known players' cards (their own lines) are left for later too:
# their careers hold several teams, none alone covering the 1994-95 window,
# so nothing pre-fills them (measured in the run above; a catalogue refresh
# that gave one of them a single covering team would pre-fill it and fail the
# pill count by name). LEFT is the bare number the re-sync in STEP 10 finds
# on its NO-PLAYERS line: that line less the two cards answered above.
- evalScript: '${output.NEED_YOU_N = String(Number(output.FETCHED) - 3)}'
- evalScript: '${output.NEED_YOU = output.NEED_YOU_N === "1" ? "1 needs you" : output.NEED_YOU_N + " need you"}'
- evalScript: '${output.LEFT = String(Number(output.NO_PLAYERS) - 2)}'

# ============================================================
# STEP 6c — NEXT (ENTER) LEAVES THE TEAMS STEP FOR THE SAVE STEP
#
# The step is left with the footer's Next (the answers above are held by the
# section, which stays mounted). `util-wizard-advance-to-save` presses it —
# and Next again on a "Card titles" step, should a title here ever need a look
# (none has: the titles are ~50 characters, nowhere near 80) — and stops on
# "Ready to save", which it asserts.
# ============================================================

# y, read on the teams step AFTER its answers (a team answer can change a
# card's title, and a title that then needs a look would add the "Card titles"
# step — the one way y may still grow here) and held to on the Save step,
# which is always "Step y of y" and adds nothing (entity-review-steps.ts, C6).
- copyTextFrom:
    text: "Step [0-9]+ of [0-9]+"
# NO `$` ANYWHERE INSIDE `${…}`. Maestro finds a script with the regex
# `(?<!\\)\$\{([^$]*)}` (maestro-orchestra-models `Env`), so a `$` in the body —
# here a regex end-anchor — means the text is never recognised as a script:
# the evalScript completes without running, STEPS_TOTAL stays undefined, and
# the assertTrue below compares against NaN. CI run 38198207277 failed exactly
# so ("false is true") on a header that read "Step 27 of 28" (re-run locally
# with the copied text logged: "Step 27 of 28"). The counter has one "of", so
# the anchor bought nothing.
- evalScript: '${output.STEPS_TOTAL = maestro.copiedText.match(/of ([0-9]+)/)[1]}'
# The teams step is never the last step: Save comes after it.
- assertTrue: '${Number(maestro.copiedText.match(/^Step ([0-9]+)/)[1]) < Number(output.STEPS_TOTAL)}'

- runFlow: util-wizard-advance-to-save.yaml

# Save is ALWAYS the last step: x = y, and y is the total the teams step read.
- assertVisible: "Step ${output.STEPS_TOTAL} of ${output.STEPS_TOTAL}"

# ── LINK 2 OF THE CHAIN: the review is about EVERY card the fetch produced ──
# How many cards this set has is the marketplace's business, not this flow's
# claim — so the number is the one read off the "Kept all …" line, never a
# literal. This is where a build that kept the dialog's narrowing behaviour
# (only the matched bucket, only what was explicitly kept) would part company
# with the fetch count. "Save N cards?" is the Save step's own heading.
- assertVisible:
    text: "Save ${output.FETCHED} cards?\\?"

# Never gated by the teams step's answers: Confirm & Save is the Save step's
# footer button.
- tapOn:
    text: ".*Confirm & Save.*"

# ============================================================
# STEP 7 — EVERY FETCHED CARD IS SAVED, AS A SINGLE-MARKETPLACE CARD
#
# Measured 1.2s to the "Saved …" banner. The 60s now sits on the GATE below
# rather than on the scroll — the same ceiling `checklist-wizard-link-commits`
# gives this commit, for the same reason (one row per card plus its skip
# records).
# ============================================================

# ── LINK 3 OF THE CHAIN: fetched == offered == SAVED ────────────────────────
# The banner is "Saved 25 cards." — NEO-335 removed the attention count and
# its "Fix them one at a time" button that used to trail it. `.*`-wrapped so
# the full stop and any later clause cannot break the count's match.
# R5 — the commit of a live fetch is the sanctioned wait, so it gets its own
# GATE and the scroll gets the bar. The banner appears once the server has
# written every fetched card plus its skip records; that is the R5
# marketplace exception and it is what the 60000 below is for.
# checklist-wizard-skip-commits-and-unskip.yaml gates the same commit the
# same way. The scroll then only has to centre the banner: MEASURED (CI
# 34349299679 + 34361627641) 7.03s including the wait, 1 centring swipe.
- extendedWaitUntil:
    visible:
      text: ".*Saved ${output.FETCHED} cards.*"
    timeout: 60000

# The scroll, at the bar — R6 is satisfied because the gate above is a WAIT,
# not a duplicate assertion of an element this step already proved.
- scrollUntilVisible:
    element:
      text: ".*Saved ${output.FETCHED} cards.*"
    centerElement: true
    timeout: 7000

# The checklist itself now holds exactly that many — asserted on the header's
# own count. The set was empty before the fetch (STEP 4), so this is an exact
# claim, not a lower bound. `.*`-wrapped because the driver emits the heading
# and the count in one node ("Cards (25)").
- scrollUntilVisible:
    element:
      text: ".*[(]${output.FETCHED}[)].*"
    centerElement: true
    timeout: 7000

# ── THE COUNT IS FINAL AT "Saved" (NEO-335) ─────────────────────────────────
# The header's amber pill counts the cards that need a person, and it must
# read K - 3 now — STEP 6b answered one card "No team on this card", gave
# another the team it created with "Other team…", the created player's card
# saved with its pre-filled team, and the rest were left for later. Before NEO-335 a BSC card was not flagged until the
# background queue re-asked BSC (300ms a card, a measured ~15s tail to 25), so
# this count started near 0 and climbed; now the commit stamps every card
# whose fetch-time lookup answered and the count is whole the moment the
# banner shows. 7000 is the R5 bar, and it is the discriminator: the old
# climb could not finish inside it. Full match, so a count that is still
# moving fails by its number. The pill sits in the checklist header's
# attention row, a few rows under the Cards header just centred.
- extendedWaitUntil:
    visible:
      text: ${output.NEED_YOU}
    timeout: 7000

# ── THE BADGE: these cards came from ONE marketplace, and the row says so ───
# The commit writes an `unmatched-sl` marker for a card kept from BSC alone
# (`candidateToPairingCard`: bucket "bscOnly" → unmatched "sl"), and
# `CardChecklistItem.badgeLabel` renders it as "BSC only". Its presence is the
# whole difference between "the dialog was skipped" and "the dialog was skipped
# AND the cards were kept correctly linked".
#
# Centring the Cards header above put the first rows on screen; the badge is
# inside the row.
- assertVisible: "BSC only"
# And nothing was invented on the side that was never attached.
- assertNotVisible: "SL only"

# ============================================================
# STEP 8 — THE BRAND-UNKNOWN ROW'S NAME NEVER REACHES A LISTING TITLE (NEO-272)
#
# ⚠️ A DIFFERENT FEATURE FROM THE ONE THIS FLOW IS NAMED FOR. See the R1/R2
# block in the header for why it lives here. A red in this step is NEO-272.
#
# THE FEATURE. `Unknown` is not a brand — it is the year's row for the sets
# whose brand NB has not identified (before NEO-237 it wore the marketplace's
# own no-filter label, "All Brands"). That row carries the NB role
# `selectorOptions.metadata.isBrandUnknown`, and listing generation drops a
# flagged manufacturer entirely (`manufacturerAndSetTokens`,
# generateListing.ts): a name meaning "we do not know" tells a buyer nothing
# about the card in hand, so it is meaningless text in a buyer-facing field —
# and either spelling spends characters of a budget of exactly eighty saying it.
#
# WHY IT HAS TO BE ASSERTED LIVE, AND WHAT ONLY A LIVE RUN CAN SEE. The role
# is stamped inside the REAL sync — `ensureBrandUnknownRow`, which
# `fetchAggregatedOptions` calls when the manufacturer sync meets SportLots'
# "All Brands" option (live) and which the BSC phase of
# `syncSetsAcrossManufacturers` calls when a set matches no brand (both
# modes) — and the row's NAME is NB's "Unknown" in both cases, with the
# marketplace's option id attached in the first and never its label stored.
# `generateListing.test.ts` and `listingTitleBrandUnknown.test.ts` cover
# everything DOWNSTREAM of the flag; the convex-test fakes of the sync cover
# the routing with mocked marketplace actions. What only a live run sees is
# the whole chain on real marketplace data: SportLots really lists the
# option, the real adapter really returns it, the sync really routes it, and
# the title generator really drops the row — on the same deployment, in one
# run. STEP 1's cold syncs run that chain on every CI run of this flow;
# nothing else in the suite exercises it, on any year.
#
# ⚠️ WHY THIS IS NOT `assertNotVisible: "Unknown"`. The role deliberately
# changes NOTHING about the row's visibility — still an ordinary manufacturer,
# still in the breadcrumb, still in the manufacturer picker, and STEP 2
# asserted its collapsed card by that very name. A page-wide negative would
# fail on correct behaviour, or pass because a column had scrolled. All three
# assertions below are scoped to the drawer's `Card title` input, i.e. to the
# string the SERVER wrote.
#
# ── WHY THIS OPENS A CARD IT ADDED, AND NOT ONE THE COMMIT WROTE ────────────
#
# The first version of this step tapped `id: "Edit card .*"` on the committed
# checklist and CI run 34556066366 failed on its drawer gate, twice. The cause
# is structural and worth writing down, because it is not reachable by any
# selector:
#
#   * This set is 25 cards and EVERY ONE of them is numbered `NNO` (SET-REGISTRY
#     measurement 5). Product invariant 7 — a card number is never unique at any
#     scope. NEO-272 fixed the accessible names themselves (a row is now "Edit
#     card NNO, Jon Larson"), but a flow still cannot name one: the card names
#     are the marketplace's and unknowable from here.
#   * `CardChecklist`'s Virtuoso list runs `increaseViewportBy={{top: 200,
#     bottom: 400}}`, so it always renders ~3 rows ABOVE its own scroll
#     viewport. They are CSS-clipped, their layout bounds are real, and CDP
#     reports them 100% visible — the hazard `inserts-1996-score`'s STEP 7a
#     documents at length. Maestro took the first of those: bounds
#     `[670,223][705,243]`, tapped at (687,233), which on screen is the
#     `Cards (25)` header. Nothing opened.
#   * The usual cure — `below:` an anchor just above the list, which is what
#     1996-Score uses — does not have the margin here. The list's INTERNAL
#     scroll offset was 183px in that run, an emergent value nothing in the flow
#     chose (Virtuoso's `initialTopMostItemIndex` racing 25 rows' arrival), and
#     maestro-web's only scroll is `window.scroll` (README, R8) so no flow can
#     move it. The lowest anchor above the list was the ATTENTION row at
#     y=373 (then the filter chip, now NEO-335's "N need you" pill) against a
#     list viewport starting at y=406: a shift of 19-42px in
#     that offset silently puts a fully-clipped row on the near side of the
#     anchor and the tap lands on page chrome again.
#
# So this step stops trying to pick one of twenty-five identical rows and adds
# ONE card of its own, whose number — and therefore whose accessible name — is
# unique by construction. `addCustomCard` writes `generateListingTitle` at
# creation (write-once; `custom-card-row-opens-panel-with-autotitle` is built on
# that), and it composes the title from `findAncestorLabels`, which reads
# `metadata.isBrandUnknown` off the manufacturer row this set hangs under — the
# very flag STEP 1's sync had to stamp when it minted the row. A build that
# minted the row without the flag writes "1995 Unknown Roanoke Express ECHL …"
# here and fails, exactly as it would have on a committed row; a build that
# stored SportLots' option under its own label instead of routing it would
# have failed STEP 2 first, by name.
#
# WHAT THAT TRADES AWAY, stated plainly: the assertion no longer rides on the
# COMMIT path's own read of the flag (`commitCardChecklist`'s prelude resolves
# `manufacturerBrandUnknown` once per batch and hands it to the chunks). Both
# reads are NEO-272 code and both feed the same `assessListingTitle`, but only
# the hand-add one is proven live now. The stamping branch — the half no unit
# test can reach — is still proven, and that is the half this step exists for.
#
# R7a — THIS FLOW IS THIS SET'S SOLE WRITER (see the header), so adding a card
# to it is sanctioned. The card is added AFTER every count assertion above, so
# `Cards (25)`, `Saved 25 cards` and `Kept all 25` are all already banked. It
# carries no marketplace ids, nothing attaches any to it, and the set is
# single-use per preview deployment — the same reason STEP 4 asserts an empty
# checklist.
# ============================================================

# NO SCROLL BEFORE THIS TAP, and that is R10 rather than an R8 exception: the
# STEP 7 scroll left `Cards (25)` and its button row at y=198-230 (measured,
# run 34556066366) and `assertVisible: "BSC only"` has just proved the list
# below it is painted. `Add Card` is an ordinary non-virtualised button, fully
# on screen and well clear of the sticky binder header at y~84, so a scroll
# here would synchronise nothing — and `centerElement` on a target ABOVE the
# centre band is the one case R8 has no measurement for.
- tapOn:
    id: "Open add card form"

# The card-number input carries `autoFocus`, so the form being up IS the gate
# and `inputText` goes straight into it — the same two steps as
# `util-add-custom-card`. `Card number` is the unambiguous handle: the add form
# and the card drawer both carry a `Card name`, and only one of them a
# `Card number`.
- extendedWaitUntil:
    visible:
      id: "Card number"
    timeout: 7000
- inputText: "NB272-${ATTEMPT_ID}"

# No card NAME typed. `addCustomCard` defaults an empty one to
# `Card #<number>`, which is unique here for the same reason the number is, and
# every character typed into a title is a character of the 80-budget this step
# is asserting the contents of.
#
# centerElement is REQUIRED on this one (util-add-custom-card STEP 9): the form
# opens above a 437px list box, so Add sits near the fold, and maestro's own
# scroll-before-tap CDP call crashes on a target it cannot scroll to.
- scrollUntilVisible:
    element:
      id: "Submit new card"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Submit new card"

# THE SCROLL THAT MAKES THE TAP SAFE — and the reason this step is not the
# failure above wearing a different number. On add, `CardChecklist` itself fires
# `virtuosoRef.scrollToIndex({align:"center"})` for the new row (CardChecklist
# .tsx, the `newCardIdRef` effect), so the row settles in the MIDDLE of the
# list's own viewport, where it cannot be one of the clipped phantoms. This
# scroll then agrees with that: DOWN, because closing the form shortens the page
# and leaves the centred row at the window's bottom edge (the list box runs to
# y~844 in a 625px viewport), and centring drives the two authorities to the
# same target so the row is still there when its bounds are read.
# `waitToSettleTimeoutMs: 1000` lets Virtuoso settle between scroll steps.
#
# `(, .*)?` is NEO-272's label tail: the row is named "Edit card NB272-<attempt>,
# Card #NB272-<attempt>" now, and the pinned CLI matches an `id:` as a FULL
# match (README). The group is anchored by its ", " so it cannot reach a longer
# card number, and it still matches the bare name if the card name is ever gone.
- scrollUntilVisible:
    element:
      id: "Edit card NB272-${ATTEMPT_ID}(, .*)?"
    centerElement: true
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
    timeout: 7000

# NO RETRY ANY MORE (NEO-335). One wrapped this tap while the attention count
# was still climbing after the commit: a row whose attention slot flipped
# re-measured the Virtuoso list under bounds Maestro had already read
# (CardChecklist.tsx's "bounds-then-tap window races Virtuoso's height
# recompute"). The count is now final at "Saved" — STEP 7 asserts exactly
# that — and this card is born with its own badge, so no row's attention slot
# changes between the bounds read and the click. A dropped tap here is a
# finding about the list, not a retry to restore.
#
# The gate is `Card title`, not `Card name`: the add form has a `Card name` too,
# and a gate that a just-closed form could satisfy is not a gate.
- tapOn:
    id: "Edit card NB272-${ATTEMPT_ID}(, .*)?"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: "Card title"
    timeout: 7000

# THE POSITIVE, FIRST — a negative alone is satisfied by a drawer that never
# opened. For an `<input>` Maestro's getNodeText returns its VALUE, so this
# reads the stored `listingTitle` rather than a label. The set name is in that
# title by construction, not by measurement: `assessListingTitle` puts
# year/manufacturer/set in the CORE, and this core is ~25 characters against a
# cap of 80, so nothing truncates it.
- assertVisible:
    id: "Card title"
    text: ".*${output.SET}.*"

# THE CLAIM, in both spellings. A build that minted the row without the role
# writes "1995 Unknown Roanoke Express ECHL #<n> …" and fails on the first
# negative; a build that stored SportLots' option label as the row's name
# (the pre-NEO-237 shape, or a regression of D6) writes "1995 All Brands …"
# and fails on the second. Both are the same feature — the flagged row's
# name, whatever it is, stays out of the title — asserted against the two
# names this row has ever carried.
#
# The exact SHAPE of the title is deliberately NOT asserted. No run has ever
# measured one on this fixture, and a guessed literal ("1995 <set> #<n> Hockey")
# would be a false red on a correct build the first time a season value, a
# resolved team or a print run surprised it — expensive here, because the
# fixture self-drains, so a local re-run to diagnose fails at STEP 4 by design.
# Once a preview run has recorded a real title on this set, tighten this pair
# into one anchored positive and record what it measured.
- assertNotVisible:
    id: "Card title"
    text: ".*Unknown.*"
- assertNotVisible:
    id: "Card title"
    text: ".*All Brands.*"

# ============================================================
# STEP 9 — BOTH TEAMS ANSWERED IN THE WIZARD ARE ON THEIR CARDS (NEO-335)
#
# The pre-filled `RXT<token>` on the created player's card, and the
# `RXO<token>T` created with "Other team…" on the second card of the shared
# no-players line.
#
# The drawer STEP 8 opened is the way to those cards. Every committed card is
# `NNO` and its name is the marketplace's, so no selector can pick the row
# (STEP 8's block); the drawer's own "Next card" walks the checklist in its
# display order instead, and `NB272-…` sorts FIRST (`compareCardNumbers`: the
# text token "NB" before "NNO"), so walking forward visits every committed
# card once. Those two are the ONLY cards on this checklist with a team (the
# rest were left for later, answered "no team", or are NB272), and which of
# them the walk meets first is the checklist's display order, not this
# flow's to know. So the walk stops on the first drawer showing ANY team
# chip — matched loosely so a chip whose name is still loading
# (`Remove team <id>`) stops it too — waits for it to name one of the two,
# reads WHICH, steps past it, and walks on to the next teamed card, which
# must name the other. Each chip is the drawer's TeamPicker reading the stored
# row's `teamOnCardIds`: the read-back. `times:` is a runaway guard; a walk
# that never finds a chip fails at the gate under it. The TeamPicker sits
# above "Card title" in the drawer body, which STEP 8 just read, so no
# in-drawer swipe is needed (Teams is the body's second field).
# ============================================================

- repeat:
    times: 30
    while:
      notVisible:
        id: "Remove team .*"
    commands:
      - tapOn:
          id: "Next card"
- extendedWaitUntil:
    visible:
      id: "Remove team (RXT${output.ATTEMPT_TOKEN}|RXO${output.ATTEMPT_TOKEN}T)( · .*)?"
    timeout: 7000
# The chip's own name span ("Team: <name>" is its accessible name; its text is
# the name) says which of the two this card carries.
- copyTextFrom:
    id: "Team: (RXT${output.ATTEMPT_TOKEN}|RXO${output.ATTEMPT_TOKEN}T)( · .*)?"
- evalScript: '${output.FIRST_TEAM = maestro.copiedText.indexOf("RXO") === 0 ? "RXO" + output.ATTEMPT_TOKEN + "T" : "RXT" + output.ATTEMPT_TOKEN}'
- evalScript: '${output.SECOND_TEAM = output.FIRST_TEAM.indexOf("RXO") === 0 ? "RXT" + output.ATTEMPT_TOKEN : "RXO" + output.ATTEMPT_TOKEN + "T"}'
# Step past it, and wait for its chip to go, so the walk below cannot stop on
# the drawer it is leaving (the positive wait under the walk is what makes
# this negative mean something on a live page).
- tapOn:
    id: "Next card"
- extendedWaitUntil:
    notVisible:
      id: "Remove team ${output.FIRST_TEAM}( · .*)?"
    timeout: 7000
- repeat:
    times: 30
    while:
      notVisible:
        id: "Remove team .*"
    commands:
      - tapOn:
          id: "Next card"
- extendedWaitUntil:
    visible:
      id: "Remove team ${output.SECOND_TEAM}( · .*)?"
    timeout: 7000
- tapOn:
    id: "Done editing card"
- extendedWaitUntil:
    notVisible:
      id: "Card title"
    timeout: 7000

# ============================================================
# STEP 10 — A RE-SYNC WITH NO NAMES LEFT OPENS THE REVIEW TEAMS-ONLY (NEO-335)
#
# Every name on these cards is now known (the created player) or skipped for
# this set (the skip records the commit wrote, which entity resolution
# consults), and LEFT cards are stored with no team. So the next sync has no
# names to ask but cards that would save teamless, and NEO-335 opens the
# review straight onto its teams step for them — "Step 1 of 2", the teams
# step and then Save (NEO-335 Phase 2; a re-synced row is not a NEW row, so
# no "Card titles" step can join them).
#
# THE CONTENT REVIEW COMES FIRST, AND IT ALWAYS COMES. A re-sync diffs every
# incoming card against its stored row (NEO-203). The pre-filled card is
# stored WITH `RXT<token>` and arrives with none (BSC lists "Roanoke Express",
# which the first sitting skipped as "not a team"; header ⚠️), and every
# skipped card is stored with no player link against an incoming name — both
# are content changes, so `needsSyncReview` is true on every run of this
# flow, and "Skip changes" (apply nothing, keep NeonBinder's version) is the
# deterministic way through. No Match Cards: still one marketplace attached.
#
# The teams step then asks about the LEFT cards and no others: the re-synced
# rows that carry a team (the pre-filled one, the RXO one) or an operator's
# "no team" (the one STEP 6b answered) are settled (`settledTeamIndexes`),
# and NB272 carries no marketplace id, so it is not in the fetch at all. The
# skipped-name cards left for later are all playerless (their names were
# skipped for this set), so they are ONE line, "Cards with no players
# (LEFT)" — an exact count, in the line's own accessible names. The
# catalogue-known players' cards (left for later too) come back as their own
# player lines beside it; they are not this step's claim.
# ============================================================

# The Refresh button heads the checklist, ABOVE the rows the drawer walk
# scrolled — UP. Its accessible name is the same "Sync card checklist" as the
# empty state's button (one renders at a time).
- scrollUntilVisible:
    element:
      id: "Sync card checklist"
    direction: UP
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Sync card checklist"

# R5 exception: a live BSC fetch, then the diff. Same 60s ceiling as STEP 5.
- extendedWaitUntil:
    visible:
      id: "Skip reviewing changes and continue"
    timeout: 60000
- assertNotVisible: "Match Cards.*"
# The review is a fixed dialog; its footer button is tapped where it stands
# (R8 case 2).
- tapOn:
    id: "Skip reviewing changes and continue"

# THE FEATURE: the same review, teams only. Entity resolution runs no lookups
# here (nothing is unknown), so this is our own server answering: 7000.
- extendedWaitUntil:
    visible: "Tidy up this set"
    timeout: 7000
# Teams-only is a two-step sitting: this step, then Save. Header text, pinned.
- assertVisible: "Step 1 of 2"
- assertVisible: "Cards with no team"
# No names: neither bulk link exists, because nothing is undecided. Paired
# with the positives above, so a dead page cannot satisfy them.
- assertNotVisible:
    text: ".*Skip remaining names.*"
- assertNotVisible:
    text: ".*Add remaining players as new.*"
# The LEFT cards, exactly, on one shared line, back on "Leave for later" (the
# same default; nothing about them is known now that was not known then).
# Full match on the count, so a step that re-asked the "no team" or RXO card
# reads LEFT+1 or LEFT+2 and fails here…
- assertVisible:
    text: "✓"
    childOf:
      id: "Leave for later — Cards with no players \\(${output.LEFT}\\)"
# …and the settled pre-filled card is NOT asked again: its line would be the
# created player's, offering (and pre-filling) `RXT<token>` from his stored
# card and career. Paired with the positive above.
- assertNotVisible:
    id: "RXT${output.ATTEMPT_TOKEN} — .*"

# Next leaves every line on its default and lands on Save, "Step 2 of 2", for
# every fetched card again.
- runFlow: util-wizard-advance-to-save.yaml
- assertVisible: "Step 2 of 2"
- assertVisible:
    text: "Save ${output.FETCHED} cards?\\?"

# Never gated: Confirm & Save with every line on its default saves the same
# cards again, and the count must hold. Our own write: 7000 (R5).
#
# EXACTLY "Saved N cards.", with NO tail (R2). Every name on these cards was
# answered in the first sitting (one created, the rest skipped, the skips
# stored per set), so this commit has nothing to report beyond the count.
# The banner is ONE text node holding the count and every note the commit
# appends (CardChecklist `committedText`), and `text:` is a full match, so
# any note fails here by name. The one this pins:
# "N names were not reviewed; those cards have no player/team link." That is
# the commit treating names it found in the set's stored skips as
# unanswered, and stamping them back onto the cards as pending names. CI run
# 38285320710 showed it as "25 names were not reviewed" with
# "Roanoke Express (unconfirmed)" on the rows, a team the operator had ruled
# "not a team". The other notes cannot apply here: nothing is deleted or
# stale, no card links twice, all 25 match by BSC ref, and NB272 carries no
# marketplace id, so it is never "no longer listed upstream".
- tapOn:
    text: ".*Confirm & Save.*"
- extendedWaitUntil:
    visible:
      text: "Saved ${output.FETCHED} cards\\."
    timeout: 7000

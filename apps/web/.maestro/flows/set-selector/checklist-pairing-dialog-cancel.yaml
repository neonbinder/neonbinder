appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Checklist — the card-pairing dialog opens instead of committing, flags a marketplace name disagreement on a manual link, and cancelling writes nothing"
tags:
  - set-selector
---
# R1 — ONE FEATURE: NEO-137's card-pairing step. Syncing a marketplace-backed
# checklist no longer generates NB cards directly; it returns three buckets of
# CANDIDATES and opens CardPairingModal. Cards exist only after the operator
# confirms.
#
# R1 — the ONE feature is this dialog's contract with the operator, from the
# moment it replaces a commit to the moment a cancel leaves nothing behind.
# NEO-189 added a third clause to that contract (a manual link whose two sides
# disagree about the name must say so), and it is asserted here rather than in
# its own flow because a second flow would have to fetch this same shared real
# set again — see the long note in STEP 3 for why that is a flake risk, not
# just a cost.
#
# WHAT THIS TESTS:
#   - Sync opens "Match Cards" rather than committing straight away.
#   - The dialog NAMES the set it is for, and — since every Future Stars card
#     pairs — opens with the matched list expanded and no empty columns.
#   - The footer states how many cards will be saved.
#   - NEO-189: cross-linking two rows the marketplaces name differently raises a
#     name-conflict choice on the merged row, opens the Matched section to show
#     it, defaults to BSC, changes the name the row will be saved with when the
#     operator picks SportLots, and does NOT block Confirm.
#   - Cancel writes nothing: the status message says so and the card count on
#     the set is unchanged.
#
# ── WHY THIS FLOW IS READ-ONLY (and therefore allowed on a REAL set) ──
#   .maestro/SET-REGISTRY.md: real marketplace sets are READ-ONLY for every flow
#   except setup.yaml, because the queue drains across 8 parallel runners and any
#   write is visible to whoever else is mid-flow.
#
#   This flow only ever CANCELS. CardPairingModal writes nothing until Confirm —
#   commitCardChecklist is not reached on the cancel path — so no card, player or
#   team is created and the shared set is left exactly as setup.yaml provisioned
#   it. That is what makes exercising it here legitimate.
#
#   A per-worker CUSTOM set cannot cover this: a custom subtree is short-
#   circuited before any marketplace fetch (isCustomSubtree, NEO-22), so it has
#   no candidates, and CardChecklist deliberately SKIPS the pairing dialog when
#   all three buckets are empty rather than showing an empty step. The dialog is
#   only reachable with real marketplace data.
#
#   NO NEW REAL SET IS SYNCED. This uses "Insert → Future Stars" from the
#   existing 2024 Topps Chrome anchor that setup.yaml already provisions.
#   Adding a real set requires explicit owner approval every time — the 1996
#   Score map-out named in NEO-137's Phase 5 needs that approval and is NOT
#   added here.
#
# R3 — DEDUP: the entity-review wizard's own cancel path is covered by
#   checklist-fetch-cancel-dialog (custom subtree, no pairing step). This flow
#   uniquely covers the pairing dialog that now precedes it. No other flow
#   links, unlinks or re-pairs anything — variation-link-group-and-unlink is a
#   per-worker CUSTOM set and never opens this dialog at all.

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# DRILL TO THE REAL PRE-SYNCED 2024 Topps Chrome → Insert → Future Stars
# ============================================================

- runFlow:
    file: util-drill-to-2024-topps-chrome.yaml

# Mirrors setup.yaml's proven Insert drill exactly (R9 — do not hand-roll a
# variant of it). Two things make the naive version wrong:
#   1. Tapping "Insert" reveals the INSERTS COLUMN — wait on "Inserts", the
#      column header, not on a row inside it.
#   2. "Future Stars" is NOT directly visible. The Inserts column carries many
#      entries, so it renders a search input and the row only appears once
#      filtered. `below: {id: "Search inserts"}` targets the RESULT row rather
#      than the input itself.
- scrollUntilVisible:
    element:
      text: "Insert"
    centerElement: true
    timeout: 10000
- tapOn: "Insert"
- extendedWaitUntil:
    visible: "Inserts"
    timeout: 20000

# The inserts are already reconciled by setup.yaml, so the search input is the
# expected state here; the Reconcile modal should not appear.
- extendedWaitUntil:
    visible: ".*Search inserts.*"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: ".*Search inserts.*"
    centerElement: true
    timeout: 10000
# 250ms settle so the input is focused before inputText fires — a 0ms settle
# drops the first character on this reactive page.
- tapOn:
    text: ".*Search inserts.*"
    waitToSettleTimeoutMs: 250
- inputText: "Future Stars"
- extendedWaitUntil:
    visible:
      text: "^Future Stars$"
      below:
        id: "Search inserts"
    timeout: 15000
- tapOn:
    text: "^Future Stars$"
    below:
      id: "Search inserts"

# ============================================================
# STEP 1 — SYNC. This must NOT commit; it must open the pairing dialog.
# ============================================================

- scrollUntilVisible:
    element:
      id: "Sync card checklist"
    centerElement: true
    timeout: 15000
- tapOn:
    id: "Sync card checklist"

# 90s matches setup.yaml's own ceiling for a real-set Insert fetch (BSC + SL
# round-trip). The dialog heading proves the fetch returned CANDIDATES rather
# than committing straight to cards.
#
# setup.yaml already populated this checklist, so the previously-committed
# pairings replay into the matched bucket (sticky re-sync) — which is itself
# worth seeing exercised against live marketplace data.
- extendedWaitUntil:
    visible: "Match Cards.*"
    timeout: 90000

# ============================================================
# STEP 2 — THE DIALOG IDENTIFIES ITSELF AND STATES WHAT IT WILL SAVE
#
# The unmatched columns and keep shelf are DELIBERATELY NOT asserted here any
# more. They render only when there is something unmatched, and "Future Stars"
# is 20 cards with 20 BSC and 20 SportLots refs — every card pairs, so on this
# set the dialog correctly shows no columns at all. Asserting "BSC only (0)"
# would be asserting scaffolding that describes work that does not exist.
#
# Where each half is covered instead:
#   - the fully-matched presentation, against an immutable 220-card count:
#     inserts-1996-score-one-nb-set-two-bsc-sources
#   - the columns, keep-all and keep shelf, over every bucket permutation:
#     CardPairingModal.test.tsx
# What THIS flow uniquely proves is unchanged: a real marketplace sync opens
# the dialog instead of writing cards, and cancelling writes nothing.
# ============================================================

# The header names the set. This dialog is modal and can run to hundreds of
# rows; an operator who steps away needs to be able to tell what they are
# looking at. `setLabel` was a documented prop that the caller never passed,
# so the heading read a bare "Match Cards" until NEO-137.
- assertVisible:
    text: ".*Match Cards — Future Stars.*"

# Nothing is unmatched here, so the matched list opens EXPANDED rather than
# behind a "▶ Matched (20)" disclosure — the rows are the only thing worth
# reviewing, so hiding them served no one.
- assertVisible:
    text: ".*Unlink.*"

# NOT ASSERTED: the keep shelf.
#
# When it does render (a set with unmatched cards), it is the last section of
# the dialog's own scrollable body, so at the 1024x629 headless viewport it
# sits below the fold, and Maestro cannot drive that inner overflow —
# `scrollUntilVisible` reported "No visible element found" rather than
# scrolling to it.
#
# Rather than contort the flow (or reshape the UI to suit a test), the shelf's
# behaviour is covered where it belongs: CardPairingModal.test.tsx has 12 unit
# tests over keep / unkeep / keep-all / discard, including the 1996 Score case
# where a shared SportLots set's sibling-owned cards must NOT be saved. What
# E2E uniquely proves is the part unit tests cannot — that a real marketplace
# sync opens this dialog instead of writing cards, and that cancel writes
# nothing. That is what the rest of this flow asserts.
#
# The footer sits OUTSIDE the scrollable body (flex sibling), so it is on
# screen regardless of scroll position, and it reports the same count the
# shelf feeds.
- assertVisible:
    text: ".*[0-9]+ cards? will be saved.*"

# ════════════════════════════════════════════════════════════════════════════
# STEP 3 — NEO-189: A MANUAL LINK WHOSE TWO SIDES NAME THE CARD DIFFERENTLY
#
# THE FEATURE: when an operator links a BSC row to a SportLots row and the two
# marketplaces disagree about who is on the card, the merged row says so and
# lets the operator pick which name is saved — instead of BSC silently winning.
# The motivating case is a "Legend" short print: SportLots has
# "Mike Yastrzemski|Carl Yastrzemski" where BSC has a bare "Mike Yastrzemski",
# and the card is Carl. The old mergePair did `bsc.cardName || sl.cardName`, so
# the fact that it is Carl was dropped and the first anyone heard of it was a
# returned listing.
#
# WHY THIS LIVES IN THIS FLOW RATHER THAN A NEW ONE:
#   The conflict UI is only reachable through CardPairingModal, which is only
#   reachable from a real marketplace fetch (a custom subtree short-circuits
#   BSC/SL — isCustomSubtree, NEO-22 — and CardChecklist skips the dialog when
#   all three buckets are empty). A second flow would therefore have to fetch
#   THIS SAME shared real set a second time, at ~90s a go. One fetch, one flow.
#
#   NOTE (NEO-195 follow-up): the sharper hazard this note used to describe —
#   startCandidateBatch clearing every checklistCandidates row for the
#   selectorOption globally, and an unscoped getReadyCandidates, so two runners
#   streaming Future Stars at once emptied each other's live candidate set and
#   unmounted the other's dialog mid-review — has been FIXED. Both the clear
#   and the read are now scoped to the operator (createdByUserId), and each
#   runner signs in as its own dev+e2e-<N> user, so concurrent runners are
#   isolated. The ~90s argument for keeping this in one flow still stands.
#
# WHY THIS IS STILL READ-ONLY (R7a):
#   Every step below is modal-local reducer state. Nothing is written until
#   Confirm, and this flow still ends at Cancel — which is also why the
#   "does the CHOSEN name reach the saved card" half cannot be asserted here:
#   Confirm on the shared anchor would commit a deliberately mis-paired
#   checklist to a set eight runners read. That half is covered where it can be
#   proven without corrupting shared data — CardPairingModal.test.tsx pins the
#   onConfirm payload ("choosing SportLots commits Carl's name, not Mike's"),
#   and commitCardChecklist.variations.test.ts pins that the committed row
#   carries the name it was handed; resolveChecklistEntities passes `cards`
#   straight through and never touches cardName.
#
# WHY IT DOES NOT DEPEND ON LIVE MARKETPLACE DATA:
#   The conflict is MANUFACTURED here, not found. Two auto-matched pairs are
#   unlinked and then CROSS-linked (BSC's #FS-1 to SportLots' #FS-2) — the
#   mis-click case the feature deliberately covers ("applies to EVERY merged
#   pair, not only isVariation ones"). Every selector keys on the PRINTED CARD
#   NUMBER, never on a player name, and the two names are read off the screen
#   at runtime rather than hardcoded, so nothing here goes red if BSC edits a
#   card title. #FS-1 and #FS-2 are chosen because NEO-200 fixed
#   compareCardNumbers to sort prefixed codes naturally, so the matched list
#   now reads FS-1, FS-2, FS-3 … FS-9, FS-10, FS-11 … FS-20 — #FS-1 and #FS-2
#   are simply rows 1 and 2 in that order (no comparator quirk to lean on any
#   more), and stay inside the dialog's inner scroller, which Maestro cannot
#   drive (see the keep-shelf note above).
#
# NOT COVERED HERE — arrow-key operation of the radiogroup. Maestro's web
#   driver maps only ENTER and BACKSPACE (maestro.drivers.WebDriver
#   .mapToSeleniumKey); every other KeyCode throws "not supported on web", so
#   there is no way to send ArrowLeft/ArrowRight at all. The APG roving-tabindex
#   and arrow-key behaviour is covered by CardPairingModal.test.tsx.
# ════════════════════════════════════════════════════════════════════════════

# The dialog opens on the FIRST streamed candidates, so everything above can
# run mid-fetch. Everything below COUNTS rows, so wait for the fetch to
# actually finish first: while streaming, Confirm reads "Loading…" and only
# becomes "Confirm" once the action resolves. This is the one long wait in this
# section and it is a live BSC/SL round-trip, which is R5's sole exception.
- extendedWaitUntil:
    visible:
      text: "^Confirm$"
    timeout: 90000

# Baseline. setup.yaml provisions all 20 Future Stars cards with both a BSC and
# a SportLots ref, so every one auto-matches and the columns are empty.
- assertVisible:
    text: ".*Matched [(]20[)].*"
#
# NEO-199: the auto-matched pairs are now name-checked server-side too, so the
# header may already read "N name conflicts" before this flow touches anything —
# that would mean BSC and SportLots genuinely disagree about a Future Stars card,
# which is a fact about live marketplace data and not this flow's business. That
# is why nothing below asserts an ABSOLUTE conflict count: the flow proves the
# conflict IT MANUFACTURES is surfaced, by name, on the row it put it on.

# ── UNLINK TWO PAIRS SO THERE IS SOMETHING TO MIS-PAIR ──────────────────────
# Unlink splits a merged row back into its two halves and returns them to the
# columns, each with its OWN name back. Re-linking the same two halves would
# therefore reproduce whatever the pair already said — which for a Future Stars
# card is agreement — so two pairs are needed: the disagreement comes from
# CROSSING them, which is the mis-click case the feature covers.
#
# The Matched count is the settle signal for each tap — it is the number the
# next step depends on, so waiting on anything else would be waiting on a
# proxy.
- tapOn:
    id: "Unlink #FS-1 .*"
- extendedWaitUntil:
    visible:
      text: ".*Matched [(]19[)].*"
    timeout: 7000
- tapOn:
    id: "Unlink #FS-2 .*"
- extendedWaitUntil:
    visible:
      text: ".*Matched [(]18[)].*"
    timeout: 7000

# ── COLLAPSE MATCHED, SO THE COLUMNS ARE ON SCREEN AND SO THE AUTO-EXPAND
#    HAS SOMETHING TO PROVE ───────────────────────────────────────────────────
# Two jobs in one tap. 18 matched rows push the BSC/SportLots columns out of the
# dialog's inner scroller, which Maestro cannot scroll — collapsing brings them
# up. And the product behaviour under test ("open the Matched section the
# moment a link creates a disagreement") can only be observed from a COLLAPSED
# start, which is also the real-world one: the section collapses by default
# whenever a column has anything in it, i.e. exactly when manual pairing
# happens.
#
# NEO-199: `.*`-terminated, because the toggle's accessible name grows a
# ", N with a name conflict" suffix whenever the matched list holds one — and
# since the server now flags auto-matched disagreements, that can be true here
# before this flow has linked anything. An exact-match id would then find no
# element and the flow would fail on a tap, blaming the wrong thing.
- tapOn:
    id: "Collapse matched cards.*"
- extendedWaitUntil:
    visible:
      id: "Expand matched cards.*"
    timeout: 7000
- assertVisible:
    text: ".*BSC only [(]2[)].*"

# ── CROSS-LINK: BSC's #FS-1 to SportLots' #FS-2 ─────────────────────────────
# The SportLots row is not clickable until a BSC row is selected, so the
# selected-state label is the settle signal before the link.
- tapOn:
    id: "Select BSC card #FS-1 .*"
- extendedWaitUntil:
    visible:
      id: "#FS-1 .*, selected. Press to deselect."
    timeout: 7000
- tapOn:
    id: "Link selected BSC card to #FS-2 .*"

# ── THE WARNING IS SURFACED, AND THE SECTION OPENED ITSELF TO SHOW IT ───────
# This one assertion carries both halves: the toggle's accessible name says
# "Collapse", which it only does while the section is EXPANDED — so the link
# re-opened the section the previous step closed — and it states a count.
# A warning inside a closed section is not a warning.
#
# The count itself is matched loosely (NEO-199). It used to be pinned at exactly
# 1, which was safe only while the modal could not detect an auto-matched
# disagreement; now that it can, a hardcoded 1 would be an assertion about
# whether BSC and SportLots happen to agree on all 20 Future Stars cards — live
# data this flow deliberately does not depend on anywhere else (see the note at
# the baseline). What the flow actually needs to prove is that ITS conflict was
# surfaced on the row it made, and the row-scoped assertions immediately below
# prove exactly that, by card number.
- extendedWaitUntil:
    visible:
      id: "Collapse matched cards, .* with a name conflict"
    timeout: 7000
# The same warning, in the words a sighted operator reads on the header.
- assertVisible:
    text: ".*name conflict.*"

# The row itself: the warning region, the sentence explaining WHY there is a
# choice, and the two names as a single-select group.
- assertVisible:
    id: "Name conflict on #FS-1"
- assertVisible:
    text: ".*These marketplaces name this card differently.*"
- assertVisible:
    id: "Name for #FS-1"
- assertVisible:
    id: "BSC: .* — use this name for #FS-1"
- assertVisible:
    id: "SportLots: .* — use this name for #FS-1"

# ── BOTH NAMES ARE READ OFF THE SCREEN, SO NO LIVE VALUE IS HARDCODED ───────
- copyTextFrom:
    id: "BSC: .* — use this name for #FS-1"
- evalScript: '${output.bscName = maestro.copiedText.replace("BSC: ", "").trim()}'
- copyTextFrom:
    id: "SportLots: .* — use this name for #FS-1"
- evalScript: '${output.slName = maestro.copiedText.replace("SportLots: ", "").trim()}'
# States the flow's one data precondition out loud: #FS-1 and #FS-2 have to be
# different players for there to be a disagreement at all. If a future printing
# ever put the same player on both, this fails HERE, naming the reason, rather
# than looking like the feature stopped working.
- assertTrue: ${output.slName !== output.bscName}

# ── BSC IS THE DEFAULT — asserted on the NAME THE ROW WILL BE SAVED WITH,
#    not on the pill's styling ────────────────────────────────────────────────
# The merged row's own label (and so its Unlink control) carries whichever name
# is currently chosen. It reading BSC's name is what "BSC is checked by
# default" actually MEANS to an operator.
- assertVisible:
    id: "Unlink #FS-1 ${output.bscName}"

# ── CHOOSING SPORTLOTS CHANGES THE NAME THE CARD WOULD BE SAVED WITH ────────
- tapOn:
    id: "SportLots: .* — use this name for #FS-1"
- extendedWaitUntil:
    visible:
      id: "Unlink #FS-1 ${output.slName}"
    timeout: 7000
# And BSC's name is gone from the row — the choice replaced it rather than
# adding to it.
- assertNotVisible:
    id: "Unlink #FS-1 ${output.bscName}"

# ── A CONFLICT DOES NOT BLOCK CONFIRM ───────────────────────────────────────
# Deliberately not a gate: blocking would let one flagged row hold a streamed
# 660-card commit hostage, and the defect was silence, not permissiveness.
# 20 auto-matched − 2 unlinked + 1 re-linked = 19, so the conflicted row is
# counted for saving rather than withheld, and Confirm is still offering to
# save (it reads "Loading…" while blocked and "Saving…" once committing).
- assertVisible:
    text: ".*19 cards will be saved.*"
- assertVisible:
    text: "^Confirm$"

# ============================================================
# STEP 4 — CANCEL WRITES NOTHING
# ============================================================

- tapOn:
    id: "Cancel card matching"
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible: "Match Cards.*"
    timeout: 10000
- assertVisible: "Sync cancelled — no cards saved."

# The set is untouched: the Sync button is still available for a retry, and no
# entity-review wizard was opened (cancel happens before entity resolution).
- assertNotVisible: "Confirm New Players & Teams"
- scrollUntilVisible:
    element:
      id: "Sync card checklist"
    direction: UP
    centerElement: true

appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Checklist — card rows render card number, sub-line, attribute badges, and platform badges"
tags:
  - set-selector
---
# Rendering test: confirms that a populated CardChecklist draws rich structured
# fields on each card row — card numbers, platform badges, and rookie badges.
#
# DEPENDS ON: setup.yaml having pre-synced the 2024 Topps Chrome Base checklist
# (~335 cards) for this worker. If the checklist is empty this flow fails loudly —
# correct behavior; the fix is to ensure setup ran, not to paper over it.
#
# WHAT THIS TESTS:
#   - Card numbers appear as "#NNN" in the left column of each row
#   - BSC platform badge appears on marketplace-sourced cards
#   - SL platform badge appears too — i.e. cards carry BOTH marketplace refs
#   - RC badge appears for rookie cards (common in 2024 Topps Chrome Base)
#
# WHY THE "SL" BADGE IS NOT ASSERTED ON *THIS* CHECKLIST.
#
# Measured on dev 2026-08-11, after the NEO-137 SportLots pagination fix: Base
# holds 335 cards, 335 with a BSC ref and 300 with a SportLots ref. SL covers
# #1-#300, so the last ~35 cards legitimately carry no SL badge — BSC simply
# lists more cards for this set than SportLots does.
#
# The CardChecklist virtuoso opens at the BOTTOM (initialTopMostItemIndex =
# last card), which lands squarely in that SL-less tail. Both approaches were
# tried and both fail against a perfectly healthy fetch:
#   - a bare `assertVisible: "SL"`      -> "Assertion is false: SL is visible"
#   - `scrollUntilVisible` direction UP -> "No visible element found: SL"
# confirming that Maestro's page-level scroll cannot drive the inner virtuoso
# upward, exactly as the pre-NEO-137 note claimed.
#
# (Those runs predate the badge-text change — the badge then read
# "SL: <label>" and now reads a bare "SL". That is irrelevant to the reasoning
# here: the tail rows carry no SportLots ref at all, so NO form of the badge
# renders on them. The coverage gap is the blocker, not the selector.)
#
# The SL-coverage guard therefore lives in setup.yaml on the PARALLEL checklist
# ("Gold Wave Refractors"), which measured 300 cards with 300 SportLots refs —
# 100% coverage, so the badge is present at the virtuoso's landing position,
# AND >100 cards, so a regression to single-page fetching would strip SL from
# the tail and fail there. Asserting it on Base would prove nothing extra.
#
# Print-run ("/N") belongs to parallel variant types, not Base; not asserted.
#
# FLOW: launch → drill to Base (setup pre-synced) → verify rich fields on rows.
# No marketplace fetch; the data is already there from setup.

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: "Set Selector"
    timeout: 45000

# ============================================================
# DRILL TO BASE VARIANT (setup pre-synced 335 cards)
# ============================================================

- runFlow:
    file: util-drill-to-base-variant.yaml

# ============================================================
# SCROLL INTO THE CARD ROWS
# The drill leaves the "Add Card" / "Refresh" action row visible.
# Card rows render below it; scroll one into view before asserting.
# ============================================================

- scrollUntilVisible:
    element:
      text: ".*#[0-9].*"
    centerElement: true
    timeout: 10000

# ============================================================
# VERIFY CARD ROW STRUCTURE — ALWAYS-PRESENT FIELDS
# ============================================================

# At least one card number in "#NNN" format is visible.
- assertVisible:
    text: ".*#[0-9].*"

# BSC platform badge appears on at least one card row.
- assertVisible: "BSC"

# The "SL" badge is deliberately NOT asserted here — see the header note. The
# SL-coverage guard lives on the Parallel checklist in setup.yaml instead,
# where coverage is 100%.

# ============================================================
# VERIFY RC BADGE — scroll through the list to find a rookie card.
# RC badges are common in Base sets; the flow fails only if none
# exist in the entire list (unexpected for 2024 Topps Chrome Base).
# scrollUntilVisible failing loudly is the assertion — no redundant assertVisible.
# ============================================================

- scrollUntilVisible:
    element:
      text: "RC"
    centerElement: true
    timeout: 30000

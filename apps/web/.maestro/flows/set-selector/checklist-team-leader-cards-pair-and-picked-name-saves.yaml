appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Match Cards on 2014 Topps Football — team-leader cards pair with no conflict, and the name the operator picks is the one saved (NEO-343, NEO-344)"
tags:
  - set-selector
---
# ════════════════════════════════════════════════════════════════════════════
# R1 — ONE FEATURE: THE MATCH CARDS DIALOG'S NAME DECISION, ON A REAL SET.
# What a real two-marketplace fetch of 2014 Topps Football's Base puts in front
# of the operator as a name decision, and what the operator's answer becomes:
#
#   (a) NEO-343 — BSC sends a team-leader card as "<Team> TL" ("Buffalo Bills
#       TL"); SportLots calls it "Buffalo Bills". The BSC parser now strips "TL"
#       the way it strips "TC", so those cards stop raising a decision at all.
#       Before the fix the dialog's header read 40 name conflicts and 38 player
#       conflicts on this set, 32 of each from the 32 team-leader cards
#       (reported on prod 2026-10-13). STEP 4 bounds both counts under 32, and
#       STEP 5 reads one team-leader row (#6a, New England Patriots) by its
#       card number: matched, carrying the bare team name, with no name and no
#       players conflict on it.
#   (b) NEO-344 — a conflict that IS there shows each value bare, never which
#       marketplace said it (Jason, 2026-10-13: "I don't want the user swayed
#       by what marketplace the data comes from"), still opens on the BSC value
#       (the preselection stays), and the value the operator picks is the one
#       the card is SAVED with. STEP 6 makes the conflict on the LAST card
#       number, STEP 7 saves, STEP 8 reads the saved name back from the
#       checklist row.
#
#   Two tickets, one dialog, one fetch. A second flow would have to fetch this
#   same 440-card real set again, and a real set has exactly one writer (R7a),
#   so (b) rides on (a)'s fetch — the same reasoning
#   checklist-pairing-dialog-cancel gives for carrying NEO-189 on its fetch.
#
# ── THE FIXTURE (SET-REGISTRY.md → "Football → 2014 — the NEO-343 team-leader
#    fixture") ✅ APPROVED by Jason 2026-10-13 ─────────────────────────────────
#   Football → 2014 → Topps › Topps › Base. BSC: 554 base items (440 cards plus
#   their SP "b" photo variations), every team-leader card "<Team> TL", 32 of
#   them (#6a, 38a, 39a, 68a, 73, 94, 99, 101, 105, 108, 110, 116, 130, 146,
#   158, 166, 182, 191, 193, 204, 212, 213, 221, 226, 236, 251, 268, 271, 298,
#   299, 314, 327). SportLots "2014 Topps Base Set": the same cards as
#   "<Team>" ("#110 Buffalo Bills"). Read from both marketplaces' public
#   catalogues 2026-10-13; the in-app numbers below are NOT YET MEASURED.
#   Why this set and not a smaller one: "TL" lives only on Topps' flagship
#   football bases (2013–2015, plus the 2013 Mini and 2015 Oversized
#   reprints, all 440–500 cards). 2014 is the one where SportLots names the
#   card "<Team>", so the pair rests on the BSC "TL" parse alone. 2013's
#   SportLots rows read "<Team> Team"; that parse (the SportLots adapter's
#   team-card rule, same PR) is proved by the adapters' unit tests, not here —
#   a 2013 fetch would be a second real year and another ~4-minute flow.
#
# ── WHY THE CARDS ASSERTED ARE THE ONES THEY ARE ─────────────────────────────
#   The dialog's body and the checklist are both inner scrollers Maestro cannot
#   drive with scrollUntilVisible (README → "Asserting inside a dialog";
#   memory: committed-checklist-opens-mid-list). So:
#   * #6a is the team-leader card nearest the TOP of the matched list, which
#     is where the dialog opens: rows #1a … #6a, in natural number order
#     (`compareCards`), the sixth row.
#   * #442 (BSC's Jordan Lynch, a short print SportLots does not list) is the
#     LAST card number, so its saved row is the one a fresh checklist mount
#     opens on (`initialTopMostItemIndex` = last). It is BSC-only, so it sits
#     in the BSC column, reachable through the column's filter. Linking it
#     makes a conflict, and the link FOCUSES the new conflict's checked pill,
#     which scrolls the dialog body to the row wherever it is (performLink →
#     refocusSelectedRadio).
#   * Its partner is whichever SportLots-only card heads the SportLots column.
#     Expected from the catalogue: one of SportLots' "Retail Factory Set" /
#     "Leaning left" variations (#356, #367, #374, #429, #431, #434), which BSC
#     does not list. The flow reads its name off the row; nothing is
#     hardcoded but the two card numbers.
#   The conflict (b) acts on is therefore MANUFACTURED from two real fetched
#   halves, as checklist-pairing-dialog-cancel's is, because no natural
#   conflict on this set is reachable at both ends: the natural ones (#72,
#   #247, #257, #405 by the catalogues) sit mid-list in the dialog AND in the
#   checklist.
#
# ── WRITES (R7, R7a) ────────────────────────────────────────────────────────
#   SOLE WRITER OF FOOTBALL → 2014. No other flow opens the year. The cold
#   drill syncs its Years, Manufacturers and year-wide Sets; selecting `Topps`
#   syncs its Variant Types; the Base picker CONFIRMS a mapping on both sides;
#   the checklist is COMMITTED, including the deliberately mis-paired #442. If
#   the review wizard opens, every name is skipped (per-set
#   `entityReviewSkips`) and its teams / titles steps are left on their
#   defaults; no player, team or league row is created. Not
#   self-cleaning: the scripted reset at the head of every run is its cleanup.
#   FRESH-ONLY — a re-run on the same preview finds the checklist committed
#   and fails at STEP 3's empty-checklist assert, by name. Re-seed first.
#
# ── NEO-287: BOTH MODES, HARD ASSERTS IN EACH (R2) ──────────────────────────
#   Paused, nothing is asked of SportLots: there is no Match Cards dialog and
#   so no name decision at all — the feature has no surface (the same reason
#   checklist-pairing-dialog-cancel gives). The paused branch stops after the
#   drill and proves the pause on the page.
#
# ── R5 ──────────────────────────────────────────────────────────────────────
#   7000 for every NB read and write. Longer only for live external
#   round-trips, each named at its site: the cold drill's own ceilings
#   (util-drill-to-cold-real-set), the cold Variant Types and Base picker
#   (util-drill-to-base-variant), the checklist fetch (120000), the wizard or
#   the direct commit behind the entity check (60000), and the wizard's bulk
#   skip while its batch is still growing (60000,
#   checklist-one-marketplace-skips-match-dialog's measured reason).
#   ⚠️ NOT YET MEASURED: the 440-card commit behind `Confirm & Save` is held to
#   7000 like every NB write (R5: "a multi-transaction NB write is not an
#   exception"). If it misses, that is a product finding, never a bigger
#   number.
#
# ── HANDLES (visible text and accessible names; never a DOM id) ─────────────
#   dialog     `Match Cards.*`, `^Confirm$` (settled footer text), `Confirm
#              card matches`, `(Expand|Collapse) matched cards[, N with a
#              player conflict][, M with a name conflict]` (its text `▶|▼
#              Matched (N)`), `Unlink <label>`, `Name conflict on <scope>`,
#              `Players conflict on <scope>`, `Name for <scope>`, `<value> —
#              use this name for <scope>`, `Filter BSC cards`, `Select BSC card
#              <label>`, `<label>, selected. Press to deselect.`, `Link selected
#              BSC card to <label>`; `<label>` is `#<number> <name>[ ·
#              <variation>]`
#   wizard     `Tidy up this set` (NEO-335 title), `Skip remaining names
#              (N)`, `Next (Enter)` (visible text only), `Confirm & Save`
#              (Save step only); the post-name walk is
#              util-wizard-advance-to-save's
#   checklist  `Sync card checklist`, `No cards in this checklist yet.`,
#              `Saved N cards`, `Edit card <number>, <name>`
#
# ── R3 ──────────────────────────────────────────────────────────────────────
#   checklist-pairing-dialog-cancel proves the bare pills on a manufactured
#   conflict and then CANCELS (its set is read-only); this is the only flow
#   that saves through a name decision and reads the answer back, and the only
#   one that fetches a team-leader card. The drill is the shared utils' (R9);
#   the bulk skip is checklist-one-marketplace-skips-match-dialog's, and the
#   post-name walk to Save is util-wizard-advance-to-save (NEO-335).
# ════════════════════════════════════════════════════════════════════════════

- runFlow:
    file: ../util/util-paused-platforms.yaml

# ============================================================
# LAUNCH + SIGN IN (R4)
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# STEP 1 — COLD DRILL TO Football / 2014 / Topps (R9)
# No flow has opened Football → 2014, so every column below Sports arrives
# empty and syncs itself; the util pays those waits (its own R5 marketplace
# ceilings) and, under the pause, makes the `Topps` row by hand.
# ============================================================

- runFlow:
    file: util-drill-to-cold-real-set.yaml
    env:
      SPORT: "Football"
      YEAR: "2014"
      MANUFACTURER: "Topps"

# ============================================================
# STEP 2 — THE SET, ITS BASE, AND THE BASE MAPPING (R9)
# The warm util re-drills the now-synced path, picks the flagship set
# `Topps` (a FULL match under `Search sets`, so `Topps Chrome` and the rest
# cannot answer), waits out the set's cold Variant Types, taps `Base` and
# confirms the picker's first-ranked candidate on each side (live), or leaves
# it the no-write way (paused).
# ============================================================

- runFlow:
    file: util-drill-to-base-variant.yaml
    env:
      SPORT: "Football"
      YEAR: "2014"
      MANUFACTURER: "Topps"
      SET: "Topps"

# ============================================================
# PAUSED — no dialog, so no name decision to prove. Prove the pause instead:
# the strip above the Set Builder heading. It is ABOVE the current position
# (the util left the page at the checklist), so UP; not centred (R8 case 2):
# it sits at the top of the document and nothing is tapped.
# ============================================================

- runFlow:
    when:
      true: "${output.SL_PAUSED}"
    commands:
      - scrollUntilVisible:
          element:
            text: "SportLots is on pause\\."
          direction: UP
          timeout: 7000
      - assertNotVisible: "Match Cards.*"

# ============================================================
# LIVE — STEPS 3–8
# ============================================================

- runFlow:
    when:
      true: "${!output.SL_PAUSED}"
    commands:
      # ==========================================================
      # STEP 3 — FETCH. The empty-checklist assert makes everything below
      # THIS fetch's (and is where a re-run on an unreset preview stops).
      # R8 exception, MEASURED by util-fetch-real-set-checklist-to-wizard on
      # the same empty-checklist page: bounds unmoved across all six tries (no
      # scrollable overflow), so no centring.
      # ==========================================================
      - scrollUntilVisible:
          element:
            id: "Sync card checklist"
          timeout: 7000
      - assertVisible: "No cards in this checklist yet."
      - tapOn:
          id: "Sync card checklist"
      # One live BSC + SportLots round-trip (R5 marketplace exception), the
      # ceiling the sibling fetch utils give it.
      - extendedWaitUntil:
          visible: "Match Cards.*"
          timeout: 120000
      # The dialog OPENING is not the fetch FINISHING (NEO-195, streaming):
      # Confirm reads "Loading…" and every count is still moving until the
      # action resolves. Its settled text is the sync point (same fetch).
      - extendedWaitUntil:
          visible:
            text: "^Confirm$"
          timeout: 120000

      # ==========================================================
      # STEP 4 — (a) THE HEADER: FEWER THAN 32 OF EACH KIND OF CONFLICT
      # The Matched toggle's accessible name appends ", N with a player
      # conflict" and then ", M with a name conflict" whenever either is
      # non-zero (CardPairingModal, NEO-199/251), so ONE full-match read bounds
      # both. Each count must be 0–31 (the clause absent, or 1–31): with the
      # fix unwired, all 32 team-leader cards conflict on BOTH and each count
      # reaches at least 32 (40 and 38 on prod). Bounded rather than pinned
      # because the remaining conflicts are live marketplace disagreements
      # (the catalogues show #72, #247, #257, #405 among them) that are not
      # this flow's business — the same stance checklist-pairing-dialog-cancel
      # takes on Future Stars' counts. The first green run's actual counts go
      # in SET-REGISTRY.md.
      # ==========================================================
      - assertVisible:
          id: "(Expand|Collapse) matched cards(, ([0-9]|[12][0-9]|3[01]) with a player conflict)?(, ([0-9]|[12][0-9]|3[01]) with a name conflict)?"

      # ==========================================================
      # STEP 5 — (a) ONE TEAM-LEADER ROW: #6a, MATCHED, BARE NAME, NO CONFLICT
      #
      # OPEN THE MATCHED LIST. It opens collapsed whenever a column holds a
      # card (BSC's "b" photo variations have no SportLots partner, so it is
      # expected collapsed here) and expanded otherwise. The branch reads the
      # toggle's own text rather than paying a visibility guard (memory:
      # branch-on-copied-button-text): `▶ Matched (N)` collapsed, `▼ …`
      # expanded. Precondition: STEP 4 just proved the toggle (R2).
      # ==========================================================
      - copyTextFrom:
          id: "(Expand|Collapse) matched cards.*"
      - runFlow:
          when:
            true: '${maestro.copiedText.trim().indexOf("▶") === 0}'
          commands:
            - tapOn:
                id: "Expand matched cards.*"
      # Result (R2): the list is open, whichever branch ran.
      - extendedWaitUntil:
          visible:
            id: "Collapse matched cards.*"
          timeout: 7000

      # THE ROW. Its Unlink control's name is `Unlink <label>`, and `<label>`
      # carries the card's CHOSEN name — so this one read says the card paired
      # (it is in Matched at all) and that the name it will be saved with is
      # the bare team, with no "TL". `#6a?` because the number is BSC's ("6a",
      # the parent of a "6b" photo variation) unless NB normalises it; no `.*`
      # tail, so `New England Patriots TL` cannot answer.
      - assertVisible:
          id: "Unlink #6a? New England Patriots"
      # …and no decision sits on it, title or roster. The scope of a row with
      # one conflict on its number is the bare `#<number>` (conflictScopeLabels).
      # These negatives ride on the positive just above, so they cannot pass on
      # a dead page or an off-screen row (memory: negative-asserts-pass-on-a-
      # dead-page).
      - assertNotVisible:
          id: "Name conflict on #6a?( .*)?"
      - assertNotVisible:
          id: "Players conflict on #6a?( .*)?"

      # ==========================================================
      # STEP 6 — (b) A CONFLICT ON THE LAST CARD NUMBER, SHOWN BARE
      #
      # COLLAPSE MATCHED so the columns come up into the body's band (the
      # cancel flow's move, for the same reason).
      # ==========================================================
      - tapOn:
          id: "Collapse matched cards.*"
      - extendedWaitUntil:
          visible:
            id: "Expand matched cards.*"
          timeout: 7000

      # THE BSC HALF: #442, narrowed to by the column's filter (it matches on
      # the row's label, so "#442" is that card alone). Its name is read off
      # the row, never hardcoded: the button is one text node, `#442 <name>`.
      - tapOn:
          id: "Filter BSC cards"
          waitToSettleTimeoutMs: 250
      - inputText: "#442"
      - extendedWaitUntil:
          visible:
            id: "Select BSC card #442 .*"
          timeout: 7000
      - copyTextFrom:
          id: "Select BSC card #442 .*"
      - evalScript: '${output.bscName = maestro.copiedText.trim().replace(/^#442 /, "").replace(/ · .*$/, "")}'

      # THE SPORTLOTS HALF: the first SportLots-only card (header note). Its
      # label is `#<number> <name>[ · <variation>]`; the pill will show the
      # NAME, so the number and any variation are stripped. The label itself
      # is kept, escaped, to tap that exact row.
      - extendedWaitUntil:
          visible:
            id: "Link selected BSC card to .*"
          timeout: 7000
      - copyTextFrom:
          id: "Link selected BSC card to .*"
      - evalScript: '${output.slLabel = maestro.copiedText.trim()}'
      - evalScript: '${output.slName = output.slLabel.replace(/^#[^ ]+ /, "").replace(/ · .*$/, "")}'
      # Memory: runtime-names-need-regex-escaping — every runtime value that
      # goes back into an `id:`/`text:` is escaped once, here.
      - evalScript: '${output.slLabelRe = output.slLabel.replace(/[\^\[\]()*+?.|]/g, function (c) { return "\\" + c; })}'
      - evalScript: '${output.bscNameRe = output.bscName.replace(/[\^\[\]()*+?.|]/g, function (c) { return "\\" + c; })}'
      - evalScript: '${output.slNameRe = output.slName.replace(/[\^\[\]()*+?.|]/g, function (c) { return "\\" + c; })}'
      # The data precondition, stated (R2): two different names, or there is
      # no disagreement to make.
      - assertTrue: ${output.slName !== output.bscName}

      # LINK. The SportLots row is inert until a BSC row is selected, so the
      # selected-state label is the settle signal.
      - tapOn:
          id: "Select BSC card #442 .*"
      - extendedWaitUntil:
          visible:
            id: "#442 .*, selected. Press to deselect."
          timeout: 7000
      - tapOn:
          id: "Link selected BSC card to ${output.slLabelRe}"

      # THE CONFLICT IS RAISED ON #442, and the link opened Matched and focused
      # the row's checked pill (which scrolled the body to it).
      - extendedWaitUntil:
          visible:
            id: "Name conflict on #442"
          timeout: 7000
      - assertVisible:
          id: "Collapse matched cards.*"

      # NEO-344 — THE VALUES ARE BARE, visible and announced. Each pill is
      # asserted on ONE node by both halves: its accessible name and its
      # visible text (the label is the button's only direct text node; the
      # checked pill's `✓ ` is a separate aria-hidden span).
      - assertVisible:
          text: ".*Potential names for this card — pick the right one before it is listed\\..*"
      - assertVisible:
          id: "Name for #442"
      - assertVisible:
          id: "${output.bscNameRe} — use this name for #442"
          text: "${output.bscNameRe}"
      - assertVisible:
          id: "${output.slNameRe} — use this name for #442"
          text: "${output.slNameRe}"
      # …and no marketplace is named in the conflict UI: not the old sentence,
      # not a prefixed pill name or text, title or roster (the link makes the
      # rosters disagree too). They ride on the positives above.
      - assertNotVisible:
          text: ".*These marketplaces .*"
      - assertNotVisible:
          id: "(BSC|SportLots|Custom): .* — use (this name|these players) for #442"
      - assertNotVisible:
          text: "(BSC|SportLots|Custom): .*"
          id: ".* — use (this name|these players) for #442"

      # BSC STAYS PRESELECTED — read on the name the row will be saved with:
      # its Unlink control carries the chosen name.
      - assertVisible:
          id: "Unlink #442 ${output.bscNameRe}"

      # PICK THE OTHER VALUE, by the value it shows.
      - tapOn:
          id: "${output.slNameRe} — use this name for #442"
      - extendedWaitUntil:
          visible:
            id: "Unlink #442 ${output.slNameRe}"
          timeout: 7000
      - assertNotVisible:
          id: "Unlink #442 ${output.bscNameRe}"

      # ==========================================================
      # STEP 7 — SAVE
      # Confirm is the footer, outside the body's scroller (always on screen).
      # Nothing is kept: BSC's unpaired photo variations and SportLots'
      # unpaired cards are dropped, and the matched rows — #442 among them —
      # are saved.
      # ==========================================================
      - tapOn:
          id: "Confirm card matches"
      # An NB write: the 7000 bar (R5; measured 1.06s on the 2026 Bowman
      # dialog, SET-REGISTRY.md).
      - extendedWaitUntil:
          notVisible: "Match Cards.*"
          timeout: 7000

      # TWO LEGITIMATE SHAPES, named by the gate (R2): the review wizard,
      # "Tidy up this set" (NEO-335 WIZARD_TITLE) — names the catalogue does
      # not know (a team-leader card's team name is also reported as a PLAYER,
      # the TC rule, so up to 32 of those), or only its post-name steps (a
      # teamless card, a title that needs a look) — or the direct commit.
      # 60000: the wizard opens behind the batch the entity check starts (R5;
      # the dual-team flow's gate and ceiling). The branch reads the gate's own
      # node (memory: branch-on-copied-button-text); no notice reads `Saved`
      # before a commit, so the copy is the node the gate just saw.
      - extendedWaitUntil:
          visible:
            text: "Tidy up this set|.*Saved [1-9][0-9]* cards?.*"
          timeout: 60000
      - copyTextFrom:
          text: "Tidy up this set|.*Saved [1-9][0-9]* cards?.*"
      - runFlow:
          when:
            true: '${maestro.copiedText === "Tidy up this set"}'
          commands:
            # WHICH ENTRY. The title renders only once the rows have loaded, so
            # the footer is up with it: `Skip remaining names (N)` while any
            # name is undecided, else the names-done footer — `Next (Enter)`
            # (teams / titles step; NEO-335's no-names entry) or `Confirm &
            # Save` (Save). Read once and branched on (memory: branch-on-
            # copied-button-text), never a `when: visible` guard that costs
            # ~6.6s whenever it misses (R10). One TEXT matcher: `Next (Enter)`
            # has no accessible name.
            - extendedWaitUntil:
                visible:
                  text: ".*Skip remaining names \\([0-9]+\\).*|Next \\(Enter\\)|.*Confirm & Save.*"
                timeout: 7000
            - copyTextFrom:
                text: ".*Skip remaining names \\([0-9]+\\).*|Next \\(Enter\\)|.*Confirm & Save.*"
            - runFlow:
                when:
                  true: '${maestro.copiedText.indexOf("Skip remaining names") >= 0}'
                commands:
                  # The names are not this flow's claim: skip every one in a
                  # single press, lookups and team steps included, creating
                  # nothing. The retry is checklist-one-marketplace-skips-
                  # match-dialog's: the batch can still grow after the wizard
                  # opens (a Wikidata career history stages teams), leaving one
                  # row undecided after the first press. Result-keyed, bounded;
                  # 60000 is that flow's ceiling for the same growing batch.
                  # Its terminal state is EITHER names-done footer (NEO-335:
                  # the last decision walks on to "Cards with no team" / "Card
                  # titles" when either applies, else straight to Save).
                  - retry:
                      maxRetries: 1
                      commands:
                        - tapOn:
                            text: ".*Skip remaining names \\([0-9]+\\).*"
                        - extendedWaitUntil:
                            visible:
                              text: "Next \\(Enter\\)|.*Confirm & Save.*"
                            timeout: 60000
            # Teams and titles are not this flow's claim either: the shared
            # util (R3) presses Next on each, every line on its default, and
            # stops on "Ready to save", proving each press moved the wizard.
            - runFlow: util-wizard-advance-to-save.yaml
            - tapOn:
                text: ".*Confirm & Save.*"
      # BOTH SHAPES END HERE (R2's hard result). The commit is an NB write:
      # the 7000 bar (header ⚠️ — not yet measured at 440 cards).
      - extendedWaitUntil:
          visible:
            text: ".*Saved [1-9][0-9]* cards?.*"
          timeout: 7000

      # ==========================================================
      # STEP 8 — (b) THE SAVED NAME IS THE ONE THE OPERATOR PICKED
      #
      # Re-enter the set, so the checklist MOUNTS fresh with every card and
      # opens on its LAST row (memory: committed-checklist-opens-mid-list);
      # right after a commit it sits wherever the first streamed batch put it.
      # The util's Base is mapped now, so it takes the `Re-map Base` path and
      # writes nothing. The row is read from `getCardChecklist`, so this is a
      # read-back of what was stored, not an echo of the dialog's draft
      # (memory: draft-echo-is-not-a-read-back).
      # ==========================================================
      - runFlow:
          file: util-drill-to-base-variant.yaml
          env:
            SPORT: "Football"
            YEAR: "2014"
            MANUFACTURER: "Topps"
            SET: "Topps"
      # `Edit card <number>, <name>` (CardChecklistItem's identity). The util
      # left the page at the checklist's action row and the list renders below
      # it, so DOWN. Nothing is tapped, so no centring (R8); the scroll is the
      # assertion (R6). A Convex read: 7000.
      - scrollUntilVisible:
          element:
            id: "Edit card 442, ${output.slNameRe}"
          direction: DOWN
          timeout: 7000
      # And not BSC's name: the pick replaced it. Rides on the positive above.
      - assertNotVisible:
          id: "Edit card 442, ${output.bscNameRe}"

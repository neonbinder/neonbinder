appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Entity review — Back to matching leaves the wizard without discarding, and re-confirming comes back to the same review with the decision still on it"
tags:
  - set-selector
  - regression
---
# R1 — ONE FEATURE (NEO-221, D9): "Back to matching". Before it, the only way
# out of the entity-review wizard was Cancel, which threw the whole review away.
# Back parks the review instead: the operator returns to the card-pairing dialog,
# and confirming it again lands on the SAME batch with every decision already
# made. This flow proves that round trip.
#
# WHY THIS IS THE ONE THAT HAD TO COME BACK FIRST. The resume is the only wizard
# behaviour with no component-level equivalent: it spans two dialogs and a
# server-side batch that `startBatch` RESUMES rather than recreates, and the
# proof that the decisions survived is that the re-entered wizard renders them.
# `EntityReviewWizard.test.tsx` mounts one dialog against a mocked batch and can
# never exercise the hand-off; `entityReviewQueue`'s resume tests exercise the
# mutation with no dialog at all. Only end to end does the two-dialog hand-off
# get tested at all.
#
# `onBack` is offered ONLY when there is a parked pairing session to go back to
# (`streamedPairing` non-null) — i.e. only after a REAL marketplace fetch. That
# is why this flow cannot be written against a marketplace-free set, and why it
# goes through util-attach-sl-set-and-open-wizard.
#
# R2 — HARD ASSERTIONS, no silent fall-through, no branch that can green this
#   flow without exercising the feature:
#     (a) the wizard opens with NOTHING decided — "0 of N reviewed";
#     (b) one decision is taken, and the header moves to "1 of N reviewed" with
#         a "Decided (1)" history — that is the state Back must preserve;
#     (c) "Back to matching" closes the wizard AND the parked pairing dialog is
#         the thing behind it (asserted positively, by its Confirm control — a
#         bare notVisible would also pass on a dead page);
#     (d) re-confirming reopens the wizard on the SAME batch: still "1 of N
#         reviewed", still "Decided (1)". A Back that cancelled the batch would
#         come back at "0 of N"; a Back that lost the parked session would fail
#         at (c).
#
# R7 — THIS FLOW MINTS NO PLAYER. `players` is GLOBAL and empty at the head of
#   every run, so a name this flow "adds as new" would be known to every worker
#   that fetches the same SportLots set afterwards — and a known name is not an
#   unknown, so it would quietly shrink (or empty) the next flow's wizard. The
#   decision therefore lives only in the review batch and the flow exits through
#   Cancel → Discard, which is `cancelBatch`: nothing committed, no player, no
#   team, no card. That exit is also the last assertion, not an afterthought.
#
# R3 — DEDUP: the Cancel CONFIRM itself ("Discard 1 decision?" → keep working)
#   is covered by STEP 6a of inserts-1996-score-one-nb-set-two-bsc-sources.yaml;
#   here the confirm is only the exit. Skip is
#   checklist-wizard-skip-not-a-person, Link is
#   checklist-wizard-link-to-existing-player, the career-team mini-form is
#   checklist-wizard-career-team-entry. No other flow exercises Back.
#
# R7a — writes go to a PRIVATE set. `wbr-<worker>-<attempt>` is hand-typed under
#   the real Baseball / 2024 / Topps ancestors, so no shared row is touched. Per
#   ATTEMPT as well as per worker: the SportLots id this flow attaches persists,
#   and a retry that found the set already attached would take a different path
#   through the util than attempt 1 does. Registered in .maestro/SET-REGISTRY.md.

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# SETUP — a private set, one real SportLots source, wizard open
# ============================================================

- runFlow:
    file: util-attach-sl-set-and-open-wizard.yaml
    env:
      SET_NAME: "wbr-${WORKER_INDEX || 0}-${ATTEMPT_ID}"

# ============================================================
# STEP 1 — R2(a): the review starts with nothing decided
# The header counter is the wizard's own account of the batch, and it is what
# STEP 4 reads back. Asserting it HERE is what makes the later read meaningful:
# without it, "1 of N" after the round trip could just be where we started.
# ============================================================

- assertVisible:
    text: "0 of [0-9]+ reviewed.*"

# ============================================================
# STEP 2 — R2(b): take exactly ONE decision
#
# WHICH name is on screen is not asserted and must not be: the wizard presents
# the first row whose background Wikidata lookup has SETTLED, and every row's
# lookup races every other. 30s, not the 7s default, because the row offers no
# action until that live external round-trip comes back.
#
# PLAYER *OR* TEAM — the accessible name is "Add as New {Player|Team}". Both are
# the same `create` decision and either leaves exactly one decision on the books,
# which is all this flow needs. (An unknown TEAM should not normally appear on
# the approved source set — see the util's fixture notes — but pinning this to
# Player would make the flow fail for a reason it does not test.)
# ============================================================

- extendedWaitUntil:
    visible:
      id: "Add as New (Player|Team)"
    timeout: 30000
- tapOn:
    id: "Add as New (Player|Team)"
- extendedWaitUntil:
    visible:
      text: "1 of [0-9]+ reviewed.*"
- assertVisible:
    text: "Decided \\(1\\)"

# ============================================================
# STEP 3 — R2(c): THE FEATURE — leave review WITHOUT discarding it
#
# "Back to matching" drops the preview and re-opens the parked pairing session.
# It deliberately does NOT cancel the batch.
#
# The wizard vanishing is asserted alongside a POSITIVE signal that the pairing
# dialog is what replaced it: an error-boundary page satisfies every notVisible,
# so a negative on its own would pass on a dead screen.
# ============================================================

- tapOn: "Back to matching"
- extendedWaitUntil:
    notVisible: "Confirm New Players & Teams"
- assertVisible:
    id: "Confirm card matches"

# ============================================================
# STEP 4 — R2(d): re-confirm, and the SAME review comes back
#
# `startBatch` resumes the existing batch rather than starting a new one, so the
# decision taken in STEP 2 is still on it. 60s: confirming re-runs entity
# resolution, which is live external work (a resumed batch re-reads rather than
# re-looks-up, so a healthy run resolves this in a fraction of the ceiling).
#
# THESE TWO ASSERTIONS ARE THE POINT OF THE FLOW. A Back that had cancelled the
# batch would reopen at "0 of N reviewed" with no Decided list at all.
# ============================================================

- tapOn:
    id: "Confirm card matches"
- extendedWaitUntil:
    visible: "Confirm New Players & Teams"
    timeout: 60000
- assertVisible:
    text: "1 of [0-9]+ reviewed.*"
- assertVisible:
    text: "Decided \\(1\\)"

# ============================================================
# STEP 5 — EXIT WITHOUT CREATING ANYTHING (R7)
#
# Cancel raises the discard confirm — which names the one decision, and is
# therefore also a third reading of "the decision survived the round trip" —
# and Discard runs `cancelBatch`. No player, no team, no card is written, so the
# next worker to fetch this same SportLots set still sees its names as unknown.
#
# "Discard" and the confirm's heading "Discard 1 decision?" are separate nodes
# and Maestro's text matchers are full-node-anchored, so the button text cannot
# match the heading.
# ============================================================

- tapOn:
    text: "Cancel (Esc)"
    retryTapIfNoChange: true
- assertVisible:
    text: "Discard 1 decision.*"
- tapOn:
    text: "Discard"
- extendedWaitUntil:
    visible: "Fetch cancelled — no cards saved."

appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Entity review — Back to matching leaves the wizard without discarding, and re-confirming comes back to the same review with the decision still on it"
tags:
  - set-selector
  - regression
---
# R1 — ONE FEATURE (NEO-221, D9): "Back to matching". Before it, the only way
# out of the entity-review wizard was Cancel, which threw the whole review
# away. Back PARKS the review instead: the operator returns to the card-pairing
# dialog, and confirming it again lands on the SAME batch with every decision
# already made.
#
# WHY THIS ONE HAD TO COME BACK FIRST. The resume is the only wizard behaviour
# with no component-level equivalent: it spans two dialogs and a server-side
# batch that `startBatch` RESUMES rather than recreates, and the proof that the
# decisions survived is that the re-entered wizard renders them.
# `EntityReviewWizard.test.tsx` mounts one dialog against a mocked batch and
# can never exercise the hand-off. `onBack` is offered ONLY when there is a
# parked pairing session (`streamedPairing` non-null) — i.e. only after a real
# marketplace fetch — which is why this cannot be written against anything but
# a real set.
#
# R2 — HARD ASSERTIONS, no branch that can green this flow without exercising
#   the feature:
#     (a) the wizard opens with NOTHING decided — "0 of N reviewed";
#     (b) one decision is taken and the header moves to "1 of N reviewed" with
#         a "Decided (1)" history — the state Back must preserve;
#     (c) "Back to matching" closes the wizard AND the parked pairing dialog is
#         what replaced it, asserted POSITIVELY by its Confirm control (a bare
#         notVisible would also pass on a dead error-boundary page);
#     (d) re-confirming reopens the wizard on the SAME batch: still
#         "1 of N reviewed", still "Decided (1)". A Back that cancelled the
#         batch would reopen at "0 of N"; a Back that lost the parked session
#         would fail at (c).
#
#   The counts are regexes, not literals. How many unknown names the fixture
#   surfaces is the marketplace's business (88 when measured); what this flow
#   asserts is that exactly ONE of them moved, and that it stayed moved.
#
# PLAYER **OR** TEAM. The decision control's accessible name is
#   "Add as New {Player|Team}" and the fixture queues both kinds (measured: 87
#   players + 1 team). Both are the same `create` decision and either leaves
#   exactly one decision on the books, which is all this flow needs — so it
#   does not gamble on which kind settles first.
#
# R7 — READ-ONLY, AND THAT IS LOAD-BEARING. The flow exits through
#   Cancel → Discard (`cancelBatch`): no card, no player, no team, no skip is
#   written. `players` is GLOBAL, so a single "Add as New" that reached commit
#   would make that name KNOWN and shrink every later wizard on this set —
#   and CI has no way to serialize a writer against the readers (see
#   util-fetch-real-set-checklist-to-wizard.yaml). Read-only is what makes four
#   flows on one shared set legal.
#
# R3 — DEDUP: the discard CONFIRM itself is covered by STEP 6a of
#   inserts-1996-score-one-nb-set-two-bsc-sources.yaml; here it is only the
#   exit. Skip / Link / career-team are the three sibling checklist-wizard-*
#   flows. No other flow exercises Back.

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# SETUP — real set, real fetch, wizard open
# ============================================================

- runFlow:
    file: util-fetch-real-set-checklist-to-wizard.yaml

# ============================================================
# STEP 1 — R2(a): the review starts with nothing decided
# Asserting it HERE is what makes STEP 4's read meaningful: without it,
# "1 of N" after the round trip could just be where we started.
# ============================================================

- assertVisible:
    text: "0 of [0-9]+ reviewed.*"

# ============================================================
# STEP 2 — R2(b): take exactly ONE decision
# 30s, not the 7s default: the row offers no action until its background
# Wikidata lookup — a live external round-trip — has come back or errored.
# ============================================================

- extendedWaitUntil:
    visible:
      id: "Add as New (Player|Team)"
    timeout: 30000
- tapOn:
    id: "Add as New (Player|Team)"
- extendedWaitUntil:
    visible:
      text: "1 of [0-9]+ reviewed.*"
- assertVisible:
    text: "Decided \\(1\\)"

# ============================================================
# STEP 3 — R2(c): THE FEATURE — leave review WITHOUT discarding it
# "Back to matching" drops the preview and re-opens the parked pairing
# session. It deliberately does NOT cancel the batch.
# ============================================================

- tapOn: "Back to matching"
- extendedWaitUntil:
    notVisible: "Confirm New Players & Teams"
- assertVisible:
    id: "Confirm card matches"

# ============================================================
# STEP 4 — R2(d): re-confirm, and the SAME review comes back
#
# `startBatch` resumes the existing batch rather than starting a new one, so
# STEP 2's decision is still on it. 60s: confirming re-runs entity resolution,
# which is live external work — a resumed batch re-reads rather than
# re-looks-up, so a healthy run resolves this well inside the ceiling.
#
# THESE TWO ASSERTIONS ARE THE POINT OF THE FLOW. A Back that had cancelled the
# batch would reopen at "0 of N reviewed" with no Decided list at all.
# ============================================================

- tapOn:
    id: "Confirm card matches"
- extendedWaitUntil:
    visible: "Confirm New Players & Teams"
    timeout: 60000
- assertVisible:
    text: "1 of [0-9]+ reviewed.*"
- assertVisible:
    text: "Decided \\(1\\)"

# ============================================================
# STEP 5 — EXIT WITHOUT WRITING ANYTHING (R7)
#
# Cancel raises the discard confirm — which names the one decision, a third
# reading that it survived the round trip — and Discard runs `cancelBatch`.
#
# "Discard" and the confirm's heading "Discard 1 decision?" are separate nodes
# and Maestro's text matchers are full-node-anchored, so the button text cannot
# match the heading.
# ============================================================

- tapOn:
    text: "Cancel (Esc)"
    retryTapIfNoChange: true
- assertVisible:
    text: "Discard 1 decision.*"
- tapOn:
    text: "Discard"
- extendedWaitUntil:
    visible: "Fetch cancelled — no cards saved."

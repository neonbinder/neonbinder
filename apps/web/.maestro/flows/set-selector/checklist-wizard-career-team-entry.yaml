appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Entity review — a player row takes hand-entered career teams, refuses an entry with no from-year, and carries the staged history into the Add as New decision"
tags:
  - set-selector
---
# R1 — ONE FEATURE (NEO-92 follow-up): the CareerTeamEntry mini-form the review
# wizard renders inline for a PLAYER row. Wikidata does not know every player —
# the fixture's very first row came back "No career-team history found." — and
# the operator is the only party on that screen who can say where this one
# played. They may hand-add {team, fromYear, toYear?} entries before choosing
# "Add as New Player". This flow proves that mini-form end to end.
#
# R2 — HARD ASSERTIONS:
#     (a) the row under test is a PLAYER row — the manual-entry affordance is
#         asserted PRESENT before any feature action (a team row renders no
#         career-team form at all);
#     (b) VALIDATION IS ENFORCED: with a team name but NO from-year, "+ Add" is
#         inert — the typed name is STILL in the input (a successful add clears
#         the form) and no staged list has rendered;
#     (c) a VALID add stages a chip reading exactly "<name> (2001–2005)", AND
#         those years SURVIVE the New Team step the same gesture sends the
#         operator to — the NEO-236 regression fixed in 71f23a4;
#     (d) the to-year is genuinely OPTIONAL and says so — "(2010–present)" —
#         and a staged entry can be removed again, leaving the other's years
#         untouched;
#     (e) "Add as New Player" carries the one kept entry into a real decision:
#         the history reads "Added as new" and the wizard has ADVANCED PAST the
#         player row (its career-team form is gone). `recordDecision`
#         re-validates the manual years server-side, so a payload it rejected
#         would leave the wizard where it was rather than moving on.
#     (f) NEO-307 — the New Team steps (d)'s hops walk through answer their
#         League from the `League` combobox: on ProbeTeam's step a typed name
#         matching nothing offers `Create “Lg<token>”`, picking it raises a
#         `New League: Lg<token>` step the walk presents first, and after
#         "Add as New League" the team's combobox reads `Lg<token> (new)`; on
#         TempTeam's step that staged league is PICKED by typing a substring
#         of it. These two minted, discarded team steps are the only
#         deterministic, read-only New Team steps in the suite, which is why
#         the wizard's league-create coverage rides here rather than in a new
#         flow (R3) — the dialog's existing-league and "No league" picks live
#         in set-team-carries-down-to-cards.yaml.
#
# ── WHAT THIS FLOW DELIBERATELY DOES NOT PROVE ──────────────────────────────
#   The staged team is only WRITTEN at commit, where `resolveTeamIdByName`
#   get-or-creates it and attaches it to the new player's `teamYears`. This flow
#   does not commit — see R7 — so commit-time team resolution stays with the
#   unit files. There is also still no UI anywhere that renders a player's
#   `teamYears`, so even a committing version could not read the history back.
#
# R7 — READ-ONLY, AND THAT IS LOAD-BEARING. "Add as New Player" here records a
#   DECISION on the batch; it does not create a player. The flow exits through
#   Cancel → Discard (`cancelBatch`), so nothing is minted. That matters more
#   here than anywhere else in the set: `players` is GLOBAL, and committing one
#   create would make that marketplace name KNOWN — a name that is no longer
#   unknown never reaches the wizard again, so one commit per worker would
#   quietly drain the fixture the other three flows depend on. CI cannot
#   serialize a writer against the readers either (`run-e2e-queue.sh` filters
#   only `util`/`wip`/`setup`). The same holds for R2(f)'s league: "Add as
#   New League" is a decision on the batch, and the discard takes the staged
#   step with it, so no `leagues` row is ever written.
#
# ── WHY THE YEARS SURVIVE (71f23a4) ─────────────────────────────────────────
#   "Add career team" stages a New Team step for the club and sends the walk to
#   it, so the operator always leaves the player row and comes back. That round
#   trip used to destroy their typing twice over: the chip list was a bare array
#   the presented-row effect wiped, and `stageCareerTeamRows` was only ever sent
#   the NAME. 71f23a4 stores the years on the staged step as
#   `source.manualStint` and keys the chip list by player review-row id, so both
#   survive. Navigation is unchanged — the hop is expected, and these steps walk
#   it deliberately rather than around it.
#
#
# ── DO NOT REACH FOR THE AUTO-ADD SWEEP HERE (c657a57) ──────────────────────
#   "Add remaining players as new" now DEFERS its debounced sweep while the
#   presented row has edits — text left in the career-team field, a staged chip,
#   an open link search, an unticked chip, a touched New Team form. A flow that
#   types into that field and then waits for the sweep waits forever. This flow
#   is safe because it DECIDES the row explicitly ("Add as New Player") before
#   it touches anything in the footer; keep it that way.
#
# R3 — DEDUP: Back / Skip / Link are the three sibling checklist-wizard-* flows.
#   Only this one touches the career-team mini-form.

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ── A TEAM NAME THAT MATCHES NOTHING, AND THE TOKEN THAT MAKES IT SO ────────
# The two names this flow types must return ZERO suggestions, and that is a
# hard requirement rather than a nicety: CareerTeamEntry's suggestion dropdown
# is `absolute z-10 left-0 right-0`, so the moment it has a single row it
# covers the "From year" box and the "+ Add" button directly beneath it — and
# it closes only on a pick, on a successful add, or on Escape, which
# maestro-web cannot send at all. A tap aimed at "+ Add" then lands on the
# first suggestion, which REPLACES the typed name. That is exactly how the
# retired version of this flow failed in CI run 33875599981.
#
# Suggestions come from `teams.search`, a Convex SEARCH index — it matches on
# TOKENS, not substrings. Stripping the hyphens from the attempt id is what
# keeps this name unmatchable: "w3-a1-23945" tokenizes as three terms,
# "w3a123945" as one.
#
# ⚠️ NO SEPARATOR IN THESE NAMES, AND THAT IS THE WHOLE POINT. A hyphenated
# name like `CareerTeam-<token>` tokenizes to ["CareerTeam", "<token>"], so it
# matches ANY persisted team sharing the leading word — the per-attempt token
# buys nothing. That is how run 34050688656 broke: the committing sibling had
# left a `CareerTeam-4180` row behind, this flow typed `CareerTeam-9351`, the
# suggestion list offered 4180, the dropdown covered "+ Add", and the tap landed
# on the suggestion — which REPLACED the typed name.
#
# REPRODUCED LOCALLY and it is not fixed by renaming the other flow alone: with
# `CareerTeam-4180` still in `teams`, typing `CareerTeam-w7a26340` failed
# identically. `ProbeTeam<token>` / `TempTeam<token>` are SINGLE tokens that no
# other name in the suite can share, so the list stays empty whatever else has
# been persisted. Keep it that way: if a flow ever needs a team name here, give
# it a separator-free one.
# ⚠️ READ `ATTEMPT_ID`, NOT `output.ATTEMPT_ID`. The runner injects the attempt
# id with `-e ATTEMPT_ID=…`, which Maestro exposes as the binding `${ATTEMPT_ID}`
# — it never populates `output.ATTEMPT_ID`. The old form therefore ALWAYS fell
# through to `String(Date.now()).slice(-4)`: a 4-digit token that recycles every
# ten seconds, so two flows on two runners collide constantly. CI run
# 34050688656 caught it — this flow typed `CareerTeam-9351` and the field came
# back holding `CareerTeam-4180`, another runner's team.
#
# Single-quoted: the expression contains double quotes, and quoting the scalar
# keeps YAML out of it. `Date.now()` (full precision) is the standalone-run
# fallback; the hyphen strip is explained where the name is typed.
- evalScript: '${output.ATTEMPT_TOKEN = String(ATTEMPT_ID || Date.now()).split("-").join("")}'

# ============================================================
# SETUP — real set, real fetch, wizard open
# ============================================================

- runFlow:
    file: util-fetch-real-set-checklist-to-wizard.yaml

# A sibling read-only flow that went red left its batch on this shared set, and
# the fetch above RESUMED it. Clear it and refetch so the assertion below is
# about this flow's own review. No-op on the normal path; see the util.
- runFlow:
    file: util-discard-resumed-review-batch.yaml

- assertVisible:
    text: "0 of [0-9]+ reviewed.*"

# ORDER MATTERS. Wait for the row to become ACTIONABLE first: a row renders no
# action controls at all until its background Wikidata lookup settles, so a kind
# guard evaluated before that would poll an empty row, conclude "not a team",
# and fall through — the failure would then land on the career-form assert with
# a completely misleading message.
# NEO-236 — the wizard does not open on a player row, and the first player it
# shows can move out from under you while its career teams are staged. The util
# walks to a settled player row the operator's way (see its header for the two
# behaviours and the evidence). Every row it answers is a SKIP, so this flow's
# own decision is the only non-skip in the Decided list.
- runFlow: util-wizard-walk-to-player-row.yaml

# ============================================================
# STEP 2 — R2(a): a PLAYER row, with the manual-entry affordance on it
#
# 30s: the row renders no action until its live Wikidata lookup settles.
# Maestro text matchers are full-node-anchored regexes and the <p> reads
# "Add career team history manually (optional):", so the matcher is .*-wrapped
# to match it as a substring.
# ============================================================

# The CONTROL, not the prose. `CareerTeamEntry`'s team input carries a stable
# aria-label; the heading beside it is a <p> split by a nested <span>
# ("Add career team history manually" + " (optional)" + ":"), so its node text
# is copy that can be reworded without touching behaviour. The input's presence
# is the same claim — this section renders only for `current.kind === "player"`
# — expressed against something that will not drift.
- assertVisible:
    id: "Career team name"

# ============================================================
# STEP 3 — R2(b): a name with no from-year is REFUSED, silently doing nothing
# "+ Add" is disabled while from-year is empty, so this tap must be a no-op.
# Two independent readings: the name is still sitting in the input (a
# successful add clears the form), and no staged list exists yet.
# ============================================================

- tapOn:
    id: "Career team name"
- inputText: "ProbeTeam${output.ATTEMPT_TOKEN}"
- tapOn:
    id: "Add career team"
- assertVisible:
    id: "Career team name"
    text: ".*ProbeTeam${output.ATTEMPT_TOKEN}.*"
- assertNotVisible:
    id: "Staged career teams"

# ============================================================
# STEP 4 — R2(c): a complete entry keeps its years across the New Team step
# ============================================================

- tapOn:
    id: "From year"
- inputText: "2001"
- tapOn:
    id: "To year \\(optional\\)"
- inputText: "2005"
- tapOn:
    id: "Add career team"

# ⚠️ ONE GESTURE, THREE EFFECTS. "Add career team" stages the chip, mints a
# review row for the club ("New Team: <name>") so the step can ask for its
# Location, Name and League, AND — because a player waits on its own staged
# teams (`waitingOnStagedTeams`) — sends the walk straight to that step. So the
# chip is NOT assertable here: by the time a Maestro command reads the screen,
# the New Team step is up. Answering it is the operator's next move anyway.
#
# THE STEP APPEARS ONLY ONCE THE STAGED ROW'S WIKIDATA LOOKUP SETTLES — not
# once `stageCareerTeams` has round-tripped, which is what this note used to
# say. The row is inserted `pending` and `nextUndecided` presents settled rows
# only, so between the tap and the step the batch reads "1 still being looked
# up". That lookup goes through the deployment-wide Wikidata pool
# (`maxParallelism: 5`, shared by every runner draining the queue), FIFO
# behind whatever the other runners just fetched. CI run 35140592015 (rerun) /
# runner 0: the tap landed at 20:56:15 (form cleared, footer "1 still looking
# up — wait or skip", header "33 of 123 reviewed · 1 still being looked up",
# screenshot step-144) and 30s of a flat wait ran out with the row still
# pending. Same class as the batch's own lookups, so the same shape as
# `util-wizard-walk-to-player-row` and the sibling `checklist-wizard-career-
# team-commits`: a short wait proves the stage LANDED (the step is either up
# or visibly pending), the long gate is named for the external work it waits
# on (R5's marketplace-class exception), and the step itself gets 7000.
- extendedWaitUntil:
    visible: "New Team: ProbeTeam${output.ATTEMPT_TOKEN}|.*still looking up.*"
    timeout: 7000
- extendedWaitUntil:
    notVisible: ".*still looking up.*"
    timeout: 180000
- extendedWaitUntil:
    visible: "New Team: ProbeTeam${output.ATTEMPT_TOKEN}"
    timeout: 7000

# ── R2(f) NEO-307: a league CREATED from the League combobox raises its own step
# The combobox's accessible name is exactly "League" (`id:`); focusing it opens
# the list. `Lg<token>` is a league no sport holds and no batch has staged
# (nothing in the suite persists an `Lg`-prefixed league, so no stored name,
# alias or abbreviation can CONTAIN it), so typing it matches nothing and the
# list offers `Create “Lg<token>”` — shown only when the typed text matches
# nothing at all
# (curly quotes matched with ".", the en-dash convention below). In the
# wizard that option STAGES the league rather than writing it. The input's
# own text is the bare typed name, which the full-match regex cannot confuse
# with the option.
# PIN THE STEP BODY TO ITS END FIRST (CI run 36139385192, runner 4, step 164).
# NEO-307 put "Search all teams" on every team step, and it pushed the New
# Team form's League field to y=624-658: below the wizard body's visible
# bottom (~475) AND below the 629px viewport, so maestro pruned it and
# `id: "League"` found nothing. The body is an inner `overflow-y-auto`
# scroller, which `scrollUntilVisible` (a window scroll) cannot move. A
# `swipe` is a touch drag that scrolls the scroller under the finger
# (memory: touch-swipe-scrolls-a-dialog-body). One UP drag of ~314px pins
# this short body to its end, a no-op past the limit, so the end state does
# not depend on where the body was. Started at x=18%, in the body's left
# padding (dialog x=170-840, content from x=194), never on a control or the
# backdrop; y=70% is inside the body (y=96-475).
# MEASURED locally against the PR preview (2026-09-25, green run): after the
# drag League sits at y=327-361 and the list's first option (the one this
# flow taps on both steps) at y=366-402, both inside the body's visible slice
# (y=96-475); re-measured identical after the list became a fixed layer
# (green run, same day). The pin is for the League INPUT, which is still in
# the scrolling body. The list itself is a position:fixed layer in the
# wizard's dialog that flips above the field or floats over the footer, so
# no option needs the body scrolled.
- swipe:
    start: "18%, 70%"
    end: "18%, 20%"
    duration: 600
- extendedWaitUntil:
    visible:
      id: "League"
    timeout: 7000
- tapOn:
    id: "League"
- inputText: "Lg${output.ATTEMPT_TOKEN}"
- tapOn: "Create .Lg${output.ATTEMPT_TOKEN}."
# PIN THE BODY BACK TO ITS TOP. The body keeps its scroll position from one
# row to the next (measured locally 2026-09-25: the New League step came up
# with its heading scrolled above the viewport and pruned, and the heading
# wait failed on a step that was on screen). ONE long DOWN drag (~470px, more
# than the pin-end drag or the list's scroll-into-view can have moved it) pins
# it to the top, so every heading and body read below sees the geometry this
# flow was written against.
#
# ONE drag, never two. A touch gesture latches to the scroller it starts on,
# and a second drag that starts on a body ALREADY at its top chains to the
# WINDOW. Measured locally 2026-09-25: two drags left the page behind the
# wizard at scroll 0, and after Discard the "Fetch cancelled" notice was below
# the fold.
- swipe:
    start: "18%, 20%"
    end: "18%, 95%"
    duration: 800

# The pick stages a `New League: Lg<token>` step (`stageLeagueRows`) sourced
# from THIS team, and this team now waits on it (`waitingOnStagedLeagues`), so
# the walk leaves the team and — leagues before teams — presents the league.
#
# NO WAIT ON WIKIDATA (Jason, NEO-307). The staged row's own lookup is
# assistive, never a gate: the step is presented and its primary action is
# usable while that lookup is still running, so this is one in-app wait at
# the R5 bar and an immediate tap. A red here is a product finding (the step
# was held back for its lookup), never a reason to add the long gate back.
#
# This is the one deterministic New League step in the suite: SET-REGISTRY's
# NEO-254 note explains why an ENRICHMENT-raised one cannot be, and a typed,
# per-attempt name is exactly what removes both of its objections.
- extendedWaitUntil:
    visible: "New League: Lg${output.ATTEMPT_TOKEN}"
    timeout: 7000
# By id, full-match: cannot reach the demoted "Add as New League anyway" link.
- tapOn:
    id: "Add as New League"

# Back on the team, which the answered league no longer blocks. The combobox
# now reads the STAGED option's label at rest, "Lg<token> (new)" — the typed
# text was the bare name, so the "(new)" suffix can only come from the team's
# recorded answer surviving the hop to the league step and back. Read on the
# control itself, once the body is pinned so it is in the visible slice
# (README "Asserting inside a dialog").
- extendedWaitUntil:
    visible: "New Team: ProbeTeam${output.ATTEMPT_TOKEN}"
    timeout: 7000
# The step re-mounted with its body scrolled to the top, so League is below
# the fold again; the same pin as above.
- swipe:
    start: "18%, 70%"
    end: "18%, 20%"
    duration: 600
- extendedWaitUntil:
    visible:
      id: "League"
    timeout: 7000
- extendedWaitUntil:
    visible:
      id: "League"
      text: "Lg${output.ATTEMPT_TOKEN} \\(new\\)"
    timeout: 7000
# Back to the top before leaving the step. The player row this hands back to
# is read in its body (the career-team form and chips).
- swipe:
    start: "18%, 20%"
    end: "18%, 95%"
    duration: 800

# One tap accepts the Location and Name as pre-filled and the league as
# answered. Safe to match by text: the button only relabels itself to
# "Link to <name>" on an exact hierarchy match, and this name is per-worker
# unique, so it can have none.
- tapOn: "Add as New Team"
- extendedWaitUntil:
    visible:
      id: "Career team name"
    timeout: 30000

# THE REGRESSION FIXED IN 71f23a4, asserted where the operator would see it.
# Before that commit this chip was gone and the typed years with it: the chip
# list was a bare array the presented-row effect wiped on the way to the team
# step, and `stageCareerTeamRows` was never sent the years at all. Now the years
# ride on the staged step as `source.manualStint` and the chip list is keyed by
# player review-row id, so both survive the hop. The chip reads
# "{name} ({fromYear}–{toYear})"; the en dash (U+2013) is matched with "." to
# keep a literal non-ASCII character out of the matcher, parentheses escaped.
- assertVisible:
    text: ".*ProbeTeam${output.ATTEMPT_TOKEN} \\(2001.2005\\).*"

# ============================================================
# STEP 5 — R2(d): the to-year is optional, and a staged entry can be removed
#
# The same hop, once more — a second hand-typed club mints a second step — and
# then the entry is removed again. Two independent claims: an open-ended stint
# renders "(2010–present)" rather than a half-empty range, and removing a chip
# takes that ONE entry away while leaving the other's years untouched. The
# second half is what proves the per-player chip list from 71f23a4 is a real
# list and not a single slot that the last add overwrites.
# ============================================================

- tapOn:
    id: "Career team name"
- inputText: "TempTeam${output.ATTEMPT_TOKEN}"
- tapOn:
    id: "From year"
- inputText: "2010"
- tapOn:
    id: "Add career team"
# The same three-part gate as STEP 4: this staged row queues on the shared
# Wikidata pool too.
- extendedWaitUntil:
    visible: "New Team: TempTeam${output.ATTEMPT_TOKEN}|.*still looking up.*"
    timeout: 7000
- extendedWaitUntil:
    notVisible: ".*still looking up.*"
    timeout: 180000
- extendedWaitUntil:
    visible: "New Team: TempTeam${output.ATTEMPT_TOKEN}"
    timeout: 7000
# R2(f) NEO-307, second half: a league staged on ONE team's step is offered to
# every later team as "<name> (new)", not re-offered as a create (NEO-254).
# The bare <token> is a strict substring of "Lg<token>", so the staged option
# answers the filter (and, because something matches, no `Create “<token>”`
# is offered); the tap is by the option's full text, so any other row that
# happened to contain the token could not take it. The read-back is decisive
# because the typed text carries neither "Lg" nor "(new)". No second league
# step follows: the batch has already staged this name.
# Same pin as ProbeTeam's step: League is below the fold on every team step.
- swipe:
    start: "18%, 70%"
    end: "18%, 20%"
    duration: 600
- extendedWaitUntil:
    visible:
      id: "League"
    timeout: 7000
- tapOn:
    id: "League"
- inputText: "${output.ATTEMPT_TOKEN}"
- tapOn: "Lg${output.ATTEMPT_TOKEN} \\(new\\)"
- extendedWaitUntil:
    visible:
      id: "League"
      text: "Lg${output.ATTEMPT_TOKEN} \\(new\\)"
    timeout: 7000
# Back to the top before leaving the step, as on ProbeTeam's.
- swipe:
    start: "18%, 20%"
    end: "18%, 95%"
    duration: 800
- tapOn: "Add as New Team"
- extendedWaitUntil:
    visible:
      id: "Career team name"
    timeout: 30000
- assertVisible:
    text: ".*TempTeam${output.ATTEMPT_TOKEN} \\(2010.present\\).*"
- tapOn:
    id: "Remove TempTeam${output.ATTEMPT_TOKEN}"
- assertNotVisible:
    text: ".*TempTeam${output.ATTEMPT_TOKEN} \\(2010.present\\).*"
- assertVisible:
    text: ".*ProbeTeam${output.ATTEMPT_TOKEN} \\(2001.2005\\).*"

# ============================================================
# STEP 6 — R2(e): the decision carries the staged entry, and the wizard moves on
#
# Two readings of the same event, each saying something the other does not: the
# history (the decision was a CREATE, not a link or a skip) and the STAGED CHIP
# being gone (the wizard advanced off the row we staged it on).
#
# ⚠️ DO NOT assert the career-team FORM disappeared. It does not. The fixture
# queues ~89 unknown players, so the row after this one is almost always
# another player — and the form renders for every player row. CI run
# 34006917636 failed on exactly that: the wizard had correctly advanced
# ("1 of 90 reviewed", now showing `Austin Hays`) and the form was still on
# screen, as it should be.
#
# The staged chip is the correct signal and is exactly scoped:
# `setStagedCareerTeams([])` runs in an effect keyed on `[current?._id]`, so
# staged entries survive everything EXCEPT an actual row change (NEO-221). Its
# absence therefore means the presented row changed — which is the claim — and
# it stays true whatever kind the next row is.
# ============================================================

# Both hand-typed clubs were decided on their own steps back in STEPS 4 and 5,
# so `createBlocked` is clear and the player's primary action is live. There is
# no "Decide team" link left to take — an earlier version of this flow waited
# for one here and would now hang until its timeout.
- tapOn: "Add as New Player"
- extendedWaitUntil:
    visible:
      text: "Added as new"
# Matched WITH the years, not on the bare name: once the club is decided its
# name also appears in the "Decided (N)" history, so a bare-name matcher would
# be asserting the history had collapsed rather than that the chip had gone.
# "<name> (2001–2005)" renders only in the career-team chip list.
- assertNotVisible:
    text: ".*ProbeTeam${output.ATTEMPT_TOKEN} \\(2001.2005\\).*"

# ============================================================
# STEP 7 — EXIT WITHOUT WRITING ANYTHING (R7)
# ============================================================

- tapOn:
    text: "Cancel (Esc)"
    retryTapIfNoChange: true
- assertVisible:
    text: "Discard [0-9]+ decisions?.*"
- tapOn:
    text: "Discard"
- extendedWaitUntil:
    visible: "Fetch cancelled — no cards saved."

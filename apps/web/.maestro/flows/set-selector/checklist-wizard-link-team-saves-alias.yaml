appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/admin/players&worker=${WORKER_INDEX || "0"}
name: "Entity review — linking a checklist TEAM to an existing team remembers the checklist's spelling as one of that team's names"
tags:
  - set-selector
---
# R1 — ONE FEATURE (NEO-284): a LINK decision on a TEAM row carries the row's
# raw marketplace string into the linked team's aliases, and it does so by
# default. Since NEO-307 a team is linked from the step's one "Search all
# teams" combobox (the near-match buttons and "Link to Existing…" are gone for
# teams). Since NEO-326 that combobox sits in a "Link to existing team"
# section on every team step, it starts EMPTY, and the ticked "Remember
# “<string>” as a name for this team" box sits inside the same section,
# directly under it; the decision reads "· remembered as …"; the COMMIT writes the
# alias; and Team Management then lists it under "Current aliases", where the
# operator can take it back out again.
#
# R2 — HARD ASSERTIONS, none satisfiable by an inert page:
#     (a) the fixture team exists before the fetch — its chip in the career
#         editor proves `teams.findOrCreate` returned;
#     (b) the alias row is a TEAM step: its heading reads "New Team:
#         Navegantes del Magallanes" and its skip control says "not a team";
#     (c) the "Search all teams" combobox is on this team step under its
#         "Link to existing team" heading and opens EMPTY (it reads back its
#         placeholder, NEO-326 — the pre-fill with the row's name is gone),
#         and the remember-box is directly under it, quoting THIS row's raw
#         name;
#     (d) the combobox finds the fixture BY ITS NAME and picking it records a
#         LINK WITH THE ALIAS — the read-back line is
#         "Linked to <team> · remembered as “<row>”", a string `describeDecision`
#         composes ONLY when `decision.saveAsAlias` is true on a team link.
#         That line is how the default-ON state of the checkbox is asserted:
#         maestro-web's hierarchy carries no `checked` attribute for a checkbox
#         (read out of the pinned maestro-web.js: `text` is value||placeholder||
#         ariaLabel, and a checkbox's `value` is "on" whichever way it is set),
#         so the box is proven by what it DID, in the product's own words;
#     (e) the commit lands ("Saved N cards") — `commitCardChecklist` is where
#         the alias is written, never `recordDecision`;
#     (f) Team Management shows the alias: the "Current aliases" list is
#         rendered only when the stored list is non-empty, and the checklist's
#         string is on screen under the "Also known as" box that was seeded
#         from the stored row;
#     (g) SELF-CLEANING (R7): clearing the box and saving removes the alias,
#         and a RELOAD shows the box empty (its placeholder is the text) with no
#         "Current aliases" list — a negative paired with a positive.
#     (i) NEO-307 — a New Team name that is another team's ALIAS is refused.
#         The fixture team is created with the alias `Pca<token>`. On the
#         alias row's step the Team name is edited to it, and the step then
#         prints "Loc<token> Ali<token> already answers to this name as an
#         alias — remove it there before a team can take the name.", offers
#         "Link to Loc<token> Ali<token>", and "Add as New Team" records
#         nothing (the header's reviewed-count is unchanged seconds later).
#     (h) NEO-307, re-scoped in NEO-330 — A CARD CAN SHOW A TEAM'S PAST, by
#         the operator's link. The checklist club "Tigres de Aragua" is
#         linked to the reference catalogue's `Pittsburgh Crawfords`, a
#         defunct club whose era (1932–1938) ended decades before this 1996
#         set. The search offers it WITH that era; the remember-box is
#         UNTICKED first, so the decision reads exactly "Linked to Pittsburgh
#         Crawfords" (no "· remembered as" tail — the opt-out half of the box,
#         and no alias written onto a shared catalogue row); on commit a card
#         carrying the club prints "Pittsburgh Crawfords" in its sub-line, not
#         "… (unconfirmed)"; and Team Management still lists exactly one
#         `Pittsburgh Crawfords` (the link minted no second era).
#
# ── WHAT (h) USED TO PROVE, AND WHERE THAT WENT ─────────────────────────────
#   Until NEO-330 (h) was the AUTOMATIC past-era link: the flow created
#   Pittsburgh Crawfords itself, the 2024 Rickwood Field set carried it on
#   card RW-2, and the review gate resolved the name without raising a step
#   (`resolveTeamForSetYear`, `allowPastEra`). The reference catalogue now
#   holds the Negro League clubs (and their players), so that fixture stages
#   nothing and the flow could not create the club ("No matches." failed, CI
#   run 38063558063). Jason re-scoped (h) to the operator's link onto the
#   catalogue's own row (2026-10-10). The automatic resolution is unit-tested
#   in `lib/teams/team-era.test.ts`.
#
# ── THE FIXTURE (NEO-330) ───────────────────────────────────────────────────
#   `Baseball → 1996 → All Brands → Line Up Venezuelan Winter League → Base`,
#   BSC only, through `util-fetch-one-marketplace-set-checklist-to-wizard`
#   (SET-REGISTRY.md has the row and the measurement). Approved by Jason
#   2026-10-10 for a probe and the re-fixture. MEASURED on PR #314's preview
#   that day: "Kept all 300 cards from BSC", **200 new players + 8 new
#   teams**, and once every Wikidata lookup had settled (~144s) 211 rows:
#   the 8 Venezuelan Professional Baseball League clubs, ONE staged league
#   ("Venezuelan Professional Baseball League") and two STAGED career teams
#   ("EDA Rhinos", "Athletics" — Wikidata stints, not checklist clubs; memory:
#   wizard-headings-include-staged-career-teams). The catalogue holds none of
#   the eight clubs.
#
#   THE TWO ROWS UNDER TEST ARE NAMED, NOT "WHICHEVER COMES FIRST". The walk
#   reads each team/league step's heading and acts on two checklist clubs by
#   name — "Navegantes del Magallanes" for the alias, "Tigres de Aragua" for
#   (h) — and skips every other step (a skip creates nothing, R7). Both are
#   BSC `teamName` values on this set's cards, so neither can be a staged
#   career team, and the walk works whichever order the wizard presents them
#   in. After the walk the flow asserts BOTH were reached. Tigres is (h)'s
#   club because it owns the END of the checklist (#290–#297 of 300, BSC
#   facets 2026-10-10), which is where a fresh load opens the virtualized
#   list — see PART 4.
#
#   THIS FLOW IS THE SOLE WRITER OF THIS SET (R7a). It commits — the alias is
#   written at commit and nowhere else, so a read-only version could pass with
#   the feature broken. Nothing else reads the set; it drains its own fixture
#   within a run (a committed set's names are known and a re-sync raises no
#   review), and CI reseeds the preview every run. A LOCAL re-run needs a
#   fresh seed. The Baseball → 1996 columns above the set are shared with the
#   1996 Score flow (concurrent first syncs double the round-trip, never the
#   rows; SET-REGISTRY.md).
#
# ── THE FIXTURE TEAM ────────────────────────────────────────────────────────
#   Made through the product, never seeded (`admin-teams-two-eras` is the
#   worked example): one throwaway player `Alp<token>` on /admin/players to
#   reach a TeamPicker, then the New Team dialog with Location `Loc<token>`,
#   Name `Ali<token>` and the alias `Pca<token>` (for (i)), no league. Three
#   permanent, globally-shared rows, inert by name — single tokens, per worker
#   AND per attempt (see SET-REGISTRY "Team names"). The composed full name
#   `Loc<token> Ali<token>` is what the link option, the decision line, the
#   Team Management heading and the Saved line all print; the link SEARCH
#   types the single token `Ali<token>`.
#
# R4 — the entry URL is the whole setup; no in-body login, no credential step.
#
# R5 — every wait states its ceiling. 7000 in-app; the sanctioned exceptions,
#   each named at its step: the post-launchApp gate (45s), the mid-flow
#   reload gates (30s, the value the admin flows use), and the live
#   marketplace and Wikidata round-trips (the fetch util's own, and the
#   batch's lookups below).
#
# R8 — centred scrolls on the Team Management panel depend on NEO-260's 208px
#   spacer (`src/layouts/binder-layout.tsx`). Inside the wizard, whose body is
#   an inner scroller no `scrollUntilVisible` can move, the alias step
#   positions the body with two touch-drag `swipe`s (pin down to the Team name
#   box, then back to the top), reasoned at the step.
#
# R10 — one guarded walk over the team and league steps; every branch inside
#   it is keyed on a `true:` expression (free) except the step read itself.

# ============================================================
# LAUNCH + SIGN IN
# ============================================================
- launchApp
- extendedWaitUntil:
    visible: "[0-9,]+ players?"
    timeout: 45000

- evalScript: '${output.TOKEN = String(ATTEMPT_ID || Date.now()).split("-").join("")}'

# ============================================================
# PART 1 — THE FIXTURE TEAM, born from a career editor (R2a)
# ============================================================
# Empty the list first: every player row prints its sport, so with rows on
# screen "Baseball" is on the page many times and the sport picker could not
# be identified by what it says. The sport is picked with the add form CLOSED
# because maestro resolves an <option> tap by index against the FIRST <select>.
- tapOn: "Filter players"
- inputText: "zzzznotaplayer"
- assertVisible: "No players match that filter."
- tapOn: "All sports"
- tapOn: "Baseball"
- assertVisible: "Baseball"
# Picking a sport re-runs the filtered search, and PlayerManagement's counter
# renders EMPTY until it answers — so "Add player" slides ~110px left for the
# length of that round-trip and back again when the count returns. A tap whose
# bounds were read inside that window lands on the counter instead (CI run
# 35122900214 / runner 5, `admin-franchises-link-teams`: bounds [526,327] at
# the read, the button at [636,327] in the failure screenshot). Waiting for the
# count to be back is waiting for the layout to be still.
- extendedWaitUntil:
    visible: "0 matches"
    timeout: 7000

- tapOn: "Add player"
- tapOn: "New player name"
- inputText: "Alp${output.TOKEN}"
- scrollUntilVisible:
    element:
      id: "Create player Alp${output.TOKEN}"
    timeout: 7000
- tapOn:
    id: "Create player Alp${output.TOKEN}"

# NO SCROLL after the tap (NEO-319). The add form stays up, busy, until the new
# player has loaded; the panel then replaces it in one render with its heading
# revealed just under the app bar (~y=160), the sticky `Added …` notice above
# it. The heading selector is the panel's <h3> alone — `above:` is a top-edge
# test, the panel's name box sits BELOW its `Player name` label and the busy
# form has no such label (see player-management-add-and-career-history). The
# next scroll is a centred DOWN scroll to a target below this position, so
# where it parks the page is set by the target, not by where this step left it.
- extendedWaitUntil:
    visible:
      text: "Alp${output.TOKEN}"
      above:
        text: "Player name"
    timeout: 7000
- assertVisible: ".*Added Alp${output.TOKEN}.*"
- scrollUntilVisible:
    element:
      text: "No stints recorded yet."
    centerElement: true
    timeout: 7000

- assertVisible:
    id: "Add team"
- tapOn:
    id: "Add team"
- tapOn:
    id: "Search teams"
- inputText: "Ali${output.TOKEN}"
# Nothing answers to this name yet — the precondition for creating it, and a
# real assertion that this attempt's token is its own.
- assertVisible: "No matches."
- pressKey: Enter
- assertVisible: "New team: Ali${output.TOKEN}"
- tapOn:
    id: "New team location \\(optional\\)"
- inputText: "Loc${output.TOKEN}"
# R2(i)'s holder: one alias, `Pca<token>`, typed here because the dialog
# already asks for aliases, which costs one field instead of a Team
# Management detour. It is inert: no checklist carries it, and the flow never
# searches for it. PART 7 removes it with the checklist alias.
- tapOn:
    id: "New team aliases \\(optional\\)"
- inputText: "Pca${output.TOKEN}"
# The Create button's accessible name is the COMPOSED full name, so targeting
# it is itself the assertion that Location + Name composed in that order.
- tapOn:
    id: "Create team Loc${output.TOKEN} Ali${output.TOKEN}"
- extendedWaitUntil:
    visible:
      id: "Remove team Loc${output.TOKEN} Ali${output.TOKEN}"
    timeout: 7000

# ============================================================
# PART 2 — THE SET: drill (R9), decline SportLots, fetch one-sided
# ============================================================
- runFlow:
    file: util-fetch-one-marketplace-set-checklist-to-wizard.yaml
    env:
      SPORT: "Baseball"
      YEAR: "1996"
      SET: "Line Up Venezuelan Winter League"

- assertVisible:
    text: "0 of [0-9]+ reviewed.*"

# Wait the batch's lookups out, so every step the walk below reads is settled
# and nothing that settles later can out-rank the row under test (NEO-236/254
# nav rules: leagues before teams before players). R5 external round-trip:
# one Wikidata lookup per unknown name, through the deployment-wide pool.
# MEASURED on PR #314's preview, 2026-10-10, LIVE: 208 rows settled in ~144s
# with no other runner using the pool. Since then the NEO-289 recording
# answers every lookup this batch makes (200 players, 8 clubs, the 2 staged
# career teams, the staged league: 211 of 211 hit, checked offline against
# the committed file), so no call leaves the deployment. That settle time is
# NOT YET MEASURED: this ceiling is the live-lane value, kept until the first
# CI run with the recording deployed gives one to tighten to (R5). Recorded
# rows still queue FIFO behind other runners' live lookups in the same pool;
# read the convex-logs artifact before touching this number.
- extendedWaitUntil:
    notVisible: ".*still looking up.*"
    timeout: 180000

# ============================================================
# PART 3 — WALK THE TEAM AND LEAGUE STEPS, acting on two clubs by name
# ============================================================
# The wizard presents every settled undecided TEAM (and LEAGUE) row before any
# player row, one row at a time (`entity-review-nav.ts`), so this walk reads
# every team step the batch raised; a player row coming up ("Skip … not a
# person") is the product saying there are no more.
#
# Per pass: read the presented step's heading, then exactly ONE of three
# branches runs, each keyed on a `true:` expression (evaluated JS — free,
# unlike a `visible:` guard that misses):
#   * "New Team: Navegantes del Magallanes" → the alias link, R2(b)(c)(d)(i)
#   * "New Team: Tigres de Aragua"          → the past-era link, R2(h)
#   * anything else (a league, another club, a staged career team) → skip.
# A skip creates nothing (R7). `optional: true` on the skip tap is the
# guard/tap race noted at `util-wizard-walk-to-player-row.yaml` (R3).
- evalScript: '${output.ALIAS_DONE = false; output.PAST_DONE = false}'
- repeat:
    times: 20
    while:
      notVisible:
        id: "Skip .* not a person"
    commands:
      - copyTextFrom:
          text: "New (Team|League): .*"
      - evalScript: '${output.STEP_HEADING = maestro.copiedText}'

      # ── R2(b)(c)(d)(i): THE ALIAS ROW ────────────────────────────────────
      - runFlow:
          when:
            true: '${output.STEP_HEADING === "New Team: Navegantes del Magallanes"}'
          commands:
            # R2(b): a TEAM step, by its own control.
            - assertVisible:
                id: "Skip .* not a team"
            # R2 precondition, and NEO-326's empty start: the combobox is on
            # THIS team step and holds nothing. maestro-web reads an empty
            # input as its PLACEHOLDER (`value || placeholder || ariaLabel`),
            # so `text: "Type a team name"` is the box being empty; a build
            # that still pre-filled the row's name would read the club's name
            # here and fail.
            - extendedWaitUntil:
                visible:
                  id: "Search all teams"
                  text: "Type a team name"
                timeout: 7000
            # The section's heading, above the combobox it names. Exactly
            # "Link to existing team" (full-match), so the player/league
            # panel's "Possible matches" cannot answer for it.
            - assertVisible:
                text: "Link to existing team"
                above:
                  id: "Search all teams"
            # R2(c) — the box is offered directly UNDER the combobox
            # (NEO-326), quoting THIS row's raw name (curly quotes are the
            # product's). Its checked state is proven by (d) below.
            - assertVisible:
                text: "Remember “Navegantes del Magallanes” as a name for this team"
                below:
                  id: "Search all teams"

            # ── R2(i) NEO-307: a New Team name that is another team's ALIAS
            # is refused. Edit this step's Team name to `Pca<token>`, the
            # alias PART 1 gave the fixture team. The step must then say so in
            # the product's one sentence, offer the holder's link, and refuse
            # "Add as New Team". The edited name is LEFT in place: this row's
            # decision is the LINK below, which never reads the create draft.
            #
            # PIN THE BODY BEFORE THE TAP (NEO-326). On a body at its top the
            # Team name box sits past the body's visible bottom (~475), where
            # maestro still reports it (it sees only the VIEWPORT, never the
            # body's clip) and a tap lands on the footer instead. One UP touch
            # drag of ~313px (a `swipe` with start/end is a touch drag and
            # scrolls the scroller under the finger, which
            # `scrollUntilVisible` cannot) moves the box into the slice, or
            # pins a shorter body to its end. x=18% is the body's left
            # padding, never a control; y=70% is inside the body. The warning
            # sentence below is the hard assert that the tap focused the Team
            # name box and the typing landed. Same gesture as
            # `checklist-wizard-career-team-entry`'s pin.
            - swipe:
                start: "18%, 70%"
                end: "18%, 20%"
                duration: 600
            # The field is found by its VALUE under its caption: in the wizard
            # the input carries a stable DOM id, which becomes its resource-id
            # and shadows the aria-label, and flows never target a DOM id.
            # `below:` the "Team name" caption picks the nearest match, which
            # is the input — the only node under the caption that reads the
            # club's name in full (the combobox starts empty). A centre tap
            # puts the caret at the end, so the erase clears it.
            - tapOn:
                text: "Navegantes del Magallanes"
                below:
                  text: "Team name"
            - eraseText: 60
            - inputText: "Pca${output.TOKEN}"
            # The holder's full name, then the sentence. Em dash matched
            # with ".".
            - extendedWaitUntil:
                visible: "Loc${output.TOKEN} Ali${output.TOKEN} already answers to this name as an alias . remove it there before a team can take the name\\."
                timeout: 7000
            # The fix offered in place: the holder's link (undated, so no
            # "· years" tail). Asserted only; the flow's own link is made
            # through the search below.
            - assertVisible: "Link to Loc${output.TOKEN} Ali${output.TOKEN}"
            # The refused create. The header's counter counts every decision,
            # so it is read before the tap and must still read the same after.
            - copyTextFrom:
                text: "[0-9]+ of [0-9]+ reviewed.*"
            - evalScript: '${output.COUNT_BEFORE = maestro.copiedText}'
            - tapOn:
                id: "Add as New Team"

            # PIN THE BODY BACK TO ITS TOP. The combobox is the first control
            # in the body, and the drag above scrolled it out past the body's
            # top edge (still inside the viewport, so maestro would "see" it
            # and tap the wizard header instead). ONE long DOWN drag (~470px,
            # more than the UP drag moved it) pins the body to its top. ONE,
            # never two: a second drag that starts on a body already at its
            # top chains to the WINDOW (career-team-entry's measurement). The
            # body keeps its scroll position from row to row, so this pin also
            # leaves the next step of the walk at its top.
            - swipe:
                start: "18%, 20%"
                end: "18%, 95%"
                duration: 800
            # Still THIS row: a recorded create would have moved the walk on.
            - assertVisible: "New Team: Navegantes del Magallanes"

            # The field is empty, so the typed text is the whole query. It is
            # read back before the option is looked for, so a tap that missed
            # the field fails as itself and not as "no such team".
            # `Ali<token>` is a strict substring of the option's
            # "Loc<token> Ali<token>", so the input's own text cannot answer
            # to the tap.
            - tapOn:
                id: "Search all teams"
            - inputText: "Ali${output.TOKEN}"
            - extendedWaitUntil:
                visible:
                  id: "Search all teams"
                  text: "Ali${output.TOKEN}"
                timeout: 7000
            # R2(i), the refusal's second reading: seconds after the tap on
            # the refused "Add as New Team", nothing has been decided.
            - copyTextFrom:
                text: "[0-9]+ of [0-9]+ reviewed.*"
            - assertTrue: '${maestro.copiedText === output.COUNT_BEFORE}'
            # The option's only direct text node is the composed full name. It
            # comes back from `teams.search` after a 200ms debounce — 7000.
            - extendedWaitUntil:
                visible:
                  text: "Loc${output.TOKEN} Ali${output.TOKEN}"
                timeout: 7000
            - tapOn:
                text: "Loc${output.TOKEN} Ali${output.TOKEN}"
            # The decision landing is what moves the wizard OFF this row.
            # Waiting for the heading to go is the "it landed"; the positive
            # that pairs with this negative is the read-back below.
            - extendedWaitUntil:
                notVisible:
                  text: "New Team: Navegantes del Magallanes"
                timeout: 7000
            # R2(d) — read the decision back: step BACK to the row just
            # judged (NEO-221 history); its read-only panel states the
            # decision in `describeDecision`'s words, and the "· remembered
            # as" tail exists only for a team link whose `saveAsAlias` is true.
            - tapOn:
                id: "Back to previous decision"
            - extendedWaitUntil:
                visible:
                  id: "Decision for Navegantes del Magallanes"
                timeout: 7000
            - assertVisible:
                text: "Linked to Loc${output.TOKEN} Ali${output.TOKEN} · remembered as “Navegantes del Magallanes”"
            # Hand the walk back to the wizard.
            - tapOn:
                text: "Next"
                below:
                  text: "Already decided:.*"
            - evalScript: '${output.ALIAS_DONE = true}'

      # ── R2(h): THE PAST-ERA LINK ─────────────────────────────────────────
      - runFlow:
          when:
            true: '${output.STEP_HEADING === "New Team: Tigres de Aragua"}'
          commands:
            - assertVisible:
                id: "Skip .* not a team"
            - extendedWaitUntil:
                visible:
                  id: "Search all teams"
                  text: "Type a team name"
                timeout: 7000
            # UNTICK the remember-box FIRST, while the combobox is closed: it
            # sits directly under the combobox, so an open option list would
            # cover it. The label wraps the checkbox, so a tap on its text
            # toggles it. Proven by the decision line below, which a ticked
            # box would extend with "· remembered as …" — and an alias on the
            # catalogue's row would outlive this flow.
            - tapOn:
                text: "Remember “Tigres de Aragua” as a name for this team"
            - tapOn:
                id: "Search all teams"
            - inputText: "Crawfords"
            - extendedWaitUntil:
                visible:
                  id: "Search all teams"
                  text: "Crawfords"
                timeout: 7000
            # The catalogue's ONE row of the name (verified read-only on the
            # preview, 2026-10-10: one Baseball team "Pittsburgh Crawfords",
            # 1932–1938, Negro National League II, no aliases). The option's
            # full name is one node; its "league · years" line is another,
            # and the era in it is what makes this a PAST-era team for a 1996
            # card (en dash matched with ".").
            - extendedWaitUntil:
                visible:
                  text: "Pittsburgh Crawfords"
                timeout: 7000
            - assertVisible:
                text: ".*1932.1938.*"
            - tapOn:
                text: "Pittsburgh Crawfords"
            - extendedWaitUntil:
                notVisible:
                  text: "New Team: Tigres de Aragua"
                timeout: 7000
            - tapOn:
                id: "Back to previous decision"
            - extendedWaitUntil:
                visible:
                  id: "Decision for Tigres de Aragua"
                timeout: 7000
            # Full match: the link, and no "· remembered as" tail.
            - assertVisible:
                text: "Linked to Pittsburgh Crawfords"
            - tapOn:
                text: "Next"
                below:
                  text: "Already decided:.*"
            - evalScript: '${output.PAST_DONE = true}'

      # ── every other step: skip it ────────────────────────────────────────
      - runFlow:
          when:
            true: '${output.STEP_HEADING !== "New Team: Navegantes del Magallanes" && output.STEP_HEADING !== "New Team: Tigres de Aragua"}'
          commands:
            - tapOn:
                id: "Skip .*(not a team|has no league)"
                optional: true
- extendedWaitUntil:
    visible:
      id: "Skip .* not a person"
    timeout: 7000
# Both rows under test came up and were decided — the walk cannot have ended
# on the player rows without passing them.
- assertTrue: ${output.ALIAS_DONE}
- assertTrue: ${output.PAST_DONE}

# ============================================================
# PART 4 — COMMIT (R2e)
# ============================================================
# Everything else is a skip: skips create nothing, so the only rows this
# commit links or mints are the two links above. The batch is settled (PART
# 2), so the bulk skip is one mutation — in-app, 7000.
- tapOn:
    text: ".*Skip remaining names \\([0-9]+\\).*"
- extendedWaitUntil:
    visible:
      text: ".*Confirm & Save.*"
    timeout: 7000
- tapOn:
    text: ".*Confirm & Save.*"
- extendedWaitUntil:
    visible:
      text: ".*Saved [0-9]+ cards.*"
    timeout: 7000

# R2(h) — a card of this set LINKS to the past-era club, read back on a
# FRESH load of the set. Not on the page the commit leaves: the checklist's
# virtualized list mounts on the commit's first streamed batch and keeps that
# position as the rest arrive (measured: rows #146–#150 at the list's bottom
# edge, the Tigres cards ~140 rows below, behind an inner scroller
# `scrollUntilVisible` cannot move). A fresh mount opens at the LAST row
# (`initialTopMostItemIndex`), and the last cards are Tigres de Aragua's
# (#290–#297). The re-entry is the same util the fetch used (R3).
- runFlow:
    file: util-open-one-marketplace-set-base.yaml
    env:
      SPORT: "Baseball"
      YEAR: "1996"
      SET: "Line Up Venezuelan Winter League"
# A card's sub-line prints its resolved teams by full name
# (`CardChecklistItem`: `teamFullName` over `teamOnCardIds`) and an unresolved
# one as "<name> (unconfirmed)", so the negative lookahead is what makes this
# the link and not the raw string. The sub-line is one text node
# (`subParts.join`), which the regex assumes.
- scrollUntilVisible:
    element:
      text: ".*Pittsburgh Crawfords(?! \\(unconfirmed\\)).*"
    centerElement: true
    timeout: 7000

# ============================================================
# PART 5 — TEAM MANAGEMENT SHOWS THE ALIAS (R2f)
# ============================================================
# A reload separates "the wizard is holding what I did" from "the database
# holds it", and lands on the screen the alias is FOR.
- openLink: ${APP_URL || "http://localhost:3000"}/admin/teams
- extendedWaitUntil:
    visible: "[0-9,]+ teams?( . [0-9,]+ need attention)?"
    timeout: 30000
- tapOn: "Filter teams"
- inputText: "Ali${output.TOKEN}"
- extendedWaitUntil:
    visible: "1 match( . [0-9,]+ need attention)?"
    timeout: 7000
# The master row PRINTS the short name and is anchored below the counter so
# the filter box — whose VALUE maestro reads as the same text — cannot answer.
- tapOn:
    text: "Ali${output.TOKEN}"
    below:
      text: "1 match( . [0-9,]+ need attention)?"

# The "Also known as" box is seeded from the stored row and the chip list
# under it renders only when that parses to at least one alias. Centred on
# the label (depends on the NEO-260 spacer). The box now holds two aliases
# (`Pca<token>` from PART 1 and the club's), so the club's string as a WHOLE
# node is its chip, under the label.
- scrollUntilVisible:
    element:
      text: "Also known as"
    centerElement: true
    timeout: 7000
- assertVisible:
    id: "Current aliases"
- assertVisible:
    text: "Navegantes del Magallanes"
    below:
      text: "Also known as"

# ============================================================
# PART 6 — TAKE THEM BACK OUT, AND PROVE THE REMOVAL PERSISTED (R2g, R7)
# ============================================================
# Tap the BOX, not its label. `eraseText` sends Backspaces to the active
# element, and Backspace deletes from the caret: a label tap focuses the
# textarea with the caret at position 0 and erases nothing (measured — the
# chip list survived 120 Backspaces), while a tap on the box lands at its
# centre, past the end of a one-line value, and puts the caret at the end.
# The box's VALUE is "Pca<token>, Navegantes del Magallanes" and the chip
# reads the club alone; the regex matches both, and `below` the label picks the nearer
# one, which is the box. 120 is the alias length ceiling.
- tapOn:
    text: ".*Navegantes del Magallanes.*"
    below:
      text: "Also known as"
- eraseText: 120
- assertNotVisible:
    id: "Current aliases"
- scrollUntilVisible:
    element:
      text: "Save"
    centerElement: true
    timeout: 7000
- tapOn: "Save"
- extendedWaitUntil:
    visible: ".*Saved Loc${output.TOKEN} Ali${output.TOKEN}.*"
    timeout: 7000

- openLink: ${APP_URL || "http://localhost:3000"}/admin/teams
- extendedWaitUntil:
    visible: "[0-9,]+ teams?( . [0-9,]+ need attention)?"
    timeout: 30000
- tapOn: "Filter teams"
- inputText: "Ali${output.TOKEN}"
- extendedWaitUntil:
    visible: "1 match( . [0-9,]+ need attention)?"
    timeout: 7000
- tapOn:
    text: "Ali${output.TOKEN}"
    below:
      text: "1 match( . [0-9,]+ need attention)?"
- scrollUntilVisible:
    element:
      text: "Also known as"
    centerElement: true
    timeout: 7000
# Negative paired with a positive: an empty textarea reports its PLACEHOLDER
# as its text, so the placeholder on screen is the box being empty.
- assertNotVisible:
    id: "Current aliases"
- assertVisible:
    text: "LSU, Louisiana State, LSU Tigers baseball"
    below:
      text: "Also known as"

# ============================================================
# PART 7 — THE PAST-ERA CLUB IS STILL ONE ROW (R2h)
# ============================================================
# The link must not have minted a second era of the club. A fresh load, so the
# filter box starts empty (the one above still holds "Ali<token>", and a label
# tap would put the caret at 0). The counter is the page's own count of rows
# matching the filter.
- openLink: ${APP_URL || "http://localhost:3000"}/admin/teams
- extendedWaitUntil:
    visible: "[0-9,]+ teams?( . [0-9,]+ need attention)?"
    timeout: 30000
- tapOn: "Filter teams"
- inputText: "Pittsburgh Crawfords"
- extendedWaitUntil:
    visible: "1 match( . [0-9,]+ need attention)?"
    timeout: 7000

appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/admin/players&worker=${WORKER_INDEX || "0"}
name: "Entity review — linking a checklist TEAM to an existing team remembers the checklist's spelling as one of that team's names"
tags:
  - set-selector
---
# R1 — ONE FEATURE (NEO-284): a LINK decision on a TEAM row carries the row's
# raw marketplace string into the linked team's aliases, and it does so by
# default. Since NEO-307 a team is linked from the step's one "Search all
# teams" combobox (the near-match buttons and "Link to Existing…" are gone for
# teams). Since NEO-326 that combobox sits in a "Link to existing team"
# section on every team step, it starts EMPTY, and the ticked "Remember
# “<string>” as a name for this team" box sits inside the same section,
# directly under it; the decision reads "· remembered as …"; the COMMIT writes the
# alias; and Team Management then lists it under "Current aliases", where the
# operator can take it back out again.
#
# R2 — HARD ASSERTIONS, none satisfiable by an inert page:
#     (a) the fixture team exists before the fetch — its chip in the career
#         editor proves `teams.findOrCreate` returned;
#     (b) the wizard opens with nothing decided ("Step 1 of N") and the row
#         under test is the "Homestead Grays" TEAM row: its heading names it
#         and its own skip control says "not a team";
#     (c) the "Search all teams" combobox is on this team step under its
#         "Link to existing team" heading and opens EMPTY (it reads back its
#         placeholder, NEO-326 — the pre-fill with the row's name is gone),
#         and the remember-box is directly under it, quoting THIS row's raw
#         name;
#     (d) the combobox finds the fixture BY ITS NAME and picking it records a
#         LINK WITH THE ALIAS — the read-back line is
#         "Linked to <team> · remembered as “<row>”", a string `describeDecision`
#         composes ONLY when `decision.saveAsAlias` is true on a team link.
#         That line is how the default-ON state of the checkbox is asserted:
#         maestro-web's hierarchy carries no `checked` attribute for a checkbox
#         (read out of the pinned maestro-web.js: `text` is value||placeholder||
#         ariaLabel, and a checkbox's `value` is "on" whichever way it is set),
#         so the box is proven by what it DID, in the product's own words;
#     (e) the commit lands ("Saved N cards") — `commitCardChecklist` is where
#         the alias is written, never `recordDecision`;
#     (f) Team Management shows the alias: the "Current aliases" list is
#         rendered only when the stored list is non-empty, and the checklist's
#         string is on screen under the "Also known as" box that was seeded
#         from the stored row;
#     (g) SELF-CLEANING (R7): clearing the box and saving removes the alias,
#         and a RELOAD shows the box empty (its placeholder is the text) with no
#         "Current aliases" list — a negative paired with a positive.
#     (i) NEO-307 — a New Team name that is another team's ALIAS is refused.
#         Pittsburgh Crawfords is created with the alias `Pca<token>`. On the
#         row under test's step the Team name is edited to it, and the step then
#         prints "Pittsburgh Crawfords already answers to this name as an alias —
#         remove it there before a team can take the name.", offers
#         "Link to Pittsburgh Crawfords · 1926–1940", and "Add as New Team" records
#         nothing (the header's "Step x of y" is unchanged seconds later).
#         About 10s, on a step the flow already stands on.
#     (h) NEO-307 — A CARD CAN SHOW A TEAM'S PAST. A club on this checklist,
#         "Pittsburgh Crawfords" (card RW-2's), is created through the UI
#         first with the era 1926–1940, which ended before this 2024 set. Because the sport holds
#         exactly ONE row of that full name and the set year is after its era,
#         the review gate resolves it (`resolveTeamForSetYear`, `allowPastEra`
#         for card callers): it is NOT raised as a New Team step — asserted on
#         every team step the wizard presents, by reading each heading — and
#         on commit the card carrying it LINKS to that row (its sub-line prints
#         the name, not "… (unconfirmed)"), with Team Management still holding
#         exactly one "Pittsburgh Crawfords". This is Jason's approved Option A
#         (2026-09-25): the one committing fixture whose teams are defunct
#         clubs, so the retro rule rides here rather than on a new real set.
#
# ── THE RETRO CLUB, AND WHY ITS NAME IS REAL ────────────────────────────────
#   The one exception in the suite to "minted names are single tokens", and
#   an unavoidable one: the rule is about a name ON A CHECKLIST, so the team
#   must carry the checklist's own spelling. "Pittsburgh Crawfords" is that
#   spelling, and it is the TEAM ON CARD RW-2 (Josh Gibson). MEASURED on the
#   PR preview 2026-09-25: a committed run linked that card's club to
#   Loc<token> Ali<token>, and the alias it saved reads exactly
#   "Pittsburgh Crawfords". The name was "Homestead Grays" until then, taken
#   from SET-REGISTRY's list of the wizard's headings. CI run 36139385192
#   showed that heading is a STAGED career team (Gibson's Wikidata stint), not
#   a checklist club, so no card could ever carry it. Approved by Jason for
#   this flow only (as "Homestead Grays"; the swap needs his re-approval). It
#   is inert to every other flow: nothing else fetches this set, and no flow
#   types "Pittsburgh" or "Crawfords" into a search. The run-start reset
#   wipes it.
#
#   WHY 1926–1940, and why the Wikidata stints cannot red this. The span is
#   the club's whole life, so any real Crawfords stint falls inside it. The
#   career-team staging resolves a STINT strictly (no `allowPastEra`): a stint
#   INSIDE the era links to this row and stages nothing, a stint outside it
#   would stage a legitimate career step of the same name and false-red (h).
#   The cached lookups (`convex/adapters/__fixtures__/enrichment-lookups.json`)
#   give the only dated Crawfords stint among this set's four players as Josh
#   Gibson's 1932–1936, which is inside. Paige's teams are undated, which the
#   resolver answers without a year. Robinson and Mays carry none.
#
#   FRESH-ONLY, like the rest of this flow: a re-run in the same deployment
#   finds the row and the "No matches." precondition fails. CI reseeds.
#
# ── THE FIXTURE, AND WHY IT IS ONE-SIDED ────────────────────────────────────
#   `Baseball → 2024 → Topps → Topps MLB at Rickwood Field Negro Leagues
#   Collection → Base`. Measured on PR #262's preview, 2026-09-16: BSC lists
#   4 cards (RW-1 Satchel Paige … RW-4 Willie Mays) on Negro League clubs, so
#   every team on it is unknown to a deployment whose only teams are the MLB
#   clubs `setup.yaml`'s Topps Chrome commit created. 8 unknown names: 4
#   players, the clubs, and one staged league ("Negro league baseball", raised
#   by the Homestead Grays lookup and asked once for the batch).
#
#   SportLots does not carry this set. The base picker's SportLots column is
#   the year's whole catalogue ("Base Set" flagged "likely match" is 2024
#   Topps flagship, 352 cards; the next rows are 1989 Topps inserts), so the
#   honest operator action is CANCEL — attaching any of them would be a lie in
#   the data, and the one time it was tried (the author's first probe) it
#   paired 0 of 4 cards. Cancelling leaves exactly ONE side attached (the BSC
#   slug Sync Variant Types wrote on Base), so the fetch takes the NEO-255
#   solo path: no Match Cards dialog, "Kept all N cards from BSC", straight
#   into the review. That is the Roanoke Express shape
#   (`checklist-one-marketplace-skips-match-dialog`), on a warm Baseball
#   drill instead of a cold Hockey one. It is why this flow hand-rolls the
#   fetch rather than calling `util-fetch-real-set-checklist-to-wizard`
#   (R3): that util waits on the two-sided "Match Cards" dialog, which this
#   set never shows.
# maestro-lint: streaming-ok — this flow never DRIVES the pairing dialog; the
#   dialog is named above only to say why the two-sided fetch util is not used.
#   The solo path's own settled text ("Kept all N cards from …") is its sync.
#
#   THIS FLOW IS THE SOLE WRITER OF THIS SET (R7a). It commits — the alias is
#   written at commit and nowhere else, so a read-only version could pass with
#   the feature broken. Nothing else reads the set; it drains its own fixture
#   within a run (a committed set's names are known and a re-sync raises no
#   review), and CI reseeds the preview every run. A LOCAL re-run needs a
#   fresh seed, same contract as the other three committing wizard fixtures.
#
#   WHICH ROW IS LINKED: "Homestead Grays", BY NAME, AND NEVER ANOTHER (R7).
#   The alias this flow saves is live, deployment-wide, for the ~70s between
#   the commit and PART 7's removal, and while it is live every team lookup of
#   that string resolves to this flow's `Loc<token> Ali<token>`. So the string
#   must be one no other flow can look up. The flow used to link "whichever
#   club the batch presents first", and in CI run 38198207277 that was
#   "Montreal Royals": a career team staged off Jackie Robinson's recorded
#   Wikidata history, and a step the four read-only `checklist-wizard-*` flows
#   also walk on Topps Big League (the recording's only other player with that
#   stint is Roberto Clemente). The alias was live while they walked, so their
#   "New Team: Montreal Royals" step resolved away under them.
#
#   This set raises team names of two kinds. Measured on this branch's runs:
#   the staged career teams "Montreal Royals" (Robinson) and "Homestead
#   Grays" (Josh Gibson). The card clubs "Kansas City
#   Monarchs" (RW-1, RW-3) and "Birmingham Black Barons" (RW-4) are what BSC
#   lists on the cards, but they reach the wizard only once the fetch waits
#   for its BSC team lookups (NEO-333, not merged at the time of writing), and
#   RW-2's "Pittsburgh Crawfords" is the retro club below, resolved before the
#   review. "Homestead Grays" is the one that is (a) raised on every run (from
#   the committed recording `convex/adapters/__fixtures__/enrichment-lookups.json`,
#   Gibson 1937–1946, which previews read instead of live Wikidata) and (b)
#   owned by this fixture: Gibson is the only recorded player with that stint,
#   no other flow's set carries him, no other flow's CI log has ever shown the
#   name, and no flow types it into a search. Every other team step is SKIPPED
#   (a skip creates nothing, and its record is scoped to this set's
#   `selectorOptionId`), its heading read first, until that row is up.
#
#   The claim is the row's own spelling, exactly, becomes the alias. A staged
#   career team's row takes the same link path and the same "Remember …" box
#   as a card club's (`handleLink`, `describeDecision`, the commit's alias
#   write). Once NEO-333 lands, "Birmingham Black Barons" (RW-4's club, also
#   fixture-owned) can replace it if the claim should be a card's spelling.
#
# ── THE FIXTURE TEAM ────────────────────────────────────────────────────────
#   Made through the product, never seeded (`admin-teams-two-eras` is the
#   worked example): one throwaway player `Alp<token>` on /admin/players to
#   reach a TeamPicker, then the New Team dialog with Location `Loc<token>` and
#   Name `Ali<token>`, no league. Three permanent, globally-shared rows, inert
#   by name — single tokens, per worker AND per attempt (see SET-REGISTRY
#   "Team names"). The composed full name `Loc<token> Ali<token>` is what the
#   link option, the decision line, the Team Management heading and the Saved
#   line all print; the link SEARCH types the single token `Ali<token>`.
#
# R4 — the entry URL is the whole setup; no in-body login, no credential step.
#
# R5 — every wait states its ceiling. 7000 in-app; the sanctioned exceptions,
#   each named at its step: the post-launchApp gate (45s), the mid-flow
#   reload gates (30s, the value the admin flows use), and the three live
#   marketplace round-trips — the base picker's own SportLots fetch, the BSC
#   checklist fetch, and the batch's Wikidata lookups.
#
# R8 — centred scrolls on the Team Management panel depend on NEO-260's 208px
#   spacer (`src/layouts/binder-layout.tsx`); uncentred where the target sits
#   in a `fixed` dialog or the set-builder's own no-headroom checklist block,
#   with the measurement cited at the step. Inside the wizard, whose body is
#   an inner scroller no `scrollUntilVisible` can move, PART 4 positions the
#   body with two touch-drag `swipe`s (pin down to the Team name box, then
#   back to the top), reasoned at the step.
#
# R10 — the walk to the row under test is one guarded loop, exiting on that
#   row's own heading, that costs nothing when the batch opens on it (the
#   `while` is false at once) and about four seconds per step it skips. No
#   settle waits.

# ============================================================
# LAUNCH + SIGN IN
# ============================================================
- launchApp
- extendedWaitUntil:
    visible: ".*of .* players.*"
    timeout: 45000

- evalScript: '${output.TOKEN = String(ATTEMPT_ID || Date.now()).split("-").join("")}'

# ============================================================
# PART 1 — THE FIXTURE TEAM, born from a career editor (R2a)
# ============================================================
# Empty the list first: every player row prints its sport, so with rows on
# screen "Baseball" is on the page many times and the sport picker could not
# be identified by what it says. The sport is picked with the add form CLOSED
# because maestro resolves an <option> tap by index against the FIRST <select>.
- tapOn: "Filter players"
- inputText: "zzzznotaplayer"
- assertVisible: "No players match that filter."
- tapOn: "All sports"
- tapOn: "Baseball"
- assertVisible: "Baseball"
# Picking a sport re-runs the filtered search, and PlayerManagement's counter
# renders EMPTY until it answers — so "Add player" slides ~110px left for the
# length of that round-trip and back again when the count returns. A tap whose
# bounds were read inside that window lands on the counter instead (CI run
# 35122900214 / runner 5, `admin-franchises-link-teams`: bounds [526,327] at
# the read, the button at [636,327] in the failure screenshot). Waiting for the
# count to be back is waiting for the layout to be still.
- extendedWaitUntil:
    visible: "0 matches"
    timeout: 7000

- tapOn: "Add player"
- tapOn: "New player name"
- inputText: "Alp${output.TOKEN}"
- scrollUntilVisible:
    element:
      id: "Create player Alp${output.TOKEN}"
    timeout: 7000
- tapOn:
    id: "Create player Alp${output.TOKEN}"

# NO SCROLL after the tap (NEO-319). The add form stays up, busy, until the new
# player has loaded; the panel then replaces it in one render with its heading
# revealed just under the app bar (~y=160), the sticky `Added …` notice above
# it. (Until NEO-319 the form unmounted first, the page clamped and scroll
# anchoring left the panel's top above the viewport, so this flow scrolled UP
# to `Filter players` before reading anything.) The heading selector is the
# panel's <h3> alone — `above:` is a top-edge test, the panel's name box sits
# BELOW its `Player name` label and the busy form has no such label (see
# player-management-add-and-career-history). The next scroll is a centred DOWN
# scroll to a target below this position, so where it parks the page is set
# by the target, not by where this step left it.
- extendedWaitUntil:
    visible:
      text: "Alp${output.TOKEN}"
      above:
        text: "Player name"
    timeout: 7000
- assertVisible: ".*Added Alp${output.TOKEN}.*"
- scrollUntilVisible:
    element:
      text: "No stints recorded yet."
    centerElement: true
    timeout: 7000

- assertVisible:
    id: "Add team"
- tapOn:
    id: "Add team"
- tapOn:
    id: "Search teams"
- inputText: "Ali${output.TOKEN}"
# Nothing answers to this name yet — the precondition for creating it, and a
# real assertion that this attempt's token is its own.
- assertVisible: "No matches."
- pressKey: Enter
- assertVisible: "New team: Ali${output.TOKEN}"
- tapOn:
    id: "New team location \\(optional\\)"
- inputText: "Loc${output.TOKEN}"
# The Create button's accessible name is the COMPOSED full name, so targeting
# it is itself the assertion that Location + Name composed in that order.
- tapOn:
    id: "Create team Loc${output.TOKEN} Ali${output.TOKEN}"
- extendedWaitUntil:
    visible:
      id: "Remove team Loc${output.TOKEN} Ali${output.TOKEN}"
    timeout: 7000

# ── R2(h) NEO-307: the retro club, with a CLOSED era, through the same picker
# The trigger is `setPopoverOpen(true)`, never a toggle, so reopening is safe
# whatever state the first create left the popover in.
# MEASURED (green local run, 2026-09-25): after the first chip "+ Add team"
# is at y=495-517, on screen with no scroll.
- tapOn:
    id: "Add team"
- tapOn:
    id: "Search teams"
- inputText: "Pittsburgh Crawfords"
# The precondition (h) needs: no row of this name exists yet. A second row
# would make the name ambiguous and the rule would, correctly, not fire.
- assertVisible: "No matches."
- pressKey: Enter
# The heading echoes the query, so it also proves the search box held exactly
# the club's name and not text left over from the first create.
- assertVisible: "New team: Pittsburgh Crawfords"
# The era, by the fields' explicit aria-labels (NewTeamForm; regex brackets
# escaped). "to" stays disabled until a start year exists, so from first.
# MEASURED (same run): both era boxes at y=266-300, inside the dialog body's
# visible slice.
- tapOn:
    id: "New team active from \\(optional\\)"
- inputText: "1926"
- tapOn:
    id: "New team active to"
- inputText: "1940"
# R2(i) NEO-307: one alias on the retro club, `Pca<token>`, for the wizard's
# alias-clash warning in PART 4. Typed here because the dialog already asks
# for aliases, which costs one field instead of a Team Management detour. It
# is inert: no checklist carries it, and the flow never searches for it.
- tapOn:
    id: "New team aliases \\(optional\\)"
- inputText: "Pca${output.TOKEN}"
# No Location and no League typed: the composed full name is exactly the
# checklist's string, which is what the Create button's name asserts.
- tapOn:
    id: "Create team Pittsburgh Crawfords"
- extendedWaitUntil:
    visible:
      id: "Remove team Pittsburgh Crawfords"
    timeout: 7000

# ============================================================
# PART 2 — THE SET: drill (R9), decline SportLots, fetch one-sided
# ============================================================
# The drill util opens /set-selector itself and gates on the panel subtitle.
- runFlow:
    file: util-drill-to-2024-topps-chrome.yaml
    env:
      SET: "Topps MLB at Rickwood Field Negro Leagues Collection"
- scrollUntilVisible:
    element:
      text: "Base"
    centerElement: true
    timeout: 7000
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: "Base"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "Select Base Set"
          timeout: 7000

# R5 marketplace exception: the picker fetches the year's SportLots catalogue
# live before it can offer Confirm. Then CANCEL — see the header. The
# precondition is that BSC really answers for this set.
- extendedWaitUntil:
    visible: "Confirm Base Set"
    timeout: 60000
- assertVisible:
    id: "BSC base candidate: .*"
# NEO-287 — the SportLots pane, by mode (`-e PAUSED_PLATFORMS`, decided by
# util-paused-platforms). This set is one-sided in BOTH modes and the picker
# is cancelled in both; what differs is what the pane SAYS: live, SportLots'
# catalogue is offered (and declined); paused, the pane says the platform is
# on pause and offers nothing. Both branches are hard (R2).
- runFlow:
    file: ../util/util-paused-platforms.yaml
- runFlow:
    when:
      true: "${!output.SL_PAUSED}"
    commands:
      - assertVisible:
          id: "SportLots base candidate: .*"
- runFlow:
    when:
      true: "${output.SL_PAUSED}"
    commands:
      - assertVisible: "SportLots returned no base set for .*"
      - assertNotVisible:
          id: "SportLots base candidate: .*"
- tapOn: "Cancel"
- assertVisible:
    text: ".*Base mapping cancelled.*"
# CENTRE before the tap (R8). The notice's Close sits at the bottom of the
# Base-mapping block, which the drill leaves straddling the fold: locally
# [131,603][193,635] on the 625px viewport (centre 619, six pixels inside),
# and on CI's Linux Chrome the columns' 15px horizontal scrollbar pushes it to
# [133,618][195,650] on 629px — centre 634, OFF screen — and the tap dies with
# `null cannot be cast to non-null type kotlin.Int` (CI run 35134145689 /
# runner 6, hierarchy dump step-070). One "Close" exists on this page
# (`BaseMappingForm`), and the page has scroll headroom below the block.
- scrollUntilVisible:
    element:
      text: "Close"
    centerElement: true
    timeout: 7000
- tapOn: "Close"
- extendedWaitUntil:
    notVisible:
      text: ".*Base mapping cancelled.*"
    timeout: 7000
- assertVisible: "Map Base Set"

# The empty-checklist block has no scroll headroom below it, so a centred
# scroll to the Sync button burns the give-up path (R8 case 2, measured on
# this page by `util-fetch-real-set-checklist-to-wizard`: bounds held across
# all six tries). Uncentred it settles well under a second.
- scrollUntilVisible:
    element:
      text: "Add Card"
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000
- assertVisible: "No cards in this checklist yet."
- scrollUntilVisible:
    element:
      id: "Sync card checklist"
    timeout: 7000
- tapOn:
    id: "Sync card checklist"

# R5 marketplace exception: one live BSC round-trip. The sentence is produced
# on the solo path ONLY (NEO-255) — it is the proof that one side was
# attached and that nothing was silently paired against a wrong SportLots set.
- extendedWaitUntil:
    visible:
      text: ".*Kept all [0-9]+ cards? from .*"
    timeout: 60000
# R5 marketplace exception: the wizard opens once the batch is queued, and
# every name in it is behind a live Wikidata lookup.
- extendedWaitUntil:
    visible: "Tidy up this set"
    timeout: 60000

# ============================================================
# PART 3 — THE TEAM ROW (R2b)
# ============================================================
- assertVisible:
    text: "Step 1 of [0-9]+"

# Wait the batch's lookups out (live Wikidata, R5 exception — the same gate
# `util-wizard-walk-to-player-row` uses), so the row presented next is settled
# and nothing that settles later can out-rank it (NEO-236/254 nav rules:
# leagues before teams before players).
- extendedWaitUntil:
    notVisible: ".*still looking up.*"
    timeout: 180000

# WALK TO "Homestead Grays", skipping every team or league step ahead of it
# (header, "WHICH ROW IS LINKED"). Measured on this branch: the batch opens on
# "New Team: Montreal Royals", then "New League: Negro league baseball" (staged
# for the Grays, so NEO-335's walk hands back to them), then the Grays. Each
# skipped step is READ first, the same two readings PART 5 takes and for the
# same reason (R2h): its heading and its skip control must agree on the kind
# (a league skip under a `New League:` heading, a team skip under a `New Team:`
# heading that is not the retro club), and the heading must not be the row
# under test, so the Grays can never be skipped as a step "ahead" of
# themselves.
#
# THE TAP NAMES THE ROW IT READ. The guard and the tap are separate hierarchy
# reads (`patterns_guard_then_tap_toctou`); a bare `Skip .*` tap issued while
# the previous skip is still landing could hit the NEXT row's control, and
# here the next row can be the one under test. So the tap's selector is built
# from the heading just copied: if the row moved on in between, it matches
# nothing, `optional: true` lets the loop come round, and the `while` reads
# the new heading. Copied names go into a regex, so they are escaped first.
# The league control's name ends "— this team has no league"; the em dash is
# matched with ".".
#
# ONE guard for both kinds (a second `when:` that does not match costs ~6.6s
# a pass). `times: 8` bounds it: two steps are measured ahead of the Grays
# today, and four once NEO-333 raises the two card clubs. If the Grays are
# never raised, the loop stops at a player row (where the guard is false) and
# the hard wait below fails on the missing row, not on anything slower.
- repeat:
    times: 8
    while:
      notVisible: "New Team: Homestead Grays"
    commands:
      - runFlow:
          when:
            visible:
              id: "Skip .*(not a team|has no league)"
          commands:
            - copyTextFrom:
                text: "New (Team|League): .*"
            - evalScript: '${output.STEP_HEADING = maestro.copiedText}'
            - copyTextFrom:
                id: "Skip .*(not a team|has no league)"
            - evalScript: >-
                ${output.STEP_OK = (maestro.copiedText.indexOf("no league") >= 0)
                  ? output.STEP_HEADING.indexOf("New League: ") === 0
                  : (output.STEP_HEADING.indexOf("New Team: ") === 0
                     && output.STEP_HEADING !== "New Team: Pittsburgh Crawfords"
                     && output.STEP_HEADING !== "New Team: Homestead Grays")}
            - assertTrue: ${output.STEP_OK}
            - evalScript: '${output.STEP_NAME_RE = output.STEP_HEADING.replace(/^New (Team|League): /, "").replace(/[\^\[\]()*+?.|]/g, function (c) { return "\\" + c; })}'
            - tapOn:
                id: "Skip ${output.STEP_NAME_RE} . (not a team|this team has no league)"
                optional: true

# R2(b) — the row under test is up, and it is a TEAM row: its OWN skip control
# (named for the row) says "not a team". The wizard presents one row at a time
# (`EntityReviewWizard`'s `current` resolves the single `nav.rowId`).
- extendedWaitUntil:
    visible:
      id: "Skip Homestead Grays . not a team"
    timeout: 7000
- assertVisible: "New Team: Homestead Grays"
# The row's raw name, the string the alias will be. Every later surface is
# asserted against it.
- evalScript: '${output.ROW_NAME = "Homestead Grays"}'

# ============================================================
# PART 4 — LINK, WITH THE REMEMBER-BOX ON (R2c, R2d)
# ============================================================
# NEO-307 — a team step no longer has "Link to Existing…" or near-match Link
# buttons. Every team step carries ONE combobox, "Search all teams"; a pick
# links through the same `handleLink` path, "Remember …" answer included.
# NEO-326 — that combobox now lives in a bordered "Link to existing team"
# section that is on EVERY team step (it used to appear only when there were
# near matches, headed "Possible matches"), it starts EMPTY (it used to be
# pre-filled with the row's name), and the "Remember …" box moved inside the
# section, directly under it.
#
# R2 precondition, and NEO-326's empty start: the combobox is on THIS team
# step and holds nothing. maestro-web reads an empty input as its PLACEHOLDER
# (`value || placeholder || ariaLabel`), so `text: "Type a team name"` is the
# box being empty; a build that still pre-filled the row's name reads
# `${output.ROW_NAME}` here and fails. No club name on this set and no
# `Ali<token>` can full-match "Type a team name", so no value in the box can
# be mistaken for an empty one. That it is THIS row's step is proven by the heading the
# flow just copied and by the box quoting this row below.
- extendedWaitUntil:
    visible:
      id: "Search all teams"
      text: "Type a team name"
    timeout: 7000
# The section's heading, above the combobox it names. Exactly "Link to
# existing team" (full-match), so the player/league panel's "Possible matches"
# cannot answer for it.
- assertVisible:
    text: "Link to existing team"
    above:
      id: "Search all teams"

# R2(c) — the box is offered directly UNDER the combobox (NEO-326), quoting
# THIS row's raw name (curly quotes are the product's). Its checked state is
# proven by (d) below.
- assertVisible:
    text: "Remember “${output.ROW_NAME}” as a name for this team"
    below:
      id: "Search all teams"

# ── R2(i) NEO-307: a New Team name that is another team's ALIAS is refused ──
# Edit this step's Team name to `Pca<token>`, the alias PART 1 gave Pittsburgh
# Crawfords. The step must then say so in the product's one sentence (body and
# footer carry the same text node), offer the holder's link, and refuse
# "Add as New Team". The edited name is then LEFT in place: this row's
# decision is the LINK below, which never reads the create draft.
#
# Why no restore (CI run 36139385192, runner 6, step 125): the warning block
# is inserted ABOVE the Location/Name fields, so it pushes the Team name box
# ~114px down. Before NEO-326 that was y=432-466 to y=546-580, below the
# wizard body's visible bottom (~475), under the pinned footer, so the restore
# tap landed on the footer and the name was never put back. The body is an
# inner scroller maestro cannot see the clip of (README "Asserting inside a
# dialog").
#
# PIN THE BODY BEFORE THE TAP (NEO-326). The always-on "Link to existing team"
# box adds its border, padding and heading above the form, ~60px by the
# component's classes (p-3 + heading + gap), so on a body scrolled to its top
# the Team name box moves from y=432-466 to ~y=492-526: past the body's
# visible bottom, where maestro still reports it (it sees only the VIEWPORT,
# never the body's clip) and a tap lands on the footer instead. Nothing has
# scrolled this body yet, so it is at its top. One UP touch drag of ~313px
# (50% of the viewport; a `swipe` with start/end is a touch drag and scrolls
# the scroller under the finger, which `scrollUntilVisible` cannot) moves
# the box to ~y=179-213, or less far if the body has less overflow than that,
# in which case the drag pins it to its end and the box rests lower — either
# way inside the slice (y=96-475). Same gesture, start point and reasoning as
# `checklist-wizard-career-team-entry`'s pin (x=18% is the body's left
# padding, never a control; y=70% is inside the body). It cannot be gated:
# every check passes on a clipped box. The warning sentence below is the hard
# assert that the tap focused the Team name box and the typing landed.
# MEASURE on the first local run against a preview with NEO-326: the Team
# name box's bounds after this drag (the step's hierarchy dump).
- swipe:
    start: "18%, 70%"
    end: "18%, 20%"
    duration: 600
#
# The field is found by its VALUE under its caption. In the wizard the input
# carries a stable DOM id, which becomes its resource-id and shadows the
# aria-label, and flows never target a DOM id. `below:` the "Team name"
# caption picks the nearest match, which is the input. Since NEO-326 it is the
# ONLY node under the caption that reads the row's name in full: the "Shows
# as:" preview that used to repeat it under the form is gone, and the
# "Search all teams" box starts empty. The prefill's Location is empty and
# the whole name is in Team name: Location is pre-filled only from an ESPN
# location the lookup returned (`teamCreatePrefill`), and ESPN's team lists
# (`fetchEspnTeamInfo`) are today's league rosters, which carry no Negro League
# club. MEASURED the same way on "Montreal Royals" (CI run 36139385192); NOT
# yet measured on the Grays — a split prefill would fail this tap on its own
# selector, loudly. A centre tap put the caret at the end (the erase cleared
# it).
- tapOn:
    text: "${output.ROW_NAME}"
    below:
      text: "Team name"
- eraseText: 60
- inputText: "Pca${output.TOKEN}"
# The holder's full name, then the sentence. Em dash matched with ".".
- extendedWaitUntil:
    visible: "Pittsburgh Crawfords already answers to this name as an alias . remove it there before a team can take the name\\."
    timeout: 7000
# The fix offered in place: the holder's link, era included (middle dot and
# en dash matched with "."). Asserted only. The flow's own link is to
# Loc<token> Ali<token>, below.
- assertVisible: "Link to Pittsburgh Crawfords . 1926.1940"
# The refused create. The header's "Step x of y" moves with every decision
# (on a name step x is the decided count plus one, NEO-335 Phase 2), so it is
# read before the tap and must still read the same after it.
- copyTextFrom:
    text: "Step [0-9]+ of [0-9]+"
- evalScript: '${output.COUNT_BEFORE = maestro.copiedText}'
- tapOn:
    id: "Add as New Team"

# PIN THE BODY BACK TO ITS TOP. The combobox is the first control in the body,
# and the drag above scrolled it out past the body's top edge (still inside
# the viewport, so maestro would "see" it and tap the wizard header instead).
# ONE long DOWN drag (~470px, more than the UP drag moved it) pins the body
# to its top. ONE, never two: a second drag that starts on a body already at
# its top chains to the WINDOW (career-team-entry's measurement). The body
# also keeps this scroll position from row to row, and PART 5 reads each
# later step's heading at the top of the body, so this pin is what leaves
# that walk the geometry it was written against.
- swipe:
    start: "18%, 20%"
    end: "18%, 95%"
    duration: 800
# Still THIS row. A recorded create would have moved the walk to the next row;
# the heading is the step's own top line, back in view after the pin. (Before
# NEO-326 the box seeded with this row's name carried this proof; it now
# starts empty on every row, so the heading carries it.)
- assertVisible: "New Team: ${output.ROW_NAME}"

# The field is empty, so the typed text is the whole query. It is read back
# before the option is looked for: if the typing had gone anywhere else (a
# tap that missed the field), the failure reads as itself and not as "no such
# team". `Ali<token>` is a strict substring of the option's
# "Loc<token> Ali<token>", so the input's own text cannot answer to the tap.
# Focusing the empty box opens it on the near matches when there are any
# (NEO-326); typing replaces that list with `teams.search`'s answer.
- tapOn:
    id: "Search all teams"
- inputText: "Ali${output.TOKEN}"
- extendedWaitUntil:
    visible:
      id: "Search all teams"
      text: "Ali${output.TOKEN}"
    timeout: 7000
# R2(i), the refusal's second reading: seconds after the tap on the refused
# "Add as New Team", nothing has been decided (a create would have counted).
- copyTextFrom:
    text: "Step [0-9]+ of [0-9]+"
- assertTrue: '${maestro.copiedText === output.COUNT_BEFORE}'
# The option's only direct text node is the composed full name (its "League ·
# years" line is a separate node; this fixture has neither, so there is none).
# It comes back from `teams.search` after a 200ms debounce — in-app, 7000.
- extendedWaitUntil:
    visible:
      text: "Loc${output.TOKEN} Ali${output.TOKEN}"
    timeout: 7000
- tapOn:
    text: "Loc${output.TOKEN} Ali${output.TOKEN}"
# The decision landing is what moves the wizard OFF this row (an implicit row
# advances the moment it is settled). Waiting for the heading to go is the
# only honest "it landed" here — the counter already moved for the league skip
# — and the positive that pairs with this negative is the read-back below.
- extendedWaitUntil:
    notVisible:
      text: "New Team: ${output.ROW_NAME}"
    timeout: 7000

# R2(d) — read the decision back. The wizard walked on to the next row, so
# step BACK to the one just judged (NEO-221 history); its read-only panel
# states the decision in `describeDecision`'s words, and the "· remembered as"
# tail exists only for a team link whose `saveAsAlias` is true.
- tapOn:
    id: "Back to previous decision"
- extendedWaitUntil:
    visible:
      id: "Decision for ${output.ROW_NAME}"
    timeout: 7000
- assertVisible:
    text: "Linked to Loc${output.TOKEN} Ali${output.TOKEN} · remembered as “${output.ROW_NAME}”"
# Hand the walk back to the wizard before the bulk skip.
- tapOn:
    text: "Next"
    below:
      text: "Already decided:.*"

# ============================================================
# PART 5 — COMMIT (R2e), after reading every other team step (R2h)
# ============================================================
# R2(h) — the retro club is NOT raised. The wizard presents every settled
# undecided TEAM (and LEAGUE) row before any player row, one row at a time
# (`entity-review-nav.ts`), and the batch settled in PART 3. So walking the
# remaining team steps one by one, reading each heading and skipping it,
# reads EVERY team step the batch raised; a player row coming up is the
# product saying there are no more. A bulk skip here would decide them
# unseen, and the commit alone cannot tell "never raised" from "raised and
# skipped": its exactly-one fast path links a resolvable name BEFORE it reads
# the decision (`commitCardChecklistPrelude`).
#
# LEAGUE STEPS COME THROUGH THIS WALK TOO (CI run 36166081072, runner 7, step
# 146). A staged career team (here "Homestead Grays", from Josh Gibson's
# Wikidata stints) raises its own `New League:` step. Since NEO-307 a league
# step is presented while its lookup is still pending, so it can come up at
# any point in this walk, before, between or after team steps. A loop that
# only knew "Skip … not a team" stalled on "New League: Negro league baseball"
# and the player-row wait below failed. So the walk takes every team OR
# league step, one presented row at a time, and reads each one before
# skipping it. A skip creates nothing (R7).
#
# Per row, two readings that must agree:
#   * the step's HEADING ("New Team: …" or "New League: …", the body's top
#     line, a copied node, so it cannot pass on a dead page); and
#   * the skip CONTROL's own text ("Skip — not a team" / "Skip — no league"),
#     which says which kind of step the footer is acting on.
# A league skip must sit under a `New League:` heading, and a team skip under
# a `New Team:` heading that is not the retro club. So no team step, the retro
# club's above all, can be skipped as if it were a league, and every team
# heading the batch raised is read.
#
# ONE guard for both kinds, the same selector `util-wizard-walk-to-player-
# row.yaml` drains with: a second `when:` that does not match costs ~6.6s per
# pass (a non-matching `runFlow when` waits out its lookup). The `optional:
# true` tap is that util's mechanism, noted there and not duplicated (R3).
- repeat:
    times: 20
    while:
      notVisible:
        id: "Skip .* not a person"
    commands:
      - runFlow:
          when:
            visible:
              id: "Skip .*(not a team|has no league)"
          commands:
            - copyTextFrom:
                text: "New (Team|League): .*"
            - evalScript: '${output.STEP_HEADING = maestro.copiedText}'
            - copyTextFrom:
                id: "Skip .*(not a team|has no league)"
            - evalScript: >-
                ${output.STEP_OK = (maestro.copiedText.indexOf("no league") >= 0)
                  ? output.STEP_HEADING.indexOf("New League: ") === 0
                  : (output.STEP_HEADING.indexOf("New Team: ") === 0
                     && output.STEP_HEADING !== "New Team: Pittsburgh Crawfords")}
            - assertTrue: ${output.STEP_OK}
            - tapOn:
                id: "Skip .*(not a team|has no league)"
                optional: true
- extendedWaitUntil:
    visible:
      id: "Skip .* not a person"
    timeout: 7000

# Everything else is a skip: skips create nothing, so the only entity this
# commit could mint is the one the link deliberately avoided. The batch is
# settled (PART 3), so the bulk skip is one mutation — in-app, 7000.
- tapOn:
    text: ".*Skip remaining names \\([0-9]+\\).*"
- extendedWaitUntil:
    visible:
      text: "Next \\(Enter\\)|.*Confirm & Save.*"
    timeout: 7000
# NEO-335 Phase 2 — the teams / titles steps (a skipped team name leaves its
# cards teamless) stay on their defaults; this flow's feature is the alias.
- runFlow: util-wizard-advance-to-save.yaml
- tapOn:
    text: ".*Confirm & Save.*"
- extendedWaitUntil:
    visible:
      text: ".*Saved [0-9]+ cards.*"
    timeout: 7000

# R2(h) — the card LINKED to the retro club. A card's sub-line prints its
# resolved teams by full name (`CardChecklistItem`: `teamFullName` over
# `teamOnCardIds`) and an unresolved one as "<name> (unconfirmed)", so the
# negative lookahead is what makes this the link and not the raw string.
# The club is on card RW-2 (Gibson's). The page position after the commit
# varies: one local run left RW-2's sub-line at y=2-18 under the sticky
# header (RW-1 above y=0), which is why the scroll goes UP. The green local
# run (2026-09-25) found it at try 0 with the sub-line at y=510-526, fully
# visible, and accepted it without a swipe. The sub-line is one text node
# (`subParts.join`), which the regex assumes.
- scrollUntilVisible:
    element:
      text: ".*Pittsburgh Crawfords(?! \\(unconfirmed\\)).*"
    direction: UP
    centerElement: true
    timeout: 7000

# ============================================================
# PART 6 — TEAM MANAGEMENT SHOWS THE ALIAS (R2f)
# ============================================================
# A reload separates "the wizard is holding what I did" from "the database
# holds it", and lands on the screen the alias is FOR.
- openLink: ${APP_URL || "http://localhost:3000"}/admin/teams
- extendedWaitUntil:
    visible: ".*of .* teams.*"
    timeout: 30000
- tapOn: "Filter teams"
- inputText: "Ali${output.TOKEN}"
- extendedWaitUntil:
    visible: "1 of .* teams.*"
    timeout: 7000
# The master row PRINTS the short name and is anchored below the counter so
# the filter box — whose VALUE maestro reads as the same text — cannot answer.
- tapOn:
    text: "Ali${output.TOKEN}"
    below:
      text: "1 of .* teams.*"

# The "Also known as" box is seeded from the stored row and the chip list
# under it renders only when that parses to at least one alias. Centred on
# the label (depends on the NEO-260 spacer); the chip list is asserted by its
# own accessible name, and the alias string beneath the label. Both the box
# (value) and the chip carry the string, and either is the persisted value —
# the list's presence is what says it is a chip.
- scrollUntilVisible:
    element:
      text: "Also known as"
    centerElement: true
    timeout: 7000
- assertVisible:
    id: "Current aliases"
- assertVisible:
    text: "${output.ROW_NAME}"
    below:
      text: "Also known as"

# ============================================================
# PART 7 — TAKE IT BACK OUT, AND PROVE THE REMOVAL PERSISTED (R2g, R7)
# ============================================================
# Tap the BOX, not its label. `eraseText` sends Backspaces to the active
# element, and Backspace deletes from the caret: a label tap focuses the
# textarea with the caret at position 0 and erases nothing (measured — the
# chip list survived 120 Backspaces), while a tap on the box lands at its
# centre, past the end of a one-line value, and puts the caret at the end.
# The box and the chip both carry the alias text; `below` the label picks the
# nearer one, which is the box. 120 is the alias length ceiling.
- tapOn:
    text: "${output.ROW_NAME}"
    below:
      text: "Also known as"
- eraseText: 120
- assertNotVisible:
    id: "Current aliases"
- scrollUntilVisible:
    element:
      text: "Save"
    centerElement: true
    timeout: 7000
- tapOn: "Save"
- extendedWaitUntil:
    visible: ".*Saved Loc${output.TOKEN} Ali${output.TOKEN}.*"
    timeout: 7000

- openLink: ${APP_URL || "http://localhost:3000"}/admin/teams
- extendedWaitUntil:
    visible: ".*of .* teams.*"
    timeout: 30000
- tapOn: "Filter teams"
- inputText: "Ali${output.TOKEN}"
- extendedWaitUntil:
    visible: "1 of .* teams.*"
    timeout: 7000
- tapOn:
    text: "Ali${output.TOKEN}"
    below:
      text: "1 of .* teams.*"
- scrollUntilVisible:
    element:
      text: "Also known as"
    centerElement: true
    timeout: 7000
# Negative paired with a positive: an empty textarea reports its PLACEHOLDER
# as its text, so the placeholder on screen is the box being empty.
- assertNotVisible:
    id: "Current aliases"
- assertVisible:
    text: "LSU, Louisiana State, LSU Tigers baseball"
    below:
      text: "Also known as"

# ============================================================
# PART 8 — THE RETRO CLUB IS STILL ONE ROW (R2h)
# ============================================================
# The link must not have minted a second era of the club. A fresh load, so the
# filter box starts empty (the one above still holds "Ali<token>", and a label
# tap would put the caret at 0). The counter is the page's own count of rows
# matching the filter.
- openLink: ${APP_URL || "http://localhost:3000"}/admin/teams
- extendedWaitUntil:
    visible: ".*of .* teams.*"
    timeout: 30000
- tapOn: "Filter teams"
- inputText: "Pittsburgh Crawfords"
- extendedWaitUntil:
    visible: "1 of .* teams.*"
    timeout: 7000

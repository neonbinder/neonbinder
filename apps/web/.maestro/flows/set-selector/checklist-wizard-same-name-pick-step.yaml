appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/admin/players&worker=${WORKER_INDEX || "0"}
name: "Entity review — a checklist name two players on file share asks which one it is, and Create new is a step you can back out of"
tags:
  - set-selector
---
# R1 — ONE FEATURE (NEO-332): the entity-review wizard's PICK STEP. When two
# or more players on file share a checklist name, the wizard does not offer
# "Add as New Player" first; it asks "Which <name> is this?" and lists the
# players we hold, each told apart by what is on file (here, a birth year).
# "Create new" opens the New Player step, "Back to the list" returns without
# deciding anything, and taking a candidate records a link to THAT player.
# Untouched, the step HOLDS its place while the rest of the batch settles
# (NEO-339).
#
# R2 — HARD ASSERTIONS, every one unhedged:
#     (a) the review starts with nothing decided — "Step 1 of N" (NEO-335
#         Phase 2's counter: on a name step x is the decided count plus one);
#     (b) the wizard OPENS on the pick step while the other names are still
#         being looked up — the same-name row arrives ready, with no lookup of
#         its own. The question and "Step 1 of N" are read in ONE hierarchy
#         read, as the first step after the wizard opens (STEP 1); then the
#         intro that counts the players on file ("2 on file"), one link per
#         candidate — `Link to Shuya Yamada, b. 1851` for the flow's own row
#         and an undated one for the catalogue's — `Create new`, the row's own
#         Skip, and the header's screen type "Which player is this?". Since
#         NEO-335 the header no longer prints "· N still being looked up", so
#         the "still looked up" half rests on the timing argument below (the
#         pick step at the FIRST read, inside a ≥2.5s pending window), not on
#         a string;
#     (c) Create new shows the New Player step and NOT the list: `Add as New
#         Player`, `Back to the list`, the heading's sr-only "New Player: "
#         prefix, and neither the question nor either candidate on screen;
#     (b2) NEO-339 — the untouched pick step HOLDS: once every other name's
#         lookup has landed (and the career teams and league they stage have
#         settled), the question is still on screen under a header that reads
#         "Step 1 of N" (nothing decided). Before NEO-339 the first settled team or
#         league took the step away. The claim bites only on a batch that
#         stages one; this one did (5 career teams and a league, 2026-10-11),
#         and it lives on live Wikidata data the flow does not own;
#     (d) Back to the list returns to the same list with nothing decided: the
#         question and both candidates are back, the footer says "Back at the
#         list. 2 on file.", and the decided count has not moved;
#     (e) taking the b. 1851 row records exactly one decision (the counter
#         moves from "Step 1" to "Step 2", the question is gone) and its read-back
#         names WHICH man — "Linked to Shuya Yamada, b. 1851" — in the row's
#         own `Decision for Shuya Yamada` panel. Neither a create ("Added as
#         new"), a skip ("Skipped") nor a link to the catalogue's undated
#         Shuya Yamada can produce it.
#
# NOT DRIVEN HERE: Escape from the New Player step back to the list.
#   maestro-web's `pressKey` supports Enter only, so it is left to the
#   wizard's unit tests. The CardChecklist banner's "· N to pick from the
#   roster" tail is unit-tested beside CardChecklist for the same reason as
#   the rest of the banner: it renders before the wizard and asserting it
#   would be a second feature (R1).
#
# ── THE FIXTURE ─────────────────────────────────────────────────────────────
#   `Baseball → 2024 → Topps → Topps Chrome NPB → Base`, owned by this flow
#   alone (SET-REGISTRY.md → "Topps Chrome NPB"). Card #1 is Shuya Yamada RC,
#   Hanshin Tigers.
#
#   The NEO-330 reference catalogue (a prod snapshot) already holds a Shuya
#   Yamada: Hanshin Tigers from 2026, no birth year. The flow adds the second
#   man through the product: a Baseball "Shuya Yamada" born 1851 on
#   /admin/players (the form's floor is 1850). Two on file, so the name is
#   ambiguous. The b. 1851 row has no career stint, so card-year narrowing
#   (`narrowSameNamePlayersByCardYear`) never filters him out; the catalogue
#   row's span covers a 2024 card within the ±2-year tolerance, so he
#   survives too, and his one stint starts after 2024, so the card's team
#   cannot pick him outright. The step lists two. If a catalogue refresh
#   moves that stint to 2024 or earlier, or drops the row, STEP 1 fails by
#   name (no pick step) — re-measure, do not hedge.
#
#   ONE ROW OF OUR OWN, NOT TWO (CI run 38197074499). The flow used to fork a
#   second row, b. 1852. On a catalogue preview the server refuses it:
#   `createByAdmin` forks past ONE undated rival but not past several
#   ("2 players are already filed under Shuya Yamada. Pick the right one
#   instead of adding another." — `adoptOrForkOnCreate`, NEO-254), and the
#   catalogue's row is undated. The refusal is deterministic, so the fixture
#   is one fork beside the catalogue's man, and the read-back still has to
#   name which of two men the link took.
#
#   ⚠️ THE NAME IS A REAL, TWO-TOKEN CHECKLIST NAME, NOT A MINTED ONE. That is
#   the exception to "minted names are single tokens", and it is safe only
#   because no other flow fetches a checklist carrying it and this flow never
#   asserts a search COUNT (other "Yamada" rows may share a token). The
#   registry entry says so.
#
#   Re-runs are idempotent. On a deployment that already holds the b. 1851
#   row (a retry, a local re-run) the create ADOPTS — a birth year exactly
#   one row carries is an adopt — so the result line is matched for either
#   outcome, and what is asserted hard is the state after: the b. 1851 row on
#   file, read back from the server's search.
#
# ── WHY STEP 1 IS A TIMING CLAIM THAT HOLDS (Jason, 2026-10-11: keep it) ────
#   On the catalogue-loaded preview this set stages 21 player rows: Shuya
#   Yamada, inserted READY, and 20 NPB names the catalogue does not hold, each
#   behind a live Wikidata lookup (none is in the enrichment recording). The
#   lookups run in the deployment's one 5-wide FIFO pool, so the 20 need at
#   least four rounds, and every career team they stage (5 on 2026-10-11:
#   three for Adam Walker, two for Leandro Cedeno, plus a league) is queued
#   behind all 20. Until the last of them settles the wizard has pending rows
#   (before NEO-335 the header printed "· N still being looked up"; the
#   "Step x of y" counter that replaced it carries no tail).
#
#   How long one lookup takes is NOT the guarantee: Convex-side it ranged
#   from 0.3s to 20s in one batch (2026-10-11, PR preview, 502 retries in the
#   tail), ~4-5s in CI run 38073638557. What holds the window open is the
#   pool's depth: four player rounds and then the team rounds, each a
#   Wikidata round-trip plus ~0.2s between a slot freeing and the next start,
#   so even an all-fast batch keeps the tail ≥ ~2.5s. STEP 1's read lands
#   ~1s into the batch (the wizard's title paints within ~0.6s of the first
#   lookup starting, and the read is the next hierarchy capture). Measured
#   on the PR preview, 2026-10-11: batch start +0.0s, first five lookups
#   +0.5s, STEP 1 COMPLETED +1.1s, last player lookup started +13.3s, first
#   team settled +14.1s, tail gone +44s (one name's 502 retried late; +26.7s
#   without it). Other flows' lookups share the pool on CI and only lengthen
#   it. That is why STEP 1 is the first read after the wizard opens, and why
#   the resumed-batch guard before it is a single copyTextFrom rather than
#   util-discard-resumed-review-batch's 7s `notVisible` dwell.
#
# ── WHY THE FLOW WAITS THE BATCH OUT AFTER STEP 1, AND WALKS NOTHING ────────
#   Since NEO-339 a pick step holds its place, touched or not
#   (`holdPresentedRow` in EntityReviewWizard.tsx): no team or league settling
#   elsewhere takes it away, "Create new" holds the New Player step (an edit),
#   and "Back to the list" returns to the held list. So STEPS 2-3 need no
#   walk. Until NEO-339 they did: an untouched pick step yielded to the first
#   settled team, and the flow drained the team steps with
#   util-wizard-walk-to-player-row first. That util now skips a held pick
#   step (it is not for flows that want one), so this flow no longer calls it.
#
#   It still waits the batch's lookups out, for two reasons. The wait is
#   R2(b2): the step must still be there once everything has settled. And it
#   makes STEP 4's read-back deterministic: the link answers the step and
#   hands control back to the walk (leagues → teams → players), and with every
#   lookup landed there is always a settled row for it to present, whose
#   footer carries "Back to previous decision". With lookups still out the
#   walk could have nothing to present, and the footer would have no Back.
#   After the wait nothing is left that could stage a step under Shuya
#   Yamada: his own lookup, started by Create new, finds no career team on
#   Wikidata (2026-10-11). Nothing is decided by then, so the counts below
#   are absolute: "Step 1" (0 decided) before the link, "Step 2" after it.
#
# R3 — DEDUP: `admin/admin-players-same-name-birth-year` owns the fork itself
#   (bounds, adopt vs fork) and is the reason this flow can add a second man
#   under a name already on file; it never opens the wizard. `checklist-wizard-link-to-existing-
#   player` owns "Link to Existing…" search; nothing here searches.
#
# R4 — the entry URL is the whole sign-in; no in-body login.
#
# R5 — every in-app step is 7000. The long waits are the utils' own sanctioned
#   ones and nothing else: the live BSC + SportLots fetch and the cold Base
#   mapping (util-fetch-real-set-checklist-to-wizard / util-drill-to-base-
#   variant), the post-launch sign-in gate (45s), and the batch's
#   live-Wikidata wait (180s, the same ceiling the wizard utils give it).
#   "Back to the list" is immediate whatever Shuya Yamada's own lookup is
#   doing.
#
# R7 / R7a — READ-ONLY on the set: the flow leaves through Cancel → Discard,
#   commits nothing, and creates nothing from the wizard (its one decision,
#   the link, is discarded with the batch). It provisions the set's structure on its
#   first drill and writes one GLOBAL `players` row that nothing deletes
#   (registry entry).
#
# R9 — drilled through util-fetch-real-set-checklist-to-wizard with a SET
#   override; no hand-rolled drill.
#
# R10 — one conditional, the resumed-batch guard before STEP 1, and it is a
#   script condition (`when: true`) costing no hierarchy wait. The lookup wait
#   after STEP 1 synchronises on the batch settling, which R2(b2) and STEP 4
#   both read.

- launchApp
# The list COUNTER, not the heading: the heading paints before the list query
# answers (admin-players-same-name-birth-year). NEO-330's concise counter:
# "500 players" browsing, "N matches" / "10+ matches" with a filter typed.
- extendedWaitUntil:
    visible: "[0-9,]+ players?"
    timeout: 45000

# ============================================================
# FIXTURE — a second Baseball Shuya Yamada, b. 1851, beside the catalogue's
# The steps are admin-players-same-name-birth-year's, whose header explains
# each geometry note; only what differs is commented here.
# ============================================================

# Empty the list so "Baseball" belongs to the sport picker alone, and pick the
# sport with the add form CLOSED (a native option tap resolves against the
# FIRST <select> on the page). The add form opens with Baseball chosen.
- tapOn: "Filter players"
- inputText: "zzzznotaplayer"
- assertVisible: "No players match that filter."
- tapOn: "All sports"
- tapOn: "Baseball"
- assertVisible: "Baseball"
# The counter blanks while the sport-scoped search re-runs and "Add player"
# slides ~110px (util-add-player-by-hand); the count coming back is the
# toolbar holding still.
- extendedWaitUntil:
    visible: "0 matches"
    timeout: 7000

# --- the b. 1851 row
- scrollUntilVisible:
    element:
      text: "Add player"
    centerElement: true
    timeout: 7000
# Retried once against its own result gate: the cross-runner moving target
# admin-players-same-name-birth-year documents (another runner's sport delete
# resizes the sport <select> between the read and the click).
- retry:
    maxRetries: 1
    commands:
      - tapOn: "Add player"
      - extendedWaitUntil:
          visible: "Add a player"
          timeout: 7000
- tapOn: "New player name"
- inputText: "Shuya Yamada"
- tapOn: "Birth year \\(optional\\)"
- inputText: "1851"
# `( anyway)?` for a deployment without the catalogue only: with nobody on
# file the primary reads "Create player Shuya Yamada". On a catalogue preview
# the catalogue's row is on file, so creation is the demoted "Create player
# Shuya Yamada anyway". Either way the server keys on the year: one undated
# rival forks, and the b. 1851 row already on file (a re-run) adopts.
- scrollUntilVisible:
    element:
      id: "Create player Shuya Yamada( anyway)?"
    timeout: 7000
- tapOn:
    id: "Create player Shuya Yamada( anyway)?"
# The filter row sits under the sticky app bar after a create's reveal, so it
# is brought back to the centre before the next step (positioning only).
- scrollUntilVisible:
    element:
      text: "Filter players"
    direction: UP
    centerElement: true
    timeout: 7000
# "Added" on a fresh deployment, "already exists" on a re-run (adopt). Either
# is a row on file; the hard proof is the list read below. A REFUSAL renders
# neither (it stays in the form's button row), so this fails by name if the
# server will not file him.
- extendedWaitUntil:
    visible: "(.*Added Shuya Yamada\\..*|That player already exists — opened it\\.)"
    timeout: 7000

# --- the b. 1851 row is on file. Past `SEARCH_MIN_CHARS` the list is a server
# search, so the row is read back from the database. Anchored `below:` the
# counter because the filter box's own value is the name. No count is
# asserted: `players.search` matches ANY token, so on the catalogue other
# Baseball "Yamada"s may answer and fill the page's 10-row search, which the
# counter prints as "10+ matches". Rows matching both tokens rank first, so
# the b. 1851 row is in that answer either way. That the name is AMBIGUOUS is
# proved where it matters, by the wizard's own intro in STEP 1.
- tapOn: "Filter players"
- eraseText: 20
- inputText: "Shuya Yamada"
- extendedWaitUntil:
    visible:
      text: ".*b. 1851.*"
      below:
        text: "[0-9,]+\\+? matches"
    timeout: 7000


# ============================================================
# SETUP — this flow's own real set, a live fetch, the wizard open
# The util navigates itself (its drill opens the set builder) and maps Base on
# both sides on the cold first drill.
# ============================================================

- runFlow:
    file: util-fetch-real-set-checklist-to-wizard.yaml
    env:
      SET: "Topps Chrome NPB"

# A red attempt leaves its review batch on this set, and the fetch above
# RESUMES it with its decisions. Read the decided count once and discard only
# when it is not 0. A script condition, so the normal path pays one read
# instead of util-discard-resumed-review-batch's 7s `notVisible` dwell, which
# would spend the window STEP 1 asserts. SET is passed so the util's own
# refetch drills THIS set (env is inherited by the nested runFlow). STEP 1
# then asserts "Step 1 of N" hard, so a resume this fails to clear still
# fails the flow. NEO-335 Phase 2's counter: x is the decided count plus one
# on a name step (and a resumed all-decided batch opens past the names, where
# x is larger still), so "nothing decided" is x === 1.
- copyTextFrom:
    text: "Step [0-9]+ of [0-9]+"
- evalScript: ${output.RESUMED = maestro.copiedText.split(" ")[1] !== "1"}
- runFlow:
    when:
      true: "${output.RESUMED}"
    file: util-discard-resumed-review-batch.yaml
    env:
      SET: "Topps Chrome NPB"

# ============================================================
# STEP 1 — R2(a) + R2(b): THE WIZARD OPENS ON THE PICK STEP, WITH NOTHING
# DECIDED, WHILE THE OTHER NAMES ARE STILL BEING LOOKED UP
#
# ONE hierarchy read proves the pick step and "nothing decided" at the same
# instant: the question, below a header that reads "Step 1 of <y>" (NEO-335
# Phase 2's counter; a full-match regex, so "Step 1 of" cannot match "Step 11
# of"). The header lost its "· N still being looked up" tail in NEO-335, so
# the third claim is the timing argument in the file header: this is the
# FIRST read after the wizard opens, inside a pending window of ≥2.5s, and a
# product that looked the same-name row up first would present no row while
# every name is pending — the body's "Looking up N more names…" — and this
# wait fails by name.
#
# <y> is never pinned: it GROWS while lookups land, because a settled
# player's Wikidata career teams are staged as New Team rows (CI run
# 38068520584 read the old total as 221 and 229 ten seconds apart on an
# otherwise identical screen).
# ============================================================

- extendedWaitUntil:
    visible:
      text: "Which Shuya Yamada is this\\?"
      below:
        text: "Step 1 of [0-9]+"
    timeout: 7000
# The rest of the opening step. The pick step holds its place whatever settles
# around it (NEO-339), so these five follow-up reads are not racing the batch.
- assertVisible:
    text: "We've got 2 on file under that name\\. Pick the one on this card\\."
- assertVisible:
    id: "Link to Shuya Yamada, b\\. 1851"
# The catalogue's man: his label carries what is on file about him (a career
# line, maybe "On a roster that year") but no birth year. Matched as "any
# Shuya Yamada link that is NOT a dated one", so it cannot be the b. 1851 row
# and does not pin catalogue data the flow does not own.
- assertVisible:
    id: "Link to Shuya Yamada, (?!b\\. ).+"
- assertVisible:
    id: "Create new"
- assertVisible:
    id: "Skip Shuya Yamada — not a person"
# NEO-335 Phase 2 — the pick step is its own screen type in the wizard's
# header: subtitle "Which player is this?" under "Tidy up this set". Header
# text, pinned, so it reads the same wherever the body sits.
- assertVisible: "Which player is this\\?"

# ============================================================
# R2(b2) — THE BATCH SETTLES AND THE PICK STEP IS STILL HERE
# (header: "WHY THE FLOW WAITS THE BATCH OUT AFTER STEP 1")
# ============================================================

# R5 marketplace-class exception: one live Wikidata round-trip per unknown
# name (20 NPB players, then the career teams they stage), the same 180s
# ceiling util-wizard-walk-to-player-row gives this wait. "N still looking up"
# is the wizard's own status line, absent exactly when no undecided row is
# pending; it returns the moment the queue drains (+44s measured, header).
- extendedWaitUntil:
    notVisible: ".*still looking up.*"
    timeout: 180000
# Still the untouched pick step, and still nothing decided: the header's
# counter is still "Step 1 of <y>" (NEO-335 Phase 2: x is the decided count
# plus one on a name step; a full match, so "Step 1 of" cannot match "Step 11
# of"). The negative above is paired with this positive, so it cannot pass on
# a closed dialog. Only x is ever pinned: <y> GROWS while the batch's lookups
# land (a settled player's career teams are staged as New Team rows; CI run
# 38068520584 saw the old total go 221 → 229 in ten seconds).
- assertVisible:
    text: "Which Shuya Yamada is this\\?"
    below:
      text: "Step 1 of [0-9]+"

# ============================================================
# STEP 2 — R2(c): CREATE NEW OPENS THE NEW PLAYER STEP, WITHOUT THE LIST
# ============================================================

- tapOn:
    id: "Create new"
# The footer's primary slot is the same element, relabelled.
- extendedWaitUntil:
    visible:
      id: "Add as New Player"
    timeout: 7000
- assertVisible:
    text: "Back to the list"
# The heading's sr-only prefix: the h3 itself reads the bare name, and this is
# what tells a screen reader which step "Create new" landed on.
- assertVisible:
    text: "New Player: ?"
- assertNotVisible:
    text: "Which Shuya Yamada is this\\?"
- assertNotVisible:
    id: "Link to Shuya Yamada, .+"
# …and the header says which screen type this is now: a New Player step.
- assertVisible: "New player"

# ============================================================
# STEP 3 — R2(d): BACK TO THE LIST DECIDES NOTHING
# ============================================================

- tapOn:
    text: "Back to the list"
- extendedWaitUntil:
    visible:
      text: "Which Shuya Yamada is this\\?"
    timeout: 7000
- assertVisible:
    id: "Link to Shuya Yamada, b\\. 1851"
- assertVisible:
    id: "Link to Shuya Yamada, (?!b\\. ).+"
# The footer's live region says where the operator is (a11y S3).
- assertVisible:
    text: "Back at the list\\. 2 on file\\."
# Nothing was recorded: still 0 decided, so still "Step 1". Full-match regex,
# so "Step 1 of" cannot match "Step 11 of".
- assertVisible:
    text: "Step 1 of [0-9]+"

# ============================================================
# STEP 4 — R2(e): TAKE ONE, AND THE READ-BACK SAYS WHICH
# ============================================================

- tapOn:
    id: "Link to Shuya Yamada, b\\. 1851"
# Exactly one decision: the link.
- extendedWaitUntil:
    visible:
      text: "Step 2 of [0-9]+"
    timeout: 7000
- assertNotVisible:
    text: "Which Shuya Yamada is this\\?"

# The read-back. Not the Decided list: it is the last thing in the dialog
# body, under whatever step comes next, and a tall step pushes it out of the
# reported hierarchy (README: "Asserting inside a dialog"). The link handed
# control back to the walk, which presents the next settled row (leagues →
# teams → players; with every lookup landed there is one, header). Its footer
# carries "Back to previous decision" (the most recent decision this session
# made, i.e. the link). It reopens Shuya Yamada read-only, and that panel's
# accessible name is the row's: `Decision for Shuya Yamada`. On a decided
# same-name row the panel sits directly under the heading (the lookup's own
# lines are hidden there), so it is on screen.
- tapOn:
    id: "Back to previous decision"
- extendedWaitUntil:
    visible:
      text: "Linked to Shuya Yamada, b\\. 1851"
      childOf:
        id: "Decision for Shuya Yamada"
    timeout: 7000

# ============================================================
# STEP 5 — EXIT WITHOUT WRITING ANYTHING (R7)
# ============================================================

- tapOn:
    text: "Cancel (Esc)"
    retryTapIfNoChange: true
- assertVisible:
    text: "Discard [0-9]+ decisions?.*"
- tapOn:
    text: "Discard"
- extendedWaitUntil:
    visible: "Fetch cancelled — no cards saved."
    timeout: 7000

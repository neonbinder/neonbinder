appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/admin/players&worker=${WORKER_INDEX || "0"}
name: "Entity review — a checklist name two players on file share asks which one it is, and Create new is a step you can back out of"
tags:
  - set-selector
---
# R1 — ONE FEATURE (NEO-332): the entity-review wizard's PICK STEP. When two
# or more players on file share a checklist name, the wizard does not offer
# "Add as New Player" first; it asks "Which <name> is this?" and lists the
# players we hold, each told apart by what is on file (here, a birth year).
# "Create new" opens the New Player step, "Back to the list" returns without
# deciding anything, and taking a candidate records a link to THAT player.
#
# R2 — HARD ASSERTIONS, every one unhedged:
#     (a) the review starts with nothing decided — "0 of N reviewed";
#     (b) the wizard OPENS on the pick step while the other names are still
#         being looked up — the same-name row arrives ready, with no lookup of
#         its own. The question, "0 of N reviewed" and the header's
#         "· N still being looked up" are read in ONE hierarchy read, as the
#         first step after the wizard opens (STEP 1); then the intro that
#         counts the players on file ("3 on file"), one `Link to Shuya Yamada,
#         b. <year>` per fork, `Create new` and the row's own Skip;
#     (c) Create new shows the New Player step and NOT the list: `Add as New
#         Player`, `Back to the list`, the heading's sr-only "New Player: "
#         prefix, and neither the question nor either fork on screen;
#     (d) Back to the list returns to the same list with nothing decided: the
#         question and both forks are back, the footer says "Back at the list.
#         3 on file.", and the decided count has not moved;
#     (e) taking the b. 1852 fork records exactly one decision (the decided
#         count moves from K to K+1, the question is gone) and its read-back
#         names WHICH man — "Linked to Shuya Yamada, b. 1852" — in the row's
#         own `Decision for Shuya Yamada` panel. Neither a create ("Added as
#         new"), a skip ("Skipped") nor a link to the 1851 fork or the
#         catalogue's Shuya Yamada can produce it.
#
# NOT DRIVEN HERE: Escape from the New Player step back to the list.
#   maestro-web's `pressKey` supports Enter only, so it is left to the
#   wizard's unit tests. The CardChecklist banner's "· N to pick from the
#   roster" tail is unit-tested beside CardChecklist for the same reason as
#   the rest of the banner: it renders before the wizard and asserting it
#   would be a second feature (R1).
#
# ── THE FIXTURE ─────────────────────────────────────────────────────────────
#   `Baseball → 2024 → Topps → Topps Chrome NPB → Base`, owned by this flow
#   alone (SET-REGISTRY.md → "Topps Chrome NPB"). Card #1 is Shuya Yamada RC,
#   Hanshin Tigers.
#
#   The flow makes the ambiguity itself, through the product: two Baseball
#   players named "Shuya Yamada" on /admin/players, born 1851 and 1852 (the
#   form's floor is 1850). Neither has a career stint, so card-year narrowing
#   (`narrowSameNamePlayersByCardYear`) can never pick one of them.
#
#   THREE ON FILE, NOT TWO. The NEO-330 reference catalogue (a prod snapshot)
#   already holds a Shuya Yamada: Hanshin Tigers from 2026, no birth year.
#   His span covers a 2024 card within the ±2-year tolerance, so he survives
#   the narrowing, but his one stint starts after 2024, so the card's team
#   cannot pick him outright either. The step therefore lists three. If a
#   catalogue refresh moves that stint to 2024 or earlier, the narrowing picks
#   him and STEP 1 fails by name (no pick step) — re-measure, do not hedge.
#
#   ⚠️ THE NAME IS A REAL, TWO-TOKEN CHECKLIST NAME, NOT A MINTED ONE. That is
#   the exception to "minted names are single tokens", and it is safe only
#   because no other flow fetches a checklist carrying it and this flow never
#   asserts a search COUNT (other "Yamada" rows may share a token). The
#   registry entry says so.
#
#   Re-runs are idempotent. On a deployment that already holds both forks
#   (a retry, a local re-run) each create ADOPTS — a birth year exactly one
#   row carries is an adopt — so the create button and its result line are
#   matched for either outcome, and what is asserted hard is the state after:
#   both rows on file, b. 1851 and b. 1852.
#
# ── WHY STEP 1 IS A TIMING CLAIM THAT HOLDS (Jason, 2026-10-11: keep it) ────
#   On the catalogue-loaded preview this set stages 21 player rows: Shuya
#   Yamada, inserted READY, and 20 NPB names the catalogue does not hold, each
#   behind a live Wikidata lookup (none is in the enrichment recording). The
#   lookups run in the deployment's one 5-wide pool, and one live lookup of a
#   name Wikidata knows takes ~4-5s Convex-side: CI run 38073638557 had the
#   pool to itself for this set and started 21 NPB lookups in 21s. So the
#   20 settle over ~4 rounds, ≥ ~16s, and every career team they stage (5 on
#   2026-10-11: three for Adam Walker, two for Leandro Cedeno) is looked up
#   after that. The header reads "· N still being looked up" for that whole
#   time. Other flows' lookups share the pool on CI and only lengthen it.
#   STEP 1's read lands within ~1s of the batch starting: in that run the
#   wizard's title painted 0.6s BEFORE the first NPB lookup started.
#   That is why STEP 1 is the first read after the wizard opens, and why the
#   resumed-batch guard before it is a single copyTextFrom rather than
#   util-discard-resumed-review-batch's 7s `notVisible` dwell.
#
# ── WHY THE FLOW WALKS AFTER STEP 1 ─────────────────────────────────────────
#   An UNTOUCHED pick step is the walk's own choice, and it yields to the
#   first settled team or league (`resolveNav`, teams first, NEO-236). "Create
#   new" pins it (an edit); "Back to the list" unpins it. The career teams
#   above settle ~17-25s after the batch starts, which is inside the window
#   STEPS 2-4 need, so asserting them straight after STEP 1 would be a race.
#   util-wizard-walk-to-player-row removes it: it waits the batch out (its
#   sanctioned live-Wikidata wait), answers every team and league step as a
#   SKIP, and stops on the first player row, which is Shuya Yamada's pick
#   step because rows are inserted in card order and he is card #1. After
#   that nothing is left to look up that could stage a team: his own lookup,
#   started by Create new, finds no career team on Wikidata (2026-10-11).
#   The walk's skips are K decisions, so every count after it is read
#   relative to K.
#
# R3 — DEDUP: `admin/admin-players-same-name-birth-year` owns the fork itself
#   (bounds, adopt vs fork) and is the reason this flow can make two people of
#   one name; it never opens the wizard. `checklist-wizard-link-to-existing-
#   player` owns "Link to Existing…" search; nothing here searches.
#
# R4 — the entry URL is the whole sign-in; no in-body login.
#
# R5 — every in-app step is 7000. The long waits are the utils' own sanctioned
#   ones and nothing else: the live BSC + SportLots fetch and the cold Base
#   mapping (util-fetch-real-set-checklist-to-wizard / util-drill-to-base-
#   variant), the post-launch sign-in gate (45s), and the walk util's
#   live-Wikidata wait. "Back to the list" is immediate whatever Shuya
#   Yamada's own lookup is doing.
#
# R7 / R7a — READ-ONLY on the set: the flow leaves through Cancel → Discard,
#   commits nothing, and creates nothing from the wizard (the walk's skips
#   are discarded with the rest). It provisions the set's structure on its
#   first drill and writes two GLOBAL `players` rows that nothing deletes
#   (registry entry).
#
# R9 — drilled through util-fetch-real-set-checklist-to-wizard with a SET
#   override; no hand-rolled drill.
#
# R10 — one conditional of this flow's own, the resumed-batch guard before
#   STEP 1, and it is a script condition (`when: true`) costing no hierarchy
#   wait. The walk util's own documented dwells are its own.

- launchApp
# The list COUNTER, not the heading: the heading paints before the list query
# answers (admin-players-same-name-birth-year).
- extendedWaitUntil:
    visible: ".*of .* players.*"
    timeout: 45000

# ============================================================
# FIXTURE — two Baseball players named Shuya Yamada, b. 1851 and b. 1852
# The steps are admin-players-same-name-birth-year's, whose header explains
# each geometry note; only what differs is commented here.
# ============================================================

# Empty the list so "Baseball" belongs to the sport picker alone, and pick the
# sport with the add form CLOSED (a native option tap resolves against the
# FIRST <select> on the page). The add form opens with Baseball chosen.
- tapOn: "Filter players"
- inputText: "zzzznotaplayer"
- assertVisible: "No players match that filter."
- tapOn: "All sports"
- tapOn: "Baseball"
- assertVisible: "Baseball"
# The counter blanks while the sport-scoped search re-runs and "Add player"
# slides ~110px (util-add-player-by-hand); the count coming back is the
# toolbar holding still.
- extendedWaitUntil:
    visible: "0 matches"
    timeout: 7000

# --- the first fork, b. 1851
- scrollUntilVisible:
    element:
      text: "Add player"
    centerElement: true
    timeout: 7000
# Retried once against its own result gate: the cross-runner moving target
# admin-players-same-name-birth-year documents (another runner's sport delete
# resizes the sport <select> between the read and the click).
- retry:
    maxRetries: 1
    commands:
      - tapOn: "Add player"
      - extendedWaitUntil:
          visible: "Add a player"
          timeout: 7000
- tapOn: "New player name"
- inputText: "Shuya Yamada"
- tapOn: "Birth year \\(optional\\)"
- inputText: "1851"
# `( anyway)?` for a re-run only: with nobody on file the primary reads
# "Create player Shuya Yamada"; once rows exist creation is demoted to
# "Create player Shuya Yamada anyway". Either way the server keys on the year.
- scrollUntilVisible:
    element:
      id: "Create player Shuya Yamada( anyway)?"
    timeout: 7000
- tapOn:
    id: "Create player Shuya Yamada( anyway)?"
# The filter row sits under the sticky app bar after a create's reveal, so it
# is brought back to the centre before the next step (positioning only).
- scrollUntilVisible:
    element:
      text: "Filter players"
    direction: UP
    centerElement: true
    timeout: 7000
# "Added" on a fresh deployment, "already exists" on a re-run (adopt). Either
# is a row on file; the hard proof that BOTH forks exist is the list read below.
- extendedWaitUntil:
    visible: "(.*Added Shuya Yamada\\..*|That player already exists — opened it\\.)"
    timeout: 7000

# --- the second fork, b. 1852. A row exists now, so creation is ALWAYS the
# demoted "anyway" control here: matched hard.
- scrollUntilVisible:
    element:
      text: "Add player"
    centerElement: true
    timeout: 7000
- retry:
    maxRetries: 1
    commands:
      - tapOn: "Add player"
      - extendedWaitUntil:
          visible: "Add a player"
          timeout: 7000
- tapOn: "New player name"
- inputText: "Shuya Yamada"
- tapOn: "Birth year \\(optional\\)"
- inputText: "1852"
- scrollUntilVisible:
    element:
      id: "Create player Shuya Yamada anyway"
    timeout: 7000
- tapOn:
    id: "Create player Shuya Yamada anyway"
- scrollUntilVisible:
    element:
      text: "Filter players"
    direction: UP
    centerElement: true
    timeout: 7000
- extendedWaitUntil:
    visible: "(.*Added Shuya Yamada\\..*|That player already exists — opened it\\.)"
    timeout: 7000

# --- both forks are on file. Past `SEARCH_MIN_CHARS` the list is a server
# search, so these rows are read back from the database. Anchored `below:`
# the counter because the filter box's own value is the name. No count is
# asserted: `players.search` matches tokens, and another "Yamada" may answer.
- tapOn: "Filter players"
- eraseText: 20
- inputText: "Shuya Yamada"
- extendedWaitUntil:
    visible:
      text: ".*b. 1851.*"
      below:
        text: "[0-9]+ matches"
    timeout: 7000
- assertVisible:
    text: ".*b. 1852.*"
    below:
      text: "[0-9]+ matches"


# ============================================================
# SETUP — this flow's own real set, a live fetch, the wizard open
# The util navigates itself (its drill opens the set builder) and maps Base on
# both sides on the cold first drill.
# ============================================================

- runFlow:
    file: util-fetch-real-set-checklist-to-wizard.yaml
    env:
      SET: "Topps Chrome NPB"

# A red attempt leaves its review batch on this set, and the fetch above
# RESUMES it with its decisions. Read the decided count once and discard only
# when it is not 0. A script condition, so the normal path pays one read
# instead of util-discard-resumed-review-batch's 7s `notVisible` dwell, which
# would spend the window STEP 1 asserts. SET is passed so the util's own
# refetch drills THIS set (env is inherited by the nested runFlow). STEP 1
# then asserts "0 of N reviewed" hard, so a resume this fails to clear still
# fails the flow.
- copyTextFrom:
    text: "[0-9]+ of [0-9]+ reviewed.*"
- evalScript: ${output.RESUMED = maestro.copiedText.split(" of ")[0] !== "0"}
- runFlow:
    when:
      true: "${output.RESUMED}"
    file: util-discard-resumed-review-batch.yaml
    env:
      SET: "Topps Chrome NPB"

# ============================================================
# STEP 1 — R2(a) + R2(b): THE WIZARD OPENS ON THE PICK STEP, WITH NOTHING
# DECIDED, WHILE THE OTHER NAMES ARE STILL BEING LOOKED UP
#
# ONE hierarchy read proves all three at the same instant: the question,
# below a header that reads "0 of <total> reviewed · <N> still being looked
# up" (a full-match regex, so "0 of" cannot match "10 of" and the tail must be
# there). A product that looked the same-name row up first would present no
# row while every name is pending — the body's "Looking up N more names…" —
# and this wait fails by name. See the header for why the window is ≥ ~16s
# against a read ~1s after the batch starts.
#
# <total> is never pinned: it GROWS while lookups land, because a settled
# player's Wikidata career teams are staged as New Team rows (CI run
# 38068520584 read "0 of 221" and "0 of 229" ten seconds apart on an otherwise
# identical screen).
# ============================================================

- extendedWaitUntil:
    visible:
      text: "Which Shuya Yamada is this\\?"
      below:
        text: "0 of [0-9]+ reviewed · [0-9]+ still being looked up"
    timeout: 7000
# The rest of the opening step. The step holds for as long as no team or
# league has settled (≥ ~16s, see the header), so these follow-up reads
# (~0.33s each) are not racing anything.
- assertVisible:
    text: "We've got 3 on file under that name\\. Pick the one on this card\\."
- assertVisible:
    id: "Link to Shuya Yamada, b\\. 1851"
- assertVisible:
    id: "Link to Shuya Yamada, b\\. 1852"
- assertVisible:
    id: "Create new"
- assertVisible:
    id: "Skip Shuya Yamada — not a person"

# ============================================================
# THE WALK — wait the batch out and answer its team steps, so the pick step
# holds still for STEPS 2-4 (header: "WHY THE FLOW WALKS AFTER STEP 1")
# ============================================================

- runFlow:
    file: util-wizard-walk-to-player-row.yaml
# The util stops on the first PLAYER row; it must be this one, untouched.
- extendedWaitUntil:
    visible:
      text: "Which Shuya Yamada is this\\?"
    timeout: 7000
# K = the walk's skips (0 when no career team was staged). Every later count
# is read against it. Nothing is pending now, so the header is exactly
# "<K> of <total> reviewed".
- copyTextFrom:
    text: "[0-9]+ of [0-9]+ reviewed.*"
- evalScript: ${output.DECIDED = parseInt(maestro.copiedText.split(" of ")[0], 10)}
- evalScript: ${output.DECIDED_AFTER_LINK = output.DECIDED + 1}

# ============================================================
# STEP 2 — R2(c): CREATE NEW OPENS THE NEW PLAYER STEP, WITHOUT THE LIST
# ============================================================

- tapOn:
    id: "Create new"
# The footer's primary slot is the same element, relabelled.
- extendedWaitUntil:
    visible:
      id: "Add as New Player"
    timeout: 7000
- assertVisible:
    text: "Back to the list"
# The heading's sr-only prefix: the h3 itself reads the bare name, and this is
# what tells a screen reader which step "Create new" landed on.
- assertVisible:
    text: "New Player: ?"
- assertNotVisible:
    text: "Which Shuya Yamada is this\\?"
- assertNotVisible:
    id: "Link to Shuya Yamada, b\\. 185[12]"

# ============================================================
# STEP 3 — R2(d): BACK TO THE LIST DECIDES NOTHING
# ============================================================

- tapOn:
    text: "Back to the list"
- extendedWaitUntil:
    visible:
      text: "Which Shuya Yamada is this\\?"
    timeout: 7000
- assertVisible:
    id: "Link to Shuya Yamada, b\\. 1851"
- assertVisible:
    id: "Link to Shuya Yamada, b\\. 1852"
# The footer's live region says where the operator is (a11y S3).
- assertVisible:
    text: "Back at the list\\. 3 on file\\."
# Nothing was recorded: still K decided. Full-match regex, and Create new
# started Shuya Yamada's own lookup, so the header may carry a tail.
- assertVisible:
    text: "${output.DECIDED} of [0-9]+ reviewed.*"

# ============================================================
# STEP 4 — R2(e): TAKE ONE, AND THE READ-BACK SAYS WHICH
# ============================================================

- tapOn:
    id: "Link to Shuya Yamada, b\\. 1852"
# Exactly one decision: the link.
- extendedWaitUntil:
    visible:
      text: "${output.DECIDED_AFTER_LINK} of [0-9]+ reviewed.*"
    timeout: 7000
- assertNotVisible:
    text: "Which Shuya Yamada is this\\?"

# The read-back. Not the Decided list: it folds past five, and the walk's
# skips usually put it there. The link moved the walk on to the next player,
# whose footer carries "Back to previous decision" (the most recent decision
# this session made, i.e. the link). It reopens Shuya Yamada read-only, and
# that panel's accessible name is the row's: `Decision for Shuya Yamada`. On a
# decided same-name row the panel sits directly under the heading (the
# lookup's own lines are hidden there), so it is on screen.
- tapOn:
    id: "Back to previous decision"
- extendedWaitUntil:
    visible:
      text: "Linked to Shuya Yamada, b\\. 1852"
      childOf:
        id: "Decision for Shuya Yamada"
    timeout: 7000

# ============================================================
# STEP 5 — EXIT WITHOUT WRITING ANYTHING (R7)
# ============================================================

- tapOn:
    text: "Cancel (Esc)"
    retryTapIfNoChange: true
- assertVisible:
    text: "Discard [0-9]+ decisions?.*"
- tapOn:
    text: "Discard"
- extendedWaitUntil:
    visible: "Fetch cancelled — no cards saved."
    timeout: 7000

appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Entity review — Skip marks a name as not a person, mints nothing, and the set keeps a Skipped names list the operator can undo"
tags:
  - set-selector
  - regression
---
# R1 — ONE FEATURE (NEO-212 + NEO-221): the THIRD way out of an unknown name.
# "Checklist", "Team Card" and subset headers land in the player column of a
# real marketplace checklist constantly, and before this the operator's only
# options were to mint a junk player row or cancel the whole batch. Skip records
# the name as "not a person", creates NOTHING, and the set remembers it — the
# name is not offered again on the next sync, and the "Skipped names" list is
# where that memory is visible and reversible.
#
# R2 — HARD ASSERTIONS, no silent fall-through:
#     (a) the review starts with nothing decided — "0 of N reviewed";
#     (b) the per-row control is bound to a REAL row (matched by its accessible
#         name, which composes the row's own name) AND says what it does
#         ("Skip — not a person"). Two different claims, deliberately, and
#         neither is a duplicate of the other;
#     (c) one tap records exactly ONE decision — "1 of N reviewed" with a
#         "Decided (1)" history. A control that rendered but wrote nothing
#         leaves the header at "0 of N";
#     (d) "Skip Remaining" decides every row that is left, INCLUDING ones whose
#         Wikidata lookup has not come back — "Confirm & Save" renders only once
#         every row carries a decision, so its appearance IS that assertion;
#     (e) the commit lands ("Saved N cards") having created no player and no
#         team, and the set now carries a "Skipped names (N)" list;
#     (f) Unskip puts a name back — the status line says so in the product's own
#         words, which is the operator-visible half of "this is reversible".
#
# WHY THE LIST MATTERS AS MUCH AS THE SKIP. A skip that could not be seen or
# undone would be an invisible, permanent edit made from a modal — the one
# shape the product's own "review sessions cannot be lost by accident" rule
# exists to prevent. So the panel is part of the feature, not a follow-up.
#
# R7 — THIS FLOW MINTS NO PLAYER, by construction rather than by care: every
#   name is SKIPPED, and a skip is precisely the decision that writes no entity.
#   `players` is GLOBAL and empty at the head of every run, so a name added here
#   would stop being unknown for every worker that fetches the same SportLots
#   set afterwards and would silently shrink their wizards. The cards ARE
#   committed — they land on this flow's own private, per-attempt set — and the
#   skip records are scoped to that set's id, so nothing here is observable to
#   any other flow.
#
# R3 — DEDUP: Back is checklist-wizard-back-to-matching-resumes-decisions, Link
#   is checklist-wizard-link-to-existing-player, the career-team mini-form is
#   checklist-wizard-career-team-entry, and the discard confirm is STEP 6a of
#   inserts-1996-score-one-nb-set-two-bsc-sources.yaml. Only this flow skips.
#
# R7a — writes go to a PRIVATE set. `skp-<worker>-<attempt>` is hand-typed under
#   the real Baseball / 2024 / Topps ancestors; no shared row is touched. Per
#   ATTEMPT as well as per worker, because this flow COMMITS: a retry must not
#   find the previous attempt's cards, skips and attached SportLots id already
#   on the set. Registered in .maestro/SET-REGISTRY.md.

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# SETUP — a private set, one real SportLots source, wizard open
# ============================================================

- runFlow:
    file: util-attach-sl-set-and-open-wizard.yaml
    env:
      SET_NAME: "skp-${WORKER_INDEX || 0}-${ATTEMPT_ID}"

# ============================================================
# STEP 1 — R2(a): the review starts with nothing decided
# ============================================================

- assertVisible:
    text: "0 of [0-9]+ reviewed.*"

# ============================================================
# STEP 2 — R2(b): the skip control, said both ways
#
# The accessible name composes the CURRENT ROW's own name
# ("Skip {name} — not a {person|team}"), so matching it proves the control on
# screen belongs to a real queued row rather than being static chrome. The
# visible text is a separate claim: that what the operator READS says what the
# control does. The em dash is matched with "." to keep a literal non-ASCII
# character out of the matcher.
#
# 30s, not the 7s default: the row offers no action until its background
# Wikidata lookup — a live external round-trip — has come back or errored.
#
# WHICH row is on screen is deliberately not asserted; the wizard presents the
# first row whose lookup settles, and hundreds race.
# ============================================================

- extendedWaitUntil:
    visible:
      id: "Skip .* not a (person|team)"
    timeout: 30000
- assertVisible:
    text: "Skip . not a (person|team)"

# ============================================================
# STEP 3 — R2(c): one tap, exactly one decision
# ============================================================

- tapOn:
    id: "Skip .* not a (person|team)"
- extendedWaitUntil:
    visible:
      text: "1 of [0-9]+ reviewed.*"
- assertVisible:
    text: "Decided \\(1\\)"

# ============================================================
# STEP 4 — R2(d): "Skip Remaining" clears the rest, lookups included
#
# The bulk skip cancels any armed auto-add and decides every remaining row
# whether or not its lookup has settled. "Confirm & Save" renders only when
# EVERY row carries a decision, so waiting for it is the assertion that the bulk
# really covered the rest. 120s: the ceiling covers a batch still draining its
# live Wikidata queue, and resolves the moment the wizard is done.
# ============================================================

- tapOn:
    text: ".*Skip Remaining \\([0-9]+\\).*"
- extendedWaitUntil:
    visible:
      text: ".*Confirm & Save.*"
    timeout: 120000

# ============================================================
# STEP 5 — R2(e): commit, and the set remembers what was skipped
#
# The positive terminal signal proves the wizard closed AND the commit landed;
# waiting on the modal vanishing would race the "Saving..." state (NEO-163).
# ============================================================

- tapOn:
    text: ".*Confirm & Save.*"
# 60s, not the 7s default: `commitCardChecklist` writes every kept card and
# re-resolves the batch's decisions on the way through. It is the one non-
# marketplace step here with a real server cost. MEASURE IT on the first green
# run and trim — a ceiling nobody has measured is how 240s waits get written.
- extendedWaitUntil:
    visible:
      text: ".*Saved [0-9]+ cards.*"
    timeout: 60000

# The panel renders above the checklist and only exists because this set now has
# skip records — it returns null with none. The count is left as a regex: how
# many names the source set surfaces is the marketplace's business, and pinning
# it would make this flow fail on a data change it does not test.
- scrollUntilVisible:
    element:
      id: "Skipped names \\([0-9]+\\) . not players or teams"
    centerElement: true
    timeout: 15000
- tapOn:
    id: "Skipped names \\([0-9]+\\) . not players or teams"
- assertVisible:
    text: ".*Unskip a name to review it on the next sync.*"

# ============================================================
# STEP 6 — R2(f): the skip is reversible, and the product says so
#
# Unskip removes the record and announces the consequence in its own words. That
# sentence is the whole user-facing contract of the list: the name comes back at
# the next sync rather than being gone for good.
# ============================================================

- scrollUntilVisible:
    element:
      id: "Unskip .*"
    centerElement: true
    timeout: 10000
- tapOn:
    id: "Unskip .*"
- extendedWaitUntil:
    visible:
      text: "Unskipped .* it will be reviewed on the next sync."

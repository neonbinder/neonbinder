appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Entity review — Skip marks a name as not a person, and the footer skip decides every row that is left, lookups included"
tags:
  - set-selector
---
# R1 — ONE FEATURE (NEO-212): the THIRD way out of an unknown name. "Checklist",
# "Team Card" and subset headers land in the player column of a real marketplace
# checklist constantly, and before this the operator's only options were to mint
# a junk player row or cancel the whole batch. Skip records the name as "not a
# person" and creates NOTHING.
#
# R2 — HARD ASSERTIONS, no silent fall-through:
#     (a) the review starts with nothing decided — "0 of N reviewed";
#     (b) the per-row control is bound to a REAL queued row (its accessible name
#         composes the row's own name) AND says what it does ("Skip — not a
#         person"). Two different claims; neither is a duplicate of the other;
#     (c) one tap records exactly ONE decision — the header's "K of N
#         reviewed" moves by exactly one (K is wherever the walk left it). A
#         control that rendered but wrote nothing leaves it where it was;
#     (d) "Skip remaining names" decides every row that is left, INCLUDING ones whose
#         Wikidata lookup has not come back. "Confirm & Save" renders only once
#         EVERY row carries a decision (`allDecided`), so its appearance IS that
#         assertion — and the bulk links unmount at the same moment, which is
#         the same fact read the other way round. The all-decided summary then
#         lists skips and no create or link, so the per-row decision in (c)
#         was a skip too.
#
# ── WHAT THIS FLOW DOES NOT COVER, AND WHO DOES ─────────────────────────────
#   The "Skipped names" panel and its Unskip live behind a COMMIT: skip records
#   are written by `commitCardChecklist`, not by `recordDecision`. This flow
#   cannot commit (R7), so that half belongs to its committing sibling,
#   `checklist-wizard-skip-commits-and-unskip`, on its own set, and to the unit
#   files (`entityReviewSkips`, `SkippedNamesPanel.test.tsx`).
#
# ── THE FIXTURE (NEO-330) ───────────────────────────────────────────────────
#   `Hockey → 1995 → Unknown (via the All Brands view) → Fort Worth Fire CHL →
#   Base`, BSC only, through `util-fetch-one-marketplace-set-checklist-to-wizard`.
#   Approved by Jason 2026-10-10, moving this flow off the shared Topps Big
#   League set: with the reference catalogue loaded, Big League stages so few
#   names that nothing was left for the footer skip after the per-row one (CI
#   run 38063558063 failed on the `Skip remaining names` tap). MEASURED on PR #314's preview, 2026-10-10: 18 cards, "Kept all 18
#   cards from BSC" → **16 unknown names, all players, 0 teams**, still 16
#   once every Wikidata lookup had settled. The flow needs one player row to
#   skip and at least one more for the footer skip (STEP 5's confirm is
#   plural); it has sixteen.
#
# R7 — READ-ONLY, AND THAT IS LOAD-BEARING. This flow is the set's SOLE
#   READER (SET-REGISTRY.md) and exits through Cancel → Discard (`cancelBatch`),
#   which saves no card, writes no skip record and mints no player or team.
#   A commit would write this set's cards and skip records, so the next fetch
#   would be a re-sync rather than a first fetch — a different code path with
#   no unknowns, i.e. this flow's next attempt on the same preview would have
#   nothing to skip. Nothing else touches the set, so there is no sibling
#   whose leftover batch this flow could resume; the shared-set guard the Big
#   League readers run (`util-discard-resumed-review-batch`) has nothing to
#   guard here and would only add its dead 7s poll (R10).
#
# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# SETUP — real set, real fetch, wizard open
# BSC only: the util cancels the base picker, so the fetch keeps every card
# ("Kept all N cards from BSC") and opens the review with nothing to pair.
# ============================================================

- runFlow:
    file: util-fetch-one-marketplace-set-checklist-to-wizard.yaml
    env:
      SET: "Fort Worth Fire CHL"

# ============================================================
# STEP 1 — R2(a)
# ============================================================

- assertVisible:
    text: "0 of [0-9]+ reviewed.*"

# ============================================================
# STEP 2 — R2(b): the skip control, said both ways
#
# The accessible name composes the CURRENT ROW's own name, so matching it
# proves the control belongs to a real queued row rather than being static
# chrome. The visible text is a separate claim: that what the operator READS
# says what the control does. The em dash is matched with "." to keep a literal
# non-ASCII character out of the matcher.
#
# 30s: the row offers no action until its live Wikidata lookup settles.
# ============================================================

# ⚠️ SETTLE THE ROW BEFORE TAPPING THE SKIP LINK. `Skip — not a person` is a
# 16px `text-xs` link that sits DIRECTLY above the footer: measured in CI run
# 34050688656 its bounds were [313,536][434,552] while the footer's own controls
# started at y=551. Maestro reads bounds and clicks ~330ms later, so any content
# landing in the row inside that window (a Wikidata lookup, a near-match panel)
# pushes the link down and the click lands on the footer instead — on
# "Add All Remaining as New", which decides EVERY row. That is what happened:
# one tap produced "11 of 11 reviewed" with all eleven marked "Added as new".
#
# Waiting for the row's stable PRIMARY control first is the fix: it renders only
# once the lookup has come back, so the row has its final height before the tap.
# 30s, because that wait is a live external round-trip.
# NEO-236 — the wizard does not open on a player row, and the first player it
# shows can move out from under you while its career teams are staged. The util
# walks to a settled player row the operator's way (see its header for the two
# behaviours and the evidence). Every row it answers is a SKIP, so every
# decision in this batch is one — which is what STEP 4's summary reads back.
# (NEO-330: it used to answer them as CREATEs so that a "Skipped" in the
# Decided list could only be this flow's own; that list is in the dialog's
# scrolling BODY, below a tall Wikidata row on this fixture, and off screen —
# README → "Asserting inside a dialog: header and footer only".)
- runFlow: util-wizard-walk-to-player-row.yaml
- extendedWaitUntil:
    visible:
      id: "Skip .* not a (person|team)"
    timeout: 30000
- assertVisible:
    text: "Skip . not a (person|team)"

# ============================================================
# STEP 3 — R2(c): one tap, exactly one decision
# ============================================================

# The HEADER is the counter (README → "Asserting inside a dialog: header and
# footer only"): `N of M reviewed` counts the same rows as the body's Decided
# list, and it is pinned on screen. The walk may already have answered staged
# team steps, so read where it left the count and require exactly one more.
- copyTextFrom:
    text: "[0-9]+ of [0-9]+ reviewed.*"
- evalScript: '${output.DECIDED_BEFORE = Number(maestro.copiedText.match(/^([0-9]+) of ([0-9]+)/)[1])}'
- evalScript: '${output.TOTAL = maestro.copiedText.match(/^([0-9]+) of ([0-9]+)/)[2]}'
- tapOn:
    id: "Skip .* not a (person|team)"
# Exactly ONE decision: the count moved by one and the total did not move.
# A control that rendered but wrote nothing leaves the count where it was.
# Our own mutation answering — 7000 (R5).
- extendedWaitUntil:
    visible:
      text: "${output.DECIDED_BEFORE + 1} of ${output.TOTAL} reviewed.*"
    timeout: 7000

# ============================================================
# STEP 4 — R2(d): "Skip remaining names" clears the rest, lookups included
#
# The bulk skip cancels any armed auto-add and decides every remaining row
# whether or not its lookup has settled. 120s: the ceiling covers a batch still
# draining its live Wikidata queue and resolves the moment the wizard is done.
# ============================================================

- tapOn:
    text: ".*Skip remaining names \\([0-9]+\\).*"
- extendedWaitUntil:
    visible:
      text: ".*Confirm & Save.*"
    timeout: 120000
# The same fact read the other way round: the bulk links render only while a
# row is still undecided, so their absence is `allDecided` confirming itself.
- assertNotVisible:
    text: ".*Skip remaining names \\([0-9]+\\).*"
# ...and every decision is a SKIP, the per-row one included. The all-decided
# summary sits at the TOP of the body and lists only non-zero outcomes
# (`summaryRows`; "Cards to save" always): "Skipped as not a name" present,
# "New players and teams" and "Linked to existing" absent means no row was
# created or linked. With STEP 3's "exactly one decision", the per-row tap's
# decision was a skip.
- assertVisible:
    text: "Skipped as not a name"
- assertNotVisible:
    text: "New players and teams"
- assertNotVisible:
    text: "Linked to existing"

# ============================================================
# STEP 5 — EXIT WITHOUT WRITING ANYTHING (R7)
#
# Every row is decided now, so the confirm names them all. The count is a
# regex and plural: it is the fixture's unknown total (16 when measured), which
# is the marketplace's business, not this flow's claim.
# ============================================================

- tapOn:
    text: "Cancel (Esc)"
    retryTapIfNoChange: true
- assertVisible:
    text: "Discard [0-9]+ decisions.*"
- tapOn:
    text: "Discard"
- extendedWaitUntil:
    visible: "Fetch cancelled — no cards saved."

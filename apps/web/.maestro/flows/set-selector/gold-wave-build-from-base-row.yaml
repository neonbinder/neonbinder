appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "2024 Topps Chrome Parallel — a base parallel's row builds from Base with no dialog, and its last cards carry SportLots links (NEO-339)"
tags:
  - set-selector
---
# ════════════════════════════════════════════════════════════════════════════
# R1 — ONE FEATURE: A BASE PARALLEL'S OWN ROW BUILDS ITS CHECKLIST FROM BASE
# (NEO-321 D3), LINKED TO THE PARALLEL'S OWN MARKETPLACE CARDS ON EVERY PAGE.
# On live data, under Baseball → 2024 → Topps → Topps Chrome › `Parallel` ›
# `Gold Wave Refractors`:
#
#   (e) The empty row's Sync slot is `Build from Base` — never `Fetch from
#       Marketplaces` — and pressing it builds the checklist at once: no Match
#       Cards dialog, no entity review, and the notice `Gold Wave Refractors —
#       Built 300 cards…` (Base's 335 minus the 35 Gold Wave lists on
#       neither marketplace).
#   (f) The copies at the END of the list carry SportLots links (the `SL`
#       badge). The build reads Gold Wave's SportLots checklist page by page;
#       a regression to a single page (NEO-137) strips the links from exactly
#       those rows (live). Paused, every copy is a BSC-only card instead.
#
# WHERE THIS CAME FROM (NEO-339). Both claims were the retired seed's (`flows/
# setup.yaml`) Gold Wave block, ported here when the seed became a server-side
# bulk load. The seed now builds a DIFFERENT parallel through the same
# server path (not Gold Wave, and not the first buildable row), so Gold Wave's
# cards are this flow's alone.
#
# R3 — NOT RE-PROVED HERE: the section-level `Build N parallels from Base`,
# its confirm and Stop (`base-parallels-build-from-section`); an insert's
# automatic build after a save (`bowman-insert-grouping-builds-parallels`).
# Rebuild's confirm and the notice wording are unit-tested
# (`ParallelBuildPanel.test.tsx`).
#
# ── THE FIXTURE AND THE WRITE SET (R7a, SET-REGISTRY.md → this flow) ────────
#   The seed saves the `Parallel` reconcile (41 rows) and leaves Gold Wave's
#   checklist EMPTY. This flow is the SOLE WRITER of Gold Wave's cards; no
#   other queue flow opens them. The build reads Base (never writes it) and
#   copies take Base's existing players and teams, so no player, team or row
#   is minted. One concurrent Base writer exists: `signed-by-autofills-from-
#   players` edits card #300, and a copy taken while that edit lands is
#   skipped ("1 skipped — Base changed them mid-build") — the notice pattern
#   in STEP 2 admits exactly that one outcome and nothing else.
#   `base-parallels-build-from-section` builds the FIRST buildable parallel
#   and stops; only if its Stop never lands does its run walk on into Gold
#   Wave, and that flow then fails by name.
#
#   Fresh-only per deployment: a re-run finds Gold Wave holding cards, its
#   button reads `Rebuild from Base` (with a Replace confirm), and STEP 2's
#   `^Build from Base$` fails by name. CI reseeds every run; re-seed before a
#   local re-run.
#
# ── LIVE / PAUSED (README → "Operator switches") ───────────────────────────
#   The build is the same in both modes; only the per-card badges differ
#   (STEP 3). Paused, Base was committed BSC-only, so every copy carries
#   Base's "BSC only" tag and no `SL` badge. The 300 is derived for the
#   paused build (every copy carried a BSC link live, `unlinked.bsc` 0), not
#   yet measured there.
#
# ── TIMEOUTS (R5) ───────────────────────────────────────────────────────────
#   7000 on every in-app step. The one longer wait is the build's notice,
#   which waits on a live BSC + paged SportLots checklist fetch of a set
#   nothing pre-synced — R5's marketplace exception, recorded at the site.
#
# maestro-lint: streaming-ok — this flow never DRIVES the pairing dialog; it
#   proves the dialog is absent on a base-parallel row (D3), and there is no
#   Confirm button to settle on. `scripts/maestro-pairing-sync.test.mjs` keys
#   on the literal "Match Cards" anywhere in a file, which here appears only
#   inside `assertNotVisible`. The sync point instead is the build's own
#   notice, which renders only once the build action has RESOLVED.
# ════════════════════════════════════════════════════════════════════════════

# NEO-287 — decide the mode once (a pure script, no UI).
- runFlow:
    file: ../util/util-paused-platforms.yaml

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# STEP 1 — DRILL TO TOPPS CHROME › PARALLEL › GOLD WAVE REFRACTORS
# ============================================================

# R9 — the warm drill. Returns with the Variant Types column on screen and
# "Base" listed.
- runFlow:
    file: util-drill-to-2024-topps-chrome.yaml

# "Parallel" sits under "Base" in the same column: DOWN, centred for the tap
# (R8). Selecting it also mounts the `Parallels of Base` section BELOW the
# columns row; nothing here taps it.
- scrollUntilVisible:
    element:
      text: "Parallel"
    centerElement: true
    timeout: 7000
- tapOn: "Parallel"

# The Parallels column mounts on a Convex read of the seed's rows (7000).
# Its search box renders from the column's first frame (NEO-224); the
# FILTERED ROW is the content gate. A PREFIX is typed so the box's own value
# can never full-match `^Gold Wave Refractors$` — only the row can. The box
# sits at the top of the columns row, level with `Parallel` (MEASURED y=176,
# base-parallels-build-from-section), so if it is ever off screen it is
# ABOVE: UP, centred for the tap (R8).
- extendedWaitUntil:
    visible: ".*Search parallels.*"
    timeout: 7000
- scrollUntilVisible:
    element:
      text: ".*Search parallels.*"
    direction: UP
    centerElement: true
    timeout: 7000
- tapOn:
    text: ".*Search parallels.*"
    waitToSettleTimeoutMs: 250
- inputText: "Gold Wave Refractor"
- extendedWaitUntil:
    visible:
      text: "^Gold Wave Refractors$"
      below:
        id: "Search parallels"
    timeout: 7000
- tapOn:
    text: "^Gold Wave Refractors$"
    below:
      id: "Search parallels"

# ============================================================
# STEP 2 — THE ROW'S SLOT IS THE BUILD; IT BUILDS WITH NO DIALOG (e)
# ============================================================

# THE WAY DOWN IS TWO STEPS, MEASURED. From the columns row, where the row
# was picked (page near the top), the button is ~1,250px down: below the
# `Parallels of Base` section (sleeve strip only — no ledger before a run),
# the Multi-source panel and the attributes panel (CDP probe of the seeded
# PR preview, 2026-10-11: `Search parallels` at document y=369, `Attributes
# for …` 985, `Build from Base` 1252, document 1582). One 7000 scroll cannot
# cross that: the first local run read the hierarchy at try 0 and after two
# ~2.3 s swipes, found the button only after the third, and its timeout was
# spent before the next read. So the attributes panel's header is the first
# stop — the same step every attributes-panel header takes, measured at one
# swipe plus one centring swipe (`base-parallels-build-from-section` STEP 4)
# — and it also proves the pick landed on Gold Wave. DOWN, centred (R8 case
# 1); it is not tapped, so 10% visibility is enough to stop on.
- scrollUntilVisible:
    element:
      text: ".*Attributes for Gold Wave Refractors.*"
    centerElement: true
    visibilityPercentage: 10
    waitToSettleTimeoutMs: 1000
    timeout: 7000

# THE BUTTON. On an empty base-parallel row the checklist's primary action is
# `buildButtonLabel(source, false)` = "Build from Base", rendered only once
# the server has named the source (`getParallelsForBuild`), so this scroll is
# also the wait for that query (our own read: the 7000 bar). Anchored full
# match: the `Parallels of Base` section above carries "Build N parallels
# from Base", which must never answer here (it would build EVERY parallel).
# With the attributes header centred the button is ~270px below it, at the
# bottom edge of the viewport; DOWN, centred for the tap (R8 case 1 — the
# NEO-260 spacer under the page is the headroom).
- scrollUntilVisible:
    element:
      text: "^Build from Base$"
    centerElement: true
    timeout: 7000
# R2 — the slot really is the build: no "Fetch from Marketplaces" / "Sync
# card checklist" on a base-parallel row (D3). Paired with the positive
# above, so it cannot pass on a dead page.
- assertNotVisible:
    id: "Sync card checklist"
- tapOn:
    text: "^Build from Base$"

# An EMPTY parallel builds at once — `ParallelBuildButton` asks "Replace the
# cards" only when the parallel already has cards, and the seed leaves Gold
# Wave empty. A confirm here means a stale deployment, and the notice wait
# below fails by name.
#
# THE RESULT, PINNED (`buildNotice`): "<parallel> — Built N cards[, clauses]."
# then " <side> only." when one side was fetched; the node's text ends with
# the " " before its `See which cards` button. MEASURED live (CI 37179999943,
# Convex `parallel_checklist_built`: copied 300, notCopied 35, unlinked
# SportLots 1, ambiguous 0, one extra SportLots card):
#   "Gold Wave Refractors — Built 300 cards, 1 without a SportLots card, 35
#    left off — not on either marketplace's list, 1 on SportLots that Base
#    doesn't have. "
# The count is anchored: `300 cards` must be followed by a clause (`, …`) or
# the sentence's own `.`, so neither `3000` nor any other count answers; only
# the clause wording (live SportLots tallies that say nothing about the
# build's size) is left open. ONE other outcome is admitted, and only it:
# the build ran mid-queue while `signed-by-autofills-from-players` edited
# Base card #300, so that one copy was skipped — `Built 299 cards, …, 1
# skipped — Base changed them mid-build`. The retired seed could pin 300
# alone because it ran before the queue; this flow cannot.
#
# R5 MARKETPLACE EXCEPTION — the build waits on a live BSC checklist fetch
# AND a paged SportLots checklist fetch of Gold Wave's own ids (nothing
# pre-synced them), then the link pass and the copy. MEASURED 4.5 s for the
# step (tap → notice) and 4.81 s server-side; `base-parallels-build-from-
# section` measured the same build at 5.07 s. 30000 is the ceiling for that
# live round-trip, not a budget: a build that needs more than seconds is a
# finding to read in the run's Convex logs (`parallel_checklist_built`),
# never a reason to raise it. `extendedWaitUntil` never scrolls, and need
# not: the notice line sits in the Cards card's header, where the button was
# centred.
- extendedWaitUntil:
    visible:
      text: "Gold Wave Refractors — Built (300 cards|299 cards(, [^.]+)?, 1 skipped — Base changed them mid-build)(, [^.]+)?\\..*"
    timeout: 30000
# D3 — the pairing dialog and the entity review are retired on a
# base-parallel row. Paired with the positive above. The review's title is
# "Tidy up this set" since NEO-335 ("Confirm New Players & Teams" before).
- assertNotVisible: "Match Cards.*"
- assertNotVisible: "Tidy up this set"

# ============================================================
# STEP 3 — THE LAST COPIES CARRY THEIR MARKETPLACE LINKS (f)
# ============================================================

# WHERE THE ROWS ARE. CardChecklist's virtuoso opens at its END
# (`initialTopMostItemIndex`), i.e. on the highest-numbered copies — the far
# end of SportLots' pages (~#290-#300; the first SportLots page is ~88 cards,
# NEO-91). Maestro cannot drive the list's own scroller, so these rows are the
# only ones a flow can read, and they are exactly the rows a single-page
# SportLots read would leave unlinked. Base's own SportLots-less tail (#301+)
# has no Gold Wave counterpart and is left off, so it cannot leak in.
#
# A card row's number cell, FULL match: `CardChecklistItem` renders the number
# alone in its own span ("#123"); a notice line, a twin suffix "(#123)" or a
# pairing line "#12 Name" cannot answer. The list is BELOW the notice: DOWN.
# Nothing is tapped, so no centring (R8); a row in view exits at try 0.
# Over-rendered rows above the list's viewport report as visible (virtualized
# list phantom rows), which is harmless for a read: any copy proves the claim.
- scrollUntilVisible:
    element:
      text: "#[0-9][^ ]*"
    timeout: 7000

# LIVE — the per-card SportLots badge. A BARE "SL" is unambiguous: Maestro
# matches the WHOLE text of a node, and nothing else on the page reads
# exactly "SL" (the Multi-source panel's header reads "SPORTLOTS"). A bare
# "BSC" would NOT be unambiguous — that panel has a "BSC" header — which is
# why the paused branch pairs it with "BSC only".
- runFlow:
    when:
      true: "${!output.SL_PAUSED}"
    commands:
      - assertVisible: "SL"
# PAUSED — the opposite fact: no copy carries a SportLots ref, because Base
# was fetched BSC-only, and every copy carries Base's own "BSC only" tag
# (the copy keeps `attributes: source.attributes`, NEO-321).
- runFlow:
    when:
      true: "${output.SL_PAUSED}"
    commands:
      - assertVisible: "BSC only"
      - assertNotVisible: "SL"

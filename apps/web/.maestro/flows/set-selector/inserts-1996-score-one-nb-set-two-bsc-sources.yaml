appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Inserts — ONE NeonBinder set maps to TWO BSC sets and one SportLots set, and a re-sync keeps NeonBinder's own card name (1996 Score, NEO-137 + NEO-203)"
tags:
  - set-selector
---
# R1 — ONE FEATURE: a NeonBinder set maps to 0-N BSC sets and 0-N SportLots
# sets, the two sides independent. This flow covers that end to end — the
# reconcile that builds the set, and the card fetch that proves both sources
# are read.
#
# STEP 7 adds ONE more, and only because it is free here: NEO-203's re-sync
# content-diff review. See the note above STEP 7 for why it rides on this flow
# rather than owning one.
#
# WHY ONE FLOW, having briefly been two. I split it on a guess that the combined
# runtime (cold insert sync + reconcile + cold two-source fetch + entity wizard)
# would approach the 600s per-flow kill, and joined the halves with the
# harness's provides:/requires: tags. That was wrong twice over:
#   - MEASURED, the halves are 2m17s and 1m23s. Combined is ~4 minutes. The
#     estimate that justified the split was pure pessimism.
#   - CI does not use the dep-graph scheduler at all. `run-e2e-queue.sh`
#     enqueues in LPT order (alphabetical when a flow has no timing history) and
#     8 runners claim from a shared queue with NO requires:/provides: handling —
#     that is the local picker's feature only. "checklist-1996-…" sorts before
#     "inserts-1996-…", so the consumer would have been claimed before the
#     producer built the set, and failed.
# The suite's model is: `seed` provisions the baseline, and every queue flow is
# INDEPENDENT of every other. A flow that needs state another flow creates does
# not belong in that queue.
#
# WHY THIS SET (see .maestro/SET-REGISTRY.md):
#   1996 Score is the only set in the catalog with the shape the feature exists
#   for. BSC splits Dugout Collection Artist's Proofs into Series 1 and
#   Series 2; SportLots carries one combined set of 220 cards:
#
#     BSC  Dugout Collection Artist's Proofs Series 1   110 cards
#     BSC  Dugout Collection Artist's Proofs Series 2   110 cards
#     SL   Dugout Collection Artists Proofs             220 cards (#A1-, #B1-)
#
#   The pre-existing Topps Chrome anchor is an ordinary 1:1 mapping and can
#   never exercise this.
#
# SOLE WRITER, NOT READ-ONLY:
#   Every other flow treats real sets as read-only, because 8 runners drain the
#   queue concurrently. Here the reconciliation IS the thing under test, so this
#   flow must perform it. Exactly ONE flow may ever touch 1996 Score — this one.
#
# WHAT THIS TESTS — the reconcile dialog builds NB sets, not pairs, AND those
# sets then fetch from every source mapped to them:
#   - auto-matches arrive in Ready; unmatched marketplace sets sit in Pending
#   - a Pending set is ATTACHED to an existing Ready set, giving that one NB set
#     two BSC mappings — the 0-N-per-side capability itself
#   - the NB set is RENAMED; the title is ours and is what persists
#   - saving produces ONE insert row, not two
#   - both sources show in the multi-source panel, neither marked "primary"
# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# DRILL TO Baseball / 1996 / Score / Score
# The util handles the search-input-per-column cascade. 1996 Score is NOT
# pre-synced, so the util's 60s ceiling on the variant-type reveal covers the
# cold BSC + SL fetch for this hierarchy.
# ============================================================

- runFlow:
    file: util-drill-to-2024-topps-chrome.yaml
    env:
      SPORT: "Baseball"
      YEAR: "1996"
      MANUFACTURER: "Score"
      SET: "Score"

# ============================================================
# STEP 1 — ENTER THE Insert VARIANT TYPE
# Selecting it kicks the cross-platform auto-sync, which surfaces the
# reconcile dialog. 240s matches setup.yaml's sanctioned ceiling for a COLD
# insert-level BSC + SL fetch — this set has never been synced.
# ============================================================

- scrollUntilVisible:
    element:
      text: "Insert"
    centerElement: true
    timeout: 15000
- tapOn: "Insert"
# REQUIRED, not optional. setup.yaml performs a global Set Builder reset before
# any flow runs, so 1996 Score is always absent when this flow starts and
# selecting Insert always opens the reconcile dialog.
#
# This used to be a `when: visible: "Reconcile Inserts"` branch that silently
# skipped the whole reconcile if rows already existed. That turned a stale-state
# problem into a baffling failure three steps later: a leftover hand-built row
# from a manual dev session made the flow assert a name it had never typed. If
# the dialog does not appear, the set is dirty and this flow cannot test what it
# exists to test — so fail here, where the message says so.
- extendedWaitUntil:
    visible: "Reconcile Inserts"
    timeout: 240000

# ── THE TWO SECTIONS ──────────────────────────────────────────────
# Ready holds NB sets that will be written; Pending holds marketplace
# sets not yet assigned to one. Anything left in Pending is discarded.
- assertVisible:
    text: ".*Ready \\([0-9]+\\).*"

# NARROW THE READY LIST FIRST — this is what makes the rest of the dialog
# reachable at all.
#
# 1996 Score reconciles ~10 inserts, and the dialog body is its own
# overflow-y-auto scroller. Maestro scrolls the PAGE, not that container, so
# everything below a full-length Ready list is unreachable: `scrollUntilVisible`
# on "Pending" returned "No visible element found" rather than scrolling to it.
# The old dialog dodged this by collapsing its Matched section by default.
#
# Filtering Ready to one row pulls Pending, both columns and the Save button
# back above the fold — and it is the same thing an operator does to find the
# set they came to fix.
- tapOn:
    id: "Filter NeonBinder sets"
    waitToSettleTimeoutMs: 250
- inputText: "Artist"
- extendedWaitUntil:
    visible:
      text: ".*Ready \\(1 of [0-9]+\\).*"
    timeout: 10000
- assertVisible:
    text: ".*Pending \\([0-9]+\\).*"

# The auto-matcher pairs Series 2 with the combined SL set at 78% and
# leaves Series 1 stranded — `computeMatches` splices its match out of
# both arrays, so the single SL set is consumed by whichever series
# scored first. That behaviour is UNCHANGED by NEO-137 and is what makes
# this fixture reproducible. If the winning series ever flips, this
# assertion is the canary and fails here rather than timing out below.
- assertVisible:
    id: "NeonBinder set name for Dugout Collection Artist's Proofs Series 2"

# ── ATTACH THE SECOND BSC SET TO THAT SAME NB SET ─────────────────
# Four BSC inserts share the "Dugout Collection" prefix, so filter to
# "Artist" — that leaves exactly ONE pending BSC item, Series 1.
- tapOn:
    id: "Filter BSC items"
    waitToSettleTimeoutMs: 250
- inputText: "Artist"
- extendedWaitUntil:
    visible:
      text: ".*BSC \\(1 of [0-9]+\\).*"
    timeout: 15000

# Selecting a Pending item arms it; every Ready set then offers to take
# it. Tapping by aria-label composes BOTH names, so this can only hit the
# intended set even with a dozen Ready rows on screen.
- tapOn:
    text: "Dugout Collection Artist's Proofs Series 1"
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      id: "Add Dugout Collection Artist's Proofs Series 1 to Dugout Collection Artist's Proofs Series 2"
    centerElement: true
    timeout: 15000
- tapOn:
    id: "Add Dugout Collection Artist's Proofs Series 1 to Dugout Collection Artist's Proofs Series 2"
    retryTapIfNoChange: true

# Consumed from Pending — the BSC column is now empty under the filter.
- extendedWaitUntil:
    visible:
      text: ".*BSC \\(0 of [0-9]+\\).*"
    timeout: 10000

# ── RENAME — THE TITLE IS OURS ────────────────────────────────────
# The set defaults to the BSC name that seeded it. Neither series name
# describes a set that now covers both, so give it ours. Committed on
# blur/Enter rather than per keystroke; see ReadySetRow for why.
- tapOn:
    id: "NeonBinder set name for Dugout Collection Artist's Proofs Series 2"
    waitToSettleTimeoutMs: 250
- eraseText: 60
- inputText: "Dugout Collection Artists Proofs"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "NeonBinder set name for Dugout Collection Artists Proofs"
    timeout: 10000

# ── SAVE ──────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: ".*Save [0-9]+ sets.*"
    centerElement: true
    timeout: 15000
- tapOn:
    text: ".*Save [0-9]+ sets.*"
- extendedWaitUntil:
    notVisible: "Reconcile Inserts"
    timeout: 60000

# ============================================================
# STEP 2 — ONE INSERT ROW, CARRYING OUR NAME
#
# The acceptance criterion at set level. Two BSC sets collapsed into a single
# NeonBinder set, named by us rather than by either marketplace.
#
# RE-DRILL FIRST — the columns row is overflow-x-auto, and saving leaves it at
# whatever horizontal offset the dialog was opened from, which pushes the
# Inserts column off to the RIGHT. Maestro has no horizontal scroll, so nothing
# can recover it; the util's openLink resets both axes to a nav-safe position.
# The row is already saved, so re-entering "Insert" renders the column directly
# instead of re-opening the reconcile dialog.
# ============================================================

- runFlow:
    file: util-drill-to-2024-topps-chrome.yaml
    env:
      SPORT: "Baseball"
      YEAR: "1996"
      MANUFACTURER: "Score"
      SET: "Score"

- scrollUntilVisible:
    element:
      text: "Insert"
    centerElement: true
    timeout: 15000
- tapOn: "Insert"

- extendedWaitUntil:
    visible: ".*Search inserts.*"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: ".*Search inserts.*"
    centerElement: true
    timeout: 10000
- tapOn:
    text: ".*Search inserts.*"
    waitToSettleTimeoutMs: 250
- inputText: "Artist"

- extendedWaitUntil:
    visible:
      text: ".*Dugout Collection Artists Proofs.*"
      below:
        id: "Search inserts"
    timeout: 20000

# The per-series rows must NOT exist — one NB set, not two. Under the "Artist"
# filter this column shows only Artist's Proofs rows, so a surviving
# "Series 1"/"Series 2" row would be visible here.
- assertNotVisible:
    text: ".*Artist's Proofs Series [12].*"

# ============================================================
# STEP 3 — BOTH BSC SOURCES ARE ATTACHED, NEITHER IS "PRIMARY"
#
# The multi-source panel is the only place the 0-N mapping is visible at rest.
# `primaryPlatformId` records which slot the RECONCILER owns — not where cards
# were released — so surfacing it as a PRIMARY badge implied a provenance claim
# it does not make. Both sources are equal here.
# ============================================================

- tapOn:
    text: ".*Dugout Collection Artists Proofs.*"
    below:
      id: "Search inserts"
- scrollUntilVisible:
    element:
      text: "Multi-source sets"
    centerElement: true
    timeout: 20000

- assertVisible: "Multi-source sets"
- assertVisible:
    text: ".*Dugout Collection Artist's Proofs Series 1.*"
- assertVisible:
    text: ".*Dugout Collection Artist's Proofs Series 2.*"
- assertNotVisible:
    text: ".*PRIMARY.*"

# ============================================================
# STEP 4 — FETCH CARDS FROM BOTH BSC SOURCES
#
# THE FAN-OUT REGRESSION. BSC does not OR multi-value facets: sending both
# series slugs in one request returns 200 OK with an empty body. Measured on
# dev 2026-08-12 — one slug returned 110 cards, two returned 0 — and the UI
# reported "0 BSC cards" with no error anywhere, because a failed/empty BSC
# result is indistinguishable from "the marketplace had nothing".
#
# 220 is therefore the assertion that matters: it is only reachable if BOTH
# sources were fetched and merged.
# ============================================================

- scrollUntilVisible:
    element:
      text: ".*Fetch from Marketplaces.*|Refresh"
    centerElement: true
    timeout: 30000
- tapOn:
    text: ".*Fetch from Marketplaces.*|Refresh"

- extendedWaitUntil:
    visible:
      text: "Match Cards.*"
    timeout: 120000

# NEO-195 — the dialog OPENING is not the fetch FINISHING.
# Since streaming, "Match Cards" appears on the first reconciled candidates
# (~6s), not on the action's return. Every assertion below is about the FINAL
# contents — the matched list being expanded, both columns empty, and the 220
# count that is the whole point of this flow — so asserting on the streaming
# dialog reads a half-filled screen and fails on whichever row had not arrived
# yet. Confirm's own text is the signal: "Loading…" while streaming, "Confirm"
# once the action resolves.
- extendedWaitUntil:
    visible:
      text: "^Confirm$"
    timeout: 120000

# ============================================================
# STEP 5 — THE PAIRING DIALOG, FULLY MATCHED
#
# Every one of the 220 cards pairs across both marketplaces, so there is
# nothing to reconcile. The dialog must say so rather than showing a collapsed
# "▶ Matched (220)" above two "(0)" columns and a keep shelf describing cards
# that do not exist.
# ============================================================

# Named — an operator who steps away must be able to tell which set this is.
- assertVisible:
    text: ".*Match Cards — Dugout Collection Artists Proofs.*"

# Expanded, not collapsed: the card rows are on screen without a disclosure tap.
- assertVisible:
    text: ".*Unlink.*"

# The empty scaffolding is omitted entirely.
- assertNotVisible:
    text: ".*BSC only.*"
- assertNotVisible:
    text: ".*SportLots only.*"
- assertNotVisible:
    text: ".*Nothing kept.*"

# BOTH BSC sources fetched and merged. Strict count — card checklists are
# immutable once produced, so 220 is a fixed fact, not marketplace drift.
# Do NOT loosen this to hide a fan-out regression; 110 means one source.
- assertVisible:
    text: ".*220 cards will be saved.*"

- tapOn:
    id: "Confirm card matches"
- extendedWaitUntil:
    notVisible: "Match Cards.*"
    timeout: 60000

# ============================================================
# STEP 6 — SAVE THROUGH THE ENTITY WIZARD
#
# 220 fresh cards surface hundreds of unknown players; the bulk-confirm footer
# button is the sanctioned path (setup.yaml documents why per-item draining is
# not viable — each item is gated by the 3s/item Wikidata queue).
# ============================================================

- extendedWaitUntil:
    visible:
      text: ".*Confirm New Players.*|.*Saved [0-9]+ cards.*"
    timeout: 120000
- runFlow:
    when:
      visible: "Confirm New Players & Teams"
    commands:
      - tapOn:
          text: ".*Add All Remaining as New.*"
      - extendedWaitUntil:
          visible:
            text: ".*Confirm & Save.*"
          timeout: 60000
      - tapOn:
          text: ".*Confirm & Save.*"
      # NEO-163: no gate on the wizard closing. The "Saved N cards" wait below is
      # a positive terminal signal proving the same thing and more, so this
      # negative gate against a repainting node only added a failure mode.

- extendedWaitUntil:
    visible:
      text: ".*Saved 220 cards.*"
    # NEO-163: absorbs the removed notVisible gate's budget.
    timeout: 120000

# ============================================================
# STEP 7 — RE-SYNC: NEONBINDER'S OWN EDIT SURVIVES THE NEXT FETCH (NEO-203)
#
# The set is committed now, so the NEXT fetch is a RE-sync: every incoming card
# lands on a row that already exists, and upstream and NeonBinder both have an
# opinion about what that card SAYS. NEO-203's rule is that NeonBinder owns its
# checklist — a re-sync always refreshes marketplace LINKAGE, and only changes
# CONTENT where the operator ticks a box. The review dialog is where that ask
# happens.
#
# WHY THIS RIDES ON THIS FLOW, not its own. The expensive part of testing a
# re-sync is HAVING a committed, marketplace-backed, duplicate-numbered set to
# re-sync — the reconcile plus the cold two-source fetch above, ~4 minutes. A
# standalone flow would pay all of that again to reach the same starting line,
# and (per SET-REGISTRY.md) 1996 Score has exactly ONE sanctioned writer, so a
# second flow could not touch this set anyway. Here the marginal cost is one
# re-fetch. E2E is the repo's only prod gate; that trade is the whole reason
# this is a segment and not a file.
#
# WHAT IS AND IS NOT ASSERTED. One decision, start to finish: an operator edits
# a card's name in NeonBinder, re-fetches, is SHOWN the marketplace's competing
# name, declines it, and still has their own name afterwards. The Escape /
# "Skip changes" path, the formatting-only bulk accept, the delete confirm and
# the conflict radiogroup are all covered by sync-review-modal.test.tsx — they
# are dialog-local state machines with nothing marketplace-shaped about them,
# and each one here would cost another ~90s live round-trip to reach.
#
# ── 7a. EDIT ONE CARD'S NAME IN NEONBINDER ────────────────────────
# WHICH card does not matter, and we deliberately do not name one: 1996 Score is
# duplicate-numbered across the two BSC series (CI run 33589796484's hierarchy
# shows TWO "Edit card 74" and TWO "Edit card 75"), so a card number is not a
# unique handle here. Every assertion below keys off the marker we type, which is
# unique by construction.
#
# WHY THE OBVIOUS VERSION OF THIS IS A TRAP — read before "simplifying" it.
# The checklist is a react-virtuoso list with `increaseViewportBy={{top: 200,
# bottom: 400}}`, so it always renders ~3-4 rows ABOVE its own scroll viewport.
# Those rows are CSS-clipped but their layout bounds are real, and Maestro's CDP
# hit-test reports them as 100% visible — sitting, visually, on top of the
# attributes panel further up the page. `scrollUntilVisible` on "Edit card .*"
# therefore matches a clipped row, reports "Visibility Percent: 1.0", scrolls
# NOTHING, and the tap lands on empty page chrome. That is exactly how this flow
# failed on its first CI run: it tapped "Edit card 73" at (687,284) and the
# drawer never opened.
#
# THE FIX — anchor the tap BELOW the source-filter label. Maestro's `below`
# filter is `candidate.bounds.y > anchor.bounds.y` (top edges, verified against
# maestro-client.jar's Filters.below$lambda$22), and `relativeTo` returns the
# survivors sorted by ASCENDING distance from the anchor. So this selects the
# TOPMOST row that starts below the label — i.e. the first genuinely on-screen
# row — and every clipped row is excluded. From that CI hierarchy: the label sits
# at y=478, the last clipped row's Edit at y=466, the first real one at y=530.
# The 12px margin is structural, not luck: both are fixed offsets from the list
# container's top (the label by CSS spacing, the clipped row by the 64px row
# pitch), so page scrolling moves them together and cannot close the gap.
#
# The label's DOM text is "BSC source" — it only LOOKS like "BSC SOURCE" because
# of a CSS `uppercase`, and Maestro matches the DOM.
# ============================================================

# Bring the anchor on screen first. It is an ordinary, non-virtualised element,
# so unlike a row this scroll cannot land on a clipped phantom. Note it is a
# no-op when the label is ALREADY visible — maestro only scrolls (and only then
# applies centring) if the element is off screen; the CI log shows it completing
# at "Scrolling try count: 0". That is fine: the `below` geometry is invariant
# under page scroll, and if the label ends up so low that no row is on screen
# beneath it, the tap fails with a plain "element not found" rather than
# silently hitting the wrong thing.
- scrollUntilVisible:
    element:
      text: "BSC source"
    centerElement: true
    timeout: 15000

# retry + a hard gate on the drawer opening: the tap target is now correct by
# construction, but Virtuoso can still repaint between Maestro reading the row's
# bounds and the click landing. Same result-keyed retry the drill util uses for
# that exact staleness (see util-drill-to-2024-topps-chrome).
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          id: "Edit card .*"
          below:
            text: "BSC source"
          waitToSettleTimeoutMs: 1000
      - extendedWaitUntil:
          visible:
            id: "Card name"
          timeout: 15000

# Type a marker INTO the existing name rather than replacing it. A Maestro-web
# tap on a filled input drops the caret mid-string, so `inputText` inserts the
# marker contiguously and no `eraseText` guesswork is involved (see
# card-detail-panel.yaml for the caret behaviour). The result is a name that is
# unmistakably OURS and cannot fold-equal the marketplace's — which is what
# puts this card in "Content changes" rather than "Formatting only", and what
# leaves its checkbox UNTICKED by default.
- tapOn:
    id: "Card name"
- inputText: "NB203-${ATTEMPT_ID}"

# NEO-216 — the drawer has no Save button. A single-line field commits on Enter
# IN PLACE (the drawer stays open) and the drawer confirms the write in its one
# status region. THIS WAIT IS THE PRECONDITION for everything below: if the name
# never reached the database, the re-sync's review dialog would have nothing to
# show and STEP 7's whole point would evaporate into a green run. Fail here
# instead, where the message says which write went missing.
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*Saved Card name.*"
    timeout: 7000

# Close the drawer. "Done" lives in the drawer's pinned footer, OUTSIDE the
# scroll container; `scrollUntilVisible` can never satisfy centering on it and
# times out even while it is plainly on screen — so assert + tap, per
# card-detail-panel.yaml (R8 exception).
- assertVisible:
    id: "Done editing card"
- tapOn:
    id: "Done editing card"
- assertNotVisible:
    id: "Card name"
# Scoped below the same anchor, for the same reason the tap is: an unscoped
# match could be satisfied by a CSS-clipped row, which would prove the row
# exists but not that we are looking at the one we just edited.
- assertVisible:
    text: ".*NB203-${ATTEMPT_ID}.*"
    below:
      text: "BSC source"

# ============================================================
# 7b. RE-FETCH THE SAME CHECKLIST
#
# The button reads "Refresh" once cards exist (it said "Fetch from
# Marketplaces" the first time), so target its stable accessible name. A live
# BSC + SportLots round-trip — the sanctioned long wait.
# ============================================================

- scrollUntilVisible:
    element:
      id: "Sync card checklist"
    centerElement: true
    timeout: 15000
- tapOn:
    id: "Sync card checklist"

- extendedWaitUntil:
    visible:
      text: "Match Cards.*"
    timeout: 120000
# Same NEO-195 rule as STEP 4: the dialog OPENS on the first streamed
# candidates, Confirm's own label is what says the fetch RESOLVED.
- extendedWaitUntil:
    visible:
      text: "^Confirm$"
    timeout: 120000

# Both BSC sources fetched and merged again — the upstream side of "no rows
# added or lost". 110 would mean the fan-out regressed on the re-sync path.
- assertVisible:
    text: ".*220 cards will be saved.*"
- tapOn:
    id: "Confirm card matches"

# ============================================================
# 7c. THE REVIEW DIALOG APPEARS, AND SHOWS OUR CARD
#
# Confirm hands the paired cards to `diffChecklistAgainstExisting` and, because
# one card genuinely differs, the review opens. Plain 7s: this is one Convex
# query, not a marketplace call — and MEASURED at 338ms in CI run 33595567945
# (06:02:45.905 → 06:02:46.243), so ~95% headroom. The worry that diffing 220
# cards against their stored rows would be slow is answered: it is not. Do not
# inflate this.
# ============================================================

- extendedWaitUntil:
    visible: ".*Review Changes — Dugout Collection Artists Proofs.*"
    timeout: 7000

# EXACTLY ONE card changed. Not "one or more": we edited one card, so a second
# content-changed card would mean the re-sync invented a difference on a card
# nobody touched — which is precisely the regression NEO-203's NB-owned rule
# exists to prevent. Tight is the point.
- assertVisible:
    text: ".*Content changes \\(1\\).*"

# ...and the field it changed is the card NAME.
#
# DO NOT reach for the checkbox here. Its aria-label reads "Apply Card name to
# #<n> <name>: <old> becomes <new>" and looks like the perfect single-element
# assertion — it is unreachable. maestro-web emits NO hierarchy node for a bare
# <input type="checkbox">, so that accessible name does not exist as far as
# Maestro is concerned. Verified against the view hierarchy of CI run
# 33595567945: the dialog contributes text nodes and its two footer <button>s
# ("Apply selected changes"), and nothing whatsoever for the four field
# checkboxes. (The `id: "Value for Reprint"` precedent in
# topps-chrome-add-feature.yaml does NOT contradict this — despite that flow's
# comment calling it "a real <input type=checkbox>", FeatureValueControl's
# CheckboxValueControl renders a <button aria-pressed>, which is why it works.)
#
# "Card name" is the field label inside the dialog, and it is unambiguous here:
# the card drawer unmounted at 7a (asserted above) and the add-card form is
# closed, so the two other elements carrying that accessible name are gone.
- assertVisible:
    text: "Card name"

# NeonBinder's value is the one being offered up for replacement — our marker
# sits on the "was" side of the diff. Scoped BELOW the field label on purpose:
# the checklist row behind the portal carries this exact same string (the
# hierarchy shows both, at y=219 for the row and y=248 for the dialog), and an
# unscoped match could be satisfied by the page behind the dialog. The label
# sits between them at y=230, so anchoring on it selects the dialog's copy.
#
# We do NOT also pin the marketplace value: it is whatever BSC/SportLots say
# this card is called, which the flow cannot know in advance. It does not need
# to — the diff only lists a field AT ALL when the two sides differ, so a
# "Card name" row whose old side is ours is already the marketplace value
# standing against the NeonBinder value.
- assertVisible:
    text: ".*NB203-${ATTEMPT_ID}.*"
    below:
      text: "Card name"

# NOTHING ADDED, NOTHING LOST — asserted where the diff states it outright.
# "0 new" means every one of the 220 incoming cards matched a row NeonBinder
# already holds, so the re-sync inserts none; the absence of the "no longer
# listed upstream" section means no row NeonBinder holds went unclaimed. A
# re-sync that duplicated rows (the NEO-203 regression) fails on the first, one
# that orphaned rows fails on the second.
- assertVisible:
    text: ".* 0 new .*unchanged.*"
- assertNotVisible:
    text: ".*no longer listed upstream.*"

# ============================================================
# 7d. KEEP OUR VERSION, AND COMMIT
#
# We leave the Card name box UNTICKED — that IS "keep the NeonBinder version",
# and it is the default precisely because a rewrite is never pre-accepted.
# Pressing "Apply & Continue" rather than "Skip changes" is deliberate: it runs
# the commit path that carries per-field decisions on the wire, which still has
# to leave the one field we declined alone. Skipping would exercise a strictly
# easier path.
#
# No delete checkbox is ticked, so Apply submits directly rather than raising
# the deletion confirm.
# ============================================================

- tapOn:
    id: "Apply selected changes"

# Every player and team on these 220 cards was created by STEP 6's commit, so
# the entity wizard has nothing to ask and the commit runs straight through.
# 120s mirrors STEP 6's budget for the identical 220-card commit.
- extendedWaitUntil:
    visible:
      text: ".*Saved 220 cards.*"
    timeout: 120000

# THE ACCEPTANCE CRITERION. The marketplace's name for this card was offered
# and declined, so the checklist still shows OURS. If the re-sync had written
# marketplace content over a NeonBinder-owned field by default, the marker
# would be gone and this fails.
#
# The checklist stays mounted across the re-sync — only the modals came and
# went — so Virtuoso holds its scroll and the edited row is still where 7a left
# it. Re-centre the anchor (cheap, non-virtualised) in case a modal shifted the
# PAGE, then assert the row below it. Deliberately NOT `scrollUntilVisible` on
# the row itself: page scrolling does not move this list's own scroller (see the
# `initialTopMostItemIndex` note in CardChecklist.tsx), so scrolling for a row is
# either a no-op or a match on a clipped one.
- scrollUntilVisible:
    element:
      text: "BSC source"
    centerElement: true
    timeout: 15000
- assertVisible:
    text: ".*NB203-${ATTEMPT_ID}.*"
    below:
      text: "BSC source"

# ============================================================
# STEP 8 — A RENAMED INSERT ROW SURVIVES A FORCED "Sync Inserts", AND THE
#          MARKETPLACE NAMES IT DISAGREES WITH ARRIVE AS DECLINABLE
#          SUGGESTIONS (NEO-211)
#
# STEP 7 proved NeonBinder owns its CARD content across a re-sync. This proves
# the same rule one level up, for the SET ROW itself — which is a different
# mutation (`storeReconciledOptions`, not the checklist commit) and a different
# failure mode.
#
# WHAT USED TO HAPPEN. `storeReconciledOptions` matched incoming marketplace
# sets to existing rows by their DISPLAY VALUE and then deleted every non-custom
# row the fetch had not named. A row renamed away from its marketplace label was
# therefore unrecognisable on the next sync: deleted, re-inserted empty, and its
# card checklist orphaned — all 220 of them, since `cardChecklist` rows point at
# the row by `_id` and nothing re-parents. NEO-211 makes the match id-keyed
# (tier 0 is the row's own `_id`, threaded through the reconcile modal) and
# removes the delete pass entirely.
#
# WHY IT RIDES ON THIS FLOW, same argument as STEP 7. The expensive part is
# having a committed, two-BSC-source insert row to re-sync at all — and
# SET-REGISTRY.md's sole-writer rule forbids a second flow from building one on
# 1996 Score. The marginal cost here is one insert-level reconcile.
#
# DECLINE, not accept. The Hockey flow
# (set-rename-survives-resync-and-suggests-bsc-name.yaml) covers Accept end to
# end; the other half of the dialog is the decision that writes NOTHING to the
# name and stops the marketplace asking again. Both halves are covered live,
# neither twice.
#
# WHAT THIS LEAVES BEHIND. The insert row keeps its NB211 marker name — the
# same convention STEP 7 already uses for the first card's NB203 marker, and
# recorded in SET-REGISTRY.md. Renaming it back would cost another round of
# panel scrolling for no additional coverage: the assertion that matters is that
# the name we chose is still the name on the row.
#
# ── 8a. RENAME THE INSERT ROW ────────────────────────────────────
# The insert row has been the deepest selection since STEP 3, so
# SetAttributesPanel is already pointed at it and no re-drill is needed. The
# pencil lives in that panel's header; see rename-selector-option.yaml for the
# control's mechanics (the input opens EMPTY, so there is nothing to erase).
# ============================================================

# SCROLL **UP**, and scroll to the PANEL HEADING rather than to the pencil.
#
# Both halves are load-bearing (CI run 2, runner-5 step-145). By this point the
# page is parked deep inside the CardChecklist, whose rows are their own inner
# scroller — and SetAttributesPanel mounts ABOVE that checklist. A default
# (DOWN) scrollUntilVisible therefore walks AWAY from the pencil and into the
# card rows, and after 3m17s of that it failed with the checklist showing
# cards #72-#75.
#
# Targeting the heading rather than the pencil keeps the scroll on an ordinary,
# non-virtualised element — `Attributes for <name> (Insert)` — instead of
# hunting an icon button. The pencil (`aria-label="Rename <currentValue>"`,
# RenameEntityControl.tsx:191) sits in that same header row immediately after
# the title, so centring the heading puts the tap target at y≈315 with it. That
# is why the tap below needs no scroll of its own (R8 satisfied by the centring
# above, on the same row).
- scrollUntilVisible:
    element:
      text: ".*Attributes for Dugout Collection Artists Proofs.*"
    direction: UP
    centerElement: true
    timeout: 15000
- tapOn:
    id: "Rename Dugout Collection Artists Proofs"
- extendedWaitUntil:
    visible:
      id: "Edit name for Dugout Collection Artists Proofs"
    timeout: 7000
- tapOn:
    id: "Edit name for Dugout Collection Artists Proofs"
    waitToSettleTimeoutMs: 250
- inputText: "Dugout Collection Artists Proofs NB211-${ATTEMPT_ID}"
- pressKey: Enter

# HARD PRECONDITION. The panel header renders the CURRENTLY SELECTED row, so
# this proves the rename landed on the row we mean AND that the selection still
# resolves to it. Everything below is meaningless without it.
- scrollUntilVisible:
    element:
      text: ".*Attributes for Dugout Collection Artists Proofs NB211-${ATTEMPT_ID}.*"
    centerElement: true
    timeout: 10000

# ============================================================
# 8b. FORCE THE INSERT-LEVEL RE-SYNC
#
# "Sync Inserts" re-runs `fetchRawOptions` and re-opens the reconcile dialog
# with our previously-saved rows restored as Ready sets — each carrying its own
# `_id` and OUR title, not the marketplace's. Saving with no edits is therefore
# the purest form of the question: does a full re-sync leave the row alone?
#
# 240s matches STEP 1's sanctioned ceiling for the same live BSC + SportLots
# insert fetch. R5 marketplace exception.
# ============================================================

# Scroll UP for the same reason as 8a (CI run 4, runner-3 step-152): the
# Variants column sits ABOVE the attributes panel and the checklist, and a
# default DOWN scroll from here walks into the checklist's inner scroller.
- scrollUntilVisible:
    element:
      text: "Sync Inserts"
    direction: UP
    centerElement: true
    timeout: 15000
- tapOn: "Sync Inserts"

- extendedWaitUntil:
    visible: "Reconcile Inserts"
    timeout: 240000

# Our row came back as a Ready set under OUR name — the reconcile modal's own
# half of the id-keyed contract. If it had been rebuilt from the marketplace
# items instead, this row would be titled "…Series 2" again.
- tapOn:
    id: "Filter NeonBinder sets"
    waitToSettleTimeoutMs: 250
- inputText: "NB211-${ATTEMPT_ID}"
- extendedWaitUntil:
    visible:
      text: ".*Ready \\(1 of [0-9]+\\).*"
    timeout: 10000
- assertVisible:
    id: "NeonBinder set name for Dugout Collection Artists Proofs NB211-${ATTEMPT_ID}"

# Save with NO edits. Filtering first is what pulls the footer above the fold —
# the dialog body is its own overflow-y-auto scroller and Maestro scrolls the
# PAGE, not that container (see STEP 1's note).
- scrollUntilVisible:
    element:
      text: ".*Save [0-9]+ sets.*"
    centerElement: true
    timeout: 15000
- tapOn:
    text: ".*Save [0-9]+ sets.*"
- extendedWaitUntil:
    notVisible: "Reconcile Inserts"
    timeout: 60000

# ============================================================
# 8c. THE ROW SURVIVED, STILL ALONE AND STILL OURS
#
# RE-DRILL FIRST, same reason as STEP 2: saving leaves the columns row at the
# horizontal offset the dialog was opened from, and Maestro has no horizontal
# scroll to recover it. The re-drill also makes this a fresh read from Convex
# rather than a re-render of state the dialog left behind.
# ============================================================

- runFlow:
    file: util-drill-to-2024-topps-chrome.yaml
    env:
      SPORT: "Baseball"
      YEAR: "1996"
      MANUFACTURER: "Score"
      SET: "Score"

- scrollUntilVisible:
    element:
      text: "Insert"
    centerElement: true
    timeout: 15000
- tapOn: "Insert"

- extendedWaitUntil:
    visible: ".*Search inserts.*"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: ".*Search inserts.*"
    centerElement: true
    timeout: 10000
- tapOn:
    text: ".*Search inserts.*"
    waitToSettleTimeoutMs: 250
- inputText: "Artist"

# THE ACCEPTANCE CRITERION at set-row level: our name, on a row that is still
# the ONLY Artist's Proofs row. A delete-and-reinsert would show BSC's two
# series names back as two separate rows.
- extendedWaitUntil:
    visible:
      text: ".*Dugout Collection Artists Proofs NB211-${ATTEMPT_ID}.*"
      below:
        id: "Search inserts"
    timeout: 20000
- assertNotVisible:
    text: ".*Artist.s Proofs Series [12].*"

# ============================================================
# 8d. DECLINE BOTH MARKETPLACE NAMES
#
# Our name now disagrees with BOTH sides — BSC calls this row one of its two
# series, SportLots calls it the combined set — so the column offers a
# suggestion per side. Nothing has been written to `value`; the dialog is the
# only door from a suggestion to a rename, and Decline is the door marked
# "never ask me this again".
#
# The affordance's count is matched loosely ON PURPOSE. The reconciler names a
# Ready set from its BSC item, and several of 1996 Score's other inserts
# legitimately carry a SportLots label that differs — so the COLUMN's total is a
# property of the marketplace data, not of this flow. Every assertion that has
# to be exact is scoped to OUR row instead, via the unique NB211 marker in each
# accessible name, and to the footer tally, which counts only decisions this
# flow pressed.
# ============================================================

- scrollUntilVisible:
    element:
      id: ".*names? to check — review suggestions"
    centerElement: true
    timeout: 15000
- tapOn:
    id: ".*names? to check — review suggestions"

- extendedWaitUntil:
    visible: "Name Check — Inserts"
    timeout: 7000

# Both side badges, for OUR row. The SportLots label is a fixed fact of the
# fixture (one combined set); which of BSC's two series holds the primary slot
# is not, so that one is matched on its shape.
- assertVisible:
    text: '.*SportLots calls it "Dugout Collection Artists Proofs".*'
- assertVisible:
    text: '.*BSC calls it "Dugout Collection Artist.s Proofs Series [12]".*'

# The accessible name leads with the VISIBLE word (WCAG 2.5.3 Label in Name),
# then the per-row context: `Keep mine — keep "X"; stop suggesting BSC's "Y"`
# (SelectorSyncReviewModal.tsx). The dash is an em dash, U+2014, and the second
# "keep" is lower-case because it is no longer the first word.
#
# `id:` is a full-string REGEX in Maestro, so the marketplace label is left as
# `.*` while the row half — the part that must not be ambiguous — is pinned to
# this attempt's marker.
- tapOn:
    id: "Keep mine — keep \"Dugout Collection Artists Proofs NB211-${ATTEMPT_ID}\"; stop suggesting BSC's \".*\""
- tapOn:
    id: "Keep mine — keep \"Dugout Collection Artists Proofs NB211-${ATTEMPT_ID}\"; stop suggesting SportLots's \".*\""

# The running total is the only feedback that the presses registered, and it is
# exact: two declines, nothing accepted. A stray accept here would rename the
# row, which is the one outcome this step exists to rule out.
- assertVisible: "0 to take · 2 to keep"

- tapOn:
    id: "Apply decisions"

# The outcome line is the SERVER's own tally, so it proves the declines were
# written rather than counted as stale or skipped.
- extendedWaitUntil:
    visible: "2 declined"
    timeout: 7000

# AND THE NAME IS STILL OURS. A decline records the label we refused; it must
# never touch `value`.
- assertVisible:
    text: ".*Dugout Collection Artists Proofs NB211-${ATTEMPT_ID}.*"
    below:
      id: "Search inserts"

# ============================================================
# STEP 9 — REMOVING A SOURCE ASKS FIRST, AND SAYS HOW MANY CARDS CAME FROM IT
#          (NEO-219)
#
# WHAT A USER SEES. Every attached source chip has an "×". Pressing it no longer
# detaches on the spot: it turns the chip into a question that names the source
# AND the number of cards NeonBinder fetched through it — the one number the
# operator cannot get back once the link is dropped. Cancel puts the chip back
# exactly as it was.
#
# WHY IT RIDES ON THIS FLOW, and why it is SAFE here. The count is per SOURCE,
# not per set, and the only place in the suite where a NeonBinder row has more
# than one source is this one: 220 cards split 110/110 across BSC's two series.
# On the ordinary 1:1 anchor the sentence could only ever repeat the set's own
# total, which proves nothing about the per-source count. This flow already
# owns that shape, and SET-REGISTRY.md's sole-writer rule forbids a second flow
# from building it.
#
# NON-DESTRUCTIVE (R7). This step ends on CANCEL. Nothing is detached, no slot
# key is retired, no card's marketplace ref is orphaned — the set is left with
# both BSC sources and 220 paired cards, exactly as STEP 8 left it. That is the
# contract recorded in SET-REGISTRY.md, and it is why this step may live on a
# real set at all.
#
# THE CONFIRM IS CANCELLED WITH ITS OWN "Cancel" BUTTON, not the Escape key.
# The product supports Escape here; Maestro on web does not — `pressKey: Escape`
# fails the command outright ("Keycode ESCAPE is not supported on web"), and
# Enter is the only key this suite can send. The Escape path is covered by the
# component tests.
#
# COST: ~15s (two taps, one already-resolved count, one cancel). Watch it
# against run-e2e-queue.sh's 600s per-flow kill — this flow is the longest in
# the suite.
# ============================================================

# The insert row must be the SELECTED row for its sources to be on screen: STEP
# 8c re-drilled and stopped at the "Insert" variant type, which shows no source
# panel of its own. Select the row itself, anchored below the column's filter
# so the still-typed "Artist" search pins it unambiguously.
- tapOn:
    text: ".*Dugout Collection Artists Proofs NB211-${ATTEMPT_ID}.*"
    below:
      id: "Search inserts"

# PRECONDITION, asserted before anything is pressed (R2): both BSC sources are
# still attached. Without this the cancel assertion at the end could pass on a
# panel that never had two chips.
- scrollUntilVisible:
    element:
      text: "Multi-source sets"
    centerElement: true
    timeout: 20000
- assertVisible:
    text: ".*Dugout Collection Artist.s Proofs Series 1.*"
- assertVisible:
    text: ".*Dugout Collection Artist.s Proofs Series 2.*"

# Centre the Series 1 chip so its "×" — which sits at the right-hand end of the
# same row — is fully in view before it is pressed (R8). The chip's remove
# button is reached by its accessible name; the apostrophe is matched as "." for
# the same reason every other assertion in this flow does (BSC's own punctuation
# is not something this flow should encode).
- scrollUntilVisible:
    element:
      text: ".*Dugout Collection Artist.s Proofs Series 1.*"
    centerElement: true
    timeout: 10000
- tapOn:
    id: "Remove Dugout Collection Artist.s Proofs Series 1"

# THE ACCEPTANCE CRITERION. The question names the count for THIS source — 110,
# the cards that came from Series 1 — not 220, the row's total. A per-set count
# here would read 220 and this fails.
#
# The panel subscribes to the counts as it mounts, so by now they have long
# resolved and the sentence never shows its "Counting the cards fetched from
# it…" placeholder; 7s default (R5) — this is a Convex read, not a marketplace
# call.
- extendedWaitUntil:
    visible:
      text: ".*110 cards were fetched from it; their BSC link will be dropped.*"
    timeout: 7000

# CANCEL — the question goes away and NOTHING was detached.
- tapOn:
    id: "Cancel detach Dugout Collection Artist.s Proofs Series 1"
- extendedWaitUntil:
    notVisible: ".*were fetched from it.*"
    timeout: 7000

# Both sources are still attached. This is the assertion that makes the step
# non-destructive rather than merely intended to be — and it is a POSITIVE
# check, so it cannot be satisfied by an error page the way the notVisible
# above could be.
- assertVisible:
    text: ".*Dugout Collection Artist.s Proofs Series 1.*"
- assertVisible:
    text: ".*Dugout Collection Artist.s Proofs Series 2.*"

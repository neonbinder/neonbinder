appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "A set moves to another brand of its own year from the attributes panel — the current brand is not offered, Cancel moves nothing, and the set arrives under the brand the confirm named"
tags:
  - set-selector
---
# ════════════════════════════════════════════════════════════════════════════
# R1 — ONE FEATURE (NEO-294): an operator can re-file a set under a different
# brand of the SAME YEAR, from the control beside the delete in the set's
# attributes panel. What the operator sees, and what this flow asserts:
#
#   1. `Move to another brand` opens a list of that year's brands, named as
#      such (`Brands in 2026`), with the set's CURRENT brand left out —
#      "move it to where it already is" is not offered (PART 2);
#   2. picking one raises the house ConfirmDialog, which names the set and
#      the destination and answers the question the operator actually has
#      (do my cards come with it) — and its `Cancel` moves NOTHING, leaving
#      the list still open where it was (PART 2);
#   3. confirming files the set under the chosen brand: the toast echoes the
#      SERVER's name for the destination, the panel's breadcrumb re-reads the
#      new chain, THE OPEN COLUMN FOLLOWS THE SET rather than dropping it
#      (`handleSetMoved` re-points the Manufacturers selection at the
#      destination, set still selected), and the row is really gone from the
#      old brand's column and present in the new one (PARTS 3 and 4);
#   4. it works in both directions — moving it back restores the fixture and
#      proves the control is not one-way (PART 5).
#
# MARKETPLACE-FREE, PER WORKER (R7/R7a). Everything is created under a sport
# this flow owns outright — `msb-sport-<worker>` — inside year 2026, through
# the product's own "+ Custom" forms via the drill util (R9). No ancestor
# carries a marketplace id, so neither side is ever resolvable, nothing is
# fetched, and every wait here is the 7000 bar (R5). The move itself is a
# pure NB re-parent (`rehomeSetRowsToBrand`: same `_id`, same subtree, same
# slots) and needs no marketplace to be true. The brand rows (`Topps`,
# `Panini`) and the set (`msb-a-<worker>`) are stable per worker, and PART 5
# puts the set back where it started, so a re-run finds the fixture exactly
# as it left it — no ATTEMPT_ID is needed because nothing here asserts a
# count. Prefix `msb-` and the sport are registered in SET-REGISTRY.md.
#
# WHY ITS OWN SPORT, AND NOT THE SUITE'S SHARED "E2E Test Sport <worker>".
# This flow ADDS A ROW ABOVE SET LEVEL (`Panini`), and rows in a shared
# Manufacturers column push other flows' `+ Custom` toward the fold —
# `util-drill-to-custom.yaml`'s Level-3 wait is deliberately UNSCROLLED and
# cannot recover a button under it (SET-REGISTRY.md → "Adding ROWS to a
# shared column"; it broke `team-picker-create-custom-card` in PR #226).
# `all-brands-view-lists-every-set.yaml` (`xb-sport-<worker>`) and
# `custom-set-exists-elsewhere-offers-drill.yaml` (`xp-sport-<worker>`) are
# the precedent and the shape this flow copies.
#
# WHAT THIS FLOW DELIBERATELY DOES NOT COVER, AND WHERE IT LIVES INSTEAD:
#   • THE MOVE SURVIVING A SYNC (`metadata.brandSetByOperator`). A hand-made
#     year has nothing to sync — no ids, no fetch, no re-home to survive — so
#     the claim cannot be made here at all. It belongs to
#     `known-brand-files-set-and-operator-move-sticks.yaml`, on a real year.
#   • THE CLASH REFUSAL (`<brand> already has a set called "<name>" — nothing
#     moved. Rename one of them first.`). Building it needs a DELIBERATE
#     cross-brand duplicate, which the product only allows through the custom
#     form's "Create here anyway" door — another feature's form (R1), and one
#     that would cost this flow its idempotence, since the second run could
#     not type the same name again. It is covered at the mutation and at the
#     control in `convex/brandView.test.ts` and
#     `components/SetSelector/MoveSetToBrandControl.test.tsx`.
#
# HANDLES (visible text and accessible names; never a DOM id):
#   trigger   `Move to another brand` — its visible text IS its accessible
#             name; its sibling on that header line is `Delete <set>`, a
#             different name, which is how the two are told apart
#   list      `Move to which brand?`, the group `Brands in 2026`,
#             `Move to <brand>` per option (aria-label; the visible text is
#             the bare brand name)
#   confirm   `Move "<set>" to <brand>?`, the fixed description sentence,
#             `Yes, move it`, `Cancel` — ConfirmDialog owns the only Cancel
#             on this screen, which is why the trigger is a disclosure
#   toast     `Moved to <brand>` — the panel's one `role="status"`, fixed at
#             top-20 so it is never under the fold
#   panel     the breadcrumb `<sport> › 2026 › <brand> › <set>`
#   cascade   the collapsed cards `Manufacturers: <brand> — change` and
#             `Sets: <set> — change`, which are what the post-move re-point
#             is read off
#
# NOTE ON THE LIST WHILE THE CONFIRM IS UP: it stays MOUNTED but goes
# `inert`, so Cancel comes back to the same open list on the same brands
# (PART 2 asserts exactly that). Nothing here asserts a list row's absence
# while the dialog is open, which `inert` would not have produced anyway —
# the nodes are still rendered and still visible to the driver.
#
# R2 — every negative below is paired with a positive on the same surface:
# an `assertNotVisible` alone is satisfied by a page that has fallen to its
# error boundary.
# R3 — no other flow drives this control. `all-brands-view-lists-every-set`
# builds the same shape of fixture but only READS where a set is filed.
# R4 — enters through the sign-in redirect; no in-body login.
# R9 — all drilling goes through util-drill-to-custom.yaml.
# ════════════════════════════════════════════════════════════════════════════

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# PART 1 — THE FIXTURE: TWO BRANDS IN ONE YEAR, ONE SET UNDER THE FIRST
#
# `Panini` is created first and left EMPTY: it is the destination, and a
# destination with no sets is also the destination that cannot raise the
# name-clash refusal, so PART 3's move has exactly one outcome. Both drills
# are idempotent — the util selects a row that is already there and creates
# only what is missing.
# ============================================================

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "msb-sport-${WORKER_INDEX || 0}"
      YEAR: "2026"
      MANUFACTURER: "Panini"
- assertVisible: "Sets"

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "msb-sport-${WORKER_INDEX || 0}"
      YEAR: "2026"
      MANUFACTURER: "Topps"
      SET_NAME: "msb-a-${WORKER_INDEX || 0}"
- assertVisible: "Variant Types"

# ============================================================
# PART 2 — CLAIMS 1 AND 2: THE LIST, THE CONFIRM, AND A CANCEL THAT MOVES
#          NOTHING
#
# `SetAttributesPanel` renders the move trigger in its ALWAYS-VISIBLE header
# row, beside the delete and the `Edit attributes` toggle — set rows only,
# because a brand is a set's parent and nothing else in the hierarchy has
# one. So the panel does not need opening.
#
# DOWN and centred: `SetSelector.tsx` renders the selector columns, then the
# base-mapping button, then MultiSourcePanel, then SetAttributesPanel, so the
# panel is below where the drill left the page. THIS STEP DEPENDS ON THE
# NEO-260 208px spacer in src/layouts/binder-layout.tsx for its scroll
# headroom (R8 case 1), exactly as every `Edit attributes` step does — this
# control sits on the same header line.
# ============================================================

- scrollUntilVisible:
    element:
      text: "Move to another brand"
    centerElement: true
    visibilityPercentage: 10
    waitToSettleTimeoutMs: 1000
    timeout: 7000

# HARD PRECONDITION (R2): the panel is scoped to the row this flow means, and
# the move's SIBLING on that header line is a different control with a
# different name. Nothing below is meaningful if the panel followed some
# other selection.
- assertVisible:
    id: "Delete msb-a-${WORKER_INDEX || 0}"
- assertVisible:
    text: ".*Attributes for msb-a-${WORKER_INDEX || 0}.*"

- tapOn: "Move to another brand"

# CLAIM 1. The list is a disclosure on the same button — there is no second
# dismiss, because ConfirmDialog owns the only `Cancel` on this screen. Its
# prompt and the group's accessible name are what say WHICH brands are on
# offer: the ones under this set's own year.
- extendedWaitUntil:
    visible: 'Move to which brand\?'
    timeout: 7000
- assertVisible:
    id: "Brands in 2026"
- assertVisible:
    id: "Move to Panini"
# The set's CURRENT brand is never an option. Paired with the positive
# directly above, on the same surface (R2).
- assertNotVisible:
    id: "Move to Topps"

# CLAIM 2. Centred before the tap (R8); the row sits just below the trigger
# this step already centred, so it exits at try 0. The `max-h-48` box holds
# both of this year's brands without clipping — which matters, because
# maestro-web scrolls only the window and cannot drive an inner scroller.
- scrollUntilVisible:
    element:
      id: "Move to Panini"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Move to Panini"

# The house ConfirmDialog, asserted on its HEADER and FOOTER only (README →
# "Asserting inside a dialog"). The title names both ends of the move; the
# description is fixed copy answering the question the operator actually has
# before they commit.
- extendedWaitUntil:
    visible: 'Move "msb-a-${WORKER_INDEX || 0}" to Panini\?'
    timeout: 7000
- assertVisible: "The set keeps its cards, its variants and its marketplace links — only the brand above it changes. Sync Sets will leave it where you put it."

# CANCEL MOVES NOTHING. `onCancel` clears the pending target and leaves the
# disclosure open, so the list is still there afterwards — that is the
# positive this negative is paired with (R2) — and the breadcrumb still
# reads the OLD brand, which is the claim itself.
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Yes, move it"
    timeout: 7000
- assertVisible: 'Move to which brand\?'
# A SCROLL, not a bare assert: the open list sits between the header line this
# step centred and the breadcrumb `<p>` beneath it, so the breadcrumb is a
# couple of rows further down than it was. No tap follows, so no centring —
# the scroll is the assertion (R6).
- scrollUntilVisible:
    element:
      text: ".*2026 › Topps › msb-a-${WORKER_INDEX || 0}.*"
    timeout: 7000

# ============================================================
# PART 3 — CLAIM 3: CONFIRMING FILES IT UNDER PANINI
# ============================================================

- scrollUntilVisible:
    element:
      id: "Move to Panini"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Move to Panini"
- extendedWaitUntil:
    visible: "Yes, move it"
    timeout: 7000
- tapOn: "Yes, move it"

# Three readings of one write, and the third is the one a toast cannot give.
#
#   the toast echoes the SERVER's name for the destination (`movedTo`, read
#   off the row the mutation wrote) rather than the label the list rendered,
#   so it confirms the write landed where the operator pointed;
#
#   `getAncestorChain` is a live query on this set's id, so the panel's
#   breadcrumb re-reads the chain the re-parent produced;
#
#   and THE COLUMN FOLLOWS THE SET. Every column in `SetSelector.tsx` is
#   scoped to the selected PARENT id, so a re-parent would otherwise drop the
#   row out of the open Sets column while the panel and everything below it
#   carried on describing it — the operator told two different things at
#   once. `handleSetMoved` re-points the Manufacturers selection at the
#   destination instead of clearing anything, so the collapsed card changes
#   to `Panini` in the same render with the set still selected. A regression
#   that stopped re-pointing is silent everywhere except here.
- extendedWaitUntil:
    visible: "Moved to Panini"
    timeout: 7000
- scrollUntilVisible:
    element:
      text: ".*2026 › Panini › msb-a-${WORKER_INDEX || 0}.*"
    timeout: 7000
# The collapsed cards are UP in the columns row, above the panel this step is
# standing on. No tap follows, so no centring — the scroll is the assertion
# (R6). The Sets card is asserted alongside it: together they say the set is
# still the selection AND it is now sitting under the destination brand,
# which is the whole of what re-pointing promises.
#
# visibilityPercentage: 10 — NOT a tolerance for slowness, and not a timeout
# by another name. The columns row is a HORIZONTAL scroller that maestro-web
# cannot drive, and by this point in the flow five columns are open, so the
# row is scrolled right and the Manufacturers card hangs off the LEFT edge.
# CI 35731602457 measured it at Bounds(x=-122, y=301, width=265) — 53.96%
# visible — on every retry for the full 7s, while the aria-label read
# `Manufacturers: Panini — change` and the breadcrumb read `… › Panini ›
# msb-a-7`: the re-point had happened and the default 100% bar was simply
# unsatisfiable, because no amount of UP scrolling recovers a horizontal
# clip. The card is a fixed 260px whatever the brand is called, so this
# number is a property of the layout, not of the data — and a card that had
# really gone would be pruned from the hierarchy entirely and still fail
# here. R8's note on the columns row is the same hazard PART 4 below names.
- scrollUntilVisible:
    element:
      id: "Manufacturers: Panini — change"
    direction: UP
    visibilityPercentage: 10
    timeout: 7000
- assertVisible:
    id: "Sets: msb-a-${WORKER_INDEX || 0} — change"

# ============================================================
# PART 4 — THE ROW REALLY RE-PARENTED: PRESENT UNDER PANINI, GONE FROM TOPPS
#
# R9 — a fresh navigation per column rather than re-opening a collapsed card
# (a collapsed card can sit at a negative x once enough columns are open, and
# maestro-web has no horizontal scroll to bring it back). Neither drill is
# given a SET_NAME, so neither can create a set: each stops at its brand and
# leaves that brand's own Sets column open.
# ============================================================

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "msb-sport-${WORKER_INDEX || 0}"
      YEAR: "2026"
      MANUFACTURER: "Panini"
- scrollUntilVisible:
    element:
      text: "msb-a-${WORKER_INDEX || 0}"
      below:
        text: "Sets"
    timeout: 7000

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "msb-sport-${WORKER_INDEX || 0}"
      YEAR: "2026"
      MANUFACTURER: "Topps"
# The column rendered and is empty: the idle "+ Custom" is the positive this
# negative is paired with (R2). A move that DUPLICATED instead of moving —
# the failure mode that matters, because it would split a set's cards across
# two rows — reads the set name here.
- scrollUntilVisible:
    element:
      id: "Add custom Sets"
    timeout: 7000
- assertNotVisible:
    text: "msb-a-${WORKER_INDEX || 0}"

# ============================================================
# PART 5 — CLAIM 4: AND BACK AGAIN
#
# Both directions are the same mutation, so this is not a second test of the
# same thing: it is what makes the flow idempotent (the set ends where PART 1
# put it) and it is the one step that proves the destination list is built
# from the set's CURRENT parent rather than from wherever it started.
# PART 4 just proved the row is under Panini, so this drill selects it and
# cannot create it.
# ============================================================

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "msb-sport-${WORKER_INDEX || 0}"
      YEAR: "2026"
      MANUFACTURER: "Panini"
      SET_NAME: "msb-a-${WORKER_INDEX || 0}"
- assertVisible: "Variant Types"

- scrollUntilVisible:
    element:
      text: "Move to another brand"
    centerElement: true
    visibilityPercentage: 10
    waitToSettleTimeoutMs: 1000
    timeout: 7000
- tapOn: "Move to another brand"
- extendedWaitUntil:
    visible: 'Move to which brand\?'
    timeout: 7000

# Now it is PANINI that is left out and TOPPS that is offered — the mirror of
# PART 2's pair, and the proof the list is computed from where the set is
# now.
- assertVisible:
    id: "Move to Topps"
- assertNotVisible:
    id: "Move to Panini"

- scrollUntilVisible:
    element:
      id: "Move to Topps"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Move to Topps"
- extendedWaitUntil:
    visible: 'Move "msb-a-${WORKER_INDEX || 0}" to Topps\?'
    timeout: 7000
- tapOn: "Yes, move it"
- extendedWaitUntil:
    visible: "Moved to Topps"
    timeout: 7000
- scrollUntilVisible:
    element:
      text: ".*2026 › Topps › msb-a-${WORKER_INDEX || 0}.*"
    timeout: 7000

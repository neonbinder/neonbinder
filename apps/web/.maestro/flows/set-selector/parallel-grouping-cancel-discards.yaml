appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Parallel Grouping — Cancel discards changes (reopen shows original); also closes via backdrop"
tags:
  - parallel-grouping
---
# PRODUCT-FEATURE test: Cancel discards pending groupings and does NOT persist.
# Also covers the modal's two close mechanisms (Cancel button + backdrop tap).
#
# NEO-220: neither close mechanism throws work away silently any more. Both the
# footer Cancel and a backdrop tap now ask "Discard N pending moves?" first, so
# every close in this flow is TWO steps — the close, then the confirm. The
# discard button is what still has to leave the modal, so the assertions after
# it are unchanged. (The confirm's own Cancel — "keep working" — is covered on
# the entity-review wizard, in STEP 6 of
# inserts-1996-score-one-nb-set-two-bsc-sources.yaml; repeating it here would be
# R3 duplication.)
#
# KEY PROOF: after Accept All → Cancel → reopen, the items show "Suggested"
# badges again (live auto-suggestions, not saved placements). If Cancel had
# written to the DB, the reopen would show them as persisted parallels with no
# Suggested badge. So "Suggested" on reopen == Cancel correctly discarded.
#
# IDEMPOTENCY: ATTEMPT_ID prefix-names the insert triplet so concurrent workers
# and re-runs never collide. The CI runner injects ATTEMPT_ID; the evalScript
# below provides a fallback for standalone local runs.
#
# Fully custom subtree (E2E Test Sport ${WORKER_INDEX} → 2026 → pg-cancel-<worker>-<ATTEMPT_ID>),
# every wait is the 7s default; the util owns the cold custom-subtree drill.

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

- runFlow:
    file: util-drill-to-custom-set.yaml
    env:
      SET_NAME: "pg-cancel-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
      VARIANT_TYPE: "Insert"

# ── ADD THREE CUSTOM INSERTS (<ID> Stars / <ID> Stars Gold / <ID> Stars Red) ──
# NAMING STRATEGY: ATTEMPT_ID is a PREFIX so the auto-suggestion prefix-match
# groups Gold/Red under OUR Stars, not an old bare "Stars" entry from a prior run.
# aria-label "Add custom Inserts" maps to resource-id (id:).
# centerElement: true on every scroll whose target we then tap — keeps it
# fully in view in the 1024×629 headless viewport.
#
# --- <ID> Stars ---
- scrollUntilVisible:
    element:
      id: "Add custom Inserts"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Add custom Inserts"
- assertVisible: "Add Custom Entry"
- inputText: "${ATTEMPT_ID} Stars"
- pressKey: Enter
# NEO-272: press the confirm's Create button by name. The second blind
# `pressKey: Enter` that used to stand here was the defect: maestro-web
# re-finds the focused element by an XPath built from its CLASS LIST, so it
# raced the confirm unmounting the input (CI 34592010317 attempt 2 died here
# with "no such element" on the input's own class string). The button's
# accessible name is EntityColumn.tsx's `confirmCreateLabel` —
# "Create " + LEVEL_SINGULAR[level] lower-cased.
#
# CONDITIONAL because a confirm is only ONE of two outcomes. If the typed
# value already exists in THIS column, `handleCustomSubmit` short-circuits
# (`items.find(...)` -> `onSelectExisting`), closing the form and advancing
# the cascade with no confirm ever rendered. A `notVisible: <value>` guard
# cannot rule that out — the column's max-h-[400px] scroller clips rows
# that really are there (team-picker, local run 2026-09-11). MEASURED locally 2026-09-11: the confirm is up in 0.34-0.38s, so
# a `when:` that finds it costs nothing; a miss pays the ~7s condition poll
# and only on the already-existed path. The hard result gate is the
# "Add Custom Entry" check below — the form is gone either way, so this
# branch cannot fall through silently (R2).
- runFlow:
    when:
      visible:
        id: "Create insert"
    commands:
      - tapOn:
          id: "Create insert"
- assertNotVisible: "Add Custom Entry"

# --- <ID> Stars Gold ---
- scrollUntilVisible:
    element:
      id: "Add custom Inserts"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Add custom Inserts"
- assertVisible: "Add Custom Entry"
- inputText: "${ATTEMPT_ID} Stars Gold"
- pressKey: Enter
# NEO-272: press the confirm's Create button by name, never a second blind
# `pressKey: Enter`; conditional because an already-existing value closes the
# form with no confirm — see the first occurrence in this file for both.
- runFlow:
    when:
      visible:
        id: "Create insert"
    commands:
      - tapOn:
          id: "Create insert"
- assertNotVisible: "Add Custom Entry"

# --- <ID> Stars Red (third entry keeps the Group Parallels button layout stable) ---
- scrollUntilVisible:
    element:
      id: "Add custom Inserts"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Add custom Inserts"
- assertVisible: "Add Custom Entry"
- inputText: "${ATTEMPT_ID} Stars Red"
- pressKey: Enter
# NEO-272: press the confirm's Create button by name, never a second blind
# `pressKey: Enter`; conditional because an already-existing value closes the
# form with no confirm — see the first occurrence in this file for both.
- runFlow:
    when:
      visible:
        id: "Create insert"
    commands:
      - tapOn:
          id: "Create insert"
- assertNotVisible: "Add Custom Entry"

# ── OPEN MODAL → ACCEPT ALL (places <ID> Stars Gold + <ID> Stars Red under <ID> Stars) ─
- scrollUntilVisible:
    element:
      text: "Group Parallels"
    centerElement: true
    timeout: 7000
- tapOn: "Group Parallels"
- assertVisible: ".*Drag inserts under a parent.*"
- assertVisible: "Top-level inserts"
- assertVisible: ".*Accept all suggestions.*"
# Center the Accept All button before tapping — modal footer clips at 1024×629.
- scrollUntilVisible:
    element:
      text: ".*Accept all suggestions.*"
    centerElement: true
    timeout: 7000
- tapOn: ".*Accept all suggestions.*"
- assertVisible: ".*[0-9]+ promotion.*"
- assertVisible: ".*Parallels of.*${ATTEMPT_ID} Stars.*"

# ── CANCEL (close #1, via the Cancel button) discards the pending promotion ─
- tapOn: "Cancel"
# NEO-220 — the confirm. There ARE pending moves (Accept All above), so the
# modal asks before throwing them away. The dialog's own HEADING also begins
# "Discard …", so anchor the tap below the explanation sentence to be certain
# it lands on the BUTTON and not on the title.
- tapOn:
    text: "Discard .*"
    below:
      text: ".*Nothing has been saved yet.*"
- assertNotVisible: ".*Drag inserts under a parent.*"

# ── EXACT DATA CHECK: all three inserts still top-level after Cancel ─────────
# Cancel (button close) returns the Inserts column to idle. In first-run state
# the column is expanded (no selection) and shows all three rows directly.
# On retries the flow re-adds <ID> Stars Red via + Custom — but it already
# exists, so EntityColumn's handleCustomSubmit finds it via onSelectExisting,
# calls handleVariantSelect, and leaves the column in collapsed-pill mode
# (selectedVariantId != null, variantExpanded = false).
#
# Strategy: scroll the "+ Custom" button into view (always present in idle mode
# regardless of expanded/collapsed state), then detect whether the "Inserts" h2
# header is visible. The h2 only appears in expanded state; its absence means
# the column is showing a collapsed pill. When collapsed, tap the pill (any
# .*<ID> Stars.* element above the "+ Custom" button) to call setExpanded(true).
# After expansion, assert all three rows are top-level.
- scrollUntilVisible:
    element:
      id: "Add custom Inserts"
    direction: UP
    centerElement: true
    timeout: 7000
- runFlow:
    when:
      notVisible:
        text: "^Inserts$"
    commands:
      # Column is collapsed — a selected insert is shown as a pill above
      # the action buttons. Tap it to call setExpanded(true).
      - tapOn:
          text: ".*${ATTEMPT_ID} Stars.*"
          above:
            id: "Add custom Inserts"
      - extendedWaitUntil:
          visible:
            text: "^Inserts$"
- assertVisible:
    text: "^${ATTEMPT_ID} Stars$"
- assertVisible: "${ATTEMPT_ID} Stars Gold"
- assertVisible: "${ATTEMPT_ID} Stars Red"

# ── RE-OPEN → original state: items are SUGGESTIONS again, not persisted ────
# (CANCEL-button proof: after Accept All → Cancel → reopen, "Suggested" badges
# are present because Cancel correctly discarded the pending promotion.)
- scrollUntilVisible:
    element:
      text: "Group Parallels"
    centerElement: true
    timeout: 7000
- tapOn: "Group Parallels"
- assertVisible: ".*Drag inserts under a parent.*"
- assertVisible: "Top-level inserts"
# Footer re-shows promotions (auto-suggested), and the rows carry "Suggested"
# badges — the proof that Cancel never wrote to the DB.
- assertVisible: ".*[0-9]+ promotion.*"
- scrollUntilVisible:
    element:
      text: "Suggested"
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000
# R6: no redundant assertVisible "Suggested" here — scrollUntilVisible already
# confirmed visibility.
- assertVisible: ".*Save [0-9]+ change.*"

# ── BACKDROP PROOF: Accept All → backdrop-close → reopen → assert "Suggested" ─
# SETUP: Accept All inside the already-open modal (items are currently showing
# "Suggested" state from the Cancel-proof above). After Accept All the items
# should be promoted (pending, not yet saved).
- scrollUntilVisible:
    element:
      text: ".*Accept all suggestions.*"
    centerElement: true
    timeout: 7000
- tapOn: ".*Accept all suggestions.*"
- assertVisible: ".*[0-9]+ promotion.*"
- assertVisible: ".*Parallels of.*${ATTEMPT_ID} Stars.*"

# CLOSE #2: via BACKDROP tap (far-left edge, outside the modal panel).
# This should discard the pending Accept All — NOT write it to the DB.
- tapOn:
    point: "2%, 50%"
# NEO-220 — the backdrop asks the SAME question the footer Cancel does. That is
# the point of the change: there is one door out, so a stray click on the page
# behind the modal can no longer erase an Accept All.
- tapOn:
    text: "Discard .*"
    below:
      text: ".*Nothing has been saved yet.*"
- assertNotVisible: ".*Drag inserts under a parent.*"

# RE-OPEN to verify backdrop discarded the pending promotion.
- scrollUntilVisible:
    element:
      text: "Group Parallels"
    centerElement: true
    timeout: 7000
- tapOn: "Group Parallels"
- assertVisible: ".*Drag inserts under a parent.*"

# PROOF: items carry "Suggested" badges again — if backdrop had persisted the
# Accept All, reopening would show them as saved parallels with no "Suggested"
# badge. "Suggested" on reopen == backdrop correctly discarded.
- scrollUntilVisible:
    element:
      text: "Suggested"
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000
# R6: no redundant assertVisible here — scrollUntilVisible already confirmed it.
- assertVisible: ".*Save [0-9]+ change.*"

# ── CLOSE the modal and verify columns intact ───────────────────────────────
# The re-opened modal auto-suggests again ("Save N changes" was just asserted),
# so this close is dirty too and gets the same confirm.
- tapOn: "Cancel"
- tapOn:
    text: "Discard .*"
    below:
      text: ".*Nothing has been saved yet.*"
- assertNotVisible: ".*Drag inserts under a parent.*"

# The Inserts column action buttons are present and the modal is gone.
# R6 applied: scrollUntilVisible already asserts visibility; no redundant
# assertVisible after the scroll.
- scrollUntilVisible:
    element:
      id: "Add custom Inserts"
    visibilityPercentage: 50
    centerElement: true
    timeout: 7000
- assertVisible: "Group Parallels"

appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Parallel Grouping — reject (✕) button moves a parallel back to top-level inserts"
tags:
  - parallel-grouping
---
# PRODUCT-FEATURE test: the per-row ✕ (reject) button inside a "Parallels of X"
# card. Add <ID> Stars / <ID> Stars Gold / <ID> Champions:
#   - Stars Gold PREFIX-MATCHES Stars → auto-suggested as a parallel
#   - Champions does NOT prefix-match → stays top-level (gives 3 inserts for a
#     stable Group Parallels button)
# Accept All places Stars Gold under Stars; the ✕ ungroups it. Net diff is zero,
# so the footer reverts to "No changes yet" and Save disables — a subtle state
# invariant worth pinning.
#
# IDEMPOTENCY: ATTEMPT_ID is a per-run prefix so accumulated entries from prior
# runs (bare "Stars", "Stars Gold", etc.) never act as prefix-match parents for
# THIS run's triplet. The fallback evalScript below produces a stable 4-digit ID
# for standalone runs.
#
# Fully custom subtree (E2E Test Sport ${WORKER_INDEX} → 2026 → pg-reject-<worker>-<ATTEMPT_ID>);
# every wait is the 7s default; the util owns the cold custom-subtree drill.

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

- runFlow:
    file: util-drill-to-custom-set.yaml
    env:
      SET_NAME: "pg-reject-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
      VARIANT_TYPE: "Insert"

# ── ADD THREE CUSTOM INSERTS (<ID> Stars / <ID> Stars Gold / <ID> Champions) ──
# NAMING STRATEGY: ATTEMPT_ID is used as a PREFIX so that the auto-suggestion
# algorithm only sees THIS run's triplet as related — no old bare "Stars" entry
# (from runs before ATTEMPT_ID was active) can steal the parent role.
#   - "${ATTEMPT_ID} Stars Gold" prefix-matches "${ATTEMPT_ID} Stars" → suggested
#   - "${ATTEMPT_ID} Champions" does NOT prefix-match → stays top-level
#
# aria-label "Add custom Inserts" maps to resource-id (id:); centerElement on
# every scroll whose target is then tapped — keeps it fully in view in the
# 1024×629 headless viewport.
#
# Non-scroll settle guard: the Inserts column can be mid-re-render immediately
# after util-drill returns. Let it settle before the first swipe fires.
- extendedWaitUntil:
    visible:
      id: "Add custom Inserts"

# --- <ID> Stars ---
- scrollUntilVisible:
    element:
      id: "Add custom Inserts"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Add custom Inserts"
- assertVisible: "Add Custom Entry"
- inputText: "${ATTEMPT_ID} Stars"
- pressKey: Enter
# NEO-272: press the confirm's Create button by name. The second blind
# `pressKey: Enter` that used to stand here was the defect: maestro-web
# re-finds the focused element by an XPath built from its CLASS LIST, so it
# raced the confirm unmounting the input (CI 34592010317 attempt 2 died here
# with "no such element" on the input's own class string). The button's
# accessible name is EntityColumn.tsx's `confirmCreateLabel` —
# "Create " + LEVEL_SINGULAR[level] lower-cased.
#
# CONDITIONAL because a confirm is only ONE of two outcomes. If the typed
# value already exists in THIS column, `handleCustomSubmit` short-circuits
# (`items.find(...)` -> `onSelectExisting`), closing the form and advancing
# the cascade with no confirm ever rendered. A `notVisible: <value>` guard
# cannot rule that out — the column's max-h-[400px] scroller clips rows
# that really are there (team-picker, local run 2026-09-11). MEASURED locally 2026-09-11: the confirm is up in 0.34-0.38s, so
# a `when:` that finds it costs nothing; a miss pays the ~7s condition poll
# and only on the already-existed path. The hard result gate is the
# "Add Custom Entry" check below — the form is gone either way, so this
# branch cannot fall through silently (R2).
- runFlow:
    when:
      visible:
        id: "Create insert"
    commands:
      - tapOn:
          id: "Create insert"
- assertNotVisible: "Add Custom Entry"

# --- <ID> Stars Gold (prefix-matches Stars → suggested parallel) ---
- scrollUntilVisible:
    element:
      id: "Add custom Inserts"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Add custom Inserts"
- assertVisible: "Add Custom Entry"
- inputText: "${ATTEMPT_ID} Stars Gold"
- pressKey: Enter
# NEO-272: press the confirm's Create button by name, never a second blind
# `pressKey: Enter`; conditional because an already-existing value closes the
# form with no confirm — see the first occurrence in this file for both.
- runFlow:
    when:
      visible:
        id: "Create insert"
    commands:
      - tapOn:
          id: "Create insert"
- assertNotVisible: "Add Custom Entry"

# --- <ID> Champions (no prefix match → stays top-level; gives 3 inserts) ---
- scrollUntilVisible:
    element:
      id: "Add custom Inserts"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Add custom Inserts"
- assertVisible: "Add Custom Entry"
- inputText: "${ATTEMPT_ID} Champions"
- pressKey: Enter
# NEO-272: press the confirm's Create button by name, never a second blind
# `pressKey: Enter`; conditional because an already-existing value closes the
# form with no confirm — see the first occurrence in this file for both.
- runFlow:
    when:
      visible:
        id: "Create insert"
    commands:
      - tapOn:
          id: "Create insert"
- assertNotVisible: "Add Custom Entry"
- assertVisible:
    text: ".*${ATTEMPT_ID} Champions.*"

# ── OPEN MODAL → ACCEPT ALL (places Stars Gold under Stars) ─────────────────
# centerElement: true on the Group Parallels scroll — the button may sit near
# y≈425–447 after 3 inserts are added; centering guards against the edge-clipping
# zone in edge-case viewport states.
- scrollUntilVisible:
    element:
      text: "Group Parallels"
    centerElement: true
    timeout: 7000
- tapOn: "Group Parallels"
- assertVisible: ".*Drag inserts under a parent.*"
- assertVisible: "Top-level inserts"
- assertVisible: ".*Accept all suggestions.*"

# Center the Accept All button before tapping — modal footer clips at 1024×629.
- scrollUntilVisible:
    element:
      text: ".*Accept all suggestions.*"
    centerElement: true
    timeout: 7000
- tapOn: ".*Accept all suggestions.*"
- assertVisible: ".*[0-9]+ promotion.*"
# Stars Gold should now be inside the "Parallels of <ID> Stars" zone.
- assertVisible:
    text: ".*Parallels of.*${ATTEMPT_ID} Stars.*"

# ── TAP ✕ NEXT TO "<ID> Stars Gold" ────────────────────────────────────────
# NEO-300 REMOVED THE AUTO-SCROLL this step used to ride on. The modal used to
# `scrollIntoView` the LAST ✕ on open and on every change; it now opens at
# scrollTop 0 and never moves on its own (ParallelGroupingModal.test.tsx pins
# that). So the flow has to put the ✕ inside the body's viewport itself.
#
# WHY IT IS CLIPPED AT scrollTop 0. The "Parallels of …" boxes are sorted by
# name, so "<ID> Champions"' (empty) box comes FIRST and "<ID> Stars"' box —
# holding Stars Gold, the only ✕ — is the LAST thing in the body. Green CI
# runs 35948573036 and PR #277's show the modal at its max-h (Accept all at
# y=48, footer Cancel at y=545) and the auto-scroll parking the ✕ at
# [799,491][834,527] with its bottom on the body's bottom edge (~529): its
# natural place is below that, UNDER THE FOOTER. Maestro does not see the
# body's clip (README → "Asserting inside a dialog") and would tap the ✕'s
# centre anyway — x≈816 in the footer band is the Save button (x≈757-864), which at that
# moment reads "Save 1 change".
#
# `scrollUntilVisible` cannot help: its swipe moves the WINDOW and this is a
# `fixed inset-0` portal (R8 case 2 — the modal's footer Save held its bounds
# across every centring try, move-parallels-of-inserts-custom.yaml). The
# body is scrolled with a real touch swipe instead (maestro-web swipes with a
# TOUCH pointer, so the scroller under the finger moves), as
# flagship-colour-is-a-parallel-both-ways.yaml (2026 Bowman, STEP 2) does
# inside ReconciliationModal. PIN THE BODY TO ITS END: the ✕ is the last row of the
# last box, so at maximum scroll it sits ~30px above the body's bottom (the
# box's p-3 + border + the body's pb-4) — exactly where the old auto-scroll
# parked it, and fully inside the viewport. One swipe is ~312px (75%→25% of
# the 625px Maestro measures) and the body's overflow here is one DropZone at most (~80-130px:
# modal max-h 566 against the content of 3 rows and 2 boxes), so a second
# swipe is not needed; a swipe past the end is a no-op either way.
#
# THE START POINT: x=13% (~133px of the 1024 Maestro scales against) is
# inside the body's own 24px left padding. The modal is max-w-3xl (768px)
# centred in the 1009px layout viewport (1024 less the scrollbar; the same
# runs put "Accept all" at x=658-864, i.e. the header's right padding ends at
# 888), so the modal spans ~121-889, its body's left padding ~122-145, and
# the drop zones begin at ~146 with rows inside them from ~160. The touch
# never begins on a row (rows are dnd-kit draggables: a touch drag on one
# would start a DRAG) and never on the backdrop left of ~121 (a backdrop
# press asks to discard). y=75% (~469) is inside the body, whose band here
# is ~117-529.
# No settle needed after it: the tap re-reads the hierarchy.
- swipe:
    start: "13%, 75%"
    end: "13%, 25%"
# aria-label maps to resource-id (id: matcher). The hard asserts below ("No
# changes yet", Gold back at top level) are what prove the tap landed on the
# ✕ and not on the footer.
- tapOn:
    id: "Remove ${ATTEMPT_ID} Stars Gold from parallels"

# ── VERIFY: net diff zero → footer "No changes yet", Gold back at top-level ─
# The footer status span shows "No changes yet" when totalChanges === 0.
# This is the authoritative zero-diff signal. The Save button simultaneously
# reads "No changes" (button label), but "No changes" is a substring of
# "No changes yet" — asserting both would target the same elements. We assert
# only the footer status text, which is the distinct, unique zero-diff indicator.
- assertVisible: "No changes yet"
# "No changes yet" is the AUTHORITATIVE proof the reject worked.
# Accept All made +1 promotion; the ✕ reject made −1 (demoting Gold back to
# top-level); net diff is zero → footer reads "No changes yet". That accounting
# signal is stronger than any zone-visibility check: the product intentionally
# keeps the now-empty "Parallels of <ID> Stars" zone visible as a drop target,
# so assertNotVisible on that heading can never pass. We do NOT assert it.
# assertVisible on Stars Gold confirms the item itself is visible at top level.
- assertVisible:
    text: ".*${ATTEMPT_ID} Stars Gold.*"

# ── CLOSE ───────────────────────────────────────────────────────────────────
- tapOn: "Cancel"
- assertNotVisible: ".*Drag inserts under a parent.*"

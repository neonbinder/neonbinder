appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Reconcile — SportLots twins show their ids, filter cleanly, make their own sets by id and block Save on one title; the twin that is no parallel of the Base is set aside (NEO-325, read-only)"
tags:
  - set-selector
---
# ════════════════════════════════════════════════════════════════════════════
# R1 — ONE FEATURE: THE PARALLEL RECONCILE TELLS SPORTLOTS TWINS APART — BY
# ID, AND BY WHETHER EACH ONE IS THE BASE'S PARALLEL — AND WILL NOT SAVE TWO
# SETS NOBODY CAN TELL APART (NEO-325). SportLots lists distinct sets under
# one name. On live data, under Baseball → 2024 → Topps → Topps Chrome ›
# `Parallel` (NB role `parallel`, Base saved with 335 cards):
#
#   1. Two SportLots sets that share a name each carry their own id in the
#      visible text AND the accessible name: `Make its own set: <name>
#      (#<id>)`. A name SportLots does not repeat is unchanged (every other
#      flow's `Make its own set: <name>` keeps matching).
#   2. Filtering the SportLots column leaves no stale twin behind: when the
#      query stops matching the twins, both rows go (the NEO-325 symptom was a
#      duplicate React key leaving a same-named row on screen after the list
#      shrank).
#   3. `Make its own set` acts on the row that was pressed, never on the first
#      row that happens to share its name: the new Ready set's chip names the
#      pressed id, and the OTHER twin stays in Pending under its own id. Both
#      twins are promoted, one after the other, so the claim holds whichever
#      of the two SportLots lists first (the order is SportLots', and a
#      name-keyed resolver is only wrong for the second).
#   4. Two Ready sets with one title block Save (Jason, 2026-10-08): the
#      footer says "Two sets are both named “<title>”. Rename one so you can
#      tell them apart." and Save is disabled. Renaming either set clears the
#      line and enables Save. Save is never pressed; the flow cancels out.
#   5. THE BASE CHECK (Jason, 2026-10-09; runs FIRST, STEP 2b). Every pending
#      marketplace set is checked against NB's saved Base (card count and
#      first card, `lib/cards/base-match.ts`). SportLots' two "Chrome Black
#      Refractor" sets are the reason it exists: one is the Black Refractor
#      parallel of Topps Chrome (it MATCHES — it stays listed and says so),
#      the other is the Topps Chrome Black set (it does NOT — it is set aside
#      behind the column's "N that don't match the Base" toggle and, revealed,
#      carries its reason "Doesn't match the Base — …"). Closing the toggle
#      takes it away again. Same-name twins are the sharpest proof the check
#      is per id, not per name: one name, two verdicts.
#      The Chrome Update Sapphire twins (claims 1–4's fixture) are a
#      different product (USCS-numbered), so they are set aside too; the
#      toggle is left OPEN for STEPS 3–4 and claims 1–4 are proved on the
#      revealed rows, each first awaited with its own "Doesn't match" reason.
#
# Unit tests cover the reducer and the save payload (ReconciliationModal
# .duplicates.test.tsx) and the Base rules (base-match / baseMatchProbe
# tests); this flow proves the rendered dialog on SportLots' real list and a
# real probe of SportLots' real sets.
#
# ── READ-ONLY (R7, R7a) ─────────────────────────────────────────────────────
#   2024 Topps Chrome is the shared anchor (SET-REGISTRY.md → "Read-only
#   consumers of the shared real set"). This flow opens the Parallels
#   reconcile with the column's own `Sync Parallels` and NEVER presses Save:
#   the reconcile is client state (ReconciliationModal's reducer), and
#   `VariantForm` writes only in `handleReconciliationConfirm`. A title edit
#   is a RENAME in that same client state (committed on blur, still unsaved).
#   The flow ends with Cancel → `Discard N set changes`, which closes the
#   dialog and writes nothing (`requestClose` → ConfirmDialog → `onClose`).
#   Opening the dialog fetches each marketplace's list
#   (`setReconciliation.fetchRawOptions`, an action that writes nothing).
#   The Base check reads too and stores nothing: one query for the Base's
#   signature (`baseMatchProbe.getBaseSignatureForVariantType`) and
#   read-only probe actions per batch of pending sets (`probeSlFirstPage`,
#   `probeSlCount`, `probeBscSets`); the verdicts die with the dialog, and
#   closing it cancels the queue (a call already in flight finishes on the
#   server and is ignored).
#
#   Claim 4's "Save is disabled" is therefore never proved by PRESSING Save:
#   if the block regressed, that press would write two new parallels onto
#   the shared anchor. Maestro web cannot read `disabled` either (maestro-web
#   reports no enabled state, so an `enabled:` selector matches nothing), so
#   the flow reads the blocked button by the reason it carries — see STEP 6.
#
#   SAVE SITS UNDER THE SPORTLOTS COLUMN'S RIGHT EDGE. The footer's Save
#   (x≈877-983, y≈545) is at the same x as every row's `Make its own set`
#   (x≈858-976) and the search box's `×` (x≈959-979). Maestro does not see
#   the body's clip (memory: inner-scroller-clip-is-invisible-to-maestro), so
#   a row button scrolled under the footer is still "visible" and a tap on it
#   lands on SAVE — a write to the shared anchor. Every tap at that x is
#   therefore preceded by a GUARD (an element known to sit BELOW the target
#   is asserted ABOVE the footer's `Cancel`), so a layout change fails the
#   flow by name instead of saving. `above:`/`below:` compare TOP edges.
#
#   Proving the link AFTER a save (the saved row's Attach sets pane no longer
#   offers the attached twin's `id:`) needs a write to a real set, which only
#   that set's sole writer may make, and the obvious writer here
#   (`setup.yaml`'s Topps Chrome `Parallel` reconcile) would file "Chrome
#   Update Sapphire" as a parallel of Topps Chrome and move the 41 that
#   `base-parallels-build-from-section` pins. So the after-save proof lives in
#   its own sole-writer flow on a different real set,
#   `reconcile-sportlots-twins-save-each-to-its-own-set.yaml` (2024 Topps ›
#   Topps › Insert, approved by Jason 2026-10-08) — see SET-REGISTRY.md →
#   "SportLots twin names (NEO-325)". That set's `Insert` has NB role
#   `insert`, so the Base check never runs there.
#
# ── THE FIXTURES: REAL SPORTLOTS TWINS ──────────────────────────────────────
#   CHROME UPDATE SAPPHIRE (claims 1–4). SportLots lists TWO sets named
#   "2024 Topps Chrome Update Sapphire" — ids 323331 and 326059, each with its
#   own cards (USCS18 … USCS346 under one, USCS24 … USCS345 under the other).
#   Measured 2026-10-08 on SportLots' public search (each row's set id + set
#   name): the only same-name pair among the 187 SportLots sets of 2024 Topps
#   Chrome with stock. The dealer list the adapter reads (`fetchSetNames`) is
#   the brand's whole 2024 list, brand-stripped, so both arrive as "Chrome
#   Update Sapphire" — under the dialog's default SportLots prefix filter
#   ("chrome"), so "Show all SportLots items" is not needed. SportLots could
#   merge the two one day; this flow then fails by name at its first twin
#   assert, and the registry section says how to find a replacement.
#   The same list holds "Chrome Update Sapphire Black Sapphire Refractor"
#   (326060), the row that stays when the filter narrows past the twins.
#
#   CHROME BLACK REFRACTOR (claim 5). The dealer list also holds a twin the
#   public search cannot see (no stock on one side): "Chrome Black
#   Refractor" #305604 / #309103 (live dialog, 2026-10-08). MEASURED on CI
#   37960551124 (the sleeves' tooltips): 309103 `Matches the Base` and stays
#   listed; 305604 `Doesn't match the Base — first #1 Mookie Betts (Base:
#   300 on SportLots, first #1 Shohei Ohtani)` and is set aside. If BOTH are
#   ever set aside (e.g. SportLots' parallel lists fewer cards than the
#   Base's SportLots-linked count), the flow fails at its first live wait,
#   by name: that is a finding about the fixture or the count rule, never a
#   reason to loosen the assert.
#
# ── NEO-287: PAUSED ─────────────────────────────────────────────────────────
#   Under `PAUSED_PLATFORMS=sportlots` there is no SportLots list and no
#   twin, and `Sync Parallels` with one marketplace takes the
#   single-platform STORE path — a write this read-only flow must not make.
#   So the paused branch does not press it; it asserts the column it would
#   have pressed (the drill landed, the button is there). The twin claim has
#   no paused form, and neither does claim 5 (its fixture is SportLots').
#   (README → "Operator switches".)
#
# ── R5 ──────────────────────────────────────────────────────────────────────
#   7000 on every step but these, each a LIVE marketplace round-trip (R5's
#   marketplace exception), named at its site:
#     - the wait for the dialog after `Sync Parallels` — BSC + SportLots'
#       lists (setup.yaml measures this column's fetches at ~2s);
#     - the Base check's verdicts (STEP 2b, STEP 3) — each is a SportLots
#       probe of real sets: a first-page read (32 ids a call, 8 at a time on
#       the server) and, for a set whose first card agrees, a COUNT walk of
#       every page; the dialog's queue runs two calls at a time and starts
#       the moment it opens, so a typed query waits behind up to two calls
#       already in flight. MEASURE: 120000 is a first-run ceiling, not a
#       measurement. Read each wait's elapsed time from `maestro.log` on the
#       first green CI run and pin the ceiling to it with headroom.
#
# ── R8 INSIDE THE DIALOG ────────────────────────────────────────────────────
#   The dialog is a `fixed inset-0` portal whose body is its only scroller,
#   so `scrollUntilVisible` cannot move it (R8 case 2) and Maestro does not
#   see the body's clip. The body is moved with TOUCH swipes started at x=3%,
#   in the body's own padding (never on a dnd-kit row): two DOWN pin it to
#   the top; one FULL touch UP (75%→25%, ~312px) from there lifts the
#   SportLots search box into the band; one more partial UP (75%→60%, ~94px)
#   lifts the twins' row buttons clear of the footer for STEP 4's taps.
#   Ready is filtered to nothing and BSC to nothing while the SportLots rows
#   are worked. Never pin to the END here: the SportLots column is long even
#   narrowed (STEP 3, STEP 4), so its end is far below the twins.
#
#   MEASURED BEFORE THE BASE CHECK (local run 2026-10-08, pinned top, Ready
#   and BSC narrowed): body band ~124-529 (footer `Cancel` at y=545), `Filter
#   NeonBinder sets` y=205, `Filter BSC items` and `Search SportLots items`
#   y=383, the twins' row buttons at ~492 / ~540 (pitch 48).
#   WHAT THE BASE CHECK ADDS (estimated from the markup, NOT MEASURED):
#   above each column's search box, a counter line ("Checking against Base —
#   X of Y" → "Checked against Base — A match, B don't") and a strip of one
#   sleeve per set the check reaches (capped at 200, ~33 to a 463px row:
#   ~7 rows for SportLots' "chrome" list, ~1-2 for BSC's) — ~155px on the
#   SportLots column, ~50px on BSC's; below the SportLots search box and its
#   two checkboxes, the toggle (~32px); and on every set-aside row, its
#   reason line (11px, likely two lines on a twin: ~35px). Estimated
#   positions: `Filter BSC items` ~430 at the pinned top (in the band, tapped
#   there); `Search SportLots items` ~540 at the pinned top (UNDER THE
#   FOOTER — hence the full swipe first) and T≈226-323 after it (T moves
#   down when a short query clamps the body's scroll); the toggle T+~102;
#   the first row T+~134. MEASURE: every one of these on the first run (the
#   tap lines in `maestro.log` log the bounds) and replace this paragraph.
#
# ── HANDLES (visible text and accessible names; never a DOM id) ─────────────
#   column   `Parallel`, `Parallels`, `Sync Parallels`
#   dialog   `Reconcile Parallels`, `Filter NeonBinder sets` (+ its `Clear
#            filter neonbinder sets`), `Filter BSC items`, `Search SportLots
#            items` (+ its `Clear search sportlots items`; empty, the box
#            reads its placeholder `Search SportLots items...`), headers
#            `Ready (N of M)`, `BSC (N of M)`, `SportLots (N of M)`, rows'
#            `Make its own set: <label>`, Ready chips `Remove <label> from
#            <set>`, Ready titles `NeonBinder set name for <label>`, footer
#            `Save N sets`, `Cancel`, the block line `Two sets are both named
#            “<title>”. Rename one so you can tell them apart.` (curly quotes
#            since NEO-325's copy pass, each matched by `.`), and the discard
#            confirm's `Discard N set changes`
#   base     the toggle's accessible name `N that don't match the Base,
#            SportLots` (BASE_MATCH_COPY.toggleName: visible words first, then
#            the column), the SAME open or closed — `aria-expanded` carries
#            the state, which maestro-web cannot read, so open/closed is
#            proved by the revealed row, never by the name; a set-aside row's reason
#            line `Doesn't match the Base — <observed> (Base: <expected>)`,
#            the DIRECT child of the row's wrapper (`containsChild`); a
#            sleeve's tooltip (`title`, Maestro `id`) `<label> — Matches the
#            Base` / `<label> — <the row's reason>`. NOT the row's sr-only
#            status span: it does not scroll with the body (STEP 2b), so it
#            is off the viewport whenever the body is lifted. Apostrophes
#            are straight in the copy; matched by `.`.
#   NOT a handle: each clashing title also gets its own body line, `Same
#   name as another set. Tip: add the release, like “Series 1” or
#   “Update”.` (DRAFT copy). No selector here matches it: the block line,
#   the `.*so you can tell them apart\..*` negative and the Save reason
#   are all phrases it does not contain. Nor the column counter / pulse
#   line: no selector here matches `Check(ing|ed) against Base`.
# ════════════════════════════════════════════════════════════════════════════

# THE TWIN, in one place. Swapping the fixture is these three lines (and the
# registry). Names are plain words and the ids digits, so nothing below needs
# regex escaping beyond the literal parentheses of the suffix.
- evalScript: '${output.TWIN = "Chrome Update Sapphire"}'
- evalScript: '${output.TWIN_A = "326059"}'
- evalScript: '${output.TWIN_B = "323331"}'

# THE BASE-CHECK TWIN (claim 5). Measured on CI 37960551124 (see the header).
- evalScript: '${output.BR = "Chrome Black Refractor"}'
- evalScript: '${output.BR_MATCH = "309103"}'
- evalScript: '${output.BR_OTHER = "305604"}'

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# STEP 1 — TOPPS CHROME › PARALLEL
# R9 — the warm drill (it also runs util-paused-platforms, which sets
# `output.SL_PAUSED`). Returns with the Variant Types column on screen.
# ============================================================

- runFlow:
    file: util-drill-to-2024-topps-chrome.yaml

# "Parallel" sits under "Base" in the same column; DOWN (the default),
# centred for the tap (R8). Base, Insert and Parallel are the column's only
# rows and nothing else on the page full-matches "Parallel".
- scrollUntilVisible:
    element:
      text: "Parallel"
    centerElement: true
    timeout: 7000
- tapOn: "Parallel"
- extendedWaitUntil:
    visible: "Parallels"
    timeout: 7000

# The column is POPULATED (the seed saved its reconcile), so it never
# auto-syncs (EntityColumn fires the form only on an empty column); the
# operator's `Sync Parallels` is the way in. It sits under the column's list,
# DOWN, centred for the tap (R8) — the same step
# `bowman-sportlots-links-move-between-set-parallel-insert` STEP 10 takes.
- scrollUntilVisible:
    element:
      text: "Sync Parallels"
    centerElement: true
    timeout: 7000

# PAUSED — the claim has no paused form, and pressing Sync would STORE (see
# the header). The scroll above is this branch's hard assert (R2).
- runFlow:
    when:
      true: "${output.SL_PAUSED}"
    commands:
      - assertVisible: "Parallels"

- runFlow:
    when:
      true: "${!output.SL_PAUSED}"
    commands:
      - tapOn: "Sync Parallels"
      # R5 marketplace exception — BSC + SportLots' lists, live.
      - extendedWaitUntil:
          visible: "Reconcile Parallels"
          timeout: 60000

      # ============================================================
      # STEP 2 — NARROW READY AND BSC TO NOTHING
      # The body is the dialog's only scroller and Ready holds every saved
      # parallel (~41), so Pending starts far below the footer. A Ready query
      # no set matches — and that the twins' new sets will not match either,
      # since neither title contains " Black" — keeps Ready one line tall for
      # the whole of STEPS 2b-4; the BSC query does the same for the left
      # column, so the SportLots rows are the end of the body.
      # `Filter BSC items` is tapped at the pinned top: ~430 with the Base
      # check's BSC counter and sleeves above it (MEASURE: header "R8").
      # ============================================================
      - swipe:
          start: "3%, 30%"
          end: "3%, 80%"
      - swipe:
          start: "3%, 30%"
          end: "3%, 80%"
      - tapOn:
          id: "Filter NeonBinder sets"
          waitToSettleTimeoutMs: 250
      - inputText: "Update Sapphire Black"
      - extendedWaitUntil:
          visible:
            text: ".*Ready \\(0 of [0-9]+\\).*"
          timeout: 7000
      - tapOn:
          id: "Filter BSC items"
          waitToSettleTimeoutMs: 250
      - inputText: "Update Sapphire"
      - extendedWaitUntil:
          visible:
            text: ".*BSC \\(0 of [0-9]+\\).*"
          timeout: 7000
      # PRECONDITION for claim 4 (R2): nothing blocks Save yet. The ~41
      # restored parallels carry distinct titles, so the block line STEP 6
      # expects is caused by the twins this flow promotes, not by the seed.
      # (Positive first: the BSC count above proves the dialog is live.)
      - assertNotVisible:
          text: ".*so you can tell them apart\\..*"

      # ============================================================
      # STEP 2b — CLAIM 5: ONE NAME, TWO VERDICTS
      # Bring the SportLots search box into the band: from the pinned top it
      # sits under the footer now (header "R8"), so re-pin and lift the body
      # one full touch swipe. Its centre (x≈751) is clear of the footer's
      # buttons either way, so a miss here fails on the next wait, never
      # writes.
      # ============================================================
      - swipe:
          start: "3%, 30%"
          end: "3%, 80%"
      - swipe:
          start: "3%, 30%"
          end: "3%, 80%"
      # MEASURE: the lift that puts `Search SportLots items` mid-band.
      - swipe:
          start: "3%, 75%"
          end: "3%, 25%"
      - tapOn:
          id: "Search SportLots items"
          waitToSettleTimeoutMs: 250
      # The twin's whole name, not just "Black Refractor": every row it
      # matches starts with it, so the bare-name twins are the list's first
      # rows (as "Update Sapphire" makes them in STEP 3) and the matching one
      # sits at the top of the list, in the band, whatever else SportLots
      # calls "… Black Refractor" (Autographs, Update, Prospects: those would
      # sort around it under the shorter query).
      - inputText: "${output.BR}"
      # THE MATCH (R5 marketplace exception: a SportLots first-page read and
      # a count walk, behind whatever the queue already had in flight). The
      # twin that IS the Base's parallel says so on its sleeve: the column's
      # strip gives every set it checks a sleeve whose tooltip is the row's
      # label and verdict (`<label> — Matches the Base`; `<label> — checking
      # against the Base` until it lands), the same label as its `Make its
      # own set: <label>`, so this names one id and waits for its verdict,
      # not for the row. NOT the row's sr-only status: the body scroller is
      # not positioned, so an sr-only span stays where its row was at
      # scrollTop 0 (CI 37960551124: row at y=444, its span ~217px lower,
      # past the 629px viewport, so Maestro prunes it). The strip draws the
      # first 200 sets of the column's scope (`+N` after); this twin was
      # sleeve 100 of 580 there. If SportLots ever pushes it past 200, this
      # fails by name: re-measure, never loosen. MEASURE: the ceiling
      # (header "R5"); CI 37960551124 had every verdict in before the query.
      - extendedWaitUntil:
          visible:
            id: "${output.BR} \\(#${output.BR_MATCH}\\) — Matches the Base"
          timeout: 120000
      # …and it is the row the operator acts on, by its own id (claim 1's
      # form on the second twin).
      - assertVisible:
          id: "Make its own set: ${output.BR} \\(#${output.BR_MATCH}\\)"
      # THE MISMATCH. The other twin leaves the list and the column offers
      # the set-aside rows behind its toggle (positive first, R2). Its own
      # verdict can land after its sibling's (a first card that agrees still
      # needs a count), so both waits carry the live ceiling; on a run where
      # it had already settled they return at once.
      - extendedWaitUntil:
          visible:
            id: "[0-9]+ that don.t match the Base, SportLots"
          timeout: 120000
      - extendedWaitUntil:
          notVisible:
            id: "Make its own set: ${output.BR} \\(#${output.BR_OTHER}\\)"
          timeout: 120000
      # Reveal: the set-aside row comes back WITH its reason. The reason
      # line is the direct child of the row's wrapper, beside the row that
      # holds the twin's button, so this names exactly one node: the other
      # twin, set aside for not matching the Base. Client state: 7000.
      # The toggle sits just under the search box's two checkboxes, inside
      # the band (x≈640: clear of the footer's buttons).
      # The wait below is the proof it OPENED: the toggle's name does not
      # change with its state (aria-expanded, unreadable here).
      - tapOn:
          id: "[0-9]+ that don.t match the Base, SportLots"
      - extendedWaitUntil:
          visible:
            containsChild:
              text: "Doesn.t match the Base.*"
            containsDescendants:
              - id: "Make its own set: ${output.BR} \\(#${output.BR_OTHER}\\)"
          timeout: 7000
      # Close it again: the revealed row goes (client state: 7000). The
      # positives after the wait prove the dialog is alive, so the negative
      # cannot pass on a dead page (R2): the matching twin stays, and the
      # toggle is still offered under the same name.
      - tapOn:
          id: "[0-9]+ that don.t match the Base, SportLots"
      - extendedWaitUntil:
          notVisible:
            containsChild:
              text: "Doesn.t match the Base.*"
            containsDescendants:
              - id: "Make its own set: ${output.BR} \\(#${output.BR_OTHER}\\)"
          timeout: 7000
      - assertVisible:
          id: "Make its own set: ${output.BR} \\(#${output.BR_MATCH}\\)"
      - assertVisible:
          id: "[0-9]+ that don.t match the Base, SportLots"
      - assertNotVisible:
          id: "Make its own set: ${output.BR} \\(#${output.BR_OTHER}\\)"

      # Clear the search. The `×` sits at the box's right edge (x≈969) —
      # SAVE's x — so GUARD first (header "Save sits under…"): the toggle,
      # which renders below the box, is above the footer's Cancel, so the
      # box's `×` is well clear of the footer.
      - assertVisible:
          id: "[0-9]+ that don.t match the Base, SportLots"
          below:
            id: "Clear search sportlots items"
          above:
            text: "Cancel"
      - tapOn:
          id: "Clear search sportlots items"
      # Cleared: an empty box reads its placeholder (getNodeText).
      - extendedWaitUntil:
          visible:
            id: "Search SportLots items"
            text: "Search SportLots items\\.\\.\\."
          timeout: 7000
      # Re-open the set-aside rows for STEPS 3-4: the Chrome Update Sapphire
      # twins are set aside too (header, claim 5), and claims 1-4 are proved
      # on them revealed. With the box empty the toggle is certain to be
      # here: BR_OTHER (in the column's scope, set aside above) is behind it.
      # Opened, proved by a revealed row: only set-aside rows carry a
      # "Doesn't match the Base — …" reason (a row that couldn't be checked
      # stays listed, with a "Couldn't check…" reason), and the group renders
      # straight under the toggle, so its first row is in the band.
      - tapOn:
          id: "[0-9]+ that don.t match the Base, SportLots"
      - extendedWaitUntil:
          visible:
            containsChild:
              text: "Doesn.t match the Base.*"
          timeout: 7000

      # ============================================================
      # STEP 3 — CLAIMS 1 AND 2: BOTH TWINS SHOW THEIR IDS, AND A FILTER
      # THAT STOPS MATCHING THEM TAKES BOTH AWAY
      # The body is where STEP 2b left it (lifted one full swipe, or a little
      # less if "Black Refractor" clamped it), so the box is in the band: tap
      # it where it is. The toggle took focus, so the box is tapped again.
      # Do NOT pin to the end first: until the query narrows it, the
      # SportLots column is the prefix-filtered dealer list (CI 37874717642:
      # "2417 pending", hundreds of "Chrome …" rows) — and with the toggle
      # open, every set-aside row above them.
      # Nothing is swiped or tapped between typing and the " Black" append
      # below, so the box keeps focus and its caret.
      # ============================================================
      - tapOn:
          id: "Search SportLots items"
          waitToSettleTimeoutMs: 250
      - inputText: "Update Sapphire"
      # Claims 1 and 5 — each twin by its own id, set aside with its reason.
      # The same wrapper selector as STEP 2b: the reason line is the
      # wrapper's direct child and the twin's button its descendant, so each
      # names one row. `id:` is a full match, so the suffix must be there: a
      # bare "Make its own set: Chrome Update Sapphire" (the pre-NEO-325
      # name) satisfies neither. R5 marketplace exception (the verdict is a
      # SportLots probe); usually already settled, since the column's whole
      # scope has been checking since the dialog opened.
      - extendedWaitUntil:
          visible:
            containsChild:
              text: "Doesn.t match the Base.*"
            containsDescendants:
              - id: "Make its own set: ${output.TWIN} \\(#${output.TWIN_A}\\)"
          timeout: 120000
      - extendedWaitUntil:
          visible:
            containsChild:
              text: "Doesn.t match the Base.*"
            containsDescendants:
              - id: "Make its own set: ${output.TWIN} \\(#${output.TWIN_B}\\)"
          timeout: 120000

      # Claim 2 — narrow PAST the twins. The box still has focus and its
      # caret at the end of what was just typed, so this appends.
      - inputText: " Black"
      # The positive first (R2 — a negative alone passes on a dead page):
      # the column re-rendered and still lists the longer name (revealed if
      # it was set aside, listed if not — the toggle is open either way).
      - extendedWaitUntil:
          visible:
            id: "Make its own set: ${output.TWIN} Black.*"
          timeout: 7000
      - assertVisible:
          text: ".*SportLots \\([0-9]+ of [0-9]+\\).*"
      # …and neither twin survived the shrink.
      - assertNotVisible:
          id: "Make its own set: ${output.TWIN} \\(#[0-9]+\\)"

      # Back to the twins: the caret is still at the end.
      - eraseText: 6
      - extendedWaitUntil:
          visible:
            id: "Make its own set: ${output.TWIN} \\(#${output.TWIN_A}\\)"
          timeout: 7000

      # ============================================================
      # STEP 4 — CLAIM 3: EACH TWIN MAKES ITS OWN SET BY ITS OWN ID
      # Re-pin, then lift: one full touch UP and one partial (~94px) put the
      # twins' row buttons mid-band. Not a pin to the end: "Update Sapphire"
      # also matches the whole "Chrome Update Sapphire …" family (Autos,
      # Black/Gold/Orange/Padparadscha Sapphire Refractor, …; a dozen-plus
      # rows in the local run of 2026-10-08), all of them set aside and
      # revealed, so the end of the body is far below the twins. The twins
      # are the revealed group's FIRST two rows (the group keeps the
      # column's order, and the bare name sorts before every longer one;
      # local run 2026-10-08: #323331 first, then #326059). Ready is filtered
      # to a query the new sets do not match, so nothing above Pending grows
      # while the twins are promoted: the second twin stays put or moves up
      # one row, inside the band either way.
      # Each tap is GUARDED (header "Save sits under…"): a family row that
      # renders BELOW the twin is asserted ABOVE the footer's Cancel, so the
      # twin's button is at least one row clear of Save. The asserts after
      # each tap are what prove it landed.
      # ============================================================
      - swipe:
          start: "3%, 30%"
          end: "3%, 80%"
      - swipe:
          start: "3%, 30%"
          end: "3%, 80%"
      # MEASURE: the lift that puts both twins' buttons mid-band (estimated
      # A's centre ~330-370 after these two).
      - swipe:
          start: "3%, 75%"
          end: "3%, 25%"
      - swipe:
          start: "3%, 75%"
          end: "3%, 60%"
      - assertVisible:
          id: "Make its own set: ${output.TWIN} [A-Za-z].*"
          below:
            id: "Make its own set: ${output.TWIN} \\(#${output.TWIN_A}\\)"
          above:
            text: "Cancel"
      - tapOn:
          id: "Make its own set: ${output.TWIN} \\(#${output.TWIN_A}\\)"
      # The OTHER twin is still pending, under its own id (positive first) …
      - extendedWaitUntil:
          visible:
            id: "Make its own set: ${output.TWIN} \\(#${output.TWIN_B}\\)"
          timeout: 7000
      # … and the pressed one left Pending. A name-keyed resolver would have
      # moved the FIRST same-named row instead, leaving this one here.
      - assertNotVisible:
          id: "Make its own set: ${output.TWIN} \\(#${output.TWIN_A}\\)"

      # The second twin, the same way (no swipe: see above), and guarded.
      - assertVisible:
          id: "Make its own set: ${output.TWIN} [A-Za-z].*"
          below:
            id: "Make its own set: ${output.TWIN} \\(#${output.TWIN_B}\\)"
          above:
            text: "Cancel"
      - tapOn:
          id: "Make its own set: ${output.TWIN} \\(#${output.TWIN_B}\\)"
      # The positive first (R2): the column still lists the family — a row
      # named for the twin PLUS a word ("… Autos", "… Black Sapphire
      # Refractor"), now first in the column. `[A-Za-z]` rules out the twin
      # itself, whose name continues with " (#".
      - extendedWaitUntil:
          visible:
            id: "Make its own set: ${output.TWIN} [A-Za-z].*"
          timeout: 7000
      - assertNotVisible:
          id: "Make its own set: ${output.TWIN} \\(#[0-9]+\\)"

      # ============================================================
      # STEP 5 — THE TWO NEW SETS, EACH HOLDING THE ID THAT WAS PRESSED
      # Ready shows exactly the two sets once filtered to the twin's name.
      # Their chips name the item WITH its id (the name is still shared), so
      # each chip is a read-back of which SportLots set the set will map.
      # The two sets also share a TITLE (each is titled with the bare name),
      # so every control on a row names the row by the ids it maps
      # (`sharedTitleLabels`): the chip reads `Remove <name> (#A) from <name>
      # (#A)`. The id on BOTH halves is the claim: the row that holds A is
      # the row called A. A set-aside row promoted by its own "Make its own
      # set" is an ordinary Ready set (the check judges Pending only).
      # ============================================================
      - swipe:
          start: "3%, 30%"
          end: "3%, 80%"
      - swipe:
          start: "3%, 30%"
          end: "3%, 80%"
      # The "×" clears the box AND focuses it (FilterInput.clear), so the
      # new query types straight in.
      - tapOn:
          id: "Clear filter neonbinder sets"
      - inputText: "Update Sapphire"
      - extendedWaitUntil:
          visible:
            text: ".*Ready \\(2 of [0-9]+\\).*"
          timeout: 7000
      - assertVisible:
          id: "Remove ${output.TWIN} \\(#${output.TWIN_A}\\) from ${output.TWIN} \\(#${output.TWIN_A}\\)"
      - assertVisible:
          id: "Remove ${output.TWIN} \\(#${output.TWIN_B}\\) from ${output.TWIN} \\(#${output.TWIN_B}\\)"

      # ============================================================
      # STEP 6 — CLAIM 4: TWO SETS WITH ONE TITLE BLOCK SAVE
      # Both new sets are titled "Chrome Update Sapphire", so the footer
      # names the clash and Save is disabled (Jason, 2026-10-08). Footer
      # only, which is pinned outside the body's scroller (README "Asserting
      # inside a dialog"). The curly quotes around the title (“…”, one
      # UTF-16 unit each) are matched by `.`.
      #
      # "Disabled" is read off the button ITSELF. The blocked Save is
      # `aria-disabled` and described by the sentence (`aria-describedby`),
      # and its handler refuses while titles clash — none of which Maestro
      # web can see: maestro-web.js emits text, resource-id, bounds and
      # `selected` only (TreeNode.enabled is always null, so `enabled:`
      # matches nothing), and a describedby target is not an attribute it
      # reads. Pressing Save to prove it refuses would write to the shared
      # anchor the moment the guard regressed (R7a). So the blocked button
      # also carries the sentence as its tooltip (`title`), which maestro-web
      # reports as the button's `id` — the dimmed Save a sighted operator
      # hovers says why it is dimmed. One node matching BOTH the Save text
      # and that reason is the blocked Save.
      # ============================================================
      - assertVisible:
          text: ".*Two sets are both named .${output.TWIN}.\\. Rename one so you can tell them apart\\..*"
      - assertVisible:
          text: ".*Save [0-9]+ sets.*"
          id: "Two sets are both named .${output.TWIN}.\\. Rename one so you can tell them apart\\."

      # ============================================================
      # STEP 7 — CLAIM 4: RENAMING ONE OF THEM CLEARS THE BLOCK
      # Rename the set that holds A. Its title input is named for the row by
      # the id it maps (`NeonBinder set name for <name> (#A)`), so the tap
      # lands on A's row whichever of the two Ready lists first. The body is
      # pinned to its top and Ready is two rows, so both inputs sit at the
      # top of the body band.
      #
      # The click lands at the input's centre, well past the end of the
      # 22-character title in a full-width row, so the caret is at the end
      # and the typing APPENDS (no erase needed). The block follows the
      # DRAFT (it clears as the operator types), but the row's name — what
      # the read-back below keys on — changes only when the title commits,
      # on blur or Enter (ReadySetRow's local draft). Since NEO-325's a11y
      # pass Enter commits IN PLACE and keeps focus in the field; blur still
      # commits (`onBlur={commitTitle}`). Not Enter: the two title inputs
      # are identically classed siblings, so pressKey's XPath re-find would
      # send it to whichever is FIRST (README "pressKey needs a unique
      # handle"). A tap on the dialog's own heading blurs the input instead:
      # an <h2> with no handler, above the body, inside the panel (so the
      # backdrop's close never fires).
      # ============================================================
      - tapOn:
          id: "NeonBinder set name for ${output.TWIN} \\(#${output.TWIN_A}\\)"
          waitToSettleTimeoutMs: 250
      - inputText: " Second"
      - tapOn: "Reconcile Parallels"
      # The positive first (R2): B's row is no longer one of two, so its
      # controls drop the id from the row's name — the chip reads `… from
      # Chrome Update Sapphire` (`id:` is a full match). A's row is called
      # by its new title, which proves the rename went to the row pressed.
      - extendedWaitUntil:
          visible:
            id: "Remove ${output.TWIN} \\(#${output.TWIN_B}\\) from ${output.TWIN}"
          timeout: 7000
      - assertVisible:
          id: "Remove ${output.TWIN} \\(#${output.TWIN_A}\\) from ${output.TWIN} Second"
      # The line is gone and Save is no longer the blocked button.
      - assertNotVisible:
          text: ".*so you can tell them apart\\..*"
      - assertVisible:
          text: ".*Save [0-9]+ sets.*"
      - assertNotVisible:
          text: ".*Save [0-9]+ sets.*"
          id: "Two sets are both named.*"

      # ============================================================
      # STEP 8 — CANCEL OUT, WRITING NOTHING (READ-ONLY, R7a)
      # Save is never pressed. Cancel asks first because the dialog holds
      # edits (two promoted sets and a rename); `Discard N set changes`
      # closes it without a write — and cancels the Base check's queue.
      # Both buttons are in pinned footers (R8 case 2: `fixed inset-0`
      # dialogs, measured on this one by inserts-1996-score-… — bounds
      # unmoved across five swipes), so they are tapped where they are.
      # `Cancel` is anchored to Save beside it; the confirm's own button is a
      # full match, which its title (the same words plus "?") is not.
      # ============================================================
      - tapOn:
          text: "Cancel"
          leftOf:
            text: ".*Save [0-9]+ sets.*"
      - extendedWaitUntil:
          visible: "Discard [0-9]+ set changes?"
          timeout: 7000
      - tapOn: "Discard [0-9]+ set changes?"
      # Closed (negative), then the page it returned to (positive, R2): the
      # column the dialog was opened from. The page comes back scrolled to
      # its TOP (local run 2026-10-08: the columns row at y≈301, the
      # Parallels list at 419-819), so `Sync Parallels`, under the list, is
      # below the fold; the scroll is the assertion (R6), DOWN, nothing to
      # tap so not centred.
      - extendedWaitUntil:
          notVisible: "Reconcile Parallels"
          timeout: 7000
      - scrollUntilVisible:
          element:
            text: "Sync Parallels"
          timeout: 7000

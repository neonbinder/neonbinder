appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Selector rename — a set AND a variant type can each be renamed from the attributes panel, and the selection follows the new name (per-worker hand-made set)"
tags:
  - set-selector
---
# R1 — ONE FEATURE (NEO-96): a selectorOptions row's DISPLAY NAME can be
# renamed from its attributes panel, the new name renders, and the selection
# still resolves to that row afterwards.
#
# Exercised at TWO levels, because NEO-239 made the second one possible:
#   PART 1 — a set row      (the original NEO-96 coverage)
#   PART 2 — a variantType row (new; see the PART 2 banner for why)
#
# WHY THIS IS NEW BEHAVIOUR, NOT A REGRESSION TEST:
#   `selectorOptions.value` was WRITE-ONCE until NEO-96 — set at insert
#   (storeSelectorOptions / addCustomSelectorOption) and never patched anywhere
#   in the codebase. There was no way, in the UI or the backend, to fix a typo
#   or relabel a sport/year/manufacturer/set/variant. (`renamePlatformLabel`
#   renames a MARKETPLACE label, which is a different thing entirely.)
#
#   Renaming only became safe once teams/players referenced the sport ROW
#   instead of copying its display string: before that a rename silently
#   orphaned every entity holding the old label, and broke SKU generation and
#   Wikidata/ESPN enrichment, both of which keyed off the display name.
#
# WHERE THE CONTROL LIVES:
#   A pencil icon immediately after SetAttributesPanel's header title — not on
#   the selector rows. The panel scopes itself to the deepest current selection
#   at ANY level, so this same path renames a sport, year, manufacturer, set or
#   variant; drilling one level deeper is all that changes. Reaching it means
#   selecting the row, NOT hunting for it in a column list. The header renders
#   whether or not attributes are expanded, so no expansion step is needed.
#
# ISOLATION (R7a): operates on a PER-WORKER HAND-MADE set under real
#   Baseball → 2024 → Topps, so no other runner can observe or race this
#   rename, and the shared real "2024 Topps Chrome" set is never touched.
#   Prefix `rnm-` is registered in .maestro/SET-REGISTRY.md; the variant type
#   PART 2 adds lives inside that same per-attempt set, so it is covered by
#   the same registration and disappears with it.
#
#   ALSO PER-ATTEMPT (`-${ATTEMPT_ID}`), which the sibling isolation alone does
#   NOT give us here: this flow RENAMES its set, so a second run would create a
#   fresh `rnm-<worker>` and then try to rename it to a `rnmx-<worker>` that the
#   previous run already produced — and the sibling-collision guard would
#   (correctly) reject it. A per-attempt suffix keeps every run's pair unique.
#   Same reason parallel-grouping-cancel/reject carry ATTEMPT_ID.
#
# R2 — HARD ASSERTIONS:
#   - The panel header names the set BEFORE the rename (we're renaming the row
#     we think we are).
#   - After committing, that header reads the NEW name. The header renders the
#     CURRENTLY SELECTED row, so this proves both halves at once: the label
#     changed, and the selection still resolves to this row rather than being
#     orphaned by the rename. (R6: the `scrollUntilVisible` to that header IS
#     the assertion — it fails loudly if the header never appears — so there is
#     no trailing `assertVisible` of the same element.)
#   - The old label is gone from the page entirely.
#
# MAESTRO NOTES:
#   - The rename affordance is exposed as aria-label "Rename <name>" and, once
#     open, "Edit name for <name>" — both derived from the row's CURRENT value,
#     so they track the rename.
#   - The input opens EMPTY (current name as placeholder), so there is nothing
#     to erase. That is deliberate: tapOn plants the caret WHERE IT TAPS, and
#     eraseText only deletes to the caret's left, so clearing a pre-filled
#     field left a tail behind and committed a mangled name. maestro-web also
#     cannot send Cmd+A to select all — it rejects modifier combos.
#   - The input carries a per-instance class from useFieldTestClass because
#     maestro-web's inputText builds an XPath from id → class → position
#     (mobile-dev-inc/maestro#1083).

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# DRILL TO A PER-WORKER CUSTOM SET UNDER REAL Baseball/2024/Topps
# util-drill-to-custom creates the set if it doesn't exist, so the first run
# on a fresh deployment establishes it and later runs re-select it. Selecting
# it is what points SetAttributesPanel at this row.
# ============================================================

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"

# ============================================================
# SCROLL TO THE ATTRIBUTES PANEL HEADER FOR THE SELECTED SET
# The panel sits BELOW the selector columns, off-screen at the 1024x629
# headless viewport — scroll to it before asserting, since "visible" means
# in-viewport, not merely in the DOM.
#
# No expansion step: the pencil lives in the header, which renders whether the
# attributes body is collapsed or open. (The body itself defaults to collapsed
# at every level — NEO-38: auto-expanding during a drill pushed the selector
# columns down and hid the next column's target.)
# ============================================================

- scrollUntilVisible:
    element:
      text: ".*Attributes for rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}.*"
    centerElement: true

# ============================================================
# RENAME THE ENTRY
# ============================================================

- scrollUntilVisible:
    element:
      id: "Rename rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    centerElement: true
- tapOn:
    id: "Rename rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"

# The input replaces the affordance in place and opens empty — type straight in.
- extendedWaitUntil:
    visible:
      id: "Edit name for rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    timeout: 7000
- tapOn:
    id: "Edit name for rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    waitToSettleTimeoutMs: 250
- inputText: "rnmx-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
- pressKey: Enter

# ============================================================
# VERIFY THE RENAME LANDED AND THE SELECTION FOLLOWED IT
#
# The panel header reads "Attributes for <name> (<Level>)" for the CURRENTLY
# SELECTED row, so asserting the new name there proves the label changed AND
# that the selection still resolves to this row.
# ============================================================

- scrollUntilVisible:
    element:
      text: ".*Attributes for rnmx-${WORKER_INDEX || 0}-${ATTEMPT_ID}.*"
    centerElement: true

# The old label is gone everywhere — the panel header, its breadcrumb, and the
# Sets column's selected chip all re-render from the same row. Substring-safe:
# "rnm-0-x" is not a substring of "rnmx-0-x".
- assertNotVisible: "rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"

# ============================================================
# PART 2 — RENAME A VARIANT TYPE (NEO-239)
#
# WHY THIS IS A DIFFERENT FACT FROM PART 1:
#   `variantType` was the ONE level where a rename was refused outright. Its
#   display value was read as code in two places: NB decided which row was the
#   base set by matching the literal word "base", and the BuySportsCards
#   checklist fetch re-derived its `variant` query from whatever the row was
#   called. Rename the row and the fetch quietly asked the marketplace for a
#   set that does not exist — so the product refused the rename instead.
#
#   Both readers now work off ids and an NB role flag rather than the label:
#   base is a flag NB sets on the row, and the marketplace `variant` comes off
#   the id the row already carries. Nothing user-facing keys on a marketplace
#   value, and no marketplace query is built from an NB name. That makes a
#   variant type's name a plain label like every other level's — so ANY
#   variant type can be renamed, not merely a hand-added one.
#
# WHY THIS CANNOT PASS BY ACCIDENT (R2):
#   The old refusal exempted rows flagged as hand-added, and this row IS added
#   by hand. That exemption is gone with the flag: nothing marks a row as
#   hand-added any more, so the old rule would refuse this exact rename. If the
#   refusal comes back in any form, the rename below fails and takes the flow
#   with it — the pencil never opens, or the input reverts and the panel header
#   still reads the OLD name.
# ============================================================

# The attributes panel we just used sits BELOW the selector columns, so the
# Variant Types column is now ABOVE the viewport — scroll back UP to its
# "+ Custom" button. (R8: centered, because the next step taps it.)
- scrollUntilVisible:
    element:
      id: "Add custom Variant Types"
    direction: UP
    centerElement: true
- tapOn:
    id: "Add custom Variant Types"

# The add form REPLACES the column's list, so gate on the heading going away
# before looking for the new row (EntityColumn's in-place custom form).
- assertVisible: "Add Custom Entry"
- inputText: "vt-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
- pressKey: Enter
# NEO-219: the first Enter raises a "Create <noun> '<value>' under <parent>?"
# confirm with the Create button already focused; this second Enter presses it.
# Without it the form never closes and the gate below fails — which is exactly
# how this flow went red in run 10, PART 2 having been written before NEO-219.
- pressKey: Enter
- assertNotVisible: "Add Custom Entry"

# Select the new variant type — that is what re-points the attributes panel at
# it. (The Variants column header pluralises to "vt-…s", which a full-anchored
# `text:` match will not collide with.)
- scrollUntilVisible:
    element:
      text: "vt-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    centerElement: true
- tapOn:
    text: "vt-${WORKER_INDEX || 0}-${ATTEMPT_ID}"

# The panel header names the row we are about to rename — same precondition
# assert as PART 1, so a mis-selected row fails here rather than renaming
# something else.
- scrollUntilVisible:
    element:
      text: ".*Attributes for vt-${WORKER_INDEX || 0}-${ATTEMPT_ID}.*"
    centerElement: true

# Same pencil, same in-place input, same empty-opens behaviour as PART 1.
- scrollUntilVisible:
    element:
      id: "Rename vt-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    centerElement: true
- tapOn:
    id: "Rename vt-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
- extendedWaitUntil:
    visible:
      id: "Edit name for vt-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    timeout: 7000
- tapOn:
    id: "Edit name for vt-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    waitToSettleTimeoutMs: 250
- inputText: "vtx-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
- pressKey: Enter

# THE ASSERTION: the panel header — which always renders the CURRENTLY
# SELECTED row — now reads the NEW variant type name. That proves the write
# landed AND that the selection still resolves to this row.
- scrollUntilVisible:
    element:
      text: ".*Attributes for vtx-${WORKER_INDEX || 0}-${ATTEMPT_ID}.*"
    centerElement: true

# The old variant type name is gone. Substring-safe: "vt-0-x" is not a
# substring of "vtx-0-x", and Maestro's text match is full-anchored anyway.
- assertNotVisible: "vt-${WORKER_INDEX || 0}-${ATTEMPT_ID}"

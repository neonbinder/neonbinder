appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Selector rename — an entry's display name can be changed in place and the renamed row still selects (per-worker custom set)"
tags:
  - set-selector
---
# R1 — ONE FEATURE (NEO-96): a selectorOptions row's DISPLAY NAME can be renamed
# from the UI, the new name renders, and the renamed row still behaves as a
# normal selectable entry.
#
# WHY THIS IS NEW BEHAVIOUR, NOT A REGRESSION TEST:
#   `selectorOptions.value` was WRITE-ONCE until NEO-96 — set at insert
#   (storeSelectorOptions / addCustomSelectorOption) and never patched anywhere
#   in the codebase. There was no way, in the UI or the backend, to fix a typo
#   or relabel a sport/year/manufacturer/set/variant. (`renamePlatformLabel`
#   renames a MARKETPLACE label, which is a different thing entirely.)
#
#   Renaming only became safe once teams/players referenced the sport ROW
#   instead of copying its display string: before that a rename silently
#   orphaned every entity holding the old label, and broke SKU generation and
#   Wikidata/ESPN enrichment, both of which keyed off the display name.
#
# ISOLATION (R7a): operates on a PER-WORKER CUSTOM set under real
#   Baseball → 2024 → Topps, so no other runner can observe or race this
#   rename, and the shared real "2024 Topps Chrome" set is never touched.
#   Prefix `rnm-` is registered in .maestro/SET-REGISTRY.md.
#
#   ALSO PER-ATTEMPT (`-${ATTEMPT_ID}`), which the sibling isolation alone does
#   NOT give us here: this flow RENAMES its set, so a second run would create a
#   fresh `rnm-<worker>` and then try to rename it to a `rnmx-<worker>` that the
#   previous run already produced — and the sibling-collision guard would
#   (correctly) reject it. A per-attempt suffix keeps every run's pair unique.
#   Same reason parallel-grouping-cancel/reject carry ATTEMPT_ID.
#
# R2 — HARD ASSERTIONS:
#   - The pre-rename name is visible (proves we're renaming the right row).
#   - After committing, the NEW name renders and the OLD name is gone.
#   - The SetAttributesPanel breadcrumb reads "Attributes for <new name> (Set)",
#     proving the selection still resolves to this row — the rename changed the
#     label only and did not detach it from its parent.
#
# MAESTRO NOTES:
#   - The rename control is a SIBLING of the row button (a button cannot nest
#     inside a button), exposed as aria-label "Rename <name>" and, once open,
#     "Edit name for <name>".
#   - EntitySelector COLLAPSES a column once it has a selection, rendering a
#     summary chip instead of the row list — so the rename control is absent
#     until the column is re-expanded. That cost this flow its first CI run.
#   - The input carries a per-instance class from useFieldTestClass because
#     maestro-web's inputText builds an XPath from id → class → position, and
#     every row would otherwise share one Tailwind className (issue #1083).

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: "Set Selector"
    timeout: 45000

# ============================================================
# DRILL TO A PER-WORKER CUSTOM SET UNDER REAL Baseball/2024/Topps
# util-drill-to-custom creates the set if it doesn't exist, so the first run
# on a fresh deployment establishes it and later runs re-select it.
# ============================================================

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"

# ============================================================
# RE-EXPAND THE SETS COLUMN
# util-drill-to-custom SELECTS the set, and EntitySelector collapses a column
# once it has a selection: it renders a summary chip (name + "Custom" + chevron)
# INSTEAD of the row list, so the row — and its rename control — is not in the
# DOM at all. Tapping the chip re-expands the column. The chip is a plain
# clickable div with no aria-label, so it is targeted by its text.
# ============================================================

- extendedWaitUntil:
    visible: "rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    centerElement: true
    timeout: 10000
- tapOn:
    text: "rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    retryTapIfNoChange: true

# ============================================================
# RENAME THE ENTRY
# ============================================================

- extendedWaitUntil:
    visible:
      id: "Rename rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "Rename rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    centerElement: true
    timeout: 10000
- tapOn:
    id: "Rename rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"

# The input replaces the affordance in place, seeded with the current value.
- extendedWaitUntil:
    visible:
      id: "Edit name for rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    timeout: 7000
- tapOn:
    id: "Edit name for rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    waitToSettleTimeoutMs: 250
- eraseText
- inputText: "rnmx-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
- pressKey: Enter

# ============================================================
# VERIFY THE RENAME LANDED AND THE ROW IS STILL THE SELECTED ONE
#
# The SetAttributesPanel breadcrumb reads "Attributes for <name> (Set)" for the
# CURRENTLY SELECTED set. Asserting the new name there proves both halves at
# once: the label changed, AND the selection still resolves to this row — i.e.
# the rename did not detach it from its parent.
#
# Deliberately NOT re-tapping the row to prove selection: it is already
# selected, and re-tapping a selected row DESELECTS it and closes the next
# column (see the guard in util-drill-to-custom's level handlers).
# ============================================================

- extendedWaitUntil:
    visible: "rnmx-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: ".*Attributes for rnmx-${WORKER_INDEX || 0}-${ATTEMPT_ID}.*"
    timeout: 10000

# The old label is gone everywhere. Substring-safe: "rnm-0-x" is not a substring
# of "rnmx-0-x", so this genuinely proves the old value is no longer rendered.
- assertNotVisible: "rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"

appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Selector rename — an entry's display name can be changed from its attributes panel and the selection follows the new name (per-worker custom set)"
tags:
  - set-selector
---
# R1 — ONE FEATURE (NEO-96): a selectorOptions row's DISPLAY NAME can be
# renamed from its attributes panel, the new name renders, and the selection
# still resolves to that row afterwards.
#
# WHY THIS IS NEW BEHAVIOUR, NOT A REGRESSION TEST:
#   `selectorOptions.value` was WRITE-ONCE until NEO-96 — set at insert
#   (storeSelectorOptions / addCustomSelectorOption) and never patched anywhere
#   in the codebase. There was no way, in the UI or the backend, to fix a typo
#   or relabel a sport/year/manufacturer/set/variant. (`renamePlatformLabel`
#   renames a MARKETPLACE label, which is a different thing entirely.)
#
#   Renaming only became safe once teams/players referenced the sport ROW
#   instead of copying its display string: before that a rename silently
#   orphaned every entity holding the old label, and broke SKU generation and
#   Wikidata/ESPN enrichment, both of which keyed off the display name.
#
# WHERE THE CONTROL LIVES:
#   A pencil icon immediately after SetAttributesPanel's header title — not on
#   the selector rows. The panel scopes itself to the deepest current selection
#   at ANY level, so this same path renames a sport, year, manufacturer, set or
#   variant; drilling one level deeper is all that changes. Reaching it means
#   selecting the row, NOT hunting for it in a column list. The header renders
#   whether or not attributes are expanded, so no expansion step is needed.
#
# ISOLATION (R7a): operates on a PER-WORKER CUSTOM set under real
#   Baseball → 2024 → Topps, so no other runner can observe or race this
#   rename, and the shared real "2024 Topps Chrome" set is never touched.
#   Prefix `rnm-` is registered in .maestro/SET-REGISTRY.md.
#
#   ALSO PER-ATTEMPT (`-${ATTEMPT_ID}`), which the sibling isolation alone does
#   NOT give us here: this flow RENAMES its set, so a second run would create a
#   fresh `rnm-<worker>` and then try to rename it to a `rnmx-<worker>` that the
#   previous run already produced — and the sibling-collision guard would
#   (correctly) reject it. A per-attempt suffix keeps every run's pair unique.
#   Same reason parallel-grouping-cancel/reject carry ATTEMPT_ID.
#
# R2 — HARD ASSERTIONS:
#   - The panel header names the set BEFORE the rename (we're renaming the row
#     we think we are).
#   - After committing, that header reads the NEW name. The header renders the
#     CURRENTLY SELECTED row, so this proves both halves at once: the label
#     changed, and the selection still resolves to this row rather than being
#     orphaned by the rename.
#   - The old label is gone from the page entirely.
#
# MAESTRO NOTES:
#   - The rename affordance is exposed as aria-label "Rename <name>" and, once
#     open, "Edit name for <name>" — both derived from the row's CURRENT value,
#     so they track the rename.
#   - The input opens EMPTY (current name as placeholder), so there is nothing
#     to erase. That is deliberate: tapOn plants the caret WHERE IT TAPS, and
#     eraseText only deletes to the caret's left, so clearing a pre-filled
#     field left a tail behind and committed a mangled name. maestro-web also
#     cannot send Cmd+A to select all — it rejects modifier combos.
#   - The input carries a per-instance class from useFieldTestClass because
#     maestro-web's inputText builds an XPath from id → class → position
#     (mobile-dev-inc/maestro#1083).

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: "Set Selector"
    timeout: 45000

# ============================================================
# DRILL TO A PER-WORKER CUSTOM SET UNDER REAL Baseball/2024/Topps
# util-drill-to-custom creates the set if it doesn't exist, so the first run
# on a fresh deployment establishes it and later runs re-select it. Selecting
# it is what points SetAttributesPanel at this row.
# ============================================================

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"

# ============================================================
# SCROLL TO THE ATTRIBUTES PANEL HEADER FOR THE SELECTED SET
# The panel sits BELOW the selector columns, off-screen at the 1024x629
# headless viewport — scroll to it before asserting, since "visible" means
# in-viewport, not merely in the DOM.
#
# No expansion step: the pencil lives in the header, which renders whether the
# attributes body is collapsed or open. (The body itself defaults to collapsed
# at every level — NEO-38: auto-expanding during a drill pushed the selector
# columns down and hid the next column's target.)
# ============================================================

- scrollUntilVisible:
    element:
      text: ".*Attributes for rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}.*"
    centerElement: true
    timeout: 15000
- assertVisible:
    text: ".*Attributes for rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}.*"

# ============================================================
# RENAME THE ENTRY
# ============================================================

- scrollUntilVisible:
    element:
      id: "Rename rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    centerElement: true
    timeout: 10000
- tapOn:
    id: "Rename rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"

# The input replaces the affordance in place and opens empty — type straight in.
- extendedWaitUntil:
    visible:
      id: "Edit name for rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    timeout: 7000
- tapOn:
    id: "Edit name for rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
    waitToSettleTimeoutMs: 250
- inputText: "rnmx-${WORKER_INDEX || 0}-${ATTEMPT_ID}"
- pressKey: Enter

# ============================================================
# VERIFY THE RENAME LANDED AND THE SELECTION FOLLOWED IT
#
# The panel header reads "Attributes for <name> (<Level>)" for the CURRENTLY
# SELECTED row, so asserting the new name there proves the label changed AND
# that the selection still resolves to this row.
# ============================================================

- scrollUntilVisible:
    element:
      text: ".*Attributes for rnmx-${WORKER_INDEX || 0}-${ATTEMPT_ID}.*"
    centerElement: true
    timeout: 10000
- assertVisible:
    text: ".*Attributes for rnmx-${WORKER_INDEX || 0}-${ATTEMPT_ID}.*"

# The old label is gone everywhere — the panel header, its breadcrumb, and the
# Sets column's selected chip all re-render from the same row. Substring-safe:
# "rnm-0-x" is not a substring of "rnmx-0-x".
- assertNotVisible: "rnm-${WORKER_INDEX || 0}-${ATTEMPT_ID}"

appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "BaseSetPicker — confirm SportLots base-set mapping for 2024 Topps Heritage"
tags:
  - set-selector
  - regression
---
# Independent BaseSetPicker test (was cascade/sets-base). Uses 2024 Topps HERITAGE
# — a DIFFERENT set from the setup track's Topps Chrome — so it exercises the
# BaseSetPicker on a set whose base mapping is NOT pre-confirmed by setup.
# (Heritage is a clean single-base set: one 1–500 base, no Series-1/2/Update
# split, so SportLots returns one unambiguous "likely match". Flagship "Topps"
# was rejected for exactly that split; "Topps Fire" doesn't exist in 2024.)
#
# Topps Heritage's variant types + base mapping are not pre-synced, so the drill
# does a cold variant-type sync (absorbed inside util-drill-to-2024-topps-chrome)
# and the picker does a LIVE SportLots base-set fetch. IMPORTANT — the picker OPEN
# is NOT that fetch: BaseMappingForm.doSync() calls setPickerOpen(true) BEFORE it
# awaits fetchRawOptions, so the modal ("Select Base Set") appears in ~343ms
# (proven from a green run's maestro.log), the SL list rendering skeletons and the
# Confirm button reading "Loading…"/disabled meanwhile. The real ~10s SL round-trip
# is absorbed LATER, in Path A: the "likely match" pill only renders once the scored
# options arrive and "Confirm Base Set" only replaces "Loading…" once the fetch
# resolves — that Path-A step is where this flow's marketplace latency actually
# lives. Every other wait uses the 7s default; the "Base" tap keys its result-retry
# at 7s (the picker-open budget), NOT the old 60s that misattributed the fetch here.
#
# Phase-0 bootstrap (worker-bootstrap.yaml) already seeds BSC + SL credentials
# AND warms both marketplace tokens (best-effort optional). BaseSetPicker's
# getSiteToken performs lazy re-auth on cache-miss, so no explicit re-login is
# needed here. The redundant util-login-to-bsc / util-login-to-sportlots calls
# that appeared here have been removed — they caused a CDP-scroll flake
# (MismatchedInputException × 118 in CI) on the SL auth-success scroll
# and provided no coverage not already guaranteed by the bootstrap.
#
# The flow URL lands directly on /set-selector. util-drill-to-2024-topps-chrome
# calls openLink /set-selector itself (same-page reload), so no /profile detour
# is needed to make it a cross-page mount.

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# Drill Baseball → 2024 → Topps → Topps Heritage (cold variant-type sync inside util).
- runFlow:
    file: util-drill-to-2024-topps-chrome.yaml
    env:
      SET: "Topps Heritage"

# ── SELECT BASE → BaseSetPicker ─────────────────────────────────────────────
# "Base" sits in the Variant Types column. Center it before tapping — without
# centering, the scroll can stop with the element only partially on screen and
# the tap lands off-target. Rule 8.
- scrollUntilVisible:
    element:
      text: "Base"
    centerElement: true
# NEO-85 residual coordinate-staleness — the SAME maestro-web tap-drop class that
# 232a39f fixed for the drill row-selects, here on this flow's OWN "Base" tap:
# maestro reads the "Base" row's bounds, the still-settling Variant Types column
# reflows, and the click lands stale → a false "Something changed… Proceed" that
# never registered the select (selectedVariantTypeId stays null → the attributes
# bar reads "…(Set)" instead of the variant). Result-keyed retry: re-fire the Base
# tap ONCE iff neither the BaseSetPicker ("Select Base Set", Path A) NOR the
# "Re-map Base" button (Path B, auto-closed prior mapping) appears; a genuine
# failure still fails loudly. 7s keying timeout — the picker opens in ~343ms
# (proven; setPickerOpen(true) fires BEFORE the SL fetch is awaited), so this is a
# pure UI-open wait, NOT a marketplace round-trip; the SL latency is absorbed
# downstream at Path-A "Confirm Base Set". retryTapIfNoChange is the maestro-native
# nudge (default settle re-enables it).
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: "Base"
          retryTapIfNoChange: true
      # Scroll, don't just look: the Base-mapping controls render BELOW the
      # columns container, so a taller column (e.g. a shared partial-failure
      # notice from another worker) parks them under the fold and the retry key
      # can never match. See util-drill-to-base-variant.yaml for the full note.
      - scrollUntilVisible:
          element:
            text: ".*Select Base Set.*|.*Re-map Base.*"
          centerElement: true
          timeout: 7000

# PATH A — picker stays open (no prior mapping):
#   Validate the picker structure, PICK a set on each side, then confirm. THIS is
#   where the live SL fetch latency is absorbed: the "likely match" pill only
#   renders once the scored SL options arrive, and the confirm button reads
#   "Loading…"/stays disabled until fetchRawOptions resolves — it only flips to
#   "Confirm Base Set" then, so the scrollUntilVisible below naturally waits out
#   the real marketplace round-trip. Center before tapping so the button is fully
#   in view. Rule 8.
- runFlow:
    when:
      visible: "Select Base Set"
    commands:
      # BaseSetPicker modal STRUCTURE — the unique coverage this flow owns.
      #
      # The description is the promise NEO-219 makes to the operator, and it is
      # asserted verbatim-ish because the promise is the feature: only what you
      # pick gets linked. (Matched on the opening clause only — the sentence
      # carries a curly apostrophe in "<set>'s base cards", which is a needless
      # thing to encode in a regex.)
      - assertVisible:
          text: ".*Choose the SportLots and BSC sets.*"
      - assertVisible:
          text: ".*SportLots base.*"
      - assertVisible:
          text: ".*BSC base.*"
      # At least one row is close enough to the set name to be flagged. The pill
      # threshold is unchanged by NEO-219 — what changed is that a flagged row is
      # no longer SELECTED on the operator's behalf, which is exactly what the
      # two taps below now have to do by hand.
      - assertVisible: "likely match"
      # NEO-219 — PICK BEFORE CONFIRMING.
      #
      # (The footer's "Pick a SportLots or BSC set to continue." hint is NOT
      # asserted here: it is shown only while nothing is selected, and an SL row
      # whose name matches this set EXACTLY is still pre-selected by design — so
      # whether the hint is on screen is a property of what SportLots happens to
      # call this set, not of the feature.)
      #
      # Both lists render best-match-first, so the first row on each side is the
      # best-ranked candidate — what the old build pre-selected on its own,
      # except where NEO-219's re-ranking (an exact manufacturer match now scores
      # BELOW the generic "Base" rows) deliberately promotes a better one. The
      # labels are the marketplaces' own words for this set and are deliberately
      # not pinned — SportLots names a base row differently from set to set.
      # `id:` is a full-string regex in Maestro, so "…candidate: .*" is "the
      # first candidate row on this side".
      - tapOn:
          id: "BSC base candidate: .*"
      - tapOn:
          id: "SportLots base candidate: .*"
      - scrollUntilVisible:
          element:
            text: "Confirm Base Set"
          centerElement: true
      - tapOn: "Confirm Base Set"
      # Wait for the modal to close; default 7s is enough — no backend
      # round-trip at this point, the Convex write fires optimistically.
      - extendedWaitUntil:
          notVisible: "Select Base Set"

# PATH B — a prior mapping already exists (a re-run against a deployment where
#   this Base row was mapped earlier), so BaseMappingForm never mounts and
#   "Re-map Base" is showing instead. No picker structure to validate here, but
#   we explicitly assert the Re-map button to confirm the mapping is committed
#   and the CardChecklist section rendered. (NEO-219: this is now the ONLY way
#   the picker is skipped — it no longer closes itself and writes a fallback.)
- runFlow:
    when:
      notVisible: "Select Base Set"
    commands:
      # Same fold rule as above — scroll rather than assert in place. The scroll
      # IS the assertion (R6).
      - scrollUntilVisible:
          element:
            text: "Re-map Base"
          centerElement: true
          timeout: 10000

# ── CardChecklist renders after the mapping is confirmed ────────────────────
# Scroll DOWN to the "Fetch from Marketplaces" / "Refresh" button to confirm
# the CardChecklist section is mounted and the fetch CTA is present.
# scrollUntilVisible already asserts visibility — no trailing assertVisible needed.
- scrollUntilVisible:
    element:
      text: ".*Fetch from Marketplaces.*|Refresh"
    visibilityPercentage: 50

# Scroll UP to "Re-map Base" to confirm the base-mapping badge is visible.
# scrollUntilVisible already asserts visibility — no trailing assertVisible needed.
- scrollUntilVisible:
    element:
      text: "Re-map Base"
    direction: UP
    visibilityPercentage: 50

appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Signed By auto-fills from the card's players when Autographed flips None → On Card (real Topps Chrome Base, sole-writer)"
tags:
  - set-selector
---
# ============================================================================
# R1 — ONE FEATURE UNDER TEST: the setCardFeature side-effect (NEO-24 typed
#   controls). When an operator flips a CARD's "Autographed" feature from
#   blank/"None" to a real format ("On Card"), the mutation auto-seeds that
#   card's "Signed By" feature with the name(s) of the player(s) already
#   attached to the card (cardChecklist.playerIds[]) — the operator types
#   nothing. This flow drives exactly that transition through the UI and
#   proves Signed By changed as a direct result.
#
# WHY THE REAL Topps Chrome BASE SET (and not a per-worker custom set):
#   The auto-fill reads card.playerIds[]. setup.yaml pre-syncs the 2024 Topps
#   Chrome Base checklist AND confirms its EntityReviewWizard, so every Base
#   card already carries real playerIds — the precondition this flow needs,
#   already paid for by the seed. The obvious custom-set alternative does not
#   supply it: `util-add-custom-card` leaves the quick-add form's Players field
#   empty, so the card it builds has no players at all.
#
#   NEO-220 CHANGED WHAT IS POSSIBLE HERE — read this before copying the
#   paragraph above into a new flow. This header used to say a custom card can
#   NEVER acquire playerIds (they were stored as `pendingPlayerNames` and the
#   commit never patched ids back onto a custom row). That is now FALSE: the
#   quick-add Players field is a PlayerPicker and `addCustomCard` takes real
#   player ids, so a hand-added card is born LINKED. This flow could therefore
#   move onto a per-worker custom set, which R7a would prefer — it has not,
#   because that means teaching `util-add-custom-card` to pick a player, a
#   change every flow sharing that util would have to absorb. Treat the move as
#   an open follow-up, not as impossible.
#
# ISOLATION STORY (sole-writer tolerance — same model as
# topps-chrome-add-feature.yaml):
#   This flow is the SOLE writer of the chosen Base card's `autographed` and
#   `signedBy` FEATURES. No other flow writes a real Base card's autographed/
#   signedBy: features-propagation writes a per-worker CUSTOM set's Signed By;
#   the card-checklist flows (link-existing / cancel-dialog / keyboard-only / setup)
#   run commitCardChecklist which patches real cards' playerIds / attributes /
#   sortOrder but NEVER their `features` map (grep the existing-card patch in
#   commitCardChecklist — no `features` key), so a concurrent Base re-sync can
#   never clobber the autographed/signedBy this flow sets. Only ONE instance of
#   this flow is enqueued per run, so it never races itself. Safe under the
#   NEO-49 work-queue via sole-writer tolerance (no serial lane exists anymore).
#
# INTERRUPTED-RUN / RE-RUN SAFETY:
#   The flow NORMALISES autographed to "None" immediately before the flip,
#   regardless of what a prior (possibly interrupted) run left it as
#   (unset / None / a leftover "On Card"): unset/None→None is inert, and a
#   leftover "On Card"→None is a real transition to blank that does NOT auto-fill
#   (isNowSet=false). It then flips None→"On Card" fresh, so the auto-fill always
#   fires this run. The Signed By sentinel is a per-attempt UNIQUE value distinct
#   from any player name. This flow does NOT restore autographed to "None" at the
#   end (leaving it "On Card" is inert): the next run's own normalise step turns a
#   leftover "On Card" back to "None" before flipping — self-healing. signedBy is
#   left holding the player name(s) (a semantically-correct value; there is no UI
#   affordance to clear a feature back to empty), re-seeded over by the next run's
#   sentinel step. Under sole-writer tolerance both leftovers are inert (no other
#   flow reads a Base card's autographed/signedBy).
#
# LAYOUT NOTE (NEO-71-74 — why the editor is toggled open/closed mid-flow):
#   Autographed was promoted OUT of the CardFeaturesEditor (which now filters
#   key==="autographed") to an ALWAYS-VISIBLE grid cell in the CardDetailPanel
#   body (position 7, next to Print run) — FAR below the fully-expanded editor.
#   Signed By, by contrast, is still a row INSIDE the editor. The two controls
#   can never be on-screen together, and scrollUntilVisible can't drive the
#   drawer's inner scroll — maestro-web's only scroll is `window.scroll` and the
#   panel is a `fixed inset-0` portal the window never moves (README R8 case 2;
#   canonical note in card-detail-panel.yaml) — only manual x=80% in-drawer
#   swipes can. So the flow drives layout deterministically with the editor's own
#   Show/Hide toggle (a button tap, not a fragile long blind swipe): it EXPANDS
#   the editor to reach Signed By (1 short swipe down), and COLLAPSES it to reach
#   Autographed at pos 7 (1 short swipe down — the proven pattern from
#   card-autograph-always-visible-saves.yaml). A large reset swipe UP (which
#   clamps at scrollTop 0) returns to the toggle between states.
#
# THE ASSERTION (R2 — both a positive player-name match AND a sentinel-overwrite):
#   Because the target is the FIXED card #300 of the immutable 2024 Topps Chrome
#   Base set — "Julio Rodriguez", a single-player card — the auto-filled value is
#   KNOWN ahead of time: signedBy becomes "Julio …". So we assert BOTH:
#     (a) POSITIVE — signedBy matches ".*Julio.*" after the toggle (the player
#         NAME landed, not merely "something changed"); AND
#     (b) OVERWRITE — signedBy is no longer the per-attempt sentinel we seeded
#         first. The ONLY code path that overwrites signedBy on an autographed
#         None→set transition is this auto-fill (this flow is the card's sole
#         writer), so the change from sentinel→"Julio" is unambiguous proof.
#   This also self-serves the "card has players" precondition: if card #300 had
#   no playerIds, names.length===0 → the mutation's `if (names.length > 0)` guard
#   skips the write → signedBy stays the sentinel → both (a) and (b) fail loudly.
#   (The read-only "Players" chips are unlabelled <span>s and sit far down the
#   drawer's inner scroll — which scrollUntilVisible can't drive, see Step 4
#   — so they are neither a viable capture source nor a scrollable assertion; the
#   known-card positive match above is the robust substitute.)
#
# FLOW:
#   0. Drill to real 2024 Topps Chrome Base.
#   0b. Assert the Base checklist is already populated WITH playerIds. That is
#       the setup track's job; NEO-260 deleted the self-fetch fallback that used
#       to rebuild the shared checklist here (see Step 0b for why).
#   1-2. Open a real Base card's detail drawer (card #300 — Julio Rodriguez, a
#        stable single-player card).
#   3. PRECONDITION (Signed By sentinel): EXPAND the editor, swipe to the Signed By
#      row, set it to a per-attempt UNIQUE sentinel + assert it landed.
#   4. Reset to top, COLLAPSE the editor (so pos-7 Autographed is reachable).
#   5. Swipe to the always-visible Autographed pill group (pos 7). NORMALISE to
#      "None" then FLIP "None"→"On Card" via a fixed 3-tap toggle-pill sequence
#      (Sticker, Sticker, On Card) — one collapsed visit. The flip is the ACTION
#      that triggers the auto-fill.
#   6. Reset to top, RE-EXPAND the editor, swipe back to Signed By, and assert it
#      now shows "Julio …" (the player) AND is no longer the sentinel — the
#      auto-fill fired.
#   7. Close the drawer (no autographed restore — next run's normalise self-heals).
#
# TOGGLE-PILL INTERACTION (Autographed is inputType "toggleOptions", NEO-71-74):
#   Autographed renders as a two-pill exclusive toggle ("Auto (On Card)" / "Auto
#   (Sticker)"), NOT a native <select>. "None" (options[0]) is the implicit OFF
#   value with no pill. Clicking an INACTIVE pill sets its value directly; clicking
#   the ACTIVE pill reverts to "None". Maestro-web cannot read a pill's pressed
#   state, so the normalise+flip uses a FIXED, state-free 3-tap sequence that is
#   deterministic because this flow is the card's sole writer (reachable start
#   states are only {None, On Card}) — see Step 5's header for the full rationale.
#   The flip's result is asserted via its side-effect (Signed By) in Step 6, not
#   via any unreadable pill state.
# ============================================================================

# Step 0 — open the app at the signed-in /set-selector route.
- launchApp
# Cold sign-in / app load (Clerk auth + rate-limit backoff on the Nth concurrent
# sign-in). Every UI wait below uses Maestro's 7s default (R5); the only longer
# wait is the live SL round-trip inside util-drill-to-base-variant.
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# STEP 0 (cont.) — DRILL TO REAL 2024 TOPPS CHROME BASE (R9)
# util-drill-to-base-variant confirms the BaseSetPicker (a live SL fetch, ~60s)
# and leaves the pre-synced CardChecklist visible with "Add Card" in view.
# ============================================================

- runFlow:
    file: util-drill-to-base-variant.yaml

# ============================================================
# STEP 0b — PRECONDITION: THE BASE CHECKLIST IS ALREADY POPULATED
#
# flows/setup.yaml is this flow's documented precondition (util-drill-to-base-
# variant's caller notes say so too): the setup track fetches the 2024 Topps
# Chrome Base checklist and confirms its EntityReviewWizard, so every Base card
# carries the playerIds the auto-fill under test reads.
#
# THIS WAS A `when: visible "No cards in this checklist yet."` FALLBACK that
# fetched and COMMITTED the whole shared Base checklist whenever it found the
# set empty. Deleted in NEO-260, and it must not come back. Two rules said no:
#   R7a — 2024 Topps Chrome Base is a registered shared set. This flow is its
#     sole writer for one card's `autographed`/`signedBy` features and for
#     nothing else; rebuilding its checklist is a write to a fixture the rest of
#     the queue reads concurrently.
#   R2  — an empty shared set means the SEED FAILED. Silently rebuilding it
#     turns a loud seed failure into a green run that proved nothing, and buys
#     that green with ~2 minutes of live marketplace round-trip mid-suite.
#
# So the precondition is stated and left to fail loudly. "Refresh" is the
# CardChecklist action button's label when `sortedCards.length > 0`; the SAME
# button reads "Fetch from Marketplaces" while the checklist is empty
# (CardChecklist.tsx `fetchLabel`), so this is a POSITIVE assert that cards
# exist rather than a bare negative that would also pass on a blank page, and
# the string is unique in the app. It costs nothing extra: the drill util has
# just centred that row and its own closing assertion is the alternation
# `.*Fetch from Marketplaces.*|Refresh` — this narrows it to the branch this
# flow requires.
#
# The local-run consequence is the intended one: run the setup track before
# picking this flow. NOTE it carries no `requires:` tag, so `test:e2e:pick`
# will NOT pull the seed in for you — seed explicitly. Do NOT re-add a
# self-heal branch to paper over an unseeded run.
# ============================================================
- assertVisible: "Refresh"

# ============================================================
# STEP 1 — OPEN A REAL BASE CARD's DETAIL DRAWER
# Target card #300 (a stable card in the immutable 2024 Topps Chrome Base set —
# "Julio Rodriguez", a single-player card, so it carries playerIds). It sorts
# near the BOTTOM of the ~300-card checklist, which a DOWN scroll reliably
# reaches from ANY virtualised start position (react-virtuoso does not
# deterministically mount at the top after the drill's page-scrolling, so a
# top-anchored card like #1 is NOT reliably reachable — a DOWN scroll walks to
# the bottom). waitToSettleTimeoutMs absorbs the virtualisation/reactive-refetch
# race from any concurrent Base re-sync shifting row y-coords between Maestro's
# lookup and tap dispatch.
#
# The "a DOWN scroll walks to the bottom" claim above is not something the driver
# can actually do, and the old 30s ceiling was budgeting for it: maestro-web's
# only scroll is `window.scroll`, so it never drives react-virtuoso's own
# scroller. In both green CI runs the row was already rendered at try 0. If
# virtuoso ever mounts somewhere that does not include card 300, this step fails
# rather than walks — that is a flow finding to fix at the source, not a ceiling.
# ============================================================

# R5 — 7000, the bar; R8 keeps the centring. MEASURED (CI 34349299679 +
# 34361627641): `Element bounds` held at y=508 across `Scrolling try count:
# 0`..`5` in both green runs — 9.92s of give-up, the longest in this area.
# That is NOT a pinned element. maestro-web's only scroll is
# `window.scroll`, and the row lives in a react-virtuoso list with a fixed
# `height: min(70vh, 800px)` and no `customScrollParent` — so the driver
# never touches the list's own scroller, and the row was frozen only
# because the WINDOW had no headroom left. The 208px spacer in
# src/layouts/binder-layout.tsx supplies it: 508 - 208 = 300, mid-band.
# Both green runs found the row already rendered at try 0, so no walk was
# needed; the walk this step's old 30000 was budgeting for is not something
# the driver can do anyway (it cannot scroll Virtuoso), which is a separate
# finding, not a ceiling.
- scrollUntilVisible:
    element:
      id: "Edit card 300(, .*)?"
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000
- tapOn:
    id: "Edit card 300(, .*)?"
    waitToSettleTimeoutMs: 2000
# NEO-109 class: the scroll above proves card 300 EXISTS, so a failure here is
# the detail drawer not having opened yet — not a missing card. A bare
# assertVisible gives the drawer no time at all; wait for it the same
# result-keyed way the rest of this suite waits on a revealed surface.
#
# SCROLL, don't just wait. CardDetailPanel renders AFTER the virtuoso list
# container (CardChecklist.tsx), and that list is `height: min(70vh, 800px)` —
# ~437px of the 625px headless viewport. So the panel opens BELOW the fold, and
# `extendedWaitUntil: visible` (which never scrolls) timed out even though the
# drawer was mounted and correct — the failure screenshot showed a healthy card
# list with no drawer in frame. scrollUntilVisible both waits and scrolls, so a
# drawer that genuinely fails to open still fails here.
# R5 — 7000, the bar (was 20000). MEASURED (CI 34349299679 + 34361627641):
# settles in 0.56s, 0 centring swipes; nothing here waits on a marketplace.
- scrollUntilVisible:
    element:
      id: "Card name"
    centerElement: true
    timeout: 7000

# Confirm we opened the intended card (drawer header shows "Card #300").
- assertVisible:
    text: ".*Card #300.*"

# ============================================================
# STEP 3 — PRECONDITION: SET Signed By TO A UNIQUE SENTINEL (editor expanded)
# Signed By is a row INSIDE the CardFeaturesEditor, so expand it first. The editor
# is collapsed by default (position 3 in the drawer body, near the top).
# centerElement keeps the toggle fully in view (R8). Then
# ONE manual in-drawer swipe (x=80% = 819px — inside the right-anchored drawer,
# `sm:w-[45rem]` = 720px at 1024 since NEO-272, and inside the 480px box before
# it; scrollUntilVisible can't drive the drawer's inner scroll at either width,
# see the LAYOUT NOTE above) lifts the Signed By row into the tap band. A
# per-attempt UNIQUE sentinel
# guarantees it differs from the real player name, so Step 6 can prove the flip
# OVERWROTE it. The card feature inputs carry unique per-field marker classes
# (useFieldTestClass on CardFeatureRow), so inputText lands in Signed By, not the
# first shared-class text input.
# ============================================================

- scrollUntilVisible:
    element:
      id: "Show features editor"
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000
- tapOn:
    id: "Show features editor"
- assertVisible:
    id: "Card features editor"

- swipe:
    start: "80%, 60%"
    end: "80%, 38%"

- assertVisible:
    id: "Value for Signed By"
- tapOn:
    id: "Value for Signed By"
- eraseText: 60
- inputText: "SBSENT-${ATTEMPT_ID}"
- pressKey: Enter
# Single-row Convex patch — confirm the sentinel landed within the 7s write SLA.
- extendedWaitUntil:
    visible:
      id: "Value for Signed By"
      text: ".*SBSENT-${ATTEMPT_ID}.*"
    timeout: 7000

# ============================================================
# STEP 4 — COLLAPSE THE EDITOR so pos-7 Autographed becomes reachable
# Reset the drawer's inner scroll to the top with a large UP swipe (finger moves
# DOWN, so content scrolls up and clamps at scrollTop 0 — deterministic). That
# brings the editor's "Hide features editor" toggle (editor header, near the top)
# back into view; tap it to COLLAPSE the editor. With the editor collapsed the
# drawer is short and the always-visible Autographed control at pos 7 sits just
# past the fold — reachable with a single swipe (Step 5), exactly as
# card-autograph-always-visible-saves.yaml does it. The hard assert of
# "Show features editor" gates that the collapse actually happened (R2).
# ============================================================

- swipe:
    start: "80%, 25%"
    end: "80%, 90%"
- assertVisible:
    id: "Hide features editor"
- tapOn:
    id: "Hide features editor"
- assertVisible:
    id: "Show features editor"

# ============================================================
# STEP 5 — NORMALISE + FLIP Autographed (pos 7, editor collapsed, ONE visit)
# One short in-drawer swipe lifts the always-visible Autographed grid cell into
# the tap band. Autographed is now a TWO-PILL exclusive toggle group (NEO-71-74:
# ToggleOptionsValueControl), NOT a native <select>. Two pills render — "Auto
# (On Card)" (stored value "On Card") and "Auto (Sticker)" (stored value
# "Sticker/Label"); "None" (options[0]) is the implicit OFF value and has no pill
# of its own. Click semantics (handleChange): clicking an INACTIVE pill SETS its
# value directly (regardless of the prior value); clicking the ACTIVE pill reverts
# to "None".
#
# WHY A FIXED 3-TAP SEQUENCE (not a conditional on the current value):
#   Maestro-web cannot read a pill's pressed-state (aria-pressed is invisible to
#   the CDP bridge — the same limitation card-detail-panel.yaml documents for the
#   RC attribute chip), so we cannot branch on "is On Card currently active?".
#   We don't need to: this flow is the card's SOLE writer of `autographed` and it
#   only ever sets None or On Card (never Sticker), so the ONLY leftover start
#   states a prior/interrupted run can leave are {None, On Card}. A fixed sequence
#   is therefore fully deterministic:
#     Tap 1 — Auto (Sticker): "Sticker" is INACTIVE in BOTH None and On Card, so
#       this SETS "Sticker/Label" directly → deterministic "Sticker/Label"
#       regardless of the leftover start state.
#     Tap 2 — Auto (Sticker) again: now ACTIVE → reverts to the off value "None" →
#       deterministic "None". This is the wasBlank precondition the auto-fill needs.
#     Tap 3 — Auto (On Card): INACTIVE at "None" → SETS "On Card". This None→On Card
#       transition is THE ACTION under test: because card #300 has playerIds and
#       autographed was blank, setCardFeature auto-seeds signedBy = the player
#       name(s), OVERWRITING the sentinel.
#   Each pill is `disabled={busy}` while its onSave (a single-row Convex patch) is
#   in flight, so a follow-up tap on a still-disabled pill would no-op. waitToSettleTimeoutMs
#   on taps 1 and 2 makes Maestro wait for the hierarchy to settle (write done →
#   button re-enabled → re-render) BEFORE the next tap, so each tap lands on an
#   enabled pill. Unlike the old <select> (whose selected-option TEXT was readable),
#   the pills expose no readable state to assert here — the flip's correctness is
#   asserted AUTHORITATIVELY by Step 6 (Signed By became "Julio …" and is no longer
#   the sentinel), the same "assert the round-tripped side-effect, not the toggle's
#   own state" pattern card-detail-panel.yaml uses for the RC chip.
# ============================================================

- swipe:
    start: "80%, 70%"
    end: "80%, 35%"

# NOTE ON THE PILL id MATCHERS BELOW: Maestro compiles `id:` as a REGEX, so the
# literal parens in the pill aria-labels ("… Auto (Sticker)") must be ESCAPED
# (\( \)) — an un-escaped "(Sticker)" is parsed as a regex capture group and
# matches "Sticker" WITHOUT the parens, so it never matches the real resource-id.
# The leading/trailing .* keeps the match robust to Maestro's full-vs-substring id
# semantics. (Confirmed at run time: the un-escaped form failed to find the pill.)

# Confirm the swipe lifted the Autographed pill group into the tap band.
- assertVisible:
    id: ".*Value for Autographed: Auto \\(Sticker\\).*"

# Tap 1 — set Sticker directly (inactive in both {None, On Card}) → deterministic "Sticker/Label".
- tapOn:
    id: ".*Value for Autographed: Auto \\(Sticker\\).*"
    waitToSettleTimeoutMs: 2000
# Tap 2 — Sticker now active → revert to "None" (the wasBlank precondition).
- tapOn:
    id: ".*Value for Autographed: Auto \\(Sticker\\).*"
    waitToSettleTimeoutMs: 2000
# Tap 3 — THE ACTION: On Card inactive at "None" → SET "On Card". None→On Card
# fires the Signed By auto-fill. Its result is asserted authoritatively in Step 6.
- tapOn:
    id: ".*Value for Autographed: Auto \\(On Card\\).*"
    waitToSettleTimeoutMs: 2000

# ============================================================
# STEP 6 — RE-EXPAND THE EDITOR + ASSERT the auto-fill landed on Signed By
# Reset to top (large UP swipe clamps at scrollTop 0), re-expand the editor, and
# swipe back to the Signed By row.
#   (a) POSITIVE: Signed By now shows the card's player — card #300 is Julio
#       Rodriguez (a stable single-player card in the immutable 2024 Topps Chrome
#       Base set), so the auto-fill seeds signedBy = "Julio …". Matching ".*Julio.*"
#       is robust to surname accent/spelling and proves the player NAME landed,
#       not merely "something changed".
#   (b) CORE R2: Signed By is NO LONGER the sentinel — the None→On-Card transition
#       overwrote it. The only writer of signedBy on this transition is the
#       auto-fill (player names), and this flow is the card's sole writer, so the
#       change off the sentinel to the player name proves the auto-fill fired.
#       (Self-serves the "card has players" precondition: no playerIds →
#       names.length 0 → the mutation's `if (names.length > 0)` guard skips the
#       write → signedBy stays the sentinel → both (a) and (b) fail loudly.)
# ============================================================

- swipe:
    start: "80%, 25%"
    end: "80%, 90%"
- assertVisible:
    id: "Show features editor"
- tapOn:
    id: "Show features editor"
- assertVisible:
    id: "Card features editor"

- swipe:
    start: "80%, 60%"
    end: "80%, 38%"

- extendedWaitUntil:
    visible:
      id: "Value for Signed By"
      text: ".*Julio.*"
    timeout: 7000
- assertNotVisible:
    id: "Value for Signed By"
    text: ".*SBSENT-${ATTEMPT_ID}.*"

# ============================================================
# STEP 7 — CLOSE (no autographed restore — next run's normalise self-heals)
# NEO-216: the drawer has no Save/Cancel pair and no draft — every field writes
# itself. This flow touched only the per-row feature controls, which have always
# persisted immediately via setCardFeature, so "Done" simply closes and no
# name/title/description/attribute write was ever sent. Leaving autographed
# "On Card" is inert under sole-writer tolerance; the next run's Step 5
# normalise turns it back to "None" before flipping.
# ============================================================

- assertVisible:
    id: "Done editing card"
- tapOn:
    id: "Done editing card"
- assertNotVisible:
    id: "Card name"

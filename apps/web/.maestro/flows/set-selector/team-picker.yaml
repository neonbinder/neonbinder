appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "TeamPicker — chip add, remove, keyboard Enter, 'No matches' state, autosaved on the tap"
tags:
  - set-selector
---
# Full feature test for the NEO-26 TeamPicker chip-list component.
#
# WHAT THIS TESTS:
#   1. The old free-text team input is gone — no "Team" text field visible in edit form.
#   2. "+ Add team" button exists and opens the popover.
#   3. Typing a name the app does not know offers "+ New team", taking it opens
#      the New Team dialog, and that dialog's Create button adds a chip for the
#      team it just made (NEO-236).
#   4. Typing an existing name filters the typeahead list to it.
#   5. The "Remove team <name>" button removes the chip.
#   6. Typing a non-existent name shows "No matches." in the popover.
#   7. Pressing Enter on the highlighted match adds the chip (keyboard path).
#   8. NEO-216 autosave: the picker writes on the TAP — closing the drawer and
#      reopening it shows the chip still attached, with no save action in
#      between. (This replaces the old "Cancel reverts the chip" test: there is
#      no draft to revert any more, and no Cancel button to revert it with.)
#   9. The team name reaches the ROW and survives a full page reload + re-drill.
#
# PER-WORKER DATA ISOLATION:
#   Drills to Baseball → 2024 → Topps → tp-<WORKER_INDEX> (custom set) →
#   custom Insert VT → "Base" (custom insert variant). Each worker has its own
#   checklist — no concurrent checklist contention with the cascade's
#   Topps Chrome path.
#
#   WHY Baseball/2024/Topps (not E2E Test Sport ${WORKER_INDEX}/2026):
#     The hand-made Set (tp-<worker>) carries no marketplace ids, so neither
#     side is resolvable and neither BSC nor SportLots is ever fetched
#     (NEO-239), while the real Baseball ancestor keeps sport="baseball" —
#     and TeamPicker is sport-scoped
#     in both directions: it filters its candidate list by the sport row and it
#     TAGS a team it creates with the same one, which is also what enables its
#     "+ New team" row at all (no sport row, no creation — NEO-96).
#
#   THE TEAM IS THIS FLOW'S OWN (NEO-214):
#     It used to pick "New York Yankees" and "New York Mets" out of a global
#     fixture that setup.yaml seeded by clicking a "Seed Test Teams" button.
#     That button and the mutation behind it are gone, so `teams` is empty until
#     a flow fills it — and this flow, being a test OF the team picker, is
#     exactly the right place to create one. It uses a single team named
#     "TPT<token>", where the token is ATTEMPT_ID ("w<worker>-a<attempt>-<rand>")
#     and therefore unique per worker AND per attempt. Per-attempt matters
#     mechanically: "+ New team <name>" is offered only while no team of that name
#     exists, so a name a previous attempt left behind would render "Add <name>"
#     instead and TEST 2 would be reaching for a control that is not there.
#
# Uses a fresh custom card (card #889) for each sub-test to avoid state bleed.

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ── The minted name's single search token (SET-REGISTRY.md, "A name typed into
# a team picker must be a SINGLE search token") ──────────────────────────────
# `teams.search` / `players.search` are Convex SEARCH indexes: they match on
# TOKENS split at non-alphanumerics, so a hyphenated `Prefix-<attempt>` name
# tokenizes to ["Prefix", "<attempt>"] and every row any flow ever left behind
# under that prefix comes back as a suggestion — the per-attempt suffix buys
# nothing. Nothing deletes a team (the app has no delete-team affordance; the
# picker's "Remove team" only unlinks it from the card), so those rows stand for
# the whole run and are visible to every concurrent worker. The names below are
# therefore ONE alphanumeric token with no separator at all.
#
# The token is ATTEMPT_ID with its hyphens stripped: "w3-a1-23945" is three
# search terms, "w3a123945" is one — and it still carries the worker index, so
# the per-worker distinction the old `${WORKER_INDEX}` prefix gave is folded in
# rather than separated out.
#
# ⚠️ READ `ATTEMPT_ID`, NOT `output.ATTEMPT_ID`. The runner injects it with
# `-e ATTEMPT_ID=…`, which Maestro exposes as the binding `${ATTEMPT_ID}`; it
# never populates `output.ATTEMPT_ID`, so the older idiom always fell through to
# its 4-digit `Date.now()` fallback and two runners collided constantly.
#
# Single-quoted: the expression contains double quotes, and quoting the scalar
# keeps YAML out of it. `Date.now()` is the standalone-run fallback.
- evalScript: '${output.ATTEMPT_TOKEN = String(ATTEMPT_ID || Date.now()).split("-").join("")}'

# ============================================================
# DRILL TO PER-WORKER CUSTOM SET
# Baseball → 2024 → Topps → tp-<WORKER_INDEX> → Insert VT → "Base" insert
# Delegated to util-drill-to-custom.yaml which handles real-synced levels
# (Baseball/2024/Topps exist as marketplace data) and the custom Set + VT +
# Variant uniformly and idempotently.
# ============================================================

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "tp-${WORKER_INDEX || 0}"
      VARIANT_TYPE: "Insert"
      VARIANT: "Base"

# Wait for the CardChecklist panel to appear.
# (util-drill-to-custom scrolls "Open add card form" into view on return,
# but an explicit scroll here is the canonical entry point before card ops.)
- scrollUntilVisible:
    element:
      id: "Open add card form"
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000

# Per-attempt-unique card number + player name. The runner injects
# ATTEMPT_ID="w<worker>-a<attempt>-<RANDOM>" so attempt-2 doesn't
# collide with attempt-1's row left in the per-worker cardChecklist.

# ============================================================
# Add a custom card to serve as the test target.
# ============================================================

- tapOn:
    id: "Open add card form"
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 15000
- inputText: "889-${ATTEMPT_ID}"
- tapOn: "Player name"
- inputText: "Team Feature Player ${ATTEMPT_ID}"
# Scroll the "Submit new card" (Add) button into center before tapping. It sits
# at the bottom of the add-card form, at y=610-642 — below the fold on the
# 1024×629 CI viewport. centerElement lands it near y≈315 so its own
# scroll-before-tap CDP call has content to scroll to — WITHOUT it, scrollToPoint
# gets an empty JS result and the tap crashes with "null cannot be cast to
# non-null type kotlin.Int". Mirrors util-add-custom-card.yaml Step 9.
- scrollUntilVisible:
    element:
      id: "Submit new card"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Submit new card"
- assertVisible: "Team Feature Player ${ATTEMPT_ID}"

# Scroll the just-added card into view before tapping its Edit button.
- scrollUntilVisible:
    element:
      id: "Edit card 889-${ATTEMPT_ID}"
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000

# ============================================================
# TEST 1 — No old "Team" text field: the edit form shows TeamPicker only
# ============================================================

- tapOn:
    id: "Edit card 889-${ATTEMPT_ID}"
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 15000

# The TeamPicker container has aria-label "Team picker".
- assertVisible:
    id: "Team picker"

# The "+ Add team" trigger is visible.
- assertVisible:
    id: "Add team"

# ============================================================
# TEST 2 — Open the popover, type a name the app does not know, take the
# "+ New team" row it offers and create the team in the dialog that opens. This
# is the picker's escape hatch (teams.findOrCreate) and it is what gives every
# later sub-test a team to find.
# (In-place form-field taps use direct tapOn by aria-label — the form
# is already in-viewport after the Edit tap above; no scroll needed.)
# ============================================================

- tapOn:
    id: "Add team"
- assertVisible:
    id: "Search teams"

- tapOn:
    id: "Search teams"
- inputText: "TPT${output.ATTEMPT_TOKEN}"
# NEO-236 — the popover's ONE create affordance opens a dialog rather than
# writing: `+ New team "<typed>"…`, accessible name `New team <typed>`. It is
# labelled with the name it would create, so this cannot be satisfied by some
# other team's row — and it is offered only because no team of this name exists,
# which is the precondition TEST 5 then reverses.
- assertVisible:
    id: "New team TPT${output.ATTEMPT_TOKEN}"

- tapOn:
    id: "New team TPT${output.ATTEMPT_TOKEN}"

# The New Team dialog — portalled to `document.body` at `z-[60]`, `fixed inset-0`
# and centred, so nothing clips it. It is where the three questions a team row
# needs (Location, Team name, League) are answered and where the write happens.
#
# TWO assertions, because they say two different things.
#
# The HEADING is the dialog's `aria-labelledby` target, so it is what a screen
# reader announces on arrival — "New team: <what I typed>" is the dialog being
# correctly LABELLED. (It briefly was not: opening by CLICK used to blank the
# name, because the picker's focus-out handler read a stale "is the dialog open"
# flag and cleared the query behind the portal. Fixed under NEO-236 with a
# synchronous ref; this assertion is what keeps it fixed.)
#
# The NAME BOX and its VALUE is the dialog being correctly SEEDED — maestro-web
# reports an input by its value, so this says the search text really reached the
# field the operator is about to submit.
- assertVisible: "New team: TPT${output.ATTEMPT_TOKEN}"
- assertVisible:
    id: "New team name"
    text: "TPT${output.ATTEMPT_TOKEN}"

# THE WRITE. Nothing is typed in the dialog: Team name is pre-filled with what
# was searched, Location stays blank and no League is picked, so the COMPOSED
# name is exactly what was typed and every later matcher is unchanged.
#
# `Create team <composed full name>` is the same accessible name this flow always
# used — it moved from the popover row onto the dialog's own button. Tapped by id
# rather than driven with a second Enter: Create and Cancel are NeonButtons with
# an identical class string, and maestro-web's pressKey re-finds the focused
# element by an XPath that falls back to that class, so an Enter aimed at Create
# could land on Cancel.
- tapOn:
    id: "Create team TPT${output.ATTEMPT_TOKEN}"

# The chip appears. Close popover by clicking card name.
- tapOn:
    id: "Card name"
- assertVisible:
    id: "Remove team TPT${output.ATTEMPT_TOKEN}"

# ============================================================
# TEST 3 — Remove the chip using the × button
# ============================================================

- tapOn:
    id: "Remove team TPT${output.ATTEMPT_TOKEN}"
- assertNotVisible:
    id: "Remove team TPT${output.ATTEMPT_TOKEN}"

# ============================================================
# TEST 4 — "No matches." state when search finds nothing
# ============================================================

- tapOn:
    id: "Add team"
- assertVisible:
    id: "Search teams"
- tapOn:
    id: "Search teams"
- inputText: "ZZZZNOTATEAM"
- assertVisible: "No matches."

# Close popover.
- tapOn:
    id: "Card name"

# ============================================================
# TEST 5 — Keyboard: Enter on highlighted match adds the chip
#
# The SAME team as TEST 2, and this time it is offered as a MATCH rather than as
# a create: TEST 2 really persisted a row, so an exact name now suppresses the
# "+ New team" row and the typeahead lists the team instead. That is the assertion
# in "Add TPT<token>" — it can only be satisfied by a team that exists.
# ============================================================

- tapOn:
    id: "Add team"
- assertVisible:
    id: "Search teams"
- tapOn:
    id: "Search teams"
- eraseText: 20
- inputText: "TPT${output.ATTEMPT_TOKEN}"
# NEO-254 — the optional `( · <era>)` tail. A TeamPicker option's accessible
# name is `Add {teamOptionLabel}`, which appends " · 1972–1996" once the row
# carries a `yearsActive`. This flow's team is created through the dialog with
# the era boxes left blank, so today the label is the bare name — but a matcher
# is a FULL match, so the day anyone dates that fixture this selector would
# stop matching with no other symptom. The optional group costs nothing and
# covers both.
# NEO-260 kept the separator-free name (teams.search tokenises on
# non-alphanumerics, so a hyphen makes the per-attempt suffix worthless).
- assertVisible:
    id: "Add TPT${output.ATTEMPT_TOKEN}( · .*)?"

# Press Enter to confirm the highlighted first match.
- pressKey: Enter

# NEO-216: the picker writes `teamOnCardIds` on the pick itself — no Save
# button, no draft — and the drawer confirms it in its one status region. This
# is where the write happens, so this is where it is confirmed. (TEST 6 is the
# AUTHORITATIVE proof it persisted; the toast only says the mutation went out.)
- extendedWaitUntil:
    visible: ".*Saved Teams.*"
    timeout: 7000

- tapOn:
    id: "Card name"

# The chip should now be back.
- assertVisible:
    id: "Remove team TPT${output.ATTEMPT_TOKEN}"

# ============================================================
# TEST 6 — NEO-216: the pick was ALREADY saved, so closing keeps it
#
# The drawer has no Save button and no draft. TeamPicker calls updateCard with
# `teamOnCardIds` on the tap itself and the drawer confirms it, so leaving and
# coming back must show the same chip. This is the assertion that would fail if
# the picker ever went back to writing into a draft.
# ============================================================

# "Done" is the only close control now; it sits in the drawer's pinned footer,
# outside the scroll container, so it needs no scroll (R8 exception).
- tapOn:
    id: "Done editing card"
- assertNotVisible: "Card name"

# Re-open — the chip is still there, unsaved by anything.
- tapOn:
    id: "Edit card 889-${ATTEMPT_ID}"
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 15000

- assertVisible:
    id: "Remove team TPT${output.ATTEMPT_TOKEN}"

# ============================================================
# TEST 7 — the write reaches the ROW and survives a reload
#
# NOTHING IS ADDED HERE, deliberately. Since NEO-214 this flow owns ONE team,
# and TEST 5 already re-attached it — so re-adding would be reaching for a
# control the picker does not render: `matches` drops every id already in
# `value` (TeamPicker.tsx), and an exact case-insensitive name match also
# suppresses the "+ New team" row, so typing "TPT<token>" with the chip
# attached shows "No matches." That is correct product behaviour, not a bug —
# the flow simply has nothing left to add. What is still unproven at this point
# is that the write reached the ROW behind the drawer and survives a reload,
# and that is all this step does.
# ============================================================

# Close the drawer and read the row underneath.
- tapOn:
    id: "Done editing card"
- assertVisible: "Team Feature Player ${ATTEMPT_ID}"

- assertVisible:
    text: ".*TPT${output.ATTEMPT_TOKEN}.*"

# ============================================================
# Reload and re-drill to the SAME per-worker custom set to confirm
# persistence. Baseball/2024/Topps/tp-<worker>/Insert/Base.
# All real-synced levels (Baseball/2024/Topps) are already warm in
# selectorOptions; the custom Set/VT/Variant already exist from the
# first drill — util-drill-to-custom handles both idempotently.
# ============================================================

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "tp-${WORKER_INDEX || 0}"
      VARIANT_TYPE: "Insert"
      VARIANT: "Base"

# After reload, find our card and confirm the team name is in the sub-line.
# R5 — 7000, the bar (was 30000). MEASURED (CI 34349299679 + 34361627641):
# settles in 0.55s, 0 centring swipes; nothing here waits on a marketplace.
- scrollUntilVisible:
    element:
      text: "Team Feature Player ${ATTEMPT_ID}"
    timeout: 7000
- assertVisible:
    text: ".*TPT${output.ATTEMPT_TOKEN}.*"

# ============================================================
# CLEANUP — delete this attempt's test card
# ============================================================

- tapOn:
    id: "Delete card 889-${ATTEMPT_ID}"
- assertVisible: "Confirm?"
- tapOn:
    id: "Confirm delete card 889-${ATTEMPT_ID}"
- assertNotVisible: "Team Feature Player ${ATTEMPT_ID}"

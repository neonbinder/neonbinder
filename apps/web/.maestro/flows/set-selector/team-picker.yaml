appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "TeamPicker — chip add, remove, keyboard Enter, 'No matches' state, cancel reverts"
tags:
  - set-selector
  - regression
---
# Full feature test for the NEO-26 TeamPicker chip-list component.
#
# WHAT THIS TESTS:
#   1. The old free-text team input is gone — no "Team" text field visible in edit form.
#   2. "+ Add team" button exists and opens the popover.
#   3. Typing a name the app does not know offers "+ Create", and taking it adds
#      a chip for the team it just created.
#   4. Typing an existing name filters the typeahead list to it.
#   5. The "Remove team <name>" button removes the chip.
#   6. Typing a non-existent name shows "No matches." in the popover.
#   7. Pressing Enter on the highlighted match adds the chip (keyboard path).
#   8. Cancel revert: opening the edit form, adding a chip, then clicking Cancel
#      reverts the chip list back to the original state.
#   9. Saving a team and reloading the page shows the team name persists.
#
# PER-WORKER DATA ISOLATION:
#   Drills to Baseball → 2024 → Topps → tp-<WORKER_INDEX> (custom set) →
#   custom Insert VT → "Base" (custom insert variant). Each worker has its own
#   checklist — no concurrent checklist contention with the cascade's
#   Topps Chrome path.
#
#   WHY Baseball/2024/Topps (not E2E Test Sport ${WORKER_INDEX}/2026):
#     The hand-made Set (tp-<worker>) carries no marketplace ids, so neither
#     side is resolvable and neither BSC nor SportLots is ever fetched
#     (NEO-239), while the real Baseball ancestor keeps sport="baseball" —
#     and TeamPicker is sport-scoped
#     in both directions: it filters its candidate list by the sport row and it
#     TAGS a team it creates with the same one, which is also what enables its
#     "+ Create" row at all (no sport row, no creation — NEO-96).
#
#   THE TEAM IS THIS FLOW'S OWN (NEO-214):
#     It used to pick "New York Yankees" and "New York Mets" out of a global
#     fixture that setup.yaml seeded by clicking a "Seed Test Teams" button.
#     That button and the mutation behind it are gone, so `teams` is empty until
#     a flow fills it — and this flow, being a test OF the team picker, is
#     exactly the right place to create one. It uses a single team named
#     "TPT-<attempt>", where ATTEMPT_ID is already "w<worker>-a<attempt>-<rand>"
#     and therefore unique per worker AND per attempt. Per-attempt matters
#     mechanically: "+ Create <name>" is offered only while no team of that name
#     exists, so a name a previous attempt left behind would render "Add <name>"
#     instead and TEST 2 would be reaching for a control that is not there.
#
# Uses a fresh custom card (card #889) for each sub-test to avoid state bleed.

# ============================================================
# LAUNCH + SIGN IN
# ============================================================

- launchApp
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 45000

# ============================================================
# DRILL TO PER-WORKER CUSTOM SET
# Baseball → 2024 → Topps → tp-<WORKER_INDEX> → Insert VT → "Base" insert
# Delegated to util-drill-to-custom.yaml which handles real-synced levels
# (Baseball/2024/Topps exist as marketplace data) and the custom Set + VT +
# Variant uniformly and idempotently.
# ============================================================

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "tp-${WORKER_INDEX || 0}"
      VARIANT_TYPE: "Insert"
      VARIANT: "Base"

# Wait for the CardChecklist panel to appear.
# (util-drill-to-custom scrolls "Open add card form" into view on return,
# but an explicit scroll here is the canonical entry point before card ops.)
- scrollUntilVisible:
    element:
      id: "Open add card form"
    centerElement: true
    visibilityPercentage: 50
    timeout: 15000

# Per-attempt-unique card number + player name. The runner injects
# ATTEMPT_ID="w<worker>-a<attempt>-<RANDOM>" so attempt-2 doesn't
# collide with attempt-1's row left in the per-worker cardChecklist.

# ============================================================
# Add a custom card to serve as the test target.
# ============================================================

- tapOn:
    id: "Open add card form"
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 15000
- inputText: "889-${ATTEMPT_ID}"
- tapOn: "Player name"
- inputText: "Team Feature Player ${ATTEMPT_ID}"
# Scroll the "Submit new card" (Add) button into center before tapping. It sits
# at the bottom of the add-card form, at y=610-642 — below the fold on the
# 1024×629 CI viewport. centerElement lands it near y≈315 so its own
# scroll-before-tap CDP call has content to scroll to — WITHOUT it, scrollToPoint
# gets an empty JS result and the tap crashes with "null cannot be cast to
# non-null type kotlin.Int". Mirrors util-add-custom-card.yaml Step 9.
- scrollUntilVisible:
    element:
      id: "Submit new card"
    centerElement: true
    timeout: 10000
- tapOn:
    id: "Submit new card"
- assertVisible: "Team Feature Player ${ATTEMPT_ID}"

# Scroll the just-added card into view before tapping its Edit button.
- scrollUntilVisible:
    element:
      id: "Edit card 889-${ATTEMPT_ID}"
    centerElement: true
    visibilityPercentage: 50
    timeout: 10000

# ============================================================
# TEST 1 — No old "Team" text field: the edit form shows TeamPicker only
# ============================================================

- tapOn:
    id: "Edit card 889-${ATTEMPT_ID}"
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 15000

# The TeamPicker container has aria-label "Team picker".
- assertVisible:
    id: "Team picker"

# The "+ Add team" trigger is visible.
- assertVisible:
    id: "Add team"

# ============================================================
# TEST 2 — Open the popover, type a name the app does not know, and take the
# "+ Create" row it offers. This is the picker's escape hatch (teams.findOrCreate)
# and it is what gives every later sub-test a team to find.
# (In-place form-field taps use direct tapOn by aria-label — the form
# is already in-viewport after the Edit tap above; no scroll needed.)
# ============================================================

- tapOn:
    id: "Add team"
- assertVisible:
    id: "Search teams"

- tapOn:
    id: "Search teams"
- inputText: "TPT-${ATTEMPT_ID}"
# The row is labelled with the name it would create, so this cannot be satisfied
# by some other team's row — and it is offered only because no team of this name
# exists, which is the precondition TEST 5 then reverses.
- assertVisible:
    id: "Create team TPT-${ATTEMPT_ID}"

- tapOn:
    id: "Create team TPT-${ATTEMPT_ID}"

# The chip appears. Close popover by clicking card name.
- tapOn:
    id: "Card name"
- assertVisible:
    id: "Remove team TPT-${ATTEMPT_ID}"

# ============================================================
# TEST 3 — Remove the chip using the × button
# ============================================================

- tapOn:
    id: "Remove team TPT-${ATTEMPT_ID}"
- assertNotVisible:
    id: "Remove team TPT-${ATTEMPT_ID}"

# ============================================================
# TEST 4 — "No matches." state when search finds nothing
# ============================================================

- tapOn:
    id: "Add team"
- assertVisible:
    id: "Search teams"
- tapOn:
    id: "Search teams"
- inputText: "ZZZZNOTATEAM"
- assertVisible: "No matches."

# Close popover.
- tapOn:
    id: "Card name"

# ============================================================
# TEST 5 — Keyboard: Enter on highlighted match adds the chip
#
# The SAME team as TEST 2, and this time it is offered as a MATCH rather than as
# a create: TEST 2 really persisted a row, so an exact name now suppresses the
# "+ Create" row and the typeahead lists the team instead. That is the assertion
# in "Add TPT-…" — it can only be satisfied by a team that exists.
# ============================================================

- tapOn:
    id: "Add team"
- assertVisible:
    id: "Search teams"
- tapOn:
    id: "Search teams"
- eraseText: 20
- inputText: "TPT-${ATTEMPT_ID}"
- assertVisible:
    id: "Add TPT-${ATTEMPT_ID}"

# Press Enter to confirm the highlighted first match.
- pressKey: Enter
- tapOn:
    id: "Card name"

# The chip should now be back.
- assertVisible:
    id: "Remove team TPT-${ATTEMPT_ID}"

# ============================================================
# TEST 6 — Cancel reverts the team edit
# ============================================================

# Cancel — chip should disappear.
- tapOn:
    id: "Cancel card edit"
- assertNotVisible: "Card name"

# Re-open edit — no chip (we never saved).
- tapOn:
    id: "Edit card 889-${ATTEMPT_ID}"
    waitToSettleTimeoutMs: 2000
- extendedWaitUntil:
    visible:
      id: "Card name"
    timeout: 15000

# Only the "+ Add team" trigger — no chip.
- assertVisible:
    id: "Add team"

# ============================================================
# TEST 7 — Save + reload persists the team name
# ============================================================

# Add the team again and save.
- tapOn:
    id: "Add team"
- assertVisible:
    id: "Search teams"
- tapOn:
    id: "Search teams"
- inputText: "TPT-${ATTEMPT_ID}"
- assertVisible:
    id: "Add TPT-${ATTEMPT_ID}"
- tapOn:
    id: "Add TPT-${ATTEMPT_ID}"
- tapOn:
    id: "Card name"
- tapOn:
    id: "Save card edit"
- assertVisible: "Team Feature Player ${ATTEMPT_ID}"

- assertVisible:
    text: ".*TPT-${ATTEMPT_ID}.*"

# ============================================================
# Reload and re-drill to the SAME per-worker custom set to confirm
# persistence. Baseball/2024/Topps/tp-<worker>/Insert/Base.
# All real-synced levels (Baseball/2024/Topps) are already warm in
# selectorOptions; the custom Set/VT/Variant already exist from the
# first drill — util-drill-to-custom handles both idempotently.
# ============================================================

- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: "tp-${WORKER_INDEX || 0}"
      VARIANT_TYPE: "Insert"
      VARIANT: "Base"

# After reload, find our card and confirm the team name is in the sub-line.
- scrollUntilVisible:
    element:
      text: "Team Feature Player ${ATTEMPT_ID}"
    timeout: 30000
- assertVisible:
    text: ".*TPT-${ATTEMPT_ID}.*"

# ============================================================
# CLEANUP — delete this attempt's test card
# ============================================================

- tapOn:
    id: "Delete card 889-${ATTEMPT_ID}"
- assertVisible: "Confirm?"
- tapOn:
    id: "Confirm delete card 889-${ATTEMPT_ID}"
- assertNotVisible: "Team Feature Player ${ATTEMPT_ID}"

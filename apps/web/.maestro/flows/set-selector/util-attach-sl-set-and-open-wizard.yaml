appId: com.neonbinder.web
name: "Util — attach one SportLots source set to a per-worker set, sync it, and land in the entity-review wizard"
tags:
  - util
---
# ============================================================================
# WHAT THIS UTIL IS FOR (NEO-248)
#
# The entity-review wizard only ever opens on names a MARKETPLACE fetch brought
# back and NeonBinder does not already know. Since quick-add's Players field
# became a PlayerPicker, a hand-added card is born LINKED and carries no pending
# name, so a marketplace-free per-worker set can no longer produce an unknown at
# all — which is why six wizard flows were retired (see .maestro/SET-REGISTRY.md).
#
# NEO-239 gives the coverage back without touching a shared real set. A
# marketplace side is fetched only when the ids THAT SIDE needs are present on
# the ancestors, and the two sides need different things:
#
#   BSC         sport, year, setName (+ a `variant`-tagged slot on variantType)
#   SportLots   sport, year          (the set id comes off the deepest variant row)
#
# So a hand-typed set under the REAL Baseball / 2024 / Topps ancestors is
# BSC-unresolvable for good (its setName row has no BSC id and never will), while
# SportLots becomes resolvable the moment ONE SportLots set id is attached to the
# variant row through the Multi-source panel. The result is a private, per-worker,
# per-attempt set that fetches a REAL marketplace checklist from exactly one
# source — real unknown names, no shared row written, no BSC cost.
#
# ── WHAT THE CALLER GETS BACK ───────────────────────────────────────────────
#   The entity-review wizard is OPEN on the caller's own set, with every row
#   undecided ("0 of N reviewed"), and the card-pairing session is PARKED behind
#   it (so "Back to matching" is offered).
#
# ── INPUTS ──────────────────────────────────────────────────────────────────
#   SET_NAME        REQUIRED. The caller's per-worker, per-attempt set name.
#                   Register its prefix in .maestro/SET-REGISTRY.md.
#   SL_SOURCE_SET   The SportLots set to attach. Defaults to the suite-wide
#                   constant below — see the ⚠️ block.
#
# ── ⚠️ THE SPORTLOTS SOURCE SET — ONE CONSTANT, ONE PLACE ───────────────────
#   This is the ONLY place the SportLots set is named. Everything else takes it
#   from here.
#
#   IT IS A PLACEHOLDER AND THE SUITE CANNOT RUN UNTIL AN OWNER-APPROVED SET
#   REPLACES IT. The set has to satisfy all of the following at once, and only a live
#   probe against a deployment carrying NEO-239 can confirm them:
#
#     1. small — every card is fetched, paired and reviewed in this flow;
#     1b. but NOT tiny: it must surface AT LEAST TWO unknown names. Three of the
#        four consumers decide one row by hand and then bulk-decide "the rest",
#        and "Skip Remaining"/"Add All Remaining" render only while at least one
#        row is still undecided;
#     2. its PLAYERS are NOT already in `players`. `setup.yaml` commits every
#        2024 Topps Chrome Base / Future Stars / Gold Wave player, and a name
#        the roster already holds is not an unknown — it never reaches the
#        wizard. A set whose players are all known opens no wizard at all;
#     3. its TEAMS ARE already known (ordinary MLB clubs, which setup's Topps
#        Chrome commit creates). The wizard presents ONE row at a time and
#        which row settles first is a race between live Wikidata lookups, so a
#        set that also queues unknown TEAMS makes "the current row is a player"
#        a coin flip — and two of the four consumers (link-to-existing,
#        career-team) act on controls that only a player row renders.
#
#     4. NO OTHER SportLots set in the same pane may contain its name as a
#        substring. Maestro matches an `id:` (an aria-label) as a REGEX FIND, so
#        `Edit label for Topps Series 1` would also match
#        `Edit label for Topps Series 1 Chrome`, and the chip assertion
#        (`Remove <name>`) has the same shape. The pane is filtered to the typed
#        name first, so the check is: with that name typed, exactly ONE candidate
#        row is left.
#
#   Name it EXACTLY as the attach pane DISPLAYS it: `fetchSlAttachSets` passes
#   `labelContext: { manufacturer }`, which strips the brand prefix, so the
#   pane's label can differ from SportLots' own raw name.
#
#   See .maestro/SET-REGISTRY.md → "SportLots source set for the entity-review
#   wizard fixtures". Adding it requires explicit owner approval, every time.
# ============================================================================

# ONE PLACE, ONE CONSTANT. Every reference below is `${output.SL_SET}`; the
# literal appears exactly once, here, so the approved set replaces it in a
# one-line diff.
- evalScript: ${output.SL_SET = SL_SOURCE_SET || "Big League Mascots"}

# ── DRILL (R9) ──────────────────────────────────────────────────────────────
# Real Baseball / 2024 / Topps ancestors, hand-typed Set → Insert → Base.
# The real Sport ancestor is what keeps `sport="baseball"` (so the setup-synced
# roster is a real link target and entity lookups behave as on a real set) and
# what carries the SportLots sport/year ids the checklist fetch needs. The
# hand-typed Set is what keeps BSC out of it.
- runFlow:
    file: util-drill-to-custom.yaml
    env:
      SPORT: "Baseball"
      YEAR: "2024"
      MANUFACTURER: "Topps"
      SET_NAME: ${SET_NAME}
      VARIANT_TYPE: "Insert"
      VARIANT: "Base"

# ── ATTACH THE SPORTLOTS SET ────────────────────────────────────────────────
# The Multi-source panel sits between the selector columns and the checklist.
# NEO-239 stopped hiding it on rows with no ids — attaching the FIRST id is
# exactly what it is for — so it renders on this hand-typed variant.
- scrollUntilVisible:
    element:
      id: "Attach more source sets"
    direction: UP
    centerElement: true
    timeout: 15000
- tapOn:
    id: "Attach more source sets"
# The dialog's own Cancel is an unambiguous "the dialog is up" marker: its
# heading text ("Attach more source sets") is also the trigger button's
# accessible name.
- extendedWaitUntil:
    visible:
      id: "Cancel attach sets"
    timeout: 15000

# Filter first, then take the row — the same rule the checklist columns follow.
# The SportLots pane is a LIVE round-trip (every SL set for Baseball / 2024 /
# Topps), so its candidates get the marketplace allowance rather than the 7s UI
# budget.
- tapOn:
    id: "Search SportLots sets"
- inputText: ${output.SL_SET}
# THE ROW IS TAKEN BY ITS NAME, ANCHORED BELOW THE INPUT — NOT BY ITS CHECKBOX.
# `CandidateRow`'s selector is a BARE `<input type="checkbox">`, and maestro-web
# emits NO hierarchy node for one: not the element, not its `aria-label`
# ("Toggle <name>"), so it can be neither tapped nor asserted. The checkbox sits
# inside the row's `<label>`, so a tap on the row's NAME toggles it natively.
# `below: { id: "Search SportLots sets" }` is the same anchoring idiom the
# checklist columns use — never `index:`, whose DOM order flips between a cold
# fetch and a re-render.
- extendedWaitUntil:
    visible:
      text: ${output.SL_SET}
      below:
        id: "Search SportLots sets"
    timeout: 60000
- tapOn:
    text: ${output.SL_SET}
    below:
      id: "Search SportLots sets"
# The per-row label field renders ONLY for a SELECTED candidate, so its presence
# is the proof the toggle actually landed — which the checkbox itself cannot
# give us. Without it, a tap that missed would fall through to a Confirm button
# that is disabled at zero selections, and the failure would surface three steps
# later as "no SportLots chip".
- assertVisible:
    id: "Edit label for ${output.SL_SET}"
- tapOn:
    id: "Confirm attach sets"
# The chip is the proof the id actually landed on OUR row — and the precondition
# for everything below, since without it SportLots stays unresolvable and the
# sync returns "no marketplace ids on this path" with no wizard at all.
- extendedWaitUntil:
    visible:
      id: "Remove ${output.SL_SET}"

# ── SYNC — A REAL, ONE-SIDED MARKETPLACE FETCH ──────────────────────────────
# BSC is skipped (the hand-typed set row carries no BSC id), so every card comes
# back on the SportLots side and lands in the pairing dialog's "SportLots only"
# bucket. 120s: this is a live SportLots checklist round-trip.
- scrollUntilVisible:
    element:
      id: "Sync card checklist"
    centerElement: true
    timeout: 15000
- tapOn:
    id: "Sync card checklist"
- extendedWaitUntil:
    visible:
      text: "SportLots only \\([0-9]+\\)"
    timeout: 120000

# ── KEEP EVERY SL-ONLY CARD, THEN CONFIRM ───────────────────────────────────
# There is nothing to pair — one source cannot disagree with itself — so the
# whole bucket is kept and the dialog is confirmed. Waiting for the button's
# VISIBLE TEXT to read "Confirm" (not "Loading…") is how this waits out the
# candidate stream; the accessible name is the same either way.
# NO scrollUntilVisible in this dialog, deliberately. Its body is its own
# `overflow-y-auto` scroller and Maestro drives the PAGE, not that container —
# `checklist-pairing-dialog-cancel` records a `scrollUntilVisible` that reported
# "No visible element found" rather than scrolling to a row inside it. Both
# controls here are reachable without scrolling: the Matched section is EMPTY
# (one source cannot disagree with itself), so the unmatched column headers sit
# at the top of the body, and Confirm lives in the footer, a flex sibling
# OUTSIDE the scroller. The "small set" criterion is what keeps that true.
- tapOn:
    id: "Keep all SportLots-only cards"
# NOT a redundant re-assert of the scroll above (R6): the scroll proved the
# control EXISTS, this waits for its VISIBLE TEXT to stop reading "Loading…" —
# which is how the dialog says its candidate stream has finished. The accessible
# name is the same either way, so only the text can express it.
- extendedWaitUntil:
    visible:
      id: "Confirm card matches"
      text: "Confirm"
    timeout: 120000
- tapOn:
    id: "Confirm card matches"

# ── THE WIZARD ──────────────────────────────────────────────────────────────
# Every player name the fetch brought back that `players` does not hold is
# queued for review, each with a background Wikidata lookup. 120s covers that
# live external work; the caller takes over from here.
- extendedWaitUntil:
    visible: "Confirm New Players & Teams"
    timeout: 120000

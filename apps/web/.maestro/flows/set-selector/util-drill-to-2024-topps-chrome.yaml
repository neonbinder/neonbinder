appId: com.neonbinder.web
name: "Util — drill to a (Sport, Year, Manufacturer, Set) — accepts env overrides"
tags:
  - util
---
# Direct search-select drill for the REAL pre-synced hierarchy.
#
# DEFAULTS (canonical Topps Chrome test anchor):
#   SPORT        = "Baseball"
#   YEAR         = "2024"
#   MANUFACTURER = "Topps"
#   SET          = "Topps Chrome"
#
# CALLER OVERRIDES — pass any subset of SPORT / YEAR / MANUFACTURER / SET via
# `runFlow.env` to target a different hierarchy (must be pre-synced or this
# util will fail clearly when the search input does not appear).
#
# RETURN CONTRACT:
#   Variant Types column is visible, "Base" is listed.
#   The 60s timeout on "Base" is sanctioned — it covers the variant-type
#   auto-sync on the override / cold path (BSC + SL fetch for a non-pre-synced
#   set). On the canonical Topps Chrome path the warm data satisfies it in <7s.
#
# WHAT THIS IS NOT:
#   - This util does NOT create custom entries (no "Add custom" branch) — with
#     the ONE exception below, which exists only while SportLots is paused.
#   - Use util-drill-to-custom.yaml for flows that need create-or-select logic.
#
# PROVEN PATTERN: mirrors setup.yaml lines ~132-209 exactly — select-only,
# no notVisible guards, no create branches.
#
# ── NEO-287: THE MANUFACTURER LEVEL WHILE SPORTLOTS IS ON PAUSE ─────────────
# NeonBinder's Manufacturer rows come from SportLots' brand list and from
# nowhere else — BSC has no manufacturer axis (convex/platformLevels.ts), and
# BSC's sets are filed under whatever manufacturer rows exist by name prefix
# (`syncSetsAcrossManufacturers`). So while the operator has SportLots paused
# (`-e PAUSED_PLATFORMS`, decided once by util-paused-platforms), a fresh
# Manufacturers column syncs to NOTHING: it ends "done" carrying the paused
# notice and holds only the rows an operator has added by hand. The seed adds
# `Topps` under Baseball → 2024 that way (setup.yaml), which is the product's
# own path — a row is a row whether or not it carries marketplace ids
# (invariant 6) — and the BSC set list then files "Topps …" sets under it.
#
# Two consequences for this level, both handled in the PAUSED branch below:
#   1. The column is SHORT (the hand-made rows under the pinned "All Brands"
#      VIEW entry — NEO-237: a view, not a row, present in every Manufacturers
#      column and not counted toward the search threshold), so there is no
#      search input (EntitySelector renders it only above 8 data rows) and
#      the row is tapped directly, anchored on the column HEADER. The pinned
#      entry's visible text is exactly "All Brands", which no row name this
#      util is ever asked for full-matches; a caller that wants the VIEW uses
#      util-drill-to-cold-real-set, which knows how to select it.
#   2. A caller drilling a path the seed did not provision (1996 Baseball →
#      Score) finds NO row at all. It says so with `CREATE_MANUFACTURER: "1"`,
#      and the branch then adds the row through the column's own "+ Custom"
#      form (`Add custom Manufacturers` → `Create manufacturer`) before
#      tapping it. Only a path's SOLE WRITER may pass it (SET-REGISTRY.md),
#      exactly as only setup.yaml adds `Topps`: the row is global, and the
#      create is guarded so a local re-run finds the row instead of minting a
#      second one.
# The LIVE branch is the search-select step, unchanged.

# ── NAVIGATE ─────────────────────────────────────────────────────────────────
- openLink: ${APP_URL || "http://localhost:3000"}/set-selector
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 20000

# ── SPORT ─────────────────────────────────────────────────────────────────────
# Baseball is seeded by setup.yaml and appears immediately — no search input at
# this level. Scroll + center before tapping (centering rule).
# waitToSettleTimeoutMs: 0 — the subsequent extendedWaitUntil re-syncs; the
# settle dead-wait is redundant here.
- extendedWaitUntil:
    visible: ${SPORT || "Baseball"}
- scrollUntilVisible:
    element:
      text: ${SPORT || "Baseball"}
    centerElement: true
    waitToSettleTimeoutMs: 0
    timeout: 7000
# NEO-85 residual coordinate-staleness: even after the write-if-changed churn fix,
# maestro-web can read a row's bounds then have the still-settling column reflow
# before the click lands stale → a false "Something changed… Proceed" that didn't
# select the row. Result-keyed retry: re-fire the row tap ONCE iff the NEXT column
# ("Years") doesn't appear; a genuine failure still fails loudly. retryTapIfNoChange
# is the maestro-native nudge (default settle re-enables it).
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: ${SPORT || "Baseball"}
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "Years"

# ── YEAR ──────────────────────────────────────────────────────────────────────
# The app auto-scrolls the newly-revealed Year column fully into view
# (EntityColumn reveal-scroll, de5423a) — no test-side right-scroll needed.
- extendedWaitUntil:
    visible: ".*Search years.*"
# 250ms settle on the search-box tap — input needs to be focused before inputText
# fires, and a 0ms settle can drop the first character on a reactive page.
- tapOn:
    text: ".*Search years.*"
    waitToSettleTimeoutMs: 250
- inputText: ${YEAR || "2024"}
# NEO-85 residual coordinate-staleness: result-keyed retry — re-fire the Year
# row-select ONCE iff the next column ("Manufacturers") doesn't appear.
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: ${YEAR || "2024"}
          below:
            id: "Search years"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "Manufacturers"

# ── MANUFACTURER ──────────────────────────────────────────────────────────────
# App auto-scrolls the newly-revealed Manufacturer column fully into view — no
# test-side right-scroll needed.
# NEO-287 — decide the branch (pure script, no UI). Idempotent: a caller that
# already ran util-paused-platforms pays nothing for this second call.
- runFlow:
    file: ../util/util-paused-platforms.yaml
# LIVE: search-select, verbatim. PAUSED: the short, hand-made column — header.
- runFlow:
    when:
      true: "${!output.SL_PAUSED}"
    commands:
      - extendedWaitUntil:
          visible: ".*Search manufacturers.*"
      - tapOn:
          text: ".*Search manufacturers.*"
          waitToSettleTimeoutMs: 250
      - inputText: ${MANUFACTURER || "Topps"}
      # NEO-85 residual coordinate-staleness: result-keyed retry — re-fire the
      # Manufacturer row-select ONCE iff the next column ("Sets") doesn't appear. This
      # is the exact drop proven this sweep (checklist-renders-rich-fields: the "Topps"
      # row-select landed stale, the column stayed expanded, "Sets" never appeared).
      - retry:
          maxRetries: 1
          commands:
            - tapOn:
                text: ${MANUFACTURER || "Topps"}
                below:
                  id: "Search manufacturers"
                retryTapIfNoChange: true
            - extendedWaitUntil:
                visible: "Sets"
- runFlow:
    when:
      true: "${output.SL_PAUSED}"
    commands:
      # SETTLE. Below the root the pause reads as a BSC-only tree (PR #265
      # push 3): `Baseball` carries no SportLots id, so this column — BSC does
      # not serve the level — syncs to nothing, silently (no notice), and
      # shows its idle empty text; or, on a path the seed provisioned, holds
      # the hand-made row already. The idle text renders before a sync too,
      # so wait out a "Syncing" panel if one is up (the `when:` guard is the
      # documented R10 exception), then gate on EITHER shape. No marketplace
      # is called on this path — the 7000 bar.
      - runFlow:
          when:
            visible: "Syncing Manufacturer Options"
          commands:
            - extendedWaitUntil:
                notVisible: "Syncing Manufacturer Options"
                timeout: 7000
      - extendedWaitUntil:
          visible: "No manufacturers available. Sync from marketplaces to populate.|${MANUFACTURER || 'Topps'}"
          timeout: 7000
      # Sole-writer create (see the header). The `notVisible` guard is the
      # documented R10 exception: it costs a poll only on a re-run that
      # already minted the row, never on a first run.
      - runFlow:
          when:
            true: "${CREATE_MANUFACTURER}"
          commands:
            - runFlow:
                when:
                  notVisible:
                    text: ${MANUFACTURER || "Topps"}
                    below:
                      text: "Manufacturers"
                commands:
                  - scrollUntilVisible:
                      element:
                        id: "Add custom Manufacturers"
                      centerElement: true
                      timeout: 7000
                  - tapOn:
                      id: "Add custom Manufacturers"
                  - extendedWaitUntil:
                      visible: "Add Custom Entry"
                      timeout: 7000
                  - tapOn: "Enter custom value..."
                  - inputText: ${MANUFACTURER || "Topps"}
                  # NEO-219: two Enters — the manufacturer level is
                  # parent-scoped, so the create confirm always follows.
                  - pressKey: Enter
                  - extendedWaitUntil:
                      visible:
                        id: "Create manufacturer"
                      timeout: 7000
                  - tapOn:
                      id: "Create manufacturer"
                  - extendedWaitUntil:
                      notVisible: "Add Custom Entry"
                      timeout: 7000
                  # Centring "+ Custom" above ran the page to MAXIMUM scroll
                  # on this empty column, which leaves the new row at y≈23
                  # and the column HEADER above the top edge — and a `below:`
                  # selector cannot resolve without its anchor in the
                  # hierarchy (the cold util's failure on PR #265 push 2,
                  # runner 3: `Topps` on screen, "Manufacturers" not). Both
                  # are above the current position, so UP: one swipe brings
                  # the header back and the row into the band.
                  - scrollUntilVisible:
                      element:
                        text: ${MANUFACTURER || "Topps"}
                        below:
                          text: "Manufacturers"
                      direction: UP
                      centerElement: true
                      timeout: 7000
      # Short column, no search input: tap the row, anchored on the column
      # header (a bare `text:` could match an ancestor's chip). R8: centre.
      # DOWN, measured on the no-create path (PR #265 push 2, sets-base):
      # the row sits at y=514 with the header in view, one swipe centres it
      # at y=201. (The create path above has already centred it from the
      # other side, so this accepts it at once.) Centring only ever swipes
      # in the command's direction — decompiled Orchestra.scrollUntilVisible
      # — so the direction has to match where the row is, not be a default.
      - scrollUntilVisible:
          element:
            text: ${MANUFACTURER || "Topps"}
            below:
              text: "Manufacturers"
          centerElement: true
          timeout: 7000
      - retry:
          maxRetries: 1
          commands:
            - tapOn:
                text: ${MANUFACTURER || "Topps"}
                below:
                  text: "Manufacturers"
                retryTapIfNoChange: true
            - extendedWaitUntil:
                visible: "Sets"
                timeout: 7000

# ── SET ───────────────────────────────────────────────────────────────────────
# App auto-scrolls the newly-revealed Sets column fully into view — no test-side
# right-scroll needed.
#
# NEO-137: a column renders its search input only when it has MORE THAN ONE
# entry. Baseball/1996/Score has exactly one set ("Score"), so waiting on
# ".*Search sets.*" fails outright there — this util previously assumed the
# multi-entry shape because 2024 Topps was the only hierarchy it ever drilled.
# Branch on the input's presence instead of assuming it.
#
# Only the SET level needs this today: sport is seeded, and the year and
# manufacturer columns have many entries for every hierarchy in the suite. If a
# future set lands under a single-entry manufacturer, that level needs the same
# treatment.
# No extra wait needed: the MANUFACTURER retry above already gates on the
# "Sets" column being visible, so the column is rendered by the time we get
# here — only its SHAPE is in question.

# Multi-entry column: filter, then pick the row BELOW the input.
- runFlow:
    when:
      visible: ".*Search sets.*"
    commands:
      - tapOn:
          text: ".*Search sets.*"
          waitToSettleTimeoutMs: 250
      - inputText: ${SET || "Topps Chrome"}
      # NEO-85 residual coordinate-staleness: result-keyed retry — re-fire the
      # Set row-select ONCE iff the next column ("Variant Types") doesn't appear.
      - retry:
          maxRetries: 1
          commands:
            - tapOn:
                text: ${SET || "Topps Chrome"}
                below:
                  id: "Search sets"
                retryTapIfNoChange: true
            - extendedWaitUntil:
                visible: "Variant Types"

# Single-entry column: no search input exists, so tap the row directly. The
# `below:` anchor cannot be used here — there is nothing to anchor to.
#
# GATED ON "Variant Types", *NOT* on `notVisible: ".*Search sets.*"`.
# The two branches must be mutually exclusive, and gating both on the search
# input does NOT achieve that: `when:` conditions are evaluated sequentially
# against live state, and selecting a set COLLAPSES the Sets column, removing
# the very input the first branch tested. So on a multi-entry hierarchy BOTH
# branches used to run — the second one tapping the already-selected set a
# second time, which re-toggled the selection and reset the cascade. The
# columns then re-rendered unfiltered and every downstream step failed far
# away from the cause (e.g. util-drill-to-base-variant timing out on
# ".*Select Base Set.*|.*Re-map Base.*", because no variantType was selected
# any more).
#
# "Variant Types" is the state the first branch is defined to reach, and it is
# not visible until a set is selected — so it is a correct exclusivity gate for
# both shapes: skipped when the first branch already advanced, run when the
# column had a single entry and the first branch never fired.
- runFlow:
    when:
      notVisible: "Variant Types"
    commands:
      # ANCHOR ON THE COLUMN HEADER. A bare `text: ${SET}` is ambiguous whenever
      # the set shares a name with an ancestor — Baseball/1996/Score/Score is
      # exactly that: manufacturer "Score" AND set "Score" are both on screen,
      # so an unanchored tap can land on the Manufacturers row instead of the
      # Sets row. That re-taps the already-selected manufacturer, the Variant
      # Types column never appears, and the retry then cannot find the row at
      # all. It is order-dependent, so it passes some runs and fails others.
      #
      # There IS an anchor here despite what the single-entry case suggests: the
      # column HEADER "Sets" is always rendered, unlike the search input. Using
      # it keeps this to visible text (no id/data-testid) and pins the tap to
      # the right column for both shapes.
      - scrollUntilVisible:
          element:
            text: ${SET || "Topps Chrome"}
            below:
              text: "Sets"
          centerElement: true
          timeout: 7000
      - retry:
          maxRetries: 1
          commands:
            - tapOn:
                text: ${SET || "Topps Chrome"}
                below:
                  text: "Sets"
                retryTapIfNoChange: true
            - extendedWaitUntil:
                visible: "Variant Types"
                timeout: 60000

# ── RETURN CONTRACT ───────────────────────────────────────────────────────────
# The Variant Types column is confirmed by the Set retry above. "Base" appears
# after the variant-type sync completes. The app auto-scrolls the newly-revealed
# Variant Types column fully into view (EntityColumn reveal-scroll, de5423a), so
# "Base" is visible with NO test-side scroll — a plain non-scrolling wait proves
# the contract. 60s is the sanctioned ceiling for override / cold paths (BSC + SL
# fetch); warm Topps Chrome satisfies this in <7s. DO NOT increase this timeout
# without explicit user approval.
- extendedWaitUntil:
    visible: "Base"
    timeout: 60000

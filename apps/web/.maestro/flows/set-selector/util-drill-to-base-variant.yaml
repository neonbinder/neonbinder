appId: com.neonbinder.web
name: "Util — Drill to Base variant type, confirm BaseSetPicker (leaves CardChecklist visible)"
tags:
  - util
---
# Shared prerequisite for all card-checklist flows.
#
# When this util returns, the browser is on /set-selector with:
#   - Baseball → 2024 → Topps → Topps Chrome → Base selected
#   - BaseSetPicker confirmed (SportLots base set mapped)
#   - CardChecklist panel visible below the selector row (may be empty
#     OR populated from prior runs — the util does not reset cardChecklist)
#   - NO Level 6 Variants column (Base is a terminal variant type)
#
# CALLER NOTES:
#   - Assumes `setup.yaml` (the setup track) has populated the shared
#     hierarchy and saved BSC/SL credentials for the running worker's user.
#     setup.yaml only saves credentials for the worker that ran it (level 0
#     picks one worker), so callers running on other workers must save
#     credentials themselves before invoking this util.
#   - Does NOT reset cardChecklist; if your test premise requires an empty
#     checklist, reset state explicitly.
#
# CRITICAL — BASE IS TERMINAL:
#   Selecting "Base" at Level 5 suppresses the Variants column entirely.
#   The CardChecklist component attaches directly to the variantType row
#   (cardChecklistId = selectedVariantTypeId when isBaseVariantTypeSelected).
#   Do NOT wait for "Variants", "Sync Variants", or try to tap Level 6 items.
#
# BASESET PICKER (BaseMappingForm):
#   Tapping "Base" opens the BaseSetPicker modal (heading "Select Base Set").
#   The modal auto-opens on first selection because baseHasMapping is false.
#   Confirming with "Confirm Base Set" sets platformData.sportlots on the row,
#   making baseHasMapping true, which causes CardChecklist to render.
#
# CALLER CONTRACT:
#   - Caller must have called launchApp and waited for sign-in redirect.
#   - Credentials are already seeded server-side by worker-bootstrap; no
#     credential env vars need to be passed.
#   - This util does NOT reset the DB or save credentials — `setup.yaml` and
#     `worker-bootstrap` do that. Don't rely on this util for either.

# ============================================================
# DRILL TO 2024 TOPPS CHROME + SYNC VARIANT TYPES
# util-drill-to-2024-topps-chrome (now a thin wrapper over util-drill-to-custom)
# handles navigation + levels 1–5, leaving Base visible in the list. DB reset and
# credentials come from setup.yaml / worker-bootstrap — NOT from the drill util.
# ============================================================

# NEO-248 — explicit env passthrough so this util is not pinned to Topps
# Chrome. The defaults reproduce the previous behaviour exactly, so every
# existing caller is unchanged; a caller that wants another real set (the
# wizard fixture, `Topps Big League`) passes SET and gets the same
# drill → Base → BaseSetPicker sequence. Passing the vars explicitly rather
# than relying on env inheritance through a nested runFlow makes it
# deterministic either way.
- runFlow:
    file: util-drill-to-2024-topps-chrome.yaml
    env:
      SPORT: ${SPORT || "Baseball"}
      YEAR: ${YEAR || "2024"}
      MANUFACTURER: ${MANUFACTURER || "Topps"}
      SET: ${SET || "Topps Chrome"}

# ============================================================
# LEVEL 5 — Select "Base" variant type
# Tapping "Base" triggers BaseMappingForm with autoOpen=true.
#
# TWO POSSIBLE PATHS:
#
# Path A — SL has options (SL session active):
#   BaseMappingForm opens BaseSetPicker and WAITS for user confirmation.
#   Heading "Select Base Set" stays visible. We tap "Confirm Base Set".
#
# Path B — SL has no data (no SL session or no SL data for this set):
#   BaseMappingForm opens the picker briefly (skeleton state), then
#   auto-closes it and writes the BSC fallback mapping on its own.
#   "Select Base Set" appears for < 500ms — extendedWaitUntil misses it.
#   BaseMappingForm then calls onClose() which renders CardChecklist.
#   In this path we go straight to waiting for "Fetch from Marketplaces".
#
# We handle both paths: if the picker opens and stays, confirm it.
# If it never appears, skip straight to the CardChecklist wait.
# ============================================================

# R8 — centre before the tap; R5 — 7000, the bar. An earlier NEO-260 revision
# raised this step to 20000 because the centring give-up path costs 8-13s. That
# was the wrong remedy and the rule now says so: a step that reaches the give-up
# path on every run is centring that never centres, and funding it hides the
# fault instead of fixing it. This target DOES centre, so 7000 measures the UI.
- scrollUntilVisible:
    element:
      text: "Base"
    centerElement: true
    timeout: 7000
- tapOn: "Base"

# Selecting a variant type is the first thing that mounts BaseMappingForm and
# subscribes to the ancestor chain, so a server-side error there kills the whole
# page. Say so here, in one second, instead of letting the next scroll spend its
# full timeout swiping a dead page and then blame a missing element (NEO-239 —
# CI run 33892721504, where a `returns:`-validator drift on the new
# `metadata.isBase` read exactly like a Base row that was never flagged).
# A fast-fail diagnostic, not a guarantee: the tap's own settle is what gives
# the boundary time to land, and a slower one is still caught by the step below.
- assertNotVisible: "An error occurred. Please refresh the page."

# Wait for whichever of the two Base-mapping surfaces this row lands on:
#   Path A — no mapping yet: BaseSetPicker ("Select Base Set") opens and STAYS
#     open until a set is picked and confirmed.
#   Path B — already mapped (a set the setup track or an earlier run provisioned):
#     no picker at all, just the "Re-map Base" button.
# NEO-219 deleted the third path this comment used to describe — the picker
# closing itself and writing a BSC fallback nobody saw. There is no auto-close
# any more; a successful fetch always waits for a pick.
# 60s covers: SL fetch round trip (~50s) + Puppeteer session re-auth if needed.
#
# NOT a bare visibility wait: SCROLL to it. The Base-mapping controls render
# BELOW the columns container (components/modules/SetSelector.tsx:519-540) —
# they are NOT "in the variant-type row", which is what this comment used to
# claim. Anything that makes a column taller therefore pushes them under the
# 1024x629 fold, and a plain `visible:` wait can never recover.
#
# That is not hypothetical. CI run 2 failed four flows here at once: one worker
# hit a BSC hiccup, and a status="done" partial-failure notice
# ("BuySportsCards could not be reached, so nothing from BuySportsCards was
# changed…") is stored PER COLUMN and shown to EVERY worker until someone
# dismisses it. It rendered in the Manufacturers column, grew it, and pushed the
# Base controls off screen; the hierarchy dump had no text from below the
# columns at all.
#
# DO NOT "fix" this by tapping that notice's Dismiss in a shared util —
# dismissing deletes the status row for every worker, including the one that
# actually needs to see it.
#
# R5 — 7000, the bar (was 60000). The 60s was booked as the SL round-trip
# budget, but the round trip is NOT what this step waits on: BaseSetPicker
# renders its "Select Base Set" title immediately and only its confirm
# button reads "Loading…" until the fetch lands, and THAT flip is gated
# below by `extendedWaitUntil: visible: "Confirm Base Set"` (45000, the R5
# marketplace exception). MEASURED (CI 34349299679 + 34361627641): 30
# samples across both green runs, worst 2.05s. The scroll is still a scroll
# and not a bare `visible:` wait, for the reason above — the controls can
# sit under the fold, and a wait cannot recover from that.
- scrollUntilVisible:
    element:
      text: ".*Select Base Set.*|.*Re-map Base.*"
    centerElement: true
    timeout: 7000

# Path A — the picker is open: PICK a set on each side, then confirm.
- runFlow:
    when:
      visible: "Select Base Set"
    commands:
      # The confirm button reads "Loading…" until the live SportLots + BSC
      # round-trip lands, then flips to "Confirm Base Set". That flip is the
      # marketplace wait (R5 exception) and the gate that the candidate rows
      # tapped below exist at all.
      - extendedWaitUntil:
          visible: "Confirm Base Set"
          timeout: 45000
      # NEO-219 — PICK BEFORE CONFIRMING. The picker used to select rows on the
      # operator's behalf and Confirm merely accepted them; now nothing below an
      # exact set-name match is pre-selected, Confirm is disabled until something
      # is picked, and only what is picked is linked. Both lists render
      # best-match-first, so the FIRST row on each side is the best-ranked
      # candidate — what the old build selected on its own, except where
      # NEO-219's re-ranking (an exact manufacturer match now scores BELOW the
      # generic "Base" rows) deliberately promotes a better one.
      #
      # The labels are the marketplaces' own words and are deliberately NOT
      # pinned: SportLots names a set's base row differently from set to set.
      # `id:` is a full-string regex in Maestro, so "…candidate: .*" reads as
      # "the first candidate row on this side".
      - tapOn:
          id: "BSC base candidate: .*"
      - tapOn:
          id: "SportLots base candidate: .*"
      - tapOn: "Confirm Base Set"
      - extendedWaitUntil:
          notVisible: "Select Base Set"
          timeout: 10000

# ============================================================
# VERIFY CARD CHECKLIST PANEL IS VISIBLE
# CardChecklist renders immediately after baseHasMapping becomes true.
# No Level 6 Variants column — Base is terminal.
#
# Scroll to find Add Card — sits in the same flex row as the Refresh /
# Fetch from Marketplaces button. Anchor on Add Card so the assertion
# after works whether the checklist is empty (button labels "Fetch from
# Marketplaces") or populated by a prior run (button labels "Refresh").
# visibilityPercentage 50 — strict 100 fails on viewport-edge clipping.
#
# We do NOT assert "No cards in this checklist yet." here. The util's
# contract is "leaves CardChecklist visible", not "leaves it empty";
# callers that genuinely need the empty-state should assert it themselves.
# ============================================================

# Add Card sits in the CardChecklist action row, rendered below the
# selector columns and Re-map Base button after BaseMappingForm closes.
# Scroll DOWN with default direction; vis:50 to handle viewport-edge
# clipping.
- scrollUntilVisible:
    element:
      text: "Add Card"
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000
- assertVisible:
    text: ".*Fetch from Marketplaces.*|Refresh"

appId: com.neonbinder.web
name: "Util — drill to a Sport → Year → Manufacturer that has never been synced, paying the cold marketplace waits"
tags:
  - util
---
# THE COLD TWIN OF util-drill-to-2024-topps-chrome.
#
# That util drills the hierarchy setup.yaml has ALREADY synced, so every one of
# its waits is short on purpose — a slow column there is a bug and should fail
# fast rather than sit for a minute. This util is for the opposite case: a
# hierarchy no flow has ever opened, where each column arrives EMPTY, fires
# `ensureSelectorOptions` on its own, and only renders once a live BSC +
# SportLots round-trip comes back. Those long waits are the R5 marketplace
# exception, and they are the only reason this file exists separately: folding
# them into the warm util would hide a genuinely stuck warm column for 90
# seconds on every flow in the suite.
#
# INPUTS (all optional, defaulting to the registry set's ancestors — see
# .maestro/SET-REGISTRY.md):
#   SPORT        = "Hockey"
#   YEAR         = "2024"
#   MANUFACTURER = "Topps"   — a manufacturer ROW's name, or the literal
#                             "All Brands" for the PINNED VIEW (NEO-237, below)
#
# RETURN CONTRACT:
#   The Manufacturer is selected and the SETS column has finished its own cold
#   sync. This util deliberately stops SHORT of picking a set: the caller owns
#   that, because a flow that RENAMES its set is the only thing that knows which
#   of the two possible names the row is currently carrying.
#
# ── NEO-237: MANUFACTURER "All Brands" SELECTS THE PINNED VIEW, NOT A ROW ────
# "All Brands" is no longer a manufacturer row. It is the entry PINNED to the
# top of the Manufacturers column — a view that lists every set in the year
# with its brand as a muted second line — rendered whether the column holds
# zero rows or eighteen, never filtered, never synced, and REFUSED as a name
# by the "+ Custom" form ("All Brands is the view at the top of this column,
# not a brand."). SportLots' own no-filter option of that name is routed by
# the manufacturer sync to the year's `Unknown` row and is never stored under
# its label. So a caller that passes MANUFACTURER "All Brands" gets the SAME
# step in both modes: tap the pinned entry, wait out the year-wide Sets sync.
# There is nothing to create — the paused create branch below is for ROWS
# only, and typing the view's name into the form would now fail on the
# refusal. The pinned entry's visible text is exactly `All Brands`, with
# `Every set in <year>` as a second line (ManufacturerSelector.tsx). Its
# accessible name `All Brands — every set in <year>` is not a Maestro handle
# since NEO-224 (the option's DOM id shadows it); the tap below anchors the
# visible name under the column's search box instead.
#
# What the Sets column holds afterwards differs from a brand's column: every
# set under every manufacturer of the year (`brandView.getSetsUnderYear`),
# the search input always rendered on a real year, "+ Custom" replaced by
# "Pick a brand to add a set". Picking a set there BACK-FILLS the Manufacturers
# column from the set's own parent, so the collapsed card then names the real
# brand (or `Unknown`), never the view.
#
# ── THREE THINGS THIS FILE GETS RIGHT THAT ARE EASY TO GET WRONG ─────────────
#
# 1. A COLUMN'S IDLE BUTTON IS NOT PROOF IT HAS DATA.
#    An empty column renders "Sync <X>" and "+ Custom" IMMEDIATELY, and only
#    switches to the "Syncing <X>" panel once `ensureSelectorOptions` has
#    round-tripped and flipped `selectorSyncStatus`. So a gate that waits for
#    "Sync <X>" alone passes in the first 300ms of a 60-second fetch. Measured:
#    a probe against dev on 2026-09-03 dumped the Sets column with nothing in it
#    at exactly that moment. Every level therefore waits out the "Syncing <X>"
#    panel FIRST, and only then gates on real content.
#
# 2. THE SEARCH INPUT IS NOT A CONTENT SIGNAL ANY MORE (NEO-224).
#    `EntitySelector` used to render it only above 8 entries, so this file
#    gated on it as "the column has data" and branched on its presence. Since
#    NEO-224 every open column renders exactly one search box — the column's
#    combobox and the cascade's focus target — while loading, while empty and
#    while full. So a gate on `.*Search <x>.*` passes in the first frame of a
#    60-second fetch. The content signals now are:
#      - the column's LISTBOX, accessible name = the column title (`Years`),
#        which renders only once the column holds at least one row;
#      - a FILTERED ROW under the search box, for a level whose row name the
#        caller gave us (type first, then wait — the filter is kept while
#        rows arrive);
#      - for the Manufacturers column only, whose listbox always holds the
#        pinned All Brands entry: the idle empty text going away.
#    And there is one shape per level: filter, then the row under the box.
#
# 3. THE TWO-BRANCH DANCE IS GONE WITH THE THRESHOLD. The old fallback branches
#    ("8 or fewer entries: tap the row under the column header") were gated on
#    the next column's header being absent; with the search box always there
#    they could never run and only paid R10's ~7s `notVisible` poll per level.
#    util-drill-to-2024-topps-chrome carries the history of why such a gate
#    must be the next column and never the input; read it before re-adding
#    one. The paused manufacturer ROW path keeps its header-anchored tap
#    (below), because it creates the row first and centres it from there.
#
# CALLER CAVEAT: a row tap is `text: <VALUE>` under `Search <x>`, so a VALUE
# that also names a row's second line (the view's brand line) still lands in
# the right row; a VALUE that matches no row fails at the filtered-row gate,
# by name. Hockey / 2024 / Topps is safe.
#
# ── NEO-287: THE MANUFACTURER LEVEL WHILE SPORTLOTS IS ON PAUSE (ROWS) ──────
# (Not the pinned view — see the NEO-237 block above: the view needs no row.)
# Manufacturer rows come from SportLots' brand list and from nowhere else (BSC
# has no manufacturer axis — convex/platformLevels.ts; its sets are filed under
# whatever manufacturer rows exist, by name prefix). So while the operator has
# SportLots paused (`-e PAUSED_PLATFORMS`, decided once by
# util-paused-platforms), a COLD Manufacturers column syncs to NOTHING: it ends
# "done" carrying the paused notice, and the row this util is asked to select
# does not exist. The paused branch below adds it through the column's own
# "+ Custom" form — the product's path for a row without marketplace ids
# (invariant 6) — and the Sets column then files BSC's sets under it exactly as
# it does under a marketplace-supplied row. Every caller of this util is the
# SOLE WRITER of its path (SET-REGISTRY.md), which is what makes a global
# create safe here; the create is guarded so a local re-run finds the row.
# When the pause lifts, the next marketplace sync matches SportLots' own row
# to this one by name (`storeSelectorOptions`: id first, name second) and
# attaches the id — no second row. The live path is unchanged.

# ── NAVIGATE ─────────────────────────────────────────────────────────────────
- openLink: ${APP_URL || "http://localhost:3000"}/set-selector
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 20000

# ── SPORT ─────────────────────────────────────────────────────────────────────
# Sports are seeded by the setup track, so this level is WARM even here — the
# cold part of this drill starts one level down. Every marketplace sport plus
# the suite's synthetic ones is far more than 8 entries, so the input is always
# rendered.
- extendedWaitUntil:
    visible: ".*Search sports.*"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: ".*Search sports.*"
    centerElement: true
    timeout: 7000
- tapOn:
    text: ".*Search sports.*"
    waitToSettleTimeoutMs: 250
- inputText: ${SPORT || "Hockey"}
# NEO-85 residual coordinate-staleness: result-keyed retry — re-fire the row tap
# ONCE iff the next column doesn't appear.
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: ${SPORT || "Hockey"}
          below:
            id: "Search sports"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "Years"
          timeout: 20000

# ── YEAR (COLD) ───────────────────────────────────────────────────────────────
# First live fetch of this drill: the Years column for a sport nobody has opened
# is empty, so it calls ensureSelectorOptions and waits on BSC + SportLots.
# 150s is the R5 marketplace exception; it also absorbs the Convex action cold
# start, which setup.yaml's own first fetch budgets 90s for.
- runFlow:
    when:
      visible: "Syncing Year Options"
    commands:
      - extendedWaitUntil:
          notVisible: "Syncing Year Options"
          timeout: 150000
# CONTENT GATE (header point 2): the Years LISTBOX, which renders only once the
# column holds a row. It also covers the ~300ms before the "Syncing" panel
# first appears, which the one-shot guard above can miss. 60000 is the cold
# ceiling the old `.*Search years.*|<YEAR>` gate carried (R5 marketplace
# exception), unchanged.
- extendedWaitUntil:
    visible:
      id: "Years"
    timeout: 60000

# centerElement is load-bearing, not cosmetic (NEO-210): the tap below is a
# `below:` RELATIVE selector, and Maestro throws "null cannot be cast to
# non-null type kotlin.Int" when the candidate row is clipped by the viewport.
# Centering the INPUT puts the row under it mid-screen instead of under the
# fold. (Focus is already in this box — the cascade moves it into the deepest
# open column since NEO-224 — so the tap is a no-op for focus; it stays as the
# drill-util convention and costs one hierarchy read.)
- scrollUntilVisible:
    element:
      text: ".*Search years.*"
    centerElement: true
    timeout: 7000
- tapOn:
    text: ".*Search years.*"
    waitToSettleTimeoutMs: 250
- inputText: ${YEAR || "2024"}
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: ${YEAR || "2024"}
          below:
            id: "Search years"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "Manufacturers"
          timeout: 20000

# ── MANUFACTURER (COLD) ───────────────────────────────────────────────────────
- runFlow:
    when:
      visible: "Syncing Manufacturer Options"
    commands:
      - extendedWaitUntil:
          notVisible: "Syncing Manufacturer Options"
          timeout: 150000

# NEO-287 — under the pause the column is EMPTY and settled; add the row. See
# the header. Nothing runs here on a live deployment (a pure script decides).
- runFlow:
    file: ../util/util-paused-platforms.yaml
# NEO-237 — decide once whether the caller wants the PINNED VIEW (see the
# header). A pure script, no UI: `typeof` guards a bare `maestro test` that
# passed no MANUFACTURER at all, exactly as util-paused-platforms guards its
# own flag.
- evalScript: '${output.PINNED_VIEW = (typeof MANUFACTURER === "string" ? MANUFACTURER : "Topps") === "All Brands"}'

# ── THE PINNED VIEW — one tap, both modes, behind a CONTENT gate ─────────────
# The entry is part of the column's listbox from the moment the column's read
# lands — INCLUDING the ~300ms before `ensureSelectorOptions` flips the status
# row and the "Syncing" panel appears (point 1 of the header: an idle column
# is not proof it has data). Tapping it in that window would open the view
# and fire the year-wide Sets sync against a year with NO brand rows yet:
# every BSC set would land under `Unknown` and the SportLots phase would find
# no brand to scope. So the tap waits for the manufacturer sync's CONTENT
# first, by mode.
#   LIVE:   the column has loaded (the pinned entry is listed under the search
#           box — 7000, a Convex read), and then its idle empty text is GONE:
#           "No manufacturers available…" renders exactly while the column
#           holds no data row, so its disappearance is the brand list landing.
#           The positive just before it is what keeps this `notVisible` from
#           passing on a dead or still-loading page (README R2 pairing). 60000
#           is the R5 marketplace exception (the cold brand-list fetch) the old
#           `.*Search manufacturers.*` gate carried. CALLER CAVEAT: a live year
#           whose brand list is EMPTY fails here, by name; no caller drills one.
#   PAUSED: nothing is fetched (SportLots is the column's only source), so
#           there is nothing to wait for — gate on the idle empty text under
#           the pinned entry (fresh year) or on the year's `Unknown` row (a
#           re-drill after the Sets sync minted it). The 7000 bar.
#
# The tap is the visible name UNDER THE SEARCH BOX. Not the accessible name:
# since NEO-224 every option carries a DOM id (the combobox's
# aria-activedescendant target), and maestro-web reports `id || ariaLabel` as
# resource-id, so `All Brands — every set in <year>` no longer resolves. Not a
# bare `text: "All Brands"` either: that is also a full match for the
# collapsed card once the view is selected, and the retry below re-reads the
# screen after a possibly-landed tap. The card has no search box above it, so
# the anchor rules it out (README R9 sanctions this handle). R8 — centred
# before the tap. Result-keyed retry: the same coordinate-staleness class the
# row taps below handle.
- runFlow:
    when:
      true: "${output.PINNED_VIEW && !output.SL_PAUSED}"
    commands:
      - extendedWaitUntil:
          visible:
            text: "All Brands"
            below:
              id: "Search manufacturers"
          timeout: 7000
      - extendedWaitUntil:
          notVisible: "No manufacturers available. Sync from marketplaces to populate."
          timeout: 60000
- runFlow:
    when:
      true: "${output.PINNED_VIEW && output.SL_PAUSED}"
    commands:
      - extendedWaitUntil:
          visible: "No manufacturers available. Sync from marketplaces to populate.|Unknown"
          timeout: 7000
- runFlow:
    when:
      true: "${output.PINNED_VIEW}"
    commands:
      - scrollUntilVisible:
          element:
            text: "All Brands"
            below:
              id: "Search manufacturers"
          centerElement: true
          timeout: 7000
      - retry:
          maxRetries: 1
          commands:
            - tapOn:
                text: "All Brands"
                below:
                  id: "Search manufacturers"
                retryTapIfNoChange: true
            - extendedWaitUntil:
                visible: "Sets"
                timeout: 20000

# ── A MANUFACTURER ROW, LIVE — filter, then the row under the box ────────────
# Type first, then wait (header point 2): the filter is kept while the cold
# brand list lands, so the FILTERED ROW appearing under the box is the
# content gate — 60000, the R5 marketplace exception the old
# `.*Search manufacturers.*|<row>` gate carried. `below:` because the box's own
# node text is its VALUE once typed.
- runFlow:
    when:
      true: "${!output.SL_PAUSED && !output.PINNED_VIEW}"
    commands:
      - scrollUntilVisible:
          element:
            text: ".*Search manufacturers.*"
          centerElement: true
          timeout: 7000
      - tapOn:
          text: ".*Search manufacturers.*"
          waitToSettleTimeoutMs: 250
      - inputText: ${MANUFACTURER || "Topps"}
      - extendedWaitUntil:
          visible:
            text: ${MANUFACTURER || "Topps"}
            below:
              id: "Search manufacturers"
          timeout: 60000
      - retry:
          maxRetries: 1
          commands:
            - tapOn:
                text: ${MANUFACTURER || "Topps"}
                below:
                  id: "Search manufacturers"
                retryTapIfNoChange: true
            - extendedWaitUntil:
                visible: "Sets"
                timeout: 20000

# ── A MANUFACTURER ROW, PAUSED — create it if absent, then tap it ───────────
- runFlow:
    when:
      true: "${output.SL_PAUSED && !output.PINNED_VIEW}"
    commands:
      # SETTLE. Below the root the pause reads as a BSC-only tree (PR #265
      # push 3): the sport carries no SportLots id, so this column — BSC does
      # not serve the level — syncs to nothing, silently (no notice), and
      # shows its idle empty text; on a local re-run the hand-made row is
      # already there. The "Syncing" guard above already waited a panel out;
      # this gates on either shape. No marketplace is asked — the 7000 bar.
      - extendedWaitUntil:
          visible: "No manufacturers available. Sync from marketplaces to populate.|${MANUFACTURER || 'Topps'}"
          timeout: 7000
      # The `notVisible` guard is the documented R10 exception — it costs a
      # poll only on a re-run that already minted the row.
      - runFlow:
          when:
            notVisible:
              text: ${MANUFACTURER || "Topps"}
              below:
                text: "Manufacturers"
          commands:
            - scrollUntilVisible:
                element:
                  id: "Add custom Manufacturers"
                centerElement: true
                timeout: 7000
            - tapOn:
                id: "Add custom Manufacturers"
            - extendedWaitUntil:
                visible: "Add Custom Entry"
                timeout: 7000
            - tapOn: "Enter custom value..."
            - inputText: ${MANUFACTURER || "Topps"}
            # NEO-219: two Enters — the manufacturer level is parent-scoped,
            # so the create confirm always follows the first.
            - pressKey: Enter
            - extendedWaitUntil:
                visible:
                  id: "Create manufacturer"
                timeout: 7000
            - tapOn:
                id: "Create manufacturer"
            - extendedWaitUntil:
                notVisible: "Add Custom Entry"
                timeout: 7000
      # Written: the row is in the column. A SCROLL, and UP: centring
      # "+ Custom" above ran the page to maximum scroll, which left the column
      # HEADER above the top edge while the new row sat at y≈23 — and a
      # `below:` selector cannot resolve without its anchor in the hierarchy
      # (PR #265 push 2, runners 3: `Topps` and `All Brands` both on screen,
      # "Manufacturers" not). Both the header and the row are ABOVE the
      # current position, so UP is the direction that reaches them; centring
      # puts the row in the band for the tap. (On the no-create path the row
      # is already in view and this exits at try 0.)
      - scrollUntilVisible:
          element:
            text: ${MANUFACTURER || "Topps"}
            below:
              text: "Manufacturers"
          direction: UP
          centerElement: true
          timeout: 7000
      # Tapped under the column HEADER, not the search box: this branch never
      # types, so the box reads its placeholder and no row name collides with
      # it. The header is above the box, so the anchor still pins the tap to
      # this column's rows.
      - retry:
          maxRetries: 1
          commands:
            - tapOn:
                text: ${MANUFACTURER || "Topps"}
                below:
                  text: "Manufacturers"
                retryTapIfNoChange: true
            - extendedWaitUntil:
                visible: "Sets"
                timeout: 20000

# ── RETURN CONTRACT — THE SETS COLUMN HAS FINISHED ITS COLD SYNC ─────────────
# The set list comes from syncSetsAcrossManufacturers, which since NEO-237 is
# TWO-SIDED: BSC's flat year list filed under the year's manufacturer rows by
# id, then by each brand's set-name prefix, else under the year's `Unknown`
# row (minted here if the year needs one); then one SportLots set list per
# brand that carries the ids to scope it (a brand's own column scopes it to
# that brand; the pinned view enumerates every brand of the year, cap 25,
# three at a time). Under the pause, or on a hand-made brand, the SportLots
# phase is a one-sided skip and the column ends "done" with
# "SportLots skipped: no SportLots ids on this path." — a notice, not an
# error. This is the last cold wait of the drill; 150s is the R5 marketplace
# exception and now covers up to ~18 SportLots POSTs on a full year. The
# caller picks the set itself; see the header.
- runFlow:
    when:
      visible: "Syncing Sets"
    commands:
      - extendedWaitUntil:
          notVisible: "Syncing Sets"
          timeout: 150000

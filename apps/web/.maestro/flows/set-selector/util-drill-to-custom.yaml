appId: com.neonbinder.web
name: "Util — drill the EntitySelector hierarchy to the deepest provided level (real or custom)"
tags:
  - util
---
# General-purpose drill util. Navigates to /set-selector, drills each level of
# the EntitySelector cascade to the depth the caller specifies, and returns with
# the deepest selected column's contents visible.
#
# INPUTS (all optional — drill stops after the deepest provided one):
#   SPORT          — Sports column value     (e.g. "Baseball", "E2E Test Sport 0")
#   YEAR           — Years column value      (e.g. "2024", "2026")
#   MANUFACTURER   — Manufacturers column    (e.g. "Topps")
#   SET_NAME       — Sets column value       (e.g. "tp-0", "2024 Topps Chrome")
#   VARIANT_TYPE   — Variant Types column    (e.g. "Insert", "Parallel")
#   VARIANT        — Variants column         (e.g. "Base", "Stars Gold")
#                    (column header is pluralized: "Inserts", "Parallels", etc.)
#
# STOPPING RULE — CRITICAL:
#   Each level is guarded by a cumulative `when: { true: ... }` condition that
#   evaluates ALL vars from Level 1 through Level N. If ANY var in that prefix
#   is absent (unset or empty), the level is skipped. Drill therefore stops at
#   the first absent var in the sequence.
#
#   Example: SPORT="Baseball", YEAR="2024", MANUFACTURER unset
#     → Level 1 runs (SPORT set)
#     → Level 2 runs (SPORT + YEAR set)
#     → Level 3 SKIPPED (MANUFACTURER unset)
#     → Levels 4–6 SKIPPED (MANUFACTURER absent)
#   Return contract: Manufacturers column visible (next column after last drilled).
#
# GATING EXPRESSION — HOW IT WORKS:
#   The expression form is: when: { true: "${SPORT && YEAR}" }
#
#   Maestro evaluates the content of ${...} as JavaScript via GraalJS. Env vars
#   are injected as JS bindings. An unset env var is NOT in the binding map →
#   the Proxy on globalThis returns `undefined` for it (see GraalJsEngine.kt:
#   Object.setPrototypeOf(globalThis, new Proxy(Object.prototype, { has: ()=>true })) )
#   → `undefined` is falsy → the `&&` short-circuits → false → block skipped.
#
#   Confirmed by Maestro IntegrationTest case 065: ${undefined} is skipped,
#   ${true} and ${'String'} run, ${false}/${null}/${0} are skipped.
#   Source: maestro-test/src/test/resources/065_when_true.yaml + IntegrationTest.kt
#
#   No defaults (|| fallbacks) anywhere in this file — absence means "stop here".
#   An empty string passed explicitly (SPORT="") is also falsy → also stops.
#   An empty string is treated the same as unset: both mean "caller did not want
#   this level drilled."
#
#   BATCH-VALIDATION PROBE (required before merge):
#     (A) Pass only SPORT="Baseball" → verify Sports drilled, Years visible, NO Year selected.
#     (B) Pass SPORT="Baseball" + YEAR="2024" → verify Years drilled, Manufacturers visible.
#     (C) Pass all 6 vars (team-picker path) → verify full depth, CardChecklist visible.
#     (D) Pass no vars → verify page opens to Set Builder, Sports auto-syncs, no drilling.
#
# SET_NAME and VARIANT_TYPE names are intentionally identical to
# util-drill-to-custom-set.yaml so callers can migrate by swapping the
# runFlow file path with minimal env changes.
#
# RETURN CONTRACT:
#   - If only SPORT is given:        Sports column is active; Years column visible.
#   - If SPORT + YEAR:               Years column is active; Manufacturers column visible.
#   - If … + MANUFACTURER:           Manufacturers selected; Sets column visible.
#   - If … + SET_NAME:               Set selected; Variant Types column visible,
#                                    Add-custom-<Variant Types> button in viewport.
#   - If … + VARIANT_TYPE:           Variant Type selected; Variants column visible,
#                                    Add-custom-<Variants> button in viewport.
#   - If … + VARIANT:                Variant selected; CardChecklist visible
#                                    (Open add card form button in viewport).
#   - If no vars given:              /set-selector open, Sports auto-sync done,
#                                    "Baseball" visible, no column selected.
#
# CALLER CONTRACT:
#   - Caller has called launchApp and the session is signed in.
#   - openLink to /set-selector is performed here — caller does NOT need to navigate first.
#
# PER-LEVEL ALGORITHM (uniform, idempotent):
#   1. Wait for column header to confirm it rendered.
#   2. Hard-wait for the column's search box (R2 precondition, 7000).
#   3. Tap the box, type the value, and if a matching row appears BELOW the
#      box, tap it via `below: id:"Search <column>"` — never by index.
#   4. If no row matches, the value does not exist yet: open "+ Custom"
#      (centred), type it, Enter, press the confirm's Create button, wait for
#      the form to close, then tap the new row through the same search box.
#   5. After select: wait for the next column header before proceeding.
#   Levels 4-6 (Set, Variant Type, Variant) create first ("+ Custom" when the
#   value is not visible) and then select; Sets selects through its search box.
#
# ONE PATH, NOT TWO (NEO-224): every open, unselected column renders its search
#   box — it is the column's combobox and the cascade's focus target, loading
#   included — so the search path is taken at every level, real or hand-made,
#   long list or short. Before NEO-224 the box appeared only past eight rows,
#   and each level carried a second "no search input" branch for short lists,
#   gated on the next column's header being absent. Those branches could no
#   longer run, and each cost a ~7s `notVisible` poll on every successful pick,
#   so they were removed (R10). A missing box now fails at the step that waits
#   for it. Going through the box also avoids the max-h-[400px] column clip,
#   where rows past the fold report CDP bounds while visually clipped.
#
# CDP SCROLL AVOIDANCE (Variant Types column):
#   After a fresh Set is created and selected, the page re-renders briefly.
#   Maestro's CDP scroll throws MismatchedInputException during re-renders.
#   So for Variant Types we use a non-scrolling extendedWaitUntil on the
#   Add-custom button (the button is always in-viewport for short VT lists).
#   See memory reference_maestro_headless_viewport.md and util-drill-to-custom-set.yaml
#   comments for full CI failure history.
#
# centerElement: true RATIONALE:
#   Maestro Web headless viewport is 1024×629. Content near the bottom of the
#   body's overflow region at y≥489 and steals click events. Any Add-custom
#   button or selectable row near the bottom without centering gets its tap
#   registered in the DOM but the follow-up events (modal open, column expand)
#   viewport is easily clipped or shifted by a re-render. Centering puts it
#   of the footer. Applied on every Add-custom tap and on every row tap that
#   might be near the scroll fold.

- openLink: ${APP_URL || "http://localhost:3000"}/set-selector
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 20000

# ============================================================
# LEVEL 1 — Sport
# Gate: SPORT must be non-empty.
#
# Real-synced sports (Baseball, Football, etc.) appear after the
# Sports auto-sync completes. "Baseball" is the cascade idle signal —
# setup.yaml seeds it, so its appearance confirms sync done.
# For custom synthetic sports (e.g. "E2E Test Sport 0") the value
# will not be in the list until we add it.
#
# Search input: Sports always shows "Search sports" after sync (real path).
# For custom sports not yet in the list the search input is still present
# (real synced sports rendered around it), so we can always use it to check
# existence then fall through to the Add-custom branch if not found.
# ============================================================

# Wait for Sports column and auto-sync completion unconditionally —
# this is always safe and ensures the page is ready before any gated logic runs.
- extendedWaitUntil:
    visible: "Sports"
    timeout: 30000

# Wait for Sports auto-sync to complete. "Baseball" (always seeded by setup)
# appearing signals that the sync has finished and the Search input is ready.
- extendedWaitUntil:
    visible: "Baseball"
    timeout: 60000

# Level 1 body: runs only when SPORT is provided (non-empty, non-undefined).
# ${SPORT} evaluates as JS: a set var is a non-empty string → truthy → runs.
# An unset var is undefined → falsy → skipped (drill stops here, Years not opened).
- runFlow:
    when:
      true: "${SPORT}"
    commands:
      # NEO-224: every open column renders its search box (EntitySelector's
      # combobox), so the search path is the ONLY path — unconditional, and the
      # centred scroll below is its hard precondition (R2): a missing box fails
      # here, at the step that names it, not 60s later on the Years gate.
      - scrollUntilVisible:
          element:
            id: "Search sports"
          centerElement: true
          timeout: 7000
      - tapOn:
          id: "Search sports"
      - inputText: ${SPORT}
      # If the value appears in search results, tap it via relationship.
      - runFlow:
          when:
            visible:
              text: ".*${SPORT}.*"
              below:
                id: "Search sports"
          commands:
            # Non-scrolling wait: in a filtered list the single result is
            # always at the top, already in viewport. scrollUntilVisible
            # fires page-level CDP swipes that can accidentally clear the
            # search input filter (column is overflow-y-auto; page scroll
            # does not center the item but CAN hit/blur the input).
            - extendedWaitUntil:
                visible:
                  text: ".*${SPORT}.*"
                  below:
                    id: "Search sports"
                timeout: 7000
            # Guard on notVisible "Years": if Years is already open (re-drill
            # case where SPORT was already selected), skip the tap — re-tapping
            # a SELECTED row can DESELECT it and close the next column.
            - runFlow:
                when:
                  notVisible: "Years"
                commands:
                  - tapOn:
                      text: ".*${SPORT}.*"
                      below:
                        id: "Search sports"
      # If NOT found via search (custom sport not yet in list):
      # clear search, add custom, then tap.
      # Guard on notVisible "Years": if Years is already visible, the Sport
      # was just selected above — skip this branch (the "not visible" condition
      # would otherwise be TRUE because the search+result both disappear after
      # a successful selection).
      - runFlow:
          when:
            notVisible: "Years"
          commands:
            - runFlow:
                when:
                  notVisible:
                    text: ".*${SPORT}.*"
                    below:
                      id: "Search sports"
                commands:
                  # The sport was not found in the search results. At this point
                  # the search shows "No matches found" and the "+ Custom" button
                  # (aria-label "Add custom Sports") is rendered BELOW the search
                  # box at y≈520 — below the fold.
                  # Do NOT erase the search text first: eraseText leaves a trailing
                  # char (the Maestro cursor-trap bug). The page is STABLE in
                  # "No matches found" state (no re-render in progress), so CDP
                  # scroll works safely. scrollUntilVisible + centerElement: true
                  # brings the button to y≈315, fully in view.
                  # R5 — 7000, the bar; R8 keeps the centring. MEASURED (CI 34349299679 +
                  # 34361627641): at maximum scroll this parked at y=514, 139px below the
                  # end of the driver's centre band (~375), so centring ran its full
                  # six-iteration give-up path — 10.19s here — on every run. A give-up on every
                  # run is centring that never centres, so the remedy is the product's: the
                  # 208px scroll spacer in src/layouts/binder-layout.tsx (NEO-260) puts this
                  # target at y=306, mid-band, and it now centres in one or two swipes.
                  # THIS STEP DEPENDS ON THAT SPACER — see R8.
                  - scrollUntilVisible:
                      element:
                        id: "Add custom Sports"
                      centerElement: true
                      timeout: 7000
                  - tapOn:
                      id: "Add custom Sports"
                  - extendedWaitUntil:
                      visible: "Add Custom Entry"
                      timeout: 5000
                  - inputText: ${SPORT}
                  - pressKey: Enter
                  # NEO-272: press the confirm's Create button by name. The second blind
                  # `pressKey: Enter` that used to stand here was the defect: maestro-web
                  # re-finds the focused element by an XPath built from its CLASS LIST, so it
                  # raced the confirm unmounting the input (CI 34592010317 attempt 2 died here
                  # with "no such element" on the input's own class string). The button's
                  # accessible name is EntityColumn.tsx's `confirmCreateLabel` —
                  # "Create " + LEVEL_SINGULAR[level] lower-cased.
                  #
                  # CONDITIONAL because a confirm is only ONE of two outcomes. If the typed
                  # value already exists in THIS column, `handleCustomSubmit` short-circuits
                  # (`items.find(...)` -> `onSelectExisting`), closing the form and advancing
                  # the cascade with no confirm ever rendered. A `notVisible: <value>` guard
                  # cannot rule that out — the column's max-h-[400px] scroller clips rows
                  # that really are there (team-picker, local run 2026-09-11). MEASURED locally 2026-09-11: the confirm is up in 0.34-0.38s, so
                  # a `when:` that finds it costs nothing; a miss pays the ~7s condition poll
                  # and only on the already-existed path. The hard result gate is the
                  # "Add Custom Entry" check below — the form is gone either way, so this
                  # branch cannot fall through silently (R2).
                  - runFlow:
                      when:
                        visible:
                          id: "Create sport"
                      commands:
                        - tapOn:
                            id: "Create sport"
                  - extendedWaitUntil:
                      notVisible: "Add Custom Entry"
                      timeout: 10000
                  # After the modal closes, the search input still has the
                  # sport name typed in it — the newly created sport now
                  # matches the search filter and appears below the input.
                  # Wait for it and tap it directly (no need to re-type).
                  - extendedWaitUntil:
                      visible:
                        text: ".*${SPORT}.*"
                        below:
                          id: "Search sports"
                      timeout: 10000
                  - tapOn:
                      text: ".*${SPORT}.*"
                      below:
                        id: "Search sports"

      # Wait for Years column to appear after Sport selection.
      # 60s ceiling: in RETRY runs, a pre-existing selection from attempt-1
      # (e.g. "E2E Test Sport 0") may briefly hold the Years column showing
      # ITS years. After the correct sport tap, the cascade re-renders:
      # old years disappear, new years sync, "Years" header may be absent
      # for several seconds. 20s was too short in CI-scale retries (the
      # column can be absent for 14+ s during the transition).
      - extendedWaitUntil:
          visible: "Years"
          timeout: 60000

# ============================================================
# LEVEL 2 — Year
# Gate: SPORT AND YEAR must both be non-empty.
# ${SPORT && YEAR}: if either is undefined/empty → falsy → skip.
# If both set → "2024" (last value in &&-chain) → truthy → run.
#
# "Search years" is rendered in the open column whether the years are synced
# (Baseball) or hand-made (E2E Test Sport) — NEO-224; one path for both.
# ============================================================

- runFlow:
    when:
      true: "${SPORT && YEAR}"
    commands:
      # NEO-224: the search box is rendered in every open column, so the search
      # path is the only path. The wait below is its hard precondition (R2, R5).
      - extendedWaitUntil:
          visible:
            text: ".*Search years.*"
          timeout: 7000
      # App auto-scrolls the newly-revealed Years column fully into view
      # (EntityColumn reveal-scroll, de5423a) — no test-side right-scroll needed.
      - tapOn:
          text: ".*Search years.*"
      - inputText: ${YEAR}
      - runFlow:
          when:
            visible:
              text: "${YEAR}"
              below:
                id: "Search years"
          commands:
            # Non-scrolling wait: filtered list result is already at top,
            # in viewport. scrollUntilVisible fires page-level CDP swipes
            # that can clear the search filter (overflow-y-auto column).
            - extendedWaitUntil:
                visible:
                  text: "${YEAR}"
                  below:
                    id: "Search years"
                timeout: 7000
            # Guard: skip tap if Manufacturers already open (re-drill toggle risk).
            - runFlow:
                when:
                  notVisible: "Manufacturers"
                commands:
                  - tapOn:
                      text: "${YEAR}"
                      below:
                        id: "Search years"
      # If the year is not in search results (custom year not yet added).
      # Guard on notVisible "Manufacturers": if Manufacturers is already visible,
      # the Year was just selected — skip (same reason as Sports guard above).
      - runFlow:
          when:
            notVisible: "Manufacturers"
          commands:
            - runFlow:
                when:
                  notVisible:
                    text: "${YEAR}"
                    below:
                      id: "Search years"
                commands:
                  - eraseText: 50
                  - scrollUntilVisible:
                      element:
                        id: "Add custom Years"
                      centerElement: true
                      timeout: 7000
                  - tapOn:
                      id: "Add custom Years"
                  - extendedWaitUntil:
                      visible: "Add Custom Entry"
                      timeout: 5000
                  - inputText: ${YEAR}
                  - pressKey: Enter
                  # NEO-272: press the confirm's Create button by name, never a second blind
                  # `pressKey: Enter`; conditional because an already-existing value closes the
                  # form with no confirm — see the first occurrence in this file for both.
                  - runFlow:
                      when:
                        visible:
                          id: "Create year"
                      commands:
                        - tapOn:
                            id: "Create year"
                  - extendedWaitUntil:
                      notVisible: "Add Custom Entry"
                      timeout: 10000
                  - tapOn:
                      text: ".*Search years.*"
                  - inputText: ${YEAR}
                  - extendedWaitUntil:
                      visible:
                        text: "${YEAR}"
                        below:
                          id: "Search years"
                      timeout: 10000
                  - tapOn:
                      text: "${YEAR}"
                      below:
                        id: "Search years"

      # Wait for Manufacturers column to appear after Year selection.
      - extendedWaitUntil:
          visible: "Manufacturers"
          timeout: 20000

# ============================================================
# LEVEL 3 — Manufacturer
# Gate: SPORT AND YEAR AND MANUFACTURER must all be non-empty.
#
# "Search manufacturers" is rendered in the open column whatever its rows are
# (NEO-224); one path for synced and hand-made parents alike.
# centerElement: true on Add-custom tap — edge-clipping risk (see header comment).
# ============================================================

- runFlow:
    when:
      true: "${SPORT && YEAR && MANUFACTURER}"
    commands:
      # NEO-224: the search box is rendered in every open column, so the search
      # path is the only path. The wait below is its hard precondition (R2, R5).
      - extendedWaitUntil:
          visible:
            text: ".*Search manufacturers.*"
          timeout: 7000
      # App auto-scrolls the newly-revealed Manufacturers column fully into
      # view (EntityColumn reveal-scroll, de5423a) — no test-side right-scroll needed.
      - tapOn:
          text: ".*Search manufacturers.*"
      - inputText: ${MANUFACTURER}
      - runFlow:
          when:
            visible:
              text: "${MANUFACTURER}"
              below:
                id: "Search manufacturers"
          commands:
            # Non-scrolling wait: filtered list result is already at top,
            # in viewport. scrollUntilVisible fires page-level CDP swipes
            # that can clear the search filter (overflow-y-auto column).
            - extendedWaitUntil:
                visible:
                  text: "${MANUFACTURER}"
                  below:
                    id: "Search manufacturers"
                timeout: 7000
            # Guard: skip tap if Sets already open (re-drill toggle risk).
            - runFlow:
                when:
                  notVisible: "Sets"
                commands:
                  - tapOn:
                      text: "${MANUFACTURER}"
                      below:
                        id: "Search manufacturers"
      # Guard on notVisible "Sets": if Sets is already visible, the
      # Manufacturer was just selected — skip (same reason as Sports guard above).
      - runFlow:
          when:
            notVisible: "Sets"
          commands:
            - runFlow:
                when:
                  notVisible:
                    text: "${MANUFACTURER}"
                    below:
                      id: "Search manufacturers"
                commands:
                  - eraseText: 50
                  - scrollUntilVisible:
                      element:
                        id: "Add custom Manufacturers"
                      centerElement: true
                      timeout: 7000
                  - tapOn:
                      id: "Add custom Manufacturers"
                  - extendedWaitUntil:
                      visible: "Add Custom Entry"
                      timeout: 5000
                  - inputText: ${MANUFACTURER}
                  - pressKey: Enter
                  # NEO-272: press the confirm's Create button by name, never a second blind
                  # `pressKey: Enter`; conditional because an already-existing value closes the
                  # form with no confirm — see the first occurrence in this file for both.
                  - runFlow:
                      when:
                        visible:
                          id: "Create manufacturer"
                      commands:
                        - tapOn:
                            id: "Create manufacturer"
                  - extendedWaitUntil:
                      notVisible: "Add Custom Entry"
                      timeout: 10000
                  - tapOn:
                      text: ".*Search manufacturers.*"
                  - inputText: ${MANUFACTURER}
                  - extendedWaitUntil:
                      visible:
                        text: "${MANUFACTURER}"
                        below:
                          id: "Search manufacturers"
                      timeout: 10000
                  - tapOn:
                      text: "${MANUFACTURER}"
                      below:
                        id: "Search manufacturers"

      # Wait for Sets column to appear after Manufacturer selection.
      - extendedWaitUntil:
          visible: "Sets"
          timeout: 20000

# ============================================================
# LEVEL 4 — Set (SET_NAME)
# Gate: SPORT AND YEAR AND MANUFACTURER AND SET_NAME must all be non-empty.
#
# Both real-synced and custom columns can have the search input when large.
# centerElement: true on Add-custom Sets tap — edge-clipping (see util-drill-to-custom-set
# Level 4 comment for full CI failure history at y≈583+).
#
# After the custom-add idempotency runFlow, the row is picked through the
# column's search box (always rendered since NEO-224), after an UP scroll that
# rescues the box from beneath the nav header when centring "+ Custom" carried
# it off the top.
# ============================================================

- runFlow:
    when:
      true: "${SPORT && YEAR && MANUFACTURER && SET_NAME}"
    commands:
      # Wait for Sets column idle. Scroll to the Add-custom button as
      # the idle signal — it appears only when mode=idle. centerElement: true.
      # R5 — 7000, the bar (was 10000). MEASURED (CI 34349299679 + 34361627641):
      # 4.72s worst, 1 centring swipe — a slow single hierarchy read on this
      # page, never a give-up. 7000 is the ceiling; the slow read itself is the
      # product finding to raise, not something to settle with a bigger number.
      - scrollUntilVisible:
          element:
            id: "Add custom Sets"
          centerElement: true
          timeout: 7000

      # Add the SET_NAME if not already present.
      - runFlow:
          when:
            notVisible: ${SET_NAME}
          commands:
            - tapOn:
                id: "Add custom Sets"
            - extendedWaitUntil:
                visible: "Add Custom Entry"
                timeout: 5000
            - inputText: ${SET_NAME}
            - pressKey: Enter
            # NEO-272: press the confirm's Create button by name, never a second blind
            # `pressKey: Enter`; conditional because an already-existing value closes the
            # form with no confirm — see the first occurrence in this file for both.
            - runFlow:
                when:
                  visible:
                    id: "Create set"
                commands:
                  - tapOn:
                      id: "Create set"
            - extendedWaitUntil:
                notVisible: "Add Custom Entry"
                timeout: 10000

      # Pick SET_NAME through the column's search box. NEO-224: every open
      # column renders its box, so this is the only path; the pre-NEO-224
      # short-list direct-scroll branch that used to follow it is gone (R10).
      #
      # GUARDED on "Variant Types" being absent, not on the box being present.
      # The create block above has a second outcome: when SET_NAME already
      # exists in this column but sat clipped out of view (long real Sets list,
      # max-h-[400px]), `handleCustomSubmit` selects the existing row instead of
      # confirming a create, and the cascade advances on its own. Re-picking a
      # selected row is not a no-op (it re-runs the selection handler and
      # collapses the column), so this pick must not run then. On the
      # normal path Variant Types is absent and the guard answers at once; on
      # the already-existed path it pays one ~7s poll, as the old branch did.
      # Inside, the UP scroll is the hard precondition (R2) and the Variant
      # Types gate after the block is the hard result for both outcomes.
      #
      # The centred scroll to "Add custom Sets" above can push the column's
      # header and search box up under the sticky nav (y<66), most of all on a
      # long real Sets list with the collapsed SetAttributesPanel under the
      # columns row. direction: UP because the box sits ABOVE "+ Custom" in DOM
      # order and the step above left the page centred on "+ Custom" (README,
      # R5: a scroll never depends on the document bottoming out). When the box
      # is already in the band it exits at try 0. R8: centred because the tap
      # below aims at it.
      - runFlow:
          when:
            notVisible: "Variant Types"
          commands:
            - scrollUntilVisible:
                element:
                  id: "Search sets"
                direction: UP
                centerElement: true
                timeout: 7000
            - tapOn:
                text: ".*Search sets.*"
            - inputText: ${SET_NAME}
            # Select via relationship (below the search input), not by index.
            # index: is unreliable — (input, row) DOM order flips between a cold
            # sync and a re-drill; index:1 has landed on the input in CI (NEO-46).
            - extendedWaitUntil:
                visible:
                  text: ".*${SET_NAME}.*"
                  below:
                    id: "Search sets"
                timeout: 10000
            - tapOn:
                text: ".*${SET_NAME}.*"
                below:
                  id: "Search sets"
                waitToSettleTimeoutMs: 2000
      # The set row's tap is confirmed by the Variant Types column mounting.
      - extendedWaitUntil:
          visible: "Variant Types"
          timeout: 30000

# ============================================================
# LEVEL 5 — Variant Types (VARIANT_TYPE)
# Gate: SPORT AND YEAR AND MANUFACTURER AND SET_NAME AND VARIANT_TYPE.
#
# NEO-47 raised the EntityColumn empty-state height ("No variant types
# available. Sync from marketplaces to populate."), pushing the
# "Add custom Variant Types" button to y≈605 in the 1024×629 headless
# viewport — well below the fold.
# A non-scrolling extendedWaitUntil can't bring a below-fold button into
# view, so we MUST use the standard R8 centerElement scroll.
# The CDP MismatchedInputException that previously blocked this approach
# is a recoverable transient that scrollUntilVisible retries through; the
# fatal SIGSEGV era is mitigated by JAVA_TOOL_OPTIONS=-XX:+UseSerialGC.
# ============================================================

- runFlow:
    when:
      true: "${SPORT && YEAR && MANUFACTURER && SET_NAME && VARIANT_TYPE}"
    commands:
      # ── THE CASCADE HAS TO HAVE SETTLED BEFORE ANY GEOMETRY IS READ ───────
      # The Sets column does not collapse into its card when the set is
      # picked — it collapses when the VARIANT TYPES query lands, seconds
      # later. Until it does, every column to its right sits 80px further
      # right, because an expanded column is 340px wide and a collapsed card
      # is 260px. Anything measured before that is measured in the wrong
      # place.
      #
      # CI 35731602457 / runner 2 (`card-features-editor-toggle`) is the
      # proof. The set was picked at 13:39:40.9; at 13:39:46.2 the tap still
      # read `Add custom Variant Types` at [679,306][773,338] and clicked its
      # centre (726,322); 1.16s later the Sets column collapsed and the
      # button was at [599,312][693,344] — exactly 340-260 = 80px left, with
      # the click now 33px outside it. "Add Custom Entry" never appeared,
      # and the create-gate histogram put the backend at 0.97-0.98s on that
      # same runner either side of it, so nothing was stalled: the click
      # simply missed a target that moved after it was aimed.
      #
      # `waitToSettleTimeoutMs: 2000` on the tap below does NOT defend
      # against this — the log reads "Tap aimed via settled hierarchy" and
      # still uses the pre-collapse bounds, because at that moment the
      # collapse has not happened yet. A settle heuristic cannot out-wait a
      # layout change that is still in the future; only the product's own
      # signal that the cascade is done can, and that signal is the
      # collapsed card.
      #
      # A SCROLL rather than a bare wait (R6 — the scroll is the assertion).
      # `extendedWaitUntil` never scrolls, and maestro-web prunes the
      # hierarchy by viewport, so a bare wait would be answering a question
      # about page position as well as about the collapse and could go red on
      # a caller that arrives here scrolled past the columns row. Direction UP
      # because the card is above the set row the SET block centred, and the
      # centring scroll immediately below restores the position for the tap.
      # It exits at try 0 (~0.5s) once the card is there, which is the normal
      # case; the retries are the race.
      - scrollUntilVisible:
          element:
            id: "Sets: ${SET_NAME} — change"
          direction: UP
          timeout: 7000

      # Idle-mode signal: centerElement-scroll to Add-custom button (R8 pattern).
      # 45s covers shared-Convex contention from parallel workers (~11s observed)
      # plus a first-run cold path where the Variant Types column briefly shows
      # "Syncing Variant Types" after a fresh custom Set is created (~32s recorded
      # on the cold path in CI; 30s was intermittently too short).
      # R5 — 7000, the bar (was 45000). MEASURED (CI 34349299679 + 34361627641):
      # settles in 2.64s, 0 centring swipes; nothing here waits on a marketplace.
      - scrollUntilVisible:
          element:
            id: "Add custom Variant Types"
          centerElement: true
          timeout: 7000

      # Add VARIANT_TYPE if not present yet.
      # waitToSettleTimeoutMs defends against the stale-coordinate race observed in
      # PR #31: Maestro found the button at y=179 then the page scrolled, so the tap
      # landed in empty space and the create modal never opened.
      # extendedWaitUntil immediately before tapOn: the `when:` check above takes
      # ~7s (Maestro polling); during that window the VT column may briefly
      # re-render (fresh custom-set selected → component remount). Re-asserting
      # visibility right before the tap ensures the button is stable.
      - runFlow:
          when:
            notVisible: ${VARIANT_TYPE}
          commands:
            # R5 — 7000, the bar (was 30000). MEASURED (CI 34349299679 + 34361627641):
            # settles in 2.64s, 0 centring swipes; nothing here waits on a marketplace.
            - scrollUntilVisible:
                element:
                  id: "Add custom Variant Types"
                centerElement: true
                timeout: 7000
            - tapOn:
                id: "Add custom Variant Types"
                waitToSettleTimeoutMs: 2000
            - extendedWaitUntil:
                visible: "Add Custom Entry"
                timeout: 10000
            - inputText: ${VARIANT_TYPE}
            - pressKey: Enter
            # NEO-272: press the confirm's Create button by name, never a second blind
            # `pressKey: Enter`; conditional because an already-existing value closes the
            # form with no confirm — see the first occurrence in this file for both.
            - runFlow:
                when:
                  visible:
                    id: "Create variant type"
                commands:
                  - tapOn:
                      id: "Create variant type"
            # Wait for the custom-entry FORM to close before anything targets the
            # new row. This gate exists on all 8 other Add-Custom-Entry blocks in
            # this file; level 5 was the only one missing it, and that omission is
            # what broke PR #77 / run 30414180040 (runner 4, custom-card-crud):
            #   * EntityColumn renders the form INSTEAD of the list
            #     (`if (mode === "custom") return customForm`), so while the form
            #     is open the "Insert" ROW does not exist at all;
            #   * maestro-web reads an <input>'s text as its VALUE, so the still-
            #     open custom-entry input (value "Insert") satisfied both the
            #     ".*Insert.*" wait below AND the `text: Insert` scroll/tap;
            #   * the flow therefore tapped the INPUT — logged at bounds
            #     [435,458][727,500], i.e. 292px wide = max-w-[340px] minus the
            #     form's p-6, never a 210px list row — and by the time the click
            #     dispatched, addCustomOption had resolved, setMode("idle") had
            #     unmounted the form and EntityColumn's scrollColumnIntoView had
            #     shifted the row to y≈310. The tap landed in dead space, "Insert"
            #     was never selected, so the Variants column never mounted and the
            #     ".*Inserts.*" assert below failed after burning its full timeout.
            - extendedWaitUntil:
                notVisible: "Add Custom Entry"
                timeout: 10000
            # Form is gone, so this can now only match the new row in the list —
            # it is a real "the custom variant type was created" assertion.
            - extendedWaitUntil:
                visible:
                  text: ".*${VARIANT_TYPE}.*"
                timeout: 5000

      # R8 centering + settle, matching the SET_NAME tap at level 4 and the
      # VARIANT tap at level 6 (this was the only row-tap in the util without
      # either). Centering puts the row at y≈315, fully in view, and makes Maestro's tap point agree with where EntityColumn's own
      # scrollColumnIntoView settles the column after its post-create re-render.
      - scrollUntilVisible:
          element:
            text: ${VARIANT_TYPE}
          centerElement: true
          waitToSettleTimeoutMs: 1000
          timeout: 7000
      - tapOn:
          text: ${VARIANT_TYPE}
          waitToSettleTimeoutMs: 2000

      # Selecting a variant type is the first thing that mounts the base-role
      # control and subscribes to the ancestor chain, so a server-side error
      # there kills the whole page — and the header wait below would then burn
      # its full timeout and report a missing column instead (NEO-239).
      - assertNotVisible: "An error occurred. Please refresh the page."

      # Verify the Variants column opened. Header is the pluralized VARIANT_TYPE:
      # "Insert" → "Inserts", "Parallel" → "Parallels", etc.
      #
      # Deliberately an extendedWaitUntil and NOT a scrollUntilVisible: on
      # maestro-web `visible` has no viewport-bounds test at all (UiElement.
      # isWithinViewPortBounds is never called from maestro-client or maestro-
      # orchestra; only scrollUntilVisible measures getVisiblePercentage), so this
      # already passes for a column that mounted off to the right of the columns
      # row. Converting it to a scroll would make it STRICTER, not more tolerant —
      # and unwinnable: scrollUntilVisible drives CdpWebDriver.swipe, which is
      # only `window.scrollTo`, while the columns row is an inner overflow-x-auto
      # scroller (SetSelector.tsx `data-set-selector-scroll`) that window scrolling
      # cannot move. If this line ever fails again it means the column is absent
      # from the DOM — i.e. the variant-type selection did not register — which is
      # exactly what it is here to catch.
      - extendedWaitUntil:
          visible:
            text: ".*${VARIANT_TYPE}s.*"
          timeout: 15000

      # Wait for idle mode in the Variants column (Add-custom button present).
      # Custom VTs short-circuit the gate so the button is immediately available.
      # For a real-synced VT (Insert/Parallel on 2024 Topps Chrome) the column
      # can auto-sync and open a ReconciliationModal — but the custom-set callers
      # pass a synthetic sport, so the VT here is custom and no modal fires.
      # R5 — 7000, the bar. MEASURED (CI 34349299679 + 34361627641): this
      # step settles in 1.99s (1 centring swipe). The 30000 it carried was
      # not a marketplace allowance — the round-trip is gated by the wait above;
      # this scroll is pure UI. An earlier NEO-260 note said not to lower it;
      # that was wrong, see R8.
      - scrollUntilVisible:
          element:
            id: "Add custom ${VARIANT_TYPE}s"
          centerElement: true
          visibilityPercentage: 50
          timeout: 7000

# ============================================================
# LEVEL 6 — Variant (VARIANT)
# Gate: all 6 vars must be non-empty.
#
# Column header: pluralized VARIANT_TYPE (e.g. "Inserts", "Parallels").
# Add-custom button: "Add custom Inserts" / "Add custom Parallels".
# Tapping a Variant opens the CardChecklist panel.
# Return contract: "Open add card form" button visible in viewport.
# ============================================================

- runFlow:
    when:
      true: "${SPORT && YEAR && MANUFACTURER && SET_NAME && VARIANT_TYPE && VARIANT}"
    commands:
      # Add VARIANT if not present yet.
      - runFlow:
          when:
            notVisible: ${VARIANT}
          commands:
            - tapOn:
                id: "Add custom ${VARIANT_TYPE}s"
            - extendedWaitUntil:
                visible: "Add Custom Entry"
                timeout: 5000
            - inputText: ${VARIANT}
            - pressKey: Enter
            # NEO-272: press the confirm's Create button by name, never a second blind
            # `pressKey: Enter`; conditional because an already-existing value closes the
            # form with no confirm — see the first occurrence in this file for both.
            - runFlow:
                when:
                  visible:
                    id: "Create insert"
                commands:
                  - tapOn:
                      id: "Create insert"
            - extendedWaitUntil:
                notVisible: "Add Custom Entry"
                timeout: 10000

      # Tap the Variant to open CardChecklist. centerElement: true — edge-clipping
      # risk at 1024×629 (see header comment).
      - scrollUntilVisible:
          element:
            text: ${VARIANT}
          centerElement: true
          timeout: 7000
      - tapOn: ${VARIANT}

      # Wait for the CardChecklist panel to appear.
      - scrollUntilVisible:
          element:
            id: "Open add card form"
          centerElement: true
          visibilityPercentage: 50
          timeout: 7000

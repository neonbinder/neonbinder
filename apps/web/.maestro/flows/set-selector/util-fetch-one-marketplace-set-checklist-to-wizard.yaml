appId: com.neonbinder.web
name: "Util — fetch a BSC-only real set's Base checklist and land in the entity-review wizard"
tags:
  - util
---
# ============================================================================
# WHAT THIS UTIL IS FOR (NEO-330)
#
# It puts the caller in front of the entity-review wizard on a REAL set that
# carries ONE marketplace (BuySportsCards), having synced through the real
# hierarchy. It is the one-marketplace twin of
# `util-fetch-real-set-checklist-to-wizard`, which needs a set mapped on BOTH
# sides and waits on the two-sided pairing dialog that a one-sided set never
# shows (NEO-255: "Kept all N cards from BSC", straight into the review).
#
# Extracted from `checklist-wizard-link-team-saves-alias` (PART 2), where the
# path was first written inline, so the wizard flows re-fixtured onto the 1995
# minor-league hockey sets share one copy of it (R3). The drill and the set
# pick follow `checklist-one-marketplace-skips-match-dialog` STEPS 1–2.
#
# ── WHY THESE SETS (NEO-330) ────────────────────────────────────────────────
# Every CI preview now loads prod's reference catalogue (~113k players), and
# the wizard stages only names the deployment does not know. The 1995 CHL /
# ECHL team sets are filed under Hockey → 1995 → `Unknown` and their rosters
# are outside the catalogue (Hockey there is NHL-only), so their fetch still
# stages unknown players. They are listed on BSC only: the set row and its
# `Base` carry a BSC id and no SportLots id, so after this util CANCELS the
# base picker exactly ONE side is attached and the fetch takes the solo path.
# SET-REGISTRY.md has the measured counts per set.
#
# ── INPUTS ──────────────────────────────────────────────────────────────────
#   SET             required — the set's NB name, as the Sets column lists it.
#                   `text:` is a full-node REGEX: a name carrying regex
#                   metacharacters must arrive escaped.
#   SPORT / YEAR / MANUFACTURER
#                   the ancestors, passed straight to `util-drill-to-cold-real-set`.
#                   Default Hockey / 1995 / "All Brands" (the pinned VIEW,
#                   NEO-237 — the util taps it; nothing is created).
#
# ── RETURN CONTRACT ─────────────────────────────────────────────────────────
#   The entity-review wizard is OPEN with nothing decided ("0 of N reviewed").
#   There is NO parked pairing session behind it, so "Back to matching" is not
#   offered — a caller whose feature is the parked session needs the two-sided
#   util instead. The set's Base is still UNMAPPED on SportLots (the picker was
#   cancelled; nothing was written to the base mapping). The caller owns the
#   exit: Cancel → Discard for a reader, Confirm & Save for the set's sole
#   writer (SET-REGISTRY.md).
#
# ── CONCURRENCY ─────────────────────────────────────────────────────────────
#   Several flows drill Hockey → 1995 → All Brands on parallel runners, each
#   onto its OWN set. The columns above the set are shared and may be cold
#   when more than one runner opens them; the drill util owns those waits, and
#   SET-REGISTRY.md ("The 1995 minor-league hockey wizard fixtures") records
#   what a concurrent first sync of the same column does. Below the set
#   nothing is shared: one set, one flow.
#
# R5 — 7000 in-app. The longer waits are the live marketplace round-trips,
#   each named at its step: the cold variant-type sync, the base picker's own
#   fetch, the BSC checklist fetch, and the wizard opening behind its Wikidata
#   lookups. The cold Sport/Year/Manufacturer/Sets waits live in the drill util.
# ============================================================================

# ── DRILL (R9) ──────────────────────────────────────────────────────────────
- runFlow:
    file: util-drill-to-cold-real-set.yaml
    env:
      SPORT: ${SPORT || "Hockey"}
      YEAR: ${YEAR || "1995"}
      MANUFACTURER: ${MANUFACTURER || "All Brands"}

# ── PICK THE SET (the drill util stops one level short, on purpose) ─────────
# Same shape as `checklist-one-marketplace-skips-match-dialog` STEP 2. The gate
# is the column's LISTBOX (accessible name `Sets`), which renders only once
# the column holds a row; the search box renders from the first frame and
# proves nothing (NEO-224). 15000, the R5 marketplace exception: the drill
# util's own `"Syncing Sets"` gate can report done while the year-wide BSC
# phase is still storing (memory: syncing-panel-leaves-viewport), so the rows
# this waits for can still be one marketplace round-trip away.
- extendedWaitUntil:
    visible:
      id: "Sets"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Search sets.*"
    centerElement: true
    timeout: 7000
- tapOn:
    text: ".*Search sets.*"
    waitToSettleTimeoutMs: 250
- inputText: ${SET}
# NEO-85 residual coordinate-staleness: result-keyed retry — re-fire the row
# tap ONCE iff the next column never appears. `below: {id: "Search sets"}`
# rather than `index:` (NEO-46). 20000 is the drill utils' next-column
# contract: selecting the set fires its cold variant-type sync, whose column
# header renders on the sync's first write.
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: ${SET}
          below:
            id: "Search sets"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "Variant Types"
          timeout: 20000

# Selecting the set fires its variant-type sync — BSC-only and cold on a fresh
# preview. Measured ~15s on Roanoke Express ECHL; 60s matches the drill utils'
# own variant-type contract (R5 marketplace exception).
- extendedWaitUntil:
    visible: "Base"
    timeout: 60000

# ── BASE: read the precondition, then CANCEL the picker ─────────────────────
# `baseHasMapping` counts the SportLots slot only, so an unmapped Base
# auto-opens BaseSetPicker. Result-keyed retry: the still-settling Variant
# Types column can reflow under the captured bounds. 7000 keys on the picker
# OPENING, which is synchronous — not the round-trip.
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: "Base"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "Select Base Set"
          timeout: 7000

# The confirm reads "Loading…" until the picker's live SportLots + BSC
# round-trip lands. 60s, R5 marketplace exception (measured ~8s).
- extendedWaitUntil:
    visible: "Confirm Base Set"
    timeout: 60000
# R2 precondition: BSC really answers for this set, so the fetch below is a real
# one-marketplace fetch and not the empty `candidateCount === 0` path.
- assertVisible:
    id: "BSC base candidate: .*"
# NEO-287 — the SportLots pane, by mode (`-e PAUSED_PLATFORMS`, decided by
# util-paused-platforms). Live, the year's SportLots catalogue is OFFERED
# (offering is not attaching) and declined; paused, the pane offers nothing.
# Both branches are hard (R2).
- runFlow:
    file: ../util/util-paused-platforms.yaml
- runFlow:
    when:
      true: "${!output.SL_PAUSED}"
    commands:
      - assertVisible:
          id: "SportLots base candidate: .*"
- runFlow:
    when:
      true: "${output.SL_PAUSED}"
    commands:
      - assertVisible: "SportLots returned no base set for .*"
      - assertNotVisible:
          id: "SportLots base candidate: .*"
# The picker is a fixed full-viewport portal: nothing overlays it and it cannot
# scroll, so a direct tap is correct (R8 case 2). Cancelling writes nothing (R7)
# and is what keeps exactly one marketplace attached.
- tapOn: "Cancel"
- assertVisible:
    text: ".*Base mapping cancelled.*"
# CENTRE before the tap (R8). The notice's Close sits at the bottom of the
# Base-mapping block, which can straddle the fold: on CI's Linux Chrome the
# columns' 15px horizontal scrollbar put it at [133,618][195,650] on the 629px
# viewport, centre OFF screen, and the tap died with `null cannot be cast to
# non-null type kotlin.Int` (CI run 35134145689 / runner 6, in the flow this
# path was extracted from). One "Close" exists on this page
# (`BaseMappingForm`), and the page has scroll headroom below the block.
- scrollUntilVisible:
    element:
      text: "Close"
    centerElement: true
    timeout: 7000
- tapOn: "Close"
- extendedWaitUntil:
    notVisible:
      text: ".*Base mapping cancelled.*"
    timeout: 7000
# The positive proof that Cancel left the row UNMAPPED: a Base that had picked
# up a SportLots mapping would offer "Re-map Base" instead.
- assertVisible: "Map Base Set"

# ── FETCH ───────────────────────────────────────────────────────────────────
# "Add Card" shares the Cards header's flex row; centring it brings the
# empty-checklist block into view (measured 2.0s worst, one swipe, CI
# 34349299679 + 34361627641 on the sibling flow).
- scrollUntilVisible:
    element:
      text: "Add Card"
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000
# The set has never been fetched on this deployment — the precondition for a
# FIRST fetch (a committed set re-syncs instead, and a re-sync raises no
# review). A local re-run against an already-committed preview fails here, by
# name, which is correct: re-seed first.
- assertVisible: "No cards in this checklist yet."
# R8 case 2, MEASURED (CI 34349299679 + 34361627641, the two-sided util): the
# empty-checklist block has no scroll headroom below it, so `Element bounds`
# held across all six tries; centring buys only the give-up path. Uncentred
# it settles well under a second.
- scrollUntilVisible:
    element:
      id: "Sync card checklist"
    timeout: 7000
- tapOn:
    id: "Sync card checklist"

# R5 marketplace exception: one live BSC round-trip. `soloKeptMessage` prints
# only on the NEO-255 branch, once the streamed batch has arrived in full, and
# names the one side it asked — so this line is both the sync point and the
# proof that exactly one marketplace was attached.
- extendedWaitUntil:
    visible:
      text: ".*Kept all [0-9]+ cards? from BSC.*"
    timeout: 60000

# ── THE WIZARD ──────────────────────────────────────────────────────────────
# Every fetched name the deployment does not hold is queued, each behind a live
# Wikidata lookup. 60s, R5 external round-trip (measured ~0.8s to open on the
# 25-card Roanoke set).
- extendedWaitUntil:
    visible: "Confirm New Players & Teams"
    timeout: 60000

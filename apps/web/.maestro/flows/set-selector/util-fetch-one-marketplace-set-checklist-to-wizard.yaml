appId: com.neonbinder.web
name: "Util — fetch a BSC-only real set's Base checklist and land in the entity-review wizard"
tags:
  - util
---
# ============================================================================
# WHAT THIS UTIL IS FOR (NEO-330)
#
# It puts the caller in front of the entity-review wizard on a REAL set that
# carries ONE marketplace (BuySportsCards), having synced through the real
# hierarchy. It is the one-marketplace twin of
# `util-fetch-real-set-checklist-to-wizard`, which needs a set mapped on BOTH
# sides and waits on the two-sided pairing dialog that a one-sided set never
# shows (NEO-255: "Kept all N cards from BSC", straight into the review).
#
# Extracted from `checklist-wizard-link-team-saves-alias` (PART 2), where the
# path was first written inline, so the wizard flows re-fixtured onto the 1995
# minor-league hockey sets share one copy of it (R3). The drill and the set
# pick follow `checklist-one-marketplace-skips-match-dialog` STEPS 1–2; they,
# and the cancelled base picker, live in `util-open-one-marketplace-set-base`
# (NEO-330), which a flow that has committed its set calls again to re-open
# it. This util adds the first fetch.
#
# ── WHY THESE SETS (NEO-330) ────────────────────────────────────────────────
# Every CI preview now loads prod's reference catalogue (~113k players), and
# the wizard stages only names the deployment does not know. The 1995 CHL /
# ECHL team sets are filed under Hockey → 1995 → `Unknown` and their rosters
# are outside the catalogue (Hockey there is NHL-only), so their fetch still
# stages unknown players. They are listed on BSC only: the set row and its
# `Base` carry a BSC id and no SportLots id, so after this util CANCELS the
# base picker exactly ONE side is attached and the fetch takes the solo path.
# SET-REGISTRY.md has the measured counts per set.
#
# ── INPUTS ──────────────────────────────────────────────────────────────────
#   SET             required — the set's NB name, as the Sets column lists it.
#                   `text:` is a full-node REGEX: a name carrying regex
#                   metacharacters must arrive escaped.
#   SPORT / YEAR / MANUFACTURER
#                   the ancestors, passed straight to `util-drill-to-cold-real-set`.
#                   Default Hockey / 1995 / "All Brands" (the pinned VIEW,
#                   NEO-237 — the util taps it; nothing is created).
#
# ── RETURN CONTRACT ─────────────────────────────────────────────────────────
#   The entity-review wizard is OPEN ("Tidy up this set", NEO-335) with
#   nothing decided ("Step 1 of N"; callers assert that themselves).
#   There is NO parked pairing session behind it, so the wizard's way back to
#   the pairing dialog is not offered — a caller whose feature is the parked
#   session needs the two-sided util instead. (This util never opens or drives
#   the pairing dialog, so `scripts/maestro-pairing-sync.test.mjs`'s
#   wait-for-the-settled-Confirm rule does not apply to it; it keys on the
#   dialog's title text, so this header deliberately does not quote it.)
#
#   NEO-335: a one-sided fetch whose only open question is teams (no unknown
#   name, a card that would save teamless, or a title that needs a look)
#   opens the TEAMS-ONLY wizard rather than committing: the same title,
#   straight onto "Cards with no team" / "Card titles" ("Step 1 of 2" →
#   Next → "Ready to save"). Its title gate below holds for that shape too;
#   callers whose fixture has unknown names (every current caller) land on a
#   name step. The set's Base is still UNMAPPED on SportLots (the picker was
#   cancelled; nothing was written to the base mapping). The caller owns the
#   exit: Cancel → Discard for a reader, Confirm & Save for the set's sole
#   writer (SET-REGISTRY.md).
#
# ── CONCURRENCY ─────────────────────────────────────────────────────────────
#   Several flows drill Hockey → 1995 → All Brands on parallel runners, each
#   onto its OWN set. The columns above the set are shared and may be cold
#   when more than one runner opens them; the drill util owns those waits, and
#   SET-REGISTRY.md ("The 1995 minor-league hockey wizard fixtures") records
#   what a concurrent first sync of the same column does. Below the set
#   nothing is shared: one set, one flow.
#
# R5 — 7000 in-app. The longer waits are the live marketplace round-trips,
#   each named at its step: the cold variant-type sync, the base picker's own
#   fetch, the BSC checklist fetch, and the wizard opening behind its Wikidata
#   lookups. The cold Sport/Year/Manufacturer/Sets waits live in the drill util.
# ============================================================================

# ── DRILL, PICK THE SET, OPEN BASE, DECLINE SPORTLOTS (R9, R3) ──────────────
# One copy, shared with flows that re-enter a set they committed.
- runFlow:
    file: util-open-one-marketplace-set-base.yaml
    env:
      SET: ${SET}
      SPORT: ${SPORT || "Hockey"}
      YEAR: ${YEAR || "1995"}
      MANUFACTURER: ${MANUFACTURER || "All Brands"}

# ── FETCH ───────────────────────────────────────────────────────────────────
# "Add Card" shares the Cards header's flex row; centring it brings the
# empty-checklist block into view (measured 2.0s worst, one swipe, CI
# 34349299679 + 34361627641 on the sibling flow).
- scrollUntilVisible:
    element:
      text: "Add Card"
    centerElement: true
    visibilityPercentage: 50
    timeout: 7000
# The set has never been fetched on this deployment — the precondition for a
# FIRST fetch (a committed set re-syncs instead, and a re-sync raises no
# review). A local re-run against an already-committed preview fails here, by
# name, which is correct: re-seed first.
- assertVisible: "No cards in this checklist yet."
# R8 case 2, MEASURED (CI 34349299679 + 34361627641, the two-sided util): the
# empty-checklist block has no scroll headroom below it, so `Element bounds`
# held across all six tries; centring buys only the give-up path. Uncentred
# it settles well under a second.
- scrollUntilVisible:
    element:
      id: "Sync card checklist"
    timeout: 7000
- tapOn:
    id: "Sync card checklist"

# R5 marketplace exception: one live BSC round-trip. `soloKeptMessage` prints
# only on the NEO-255 branch, once the streamed batch has arrived in full, and
# names the one side it asked — so this line is both the sync point and the
# proof that exactly one marketplace was attached.
- extendedWaitUntil:
    visible:
      text: ".*Kept all [0-9]+ cards? from BSC.*"
    timeout: 60000

# ── THE WIZARD ──────────────────────────────────────────────────────────────
# Every fetched name the deployment does not hold is queued, each behind a live
# Wikidata lookup. 60s, R5 external round-trip (measured ~0.8s to open on the
# 25-card Roanoke set). Gated on the wizard's title, "Tidy up this set" since
# NEO-335 (WizardChrome `WIZARD_TITLE`; it was "Confirm New Players & Teams").
- extendedWaitUntil:
    visible: "Tidy up this set"
    timeout: 60000

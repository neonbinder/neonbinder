appId: com.neonbinder.web
name: "Util — map a real set's Base to its BSC set listing only, leaving the checklist empty"
tags:
  - util
---
# ============================================================================
# WHAT THIS UTIL IS FOR (NEO-248)
#
# `setup.yaml` uses it to PROVISION an entity-review fixture: drill to a real
# set, select its Base variant type, and confirm the Base mapping against the
# BSC side ONLY. It never fetches a checklist.
#
# ── WHY BSC ONLY ────────────────────────────────────────────────────────────
# Two independent reasons:
#
#   1. BSC is the only side that returns player names. `fetchSportLotsChecklist`
#      declares `players`/`teams` in its return validator and never populates
#      them (see the doc comment on `tokenizeSlDescription`), so a SportLots
#      mapping contributes no unknown names — and unknown names are the entire
#      point of these fixtures.
#   2. On the Panini basketball sets the SportLots candidate list is ~3111 rows
#      ranked by a name match that finds nothing sensible — measured, the top
#      rows offered for "Panini Boston Celtics NBA Champions" were "Caitlin
#      Clark Collection" variants. Linking one would pull an unrelated set's
#      cards into the checklist.
#
# `BaseMappingForm` accepts a BSC-only pick: Confirm is enabled as soon as
# ANYTHING is picked (NEO-219), verified live on 2026-09-06.
#
# ── WHY IT NEVER FETCHES ────────────────────────────────────────────────────
# These sets are fixtures for flows that need UNKNOWN names. Committing their
# checklists here would create those players, and a known name never reaches the
# wizard again — the seed would silently empty every wizard it is meant to fill.
#
# ── INPUTS ──────────────────────────────────────────────────────────────────
#   SPORT / YEAR / MANUFACTURER / SET — default to Baseball / 2024 / Topps and
#   the caller's set. The columns must already be synced; for a sport this
#   deployment has never opened, call `util-drill-to-cold-real-set.yaml` first.
#
# ── RETURN CONTRACT ─────────────────────────────────────────────────────────
#   The set's Base is selected and MAPPED (`Re-map Base` is showing), and its
#   checklist is EMPTY.
# ============================================================================

- runFlow:
    file: util-drill-to-2024-topps-chrome.yaml
    env:
      SPORT: ${SPORT || "Baseball"}
      YEAR: ${YEAR || "2024"}
      MANUFACTURER: ${MANUFACTURER || "Topps"}
      SET: ${SET}

- scrollUntilVisible:
    element:
      text: "Base"
    centerElement: true
    timeout: 15000
- tapOn: "Base"
- assertNotVisible: "An error occurred. Please refresh the page."

# The Base-mapping controls render BELOW the columns container, so any column
# that grows parks them under the 1024x629 fold — scroll, don't just look.
- scrollUntilVisible:
    element:
      text: ".*Select Base Set.*|.*Re-map Base.*"
    centerElement: true
    timeout: 60000

# Path A: unmapped → the picker is open and stays open until something is
# picked and confirmed. Path B: already mapped (a re-run against a deployment
# this seed has already provisioned) → no picker, just `Re-map Base`.
- runFlow:
    when:
      visible: "Select Base Set"
    commands:
      # The confirm button reads "Loading…" until the live BSC + SportLots
      # round-trip lands and then flips to "Confirm Base Set". That flip is the
      # marketplace wait (R5 exception) AND the gate that the candidate rows
      # exist at all.
      - extendedWaitUntil:
          visible: "Confirm Base Set"
          timeout: 45000
      # BSC ONLY — no SportLots pick. `id:` is a full-string regex in Maestro,
      # so "…candidate: .*" reads as "the first candidate row on this side",
      # which is the best-ranked one. On these fixtures BSC offers exactly one
      # row: the set's own listing.
      - tapOn:
          id: "BSC base candidate: .*"
      - tapOn: "Confirm Base Set"
      - extendedWaitUntil:
          notVisible: "Select Base Set"
          timeout: 30000

# The mapping landed: `Re-map Base` replaces `Select Base Set` once
# `baseHasMapping` is true.
- scrollUntilVisible:
    element:
      text: ".*Re-map Base.*"
    centerElement: true
    timeout: 30000

# THE CHECKLIST IS EMPTY AND MUST STAY THAT WAY — the assertion is the contract.
- scrollUntilVisible:
    element:
      text: "No cards in this checklist yet."
    centerElement: true
    timeout: 15000

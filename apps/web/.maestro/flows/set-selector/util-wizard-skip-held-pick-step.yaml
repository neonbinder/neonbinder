appId: com.neonbinder.web
name: "Utility — skip the same-name pick step the wizard is holding, so its league and team steps come next"
tags:
  - util
---
# NEO-339 — A PICK STEP HOLDS ITS PLACE. Jason decided that a "Which <name> is
# this?" step (NEO-332: two or more players on file share a checklist name)
# stays on screen, touched or not, until the operator answers it. Before, an
# untouched one yielded to the first league or team that settled anywhere in
# the batch (`resolveNav`'s teams-first yield); `EntityReviewWizard.tsx`'s
# `holdPresentedRow` now exempts it. Answering it (a link or a skip) hands
# control back to the walk, which goes leagues → teams → players.
#
# WHY A WALK NEEDS THIS. A same-name row is inserted READY (no lookup), while
# every other staged name starts pending behind a Wikidata lookup, so the
# wizard usually OPENS on the pick step and now keeps it there after the
# batch settles. Every team-step drain exits on a player row ("Skip … — not a
# person"), and the pick step is a player row, so a drain started under it
# answers no team at all. This util is what an operator who is not here for
# that player does: skip it, and the leagues and teams follow. The walk
# reaches any OTHER same-name row only after the teams (players come last),
# so one call before a drain is enough.
#
# CALL IT once the batch has settled (after the caller's "still looking up"
# wait) and before the drain. A held pick step is the only one that can be
# presented ahead of a settled team.
#
# WHICH STEP, IN ONE HIERARCHY READ (R10). The footer carries exactly one of
# these on any live step, read by its visible text:
#   * a pick step:        "Create new" (its primary slot);
#   * any other player:   "Add as New Player", or "Add as New Player anyway"
#                         beside a promoted "Link to <name>";
#   * a team step:        "Skip — not a team";
#   * a league step:      "Skip — no league" (em dash matched with ".").
# The copy is HARD: a dialog showing none of them fails here by name. The
# branch is a script condition, free when false, so the usual case (no pick
# step on screen) costs one read and no `when: visible` dwell.
#
# The skip is hard too, and so is its result: the decided count moves by
# exactly one. Nothing races it — a held step stays put by definition, and a
# pick row has no lookup of its own to stage steps under it.
- copyTextFrom:
    text: "Create new|Add as New Player( anyway)?|Skip . (not a team|no league)"
- runFlow:
    when:
      true: '${maestro.copiedText === "Create new"}'
    commands:
      - copyTextFrom:
          text: "[0-9]+ of [0-9]+ reviewed.*"
      - evalScript: ${output.PICK_SKIP_DECIDED = parseInt(maestro.copiedText.split(" of ")[0], 10) + 1}
      - tapOn:
          id: "Skip .* — not a person"
      - extendedWaitUntil:
          visible:
            text: "${output.PICK_SKIP_DECIDED} of [0-9]+ reviewed.*"
          timeout: 7000

# RE-DRILL TO PARALLEL — NEO-62 Lever 1 (continued).
#
# Same situation as the Insert section above: after the Future Stars card
# fetch, chip expansion + Parallel selection places the Parallels column
# search input at x≈719–1011, overlapping the nav sidebar. Re-drill via
# openLink resets scroll positions and puts the Parallels search input at
# a nav-safe x position. See the Insert section comment for the full
# nav-overlap analysis.
# ════════════════════════════════════════════════════════════════════════════

- runFlow: set-selector/util-drill-to-2024-topps-chrome.yaml

# Scroll down past "Base" (centered by the util) to reach "Parallel".
- scrollUntilVisible:
    element:
      text: "Parallel"
    centerElement: true
    timeout: 10000
- tapOn: "Parallel"
# Wait for the Parallels column to appear as the switch confirmation.
- extendedWaitUntil:
    visible: "Parallels"
    timeout: 20000

- extendedWaitUntil:
    visible:
      text: ".*Reconcile Parallels.*|.*Search parallels.*"
    timeout: 240000
- runFlow:
    when:
      visible: "Reconcile Parallels"
    commands:
      # ReconciliationModal STRUCTURE coverage — folded in from the retired
      # cascade/sets-parallels (which couldn't survive a pre-saved column).
      # Verify the modal before saving the matched rows.
      # NEO-137 — the dialog builds NB SETS now, not marketplace pairs. Its two
      # sections are Ready (sets that will be written) and Pending (marketplace
      # sets not yet assigned to one). The old "N matched, N BSC-only, N SL-only"
      # summary and the "Unmatched" heading no longer exist, and "keep as
      # platform-only" is gone entirely — a set with mappings on one side only
      # is ordinary now, not a special case needing its own shelf.
      # Assert only what is ABOVE THE FOLD. The dialog body is its own
      # overflow-y-auto scroller, and with a real set the Ready list runs long
      # enough to push Pending and its two columns off a 1024x629 viewport —
      # asserting them here failed for layout reasons, not behaviour.
      # The header subtitle carries both counts and never scrolls away, so it
      # gives the same structural coverage for free. The Pending columns are
      # asserted properly (filtered, with counts) in
      # inserts-1996-score-one-nb-set-two-bsc-sources, which scrolls to them.
      - assertVisible:
          text: ".*[0-9]+ ready.*"
      - assertVisible:
          text: ".*Ready \\([0-9]+\\).*"
      - scrollUntilVisible:
          element:
            text: ".*Save [0-9]+ sets.*"
      - tapOn:
          text: ".*Save [0-9]+ sets.*"
      - extendedWaitUntil:
          notVisible: "Reconcile Parallels"
          timeout: 30000

# ── PICK "Gold Wave Refractors" ──────────────────────────────────────────────
- extendedWaitUntil:
    visible: ".*Search parallels.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Search parallels.*"
    centerElement: true
    timeout: 10000
# 250ms settle so the search input is focused before inputText fires.
- tapOn:
    text: ".*Search parallels.*"
    waitToSettleTimeoutMs: 250
- inputText: "Gold Wave Refractors"
- extendedWaitUntil:
    visible:
      text: "^Gold Wave Refractors$"
      below:
        id: "Search parallels"
    timeout: 15000
- tapOn:
    text: "^Gold Wave Refractors$"
    below:
      id: "Search parallels"


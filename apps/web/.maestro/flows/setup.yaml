# ── SPORTLOTS PAGINATION GUARD (NEO-137) ────────────────────────────────────
# Both marketplace badges must appear on this checklist's rows.
#
# This is THE regression guard for the SportLots multi-page fetch, and it lives
# here rather than on Base for a measured reason. Numbers taken from dev on
# 2026-08-11:
#
#   Base            335 cards, 335 BSC, 300 SL  <- SL covers #1-#300 only
#   Gold Wave (here) 300 cards, 300 BSC, 300 SL  <- 100% coverage
#
# The CardChecklist virtuoso opens at the BOTTOM of the list and Maestro cannot
# scroll it upward, so an "SL" assertion only works where the LAST cards carry
# an SL ref. On Base they do not (BSC lists more cards than SL for that set),
# and both a bare assertVisible and a scrollUntilVisible/UP were tried and
# failed against a perfectly healthy fetch. Here coverage is total, so the
# badge is present exactly where the virtuoso lands.
#
# And this set is >100 cards, which is what makes the guard meaningful:
# fetchSportLotsChecklist used to POST listcards.tpl once and parse only that
# response, truncating SportLots to a single page. A regression to that
# behaviour strips SL refs from everything past the first page — including the
# tail this assertion reads — and fails right here.
#
# THE BADGE IS A BARE "SL" — and that is unambiguous here, for a reason worth
# keeping. Maestro matches a selector against the WHOLE text of a node, so "SL"
# matches only a node whose text is exactly "SL". The badge used to compose the
# source label into it ("SL: 309111") and this assertion read ".*SL: .*"; the
# label moved to a tooltip, so the composed form no longer exists.
#
# Note the asymmetry with BSC: a bare "BSC" WOULD be ambiguous, because the
# Multi-source panel above the list renders "BSC" as a column header and would
# satisfy the assertion with no card row on screen at all. Its SportLots header
# reads "SPORTLOTS", which full-matches nothing, so "SL" stays card-specific.
# Per-card BSC coverage is asserted separately in checklist-renders-rich-fields.
- scrollUntilVisible:
    element:
      text: ".*#[0-9].*"
    centerElement: true
    timeout: 15000
- assertVisible: "SL"

appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/testing/reset?redirect=/testing/seed-credentials?redirect=/set-selector&worker=${WORKER_INDEX || "0"}
name: "Setup — global reset + warm + sync 2024 Topps Chrome Baseball (Base + Insert + Parallel)"
tags:
  - setup
  - regression
---
# ════════════════════════════════════════════════════════════════════════════
# THE GLOBAL SETUP TRACK — ONE FLOW (collapsed from 3 by NEO-62 Lever 1).
#
# Runs ONCE, as worker 0, before every other flow in the E2E suite. A single
# browser context handles all three variant types (Base → Insert → Parallel)
# so the redundant re-logins and cold sign-in overhead from the old 3-flow
# design are eliminated. After the Base card fetch, the flow re-drills to
# Topps Chrome (via util-drill-to-2024-topps-chrome) to reach Insert and
# Parallel — the util's fast-drill (no syncs needed; all data in Convex)
# is cheaper than the session restart the old design paid.
#
# LAYOUT REALITY (NEO-62 investigation — corrected):
#   The SetSelector columns row (overflow-x-auto) IS always rendered; the
#   columns are NOT replaced by the detail view after selecting Base. After
#   the Base card fetch the page scrolls DOWN to the checklist — the columns
#   row is simply ABOVE the viewport (not removed). The Variant Types column
#   ("Insert", "Parallel") is recoverable with a vertical scroll UP.
#
#   HOWEVER: after scroll UP + chip expansion (tapping the collapsed "Base"
#   chip) + tapping Insert, the Inserts column appears at the current
#   horizontal-scroll position of the columns container. That position is set
#   by the Base-fetch drill and places the Inserts column's search input at
#   x≈719–1011, which OVERLAPS the fixed nav sidebar (x≈860–1024). Maestro's
#   hierarchyBasedTap then hits the "Inventory" nav item instead of the
#   search input, silently navigating away. Confirmed forensically: screen-
#   shot shows /inventory after the tap, every time.
#
#   The util-drill-to-2024-topps-chrome openLink resets both the vertical and
#   horizontal scroll to a safe starting position where the Inserts/Parallels
#   search inputs are at x<860 (nav-safe). That is why openLink re-drill IS
#   the correct approach for the Base→Insert and Insert→Parallel transitions.
#
# ── CANONICAL PRE-SYNCED DATA (the contract every other flow relies on) ──────
# After this flow completes, the shared Convex deployment holds exactly this —
# any flow may fast-drill to it and read it WITHOUT syncing. If you need data
# NOT listed here, your flow must NOT sync it on its own initiative — a new real
# marketplace set costs a 30–90s sync and needs explicit owner approval. Use a
# per-worker custom set instead. Keep this list in sync with the registry:
# apps/web/.maestro/SET-REGISTRY.md
#
# THIS FLOW IS THE ONLY WRITER TO THE REAL SET. Everything below is READ-ONLY for
# every other flow — the 8 runners drain a shared queue, so any other write is
# visible to whatever else happens to be running (see SET-REGISTRY.md, R7a).
#
#   - selectorOptions / cardChecklist / players / teams cleared, then rebuilt
#   - Worker 0's BSC + SportLots sessions warmed (creds seeded by the
#     /testing/seed-credentials redirect in the url above)
#   - Seeded teams: New York Yankees, New York Mets
#   - Hierarchy: Baseball → 2024 → Topps → Topps Chrome
#   - Variant Types synced: Base, Insert, Parallel
#   - Base   → card checklist fetched + saved                                    [this flow]
#   - Insert → matched variants saved; "Future Stars" checklist (~20 cards)      [this flow]
#   - Parallel → matched variants saved; "Gold Wave Refractors" checklist (~300) [this flow]
#
# NOT pre-synced (sync lazily if you need them): any other year / manufacturer /
# set (e.g. Topps Update, Topps Pro Debut, Topps Wonderland), any other sport,
# and any non-Topps-Chrome variant rows beyond the matched sets saved above.
#
# WHERE THE LOGGED-IN USER COMES FROM:
#   The `url:` above signs this flow in as TEST_EMAIL_${WORKER_INDEX} (worker 0
#   by default) and seeds that user's marketplace creds server-side. The reset
#   and the whole sync run as that one user. No prior flow is required.
#   NOTE: The seed CI job runs with MAESTRO_SKIP_BOOTSTRAP=1 — no preceding
#   worker-bootstrap. This flow is fully self-sufficient: sign-in + reset + seed
#   creds are all handled by the /testing/sign-in?redirect=... chain in url: above.
#
# CREDS FOR *ALL* WORKER THREADS:
#   This flow only warms worker 0. Every parallel worker needs its own warmed
#   Clerk user (TEST_EMAIL_N) — that is the CI runner's job (worker-bootstrap.yaml
#   looped per worker). A single Maestro flow can't loop a varying &worker=N URL.
#
# TIMEOUT POLICY — READ THIS BEFORE COPYING A WAIT ELSEWHERE:
#   This is the ONE flow allowed to wait longer than Maestro's default. It pays
#   the cold-start cost ONCE — Cloud Run spin-up, first marketplace login, the
#   first selectorOptions write — so that EVERY other flow reads warm data and
#   responds in <7s. Do NOT copy these long waits into feature flows. If a
#   feature flow needs >7s for a UI response, that is a bug to fix, not a
#   timeout to raise.
# ════════════════════════════════════════════════════════════════════════════

- launchApp

# 120s, not the old 45s (NEO-141). This one wait covers the entire redirect chain
# in the url above — Clerk sign-in, /testing/reset, then /testing/seed-credentials
# — and seeding now performs a REAL marketplace sign-in for each platform it has
# to (re-)store, without forwarding until that finishes. BSC and SportLots can
# both need one on the same visit. This is the setup track's cold-start budget
# doing exactly what it exists for; do NOT copy this ceiling into a feature flow.
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 120000

# ── GLOBAL RESET ────────────────────────────────────────────────────────────
# DESTRUCTIVE — sanctioned global wipe; gated by ALLOW_RESET_SET_BUILDER_DATA,
# dev/preview only. This is the ONE authorised destructive step in the whole
# E2E suite — every other flow reads from the clean state it creates.
- scrollUntilVisible:
    element:
      text: "Reset Set Builder Data"
    timeout: 10000
- tapOn: "Reset Set Builder Data"
- extendedWaitUntil:
    visible: "Delete Everything"
    timeout: 20000
# Confirm input is autofocused; erase any stray chars, then type the keyword.
# NEVER tapOn the placeholder first — it injects a stray character.
- eraseText: 10
- inputText: "RESET"
- tapOn: "Delete Everything"
# Reset deletes can be large; "Reset failed: ..." surfaces clearly if it errors.
- extendedWaitUntil:
    visible:
      text: ".*Deleted [0-9]+ selector options.*"
    timeout: 60000

# ── WARM WORKER 0's MARKETPLACE SESSIONS ────────────────────────────────────
# seed-credentials (in the url above) stored real BSC + SL creds but does NOT
# warm the Puppeteer sessions. Force a fresh login for each so the syncs below
# hit live marketplace data instead of stalling on a cold login mid-drill.
# Each util taps "Test Credentials" on /profile/credentials (a cold login is a real ~22s
# round-trip — the sanctioned long wait lives inside these utils, not here).
# They also navigate to /profile/credentials, which sets up the fresh re-mount below.
- runFlow:
    file: util/util-login-to-bsc.yaml
- runFlow:
    file: util/util-login-to-sportlots.yaml

# ── FRESH MOUNT OF THE SET SELECTOR ─────────────────────────────────────────
# The reset wiped selectorOptions IN PLACE; the Sports column only auto-syncs
# when it first mounts empty. Re-navigate so the now-empty column re-triggers
# the sync — without this, "Baseball" never appears and the drill below fails.
- openLink: ${APP_URL || "http://localhost:3000"}/set-selector
- extendedWaitUntil:
    visible: ".*Build set parameters using marketplace APIs.*"
    timeout: 20000

# ════════════════════════════════════════════════════════════════════════════
# SYNC 2024 TOPPS CHROME BASEBALL — full drill.
# Each column auto-syncs when it opens empty (post-reset). We wait on each
# column's search input appearing, which is the "sync finished, list populated"
# signal. These are the warm waits — they absorb the first marketplace fetch.
# ════════════════════════════════════════════════════════════════════════════

# ── SPORT: Baseball ─────────────────────────────────────────────────────────
# Scroll the cascade into view FIRST. `visible` is false for an element that
# exists but sits below the fold, and extendedWaitUntil does not scroll — so on
# the 1024x629 headless viewport this waited 60s for a "Baseball" that had
# already rendered off-screen. NEO-155 put a section header above the cascade
# and that is what pushed it down; the header has since been trimmed, but the
# scroll is what makes this independent of how tall the chrome happens to be.
- scrollUntilVisible:
    element:
      text: "Sports"
    centerElement: true
    timeout: 10000
- runFlow:
    when:
      notVisible: "Baseball"
    commands:
      - extendedWaitUntil:
          visible: "Baseball"
          timeout: 60000

# ── SEED TEST TEAMS (NEO-96: must run AFTER the sport sync) ─────────────────
# The reset wiped `teams`. Seed New York Yankees + Mets so TeamPicker-style
# flows get a deterministic typeahead match without depending on card commits.
#
# ORDERING IS LOAD-BEARING. Teams now reference the sport-level selectorOptions
# ROW rather than storing the string "Baseball", so seedTestTeams has to resolve
# that row — which only exists once the Sports column has finished its
# post-reset auto-sync (the wait immediately above). This block used to sit
# before the reset's fresh mount, where the row does not exist yet; the mutation
# now throws a clear error rather than silently seeding nothing.
- scrollUntilVisible:
    element:
      text: "Seed Test Teams"
    centerElement: true
    timeout: 10000
- tapOn: "Seed Test Teams"
- extendedWaitUntil:
    visible:
      text: ".*Seed complete.*"
    timeout: 15000
# NEO-210: dismiss the "Seed complete" banner. It sits above the selector
# cascade and pushes every column ~60px further down the 629px viewport; that
# is what left the filtered "2024" row half under the fold on two CI runs
# (33700420070, 33750702257). Optional so a banner that already auto-cleared
# does not fail the seed.
- tapOn:
    text: "Dismiss"
    optional: true

- scrollUntilVisible:
    element:
      text: "Baseball"
    centerElement: true
    timeout: 10000
- tapOn: "Baseball"

# ── YEAR: 2024 ──────────────────────────────────────────────────────────────
# First marketplace data fetch after the reset — also covers the Convex action
# cold start, so this is the single longest warm wait in the flow.
- extendedWaitUntil:
    visible: "Years"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Search years.*"
    timeout: 90000
# Columns lay out horizontally — bring this column's search input into the
# viewport before tapping (10s is the tight ceiling; the sync wait above is the
# warm cost, this scroll is pure layout).
# NEO-210: `centerElement` is load-bearing here, not cosmetic. The tap that
# follows uses a `below:` RELATIVE selector (the filtered row and the search
# input both read "2024", so relationship is the only unambiguous handle — see
# util-drill-to-custom's NEO-46 note). Maestro resolves `below:` from element
# bounds and throws "null cannot be cast to non-null type kotlin.Int" when the
# candidate row is clipped by the viewport. A plain scrollUntilVisible stops
# the moment the INPUT is in view, which on the 1024x629 headless viewport
# parks the row beneath it under the fold; centering the input puts the row
# mid-screen instead.
- scrollUntilVisible:
    element:
      text: ".*Search years.*"
    centerElement: true
    timeout: 10000
- tapOn:
    text: ".*Search years.*"
- inputText: "2024"
- tapOn:
    text: "2024"
    below:
      id: "Search years"

# ── MANUFACTURER: Topps ─────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Manufacturers"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Search manufacturers.*"
    timeout: 45000
# NEO-210: `centerElement` is load-bearing here, not cosmetic. The tap that
# follows uses a `below:` RELATIVE selector (the filtered row and the search
# input both read "Topps", so relationship is the only unambiguous handle — see
# util-drill-to-custom's NEO-46 note). Maestro resolves `below:` from element
# bounds and throws "null cannot be cast to non-null type kotlin.Int" when the
# candidate row is clipped by the viewport. A plain scrollUntilVisible stops
# the moment the INPUT is in view, which on the 1024x629 headless viewport
# parks the row beneath it under the fold; centering the input puts the row
# mid-screen instead.
- scrollUntilVisible:
    element:
      text: ".*Search manufacturers.*"
    centerElement: true
    timeout: 10000
- tapOn:
    text: ".*Search manufacturers.*"
- inputText: "Topps"
- tapOn:
    text: "Topps"
    below:
      id: "Search manufacturers"

# ── SET: Topps Chrome ───────────────────────────────────────────────────────
# Opening the Sets column syncs the full set list for Topps / 2024 — this is
# where "all sets" land in selectorOptions.
- extendedWaitUntil:
    visible: "Sets"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Search sets.*"
    timeout: 45000
# NEO-210: `centerElement` is load-bearing here, not cosmetic. The tap that
# follows uses a `below:` RELATIVE selector (the filtered row and the search
# input both read "Topps Chrome", so relationship is the only unambiguous handle — see
# util-drill-to-custom's NEO-46 note). Maestro resolves `below:` from element
# bounds and throws "null cannot be cast to non-null type kotlin.Int" when the
# candidate row is clipped by the viewport. A plain scrollUntilVisible stops
# the moment the INPUT is in view, which on the 1024x629 headless viewport
# parks the row beneath it under the fold; centering the input puts the row
# mid-screen instead.
- scrollUntilVisible:
    element:
      text: ".*Search sets.*"
    centerElement: true
    timeout: 10000
- tapOn:
    text: ".*Search sets.*"
- inputText: "Topps Chrome"
- tapOn:
    text: "Topps Chrome"
    below:
      id: "Search sets"

# ── VARIANT TYPES: Base / Insert / Parallel ─────────────────────────────────
- extendedWaitUntil:
    visible: "Variant Types"
    timeout: 20000
- runFlow:
    when:
      notVisible: "Base"
    commands:
      - scrollUntilVisible:
          element:
            text: "Sync Variant Types"
          timeout: 10000
      - tapOn: "Sync Variant Types"
      - extendedWaitUntil:
          notVisible: "Syncing Variant Types"
          timeout: 45000
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
            - extendedWaitUntil:
                visible: "Sync Variant Types"
                timeout: 10000
- scrollUntilVisible:
    element:
      text: "Base"
    centerElement: true
    timeout: 10000
- assertVisible: "Base"
- assertVisible: "Insert"
- assertVisible: "Parallel"

# ════════════════════════════════════════════════════════════════════════════
# LOAD CARDS — Base variant of 2024 Topps Chrome.
# Base is terminal (no Variants column); selecting it opens BaseMappingForm,
# then the CardChecklist. Fetch the checklist and confirm the first-run
# EntityReviewWizard so players/teams persist and cards save.
# ════════════════════════════════════════════════════════════════════════════

- tapOn: "Base"
# Path A: BaseSetPicker stays open (SL data present) → confirm.
# Path B: it auto-closes (BSC fallback) → "Re-map Base" appears. Handle both.
- extendedWaitUntil:
    visible:
      text: ".*Select Base Set.*|.*Re-map Base.*"
    timeout: 60000
- runFlow:
    when:
      visible: "Select Base Set"
    commands:
      - extendedWaitUntil:
          visible: "Confirm Base Set"
          timeout: 45000
      - tapOn: "Confirm Base Set"
      - extendedWaitUntil:
          notVisible: "Select Base Set"
          timeout: 30000

# CardChecklist renders below the columns — it is BELOW the fold in the
# 1024×629 headless viewport. "Fetch from Marketplaces" is NOT reachable by
# extendedWaitUntil visible because it is scroll-clipped.
#
# Correct pattern (mirrors util-drill-to-base-variant.yaml):
#   1. Wait for "Re-map Base" (in-viewport settle anchor — proves baseHasMapping
#      became true and CardChecklist has mounted after the Convex write).
#   2. scrollUntilVisible "Add Card" (centerElement + vis:50) — brings the
#      CardChecklist header row into viewport before tapping.
#   3. assertVisible "Fetch from Marketplaces|Refresh" — confirm it's in-view.
#   4. tapOn it.
- extendedWaitUntil:
    visible: "Re-map Base"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Add Card"
    centerElement: true
    visibilityPercentage: 50
    timeout: 30000
- assertVisible:
    text: ".*Fetch from Marketplaces.*|Refresh"
- tapOn:
    text: ".*Fetch from Marketplaces.*|Refresh"

# NEO-137 — the card-pairing step now runs BEFORE any card is generated.
# Sync returns candidates (matched / BSC-only / SportLots-only) and nothing is
# written until Confirm. "Keep all" on both columns preserves exactly what a
# pre-NEO-137 sync produced, which is what keeps the strict card counts below
# honest: this seed must provision the SAME baseline as before, so it keeps
# every candidate rather than silently narrowing the checklist.
- extendedWaitUntil:
    visible:
      text: "Match Cards.*|.*Confirm New Players.*|.*Saved [0-9]+.*"
    timeout: 60000
- runFlow:
    when:
      visible: "Match Cards.*"
    commands:
      # NEO-195 — WAIT FOR THE FETCH TO FINISH BEFORE TOUCHING CONFIRM.
      # The dialog now opens on the FIRST streamed candidates (~6s), not on the
      # action's return (~80s), so "Match Cards" being visible no longer means
      # the fetch is done. Confirm is gated on `isStreaming` and `handleConfirm`
      # returns early while it is true, so tapping it without this wait is a
      # SILENT no-op: the modal stays open and the `notVisible` below times out
      # blaming the wrong thing. The button's own text is the signal — "Loading…"
      # while streaming, "Confirm" once the action resolves. Same sync point
      # checklist-pairing-dialog-cancel.yaml uses.
      - extendedWaitUntil:
          visible:
            text: "^Confirm$"
          timeout: 120000
      - runFlow:
          when:
            visible:
              text: ".*BSC only \\([1-9][0-9]*\\).*"
          commands:
            - tapOn:
                id: "Keep all BSC-only cards"
      - runFlow:
          when:
            visible:
              text: ".*SportLots only \\([1-9][0-9]*\\).*"
          commands:
            - tapOn:
                id: "Keep all SportLots-only cards"
      - tapOn:
          id: "Confirm card matches"
      - extendedWaitUntil:
          notVisible: "Match Cards.*"
          timeout: 60000

# First fetch: all players/teams are new → EntityReviewWizard opens.
- extendedWaitUntil:
    visible:
      text: ".*Confirm New Players.*|.*Saved [0-9]+.*"
    timeout: 60000
- runFlow:
    when:
      visible: "Confirm New Players & Teams"
    commands:
      # NEO-92 bulk-confirm: this setup flow WIPES players first (global reset
      # above), so a fresh real-set fetch surfaces HUNDREDS of unknowns. Rather
      # than draining them one at a time (each gated by the 3s/item Wikidata
      # queue), tap the footer "Add All Remaining as New (N)" button — one
      # recordAllRemainingAsCreate call marks every not-yet-decided row (including
      # still-pending ones) as "create". The button is visible as soon as the
      # wizard opens (any undecided items), so no per-item Wikidata wait is needed.
      - tapOn:
          text: ".*Add All Remaining as New.*"
      # allDecided flips true after the bulk mutation patches every row; the final
      # "Confirm & Save" step then renders. 30s covers the bulk row patch on a
      # freshly-reset real set (hundreds of rows) — a sanctioned setup-track write.
      - extendedWaitUntil:
          visible:
            text: ".*Confirm & Save.*"
          timeout: 30000
      - tapOn:
          text: ".*Confirm & Save.*"
      # NEO-163: no gate on the wizard closing. The "Saved N cards" wait below
      # is a positive terminal signal proving the same thing and more, so this
      # negative gate against a repainting node only ever added a failure mode.

# Strict count — the Base checklist is immutable once produced, so 335 is a
# fixed fact, not "marketplace drift". Do NOT loosen it to hide a bug.
#
# Measured 2026-08-11 with the NEO-137 SportLots pagination fix in place: 335
# cards, 335 carrying a BSC ref, 300 carrying a SportLots ref. The count is
# BSC-driven and did NOT move when SL went from 88 refs to 300 — every extra SL
# card matched an existing BSC card rather than adding a new one. That is
# precisely why this count alone CANNOT catch an SL-truncation regression, and
# why checklist-renders-rich-fields also asserts the per-card "SL" badge.
# NEO-163 — this is now the ONLY gate on the save completing, and it absorbs
# the budget the removed notVisible wait used to hold (30s + 30s), plus room.
#
# After "Confirm & Save" the wizard shows "Saving..." while the bulk row patch
# and the card write land, and the header counts "N still being looked up" down
# from the background Wikidata queue. On a slow runner that outran the old 30s
# and killed the flow while the app was working correctly — this was the single
# largest source of red CI, failing on unrelated branches about half the time.
#
# 120s is deliberate headroom, not a number tuned to one observed failure: the
# seed flow's own ceiling is 600s and a healthy run reaches here around 3min.
# If this ever times out, the save is genuinely broken — do not raise it again
# without checking how long the write actually took.
- extendedWaitUntil:
    visible:
      text: ".*Saved 335 cards.*"
    timeout: 120000
# A "#NNN" card row confirms the fetch + save pipeline ran end-to-end.
- assertVisible:
    text: ".*#[0-9].*"

# ════════════════════════════════════════════════════════════════════════════
# RE-DRILL TO INSERT — NEO-62 Lever 1.
#
# After the Base card fetch the Variant Types column shows a COLLAPSED CHIP
# (EntitySelector: selectedId && !expanded → chip mode). The chip IS visible
# (columns row persists above the viewport — a UP scroll recovers it), but
# tapping the chip to expand + selecting Insert places the Inserts column
# search input at x≈719–1011 which overlaps the fixed nav sidebar (x≈860+).
# Maestro's hierarchyBasedTap then hits "Inventory" nav instead of the input.
#
# Pattern (R9): use util-drill-to-2024-topps-chrome, which does openLink to
# /set-selector and re-drills the cascade (fast, all data already in Convex).
# The openLink resets both vertical and horizontal scroll, placing the Inserts
# column at a nav-safe x position (<860). The util's return contract:
# "Variant Types" visible, "Base" scrolled to center.
# ════════════════════════════════════════════════════════════════════════════

- runFlow: set-selector/util-drill-to-2024-topps-chrome.yaml

# util return contract: "Base" is visible (scrolled to center). "Insert" is
# just below Base in the Variant Types column — scroll down to reach it.
- scrollUntilVisible:
    element:
      text: "Insert"
    centerElement: true
    timeout: 10000
- tapOn: "Insert"
# Wait for the Inserts column to appear — this is the "variant type switched"
# confirmation and the "auto-sync started" anchor point.
- extendedWaitUntil:
    visible: "Inserts"
    timeout: 20000

# Auto-sync → cross-platform ReconciliationModal OR already-populated.
# 240s = warm cost (first Insert BSC+SL fetch), sanctioned in setup-track only.
- extendedWaitUntil:
    visible:
      text: ".*Reconcile Inserts.*|.*Search inserts.*"
    timeout: 240000
- runFlow:
    when:
      visible: "Reconcile Inserts"
    commands:
      # ReconciliationModal STRUCTURE coverage — folded in from the retired
      # insert-variant-flow / cascade/sets-inserts (which couldn't survive a
      # pre-saved column). Verify the modal before saving the matched rows.
      # NEO-137 — the dialog builds NB SETS now, not marketplace pairs. Its two
      # sections are Ready (sets that will be written) and Pending (marketplace
      # sets not yet assigned to one). The old "N matched, N BSC-only, N SL-only"
      # summary and the "Unmatched" heading no longer exist, and "keep as
      # platform-only" is gone entirely — a set with mappings on one side only
      # is ordinary now, not a special case needing its own shelf.
      # Assert only what is ABOVE THE FOLD. The dialog body is its own
      # overflow-y-auto scroller, and with a real set the Ready list runs long
      # enough to push Pending and its two columns off a 1024x629 viewport —
      # asserting them here failed for layout reasons, not behaviour.
      # The header subtitle carries both counts and never scrolls away, so it
      # gives the same structural coverage for free. The Pending columns are
      # asserted properly (filtered, with counts) in
      # inserts-1996-score-one-nb-set-two-bsc-sources, which scrolls to them.
      - assertVisible:
          text: ".*[0-9]+ ready.*"
      - assertVisible:
          text: ".*Ready \\([0-9]+\\).*"
      - scrollUntilVisible:
          element:
            text: ".*Save [0-9]+ sets.*"
      - tapOn:
          text: ".*Save [0-9]+ sets.*"
      - extendedWaitUntil:
          notVisible: "Reconcile Inserts"
          timeout: 30000

# ── PICK "Future Stars" (below:{id} targets the result row, not the input) ───
- extendedWaitUntil:
    visible: ".*Search inserts.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Search inserts.*"
    centerElement: true
    timeout: 10000
# 250ms settle after tap so the search input is focused before inputText fires
# (mirrors util-drill-to-2024-topps-chrome pattern; prevents keystroke drop).
- tapOn:
    text: ".*Search inserts.*"
    waitToSettleTimeoutMs: 250
- inputText: "Future Stars"
- extendedWaitUntil:
    visible:
      text: "^Future Stars$"
      below:
        id: "Search inserts"
    timeout: 15000
- tapOn:
    text: "^Future Stars$"
    below:
      id: "Search inserts"

# ── FETCH THE INSERT CHECKLIST ───────────────────────────────────────────────
# Same fold-clipping trap as the Base section above. On an empty checklist the
# "Fetch from Marketplaces" button is the LAST thing in the Cards card, so a
# scroll aimed straight at it can stop with the button only fractionally on
# screen and the tap then lands BELOW the 1024×629 viewport (CI run 32050269778:
# button at y=620–652, 15% visible → dropped tap).
#
# Use the Base section's pattern:
#   1. Settle anchor proving the Future Stars panels have mounted. Base uses
#      "Re-map Base", which is base-specific; the insert equivalent is the set
#      attributes summary bar, which is keyed to the DEEPEST selection and so
#      names the leaf we just picked — it is the panel rendered immediately
#      above the Cards card. Scrolled to rather than waited on, because after
#      picking from the inserts column it sits below the fold.
#   2. scrollUntilVisible "Add Card" (centerElement + vis:50) — centering the
#      Cards header row drags the Fetch button well above the fold.
#   3. assertVisible "Fetch from Marketplaces|Refresh" — confirm it's in-view.
#   4. tapOn it.
- scrollUntilVisible:
    element:
      text: ".*Attributes for Future Stars.*"
    centerElement: true
    visibilityPercentage: 50
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Add Card"
    centerElement: true
    visibilityPercentage: 50
    timeout: 30000
- assertVisible:
    text: ".*Fetch from Marketplaces.*|Refresh"
- tapOn:
    text: ".*Fetch from Marketplaces.*|^Refresh$"
# NEO-137 — pairing runs BEFORE any card is generated. "Keep all" on both
# columns reproduces exactly what a pre-NEO-137 sync produced, which is what
# keeps the strict card counts below honest: this seed must provision the SAME
# baseline as before, not a silently narrowed one.
- extendedWaitUntil:
    visible:
      text: "Match Cards.*|.*Confirm New Players.*|.*Saved [0-9]+.*"
    timeout: 90000
- runFlow:
    when:
      visible: "Match Cards.*"
    commands:
      # NEO-195 — WAIT FOR THE FETCH TO FINISH BEFORE TOUCHING CONFIRM.
      # The dialog now opens on the FIRST streamed candidates (~6s), not on the
      # action's return (~80s), so "Match Cards" being visible no longer means
      # the fetch is done. Confirm is gated on `isStreaming` and `handleConfirm`
      # returns early while it is true, so tapping it without this wait is a
      # SILENT no-op: the modal stays open and the `notVisible` below times out
      # blaming the wrong thing. The button's own text is the signal — "Loading…"
      # while streaming, "Confirm" once the action resolves. Same sync point
      # checklist-pairing-dialog-cancel.yaml uses.
      - extendedWaitUntil:
          visible:
            text: "^Confirm$"
          timeout: 120000
      - runFlow:
          when:
            visible:
              text: ".*BSC only \\([1-9][0-9]*\\).*"
          commands:
            - tapOn:
                id: "Keep all BSC-only cards"
      - runFlow:
          when:
            visible:
              text: ".*SportLots only \\([1-9][0-9]*\\).*"
          commands:
            - tapOn:
                id: "Keep all SportLots-only cards"
      - tapOn:
          id: "Confirm card matches"
      - extendedWaitUntil:
          notVisible: "Match Cards.*"
          timeout: 90000
- extendedWaitUntil:
    visible:
      text: ".*Confirm New Players.*|.*Saved [0-9]+.*"
    timeout: 90000
- runFlow:
    when:
      visible: "Confirm New Players & Teams"
    commands:
      # NEO-92 bulk-confirm: this setup flow WIPES players first (global reset
      # above), so a fresh real-set fetch surfaces HUNDREDS of unknowns. Rather
      # than draining them one at a time (each gated by the 3s/item Wikidata
      # queue), tap the footer "Add All Remaining as New (N)" button — one
      # recordAllRemainingAsCreate call marks every not-yet-decided row (including
      # still-pending ones) as "create". The button is visible as soon as the
      # wizard opens (any undecided items), so no per-item Wikidata wait is needed.
      - tapOn:
          text: ".*Add All Remaining as New.*"
      # allDecided flips true after the bulk mutation patches every row; the final
      # "Confirm & Save" step then renders. 30s covers the bulk row patch on a
      # freshly-reset real set (hundreds of rows) — a sanctioned setup-track write.
      - extendedWaitUntil:
          visible:
            text: ".*Confirm & Save.*"
          timeout: 30000
      - tapOn:
          text: ".*Confirm & Save.*"
      # NEO-163: no gate on the wizard closing. The "Saved N cards" wait below
      # is a positive terminal signal proving the same thing and more, so this
      # negative gate against a repainting node only ever added a failure mode.
# Strict count — a card checklist is immutable once produced, so "Saved 20 cards"
# is a fixed fact. If this number is ever wrong it's a real fetch/save regression,
# not "marketplace drift" — do NOT loosen it to hide a bug.
- extendedWaitUntil:
    visible:
      text: ".*Saved 20 cards.*"
    # NEO-163: absorbs the removed notVisible gate's budget. See the note on the
    # 335-card wait above. Smaller set, same failure shape if the runner is slow.
    timeout: 120000


appId: com.neonbinder.web
url: ${APP_URL || "http://localhost:3000"}/testing/sign-in?redirect=/admin/players&worker=${WORKER_INDEX || "0"}
name: "Spine Labels — a player's colours default to their longest-tenure team"
tags:
  - spine-label
---
# R1 — Single feature: the PLAYER-driven half of the spine designer. Picking a
# player fills the label with their name, surfaces their career teams as chips,
# and defaults the colours to the team they spent longest with (NEO-147,
# lib/players/team-tenure.ts). The sibling flow design-and-queue-a-spine-label
# covers the hand-typed half, which uses a different control entirely — the two
# are mutually exclusive on screen.
#
# WHY IT STARTS ON /admin/players (NEO-214). The fixture this flow needs —
# ONE player with TWO stints of deliberately different length at TWO teams with
# deliberately different colours — used to be seeded globally by a "Seed Test
# Teams" button setup.yaml clicked. That button and the mutation behind it are
# gone, so `players` and `teams` are empty until a flow fills them. The fixture
# is therefore built here, through the product's own admin screens, in the order
# the product requires:
#
#   1. /admin/players — add the player, then in the career editor create both
#      teams from the team typeahead ("+ New team" → the New Team dialog) and
#      record a 10-year stint at
#      one and a 2-year stint at the other. Save.
#   2. /admin/teams — give each of those two brand-new teams a primary colour.
#      A team born from a typeahead has none, and `teams.colors` is what the
#      spine designer reads.
#   3. /print/spine-label — the feature under test.
#
# THE ASYMMETRY IS THE WHOLE POINT, and it is preserved exactly as the old
# fixture had it: 10 years at team A against 2 years at team B, and two colours
# that are nothing like each other. A fixture with one team, or with two equal
# stints, would pass whatever the tenure logic did.
#
# R2 — this cannot go green without the feature working. It asserts the
# defaulted colour is team A's hex specifically, and that team B's hex is NOT on
# screen. A designer that surfaced the chips but defaulted to the wrong team, or
# to no team, fails on the hex — and neither hex can arrive by accident: the
# designer's own no-player fallback is #101820.
#
# R7 / R7a — writes to NO shared row. The player and both teams are named
# "<Prefix><token>" — ONE search token that carries the worker AND the attempt
# inside it (see the ATTEMPT_TOKEN note below) — so eight concurrent runners and
# a retry can never land on the same rows, and nothing pre-existing is read or
# edited. The three prefixes diverge at their third character ("SLP", "SLA",
# "SLB"), so no name here is a prefix of another. The
# per-attempt half is mechanical as well as safe: the typeahead offers
# "+ New team <name>" only while no team of that name exists, so a name left by a
# previous attempt would render "Add <name>" instead.
#
# R5 — every wait is Maestro's 7s default except the cold sign-in (45s) and the
# two in-app reloads (30s, matching the identical openLinks in
# team-management-edit-a-team). No marketplace is touched anywhere in this flow.
#
# Never tap "Print" — it opens the browser print dialog, which blocks every
# subsequent Maestro command and wedges the run. "Discover" on /admin/teams and
# "Re-enrich from Wikidata" on /admin/players are never tapped either: both are
# live outbound calls to third parties from CI.

- launchApp

# Wait for the COUNTER, not the "Player Management" heading — the heading paints
# while the list is still loading, and the filter would swallow keystrokes then.
- extendedWaitUntil:
    visible: ".*of .* players.*"
    timeout: 45000

# ── The minted name's single search token (SET-REGISTRY.md, "A name typed into
# a team picker must be a SINGLE search token") ──────────────────────────────
# `teams.search` / `players.search` are Convex SEARCH indexes: they match on
# TOKENS split at non-alphanumerics, so a hyphenated `Prefix-<attempt>` name
# tokenizes to ["Prefix", "<attempt>"] and every row any flow ever left behind
# under that prefix comes back as a suggestion — the per-attempt suffix buys
# nothing. Nothing deletes a team (the app has no delete-team affordance; the
# picker's "Remove team" only unlinks it from the card), so those rows stand for
# the whole run and are visible to every concurrent worker. The names below are
# therefore ONE alphanumeric token with no separator at all.
#
# The token is ATTEMPT_ID with its hyphens stripped: "w3-a1-23945" is three
# search terms, "w3a123945" is one — and it still carries the worker index, so
# the per-worker distinction the old `${WORKER_INDEX}` prefix gave is folded in
# rather than separated out.
#
# ⚠️ READ `ATTEMPT_ID`, NOT `output.ATTEMPT_ID`. The runner injects it with
# `-e ATTEMPT_ID=…`, which Maestro exposes as the binding `${ATTEMPT_ID}`; it
# never populates `output.ATTEMPT_ID`, so the older idiom always fell through to
# its 4-digit `Date.now()` fallback and two runners collided constantly.
#
# Single-quoted: the expression contains double quotes, and quoting the scalar
# keeps YAML out of it. `Date.now()` is the standalone-run fallback.
- evalScript: '${output.ATTEMPT_TOKEN = String(ATTEMPT_ID || Date.now()).split("-").join("")}'

# ════════════════════════════════════════════════════════════════════════════
# STEP 1 — THE PLAYER, HIS TWO TEAMS AND HIS TWO STINTS
# ════════════════════════════════════════════════════════════════════════════

# Every player row prints its sport beside the name, so with rows on screen the
# word "Baseball" is on the page many times over and the sport picker below
# could not be identified by what it says. Filtering to a name nothing matches
# clears the list, and then "Baseball" belongs to the picker alone. (Same
# precondition, same reasoning, as player-management-add-and-career-history.)
- tapOn: "Filter players"
- inputText: "zzzznotaplayer"
- assertVisible: "No players match that filter."

# The sport is picked on the LIST's picker, with the add form closed: Maestro
# resolves a native picker's choice against the FIRST picker on the page, so a
# choice made while the form's own picker is also mounted lands in the wrong
# one. The form then opens with this sport already chosen.
- tapOn: "All sports"
- tapOn: "Baseball"

- tapOn: "Add player"
# The form's own heading — it gates the two taps below, which would otherwise
# reach for fields that have not mounted yet.
- assertVisible: "Add a player"
- tapOn: "New player name"
- inputText: "SLP${output.ATTEMPT_TOKEN}"
# R8 case 1 -> R5's 7000. MEASURED over 4 green CI runs (n=3): `Element
# bounds` frozen at y=552 through `Scrolling try count: 0`..`5`, completing on
# the give-up path at 8.0 s EVERY run — the page is already at maximum
# scroll, so the target never reaches the centre band (250-375) and the five
# swipes buy nothing. NEO-260 ships the fix: a 208px spacer at the bottom of
# the authenticated shell (`h-[208px]`, src/layouts/binder-layout.tsx), which
# gives the page exactly that much more to scroll. 552 - 208 = 344 (centre
# 360) — and across 2,396 centred DOWN scrolls in 4 green CI runs the lowest
# give-up sat at a centre of 464, with clean accepts throughout this range.
# So it centres on the first swipe (measured 1.38-1.43 s) and the whole step
# costs ~2.1 s. 7000 DEPENDS on that spacer; delete it and this step reds.
- scrollUntilVisible:
    element:
      id: "Create player SLP${output.ATTEMPT_TOKEN}"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Create player SLP${output.ATTEMPT_TOKEN}"

# "Added <name>." is said only for a row that was INSERTED — the screen says
# "That player already exists — opened it." when it merely found one — so this
# is also the proof this attempt's fixture is its own, and the signal that the
# new player's panel and career editor are open.

# GO AND LOOK AT THE STATUS LINE — it is not where "Create player" is.
#
# `PlayerManagement` renders `Added <name>.` in the PAGE-LEVEL status line, the
# FIRST child of the screen container, at document y=293-313. The component says
# so itself above that `<p>`: "Page-level status — the ADD FORM's messages only
# … those report on the LIST, which sits directly below this line, so the top of
# the page is where they belong." The button that produces it, the add form's
# `Create player`, is at document y=809-841 — 516px BELOW the line that
# reports on it. (NEO-254 put it there: Birth year and Other names added 212px
# to the form, which was at y=597-629 in green run 34433476511.)
# MEASURED from run 34437403394, not assumed. `extendedWaitUntil: visible` never
# scrolls, so this assertion can only read what is already on screen. The step
# above leaves the page at scroll 465; the successful create then inserts the
# status line ABOVE the viewport, Chrome's scroll anchoring compensates by
# exactly the height that insert added (+39px), and the page settles at scroll
# 505 — root bounds [0,-505][1009,934] in the failure dump — with
# the line at viewport y=-212..-192, 192px above the top of the viewport,
# where maestro-web prunes it from the hierarchy outright.
# THE CREATE ITSELF SUCCEEDED, and the dump proves it rather than assuming it:
# the new player's own detail panel is open with this run's name in its
# `Player name` box, which only the `onCreated(result.id)` -> `selectPlayer` path
# reached from the success branch can do; the button is not left reading
# "Adding…", and no `role="alert"` refusal is on screen. The assertion was
# reporting where the confirmation renders, not whether the create happened.
# So re-anchor first. "Filter players" is the label on the very control the
# status line is about, 36px below it, and it is on the page whatever the create
# did — so a create that was genuinely REFUSED still fails on the assertion
# below, with the refusal on screen in the screenshot. Centred it settles the
# page at scroll ~20-40, putting the line at viewport y~253-273, clear of the
# 79px sticky binder header that occludes anything above y=79. Positioning only;
# nothing this flow proves changes.
- scrollUntilVisible:
    element:
      text: "Filter players"
    direction: UP
    centerElement: true
    timeout: 7000

- extendedWaitUntil:
    visible: ".*Added SLP${output.ATTEMPT_TOKEN}.*"
    timeout: 7000

# ── THE LONG STINT — 10 years at team A ─────────────────────────────────────
# The career editor sits below the panel's five fields, past the fold on the
# 1024x629 headless viewport, so every reach into it is scrolled and centred.
# R8 case 1 -> R5's 7000. MEASURED over 4 green CI runs (n=6): `Element
# bounds` frozen at y=484 through `Scrolling try count: 0`..`5`, completing on
# the give-up path at 10.0 s EVERY run — the page is already at maximum
# scroll, so the target never reaches the centre band (250-375) and the five
# swipes buy nothing. NEO-260 ships the fix: a 208px spacer at the bottom of
# the authenticated shell (`h-[208px]`, src/layouts/binder-layout.tsx), which
# gives the page exactly that much more to scroll. 484 - 208 = 276 (centre
# 287) — and across 2,396 centred DOWN scrolls in 4 green CI runs the lowest
# give-up sat at a centre of 464, with clean accepts throughout this range.
# So it centres on the first swipe (measured 1.38-1.43 s) and the whole step
# costs ~4.2 s. 7000 DEPENDS on that spacer; delete it and this step reds.
- scrollUntilVisible:
    element:
      id: "Add team"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Add team"
- tapOn:
    id: "Search teams"
- inputText: "SLA${output.ATTEMPT_TOKEN}"

# NOTHING MATCHES THAT NAME — which is the precondition for creating it, and the
# reason the popover is now showing its "+ New team" row. It is also a real
# assertion about the name being this attempt's alone.
- assertVisible: "No matches."

# OPEN THE NEW TEAM DIALOG WITH ENTER, NOT BY TAPPING THE "+ New team" ROW.
#
# NEO-236 — the popover no longer creates anything. Its one create affordance is
# a row reading `+ New team "<typed>"…` (accessible name `New team <typed>`)
# that OPENS a dialog, and the dialog is where Location, Team name and League
# are answered and where the write happens.
#
# That row exists and is correctly labelled — but on this screen it cannot be
# tapped, and that is geometry, not flakiness. The career editor is the LAST
# thing on the player panel, so once the page is scrolled as far as it goes
# "+ Add team" sits at y=510-532 of the 629px headless viewport (measured, CI
# run 33875599981) and cannot be centred: there is no page left to scroll. Its
# popover is `absolute top-full`, so it opens BELOW that — search input at
# y=545-579, first row at y=583. One row fits. Two do not: with no match the
# popover renders "No matches." AND the "+ New team" row under it, which puts
# that row at y>=609, off the bottom of the screen. maestro-web still reports
# its layout bounds, so `tapOn` "succeeds" while the click lands outside the
# picker — which is a pointerdown-outside, so the popover closes and nothing
# opens. That is exactly how this step failed.
#
# Enter on the search input runs the SAME handler the row does: TeamPicker's
# keydown takes the highlighted match when there is one, and otherwise opens the
# New Team dialog. "No matches." above is what proves there is none, so Enter
# here can only mean "open the dialog" — and it needs no coordinates at all.
- pressKey: Enter

# THE DIALOG IS OPEN. It is portalled to `document.body` at `z-[60]` and
# `fixed inset-0 flex items-center justify-center`, so it is centred in the
# viewport and clipped by nothing — none of the geometry above can reach it.
#
# TWO assertions, because they say two different things.
#
# The HEADING is the dialog's `aria-labelledby` target, so it is what a screen
# reader announces on arrival — "New team: <what I typed>" is the dialog being
# correctly LABELLED. (It briefly was not: opening by CLICK used to blank the
# name, because the picker's focus-out handler read a stale "is the dialog open"
# flag and cleared the query behind the portal. Fixed under NEO-236 with a
# synchronous ref; this assertion is what keeps it fixed.)
#
# The NAME BOX and its VALUE is the dialog being correctly SEEDED — maestro-web
# reports an input by its value, so this says the search text really reached the
# field the operator is about to submit.
- assertVisible: "New team: SLA${output.ATTEMPT_TOKEN}"
- assertVisible:
    id: "New team name"
    text: "SLA${output.ATTEMPT_TOKEN}"

# THE WRITE. `Create team <composed full name>` is the SAME accessible name this
# flow has always used — it moved from the popover row onto the dialog's own
# button. Location is left blank and no League is picked, so the composed name
# is exactly what was typed and every later matcher is unchanged.
#
# Tapped by id rather than driven with a second Enter: the dialog's Create and
# Cancel are NeonButtons with an identical class string, and maestro-web's
# pressKey re-finds the focused element by an XPath that falls back to that
# class — so a synthetic Enter aimed at Create can land on Cancel.
- tapOn:
    id: "Create team SLA${output.ATTEMPT_TOKEN}"

# The chip is the proof the creation landed; it is a round-trip, and the chip is
# what the picker paints when it returns.
- extendedWaitUntil:
    visible:
      id: "Remove team SLA${output.ATTEMPT_TOKEN}"
    timeout: 7000

# CLOSE THE TEAM TYPEAHEAD FIRST, by tapping the section heading above it.
# Picking or creating a team deliberately leaves the popover OPEN, and it is
# `absolute left-0 top-full mt-1 z-10 w-64` — 256px hanging directly over the
# year boxes, which wrap underneath the picker in this ~440px panel. A tap at
# their coordinates would land on the popover instead. The close is a TAP
# OUTSIDE, never a key press: maestro-web's pressKey supports Enter and
# Backspace only, and ESCAPE is not a web keycode at all. "Career history" is
# the section's first child, so it sits ABOVE the picker, and the popover only
# ever hangs BELOW it — it is the one thing here the popover can never cover.
- tapOn: "Career history"
- tapOn: ".*Stint from year.*"
- inputText: "2000"
- tapOn: ".*Stint to year.*"
- inputText: "2010"
- tapOn: "Add stint"
# The list renders ABOVE the add row, so adding a stint moves what follows.
# The scroll IS the assertion (R6).
- scrollUntilVisible:
    element:
      text: ".*SLA${output.ATTEMPT_TOKEN} · 2000–2010.*"
    centerElement: true
    timeout: 7000

# ── THE SHORT STINT — 2 years at team B ─────────────────────────────────────
# R8 case 1 -> R5's 7000. MEASURED over 4 green CI runs (n=6): `Element
# bounds` frozen at y=484 through `Scrolling try count: 0`..`5`, completing on
# the give-up path at 10.0 s EVERY run — the page is already at maximum
# scroll, so the target never reaches the centre band (250-375) and the five
# swipes buy nothing. NEO-260 ships the fix: a 208px spacer at the bottom of
# the authenticated shell (`h-[208px]`, src/layouts/binder-layout.tsx), which
# gives the page exactly that much more to scroll. 484 - 208 = 276 (centre
# 287) — and across 2,396 centred DOWN scrolls in 4 green CI runs the lowest
# give-up sat at a centre of 464, with clean accepts throughout this range.
# So it centres on the first swipe (measured 1.38-1.43 s) and the whole step
# costs ~4.2 s. 7000 DEPENDS on that spacer; delete it and this step reds.
# Same step, same screen, same measurement as the first `Add team` above.
- scrollUntilVisible:
    element:
      id: "Add team"
    centerElement: true
    timeout: 7000
- tapOn:
    id: "Add team"
- tapOn:
    id: "Search teams"
- inputText: "SLB${output.ATTEMPT_TOKEN}"

# NOTHING MATCHES THAT NAME — which is the precondition for creating it, and the
# reason the popover is now showing its "+ New team" row. It is also a real
# assertion about the name being this attempt's alone.
- assertVisible: "No matches."

# OPEN THE NEW TEAM DIALOG WITH ENTER, NOT BY TAPPING THE "+ New team" ROW.
#
# NEO-236 — the popover no longer creates anything. Its one create affordance is
# a row reading `+ New team "<typed>"…` (accessible name `New team <typed>`)
# that OPENS a dialog, and the dialog is where Location, Team name and League
# are answered and where the write happens.
#
# That row exists and is correctly labelled — but on this screen it cannot be
# tapped, and that is geometry, not flakiness. The career editor is the LAST
# thing on the player panel, so once the page is scrolled as far as it goes
# "+ Add team" sits at y=510-532 of the 629px headless viewport (measured, CI
# run 33875599981) and cannot be centred: there is no page left to scroll. Its
# popover is `absolute top-full`, so it opens BELOW that — search input at
# y=545-579, first row at y=583. One row fits. Two do not: with no match the
# popover renders "No matches." AND the "+ New team" row under it, which puts
# that row at y>=609, off the bottom of the screen. maestro-web still reports
# its layout bounds, so `tapOn` "succeeds" while the click lands outside the
# picker — which is a pointerdown-outside, so the popover closes and nothing
# opens. That is exactly how this step failed.
#
# Enter on the search input runs the SAME handler the row does: TeamPicker's
# keydown takes the highlighted match when there is one, and otherwise opens the
# New Team dialog. "No matches." above is what proves there is none, so Enter
# here can only mean "open the dialog" — and it needs no coordinates at all.
- pressKey: Enter

# THE DIALOG IS OPEN. It is portalled to `document.body` at `z-[60]` and
# `fixed inset-0 flex items-center justify-center`, so it is centred in the
# viewport and clipped by nothing — none of the geometry above can reach it.
#
# TWO assertions, because they say two different things.
#
# The HEADING is the dialog's `aria-labelledby` target, so it is what a screen
# reader announces on arrival — "New team: <what I typed>" is the dialog being
# correctly LABELLED. (It briefly was not: opening by CLICK used to blank the
# name, because the picker's focus-out handler read a stale "is the dialog open"
# flag and cleared the query behind the portal. Fixed under NEO-236 with a
# synchronous ref; this assertion is what keeps it fixed.)
#
# The NAME BOX and its VALUE is the dialog being correctly SEEDED — maestro-web
# reports an input by its value, so this says the search text really reached the
# field the operator is about to submit.
- assertVisible: "New team: SLB${output.ATTEMPT_TOKEN}"
- assertVisible:
    id: "New team name"
    text: "SLB${output.ATTEMPT_TOKEN}"

# THE WRITE. `Create team <composed full name>` is the SAME accessible name this
# flow has always used — it moved from the popover row onto the dialog's own
# button. Location is left blank and no League is picked, so the composed name
# is exactly what was typed and every later matcher is unchanged.
#
# Tapped by id rather than driven with a second Enter: the dialog's Create and
# Cancel are NeonButtons with an identical class string, and maestro-web's
# pressKey re-finds the focused element by an XPath that falls back to that
# class — so a synthetic Enter aimed at Create can land on Cancel.
- tapOn:
    id: "Create team SLB${output.ATTEMPT_TOKEN}"

- extendedWaitUntil:
    visible:
      id: "Remove team SLB${output.ATTEMPT_TOKEN}"
    timeout: 7000
# Same popover, same dismissal as above — tap the heading, never a keycode.
- tapOn: "Career history"
- tapOn: ".*Stint from year.*"
- inputText: "2012"
- tapOn: ".*Stint to year.*"
- inputText: "2014"
- tapOn: "Add stint"
- scrollUntilVisible:
    element:
      text: ".*SLB${output.ATTEMPT_TOKEN} · 2012–2014.*"
    centerElement: true
    timeout: 7000

# The stints live in the panel's DRAFT until Save — unlike the teams themselves,
# which the typeahead created outright. `players.teamYears` is what the spine
# designer reads, so this save is what makes the fixture exist at all.
# R8 case 1 -> R5's 7000. MEASURED over 4 green CI runs (n=9): `Element
# bounds` frozen at y=552 through `Scrolling try count: 0`..`5`, completing on
# the give-up path at 7.8 s EVERY run — the page is already at maximum
# scroll, so the target never reaches the centre band (250-375) and the five
# swipes buy nothing. NEO-260 ships the fix: a 208px spacer at the bottom of
# the authenticated shell (`h-[208px]`, src/layouts/binder-layout.tsx), which
# gives the page exactly that much more to scroll. 552 - 208 = 344 (centre
# 360) — and across 2,396 centred DOWN scrolls in 4 green CI runs the lowest
# give-up sat at a centre of 464, with clean accepts throughout this range.
# So it centres on the first swipe (measured 1.38-1.43 s) and the whole step
# costs ~2.1 s. 7000 DEPENDS on that spacer; delete it and this step reds.
- scrollUntilVisible:
    element:
      text: "Save"
    centerElement: true
    timeout: 7000
- tapOn: "Save"
- extendedWaitUntil:
    visible: ".*Saved SLP${output.ATTEMPT_TOKEN}.*"
    timeout: 15000

# ════════════════════════════════════════════════════════════════════════════
# STEP 2 — GIVE EACH TEAM ITS COLOUR
#
# A team born from the typeahead carries only a name, and `teams.colors` is what
# the designer reads. Each team is coloured on its own page load: the filter
# takes focus on arrival (NEO-156) and arrives empty, which is what makes the
# second team reachable without fighting the first team's name still sitting in
# the box.
# ════════════════════════════════════════════════════════════════════════════

# ── TEAM A — the long stint, and the colour the designer must default to ────
- openLink: ${APP_URL || "http://localhost:3000"}/admin/teams
- extendedWaitUntil:
    visible: ".*of .* teams.*"
    timeout: 30000
- inputText: "SLA${output.ATTEMPT_TOKEN}"
- extendedWaitUntil:
    visible: "1 of .* teams.*"
    timeout: 15000
# Anchored below the counter: maestro-web reports an input's value as its text,
# so the filter box now answers to this same string, and it sits above the list.
# The counter renders between the two, so "below the counter" is the row alone.
- tapOn:
    text: "SLA${output.ATTEMPT_TOKEN}"
    below:
      text: "1 of .* teams.*"
# The Primary colour field, reached by its PLACEHOLDER: maestro-web reports an
# empty input as its placeholder, and "#01214b" is this field's and appears
# nowhere else in the app. The scroll IS the assertion that the panel opened on
# a team with no colours yet (R6).
#
# R8 case 1 -> R5's 7000. MEASURED over 4 green CI runs (n=6): `Element bounds`
# FROZEN at y=490 through `Scrolling try count: 0`..`5` — no swipe moves it at
# all — completing on the give-up path at 9.8 s EVERY run (2.7 s of travel plus
# the 7.2 s give-up). The panel is in normal document flow (TeamManagement.tsx
# renders it into a plain bordered div), so the freeze is the page already
# sitting at its maximum scroll, not a fixed container.
#
# That was the PRODUCT finding, and NEO-260 is the fix: a 208px spacer at the
# bottom of the authenticated shell (`h-[208px]`, src/layouts/binder-layout.tsx)
# puts the box at 490 - 208 = 282 (centre 303) — across 2,396 centred DOWN
# scrolls in 4 green CI runs the lowest give-up sat at a centre of 464, so this
# is well clear. It then centres on the first swipe (measured 1.38-1.43 s) and
# the whole step costs ~4.2 s. 7000 DEPENDS on that spacer; delete it and this
# step reds. The identical pair for team B below carries the same measurement.
- scrollUntilVisible:
    element:
      text: "#01214b"
    centerElement: true
    timeout: 7000
- tapOn: "#01214b"
- inputText: "#132448"
# Bounds FROZEN at y=552 across tries 0..5, give-up at 7.8 s over 4 green CI
# runs (n=9). 552 - 208 = 344 (centre 360). Same spacer, same dependency.
- scrollUntilVisible:
    element:
      text: "Save"
    centerElement: true
    timeout: 7000
- tapOn: "Save"

# GO AND LOOK AT THE STATUS LINE — it is not where Save is.
#
# `TeamManagement` prints `Saved <full name>` in the PAGE-LEVEL status line, the
# first child of the screen's container at document y≈293; the panel carrying
# Save is the right-hand column far below it. The component says so itself in
# the comment above `saveError`: that line "on a panel that is usually scrolled
# past the fold, is off-screen at the moment Save is pressed" — which is why a
# REFUSED save was moved inline in NEO-236. The success message was left there.
# MEASURED. `extendedWaitUntil: visible` never scrolls, so it can only read what
# is on screen. Green CI 34361627641 passed the sibling `Saved SLB…` in 0.33 s
# with the page at maximum scroll (Save at y=552 = document scroll 307): the
# status line sat at viewport y≈-14 with six of its twenty pixels showing. That
# was the entire margin. NEO-260's 208px spacer (src/layouts/binder-layout.tsx)
# adds exactly that much travel, and run 34429321550 runner 6 failed here with
# root bounds [0,-515][1009,625] — maximum scroll, 208px lower — leaving the
# line ~222px above the viewport, where the driver prunes it outright.
# THE SAVE ITSELF WAS FINE, from the dump rather than by assumption: 16 s after
# the tap the button still reads "Save" and not "Saving…" (`busy` cleared), no
# `role="alert"` refusal is present (the mutation did not throw), and the only
# branch left calls `onStatus({text: "Saved …"})`. The assertion was reporting
# where the confirmation renders, not whether the save happened.
# "Location" is the panel's own first field label and is on screen at maximum
# scroll (y=33 in the failure dump), so this finds it at try 0 and needs one
# swipe to centre it (~y346) — which lifts the page ~313px and brings the status
# line into view. Positioning only; nothing this flow proves changes.
- scrollUntilVisible:
    element:
      text: "Location"
    direction: UP
    centerElement: true
    timeout: 7000

# The mutation confirms by name, so this proves the colour landed on THIS team.
- extendedWaitUntil:
    visible: ".*Saved SLA${output.ATTEMPT_TOKEN}.*"
    timeout: 15000

# ── TEAM B — the short stint, in a colour nothing like team A's ─────────────
- openLink: ${APP_URL || "http://localhost:3000"}/admin/teams
- extendedWaitUntil:
    visible: ".*of .* teams.*"
    timeout: 30000
- inputText: "SLB${output.ATTEMPT_TOKEN}"
- extendedWaitUntil:
    visible: "1 of .* teams.*"
    timeout: 15000
- tapOn:
    text: "SLB${output.ATTEMPT_TOKEN}"
    below:
      text: "1 of .* teams.*"
# Same step, same screen, same measurement and same dependency as team A's
# above: bounds FROZEN at y=490 across tries 0..5, give-up at 9.8 s over 4
# green CI runs; 490 - 208 = 282 (centre 303) once NEO-260's 208px shell spacer
# is counted.
- scrollUntilVisible:
    element:
      text: "#01214b"
    centerElement: true
    timeout: 7000
- tapOn: "#01214b"
- inputText: "#002d72"
# Bounds FROZEN at y=552 across tries 0..5, give-up at 7.8 s. Same dependency.
- scrollUntilVisible:
    element:
      text: "Save"
    centerElement: true
    timeout: 7000
- tapOn: "Save"

# Same page, same status line, same re-anchor as team A above — this one is
# NOT red yet only because the run died on team A before reaching it. Green CI
# 34361627641 measured this very assertion passing on six visible pixels.
- scrollUntilVisible:
    element:
      text: "Location"
    direction: UP
    centerElement: true
    timeout: 7000

- extendedWaitUntil:
    visible: ".*Saved SLB${output.ATTEMPT_TOKEN}.*"
    timeout: 15000

# ════════════════════════════════════════════════════════════════════════════
# STEP 3 — THE FEATURE UNDER TEST
# ════════════════════════════════════════════════════════════════════════════
- openLink: ${APP_URL || "http://localhost:3000"}/print/spine-label
- extendedWaitUntil:
    visible: "Spine Labels"
    timeout: 30000

# ── PICK THE FIXTURE PLAYER ─────────────────────────────────────────────────
# The search runs against the players search index (NEO-147). A STRICT PREFIX
# of the name is typed and the FULL name tapped, deliberately: maestro-web
# reports an input's value as its text, so typing the whole name would make the
# search box itself answer to the same string as the option beneath it, and the
# tap could land on the box rather than the option.
#
# THE PREFIX IS THE BARE "SLP", and it has to be. The name is now ONE search
# token ("SLP<token>", see the ATTEMPT_TOKEN note at the top), and the token is
# ATTEMPT_ID with its hyphens stripped — which the two runners spell
# differently: run-e2e-queue.sh builds "r<n>-a<n>-<random>" and
# run-e2e-smoke.sh builds "w<n>-a<n>-<random>". "SLP" is therefore the longest
# string that is a prefix of this player's name under both, and reaching for
# "SLP" + a worker index would be reaching for text that is not there in CI.
#
# A prefix of a single token still exercises the index the same way the old
# "SLP-<worker>" did: Convex prefix-matches a search query's LAST term, which
# here is the whole query, so "SLP" matches the token "slp<token>". What the
# old prefix bought — narrowing to this worker — is not lost, because it was
# never what proved anything: the two steps below name the player in FULL, so
# a stray SLP row left by an earlier attempt can satisfy neither the wait nor
# the tap. No other flow mints an SLP name.
- scrollUntilVisible:
    element:
      text: "Find a player"
    centerElement: true
    timeout: 7000
- tapOn: "Find a player"
- inputText: "SLP"
- extendedWaitUntil:
    visible: "SLP${output.ATTEMPT_TOKEN}"
    timeout: 15000
- tapOn: "SLP${output.ATTEMPT_TOKEN}"

# The pick fills the label's own text — the name field is independent of the
# search box, so this proves the selection propagated rather than just echoing.
- extendedWaitUntil:
    visible: ".*Defaults to the team SLP${output.ATTEMPT_TOKEN} spent longest with.*"
    timeout: 15000

# ── BOTH CAREER TEAMS ARE OFFERED ───────────────────────────────────────────
# Chips, not the free-form team search: a matched player's own teams ARE the
# answer, so the general search is deliberately not rendered here. Asserting
# both proves teamYears was read in full rather than only its first entry.
# Scrolled into view first: `visible` is false for an element that exists but
# sits below the 1024x629 headless fold, and the chips sit under two fields.
# The scroll is the assertion for the first chip (R6); the second is asserted
# beside it.
# R5: 7000, the bar. MEASURED in CI (green run, this flow's log): found on
# scroll try 0, y=326, 0.001 s — the chips are already in the band when the
# picker resolves. Note that DROPPING the value would not put this on the bar:
# `scrollUntilVisible` defaults to 20 s, not 7 s
# (ScrollUntilVisibleCommand.DEFAULT_TIMEOUT_IN_MILLIS = "20000" in the pinned
# maestro-orchestra-models.jar), so the bar has to be written out.
- scrollUntilVisible:
    element:
      text: ".*SLA${output.ATTEMPT_TOKEN}.*"
    centerElement: true
    timeout: 7000
- assertVisible: ".*SLB${output.ATTEMPT_TOKEN}.*"

# The free-form team picker must NOT be present — the two controls are mutually
# exclusive, and showing both would be two controls competing to set one value.
- assertNotVisible: "Find a team"

# ── THE DEFAULT IS THE LONGEST STINT ────────────────────────────────────────
# This is the assertion the whole flow exists for: 10 years at team A beat 2
# years at team B, so the label comes up in team A's #132448 and NOT in team B's
# #002d72.
- scrollUntilVisible:
    element:
      text: "Background"
    centerElement: true
    timeout: 7000
- assertVisible: "#132448"
- assertNotVisible: "#002d72"

# ── OVERRIDING TO THE OTHER TEAM WORKS ──────────────────────────────────────
# The default is a default, not a decision — NEO-147 requires the user can pick
# any team in teamYears. Tapping the other chip swaps the colours.
- tapOn: ".*SLB${output.ATTEMPT_TOKEN}.*"
- extendedWaitUntil:
    visible: "#002d72"
    timeout: 10000

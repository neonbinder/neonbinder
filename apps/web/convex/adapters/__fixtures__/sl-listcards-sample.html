  HAND-AUTHORED sample of the two `listcards.tpl` cells this parser reads.
  It is NOT a page capture, and it must never become one.

  Why not a capture: reaching `listcards.tpl` at all requires an authenticated
  SportLots seller session, so a real response carries account navigation, the
  seller's own bin and pricing context, hidden form inputs including `selset`,
  and session-bearing URLs. This repo is PUBLIC. Committing such a page would
  publish operational detail about a live account in exchange for realism the
  parser cannot use — it only ever sees the text between two <td> tags.

  So the shape is reproduced instead, from row text already recorded in this
  repo's own SportLots tests: set 189991 (2021 Topps Heritage) in
  convex/adapters/sportlots.test.ts's parseSlVariationMarker block, and the
  base/variation pair verified live against set 328996 in
  convex/sportlots.test.ts. Those are public checklist strings — card numbers
  and player names — and nothing else. The house convention is the same
  (__fixtures__/bsc-heritage-2021-cards.json keeps the derived shape, not the
  828KB response it came from); a bare row table is the ceiling here.

  Only <table>, <tr> and <td> appear below, and a test asserts that: no nav,
  no <form>, no <input>, no <a>, no <script>, no session markup. Adding any of
  those fails `the fixture is a minimal row table, not a page capture`.

  The rows exercise the parser end to end: single names, a two-subject `|`
  row, a period-initial, literal UTF-8 accents (what `response.text()` hands
  the adapter), a trailing team abbreviation, a generational suffix, an
  HTML-entity apostrophe, a variation row (tinted number cell =
  "smallcolorleft"), and two rows that must yield NO players at all.

  Note `&eacute;` is deliberately NOT in the decoder's bounded entity set — an
  unknown entity stays literal text and that row simply yields no players.
-->

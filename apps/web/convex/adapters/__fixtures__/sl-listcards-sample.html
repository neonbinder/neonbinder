<!--
  A recorded SportLots `listcards.tpl` response, reduced to the rows this
  parser reads.

  Provenance: the row shapes are the ones already recorded in this repo's
  SportLots tests — set 189991 (2021 Topps Heritage) read as a logged-in
  seller on 2026-08-27 (see convex/adapters/sportlots.test.ts's
  parseSlVariationMarker block) plus the base/variation pair verified live
  against set 328996 (convex/sportlots.test.ts). This file is NOT a fresh
  live pull: NEO-251 deliberately did not re-fetch SportLots.

  What was removed, and why: everything outside the two <td> cells the
  `cardRegex` matches. That means the whole page chrome — the login banner,
  the seller's own name and dealer bin, the pricing/quantity form inputs, the
  `selset` hidden field, every `Cookie`/session marker and every URL carrying
  a session id. Nothing here identifies an account, and nothing here is a
  credential. The card rows themselves are public checklist data.

  The mix is chosen to exercise the parser end to end: single names, a
  two-subject `|` row, a name with a period-initial, an accented name, a
  trailing team abbreviation, a generational suffix, an HTML-entity
  apostrophe, a variation row (tinted number cell = "smallcolorleft"), and two
  rows that must yield NO players at all (a checklist line and a stadium
  card).

  Note the accented row carries LITERAL UTF-8 accents, which is what
  `response.text()` hands the adapter. `&eacute;` is deliberately NOT in the
  decoder's bounded entity set — an unknown entity is left as literal text and
  the row simply yields no players.
-->

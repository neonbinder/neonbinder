<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- NEO-356: resolve light/dark before the first paint, so a light page
         never flashes dark (or the reverse). Mirrors resolveMode() in
         src/theme/theme-mode.ts (THEME_STORAGE_KEY "nb-theme"); keep the two
         in step, src/theme/theme-mode.test.tsx checks the key and the query.
         Runs before any stylesheet; ThemeProvider takes over once React
         mounts. Without storage (private mode) it follows the system.
         CSP: an inline script. A future Content-Security-Policy must allow
         it by hash, script-src 'sha256-uz1N3ItMqOR2EKeDdm3IhPXA2JT72B4MHggDhG28MCg='
         (never 'unsafe-inline'). Any edit to the script, whitespace
         included, changes the hash: theme-mode.test.tsx recomputes it and
         fails until this line is updated. -->
    <script>
      (function () {
        var pref = null;
        try { pref = window.localStorage.getItem("nb-theme"); } catch (e) {}
        var mode = pref === "light" || pref === "dark" ? pref
          : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", mode);
      })();
    </script>
    <!-- Exposes the (already-public) per-deployment Convex URL so CI can resolve
         the preview's .convex.site HTTP endpoints for the E2E work-queue (NEO-49).
         Vite substitutes %VITE_CONVEX_URL% at build time. -->
    <meta name="x-convex-url" content="%VITE_CONVEX_URL%" />
    <title>Neon Binder</title>
    <link rel="icon" href="/favicon.ico" />
    <!-- Fonts (ui-audit 2026-10). Lexend is the app face, in the four weights
         the UI uses (font-normal/medium/semibold/bold), and Geist Mono the
         mono face; one stylesheet request for both, opened early here rather
         than from an @import inside the app CSS, which the browser could not
         discover until the app's own stylesheet had downloaded. Geist (sans)
         used to load here in four weights and nothing set it. The Neon
         wordmark face sits in every header, so it is preloaded. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/Neon.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      :root {
        --font-geist-mono: "Geist Mono", monospace;
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

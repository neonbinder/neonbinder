[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-v --strict-markers"
markers = [
    "integration: tests that make real external API calls (gated by RUN_INTEGRATION_TESTS=1)",
]

[tool.coverage.run]
source = ["app"]
# Line coverage only. Branch tracing forces coverage's slow C tracer; line-only
# can use the low-overhead sys.monitoring core (CI sets COVERAGE_CORE=sysmon),
# which cost ~1.0x on the numpy/Pillow-heavy cropper tests where the tracer
# cost ~2.4x (NEO-484). The 80% floor below still applies.
branch = false

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# A 3540x1916 bed pass. Despite the name, its pixels hold ONE card: the other
# shapes on the bed are faint lid glare, not cards (checked NEO-320 with a
# contrast stretch). The cascade must return exactly one card rather than the
# sheet, which is the contract downstream pairing depends on. Since NEO-320
# the FAST path's quad crop settles it. Measured: quad -> 990x1387, aspect
# 0.714, 20.2% of source, ~0.5s (was tiered -> 1000x1400, 20.6%, ~41s).
# A frame with two visible cards declines `multi_card` in the quad stage and
# still reaches tiered; that case is covered by the unit suite.

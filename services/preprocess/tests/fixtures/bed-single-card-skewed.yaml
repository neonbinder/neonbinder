# The crop-AND-deskew case: one white-bordered card sitting rotated a few
# degrees on the black scanner bed, 3540x1926. The card must come out square
# and whole. Since NEO-320 the FAST path's quad crop settles it (deskewed by the
# perspective warp). Measured: quad -> 999x1399, aspect 0.714, 20.5% of source,
# ~0.3s (was tiered -> 1006x1408, 20.8%, ~46s). The band is wide from the
# BiRefNet days; it is still narrow enough that a border shave (which lands
# near 0.18) or a runaway crop would fall outside it.

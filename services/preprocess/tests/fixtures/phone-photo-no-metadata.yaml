# The negative case for NEO-191. A 3072x4080 Pixel shot stamped 72dpi, which
# would measure 42x57in if the resolution were believed — so scan_metadata must
# decline on provenance, and the pixel cascade handles it. Since NEO-320 the
# FAST path's quad crop settles it (one card on a dark mat, every content
# check satisfied) instead of the ~44s tiered/BiRefNet pass.
# A `source: scan_metadata` here would mean the dpi floor had been breached.
# Measured: quad -> 2227x3118, aspect 0.714, 55.4% of source, ~0.4s of quad
# work (was tiered -> 2248x3147, 56.4%, ~44s).

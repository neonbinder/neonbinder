# 2014 Panini Rookies & Stars football (NEO-327): a photo-back set. Its backs
# carry a large player photo and the name beside the stats, which the old
# classify prompt read as a front.
orient:
  rotation_degrees: 0
classify:
  side: front
  player:
    contains: Jeffery
  team:
    contains: Bears
  card_number:
    is_null: true
